name: Update Taiwan Stock Master Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stock master database
        shell: bash
        run: |
          python <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          OUT = "stock-data/stocks.json"

          TWSE_BASE = "https://openapi.twse.com.tw/v1/opendata/"
          TPEx_BASE = "https://www.tpex.org.tw/openapi/v1/"

          INDUSTRY_MAP = {
              "02": "食品工業",
              "03": "塑膠工業",
              "04": "紡織纖維",
              "05": "電機機械",
              "06": "電器電纜",
              "08": "玻璃陶瓷",
              "10": "鋼鐵工業",
              "11": "橡膠工業",
              "14": "建材營造",
              "15": "航運業",
              "16": "觀光餐旅",
              "17": "金融業",
              "20": "其他",
              "21": "化學工業",
              "22": "生技醫療",
              "23": "油電燃氣業",
              "24": "半導體業",
              "25": "電腦及週邊設備業",
              "26": "光電業",
              "27": "通信網路業",
              "28": "電子零組件業",
              "29": "電子通路業",
              "30": "資訊服務業",
              "31": "其他電子業",
              "32": "文化創意業",
              "33": "農業科技",
              "35": "綠能環保",
              "36": "數位雲端",
              "37": "運動休閒",
              "38": "居家生活",
              "80": "管理股票"
          }

          def clean(v):
              if v is None:
                  return ""
              return str(v).replace("\ufeff", "").strip()

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json,text/plain,*/*"
                  }
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  raw = r.read()
                  text = raw.decode("utf-8-sig")
                  return json.loads(text)

          def pick(row, keys):
              for key in keys:
                  if key in row:
                      value = clean(row[key])
                      if value:
                          return value
              return ""

          def make_keywords(code, name, full_name, industry, typ):
              values = []

              for x in [
                  code,
                  name,
                  full_name,
                  industry,
                  typ
              ]:
                  x = clean(x)
                  if x and x not in values:
                      values.append(x)

              # 常見關鍵字關聯
              text = " ".join(values)

              rules = [
                  (["台積", "台積電", "晶圓"], ["台積電", "晶圓", "半導體"]),
                  (["台化", "台灣化學纖維"], ["台化", "台灣化學纖維", "塑膠", "化纖"]),
                  (["台塑"], ["台塑", "塑膠", "台塑集團"]),
                  (["南亞"], ["南亞", "塑膠", "電子材料", "台塑集團"]),
                  (["台塑"], ["台塑", "塑膠", "台塑集團"]),
                  (["台灣50"], ["台灣50", "0050"]),
                  (["0050"], ["0050", "台灣50"]),
                  (["元大台灣50"], ["0050", "台灣50", "元大台灣50"]),
                  (["半導體"], ["半導體", "晶片", "IC", "晶圓"]),
                  (["AI"], ["AI", "人工智慧"]),
                  (["電子零組件"], ["電子", "零組件"]),
                  (["金融"], ["金融", "銀行", "金控"]),
                  (["航運"], ["航運", "貨櫃", "海運"]),
                  (["綠能"], ["綠能", "能源", "太陽能"]),
                  (["電動車"], ["電動車", "EV"]),
              ]

              for needles, adds in rules:
                  if any(n in text for n in needles):
                      for a in adds:
                          if a not in values:
                              values.append(a)

              return values[:30]

          def normalize_twse(row, typ):
              code = pick(row, [
                  "公司代號",
                  "股票代號",
                  "證券代號",
                  "Code"
              ])

              short_name = pick(row, [
                  "公司簡稱",
                  "股票名稱",
                  "證券名稱",
                  "Name"
              ])

              full_name = pick(row, [
                  "公司名稱",
                  "名稱"
              ])

              industry = pick(row, [
                  "產業別",
                  "產業"
              ])

              if not code or not short_name:
                  return None

              # 排除明顯非證券代號
              if not re.match(r"^[0-9A-Za-z]{4,6}$", code):
                  return None

              if typ == "ETF":
                  final_type = "ETF"
                  final_industry = "ETF"
              else:
                  final_type = "股票"
                  final_industry = industry or "其他"

              return {
                  "code": code,
                  "name": short_name,
                  "fullName": full_name,
                  "market": "上市",
                  "type": final_type,
                  "industry": final_industry,
                  "keywords": make_keywords(
                      code,
                      short_name,
                      full_name,
                      final_industry,
                      final_type
                  )
              }

          def normalize_tpex(row, market, default_type):
              code = pick(row, [
                  "SecuritiesCompanyCode",
                  "公司代號",
                  "股票代號",
                  "證券代號"
              ])

              short_name = pick(row, [
                  "CompanyAbbreviation",
                  "公司簡稱",
                  "股票簡稱",
                  "證券名稱"
              ])

              full_name = pick(row, [
                  "CompanyName",
                  "公司名稱"
              ])

              industry_code = pick(row, [
                  "SecuritiesIndustryCode",
                  "產業別"
              ])

              if not code or not short_name:
                  return None

              if not re.match(r"^[0-9A-Za-z]{4,6}$", code):
                  return None

              industry = INDUSTRY_MAP.get(
                  industry_code,
                  industry_code or "其他"
              )

              return {
                  "code": code,
                  "name": short_name,
                  "fullName": full_name,
                  "market": market,
                  "type": default_type,
                  "industry": industry,
                  "keywords": make_keywords(
                      code,
                      short_name,
                      full_name,
                      industry,
                      default_type
                  )
              }

          all_rows = []

          # --------------------------------------------------
          # 1. TWSE 上市股票
          # --------------------------------------------------
          try:
              url = TWSE_BASE + "t187ap03_L?TYPEK=" + urllib.parse.quote("正股")
              data = get_json(url)

              for row in data:
                  item = normalize_twse(row, "股票")
                  if item:
                      all_rows.append(item)

              print("TWSE stocks:", len(all_rows))

          except Exception as e:
              print("TWSE stocks error:", e)

          # --------------------------------------------------
          # 2. TWSE ETF
          # --------------------------------------------------
          before = len(all_rows)

          try:
              url = TWSE_BASE + "t187ap03_L?TYPEK=" + urllib.parse.quote("ETF")
              data = get_json(url)

              for row in data:
                  item = normalize_twse(row, "ETF")
                  if item:
                      all_rows.append(item)

              print("TWSE ETF:", len(all_rows) - before)

          except Exception as e:
              print("TWSE ETF error:", e)

          # --------------------------------------------------
          # 3. TPEx 上櫃股票
          # --------------------------------------------------
          before = len(all_rows)

          try:
              url = TPEx_BASE + "mopsfin_t187ap03_O"
              data = get_json(url)

              if isinstance(data, dict):
                  data = data.get("data", data.get("result", []))

              for row in data:
                  item = normalize_tpex(
                      row,
                      "上櫃",
                      "股票"
                  )
                  if item:
                      all_rows.append(item)

              print("TPEx stocks:", len(all_rows) - before)

          except Exception as e:
              print("TPEx stocks error:", e)

          # --------------------------------------------------
          # 4. TPEx 興櫃股票
          # --------------------------------------------------
          before = len(all_rows)

          try:
              url = TPEx_BASE + "mopsfin_t187ap03_R"
              data = get_json(url)

              if isinstance(data, dict):
                  data = data.get("data", data.get("result", []))

              for row in data:
                  item = normalize_tpex(
                      row,
                      "興櫃",
                      "興櫃股票"
                  )
                  if item:
                      all_rows.append(item)

              print("TPEx emerging:", len(all_rows) - before)

          except Exception as e:
              print("TPEx emerging error:", e)

          # --------------------------------------------------
          # 去除重複
          # --------------------------------------------------
          unique = {}

          for item in all_rows:
              key = (
                  item["market"],
                  item["code"],
                  item["type"]
              )

              if key not in unique:
                  unique[key] = item
              else:
                  # 合併 keywords
                  old = unique[key]
                  for k in item.get("keywords", []):
                      if k not in old["keywords"]:
                          old["keywords"].append(k)

          stocks = list(unique.values())

          # 排序
          market_order = {
              "上市": 1,
              "上櫃": 2,
              "興櫃": 3
          }

          type_order = {
              "股票": 1,
              "ETF": 2,
              "興櫃股票": 3
          }

          stocks.sort(
              key=lambda x: (
                  market_order.get(x["market"], 9),
                  type_order.get(x["type"], 9),
                  x["code"]
              )
          )

          # --------------------------------------------------
          # 最終 JSON
          # --------------------------------------------------
          now = datetime.now(
              timezone.utc
          ).isoformat()

          output = {
              "version": 2,
              "updatedAt": now,
              "source": [
                  "TWSE OpenAPI",
                  "TPEx OpenAPI"
              ],
              "count": len(stocks),
              "stocks": stocks
          }

          import os
          os.makedirs(
              os.path.dirname(OUT),
              exist_ok=True
          )

          with open(
              OUT,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("完成")
          print("總筆數:", len(stocks))
          print("輸出:", OUT)
          print("================================")

          if len(stocks) < 1000:
              raise RuntimeError(
                  f"資料筆數異常，目前只有 {len(stocks)} 筆，停止寫入確認。"
              )

          PY

      - name: Check changes
        run: |
          git status --short
          python -m json.tool stock-data/stocks.json > /dev/null
          echo "JSON OK"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock-data/stocks.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto update Taiwan stock master data"
            git push
          fi
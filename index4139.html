<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>台股股票搜尋器｜行情分析｜法人籌碼｜突破分析 V11 整合版</title>

<style>
:root{
  --bg:#0b0d11;
  --panel:#151922;
  --panel2:#1b202b;
  --line:#2a3040;
  --text:#f4f6fa;
  --muted:#9da6b8;
  --green:#37d67a;
  --red:#ff5d6c;
  --yellow:#ffd166;
  --blue:#5ca8ff;
  --purple:#ad8cff;
  --orange:#ff9f43;
  --shadow:0 10px 30px rgba(0,0,0,.28);
  --radius:18px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:90px;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11,13,17,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  width:min(1100px,calc(100% - 24px));
  margin:auto;
  padding:14px 0;
}

.title{
  font-size:20px;
  font-weight:900;
}

.subtitle{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.search-row{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.search-input{
  flex:1;
  min-width:0;
  height:46px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#10141b;
  color:var(--text);
  padding:0 14px;
  outline:none;
}

.search-input:focus{
  border-color:var(--blue);
}

.btn{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  padding:0 15px;
  min-height:42px;
  font-weight:800;
}

.btn:hover{
  filter:brightness(1.12);
}

.btn-primary{
  background:#2364c7;
  border-color:#3179e7;
}

.btn-green{
  background:#174f35;
  border-color:#247a4e;
}

.btn-red{
  background:#5b2028;
  border-color:#8b303c;
}

.btn-yellow{
  background:#584718;
  border-color:#806821;
}

.quick{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:10px 0 2px;
  scrollbar-width:none;
}

.quick::-webkit-scrollbar{
  display:none;
}

.quick button{
  flex:none;
  border:1px solid var(--line);
  background:#151a23;
  color:#dce2ed;
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  font-weight:800;
}

.main{
  width:min(1100px,calc(100% - 24px));
  margin:16px auto;
}

.panel{
  background:linear-gradient(180deg,#171c25,#12161e);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:14px;
}

.panel-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  font-size:16px;
  font-weight:900;
}

.panel-title small{
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  color:var(--muted);
  font-size:11px;
}

.field input,
.field select{
  width:100%;
  height:42px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#10141b;
  color:var(--text);
  padding:0 11px;
  outline:none;
}

.filter-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.status{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.count{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 9px;
  background:#202632;
  border-radius:999px;
  color:#dce4f1;
  font-size:11px;
  font-weight:800;
}

.result-list{
  display:grid;
  gap:10px;
}

.stock-card{
  border:1px solid var(--line);
  background:#121720;
  border-radius:15px;
  padding:13px;
}

.stock-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.stock-name{
  font-size:16px;
  font-weight:900;
}

.stock-code{
  color:var(--blue);
  font-size:13px;
  font-weight:900;
}

.stock-meta{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.stock-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.stock-actions .btn{
  flex:1;
  min-height:38px;
  padding:0 8px;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:28px 10px;
  color:var(--muted);
}

.hidden{
  display:none!important;
}

.quote-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.metric{
  background:#10141b;
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px;
}

.metric-label{
  color:var(--muted);
  font-size:10px;
}

.metric-value{
  margin-top:4px;
  font-size:17px;
  font-weight:900;
}

.metric-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.up{color:var(--red)}
.down{color:var(--green)}
.neutral{color:var(--yellow)}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:900;
}

.badge-green{
  color:#71f2a3;
  background:#123c29;
}

.badge-red{
  color:#ff8892;
  background:#4b1d24;
}

.badge-yellow{
  color:#ffe08a;
  background:#4a3b17;
}

.badge-blue{
  color:#84bcff;
  background:#163458;
}

.section-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.analysis-box{
  border:1px solid var(--line);
  border-radius:15px;
  background:#11161e;
  padding:13px;
}

.analysis-box h3{
  margin:0 0 10px;
  font-size:14px;
}

.analysis-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #252b37;
  font-size:12px;
}

.analysis-row:last-child{
  border-bottom:0;
}

.analysis-row span:first-child{
  color:var(--muted);
}

.big-signal{
  text-align:center;
  padding:16px;
  border-radius:15px;
  border:1px solid var(--line);
  background:#10151d;
}

.big-signal .signal{
  font-size:25px;
  font-weight:1000;
}

.big-signal .score{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.pressure{
  border-radius:15px;
  padding:15px;
  border:1px solid var(--line);
}

.pressureStrong{
  background:#4a1c25;
  border-color:#87313e;
}

.pressureWarn{
  background:#493a16;
  border-color:#796322;
}

.pressureDanger{
  background:#38181d;
  border-color:#702630;
}

.pressureGood{
  background:#123d29;
  border-color:#26764b;
}

.pressureTitle{
  font-size:18px;
  font-weight:1000;
}

.pressureDesc{
  margin-top:5px;
  color:#c7cedb;
  font-size:12px;
  line-height:1.6;
}

.level-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.level{
  background:#10141b;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.level-name{
  color:var(--muted);
  font-size:10px;
}

.level-price{
  margin-top:4px;
  font-size:16px;
  font-weight:900;
}

.law-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.law{
  background:#10141b;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.law-title{
  color:var(--muted);
  font-size:10px;
}

.law-value{
  margin-top:4px;
  font-size:15px;
  font-weight:900;
}

.chart-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:520px;
}

th,td{
  border-bottom:1px solid #252b37;
  padding:8px 6px;
  text-align:right;
  font-size:11px;
}

th{
  color:var(--muted);
  font-weight:800;
}

td:first-child,
th:first-child{
  text-align:left;
}

.history{
  display:grid;
  gap:6px;
  max-height:300px;
  overflow:auto;
}

.history-item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:8px 10px;
  background:#10141b;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:11px;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:200;
  background:rgba(14,17,23,.96);
  border-top:1px solid var(--line);
  backdrop-filter:blur(15px);
  padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
}

.bottom-inner{
  width:min(700px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.nav-btn{
  border:0;
  background:transparent;
  color:#8791a4;
  padding:6px 2px;
  border-radius:11px;
  font-size:10px;
  font-weight:800;
}

.nav-btn.active{
  color:white;
  background:#222935;
}

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.modal-card{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  background:#151a23;
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.modal-head{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  background:#151a23;
  border-bottom:1px solid var(--line);
}

.modal-title{
  font-weight:1000;
}

.modal-body{
  padding:16px;
}

.close{
  width:36px;
  height:36px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#202632;
  color:white;
  font-size:18px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  z-index:800;
  background:#252c38;
  color:white;
  border:1px solid #394355;
  border-radius:12px;
  padding:10px 14px;
  font-size:12px;
  font-weight:800;
  box-shadow:var(--shadow);
}

.loading{
  padding:25px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:720px){
  .quote-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .law-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .section-grid{
    grid-template-columns:1fr;
  }

  .level-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .title{
    font-size:18px;
  }
}

@media(max-width:430px){
  .filters{
    grid-template-columns:1fr;
  }

  .quote-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .search-row .btn{
    padding:0 12px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="title">📊 台股股票搜尋器＋行情分析＋法人籌碼 V11</div>
    <div class="subtitle">
      搜尋 → 行情 → 均線 → 法人 → 賣壓 → 突破 → 支撐壓力
    </div>

    <div class="search-row">
      <input
        id="searchInput"
        class="search-input"
        autocomplete="off"
        placeholder="輸入股票代號／名稱，例如 1326、台化、2330、0050"
      >
      <button id="searchBtn" class="btn btn-primary">查詢</button>
    </div>

    <div class="quick">
      <button data-q="1326">1326 台化</button>
      <button data-q="2330">2330 台積電</button>
      <button data-q="2317">2317 鴻海</button>
      <button data-q="1301">1301 台塑</button>
      <button data-q="0050">0050</button>
      <button data-q="00919">00919</button>
      <button data-q="2002">2002 中鋼</button>
      <button data-q="2308">2308 台達電</button>
    </div>

  </div>
</header>

<main class="main">

  <section id="homePanel" class="panel">
    <div class="panel-title">
      <span>🔥 盤整後突破推薦</span>
      <button class="btn btn-yellow" id="scanBtn">掃描突破</button>
    </div>

    <div class="status" id="scanStatus">
      正在準備掃描清單……
    </div>

    <div id="scanResults" class="result-list" style="margin-top:12px">
      <div class="empty">按「掃描突破」取得目前候選股</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">
      <span>🔎 股票搜尋</span>
      <span class="count" id="resultCount">0 筆</span>
    </div>

    <div class="filters">

      <div class="field">
        <label>市場</label>
        <select id="marketFilter">
          <option value="">全部</option>
          <option value="上市">上市</option>
          <option value="上櫃">上櫃</option>
          <option value="興櫃">興櫃</option>
        </select>
      </div>

      <div class="field">
        <label>類型</label>
        <select id="typeFilter">
          <option value="">全部</option>
          <option value="股票">股票</option>
          <option value="ETF">ETF</option>
          <option value="興櫃股票">興櫃股票</option>
        </select>
      </div>

    </div>

    <div class="filter-actions">
      <button class="btn" id="recentBtn">🕘 最近搜尋</button>
      <button class="btn" id="favBtn">⭐ 我的自選</button>
      <button class="btn" id="allBtn">全部股票</button>
    </div>

    <div id="searchStatus" class="status" style="margin-top:10px">
      可搜尋股票代號、名稱、產業與關鍵字。
    </div>

    <div id="searchResults" class="result-list" style="margin-top:12px">
      <div class="empty">輸入股票代號或名稱開始搜尋</div>
    </div>
  </section>

  <section id="analysisPanel" class="panel hidden">

    <div class="panel-title">
      <span id="analysisTitle">📈 行情分析</span>
      <button class="btn" id="refreshBtn">↻ 更新</button>
    </div>

    <div id="analysisContent">
      <div class="loading">等待股票資料……</div>
    </div>

  </section>

  <section id="favoritesPanel" class="panel hidden">

    <div class="panel-title">
      <span>⭐ 我的自選股</span>
      <button class="btn btn-red" id="clearFavBtn">清除全部</button>
    </div>

    <div id="favoriteResults" class="result-list">
      <div class="empty">尚未加入自選股</div>
    </div>

  </section>

  <section id="chipsPanel" class="panel hidden">

    <div class="panel-title">
      <span>💰 法人籌碼</span>
    </div>

    <div class="status">
      搜尋股票後，可查看外資、投信、自營商及三大法人合計。
    </div>

    <div id="chipContent" style="margin-top:12px">
      <div class="empty">請先搜尋股票</div>
    </div>

  </section>

  <section id="industryPanel" class="panel hidden">

    <div class="panel-title">
      <span>🏭 產業搜尋</span>
    </div>

    <div class="quick">
      <button data-q="半導體">半導體</button>
      <button data-q="電子">電子</button>
      <button data-q="金融">金融</button>
      <button data-q="塑膠">塑膠</button>
      <button data-q="航運">航運</button>
      <button data-q="AI">AI</button>
      <button data-q="高股息">高股息</button>
    </div>

    <div id="industryResults" class="result-list" style="margin-top:12px">
      <div class="empty">選擇產業關鍵字</div>
    </div>

  </section>

  <section id="settingsPanel" class="panel hidden">

    <div class="panel-title">
      <span>⚙️ 設定</span>
    </div>

    <div class="analysis-box">

      <div class="analysis-row">
        <span>自動更新</span>
        <button class="btn" id="autoBtn">目前：開啟</button>
      </div>

      <div class="analysis-row">
        <span>更新頻率</span>
        <strong>30 秒</strong>
      </div>

      <div class="analysis-row">
        <span>歷史資料</span>
        <strong>FinMind</strong>
      </div>

      <div class="analysis-row">
        <span>盤中行情</span>
        <strong>TWSE MIS</strong>
      </div>

      <div class="analysis-row">
        <span>賣壓分析</span>
        <strong>模型估算</strong>
      </div>

    </div>

  </section>

</main>

<nav class="bottom-nav">
  <div class="bottom-inner">
    <button class="nav-btn active" data-panel="homePanel">🏠<br>首頁</button>
    <button class="nav-btn" data-panel="favoritesPanel">⭐<br>自選股</button>
    <button class="nav-btn" data-panel="chipsPanel">💰<br>籌碼</button>
    <button class="nav-btn" data-panel="industryPanel">🏭<br>產業</button>
    <button class="nav-btn" data-panel="settingsPanel">⚙️<br>設定</button>
  </div>
</nav>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div id="modalTitle" class="modal-title">股票詳細資料</div>
      <button class="close" id="modalClose">×</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   台股股票搜尋器＋行情分析＋法人籌碼 V11 整合版
   13：搜尋／篩選／自選／最近搜尋／詳細資料
   14：行情／均線／趨勢／支撐壓力
   19：法人／籌碼／估值
   11：突破／賣壓消化／綜合判斷
========================================================= */

const FINMIND =
  "https://api.finmindtrade.com/api/v4/data";

const MIS =
  "https://mis.twse.com.tw/stock/api/getStockInfo.jsp";

const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u)
];

const STORAGE_FAV = "stock-search-v11-favorites";
const STORAGE_RECENT = "stock-search-v11-recent";

let stockInfoCache = [];
let stockInfoLoaded = false;

let currentStock = null;
let currentData = null;
let refreshTimer = null;
let autoRefresh = true;

let searchSeq = 0;

const KNOWN = [

  {code:"1301",name:"台塑",fullName:"台灣塑膠工業股份有限公司",market:"上市",type:"股票",industry:"塑膠",keywords:"塑化 台塑"},
  {code:"1303",name:"南亞",fullName:"南亞塑膠工業股份有限公司",market:"上市",type:"股票",industry:"塑膠",keywords:"塑化 南亞"},
  {code:"1326",name:"台化",fullName:"台灣化學纖維股份有限公司",market:"上市",type:"股票",industry:"塑膠",keywords:"塑化 台化"},

/* ---------- 基礎 ---------- */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function number(v,d=2){
  const n=Number(v);
  if(!Number.isFinite(n)) return "--";
  return n.toLocaleString("zh-TW",{
    minimumFractionDigits:d,
    maximumFractionDigits:d
  });
}

function integer(v){
  const n=Number(v);
  if(!Number.isFinite(n)) return "--";
  return n.toLocaleString("zh-TW");
}

function pct(v,d=2){
  const n=Number(v);
  if(!Number.isFinite(n)) return "--";
  return n.toFixed(d)+"%";
}

function price(v){
  const n=Number(v);
  if(!Number.isFinite(n)) return "--";
  return n>=100 ? n.toFixed(1) : n.toFixed(2);
}

function today(){
  const d=new Date();

/* ---------- API ---------- */

async function fetchJSON(url,timeout=12000){
  const controller=new AbortController();

  const timer=setTimeout(
    ()=>controller.abort(),
    timeout
  );

  try{
    const r=await fetch(url,{
      signal:controller.signal,
      cache:"no-store"
    });

    if(!r.ok){
      throw new Error("HTTP "+r.status);
    }

    return await r.json();

  }finally{
    clearTimeout(timer);
  }
}

async function fetchWithProxy(url){
  try{
    return await fetchJSON(url);
  }catch(e){}

  for(const proxy of PROXIES){
    try{
      return await fetchJSON(proxy(url),15000);
    }catch(e){}
  }

  throw new Error("資料連線失敗");
}

async function finmind(dataset,params={}){
  const qs=new URLSearchParams({
    dataset,
    ...params
  });

  const url=FINMIND+"?"+qs.toString();

  const json=await fetchWithProxy(url);

  if(json && Array.isArray(json.data)){
    return json.data;
  }

  return [];
}

async function loadStockInfo(){
  if(stockInfoLoaded) return stockInfoCache;

  try{

    const data=await finmind(
      "TaiwanStockInfo"
    );

    stockInfoCache=data.map(x=>({
      code:String(x.stock_id||""),
      name:x.stock_name||"",
      fullName:x.stock_name||"",
      market:x.type==="twse" ? "上市" :
             x.type==="tpex" ? "上櫃" :
             "其他",
      type:"股票",
      industry:x.industry_category||"",
      keywords:[
        x.industry_category||"",
        x.stock_name||""
      ].join(" ")
    })).filter(x=>x.code);

  }catch(e){

    stockInfoCache=[];

  }

  stockInfoLoaded=true;

  return stockInfoCache;
}

function normalizeStock(s){

  if(!s) return null;

  return {
    code:String(s.code||""),
    name:s.name||s.code||"",
    fullName:s.fullName||s.name||s.code||"",
    market:s.market||"",
    type:s.type||"股票",
    industry:s.industry||"",
    keywords:s.keywords||""
  };
}

function scoreStock(stock,q){

  const query=q.toLowerCase().trim();

  if(!query) return 0;

  let score=0;

  const code=String(stock.code).toLowerCase();
  const name=String(stock.name).toLowerCase();
  const full=String(stock.fullName).toLowerCase();
  const industry=String(stock.industry).toLowerCase();
  const keywords=String(stock.keywords).toLowerCase();

  if(code===query) score+=1000;
  if(name===query) score+=900;
  if(full===query) score+=800;

  if(code.startsWith(query)) score+=500;
  if(name.startsWith(query)) score+=450;

  if(name.includes(query)) score+=350;
  if(industry.includes(query)) score+=200;
  if(keywords.includes(query)) score+=150;
  if(full.includes(query)) score+=100;

  return score;
}

function searchCandidates(query){

  const q=String(query||"").trim();

  if(!q) return [];

  let target=q.toLowerCase();

  if(ALIAS[target]){
    target=ALIAS[target];
  }

  const all=[
    ...KNOWN,
    ...stockInfoCache
  ];

  const map=new Map();

  for(const item of all){

    const stock=normalizeStock(item);

    if(!stock.code) continue;

    const score=scoreStock(stock,target);

    if(score>0){

      const old=map.get(stock.code);

      if(!old || score>old.score){
        map.set(stock.code,{
          ...stock,
          score
        });
      }
    }
  }

  return [...map.values()]
    .sort((a,b)=>b.score-a.score)
    .slice(0,50);
}

function findStock(query){

  const q=String(query||"").trim();

  if(!q) return null;

  let key=q.toLowerCase();

  if(ALIAS[key]){
    key=ALIAS[key];
  }

  const known=KNOWN.find(
    x=>String(x.code).toLowerCase()===key
  );

  if(known) return normalizeStock(known);

  const exactName=KNOWN.find(
    x=>String(x.name).toLowerCase()===key
  );

  if(exactName) return normalizeStock(exactName);

  const candidates=searchCandidates(q);

  return candidates.length ? normalizeStock(candidates[0]) : null;
}

let lastResults=[];

async function runSearch(q){

  const seq=++searchSeq;

  if(!q){

    renderSearchResults([]);

    $("searchStatus").textContent=
      "請輸入股票代號、名稱、產業或關鍵字。";

    return;
  }

  $("searchStatus").textContent="搜尋中……";

  await loadStockInfo();

  if(seq!==searchSeq) return;

  let results=searchCandidates(q);

  results=applyFilters(results);

  lastResults=results;

  renderSearchResults(results);

  $("searchStatus").textContent=
    `搜尋「${q}」完成，共 ${results.length} 筆。`;
}

function applyFilters(results){

  const market=$("marketFilter").value;
  const type=$("typeFilter").value;

  return results.filter(x=>{

    if(market && x.market!==market) return false;

    if(type && x.type!==type){

      if(type==="股票" && x.type==="興櫃股票"){
        return false;
      }

      return false;
    }

    return true;
  });
}

function parseRealtime(json,code){

  try{

    const msg=(json.msgArray||[]).find(
      x=>String(x.c)===String(code)
    );

    if(!msg) return null;

    const priceValue=
      Number(msg.z) ||
      Number(msg.pz) ||
      Number(msg.y);

    const prev=
      Number(msg.y);

    return {
      code:String(msg.c||code),
      name:msg.n||"",
      price:priceValue,
      prev,
      open:Number(msg.o),
      high:Number(msg.h),
      low:Number(msg.l),
      volume:Number(msg.v),
      time:msg.t||"",
      source:"TWSE MIS"
    };

  }catch(e){

    return null;

  }
}

async function getRealtime(stock){

  const code=stock.code;

  const marketCode=
    code.startsWith("00") ? "tse_"+code+".tw" :
    "tse_"+code+".tw";

  const url=
    MIS+"?ex_ch="+encodeURIComponent(marketCode);

  try{

    const json=await fetchWithProxy(url);

    const parsed=parseRealtime(json,code);

    if(parsed && Number.isFinite(parsed.price)){
      return parsed;
    }

  }catch(e){}

  return null;
}

/* ---------- 技術分析 ---------- */

function sma(values,n){

  if(values.length<n) return null;

  const arr=values.slice(-n);

  return arr.reduce(
    (a,b)=>a+b,0
  )/n;
}

function slope(values,n){

  if(values.length<n+1) return 0;

  const a=sma(
    values.slice(0,-Math.floor(n/2)),
    n
  );

  const b=sma(
    values.slice(-n),
    n
  );

  if(!Number.isFinite(a) || !Number.isFinite(b)){
    return 0;
  }

  return ((b-a)/a)*100;
}

function technical(data){

  const bars=data.prices||[];

  const closes=bars.map(x=>x.close);

  if(!closes.length){

    return {
      price:null,
      ma5:null,
      ma20:null,
      ma60:null,
      ma120:null,
      ma240:null,
      trend:"資料不足"
    };
  }

  const last=closes.at(-1);

  const ma5=sma(closes,5);
  const ma20=sma(closes,20);
  const ma60=sma(closes,60);
  const ma120=sma(closes,120);
  const ma240=sma(closes,240);

  const recent21=closes.slice(-21);

  const high21=
    Math.max(...recent21);

  const low21=
    Math.min(...recent21);

  const range21=
    high21-low21;

  const rangePct=
    low21 ? range21/low21*100 : 0;

  const nearHigh=
    high21 ? last/high21*100 : 0;

  const consolidation=
    rangePct<=15;

  const breakout=
    last>=high21*0.995;

  const breakdown=
    last<=low21*1.005;

  const maTurn=
    slope(closes,20);

  let trend="中性";

  if(
    ma20 &&
    last>ma5 &&
    last>ma20 &&
    maTurn>1
  ){
    trend="多頭";
  }else if(
    ma20 &&
    last>ma20
  ){
    trend="偏多";
  }else if(
    ma20 &&
    last<ma20 &&
    maTurn<-1
  ){
    trend="空頭";
  }else if(
    ma20 &&
    last<ma20
  ){
    trend="偏空";
  }

  const avgRange=
    bars.slice(-5).reduce(
      (sum,x)=>{
        return sum+
          (x.high-x.low)/
          Math.max(x.close,0.01);
      },0
    )/Math.min(5,bars.length)*100;

  const longBull=
    ma120 &&
    ma240 &&
    last>ma120 &&
    ma120>ma240;

  return {
    price:last,
    ma5,
    ma20,
    ma60,
    ma120,
    ma240,
    high21,
    low21,
    rangePct,
    nearHigh,
    consolidation,
    breakout,
    breakdown,
    maTurn,
    avgRange,
    longBull,
    trend
  };
}

function aggregateLaw(rows){

  const dates=[...new Set(
    rows.map(x=>x.date)
  )].sort();

  const latest=dates.at(-1);

  function sum(dateRange){

    const selected=dates.slice(
      Math.max(0,dates.length-dateRange)
    );

    const r=rows.filter(
      x=>selected.includes(x.date)
    );

    let foreign=0;
    let trust=0;
    let dealer=0;

    for(const x of r){

      const n=
        Number(
          x.buy||0
        )-
        Number(
          x.sell||0
        );

      const name=
        String(
          x.name||x.InvestorName||""
        );

      if(
        name.includes("外資") ||
        name.includes("Foreign")
      ){
        foreign+=n;
      }else if(
        name.includes("投信") ||
        name.includes("Investment")
      ){
        trust+=n;
      }else if(
        name.includes("自營") ||
        name.includes("Dealer")
      ){
        dealer+=n;
      }

    }

    return {
      foreign,
      trust,
      dealer,
      total:foreign+trust+dealer
    };
  }

  return {
    latest:latest||"--",
    one:sum(1),
    five:sum(5),
    twenty:sum(20)
  };
}

async function getPER(code){

  try{

    const data=await finmind(
      "TaiwanStockPER",
      {
        stock_id:code,
        start_date:new Date(
          Date.now()-180*86400000
        ).toISOString().slice(0,10),
        end_date:today()
      }
    );

    const valid=data
      .filter(x=>Number.isFinite(
        Number(x.PER)
      ));

    if(!valid.length) return null;

    const x=valid.at(-1);

    return {
      pe:Number(x.PER),
      pb:Number(x.PBR),
      dividend:Number(
        x.dividend_yield
      )
    };

  }catch(e){

    return null;

  }
}

async function getFinancial(code){

  try{

    const data=await finmind(
      "TaiwanStockFinancialStatements",
      {
        data_id:code,
        start_date:new Date(
          Date.now()-730*86400000
        ).toISOString().slice(0,10),
        end_date:today()
      }
    );

    let eps=null;
    let book=null;

    for(const x of data){

      const type=
        String(
          x.type||x.english_column_name||""
        );

      const val=
        Number(x.value);

      if(
        /EPS|每股盈餘/i.test(type) &&
        Number.isFinite(val)
      ){
        eps=val;
      }

      if(
        /每股淨值|Book Value/i.test(type) &&
        Number.isFinite(val)
      ){
        book=val;
      }

    }

    return {eps,book};

  }catch(e){

    return {
      eps:null,
      book:null
    };

  }
}

/* ---------- 支撐壓力 ---------- */

function levels(t){

  const p=t.price;

  if(!Number.isFinite(p)){

    return {
      support:null,
      support2:null,
      resistance:null,
      resistance2:null,
      breakout:null,
      breakdown:null,
      stop:null,
      tp1:null,
      tp2:null
    };

  }

  const support=
    Number.isFinite(t.low21)
      ? t.low21
      : p*0.94;

  const resistance=
    Number.isFinite(t.high21)
      ? t.high21
      : p*1.06;

  const breakout=
    resistance;

  const breakdown=
    support;

  return {

    support,

    support2:
      support*0.97,

    resistance,

    resistance2:
      resistance*1.03,

    breakout,

    breakdown,

    stop:
      support*0.97,

    tp1:
      resistance*1.03,

    tp2:
      resistance*1.07
  };
}

/* ---------- 賣壓模型 ---------- */

function pressureModel(prices,t,law){

  const p=t.price;

  if(!Number.isFinite(p)){

    return {
      state:"上方壓力不明",
      cls:"pressureWarn",
      score:0,
      level:null,
      distance:null,
      touches:0,
      consume:0,
      breakoutScore:0,
      desc:"目前資料不足。"
    };

  }

  const bars=
    prices.slice(-60);

  const candidates=[];

  for(const b of bars){

    const level=b.high;

    if(
      Number.isFinite(level) &&
      level>p*1.015 &&
      level<p*1.30
    ){

      candidates.push({
        level,
        volume:b.volume||0,
        date:b.date
      });

    }

  }

  if(!candidates.length){

    return {
      state:"上方壓力不明",
      cls:"pressureWarn",
      score:50,
      level:null,
      distance:null,
      touches:0,
      consume:0,
      breakoutScore:0,
      desc:"目前價格上方沒有明顯歷史壓力密集區。"
    };

  }

  const sorted=candidates
    .sort(
      (a,b)=>a.level-b.level
    );

  let cluster=[];

  for(const c of sorted){

    const last=cluster.at(-1);

    if(
      !last ||
      Math.abs(
        c.level-last.level
      )/last.level>0.02
    ){

      cluster.push({
        center:c.level,
        items:[c]
      });

    }else{

      last.items.push(c);

      last.center=
        last.items.reduce(
          (s,x)=>s+x.level,0
        )/last.items.length;
    }

  }

  const upper=
    cluster
      .filter(x=>x.center>p)
      .sort(
        (a,b)=>a.center-b.center
      )[0];

  if(!upper){

    return {
      state:"🚀 接近突破",
      cls:"pressureGood",
      score:90,
      level:null,
      distance:null,
      touches:0,
      consume:90,
      breakoutScore:90,
      desc:"目前價格上方缺乏明顯壓力密集區。"
    };

  }

  const level=upper.center;

  const distance=
    (level-p)/p*100;

  const touches=
    upper.items.length;

  const volume=
    upper.items.reduce(
      (s,x)=>s+x.volume,0
    );

  const recentVolume=
    bars.slice(-10).reduce(
      (s,x)=>s+(x.volume||0),0
    );

  let consume=
    50;

  if(recentVolume>0){

    consume=
      Math.min(
        100,
        35+
        touches*8+
        Math.max(
          0,
          20-distance
        )+
        Math.min(
          20,
          volume/recentVolume*100
        )
      );

  }

  const law20=
    law?.twenty?.total||0;

  let breakoutScore=
    100-distance*5+
    Math.min(
      20,
      law20/100000
    );

  breakoutScore=
    Math.max(
      0,
      Math.min(100,breakoutScore)
    );

  let state="🔴 壓力仍重";
  let cls="pressureDanger";

  if(
    distance<=3 &&
    consume>=75
  ){

    state="🚀 接近突破";
    cls="pressureGood";

  }else if(
    consume>=80
  ){

    state="🟢 賣壓明顯消化";
    cls="pressureGood";

  }else if(
    consume>=60
  ){

    state="🟡 賣壓消化中";
    cls="pressureWarn";

  }else if(
    distance<=5
  ){

    state="🟠 壓力靠近";
    cls="pressureWarn";

  }

  return {

    state,
    cls,
    score:Math.round(
      (consume+breakoutScore)/2
    ),
    level,
    distance,
    touches,
    consume,
    breakoutScore,
    desc:
      `最近主要壓力約 ${price(level)} 元，距離現價 ${pct(distance)}；模型估算消化程度 ${Math.round(consume)}%。`
  };
}

/* ---------- 綜合訊號 ---------- */

function signalModel(t,law,valuation){

  let score=50;

  const reasons=[];

  if(t.trend==="多頭"){
    score+=18;
    reasons.push("均線多頭");
  }else if(t.trend==="偏多"){
    score+=9;
    reasons.push("站在月線上方");
  }else if(t.trend==="偏空"){
    score-=9;
    reasons.push("低於月線");
  }else if(t.trend==="空頭"){
    score-=18;
    reasons.push("均線偏空");
  }

  if(t.longBull){
    score+=12;
    reasons.push("長期均線偏多");
  }

  if(t.breakout){
    score+=15;
    reasons.push("接近/突破21日高點");
  }

  if(t.breakdown){
    score-=15;
    reasons.push("接近21日低點");
  }

  const law5=
    law?.five?.total||0;

  const law20=
    law?.twenty?.total||0;

  if(law5>0){
    score+=8;
    reasons.push("法人近5日偏買");
  }else if(law5<0){
    score-=8;
    reasons.push("法人近5日偏賣");
  }

  if(law20>0){
    score+=7;
    reasons.push("法人近20日偏買");
  }else if(law20<0){
    score-=7;
    reasons.push("法人近20日偏賣");
  }

  if(
    valuation &&
    Number.isFinite(valuation.pe)
  ){

    if(
      valuation.pe>0 &&
      valuation.pe<15
    ){

      score+=6;
      reasons.push("本益比偏低");

    }else if(
      valuation.pe>35
    ){

      score-=5;
      reasons.push("本益比偏高");
    }

  }

  score=
    Math.max(
      0,
      Math.min(100,score)
    );

  let signal="中性";

  if(score>=78){
    signal="🚀 多頭";
  }else if(score>=62){
    signal="🟢 偏多";
  }else if(score<=32){
    signal="🔴 空頭";
  }else if(score<=45){
    signal="🟠 偏空";
  }

  return {
    score,
    signal,
    reasons
  };
}

/* ---------- 建立完整資料 ---------- */

async function buildData(stock){

  const realtimePromise=
    getRealtime(stock);

  const pricesPromise=
    getPrices(stock.code);

  const perPromise=
    getPER(stock.code);

  const financialPromise=
    getFinancial(stock.code);

  const institutionPromise=
    getInstitution(stock.code);

  const [
    realtime,
    prices,
    per,
    financial,
    institution
  ]=await Promise.all([
    realtimePromise,
    pricesPromise,
    perPromise,
    financialPromise,
    institutionPromise
  ]);

  const t=
    technical({
      prices
    });

  if(
    realtime &&
    Number.isFinite(realtime.price)
  ){

    t.realtimePrice=
      realtime.price;

  }

  const law=
    aggregateLaw(institution);

  const valuation={
    ...(per||{}),
    ...(financial||{})
  };

  const lev=
    levels(t);

  const signal=
    signalModel(
      t,
      {five:law.five,twenty:law.twenty},
      valuation
    );

  const pressure=
    pressureModel(
      prices,
      t,
      law
    );

  return {
    stock,
    realtime,
    prices,
    technical:t,
    law,
    valuation,
    levels:lev,
    signal,
    pressure
  };
}

/* ---------- Render ---------- */

function metric(label,value,sub="",cls=""){

  return `
    <div class="metric">

      <div class="metric-label">
        ${escapeHTML(label)}
      </div>

      <div class="metric-value ${cls}">
        ${value}
      </div>

      ${
        sub
        ? `<div class="metric-sub">${escapeHTML(sub)}</div>`
        : ""
      }

    </div>
  `;
}

function lawCard(title,value){

  const n=Number(value);

  const cls=
    n>0 ? "up" :
    n<0 ? "down" :
    "neutral";

  return `
    <div class="law">

      <div class="law-title">
        ${escapeHTML(title)}
      </div>

      <div class="law-value ${cls}">
        ${integer(n)}
      </div>

    </div>
  `;
}

      ${lawCard("投信5日",law.five.trust)}
      ${lawCard("自營5日",law.five.dealer)}
      ${lawCard("三大法人5日",law.five.total)}

    </div>

    <div style="height:10px"></div>

    <div class="law-grid">

      ${lawCard("外資20日",law.twenty.foreign)}
      ${lawCard("投信20日",law.twenty.trust)}
      ${lawCard("自營20日",law.twenty.dealer)}
      ${lawCard("三大法人20日",law.twenty.total)}

    </div>

  `;

}

/* ---------- 開啟股票 ---------- */

async function openStock(code){

  let stock=
    findStock(code);

  if(!stock){

    await loadStockInfo();

    stock=findStock(code);
  }

  if(!stock){

    toast("找不到股票："+code);
    return;
  }

  currentStock=stock;

  addRecent(stock.code);

  showPanel("analysisPanel");

  $("analysisContent").innerHTML=
    `<div class="loading">
      正在取得 ${escapeHTML(stock.code)} ${escapeHTML(stock.name)} 資料……
    </div>`;

  try{

    const data=
      await buildData(stock);

    if(
      currentStock.code!==stock.code
    ){
      return;
    }

    renderData(data);

    startAutoRefresh();

  }catch(e){

    console.error(e);

    $("analysisContent").innerHTML=`

      <div class="empty">

        ⚠️ 資料取得失敗

        <div style="margin-top:8px">
          ${escapeHTML(e.message||"未知錯誤")}
        </div>

        <div style="margin-top:12px">

          <button
            class="btn btn-primary"
            onclick="openStock('${escapeHTML(stock.code)}')">
            再試一次
          </button>

        </div>

      </div>

    `;

  }

}

/* ---------- 自動更新 ---------- */

function stopAutoRefresh(){

  if(refreshTimer){
    clearInterval(refreshTimer);
    refreshTimer=null;
  }

}

function startAutoRefresh(){

  stopAutoRefresh();

  if(
    !autoRefresh ||
    !currentStock
  ){
    return;
  }

  refreshTimer=
    setInterval(
      async()=>{
        if(currentStock){
          try{
            const data=
              await buildData(currentStock);
            renderData(data);
          }catch(e){}
        }
      },
      30000
    );

}

/* ---------- 掃描 ---------- */

async function scanOne(code){

  const stock=findStock(code);

  if(!stock) return null;

  try{

    const data=
      await buildData(stock);

    const t=data.technical;
    const law=data.law;
    const p=data.pressure;
    const sig=data.signal;

    let score=0;

    if(t.consolidation) score+=20;
    if(t.breakout) score+=30;
    if(t.nearHigh>=96) score+=20;
    if(t.maTurn>0) score+=10;
    if(law.five.total>0) score+=10;
    if(law.twenty.total>0) score+=10;

    score+=
      Math.round(
        (p.score||0)*0.2
      );

    score=
      Math.min(100,score);

    return {
      stock,
      data,
      score
    };

  }catch(e){

    return null;

  }

}

async function scanBreakout(){

  $("scanStatus").textContent=
    "掃描中……";

  $("scanResults").innerHTML=
    `<div class="loading">
      正在分析 ${SCAN_CODES.length} 檔股票／ETF……
    </div>`;

  const results=[];

  let index=0;

  async function worker(){

    while(index<SCAN_CODES.length){

      const code=
        SCAN_CODES[index++];

      const result=
        await scanOne(code);

      if(result){
        results.push(result);
      }

      $("scanStatus").textContent=
        `掃描進度 ${Math.min(index,SCAN_CODES.length)}/${SCAN_CODES.length}`;

    }

  }

  await Promise.all([
    worker(),
    worker(),
    worker()
  ]);

  results.sort(
    (a,b)=>b.score-a.score
  );

  $("scanStatus").textContent=
    `完成，共分析 ${results.length} 檔。`;

  if(!results.length){

    $("scanResults").innerHTML=
      `<div class="empty">
        目前無法取得掃描資料。
      </div>`;

    return;
  }

  $("scanResults").innerHTML=
    results
      .slice(0,15)
      .map(x=>{

        const t=x.data.technical;
        const p=x.data.pressure;
        const sig=x.data.signal;

        return `

          <div class="stock-card">

            <div class="stock-top">

              <div>

                <div class="stock-name">

                  ${escapeHTML(x.stock.name)}

                  <span class="stock-code">
                    ${escapeHTML(x.stock.code)}
                  </span>

                </div>

                <div class="stock-meta">

                  現價
                  ${price(t.price)}
                  ·
                  ${escapeHTML(sig.signal)}
                  ·
                  綜合 ${sig.score}

                </div>

                <div class="stock-meta">

                  ${t.breakout
                    ?"🚀 接近突破"
                    :t.consolidation
                      ?"🟡 盤整"
                      :"⚪ 觀察"}

                  ·

                  ${escapeHTML(p.state)}

                </div>

              </div>

              <span class="count">
                ${x.score}
              </span>

            </div>

            <div class="stock-actions">

              <button
                class="btn btn-primary"
                onclick="openStock('${escapeHTML(x.stock.code)}')">
                查看完整分析
              </button>

              <button
                class="btn"
                onclick="toggleFavorite('${escapeHTML(x.stock.code)}')">
                ${isFavorite(x.stock.code)
                  ?"⭐ 已自選"
                  :"☆ 自選"}
              </button>

            </div>

          </div>

        `;

      })
      .join("");

}

/* ---------- 產業 ---------- */

async function industrySearch(q){

  const results=

  $("industryResults").innerHTML=

}

/* ---------- Toast ---------- */

let toastTimer=null;

function toast(message){

  const old=document.querySelector(".toast");

  if(old) old.remove();

  const el=document.createElement("div");

  el.className="toast";

  el.textContent=message;

  document.body.appendChild(el);

  clearTimeout(toastTimer);

  toastTimer=
    setTimeout(
      ()=>el.remove(),
      2200
    );

}

/* ---------- 面板 ---------- */

function showPanel(id){

  const panels=[
    "homePanel",
    "analysisPanel",
    "favoritesPanel",
    "chipsPanel",
    "industryPanel",
    "settingsPanel"
  ];

  panels.forEach(x=>{

    const el=$(x);

    if(el){
      el.classList.toggle(
        "hidden",
        x!==id
      );
    }

  });

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.panel===id
      );
    });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if(id==="favoritesPanel"){
    renderFavorites();
  }

}

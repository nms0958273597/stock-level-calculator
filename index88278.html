<script>

const CACHE_KEY = "BINGO_V9_HISTORY";

const DATA_URL = "./bingo-data.json";

let history = [];

let currentRange = 100;

let currentMode = "smart";

let currentStar = 5;

let scoreData = [];


/* ==========================================
   基本工具
========================================== */

function pad(n){

  return String(n).padStart(2,"0");

}


function escapeHtml(str){

  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function todayString(){

  const d = new Date();

  return [
    d.getFullYear(),
    pad(d.getMonth()+1),
    pad(d.getDate())
  ].join("-");

}


/* ==========================================
   狀態
========================================== */

function setStatus(text,type=""){

  const el =
    document.getElementById("status");

  el.textContent = text;

  el.className =
    "status " + type;

}


/* ==========================================
   資料清理
========================================== */

function normalizeRecord(r){

  if(!r) return null;

  const period =
    String(
      r.period ??
      r.issue ??
      ""
    ).trim();

  let date =
    String(
      r.draw_date ??
      r.date ??
      ""
    ).trim();

  let time =
    String(
      r.draw_time ??
      r.time ??
      ""
    ).trim();

  let numbers =
    r.numbers ??
    r.number ??
    r.result ??
    [];

  if(typeof numbers === "string"){

    numbers =
      numbers.match(/\d{1,2}/g) || [];

  }

  numbers =
    Array.from(
      new Set(
        numbers
          .map(Number)
          .filter(
            n => n >= 1 && n <= 80
          )
      )
    ).sort(
      (a,b)=>a-b
    );

  if(!period || numbers.length !== 20){

    return null;

  }

  if(date.includes("/")){

    date =
      date.replaceAll("/","-");

  }

  if(date.includes("T")){

    date =
      date.slice(0,10);

  }

  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){

    date = "";

  }

  if(!/^\d{2}:\d{2}$/.test(time)){

    time = "";

  }

  return {

    period,

    draw_date:date,

    draw_time:time,

    numbers

  };

}


/* ==========================================
   排序
========================================== */

function sortHistory(){

  history.sort((a,b)=>{

    const pa = BigInt(a.period);

    const pb = BigInt(b.period);

    if(pa > pb) return -1;

    if(pa < pb) return 1;

    return 0;

  });

}


/* ==========================================
   儲存
========================================== */

function saveCache(){

  try{

    localStorage.setItem(

      CACHE_KEY,

      JSON.stringify({

        updatedAt:
          new Date().toISOString(),

        records:
          history

      })

    );

  }catch(e){

    console.warn(
      "無法儲存快取",
      e
    );

  }

}


/* ==========================================
   讀取快取
========================================== */

function loadCache(){

  try{

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );

    if(!raw){

      return false;

    }

    const obj =
      JSON.parse(raw);

    const arr =
      Array.isArray(obj)
        ? obj
        : obj.records;

    if(!Array.isArray(arr)){

      return false;

    }

    const map = new Map();

    arr.forEach(item=>{

      const r =
        normalizeRecord(item);

      if(r){

        map.set(
          r.period,
          r
        );

      }

    });

    history =
      Array.from(
        map.values()
      );

    sortHistory();

    return history.length > 0;

  }catch(e){

    console.warn(
      "讀取快取失敗",
      e
    );

    return false;

  }

}


/* ==========================================
   下載資料
========================================== */

async function fetchData(){

  setStatus(
    "🟡 正在更新完整歷史資料……",
    "warn"
  );

  const response =
    await fetch(
      DATA_URL +
      "?t=" +
      Date.now(),
      {
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  const data =
    await response.json();

  const records =
    Array.isArray(data)
      ? data
      : data.records;

  if(!Array.isArray(records)){

    throw new Error(
      "bingo-data.json 格式錯誤"
    );

  }

  const map = new Map();

  records.forEach(item=>{

    const r =
      normalizeRecord(item);

    if(r){

      map.set(
        r.period,
        r
      );

    }

  });

  const result =
    Array.from(
      map.values()
    );

  if(result.length === 0){

    throw new Error(
      "沒有有效歷史資料"
    );

  }

  history = result;

  sortHistory();

  /*
    保留最多10000期
  */

  history =
    history.slice(0,10000);

  saveCache();

  renderAll();

  setStatus(
    "🟢 歷史資料更新完成，共 " +
    history.length +
    " 期",
    "ok"
  );

}


/* ==========================================
   統計
========================================== */

function calcFrequency(
  number,
  count
){

  const records =
    history.slice(
      0,
      Math.min(
        count,
        history.length
      )
    );

  let hits = 0;

  records.forEach(r=>{

    if(
      r.numbers.includes(number)
    ){

      hits++;

    }

  });

  return hits;

}


/* ==========================================
   分析
========================================== */

function analyze(){

  const records =
    history.slice(
      0,
      Math.min(
        currentRange,
        history.length
      )
    );

  const freq =
    Array(81).fill(0);

  const missing =
    Array(81).fill(
      records.length
    );

  records.forEach(
    (r,index)=>{

      r.numbers.forEach(n=>{

        freq[n]++;

        if(
          missing[n] ===
          records.length
        ){

          missing[n] = index;

        }

      });

    }
  );


  scoreData = [];


  for(
    let n=1;
    n<=80;
    n++
  ){

    const f30 =
      calcFrequency(n,30);

    const f100 =
      calcFrequency(n,100);

    const f300 =
      calcFrequency(n,300);

    const f1000 =
      calcFrequency(n,1000);

    const fall =
      calcFrequency(
        n,
        history.length
      );


    /*
      綜合歷史分數

      近期：
      30期 35%
      100期 30%
      300期 20%
      1000期 10%
      全部 5%
    */

    const score =
      f30 * 0.35 +
      f100 * 0.30 +
      f300 * 0.20 +
      f1000 * 0.10 +
      fall * 0.05;


    scoreData.push({

      number:n,

      freq:freq[n],

      missing:missing[n],

      score:score

    });

  }


  scoreData.sort(
    (a,b)=>
      b.score-a.score
  );


  renderStats(
    records
  );

}


/* ==========================================
   統計表
========================================== */

function renderStats(records){

  const tbody =
    document.getElementById(
      "scoreTable"
    );

  tbody.innerHTML =
    scoreData
      .slice()
      .sort(
        (a,b)=>
          a.number-b.number
      )
      .map(x=>{

        const pct =
          records.length
            ? (
                x.freq /
                records.length *
                100
              ).toFixed(1)
            : "0.0";

        return `

          <tr>

            <td>
              <strong>
                ${pad(x.number)}
              </strong>
            </td>

            <td>
              ${x.freq}
            </td>

            <td>
              ${pct}%
            </td>

            <td>
              ${x.missing}
            </td>

            <td>
              ${x.score.toFixed(3)}
            </td>

          </tr>

        `;

      })
      .join("");


  document.getElementById(
    "statsInfo"
  ).textContent =
    "分析 " +
    records.length +
    " 期｜資料庫共 " +
    history.length +
    " 期";

}


/* ==========================================
   號碼網格
========================================== */

function renderNumberGrid(){

  const grid =
    document.getElementById(
      "numberGrid"
    );

  const sorted =
    scoreData.slice();

  const hot =
    new Set(
      sorted
        .sort(
          (a,b)=>
            b.score-a.score
        )
        .slice(0,10)
        .map(x=>x.number)
    );

  const cold =
    new Set(
      scoreData
        .slice()
        .sort(
          (a,b)=>
            a.score-b.score
        )
        .slice(0,10)
        .map(x=>x.number)
    );

  const missing =
    new Set(
      scoreData
        .slice()
        .sort(
          (a,b)=>
            b.missing-a.missing
        )
        .slice(0,10)
        .map(x=>x.number)
    );


  grid.innerHTML =
    Array.from(
      {length:80},
      (_,i)=>{

        const n=i+1;

        let cls =
          "grid-ball";

        if(
          hot.has(n)
        ){

          cls += " hot";

        }

        if(
          cold.has(n)
        ){

          cls += " cold";

        }

        if(
          missing.has(n)
        ){

          cls += " missing";

        }

        return `

          <div class="${cls}">
            ${pad(n)}
          </div>

        `;

      }
    ).join("");

}


/* ==========================================
   熱門冷門遺漏
========================================== */

function renderTopLists(){

  const hot =
    scoreData
      .slice()
      .sort(
        (a,b)=>
          b.score-a.score
      )
      .slice(0,12);

  const cold =
    scoreData
      .slice()
      .sort(
        (a,b)=>
          a.score-b.score
      )
      .slice(0,12);

  const missing =
    scoreData
      .slice()
      .sort(
        (a,b)=>
          b.missing-a.missing
      )
      .slice(0,12);


  document.getElementById(
    "hotNumbers"
  ).innerHTML =

    hot.map(x=>

      `<div class="ball hot">
        ${pad(x.number)}
      </div>`

    ).join("");


  document.getElementById(
    "coldNumbers"
  ).innerHTML =

    cold.map(x=>

      `<div class="ball cold">
        ${pad(x.number)}
      </div>`

    ).join("");


  document.getElementById(
    "missingNumbers"
  ).innerHTML =

    missing.map(x=>

      `<div class="ball star">
        ${pad(x.number)}
      </div>`

    ).join("");

}


/* ==========================================
   推薦
========================================== */

function makeRecommendation(){

  if(
    history.length === 0
  ){

    document.getElementById(
      "recommendInfo"
    ).textContent =
      "沒有歷史資料，不使用亂數推薦。";

    document.getElementById(
      "recommendNumbers"
    ).innerHTML =

      `<div class="empty">
        請先更新歷史資料
      </div>`;

    return;

  }


  let candidates =
    scoreData.slice();


  if(
    currentMode === "hot"
  ){

    candidates.sort(
      (a,b)=>
        b.score-a.score
    );

  }


  else if(
    currentMode === "cold"
  ){

    candidates.sort(
      (a,b)=>
        b.missing-a.missing
    );

  }


  else if(
    currentMode === "balance"
  ){

    candidates.sort(
      (a,b)=>{

        const sa =
          a.score +
          Math.min(
            a.missing,
            20
          ) * 0.02;

        const sb =
          b.score +
          Math.min(
            b.missing,
            20
          ) * 0.02;

        return sb-sa;

      }
    );

  }


  else{

    candidates.sort(
      (a,b)=>
        b.score-a.score
    );

  }


  /*
    不使用 Math.random()

    分成8個區間：

    01～10
    11～20
    21～30
    31～40
    41～50
    51～60
    61～70
    71～80
  */

  const ranges = [

    [1,10],
    [11,20],
    [21,30],
    [31,40],
    [41,50],
    [51,60],
    [61,70],
    [71,80]

  ];


  const selected = [];


  /*
    第一輪
    優先每區挑一個
  */

  for(
    const range of ranges
  ){

    if(
      selected.length >=
      currentStar
    ){

      break;

    }


    const found =
      candidates.find(
        x=>

          x.number >=
          range[0]

          &&

          x.number <=
          range[1]

          &&

          !selected.includes(
            x.number
          )
      );


    if(found){

      selected.push(
        found.number
      );

    }

  }


  /*
    第二輪
    依歷史分數補足
  */

  for(
    const item of candidates
  ){

    if(
      selected.length >=
      currentStar
    ){

      break;

    }


    if(
      !selected.includes(
        item.number
      )
    ){

      selected.push(
        item.number
      );

    }

  }


  selected.sort(
    (a,b)=>a-b
  );


  document.getElementById(
    "recommendInfo"
  ).textContent =

    "歷史分析｜" +
    modeName(currentMode) +
    "｜" +
    currentStar +
    "星｜近" +
    currentRange +
    "期";


  document.getElementById(
    "recommendNumbers"
  ).innerHTML =

    selected.map(n=>

      `<div class="ball star">
        ${pad(n)}
      </div>`

    ).join("");

}


/* ==========================================
   模式名稱
========================================== */

function modeName(mode){

  return {

    hot:"熱門",

    balance:"均衡",

    cold:"冷門",

    smart:"綜合"

  }[mode] || "綜合";

}


/* ==========================================
   顯示單期
========================================== */

function renderDraw(r){

  const time =
    r.draw_time
      ? r.draw_time
      : "--:--";


  return `

    <div class="draw">

      <div class="draw-head">

        <div>

          <div class="period">
            第 ${escapeHtml(r.period)} 期
          </div>

          <div
            style="
              color:#8fa3bb;
              font-size:13px;
              margin-top:5px;
            "
          >
            連續期數資料
          </div>

        </div>


        <div class="datetime">

          📅 ${escapeHtml(r.draw_date)}

          <br>

          <span class="time-badge">
            🕐 ${escapeHtml(time)}
          </span>

        </div>

      </div>


      <div class="draw-balls">

        ${r.numbers.map(n=>

          `<div class="draw-ball">
            ${pad(n)}
          </div>`

        ).join("")}

      </div>

    </div>

  `;

}


/* ==========================================
   每日歷史
========================================== */

function renderDaily(date){

  const list =
    history
      .filter(
        r =>
          r.draw_date === date
      )
      .sort(
        (a,b)=>{

          const pa =
            BigInt(a.period);

          const pb =
            BigInt(b.period);

          if(pa>pb) return -1;

          if(pa<pb) return 1;

          return 0;

        }
      );


  const info =
    document.getElementById(
      "dailyInfo"
    );


  if(
    list.length === 0
  ){

    info.textContent =
      date +
      "｜目前資料庫沒有這一天資料";

    document.getElementById(
      "dailyHistory"
    ).innerHTML =

      `<div class="empty">
        找不到這一天的資料
      </div>`;

    return;

  }


  info.textContent =
    date +
    "｜共 " +
    list.length +
    " 期";


  document.getElementById(
    "dailyHistory"
  ).innerHTML =

    list
      .map(renderDraw)
      .join("");

}


/* ==========================================
   最新20期
========================================== */

function renderLatest(){

  document.getElementById(
    "latestHistory"
  ).innerHTML =

    history
      .slice(0,20)
      .map(renderDraw)
      .join("");

}


/* ==========================================
   摘要
========================================== */

function renderSummary(){

  document.getElementById(
    "totalCount"
  ).textContent =
    history.length;


  if(history.length){

    const latest =
      history[0];

    document.getElementById(
      "latestPeriod"
    ).textContent =
      latest.period;


    document.getElementById(
      "latestTime"
    ).textContent =
      latest.draw_time ||
      "--:--";

  }else{

    document.getElementById(
      "latestPeriod"
    ).textContent =
      "--";

    document.getElementById(
      "latestTime"
    ).textContent =
      "--";

  }

}


/* ==========================================
   全部畫面
========================================== */

function renderAll(){

  if(
    history.length === 0
  ){

    return;

  }


  sortHistory();

  renderSummary();

  analyze();

  renderNumberGrid();

  renderTopLists();

  renderLatest();


  const date =
    document.getElementById(
      "datePicker"
    ).value;


  if(date){

    renderDaily(date);

  }


  document.getElementById(
    "dataInfo"
  ).textContent =
    "目前手機共有 " +
    history.length +
    " 期歷史資料";

}


/* ==========================================
   星數按鈕
========================================== */

document
  .querySelectorAll(
    "[data-star]"
  )
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        currentStar =
          Number(
            btn.dataset.star
          );


        document
          .querySelectorAll(
            "[data-star]"
          )
          .forEach(x=>
            x.classList.remove(
              "active"
            )
          );


        btn.classList.add(
          "active"
        );


        makeRecommendation();

      }
    );

  });


/* ==========================================
   模式按鈕
========================================== */

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        currentMode =
          btn.dataset.mode;


        document
          .querySelectorAll(
            "[data-mode]"
          )
          .forEach(x=>
            x.classList.remove(
              "active"
            )
          );


        btn.classList.add(
          "active"
        );


        makeRecommendation();

      }
    );

  });


/* ==========================================
   分析區間
========================================== */

document
  .querySelectorAll(
    "[data-range]"
  )
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        currentRange =
          Number(
            btn.dataset.range
          );


        analyze();

        renderNumberGrid();

        renderTopLists();

        makeRecommendation();

      }
    );

  });


document
  .getElementById(
    "allRangeBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      currentRange =
        history.length;

      analyze();

      renderNumberGrid();

      renderTopLists();

      makeRecommendation();

    }
  );


/* ==========================================
   推薦
========================================== */

document
  .getElementById(
    "recommendBtn"
  )
  .addEventListener(
    "click",
    makeRecommendation
  );


/* ==========================================
   重新分析
========================================== */

document
  .getElementById(
    "reanalyzeBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      analyze();

      renderNumberGrid();

      renderTopLists();

      makeRecommendation();

    }
  );


/* ==========================================
   清除推薦
========================================== */

document
  .getElementById(
    "clearRecommendBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      document.getElementById(
        "recommendInfo"
      ).textContent =
        "尚未產生推薦";


      document.getElementById(
        "recommendNumbers"
      ).innerHTML =

        `<div class="empty">
          已清除推薦
        </div>`;

    }
  );


/* ==========================================
   日期
========================================== */

document
  .getElementById(
    "datePicker"
  )
  .addEventListener(
    "change",
    e=>{

      renderDaily(
        e.target.value
      );

    }
  );


/* ==========================================
   今天
========================================== */

document
  .getElementById(
    "todayBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      const today =
        todayString();


      document.getElementById(
        "datePicker"
      ).value =
        today;


      renderDaily(today);

    }
  );


/* ==========================================
   更新資料
========================================== */

document
  .getElementById(
    "reloadBtn"
  )
  .addEventListener(
    "click",
    async ()=>{

      try{

        await fetchData();

        makeRecommendation();

      }catch(error){

        console.error(error);

        if(history.length){

          setStatus(
            "🟡 網路更新失敗，但手機已有 " +
            history.length +
            " 期歷史資料，可以繼續使用。",
            "warn"
          );

        }else{

          setStatus(
            "🔴 更新失敗：" +
            error.message,
            "error"
          );

        }

      }

    }
  );


/* ==========================================
   清除快取
========================================== */

document
  .getElementById(
    "clearCacheBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      const ok =
        confirm(
          "確定要刪除手機保存的全部歷史資料嗎？"
        );


      if(!ok){

        return;

      }


      localStorage.removeItem(
        CACHE_KEY
      );


      history = [];

      scoreData = [];


      document.getElementById(
        "numberGrid"
      ).innerHTML = "";


      document.getElementById(
        "hotNumbers"
      ).innerHTML = "";


      document.getElementById(
        "coldNumbers"
      ).innerHTML = "";


      document.getElementById(
        "missingNumbers"
      ).innerHTML = "";


      document.getElementById(
        "latestHistory"
      ).innerHTML = "";


      document.getElementById(
        "dailyHistory"
      ).innerHTML = "";


      document.getElementById(
        "recommendNumbers"
      ).innerHTML =

        `<div class="empty">
          歷史資料已清除
        </div>`;


      renderSummary();


      document.getElementById(
        "dataInfo"
      ).textContent =
        "手機歷史快取已清除";


      setStatus(
        "🟡 已清除手機歷史資料",
        "warn"
      );

    }
  );


/* ==========================================
   啟動
========================================== */

async function startApp(){

  document.getElementById(
    "datePicker"
  ).value =
    todayString();


  const hasCache =
    loadCache();


  if(hasCache){

    setStatus(
      "🟢 已載入手機保存的 " +
      history.length +
      " 期歷史資料",
      "ok"
    );


    renderAll();

    makeRecommendation();

  }else{

    setStatus(
      "🟡 手機目前沒有歷史資料，正在連線更新……",
      "warn"
    );

  }


  /*
    背景更新
    不阻塞 App 啟動
  */

  try{

    await fetchData();

    makeRecommendation();

  }catch(error){

    console.warn(
      "背景更新失敗",
      error
    );


    if(hasCache){

      setStatus(
        "🟢 網路暫時無法更新，但手機已有 " +
        history.length +
        " 期資料，可以正常分析。",
        "ok"
      );

    }else{

      setStatus(
        "🔴 尚未取得歷史資料，請按「更新資料」。",
        "error"
      );

    }

  }

}


startApp();

</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>📊 台股股票＋ETF全方位分析器｜index傑 V14</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f5f7;
  color:#171b2b;
  font-family:-apple-system,BlinkMacSystemFont,
  "PingFang TC","Microsoft JhengHei",sans-serif;
}

.wrap{
  max-width:980px;
  margin:auto;
  padding:14px;
}

header{
  background:#171b2b;
  color:#fff;
  border-radius:18px;
  padding:20px 18px;
  margin-bottom:14px;
}

h1{
  margin:0;
  font-size:24px;
  line-height:1.35;
}

h2{
  font-size:19px;
  margin:0 0 12px;
}

.sub{
  margin-top:6px;
  color:#c9cedb;
  font-size:13px;
  line-height:1.6;
}

.card{
  background:#fff;
  border-radius:17px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 10px #0000000d;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 150px auto;
  gap:8px;
}

.controls input,
.controls select{
  width:100%;
  padding:12px;
  border:1px solid #d8dbe2;
  border-radius:12px;
  font-size:16px;
  background:#fff;
}

.controls button{
  border:0;
  border-radius:12px;
  background:#171b2b;
  color:#fff;
  font-size:15px;
  padding:12px;
}

.btns{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:12px;
}

.btns button{
  white-space:nowrap;
  border:0;
  border-radius:12px;
  padding:10px 13px;
  background:#eceef2;
  font-size:14px;
}

.btns button.active,
.btns button.primary{
  background:#171b2b;
  color:#fff;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.metric{
  background:#f6f7f9;
  border-radius:13px;
  padding:12px;
  min-height:78px;
}

.metric small{
  display:block;
  color:#667085;
  margin-bottom:5px;
}

.metric b{
  font-size:20px;
  word-break:break-word;
}

.alert{
  background:#f6f7f9;
  border-radius:12px;
  padding:12px;
  line-height:1.65;
  margin-top:10px;
}

.green{color:#16803c}
.red{color:#d92d20}
.orange{color:#b54708}
.muted{color:#667085}

.small{
  font-size:12px;
  color:#667085;
  line-height:1.6;
}

.table{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,td{
  padding:10px 8px;
  border-bottom:1px solid #e7e9ee;
  text-align:center;
  font-size:13px;
}

th{
  background:#f6f7f9;
  position:sticky;
  top:0;
  z-index:1;
}

.stock{
  font-weight:700;
}

.code{
  font-size:12px;
  color:#667085;
}

.up{
  color:#e53935;
}

.down{
  color:#16803c;
}

.score{
  font-weight:800;
}

.searchResult{
  border:1px solid #e1e4ea;
  border-radius:13px;
  padding:12px;
  margin-top:8px;
  cursor:pointer;
  transition:.15s;
}

.searchResult:hover{
  background:#f8f9fb;
}

.pillrow{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:7px;
}

.tag{
  font-size:12px;
  background:#eef1f5;
  border-radius:999px;
  padding:4px 8px;
}

.badge{
  padding:5px 9px;
  border-radius:999px;
  background:#eef1f5;
  font-size:12px;
}

.loading{
  padding:14px;
  text-align:center;
  color:#667085;
}

.good

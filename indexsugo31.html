<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SUGO 2026/08｜視頻直播時數統計</title>
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html{
    scroll-behavior:smooth;
}
body{
    margin:0;
    padding:0;
    background:#f4f7fc;
    color:#182230;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
}
button,
input,
select{
    font:inherit;
}
button{
    cursor:pointer;
}
.container{
    width:min(920px,100%);
    margin:0 auto;
    padding:28px 20px 60px;
}
/* =========================
   標題
========================= */
.header{
    text-align:center;
    padding:12px 10px 22px;
}
.title-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}
.title-input{
    width:100%;
    max-width:680px;
    border:0;
    outline:none;
    background:transparent;
    text-align:center;
    color:#182230;
    font-size:42px;
    font-weight:900;
    letter-spacing:-1px;
    padding:5px 8px;
}
.title-input:focus{
    background:#ffffff;
    border-radius:16px;
    box-shadow:0 0 0 3px rgba(55,100,225,.12);
}
.subtitle{
    margin-top:4px;
    font-size:22px;
    font-weight:700;
    color:#6d7480;
}
.save-status{
    text-align:center;
    color:#3864e5;
    font-size:15px;
    font-weight:800;
    margin-top:8px;
    min-height:22px;
}
/* =========================
   卡片
========================= */
.card{
    background:#ffffff;
    border:1px solid #e3e7ee;
    border-radius:30px;
    padding:28px;
    margin-bottom:22px;
    box-shadow:
        0 3px 12px rgba(20,35,60,.04);
}
.card-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:30px;
    font-weight:900;
    margin-bottom:24px;
}
.section-icon{
    font-size:30px;
}
/* =========================
   新增
========================= */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}
.form-label{
    display:block;
    font-size:22px;
    font-weight:900;
    margin-bottom:10px;
}
.input-box{
    width:100%;
    height:74px;
    border:2px solid #dce1e9;
    border-radius:24px;
    background:#fff;
    padding:0 22px;
    font-size:24px;
    font-weight:800;
    color:#182230;
    outline:none;
}
.input-box:focus{
    border-color:#3864e5;
    box-shadow:0 0 0 4px rgba(56,100,229,.10);
}
.primary-btn{
    width:100%;
    height:76px;
    border:0;
    border-radius:25px;
    background:#3864e5;
    color:white;
    font-size:27px;
    font-weight:900;
    margin-top:22px;
    box-shadow:0 8px 18px rgba(56,100,229,.18);
}
.primary-btn:active{
    transform:scale(.985);
}
/* =========================
   月份切換
========================= */
.month-selector{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
}
.month-arrow{
    width:64px;
    height:64px;
    flex:0 0 64px;
    border:0;
    border-radius:20px;
    background:#3864e5;
    color:#fff;
    font-size:34px;
    font-weight:900;
}
.month-arrow:active{
    transform:scale(.95);
}
.current-month{
    flex:1;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#edf4ff;
    color:#182230;
    border-radius:20px;
    font-size:27px;
    font-weight:950;
}
/* =========================
   月份提示
========================= */
.month-notice{
    background:#f4f7fc;
    border-radius:20px;
    padding:16px;
    margin-bottom:20px;
    text-align:center;
    font-size:18px;
    font-weight:800;
    color:#596270;
}
.month-notice strong{
    color:#3864e5;
}
/* =========================
   統計
========================= */
.stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}
.stat{
    background:#f4f7fc;
    border-radius:28px;
    min-height:190px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px 12px;
}
.stat-icon{
    font-size:42px;
    margin-bottom:6px;
}
.stat-number{
    font-size:54px;
    line-height:1.05;
    font-weight:950;
    letter-spacing:-1px;
}
.stat-label{
    font-size:21px;
    color:#6d7480;
    font-weight:800;
    margin-top:8px;
}
/* =========================
   總結
========================= */
.summary{
    background:#edf4ff;
    border-radius:28px;
    padding:26px

<script>
/* =========================================================
   股票 AI 綜合分析 V5
   核心：
   1. 每次查詢建立全新的 state
   2. 所有資料嚴格驗證 stock_id
   3. 成本／支撐／壓力／目標全部依目前股票重新計算
   4. 法人股數統一 ÷ 1000 = 張
   5. 沒有可靠法人目標時絕不亂填
   6. 支援股票＋ETF
   ========================================================= */

const API = "https://api.finmindtrade.com/api/v4/data";

/* 如果你有自己的 FinMind Token，可填在這裡。
   沒有也可以使用，但官方目前無 token 為 300 requests/hour，
   有 token 為 600 requests/hour。 */
const FINMIND_TOKEN = "";

let stockUniverse = [];
let currentState = null;
let requestSerial = 0;

/* 常見英文別名 */
const EN_ALIAS = {
  "TSMC":"2330",
  "TAIWAN SEMICONDUCTOR":"2330",
  "TAIWAN SEMICONDUCTOR MANUFACTURING":"2330",
  "HON HAI":"2317",

  "EVERGREEN":"2603",
  "ASE":"3711",
  "REALTEK":"2379",
  "NOVATEK":"3034",
  "WISTRON":"3231",
  "QUANTA":"2382",
  "COMPAL":"2324",
  "CATHAY FINANCIAL":"2882",
  "FUBON FINANCIAL":"2881",
  "YUANTA FINANCIAL":"2885",
  "CTBC FINANCIAL":"2891",
  "UNITED AIRLINES":"2618",

  "WORLD UNION":"5314",
  "CENTURY":"5314",

  "YUANTA 50":"0050",
  "YUANTA TAIWAN 50":"0050",
  "YUANTA TAIWAN 50 2X":"00631L",
  "YUANTA TAIWAN 50 LEVERAGE":"00631L"
};

/* 常見代號別名 */
const CODE_ALIAS = {
  "00631":"00631L",
  "631":"00631L",
  "631L":"00631L",
  "0050":"0050",
  "50":"0050"
};

function $(id){
  return document.getElementById(id);
}

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function num(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function fmt(v,d=2){
  const n=num(v);
  if(n===null)return "—";
  return n.toLocaleString("zh-TW",{
    minimumFractionDigits:d,
    maximumFractionDigits:d
  });
}

function fmtInt(v){
  const n=num(v);
  if(n===null)return "—";
  return Math.round(n).toLocaleString("zh-TW");
}

function pct(v){
  const n=num(v);
  if(n===null)return "—";
  return (n>=0?"+":"")+n.toFixed(2)+"%";
}

function today(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}

function dateAgo(days){
  const d=new Date();
  d.setDate(d.getDate()-days);
  return d.toISOString().slice(0,10);
}

async function api(dataset,dataId="",start="",end=""){
  const params=new URLSearchParams();
  params.set("dataset",dataset);
  if(dataId)params.set("data_id",dataId);
  if(start)params.set("start_date",start);
  if(end)params.set("end_date",end);

  const headers={};
  if(FINMIND_TOKEN){
    headers.Authorization="Bearer "+FINMIND_TOKEN;
  }

  const res=await fetch(API+"?"+params.toString(),{
    headers,
    cache:"no-store"
  });

  if(!res.ok){
    throw new Error("API "+res.status);
  }

  const json=await res.json();

  if(json.status && json.status!==200){
    throw new Error(json.msg || "API error");
  }

  return Array.isArray(json.data)?json.data:[];
}

/* =========================================================
   股票清單
   ========================================================= */

async function loadUniverse(){

  if(stockUniverse.length)return stockUniverse;

  try{
    const rows=await api("TaiwanStockInfo");

    const latest={};

    for(const r of rows){

      const id=String(r.stock_id||"").trim();
      if(!id)continue;

      const old=latest[id];

      if(!old || String(r.date||"")>String(old.date||"")){
        latest[id]={
          stock_id:id,
          stock_name:String(r.stock_name||id),
          industry:String(r.industry_category||""),
          type:String(r.type||""),
          date:String(r.date||"")
        };
      }
    }

    stockUniverse=Object.values(latest);

    return stockUniverse;

  }catch(e){

    console.warn("股票清單讀取失敗",e);

    /* 最低限度保留常用股票 */
    stockUniverse=[
      {stock_id:"2330",stock_name:"台積電",industry:"半導體",type:"twse"},
      {stock_id:"2317",stock_name:"鴻海",industry:"電子",type:"twse"},
      {stock_id:"1326",stock_name:"台化",industry:"塑化",type:"twse"},
      {stock_id:"5314",stock_name:"世紀",industry:"電機",type:"tpex"},
      {stock_id:"0050",stock_name:"元大台灣50",industry:"ETF",type:"twse"},
      {stock_id:"00631L",stock_name:"元大台灣50正2",industry:"ETF",type:"twse"}
    ];

    return stockUniverse;
  }
}

function normalizeQuery(q){
  return String(q||"").trim().toUpperCase();
}

function resolveAlias(q){

  const x=normalizeQuery(q);

  if(CODE_ALIAS[x]){
    return CODE_ALIAS[x];
  }

  if(EN_ALIAS[x]){
    return EN_ALIAS[x];
  }

  return x;
}

function searchUniverse(q){

  const x=normalizeQuery(q);

  if(!x)return [];

  const alias=resolveAlias(x);

  let exact=stockUniverse.filter(r=>
    String(r.stock_id).toUpperCase()===alias
  );

  if(exact.length)return exact;

  return stockUniverse
    .filter(r=>{
      const id=String(r.stock_id||"").toUpperCase();
      const name=String(r.stock_name||"").toUpperCase();
      const industry=String(r.industry||"").toUpperCase();

      return id.includes(x) ||
             name.includes(x) ||
             industry.includes(x);
    })
    .slice(0,12);
}

/* =========================================================
   搜尋提示
   ========================================================= */

  if(!list.length){

  }

  box.innerHTML=list.map(r=>`

  box.querySelectorAll(".suggestItem").forEach(el=>{
    el.onclick=()=>{
      $("search").value=el.dataset.id;
      box.classList.remove("show");
      runSearch(el.dataset.id);
    };
  });
}

/* =========================================================
   價格資料
   ========================================================= */

async function getPriceHistory(stockId){

  const rows=await api(
    "TaiwanStockPrice",
    stockId,
    dateAgo(430),
    today()
  );

  /* 重要：
     API 回傳後再次確認 stock_id，
     防止資料串檔。 */
  const clean=rows
    .filter(r=>String(r.stock_id)===String(stockId))
    .map(r=>({
      date:String(r.date),
      open:num(r.open),
      high:num(r.max),
      low:num(r.min),
      close:num(r.close),
      volume:num(r.Trading_Volume ?? r.trading_volume),
      money:num(r.Trading_money ?? r.trading_money)
    }))
    .filter(r=>r.close!==null && r.close>0)
    .sort((a,b)=>a.date.localeCompare(b.date));

  return clean;
}

/* =========================================================
   均線
   ========================================================= */

function movingAverage(rows,n){

  if(rows.length<n)return null;

  const part=rows.slice(-n);

  const vals=part
    .map(x=>x.close)
    .filter(v=>v!==null);

  if(vals.length<n)return null;

  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function previousMovingAverage(rows,n){

  if(rows.length<n+5)return null;

  const end=rows.length-5;
  const part=rows.slice(end-n,end);

  if(part.length<n)return null;

  return part.reduce((s,r)=>s+r.close,0)/n;
}

function maSlope(rows,n){

  const now=movingAverage(rows,n);
  const old=previousMovingAverage(rows,n);

  if(now===null||old===null||old===0)return null;

  return (now-old)/old*100;
}

/* =========================================================
   VWAP
   ========================================================= */

function vwap(rows,n){

  const part=rows.slice(-n);

  let pv=0;
  let vol=0;

  for(const r of part){

    const price=(r.high+r.low+r.close)/3;

    if(
      Number.isFinite(price) &&
      Number.isFinite(r.volume) &&
      r.volume>0
    ){
      pv+=price*r.volume;
      vol+=r.volume;
    }
  }

  if(!vol)return null;

  return pv/vol;
}

/* =========================================================
   ATR
   ========================================================= */

function atr(rows,n=14){

  if(rows.length<n+1)return null;

  const part=rows.slice(-(n+1));

  const trs=[];

  for(let i=1;i<part.length;i++){

    const r=part[i];
    const p=part[i-1];

    if(
      r.high===null||
      r.low===null||
      p.close===null
    )continue;

    trs.push(Math.max(
      r.high-r.low,
      Math.abs(r.high-p.close),
      Math.abs(r.low-p.close)
    ));
  }

  if(!trs.length)return null;

  return trs.reduce((a,b)=>a+b,0)/trs.length;
}

/* =========================================================
   趨勢
   ========================================================= */

function trendScore(rows){

  const close=rows.at(-1)?.close;

  const ma5=movingAverage(rows,5);
  const ma14=movingAverage(rows,14);
  const ma27=movingAverage(rows,27);
  const ma62=movingAverage(rows,62);
  const ma131=movingAverage(rows,131);
  const ma272=movingAverage(rows,272);

  const mas=[ma5,ma14,ma27,ma62,ma131,ma272]
    .filter(v=>v!==null);

  let score=50;

  for(const ma of mas){
    if(close>ma)score+=5;
    else score-=5;
  }

  const s5=maSlope(rows,5);
  const s14=maSlope(rows,14);
  const s27=maSlope(rows,27);
  const s62=maSlope(rows,62);

  [s5,s14,s27,s62].forEach(s=>{
    if(s===null)return;
    if(s>0)score+=3;
    if(s<0)score-=3;
  });

  score=Math.max(0,Math.min(100,score));

  let label="中性";

  if(score>=75)label="偏多";
  else if(score>=60)label="偏多震盪";
  else if(score<=25)label="偏空";
  else if(score<=40)label="偏空震盪";

  return {score,label};
}

/* =========================================================
   支撐／壓力
   ========================================================= */

function localLevels(rows,current){

  const recent20=rows.slice(-20);
  const recent60=rows.slice(-60);
  const recent120=rows.slice(-120);

  const lows20=recent20.map(r=>r.low).filter(v=>v!==null);
  const highs20=recent20.map(r=>r.high).filter(v=>v!==null);

  const lows60=recent60.map(r=>r.low).filter(v=>v!==null);
  const highs60=recent60.map(r=>r.high).filter(v=>v!==null);

  const low20=lows20.length?Math.min(...lows20):current;
  const high20=highs20.length?Math.max(...highs20):current;

  const low60=lows60.length?Math.min(...lows60):current;
  const high60=highs60.length?Math.max(...highs60):current;

  const low120=recent120.length?
    Math.min(...recent120.map(r=>r.low).filter(v=>v!==null)):
    current;

  const high120=recent120.length?
    Math.max(...recent120.map(r=>r.high).filter(v=>v!==null)):
    current;

  const candidatesSupport=[
    low20,
    low60,
    low120,
    movingAverage(rows,5),
    movingAverage(rows,14),
    movingAverage(rows,27),
    movingAverage(rows,62)
  ]
  .filter(v=>v!==null && v<current)
  .sort((a,b)=>b-a);

  const candidatesResistance=[
    high20,
    high60,
    high120,
    movingAverage(rows,5),
    movingAverage(rows,14),
    movingAverage(rows,27),
    movingAverage(rows,62)
  ]
  .filter(v=>v!==null && v>current)
  .sort((a,b)=>a-b);

  return {
    support1:candidatesSupport[0] ?? current*0.97,
    support2:candidatesSupport[1] ?? current*0.94,
    resistance1:candidatesResistance[0] ?? current*1.03,
    resistance2:candidatesResistance[1] ?? current*1.06
  };
}

/* =========================================================
   技術目標
   ========================================================= */

function technicalTargets(rows,current){

  const a=atr(rows,14);

  const high20=Math.max(
    ...rows.slice(-20).map(r=>r.high).filter(v=>v!==null)
  );

  const high60=Math.max(
    ...rows.slice(-60).map(r=>r.high).filter(v=>v!==null)
  );

  const volatility=
    a && current ? a/current : 0.04;

  let t1=Math.max(
    current*(1+Math.max(.03,volatility*1.5)),
    high20
  );

  let t2=Math.max(
    current*(1+Math.max(.06,volatility*3)),
    high60
  );

  if(t2<=t1){
    t2=t1*(1+Math.max(.03,volatility));
  }

  let t3=t2*(1+Math.max(.04,volatility));

  return {
    t1,
    t2,
    t3,
    atr:a
  };
}

/* =========================================================
   成本模型
   ========================================================= */

function costModel(rows,current){

  const v20=vwap(rows,20);
  const v60=vwap(rows,60);
  const v120=vwap(rows,120);

  const vals=[
    {n:20,v:v20},
    {n:60,v:v60},
    {n:120,v:v120}
  ].filter(x=>x.v!==null);

  if(!vals.length){
    return {
      valid:false,
      reason:"歷史成交資料不足"
    };
  }

  const weighted=vals.reduce(
    (sum,x)=>sum+x.v/x.n,
    0
  )/
  vals.reduce(
    (sum,x)=>sum+1/x.n,
    0
  );

  const min=Math.min(...vals.map(x=>x.v));
  const max=Math.max(...vals.map(x=>x.v));

  /*
    防止出現：
    現價 26 → 成本 59
    這種明顯異常。
  */
  const ratio=weighted/current;

  if(
    !Number.isFinite(weighted) ||
    ratio<0.55 ||
    ratio>1.45
  ){
    return {
      valid:false,
      reason:"模型成本與現價偏離過大"
    };
  }

  return {
    valid:true,
    v20,
    v60,
    v120,
    coreLow:Math.min(weighted,min),
    coreHigh:Math.max(weighted,max),
    estimate:weighted
  };
}

   法人資料
   ========================================================= */

async function getInstitutional(stockId){

  try{

    const rows=await api(
      "TaiwanStockInstitutionalInvestorsBuySell",
      stockId,
      dateAgo(45),
      today()
    );

    const clean=rows
      .filter(r=>String(r.stock_id)===String(stockId))
      .sort((a,b)=>String(a.date).localeCompare(String(b.date)));

    if(!clean.length)return null;

    const dates=[...new Set(clean.map(r=>r.date))].sort();

    const latestDate=dates.at(-1);

    const latest=clean.filter(r=>r.date===latestDate);

    let foreign=0;
    let trust=0;
    let dealer=0;

    for(const r of latest){

      const buy=num(r.buy)||0;
      const sell=num(r.sell)||0;
      const net=buy-sell;

      const name=String(r.name||"");

      if(name==="Foreign_Investor"){
        foreign+=net;
      }
      else if(name==="Foreign_Dealer_Self"){
        foreign+=net;
      }
      else if(name==="Investment_Trust"){
        trust+=net;
      }
      else if(
        name==="Dealer_self" ||
        name==="Dealer_Self"
      ){
        dealer+=net;
      }
      else if(
        name==="Dealer_Hedging" ||
        name==="Dealer_Hedging"
      ){
        dealer+=net;
      }
    }

    return {
      date:latestDate,
      foreign:foreign/1000,
      trust:trust/1000,
      dealer:dealer/1000,
      total:(foreign+trust+dealer)/1000
    };

  }catch(e){

    console.warn("法人資料取得失敗",e);
    return null;
  }
}

async function getPER(stockId){

  try{

    const rows=await api(
      "TaiwanStockPER",
      stockId,
      dateAgo(45),
      today()
    );

    const clean=rows
      .filter(r=>String(r.stock_id)===String(stockId))
      .sort((a,b)=>String(a.date).localeCompare(String(b.date)));

    const r=clean.at(-1);

    if(!r)return null;

    return {
      date:r.date,
      per:num(r.PER),
      pbr:num(r.PBR),
      yield:num(r.dividend_yield)
    };

  }catch(e){

    return null;
  }
}

/* =========================================================
   完整分析
   ========================================================= */

async function buildAnalysis(stock,rows,seq){

  const stockId=String(stock.stock_id);

  /* 再一次確認：
     目前 state 必須仍然是這檔股票 */
  if(seq!==requestSerial){
    throw new Error("查詢已被更新");
  }

  const latest=rows.at(-1);

  if(!latest){
    throw new Error("沒有有效股價資料");
  }

  const current=latest.close;

  const prev=rows.at(-2)?.close ?? null;

  const change=prev!==null ? current-prev : null;

  const changePct=
    prev ? change/prev*100 : null;

  const mas={
    5:movingAverage(rows,5),
    14:movingAverage(rows,14),
    27:movingAverage(rows,27),
    62:movingAverage(rows,62),
    131:movingAverage(rows,131),
    272:movingAverage(rows,272)
  };

  const slopes={
    5:maSlope(rows,5),
    14:maSlope(rows,14),
    27:maSlope(rows,27),
    62:maSlope(rows,62),
    131:maSlope(rows,131),
    272:maSlope(rows,272)
  };

  const trend=trendScore(rows);

  const levels=localLevels(rows,current);

  const targets=technicalTargets(rows,current);

  const cost=costModel(rows,current);

  const institutional=await getInstitutional(stockId);

  const per=await getPER(stockId);

  if(seq!==requestSerial){
    throw new Error("查詢已被更新");
  }

  return {
    stockId,
    stock,
    latest,
    current,
    prev,
    change,
    changePct,
    mas,
    slopes,
    trend,
    levels,
    targets,
    cost,
    institutional,
    per
  };
}

const HOT_CODES=[
  "2330","2317","2454","2308","2303",
  "2881","2882","2885","2603","1326",
  "0050","00631L","00878","00919","00981A"
];

async function loadHot(){

  const container=$("hotList");

  if(!container)return;

  container.innerHTML=
    `<div class="loading">熱門資料讀取中…</div>`;

  const results=[];

  for(const id of HOT_CODES){

    try{

      const info=stockUniverse.find(
        x=>String(x.stock_id)===id
      );

      const rows=await getPriceHistory(id);

      if(!rows.length)continue;

      const last=rows.at(-1);

      const ma5=movingAverage(rows,5);
      const ma27=movingAverage(rows,27);
      const ma62=movingAverage(rows,62);

      const volumeNow=last.volume||0;

      const prev20=rows.length>=21
        ?rows.at(-21).close
        :null;

      const momentum=
        prev20
        ?(last.close-prev20)/prev20*100
        :0;

      let score=50;

      if(ma5 && last.close>ma5)score+=10;
      if(ma27 && last.close>ma27)score+=10;
      if(ma62 && last.close>ma62)score+=10;
      if(momentum>0)score+=Math.min(15,momentum);
      if(volumeNow>0)score+=5;

      results.push({
        id,
        name:info?.stock_name||id,
        price:last.close,
        score:Math.min(100,Math.round(score))
      });

    }catch(e){
      console.warn("熱門資料失敗",id,e);
    }
  }

  results.sort((a,b)=>b.score-a.score);

  if(!results.length){

    container.innerHTML=
      `<div class="notice warn">
        暫時無法取得熱門排行資料。
      </div>`;

    return;
  }

  container.innerHTML=results
    .slice(0,10)
    .map((r,i)=>`
      <div class="rankItem"
           data-code="${esc(r.id)}">

        <div class="rankNum">${i+1}</div>

        <div>
          <div class="rankName">
            ${esc(r.name)}
          </div>
          <div class="rankSub">
            ${esc(r.id)}｜現價 ${fmt(r.price)}
          </div>
        </div>

        <div class="rankScore">
          ${r.score}
        </div>

      </div>
    `).join("");

  container.querySelectorAll(".rankItem").forEach(el=>{
    el.onclick=()=>{
      $("search").value=el.dataset.code;
      runSearch(el.dataset.code);
      window.scrollTo({top:0,behavior:"smooth"});
    };
  });
}

    let q=String(input||"").trim();

    if(!q){
      throw new Error("請輸入股票代號或名稱");
    }

    let list=searchUniverse(q);

    /* 00631 → 00631L */
    const resolved=resolveAlias(q);

    if(!list.length && resolved!==q){
      list=searchUniverse(resolved);
    }

    if(!list.length){

      throw new Error(
        "找不到這檔股票。請輸入完整代號或中文名稱。"
      );
    }

    /* 如果只有一個精準結果就直接查 */
    let stock=list[0];

    const exact=list.find(
      x=>String(x.stock_id)===String(resolved)
    );

    if(exact)stock=exact;

    const stockId=String(stock.stock_id);

    /*
      ★★★ 最重要的防串檔機制 ★★★
      先建立全新 state。
    */
    currentState={
      stockId,
      stock,
      createdAt:Date.now()
    };

    const rows=await getPriceHistory(stockId);

    if(seq!==requestSerial){
      return;
    }

    if(!rows.length){
      throw new Error(
        `${stock.stock_name}（${stockId}）目前沒有足夠的歷史價格資料。`
      );
    }

    const analysis=
      await buildAnalysis(
        stock,
        rows,
        seq
      );

    if(seq!==requestSerial){
      return;
    }

    /*
      再次確認：
      analysis 的 stockId 必須等於目前 state。
    */
    if(
      !currentState ||
      String(currentState.stockId)!==String(analysis.stockId)
    ){
      throw new Error("資料代碼驗證失敗，拒絕顯示。");
    }

    currentState.analysis=analysis;

    renderApp(analysis);

  }catch(e){

    console.error(e);

    $("app").innerHTML=`
      <section class="card">

        <h2 class="red">⚠️ 查詢失敗</h2>

        <div class="notice bad">
          ${esc(e.message||"資料讀取失敗")}
        </div>

        <div class="notice" style="margin-top:14px">
          請稍候再試一次。
          如果 FinMind API 暫時達到流量限制，
          稍後再查即可。
        </div>

      </section>
    `;

  }finally{

    if(seq===requestSerial){
      $("loading").classList.add("hidden");
    }
  }
}

/* =========================================================
   事件
   ========================================================= */

$("searchBtn").onclick=()=>{
  runSearch($("search").value);
};

$("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    runSearch($("search").value);
  }
});

$("search").addEventListener("input",async e=>{

  const q=e.target.value.trim();

  if(!q){
    $("suggest").classList.remove("show");
    return;
  }

  await loadUniverse();

  const list=searchUniverse(q);

  showSuggestions(list);
});

document.addEventListener("click",e=>{

  if(
    !e.target.closest(".searchBox") &&
    !e.target.closest(".suggest")
  ){
    $("suggest").classList.remove("show");
  }

});

/* =========================================================
   初始
   ========================================================= */

(async function(){

  try{

    await loadUniverse();

    /* 預設先顯示 00631L */
    $("search").value="00631L";

    await runSearch("00631L");

  }catch(e){

    console.error(e);

  }

})();
</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#080d13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>股票搜尋器 19｜行情・法人籌碼</title>

<style>
:root{
  --bg:#080d13;
  --panel:#111923;
  --panel2:#17212c;
  --panel3:#1c2834;
  --line:#293746;
  --text:#f5f7fa;
  --muted:#8e9baa;

  --blue:#4da3ff;
  --cyan:#55d8ff;
  --red:#ff5c6c;
  --green:#35d27c;
  --yellow:#f4c451;
  --purple:#ad88ff;
  --orange:#ff9c50;

  --shadow:0 10px 30px rgba(0,0,0,.24);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1020px;
  margin:auto;
  min-height:100vh;
  padding-bottom:105px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:30;

  padding:
    calc(env(safe-area-inset-top) + 15px)
    15px
    13px;

  background:rgba(8,13,19,.96);
  backdrop-filter:blur(18px);

  border-bottom:
    1px solid rgba(255,255,255,.06);
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:44px;
  height:44px;
  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #247cff,
      #64baff
    );

  font-size:22px;

  box-shadow:
    0 8px 24px
    rgba(77,163,255,.24);
}

.brand-title{
  font-size:19px;
  font-weight:900;
}

.brand-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.status{
  text-align:right;
  color:var(--muted);
  font-size:10px;
}

.status strong{
  display:block;
  color:var(--green);
  font-size:12px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-area{
  padding:16px 15px 7px;
}

.search-box{
  position:relative;
}

.search-box input{
  width:100%;
  height:58px;

  border:
    1px solid var(--line);

  border-radius:18px;

  outline:none;

  background:var(--panel);
  color:var(--text);

  padding:
    0
    53px
    0
    50px;

  font-size:16px;

  box-shadow:var(--shadow);
}

.search-box input:focus{
  border-color:var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(77,163,255,.12),
    var(--shadow);
}

.search-icon{
  position:absolute;
  left:16px;
  top:16px;
  font-size:22px;
  pointer-events:none;
}

.clear{
  display:none;

  position:absolute;
  right:10px;
  top:10px;

  width:38px;
  height:38px;

  border:0;
  border-radius:50%;

  background:#293440;
  color:#fff;

  font-size:20px;
}

.clear.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.search-hint{
  color:var(--muted);
  font-size:11px;
  margin:8px 4px 0;
}


/* =========================================================
   QUICK SEARCH
========================================================= */

.quick-wrap{
  padding:
    5px
    15px
    8px;

  overflow-x:auto;
  scrollbar-width:none;
}

.quick-wrap::-webkit-scrollbar{
  display:none;
}

.quick{
  display:flex;
  gap:7px;
  min-width:max-content;
}

.quick button{
  border:
    1px solid var(--line);

  background:var(--panel);
  color:#dce6ef;

  border-radius:999px;

  padding:
    8px
    12px;

  font-size:12px;
  white-space:nowrap;
}


/* =========================================================
   FILTER
========================================================= */

.filters{
  padding:
    5px
    15px;
}

.filter-grid{
  display:grid;
  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:8px;
}

.filter-grid select{
  width:100%;
  height:41px;

  border:
    1px solid var(--line);

  border-radius:11px;

  background:var(--panel);
  color:var(--text);

  padding:
    0
    9px;

  outline:none;

  font-size:12px;
}


/* =========================================================
   DATABASE STATUS
========================================================= */

.database{
  margin:
    9px
    15px;

  padding:14px;

  border:
    1px solid var(--line);

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      rgba(77,163,255,.10),
      rgba(255,255,255,.025)
    );
}

.database-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.database-label{
  color:var(--muted);
  font-size:11px;
}

.database-count{
  margin-top:2px;
  font-size:24px;
  font-weight:900;
}

.database-right{
  text-align:right;
  color:var(--muted);
  font-size:10px;
}

.database-right strong{
  display:block;
  color:var(--green);
  font-size:12px;
}


/* =========================================================
   SECTION
========================================================= */

.section{
  padding:
    4px
    15px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin:
    14px
    2px
    9px;
}

.section-head h2{
  margin:0;
  font-size:16px;
}

.section-head span{
  color:var(--muted);
  font-size:11px;
}


/* =========================================================
   STOCK CARD
========================================================= */

.results{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.stock-card{
  padding:15px;

  border:
    1px solid var(--line);

  border-radius:18px;

  background:var(--panel);

  box-shadow:
    0 7px 22px
    rgba(0,0,0,.12);
}

.stock-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.stock-code{
  font-size:20px;
  font-weight:900;
  letter-spacing:.4px;
}

.stock-name{
  margin-top:3px;
  font-size:16px;
  font-weight:800;
}

.stock-full{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stock-badges{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:5px;
}

.badge{
  padding:
    5px
    8px;

  border-radius:999px;

  background:#26323e;

  color:#dce7f2;

  font-size:10px;
  white-space:nowrap;
}

.badge.type{
  color:var(--yellow);
  background:
    rgba(245,196,81,.10);
}

.badge.market{
  color:#b9c9d8;
}


/* =========================================================
   QUOTE
========================================================= */

.quote{
  margin-top:13px;

  padding:13px;

  border-radius:15px;

  background:#151e28;

  border:
    1px solid
    rgba(255,255,255,.045);
}

.quote-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
}

.quote-label{
  color:var(--muted);
  font-size:10px;
}

.price{
  margin-top:2px;
  font-size:29px;
  font-weight:950;
}

.change{
  text-align:right;
  font-size:14px;
  font-weight:850;
}

.up{
  color:var(--red);
}

.down{
  color:var(--green);
}

.flat{
  color:var(--muted);
}

.quote-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;

  margin-top:12px;
}

.quote-item{
  min-width:0;

  padding:8px;

  border-radius:10px;

  background:#1b2530;
}

.q-label{
  color:var(--muted);
  font-size:9px;
}

.q-value{
  margin-top:3px;
  font-size:12px;
  font-weight:750;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}


/* =========================================================
   ANALYSIS
========================================================= */

.analysis-box{
  margin-top:10px;

  padding:13px;

  border:
    1px solid var(--line);

  border-radius:15px;

  background:#111a23;
}

.analysis-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;

  margin-bottom:10px;
}

.analysis-head strong{
  font-size:14px;
}

.analysis-head span{
  color:var(--muted);
  font-size:9px;
}


/* =========================================================
   MA
========================================================= */

.ma-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;
}

.ma-item{
  padding:9px;

  border-radius:10px;

  background:#19232d;
}

.ma-name{
  color:var(--muted);
  font-size:9px;
}

.ma-value{
  margin-top:3px;
  font-size:13px;
  font-weight:850;
}

.ma-gap{
  margin-top:3px;
  font-size:10px;
}

.gap-up{
  color:var(--red);
}

.gap-down{
  color:var(--green);
}

.gap-flat{
  color:var(--muted);
}


/* =========================================================
   TREND
========================================================= */

.trend-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}

.trend-item{
  padding:10px;
  border-radius:11px;
  background:#18222c;
}

.trend-label{
  color:var(--muted);
  font-size:9px;
}

.trend-value{
  margin-top:4px;
  font-size:13px;
  font-weight:850;
}

.bull{
  color:var(--red);
}

.bear{
  color:var(--green);
}

.neutral{
  color:var(--yellow);
}


/* =========================================================
   INSTITUTIONAL
========================================================= */

.institution-box{
  margin-top:10px;

  border:
    1px solid var(--line);

  border-radius:15px;

  overflow:hidden;

  background:#111a23;
}

.institution-title{
  padding:
    12px
    13px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  background:#151f29;
}

.institution-title strong{
  font-size:14px;
}

.institution-title span{
  color:var(--muted);
  font-size:9px;
}

.institution-table{
  width:100%;
  border-collapse:collapse;
}

.institution-table th,
.institution-table td{
  padding:
    9px
    6px;

  text-align:right;

  border-top:
    1px solid
    rgba(255,255,255,.045);

  font-size:10px;
}

.institution-table th{
  color:var(--muted);
  font-weight:600;
}

.institution-table th:first-child,
.institution-table td:first-child{
  text-align:left;
  padding-left:12px;
}

.buy{
  color:var(--red);
}

.sell{
  color:var(--green);
}

.net-positive{
  color:var(--red);
  font-weight:850;
}

.net-negative{
  color:var(--green);
  font-weight:850;
}

.net-flat{
  color:var(--muted);
}


/* =========================================================
   CHIP SUMMARY
========================================================= */

.chip-summary{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

  margin-top:9px;
}

.chip-card{
  padding:11px;

  border-radius:12px;

  background:#18222c;
}

.chip-label{
  color:var(--muted);
  font-size:9px;
}

.chip-value{
  margin-top:4px;
  font-size:14px;
  font-weight:850;
}


/* =========================================================
   VALUATION
========================================================= */

.valuation{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

  margin-top:9px;
}

.value-card{
  padding:11px;

  border-radius:12px;

  background:#18222c;
}

.value-label{
  color:var(--muted);
  font-size:9px;
}

.value-number{
  margin-top:4px;
  font-size:14px;
  font-weight:850;
}

.cheap{
  color:var(--green);
}

.fair{
  color:var(--yellow);
}

.expensive{
  color:var(--red);
}


/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

  margin-top:11px;
}

.actions button{
  height:39px;

  border:
    1px solid var(--line);

  border-radius:10px;

  background:#1a2530;

  color:#e4edf5;
}

.actions button.primary{
  color:#8bc7ff;

  background:
    rgba(77,163,255,.08);

  border-color:
    rgba(77,163,255,.30);
}

.actions button.active{
  color:var(--yellow);

  background:
    rgba(245,196,81,.08);
}


/* =========================================================
   STATE
========================================================= */

.state{
  margin:
    25px
    15px;

  padding:
    30px
    18px;

  border:
    1px dashed var(--line);

  border-radius:18px;

  text-align:center;

  color:var(--muted);
}

.state-icon{
  font-size:38px;
  margin-bottom:8px;
}

.state strong{
  display:block;
  color:var(--text);
  font-size:16px;
  margin-bottom:6px;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  display:none;

  position:fixed;
  inset:0;
  z-index:100;

  padding:15px;

  background:
    rgba(0,0,0,.76);

  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;

  justify-content:center;
  align-items:flex-end;
}

.modal-panel{
  width:100%;
  max-width:760px;

  max-height:91vh;

  overflow:auto;

  padding:18px;

  border:
    1px solid var(--line);

  border-radius:24px;

  background:#0f1720;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.48);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.modal-title{
  font-size:23px;
  font-weight:900;
}

.modal-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.close{
  width:38px;
  height:38px;

  border:0;
  border-radius:50%;

  background:#27323e;
  color:#fff;

  font-size:20px;
}

.detail-grid{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

  margin-top:15px;
}

.detail-box{
  padding:12px;

  border:
    1px solid var(--line);

  border-radius:12px;

  background:#17212b;
}

.detail-label{
  color:var(--muted);
  font-size:9px;
}

.detail-value{
  margin-top:4px;

  font-size:14px;
  font-weight:750;

  word-break:break-word;
}

.notice{
  margin-top:12px;

  padding:12px;

  border:
    1px solid
    rgba(245,196,81,.16);

  border-radius:12px;

  background:
    rgba(245,196,81,.07);

  color:#d8c890;

  font-size:10px;

  line-height:1.65;
}


/* =========================================================
   RECENT / FAVORITES
========================================================= */

.simple-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.simple-item{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:10px;

  padding:
    10px
    12px;

  border:
    1px solid var(--line);

  border-radius:11px;

  background:var(--panel);
}

.simple-code{
  font-weight:850;
}

.simple-name{
  color:var(--muted);
  font-size:11px;
  margin-left:5px;
}

.simple-item button{
  width:34px;
  height:34px;

  border:0;
  border-radius:9px;

  background:#222d39;
  color:#fff;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;

  z-index:50;

  left:50%;
  bottom:0;

  transform:
    translateX(-50%);

  width:min(
    1020px,
    100%
  );

  padding:
    7px
    9px
    calc(
      7px +
      env(safe-area-inset-bottom)
    );

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:6px;

  background:
    rgba(13,19,26,.97);

  backdrop-filter:
    blur(20px);

  border-top:
    1px solid
    rgba(255,255,255,.07);
}

.nav-btn{
  height:52px;

  border:0;
  border-radius:12px;

  background:transparent;

  color:var(--muted);

  font-size:10px;
}

.nav-btn span{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.nav-btn.active{
  color:#fff;
  background:#1c2732;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(min-width:720px){

  .app{
    padding-bottom:25px;
  }

  .results{
    display:grid;

    grid-template-columns:
      1fr
      1fr;
  }

  .bottom-nav{
    position:static;

    transform:none;

    margin:
      18px
      auto
      0;

    border:
      1px solid var(--line);

    border-radius:15px;
  }

  .modal.show{
    align-items:center;
  }

}

@media(max-width:430px){

  .filter-grid{
    grid-template-columns:
      1fr
      1fr;
  }

  .filter-grid select:last-child{
    grid-column:
      1 / -1;
  }

  .quote-grid{
    grid-template-columns:
      1fr
      1fr;
  }

  .ma-grid{
    grid-template-columns:
      1fr
      1fr;
  }

}
</style>
</head>


<body>

<div class="app">


<!-- ======================================================
     HEADER
====================================================== -->

<header class="header">

  <div class="header-top">

    <div class="brand">

      <div class="brand-icon">
        📊
      </div>

      <div>

        <div class="brand-title">
          股票搜尋器 19
        </div>

        <div class="brand-sub">
          行情・均線・法人籌碼
        </div>

      </div>

    </div>


    <div class="status">

      <strong id="dataStatus">
        讀取中…
      </strong>

      <span id="updateTime">
        stock-data
      </span>

    </div>

  </div>

</header>


<!-- ======================================================
     SEARCH
====================================================== -->

<section class="search-area">

  <div class="search-box">

    <div class="search-icon">
      🔎
    </div>

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="輸入股票代號、名稱、產業、關鍵字"
    >

    <button
      id="clearBtn"
      class="clear"
    >
      ×
    </button>

  </div>

  <div class="search-hint">
    例如：1326、台化、2330、台積電、0050、半導體、塑膠
  </div>

</section>


<!-- ======================================================
     QUICK
====================================================== -->

<div class="quick-wrap">

  <div class="quick">

    <button data-search="1326">
      1326 台化
    </button>

    <button data-search="台化">
      台化
    </button>

    <button data-search="2330">
      2330 台積電
    </button>

    <button data-search="0050">
      0050
    </button>

    <button data-search="半導體">
      半導體
    </button>

    <button data-search="塑膠">
      塑膠
    </button>

    <button data-search="金融">
      金融
    </button>

  </div>

</div>


<!-- ======================================================
     FILTER
====================================================== -->

<section class="filters">

  <div class="filter-grid">

    <select id="marketFilter">

      <option value="">
        全部市場
      </option>

      <option value="上市">
        上市
      </option>

      <option value="上櫃">
        上櫃
      </option>

      <option value="興櫃">
        興櫃
      </option>

    </select>


    <select id="typeFilter">

      <option value="">
        全部類型
      </option>

      <option value="股票">
        股票
      </option>

      <option value="ETF">
        ETF
      </option>

      <option value="興櫃股票">
        興櫃股票
      </option>

    </select>


    <select id="sortFilter">

      <option value="relevance">
        搜尋相關度

/* =========================================================

function normalizeText(
  value
){

  return String(
    value ?? ""
  )
    .trim()
    .toLowerCase();

}


function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function toArray(
  value
){

  if(
    Array.isArray(value)
  ){

    return value
      .map(
        x =>
          String(
            x ?? ""
          ).trim()
      )
      .filter(Boolean);

  }


  if(
    typeof value ===
    "string"
  ){

    return value
      .split(
        /[、,，;；|\/]/
      )
      .map(
        x => x.trim()
      )
      .filter(Boolean);

  }


  return [];

}


/* =========================================================
   NUMBER
========================================================= */

function toNumber(
  value
){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return null;

  }


  const cleaned =
    String(value)
      .replaceAll(
        ",",
        ""
      )
      .replace(
        "%",
        ""
      )
      .trim();


  const number =
    Number(
      cleaned
    );


  return Number.isFinite(
    number
  )
    ? number
    : null;

}


/* =========================================================
   FORMAT
========================================================= */

function formatNumber(
  value,
  digits = 2
){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(
      value
    )
  ){

    return "—";

  }


  return value.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits:
        digits,

      maximumFractionDigits:
        digits
    }
  );

}


function formatSigned(
  value,
  digits = 2
){

  if(
    value === null ||
    !Number.isFinite(
      value
    )
  ){

    return "—";

  }


  return (
    value > 0
      ? "+"
      : ""
  ) +
  formatNumber(
    value,
    digits
  );

}

    }else if(

      )

/* =========================================================
   OPTIONAL MARKET DATA
========================================================= */

async function loadOptionalMarketData(){

  try{

    const response =
      await fetch(
        OPTIONAL_QUOTE_URL +
        "?v=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      return;

    }


    const json =
      await response.json();


    let rows = [];


    if(
      Array.isArray(
        json
      )
    ){

      rows =
        json;

    }else if(
      Array.isArray(
        json.data
      )
    ){

      rows =
        json.data;

    }else if(
      Array.isArray(
        json.stocks
      )
    ){

      rows =
        json.stocks;

    }


    if(
      !rows.length
    ){

      return;

    }


    const map =
      new Map();


    for(
      const row of rows
    ){

      const item =
        normalizeStock(
          row
        );

      if(
        item.code
      ){

        map.set(
          item.code,
          item
        );

      }

    }


    stockData =
      stockData.map(
        stock => {

          const quote =
            map.get(
              stock.code
            );

          if(!quote){

            return stock;

          }


          return {
            ...stock,

            ...mergeOnlyExistingData(
              stock,
              quote
            )

          };

        }
      );


    runSearch();

  }catch(error){

    /*
      latest.json 尚未建立時
      完全不影響搜尋器。
    */

    console.log(
      "Optional market data not available."
    );

  }

}

/* =========================================================
   SEARCH SCORE
========================================================= */

function scoreStock(
  stock,
  query
){

  const q =
    normalizeText(
      query
    );


  if(!q){

    return 0;

  }


  const code =
    normalizeText(
      stock.code
    );

  const name =
    normalizeText(
      stock.name
    );

  const fullName =
    normalizeText(
      stock.fullName
    );

  const industry =
    normalizeText(
      stock.industry
    );

  const keywords =
    stock.keywords
      .map(
        normalizeText
      );


  let score = 0;


  if(
    code === q
  ){

    score += 10000;

  }


  if(
    name === q
  ){

    score += 9000;

  }


  if(
    fullName === q
  ){

    score += 8500;

  }


  if(
    code.startsWith(q)
  ){

    score += 7000;

  }


  if(
    name.startsWith(q)
  ){

    score += 6800;

  }


  if(
    name.includes(q)
  ){

    score += 5000;

  }


  if(
    fullName.includes(q)
  ){

    score += 4500;

  }


  if(
    keywords.some(
      x =>
        x === q
    )
  ){

    score += 4300;

  }


  if(
    keywords.some(
      x =>
        x.includes(q)
    )
  ){

    score += 3200;

  }


  if(
    industry === q
  ){

    score += 3000;

  }


  if(
    industry.includes(q)
  ){

    score += 2200;

  }


  return score;

}


/* =========================================================
   SEARCH
========================================================= */

function runSearch(){

  currentQuery =
    searchInput.value.trim();


  const market =
    marketFilter.value;

  const type =
    typeFilter.value;


  let list =
    stockData.slice();


  if(market){

    list =
      list.filter(
        item =>
          item.market ===
          market
      );

  }


  if(type){

    list =
      list.filter(
        item =>
          item.type ===
          type
      );

  }


  if(currentQuery){

    const scored =
      list
        .map(
          item => ({

            item,

            score:
              scoreStock(
                item,
                currentQuery
              )

          })
        )
        .filter(
          x =>
            x.score > 0
        );


    scored.sort(
      (a,b) => {

        if(
          b.score !==
          a.score
        ){

          return (
            b.score -
            a.score
          );

        }


        return a.item.code
          .localeCompare(
            b.item.code
          );

      }
    );


    filteredData =
      scored.map(
        x =>
          x.item
      );


  }else{

    filteredData =
      list.slice();

  }


  sortResults();

  renderResults();

}


/* =========================================================
   SORT
========================================================= */

function sortResults(){

  const mode =
    sortFilter.value;


  if(
    mode === "code"
  ){

    filteredData.sort(
      (a,b) =>
        a.code.localeCompare(
          b.code
        )
    );

  }


  if(
    mode === "name"
  ){

    filteredData.sort(
      (a,b) =>
        a.name.localeCompare(
          b.name
        )
    );

  }

}


/* =========================================================
   CHANGE CLASS
========================================================= */

function getChangeClass(
  value
){

  if(
    value === null ||
    !Number.isFinite(
      value
    )
  ){

    return "flat";

  }


  if(
    value > 0
  ){

    return "up";

  }


  if(
    value < 0
  ){

    return "down";

  }


  return "flat";

}


/* =========================================================
   MA GAP
========================================================= */

function getMAGap(
  price,
  ma
){

  if(
    price === null ||
    ma === null ||
    !Number.isFinite(price) ||
    !Number.isFinite(ma) ||
    ma === 0
  ){

    return null;

  }


  return (
    (
      price -
      ma
    ) /
    ma
  ) *

/* =========================================================
   MA ITEM
========================================================= */

function createMAItem(
  name,
  ma,
  price
){

  const gap =
    getMAGap(
      price,
      ma
    );


  let cls =
    "gap-flat";


  if(
    gap !== null
  ){

    if(
      gap > 0
    ){

      cls =
        "gap-up";

    }else if(
      gap < 0
    ){

      cls =
        "gap-down";

    }

  }


  return `

    <div class="ma-item">

      <div class="ma-name">
        ${name}
      </div>

      <div class="ma-value">
        ${formatNumber(ma)}
      </div>

      <div class="ma-gap ${cls}">
        ${
          gap === null
            ? "乖離 —"
            :
              (
                gap > 0
                  ? "+"
                  : ""
              ) +
              formatNumber(
                gap,
                2
              ) +
              "%"
        }
      </div>

    </div>

  `;

}


/* =========================================================
   TREND
========================================================= */

function getTrend(
  stock
){

  const ma = [

    stock.ma5,
    stock.ma11,
    stock.ma31,
    stock.ma62,
    stock.ma122,
    stock.ma242

  ].filter(
    x =>
      Number.isFinite(x)
  );


  if(
    ma.length < 3
  ){

    return {
      text:"等待均線資料",
      class:"neutral"
    };

  }


  let bullish = true;
  let bearish = true;


  for(
    let i=0;
    i<ma.length-1;
    i++
  ){

    if(
      ma[i] <=
      ma[i+1]
    ){

      bullish =
        false;

    }


    if(
      ma[i] >=
      ma[i+1]
    ){

      bearish =
        false;

    }

  }


  if(
    bullish
  ){

    return {
      text:"多頭排列",
      class:"bull"
    };

  }


  if(
    bearish
  ){

    return {
      text:"空頭排列",
      class:"bear"
    };

  }


  return {
    text:"均線整理",
    class:"neutral"
  };

}

function getPEAssessment(

){

  if(
    pe === null ||
    !Number.isFinite(pe)

  }


  /*
    這裡只是通用區間提示，
    不是投資保證。
  */

  if(
    pe <= 12
  ){

    return `

    `;

  }


  if(
    pe <= 20
  ){

    `;

  }


  return `
    <span class="expensive">
      ③ 偏貴
    </span>
  `;

}


/* =========================================================
   INSTITUTIONAL
========================================================= */

function netValue(
  buy,
  sell,
  net
){

  if(
    Number.isFinite(net)
  ){

    return net;

  }


  if(
    Number.isFinite(buy) &&
    Number.isFinite(sell)
  ){

    return buy - sell;

  }


  return null;

}


function netClass(
  value
){

  if(
    value === null
  ){

    return "net-flat";

  }


  if(
    value > 0
  ){

    return "net-positive";

  }


  if(
    value < 0
  ){

    return "net-negative";

  }


  return "net-flat";

}

function toggleFavorite(
  stock
){

  let list =
    getFavorites();


  const index =
    list.findIndex(
      item =>
        item.code ===
          stock.code &&
        item.market ===
          stock.market
    );


  if(
    index >= 0
  ){

    list.splice(
      index,
      1
    );

  }else{

    list.unshift({

      code:
        stock.code,

      name:
        stock.name,

      market:
        stock.market,

      type:
        stock.type,

      industry:
        stock.industry

    });


    if(
      list.length >
      100
    ){

      list =
        list.slice(
          0,
          100
        );

    }

  }


  saveFavorites(
    list

      )],

    ["賣量",
      formatNumber(
        stock.askVolume,
        0
      )],

    ["內盤",
      formatNumber(
        stock.inner,
        0
      )],

    ["外盤",
      formatNumber(
        stock.outer,
        0
      )],

    ["漲停",
      formatNumber(
        stock.upperLimit
      )],

    ["跌停",
      formatNumber(
        stock.lowerLimit
      )],

    ["PE",
      formatNumber(
        stock.pe
      )]

  ];


  detailGrid.innerHTML =
    fields
      .map(
        ([label,value]) => `

          <div class="detail-box">

            <div class="detail-label">
              ${escapeHTML(
                label
              )}
            </div>

            <div class="detail-value">
              ${escapeHTML(
                value || "—"
              )}
            </div>

          </div>

        `
      )
      .join("");


  modalQuote.innerHTML =
    buildQuote(
      stock
    );


  modalTechnical.innerHTML =
    buildTechnical(
      stock
    );


  modalInstitution.innerHTML =
    buildInstitutional(
      stock
    );


  detailModal.classList.add(
    "show"
  );


  document.body.style.overflow =
    "hidden";

}


/* =========================================================
   CLOSE
========================================================= */

function closeDetail(){

  detailModal.classList.remove(
    "show"
  );

  document.body.style.overflow =
    "";

}


closeModalBtn.addEventListener(
  "click",
  closeDetail
);


detailModal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      detailModal
    ){

      closeDetail();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      closeDetail();

    }

  }
);


/* =========================================================
   STATE
========================================================= */

function showState(
  title,
  text
){

  stateTitle.textContent =
    title;

  stateText.textContent =
    text;

  state.style.display =
    "block";

}


function hideState(){

  state.style.display =
    "none";

}


/* =========================================================
   CLEAR
========================================================= */

function updateClear(){

  if(
    searchInput.value.trim()
  ){

    clearBtn.classList.add(
      "show"
    );

  }else{

    clearBtn.classList.remove(
      "show"
    );

  }

}


/* =========================================================
   EVENTS
========================================================= */

searchInput.addEventListener(
  "input",
  () => {

    updateClear();

    runSearch();

  }
);


clearBtn.addEventListener(
  "click",
  () => {

    searchInput.value =
      "";

    updateClear();

    runSearch();

    searchInput.focus();

  }
);


marketFilter.addEventListener(
  "change",
  runSearch
);


typeFilter.addEventListener(
  "change",
  runSearch
);


sortFilter.addEventListener(
  "change",
  runSearch
);


/* =========================================================
   QUICK SEARCH
========================================================= */

document
  .querySelectorAll(
    "[data-search]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          searchInput.value =
            button.dataset.search;

          updateClear();

          runSearch();

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }
      );

    }
  );


/* =========================================================
   NAV
========================================================= */

document
  .querySelectorAll(
    ".nav-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".nav-btn"
            )
            .forEach(
              btn =>
                btn.classList
                  .remove(
                    "active"
                  )
            );


          button.classList.add(
            "active"
          );


          const nav =
            button.dataset.nav;


          if(
            nav === "search"
          ){

            window.scrollTo({
              top:0,
              behavior:"smooth"
            });

          }


          if(
            nav === "favorite"
          ){

            document
              .getElementById(
                "favoriteSection"
              )
              .scrollIntoView({
                behavior:"smooth"
              });

          }


          if(
            nav === "recent"
          ){

            document
              .getElementById(
                "recentSection"
              )
              .scrollIntoView({
                behavior:"smooth"
              });

          }


          if(
            nav === "chip"
          ){

            const firstCard =
              document
                .querySelector(
                  ".institution-box"
                );

            if(firstCard){

              firstCard.scrollIntoView({
                behavior:"smooth"
              });

            }

          }

        }
      );

    }
  );


/* =========================================================
   START
========================================================= */

loadData();

</script>

</body>
</html>

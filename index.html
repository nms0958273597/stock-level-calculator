<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📈 股票關卡計算機</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f5f8;
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
color:#111
}

.wrap{
max-width:720px;
margin:auto;
padding:16px
}

.title{
text-align:center;
font-size:30px;
font-weight:900;
margin:15px 0 5px
}

.sub{
text-align:center;
color:#666;
margin-bottom:18px
}

.card{
background:#fff;
border-radius:22px;
padding:18px;
margin:14px 0;
box-shadow:0 5px 20px rgba(0,0,0,.07)
}

label{
display:block;
font-size:17px;
font-weight:800;
margin:10px 0 7px
}

input{
width:100%;
height:56px;
padding:12px 15px;
border:2px solid #d8dce1;
border-radius:14px;
background:#fff;
color:#111;
font-size:20px;
outline:none;
-webkit-appearance:none;
appearance:none
}

input:focus{
border-color:#222
}

.search{
display:grid;
grid-template-columns:1fr 110px;
gap:10px
}

button{
height:56px;
border:0;
border-radius:14px;
font-size:18px;
font-weight:900
}

.black{
background:#222;
color:#fff
}

.gray{
background:#eef1f5;
color:#111
}

.status{
margin-top:12px;
padding:14px;
background:#f5f5f5;
border-radius:14px;
font-weight:800
}

.quote{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.q{
background:#f6f7f9;
border-radius:14px;
padding:13px;
min-height:85px
}

.q span{
display:block;
color:#666;
font-size:14px
}

.q b{
display:block;
font-size:21px;
margin-top:7px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.levels{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:12px
}

.level{
padding:15px;
border-radius:15px
}

.level span{
display:block
}

.level strong{
display:block;
font-size:25px;
margin-top:7px
}

.green{background:#e9f8ef}
.redbox{background:#fff0f0}
.blue{background:#edf5ff}
.gold{background:#fff7dc}

.row{
display:flex;
gap:10px
}

.row>*{
flex:1
}

@media(max-width:520px){
.title{font-size:26px}
}
</style>
</head>

<body>

<div class="wrap">

<div class="title">
📈 股票關卡計算機
</div>

<div class="sub">
股票查詢・🐰仙兔關卡・成本計算
</div>

<div class="card">

<label>🔎 股票代號／名稱</label>

<div class="search">

<input
id="code"
type="text"
inputmode="text"
placeholder="例如 2330、1326、台化"
>

<button
class="black"
onclick="queryStock()">
查詢
</button>

</div>

<div
id="status"
class="status">
尚未查詢
</div>

</div>


<div class="card">

<div class="quote">

<div class="q">
<span>股票名稱</span>
<b id="name">--</b>
</div>

<div class="q">
<span>代號</span>
<b id="symbol">--</b>
</div>

<div class="q">
<span>現價</span>
<b id="price">--</b>
</div>

<div class="q">
<span>昨收</span>
<b id="prev">--</b>
</div>

<div class="q">
<span>開盤</span>
<b id="open">--</b>
</div>

<div class="q">
<span>最高／最低</span>
<b id="highlow">--</b>
</div>

<div class="q">
<span>成交量</span>
<b id="volume">--</b>
</div>

<div class="q">
<span>買一／賣一</span>
<b id="bidask">--</b>
</div>

<div class="q">
<span>更新時間</span>
<b id="time">--</b>
</div>

</div>

</div>


<div class="card">

<h2>🐰 仙兔關卡</h2>

<div style="color:#777;font-size:14px">
👇 下面白色欄位都可以直接輸入數字
</div>

<div class="grid">

<div>
<label>成本價</label>
<input
id="cost"
type="text"
inputmode="decimal"
placeholder="例如 36.30">
</div>

<div>
<label>止盈 %</label>
<input
id="take"
type="text"
inputmode="decimal"
value="6">
</div>

<div>
<label>止損 %</label>
<input
id="stop"
type="text"
inputmode="decimal"
value="3">
</div>

<div>
<label>突破 %</label>
<input
id="breakout"
type="text"
inputmode="decimal"
value="2">
</div>

<div>
<label>跌破注意 %</label>
<input
id="breakdown"
type="text"
inputmode="decimal"
value="2">
</div>

<div>
<label>目標本益比</label>
<input
id="pe"
type="text"
inputmode="decimal"
value="15">
</div>

</div>

<div class="row" style="margin-top:12px">

<button
class="gray"
onclick="clearCost()">
清除成本
</button>

<button
class="black"
onclick="calculate()">
🎯 開始計算
</button>

</div>

<div
id="levels"
class="levels">
</div>

</div>


<div class="card">

<h2>🌍 籌碼／估值</h2>

<div class="grid">

<div>
<label>外資（張）</label>
<input
id="foreign"
type="text"
inputmode="numeric"
placeholder="可輸入">
</div>

<div>
<label>融資（張）</label>
<input
id="margin"
type="text"
inputmode="numeric"
placeholder="可輸入">
</div>

<div>
<label>預估 EPS</label>
<input
id="eps"
type="text"
inputmode="decimal"
placeholder="例如 12">
</div>

<div>
<label>營收目標價</label>
<input
id="target"
type="text"
inputmode="decimal"
placeholder="例如 48">
</div>

</div>

<div
id="valuation"
class="status">
尚未計算
</div>

</div>

</div>


<script>

const names={
"2330":"台積電",
"1326":"台化",
"2303":"聯電",
"2618":"長榮航",
"2367":"燿華",
"2313":"華通",
"3491":"昇達科",
"3481":"群創",
"8046":"南電",
"2308":"台達電",
"3711":"日月光"
};

const aliases={
"台積電":"2330",
"台化":"1326",
"聯電":"2303",
"長榮航":"2618",
"燿華":"2367",
"華通":"2313",
"昇達科":"3491",
"群創":"3481",
"南電":"8046",
"台達電":"2308",
"日月光":"3711"
};

let currentStock=null;


function number(id){

const el=document.getElementById(id);

if(!el)return null;

const value=
el.value
.trim()
.replace(/,/g,"");

if(value==="")return null;

const n=Number(value);

return Number.isFinite(n)?n:null;

}


function money(value){

if(
value===null||
value===undefined||
value===""||
value==="-"
){
return "--";
}

const n=Number(value);

if(!Number.isFinite(n)){
return "--";
}

return n.toFixed(2);

}


function queryStock(){

let code=
document
.getElementById("code")
.value
.trim();


if(aliases[code]){

code=aliases[code];

document
.getElementById("code")
.value=code;

}


if(!names[code]){

document
.getElementById("status")
.innerText=
"⚠️ 請輸入支援的股票代號";

return;

}


currentStock={
code:code,
name:names[code]
};


document
.getElementById("name")
.innerText=
names[code];

document
.getElementById("symbol")
.innerText=
code;


document
.getElementById("status")
.innerText=
"✅ 已找到 "+
names[code]+
"（"+code+"）";


calculate();

}


function calculate(){

const cost=
number("cost");


if(cost===null){

document
.getElementById("levels")
.innerHTML=
`
<div class="level">
<span>⚠️ 提示</span>
<strong>請先輸入成本價</strong>
</div>
`;

return;

}


const take=
number("take")??6;

const stop=
number("stop")??3;

const breakout=
number("breakout")??2;

const breakdown=
number("breakdown")??2;


const takePrice=
cost*(1+take/100);

const stopPrice=
cost*(1-stop/100);

const breakoutPrice=
cost*(1+breakout/100);

const breakdownPrice=
cost*(1-breakdown/100);


document
.getElementById("levels")
.innerHTML=
`
<div class="level green">
<span>🥕 第一止盈</span>
<strong>${money(takePrice)}</strong>
</div>

<div class="level redbox">
<span>🛑 止損</span>
<strong>${money(stopPrice)}</strong>
</div>

<div class="level blue">
<span>🚀 突破確認</span>
<strong>${money(breakoutPrice)}</strong>
</div>

<div class="level gold">
<span>⚠️ 跌破注意</span>
<strong>${money(breakdownPrice)}</strong>
</div>
`;


const eps=
number("eps");

const pe=
number("pe");

const target=
number("target");


let result="尚未計算";


if(
eps!==null&&
pe!==null
){

result=
"PE估值："+money(eps*pe);

}


if(target!==null){

if(result!=="尚未計算"){
result+="｜";
}else{
result="";
}

result+=
"營收目標價："+money(target);

}


document
.getElementById("valuation")
.innerText=
result;

}


function clearCost(){

document
.getElementById("cost")
.value="";

document
.getElementById("levels")
.innerHTML="";

document
.getElementById("cost")
.focus();

}


document
.getElementById("code")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
queryStock();
}

});


[
"cost",
"take",
"stop",
"breakout",
"breakdown",
"pe",
"eps",
"target"
].forEach(
function(id){

const el=
document.getElementById(id);

if(el){

el.addEventListener(
"input",
calculate
);

}

});

</script>

</body>
</html>

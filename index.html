<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票關卡計算機</title>
<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  background:#f5f7fa;
  margin:0;
  padding:20px;
  color:#222;
}
.container{
  max-width:600px;
  margin:auto;
}
h1{
  text-align:center;
  margin-bottom:20px;
}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}
label{
  display:block;
  font-weight:bold;
  margin-top:14px;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:18px;
}
button{
  width:100%;
  padding:16px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#1677ff;
  color:white;
  font-size:20px;
  font-weight:bold;
}
.result{
  font-size:18px;
  line-height:1.8;
}
.green{color:#168a3a;font-weight:bold;}
.red{color:#d93025;font-weight:bold;}
.blue{color:#1677ff;font-weight:bold;}
</style>
</head>

<body>
<div class="container">

<h1>📊 股票關卡計算機</h1>

<div class="card">

<label>股票名稱</label>
<input id="name" placeholder="例如：台化">

<label>現價</label>
<input id="price" type="number" step="0.01" placeholder="例如：36.29">

<label>主力成本</label>
<input id="mainCost" type="number" step="0.01" placeholder="例如：36.30">

<label>三大法人平均成本</label>
<input id="institutionCost" type="number" step="0.01" placeholder="例如：36.10">

<label>前低／重要支撐</label>
<input id="support" type="number" step="0.01" placeholder="例如：35.50">

<button onclick="calculate()">開始計算</button>

</div>

<div class="card result" id="result">
請輸入資料後按「開始計算」
</div>

</div>

<script>
function calculate(){

  const name = document.getElementById("name").value || "股票";
  const price = Number(document.getElementById("price").value);
  const mainCost = Number(document.getElementById("mainCost").value);
  const institutionCost = Number(document.getElementById("institutionCost").value);
  const support = Number(document.getElementById("support").value);

  if(!price){
    document.getElementById("result").innerHTML =
    "⚠️ 請先輸入現價";
    return;
  }

  const stopLoss = support ? support * 0.98 : price * 0.97;

  const take1 = price * 1.05;
  const take2 = price * 1.10;
  const take3 = price * 1.15;

  const mainDiff = mainCost ?
    ((price-mainCost)/mainCost*100) : 0;

  const institutionDiff = institutionCost ?
    ((price-institutionCost)/institutionCost*100) : 0;

  let advice = "";

  if(mainCost && price < mainCost){
    advice = "🟢 現價低於主力成本，可觀察支撐後分批進場";
  }else if(mainCost && price >= mainCost){
    advice = "🟡 現價已在主力成本附近或上方，不宜追高";
  }

  document.getElementById("result").innerHTML = `
  <h2>${name}</h2>

  <p>💰 現價：
  <span class="blue">${price.toFixed(2)}</span></p>

  <p>🎯 主力成本：
  <span>${mainCost ? mainCost.toFixed(2) : "未輸入"}</span></p>

  <p>🏦 三大法人成本：
  <span>${institutionCost ? institutionCost.toFixed(2) : "未輸入"}</span></p>

  <hr>

  <p>📊 現價 vs 主力成本：
  <span class="${mainDiff >= 0 ? 'green':'red'}">
  ${mainCost ? mainDiff.toFixed(2)+"%" : "—"}
  </span></p>

  <p>🏦 現價 vs 法人成本：
  <span class="${institutionDiff >= 0 ? 'green':'red'}">
  ${institutionCost ? institutionDiff.toFixed(2)+"%" : "—"}
  </span></p>

  <hr>

  <p>🛑 停損參考：
  <span class="red">${stopLoss.toFixed(2)}</span></p>

  <p>🎯 第一止盈：
  <span class="green">${take1.toFixed(2)}</span></p>

  <p>🎯 第二止盈：
  <span class="green">${take2.toFixed(2)}</span></p>

  <p>🎯 第三止盈：
  <span class="green">${take3.toFixed(2)}</span></p>

  <hr>

  <p><b>${advice}</b></p>
  `;
}
</script>

</body>
</html>

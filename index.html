<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>股票關卡計算機</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#222}
.container{max-width:600px;margin:auto}
h1{text-align:center;margin:10px 0 20px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #0001}
label{display:block;font-weight:600;margin:12px 0 6px}
input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:18px}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#1677ff;color:white;font-size:18px;font-weight:bold;margin-top:18px}
.result{font-size:20px;line-height:1.8}
.green{color:#16803c}.red{color:#d33}
.small{color:#777;font-size:14px}
</style>
</head>

<body>
<div class="container">

<h1>📈 股票關卡計算機</h1>

<div class="card">
<label>股票現價</label>
<input id="price" type="number" step="0.01" placeholder="例如 36.30">

<label>成本價</label>
<input id="cost" type="number" step="0.01" placeholder="例如 36.30">

<label>上漲／下跌百分比</label>
<input id="percent" type="number" step="0.1" value="10">

<button onclick="calculate()">開始計算</button>
</div>

<div class="card result" id="result">
請輸入資料後按「開始計算」
</div>

</div>

<script>
function calculate(){
  const price=Number(document.getElementById("price").value);
  const cost=Number(document.getElementById("cost").value);
  const p=Number(document.getElementById("percent").value);

  if(!price || !cost){
    document.getElementById("result").innerHTML="⚠️ 請輸入現價與成本價";
    return;
  }

  const up=price*(1+p/100);
  const down=price*(1-p/100);
  const profit=(price-cost)/cost*100;

  document.getElementById("result").innerHTML=`
    <b>📊 計算結果</b><br><br>
    現價：<b>${price.toFixed(2)}</b><br>
    成本：<b>${cost.toFixed(2)}</b><br>
    <span class="${profit>=0?'green':'red'}">
    目前報酬率：<b>${profit.toFixed(2)}%</b>
    </span>
    <hr>
    📈 上漲 ${p}%：<b>${up.toFixed(2)}</b><br>
    📉 下跌 ${p}%：<b>${down.toFixed(2)}</b>
  `;
}
</script>

</body>
</html>

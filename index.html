<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>股票自動查詢＋關卡分析</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  background:#f3f5f7;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",
  "PingFang TC",sans-serif;
}

.container{
  max-width:620px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:27px;
  margin:10px 0 22px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

label{
  display:block;
  margin-top:12px;
  font-weight:700;
}

input{
  width:100%;
  padding:13px;
  margin-top:7px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:17px;
}

button{
  width:100%;
  padding:15px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#222;
  color:#fff;
  font-size:18px;
  font-weight:700;
}

button:active{
  opacity:.75;
}

.result{
  margin-top:15px;
  padding:16px;
  background:#f7f7f7;
  border-radius:12px;
  font-size:18px;
}

.level{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.green{
  color:#07943a;
  font-weight:700;
}

.red{
  color:#d52626;
  font-weight:700;
}

.orange{
  color:#d97706;
  font-weight:700;
}

.blue{
  color:#1769d2;
  font-weight:700;
}

.gray{
  color:#777;
}

.small{
  font-size:13px;
  color:#777;
  line-height:1.6;
}

.loading{
  text-align:center;
  padding:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 股票自動查詢＋關卡分析</h1>

<div class="card">

<label>🔎 股票代號或股票名稱</label>

<input
  id="query"
  placeholder="例如：1326 或 台化"
  autocomplete="off"
>

<button onclick="searchStock()">
🔍 查詢股票
</button>

<div id="status" class="loading">
請輸入股票代號或股票名稱
</div>

</div>


<div class="card">

<h2>📈 股票資訊</h2>

<div id="stockResult" class="result">
尚未查詢
</div>

</div>


<div class="card">

<h2>💰 我的交易設定</h2>

<label>我的成本</label>
<input id="cost" type="number" step="0.01" placeholder="例如：58.50">

<label>第一止盈％</label>
<input id="profit1" type="number" step="0.1" value="5">

<label>第二止盈％</label>
<input id="profit2" type="number" step="0.1" value="10">

<label>停損％</label>
<input id="loss" type="number" step="0.1" value="3">

<button onclick="calculateLevels()">
🎯 計算股票關卡
</button>

</div>


<div class="card">

<h2>🎯 股票關卡</h2>

<div id="levels" class="result">
查詢股票後，再輸入成本即可計算。
</div>

</div>


<div class="card">

<h2>📌 使用方式</h2>

<div class="small">

① 輸入股票代號，例如 <b>1326</b><br><br>

或輸入股票名稱，例如 <b>台化</b><br><br>

② 按「查詢股票」<br><br>

③ 網站自動取得股價<br><br>

④ 輸入你的成本<br><br>

⑤ 按「計算股票關卡」

</div>

</div>

</div>


<script>

/* =========================
   台股股票清單
========================= */

let stockList = [];


/* =========================
   取得上市股票清單
========================= */

async function loadStockList(){

  try{

    const url =
      "https://openapi.twse.com.tw/v1/opendata/t187ap03_L";

    const response = await fetch(url);

    if(!response.ok){
      throw new Error("股票清單取得失敗");
    }

    stockList = await response.json();

  }catch(error){

    console.log("股票清單暫時無法取得",error);

  }

}


/* =========================
   搜尋股票
========================= */

async function searchStock(){

  const q =
    document.getElementById("query").value.trim();

  if(!q){

    showStatus("⚠️ 請輸入股票代號或股票名稱");

    return;
  }

  showStatus("⏳ 正在查詢股票...");

  try{

    /*
      如果輸入4碼數字，
      直接當股票代號
    */

    let code = "";

    if(/^\d{4,6}$/.test(q)){

      code = q;

    }else{

      /*
        如果輸入中文名稱，
        從上市股票清單找
      */

      if(stockList.length === 0){

        await loadStockList();

      }

      const found =
        stockList.find(item => {

          const number =
            item["有價證券代號及名稱"] || "";

          const parts =
            number.split(/\s+/);

          return (
            number.includes(q) ||
            parts.includes(q)
          );

        });

      if(found){

        const text =
          found["有價證券代號及名稱"];

        const match =
          text.match(/^(\d{4,6})/);

        if(match){

          code = match[1];

        }

      }

    }


    if(!code){

      showStatus(
        "❌ 找不到這支股票，請輸入股票代號或完整股票名稱"
      );

      return;

    }


    await getStockPrice(code);

  }catch(error){

    console.error(error);

    showStatus(
      "❌ 查詢失敗，請稍後再試"
    );

  }

}


/* =========================
   取得股價
========================= */

async function getStockPrice(code){

  const url =
    "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_" +
    code +
    ".tw&json=1&delay=0";

  const response =
    await fetch(url);

  if(!response.ok){

    throw new Error("股價取得失敗");

  }

  const data =
    await response.json();

  if(
    !data.msgArray ||
    data.msgArray.length === 0
  ){

    throw new Error("找不到股價");

  }

  const s =
    data.msgArray[0];


  const name =
    s.n || code;

  const yesterday =
    Number(s.y);

  /*
    z = 最新成交價
    若盤中沒有成交，
    使用昨收
  */

  let price =
    Number(s.z);

  if(!price || price <= 0){

    price = yesterday;

  }


  const change =
    price - yesterday;

  const changePercent =
    yesterday > 0
      ? (change / yesterday) * 100
      : 0;


  window.currentStock = {

    code:code,

    name:name,

    price:price,

    yesterday:yesterday,

    change:change,

    changePercent:changePercent

  };


  let changeClass = "gray";

  if(change > 0){

    changeClass = "green";

  }else if(change < 0){

    changeClass = "red";

  }


  document.getElementById("stockResult").innerHTML = `

    <div class="level">

      📌 股票：

      <b>${name}</b>

      <span class="gray">
      ${code}
      </span>

    </div>


    <div class="level">

      💰 最新股價：

      <span class="blue">

      ${price.toFixed(2)}

      </span>

    </div>


    <div class="level">

      ↕️ 漲跌：

      <span class="${changeClass}">

      ${change >= 0 ? "+" : ""}
      ${change.toFixed(2)}

      </span>

    </div>


    <div class="level">

      📊 漲跌幅：

      <span class="${changeClass}">

      ${changePercent >= 0 ? "+" : ""}
      ${changePercent.toFixed(2)}%

      </span>

    </div>


    <div class="small">

      昨日收盤：${yesterday.toFixed(2)}

    </div>

  `;


  showStatus(
    `✅ 已找到 ${name}（${code}）`
  );


  /*
    自動計算預設進場關卡
  */

  autoEntry(price);

}


/* =========================
   自動進場建議
========================= */

function autoEntry(price){

  const entry1 =
    price * 0.98;

  const entry2 =
    price * 0.95;


  document.getElementById("levels").innerHTML = `

    <div class="level">

      🟢 第一進場：

      <span class="green">

      ${entry1.toFixed(2)}

      </span>

    </div>


    <div class="level">

      🟢 第二進場：

      <span class="green">

      ${entry2.toFixed(2)}

      </span>

    </div>


    <div class="small">

      目前先以最新股價估算進場位置。
      後續可以再加入支撐、K線與籌碼判斷。

    </div>

  `;

}


/* =========================
   計算完整關卡
========================= */

function calculateLevels(){

  if(!window.currentStock){

    alert("請先查詢股票");

    return;

  }


  const price =
    window.currentStock.price;

  const cost =
    Number(
      document.getElementById("cost").value
    );


  if(!cost || cost <= 0){

    alert("請輸入你的成本");

    return;

  }


  const profit1 =
    Number(
      document.getElementById("profit1").value
    ) || 5;


  const profit2 =
    Number(
      document.getElementById("profit2").value
    ) || 10;


  const loss =
    Number(
      document.getElementById("loss").value
    ) || 3;


  const entry1 =
    price * 0.98;


  const entry2 =
    price * 0.95;


  const takeProfit1 =
    cost * (1 + profit1 / 100);


  const takeProfit2 =
    cost * (1 + profit2 / 100);


  const stopLoss =
    cost * (1 - loss / 100);


  const profitPercent =
    ((price - cost) / cost) * 100;


  let status = "";


  if(profitPercent > 0){

    status =
      `目前獲利 <span class="green">
      +${profitPercent.toFixed(2)}%
      </span>`;

  }else if(profitPercent < 0){

    status =
      `目前虧損 <span class="red">
      ${profitPercent.toFixed(2)}%
      </span>`;

  }else{

    status =
      "目前剛好打平";

  }


  document.getElementById("levels").innerHTML = `

    <div class="level">

      💰 自動股價：

      <span class="blue">

      ${price.toFixed(2)}

      </span>

    </div>


    <div class="level">

      🧾 我的成本：

      <b>${cost.toFixed(2)}</b>

      <br>

      ${status}

    </div>


    <hr>


    <div class="level">

      🟢 第一進場：

      <span class="green">

      ${entry1.toFixed(2)}

      </span>

    </div>


    <div class="level">

      🟢 第二進場：

      <span class="green">

      ${entry2.toFixed(2)}

      </span>

    </div>


    <div class="level">

      💰 第一止盈：

      <span class="orange">

      ${takeProfit1.toFixed(2)}

      </span>

      <br>

      <span class="small">

      成本＋${profit1}%

      </span>

    </div>


    <div class="level">

      💰 第二止盈：

      <span class="orange">

      ${takeProfit2.toFixed(2)}

      </span>

      <br>

      <span class="small">

      成本＋${profit2}%

      </span>

    </div>


    <div class="level">

      🛑 停損：

      <span class="red">

      ${stopLoss.toFixed(2)}

      </span>

      <br>

      <span class="small">

      成本－${loss}%

      </span>

    </div>

  `;

}


/* =========================
   顯示狀態
========================= */

function showStatus(text){

  document.getElementById("status").innerHTML =
    text;

}


/* =========================
   開啟網頁時準備股票清單
========================= */

loadStockList();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>股票關卡計算機 V7</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f4f6;
font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Arial,sans-serif;
color:#222;
}

.container{
max-width:900px;
margin:auto;
padding:22px 14px 70px;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:32px;
margin:0;
font-weight:900;
}

.header p{
font-size:17px;
color:#777;
margin:8px 0 0;
}

.card{
background:white;
border-radius:28px;
padding:22px;
margin-bottom:18px;
box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.label{
font-size:20px;
font-weight:900;
margin-bottom:12px;
}

.search{
display:flex;
gap:12px;
}

input{
width:100%;
border:2px solid #d9dde3;
border-radius:20px;
padding:17px;
font-size:23px;
outline:none;
}

input:focus{
border-color:#222;
}

button{
border:0;
border-radius:18px;
background:#222;
color:#fff;
font-size:19px;
font-weight:900;
padding:0 28px;
min-height:56px;
}

button:active{
transform:scale(.97);
}

.status{
margin-top:14px;
padding:15px;
border-radius:18px;
background:#f1f2f4;
font-size:17px;
font-weight:800;
}

.status.ok{
background:#e7f8ec;
color:#15803d;
}

.status.error{
background:#fff0f0;
color:#d02020;
}

.title{
font-size:25px;
font-weight:900;
margin-bottom:16px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:13px;
}

.box{
background:#f5f6f8;
border-radius:21px;
padding:18px;
min-height:108px;
}

.box small{
display:block;
font-size:17px;
color:#777;
}

.value{
margin-top:9px;
font-size:25px;
font-weight:900;
}

.big{
font-size:34px;
}

.red{
color:#df2727;
}

.green{
color:#07843c;
}

.cost-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:13px;
}

.cost{
background:#f5f6f8;
border-radius:20px;
padding:17px;
}

.cost input{
margin-top:8px;
font-size:21px;
}

.levels{
display:grid;
gap:11px;
}

.level{
display:flex;
justify-content:space-between;
align-items:center;
background:#f5f6f8;
border-radius:20px;
padding:18px;
}

.level-name{
font-size:19px;
font-weight:900;
}

.level-value{
font-size:24px;
font-weight:900;
}

.lucky{
background:#fff7d5;
border-radius:20px;
padding:20px;
text-align:center;
font-size:20px;
font-weight:900;
}

.actions{
display:flex;
gap:10px;
margin-top:14px;
}

.lucky-btn{
background:#e5a300;
}

.clear-btn{
background:#e5e7eb;
color:#222;
}

.footer{
text-align:center;
color:#999;
font-size:14px;
margin-top:25px;
}

@media(max-width:600px){

.header h1{
font-size:28px;
}

.header p{
font-size:15px;
}

.card{
padding:18px;
}

.search{
flex-direction:column;
}

.search button{
width:100%;
}

.box{
padding:15px;
}

.box small{
font-size:15px;
}

.value{
font-size:21px;
}

.big{
font-size:29px;
}

.level-value{
font-size:21px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>📈 股票關卡計算機 V7</h1>
<p>即時行情・5秒更新・🐰仙兔關卡・成本計算</p>
</div>


<!-- 查詢 -->

<div class="card">

<div class="label">
🔎 股票代號／名稱
</div>

<div class="search">

<input
id="stockInput"
value="1326"
placeholder="例如：2330"
/>

<button onclick="searchStock()">
查詢
</button>

</div>

<div id="status" class="status">
📡 尚未連線行情
</div>

</div>


<!-- 行情 -->

<div class="card">

<div class="title">
📡 即時行情
</div>

<div class="grid">

<div class="box">
<small>股票名稱</small>
<div id="name" class="value">--</div>
</div>

<div class="box">
<small>代號</small>
<div id="code" class="value">--</div>
</div>

<div class="box">
<small>現價</small>
<div id="price" class="value big">--</div>
</div>

<div class="box">
<small>昨收</small>
<div id="yesterday" class="value">--</div>
</div>

<div class="box">
<small>今日開盤</small>
<div id="open" class="value">--</div>
</div>

<div class="box">
<small>今日收盤</small>
<div id="close" class="value">--</div>
</div>

<div class="box">
<small>最高／最低</small>
<div id="highlow" class="value">--</div>
</div>

<div class="box">
<small>成交量</small>
<div id="volume" class="value">--</div>
</div>

<div class="box">
<small>買一</small>
<div id="bid" class="value">--</div>
</div>

<div class="box">
<small>賣一</small>
<div id="ask" class="value">--</div>
</div>

</div>

</div>


<!-- 成本 -->

<div class="card">

<div class="title">
💰 成本／月線
</div>

<div class="cost-grid">

<div class="cost">

<small>我的成本價</small>

<input
id="cost"
type="number"
step="0.01"
placeholder="例如 36.30"
oninput="calculate()"
/>

</div>


<div class="cost">

<small>📈 月線（20MA）</small>

<div id="ma20" class="value">
--
</div>

</div>


<div class="cost">

<small>目前損益</small>

<div id="profit" class="value">
--
</div>

</div>


<div class="cost">

<small>損益幅度</small>

<div id="profitPercent" class="value">
--
</div>

</div>

</div>

</div>


<!-- 仙兔 -->

<div class="card">

<div class="title">
🐰 仙兔關卡
</div>

<div class="levels">

<div class="level">
<div class="level-name">🥕 第一關</div>
<div id="level1" class="level-value">--</div>
</div>

<div class="level">
<div class="level-name">🥕 第二關</div>
<div id="level2" class="level-value">--</div>
</div>

<div class="level">
<div class="level-name">🥕 第三關</div>
<div id="level3" class="level-value">--</div>
</div>

<div class="level">
<div class="level-name">🛡️ 月線支撐</div>
<div id="support" class="level-value">--</div>
</div>

<div class="level">
<div class="level-name">⚠️ 跌破警戒</div>
<div id="warning" class="level-value">--</div>
</div>

<div class="level">
<div class="level-name">🎯 目標價</div>
<div id="target" class="level-value">--</div>
</div>

</div>

</div>


<!-- 幸運 -->

<div class="card">

<div class="title">
🍀 幸運股票
</div>

<div id="lucky" class="lucky">
🐰 仙兔祝你股市順利、一路上漲！
</div>

<div class="actions">

<button class="lucky-btn" onclick="lucky()">
🍀 送幸運
</button>

<button class="clear-btn" onclick="clearAll()">
🧹 清除股票
</button>

</div>

</div>


<div class="footer">
股票關卡計算機 V7
</div>

</div>


<script>

let data=null;
let timer=null;


/* ==========================
   查詢股票
========================== */

async function searchStock(){

const stock=document
.getElementById("stockInput")
.value
.trim();

if(!stock){

setStatus(
"❌ 請輸入股票代號",
"error"
);

return;
}

setStatus(
"📡 正在連線行情...",
""
);

try{

/*
上市行情
*/

let url=
"https://mis.twse.com.tw/stock/api/getStockInfo.jsp"+
"?ex_ch=tse_"+stock+".tw"+
"&json=1"+
"&delay=0"+
"&_="+Date.now();

let res=await fetch(url);

let json=await res.json();


/*
如果上市查不到
改查上櫃
*/

if(
!json.msgArray||
json.msgArray.length===0
){

url=
"https://mis.twse.com.tw/stock/api/getStockInfo.jsp"+
"?ex_ch=otc_"+stock+".tw"+
"&json=1"+
"&delay=0"+
"&_="+Date.now();

res=await fetch(url);

json=await res.json();

}


if(
!json.msgArray||
json.msgArray.length===0
){

throw new Error(
"找不到這支股票"
);

}


const q=json.msgArray[0];

const price=num(q.z);

const yesterday=num(q.y);

const open=num(q.o);

const high=num(q.h);

const low=num(q.l);

const volume=num(q.v);

const bid=
q.b ?
num(String(q.b).split("_")[0])
:null;

const ask=
q.a ?
num(String(q.a).split("_")[0])
:null;


data={
stock,
name:q.n||"--",
price,
yesterday,
open,
high,
low,
volume,
bid,
ask
};


render();

await getMA(stock);

calculate();


setStatus(
"🟢 行情已連線・5秒自動更新",
"ok"
);


if(timer){
clearInterval(timer);
}

timer=setInterval(
searchStock,
5000
);


}catch(e){

console.error(e);

setStatus(
"❌ 連線失敗："+e.message,
"error"
);

}

}


/* ==========================
   月線
========================== */

async function getMA(stock){

try{

let closes=[];

const now=new Date();


/*
抓最近3個月
*/

for(let i=0;i<3;i++){

const d=new Date(
now.getFullYear(),
now.getMonth()-i,
1
);

const yyyy=d.getFullYear();

const mm=String(
d.getMonth()+1
).padStart(2,"0");


const date=
yyyy+mm+"01";


const url=
"https://www.twse.com.tw/exchangeReport/STOCK_DAY"+
"?response=json"+
"&date="+date+
"&stockNo="+stock+
"&_="+Date.now();


const res=await fetch(url);

const json=await res.json();


if(
json.data &&
Array.isArray(json.data)
){

for(const row of json.data){

if(row.length>=7){

const close=parseNumber(
row[6]
);

if(close!==null){

closes.push(close);

}

}

}

}

}


/*
最近20筆
*/

closes=closes.slice(-20);


/*
加上目前價格
*/

if(
data &&
data.price!==null
){

closes.push(data.price);

closes=closes.slice(-20);

}


if(closes.length>=20){

const sum=
closes.reduce(
(a,b)=>a+b,
0
);

const ma=
sum/closes.length;

data.ma20=
Math.round(
ma*100
)/100;

}else{

data.ma20=null;

}


document.getElementById(
"ma20"
).textContent=
format(data.ma20);


}catch(e){

console.log(
"月線抓取失敗",
e
);

document.getElementById(
"ma20"
).textContent="--";

}

}


/* ==========================
   顯示
========================== */

function render(){

document.getElementById("name")
.textContent=data.name;

document.getElementById("code")
.textContent=data.stock;

document.getElementById("price")
.textContent=format(data.price);

document.getElementById("yesterday")
.textContent=format(data.yesterday);

document.getElementById("open")
.textContent=format(data.open);

document.getElementById("highlow")
.textContent=
format(data.high)+
" / "+
format(data.low);

document.getElementById("volume")
.textContent=
data.volume!==null
?data.volume.toLocaleString()
:"--";

document.getElementById("bid")
.textContent=format(data.bid);

document.getElementById("ask")
.textContent=format(data.ask);


/*
判斷收盤
*/

const now=new Date();

const hour=now.getHours();

const minute=now.getMinutes();


if(
hour>13 ||
(hour===13 && minute>=30)
){

document.getElementById("close")
.textContent=
format(data.price);

}else{

document.getElementById("close")
.textContent="盤中";

}


/*
漲跌顏色
*/

const p=document.getElementById("price");

p.classList.remove(
"red",
"green"
);

if(
data.price!==null &&
data.yesterday!==null
){

if(data.price>data.yesterday){

p.classList.add("red");

}

if(data.price<data.yesterday){

p.classList.add("green");

}

}

}


/* ==========================
   成本
========================== */

function calculate(){

if(!data||
data.price===null){

return;

}

const cost=Number(
document.getElementById("cost")
.value
);


if(!cost){

document.getElementById("profit")
.textContent="--";

document.getElementById("profitPercent")
.textContent="--";

}else{

const profit=
data.price-cost;

const percent=
profit/cost*100;


document.getElementById("profit")
.textContent=
profit.toFixed(2);


document.getElementById("profitPercent")
.textContent=
percent.toFixed(2)+"%";


const p=
document.getElementById("profit");

const pp=
document.getElementById(
"profitPercent"
);

p.classList.remove(
"red",
"green"
);

pp.classList.remove(
"red",
"green"
);

if(profit>0){

p.classList.add("red");
pp.classList.add("red");

}

if(profit<0){

p.classList.add("green");
pp.classList.add("green");

}

}


/*
仙兔關卡
*/

const price=data.price;

const l1=price*1.03;
const l2=price*1.06;
const l3=price*1.10;

const support=
data.ma20 ||
price*0.97;

const warning=
support*0.98;

const target=l3;


document.getElementById("level1")
.textContent=l1.toFixed(2);

document.getElementById("level2")
.textContent=l2.toFixed(2);

document.getElementById("level3")
.textContent=l3.toFixed(2);

document.getElementById("support")
.textContent=
Number(support).toFixed(2);

document.getElementById("warning")
.textContent=
Number(warning).toFixed(2);

document.getElementById("target")
.textContent=
target.toFixed(2);

}


/* ==========================
   幸運
========================== */

function lucky(){

const arr=[

"🐰 仙兔送你幸運：今天順順利利！",

"🍀 好運來了：買賣都順心！",

"💰 財運滿滿：穩穩賺！",

"🚀 祝你股票一路順風！",

"✨ 心想事成、獲利滿滿！",

"🐰 仙兔保佑：守住支撐、突破關卡！"

];

const i=
Math.floor(
Math.random()*arr.length
);

document.getElementById(
"lucky"
).textContent=
arr[i];

}


/* ==========================
   清除
========================== */

function clearAll(){

if(timer){
clearInterval(timer);
timer=null;
}

data=null;

document.getElementById(
"stockInput"
).value="";

document.getElementById(
"cost"
).value="";


const ids=[
"name",
"code",
"price",
"yesterday",
"open",
"close",
"highlow",
"volume",
"bid",
"ask",
"ma20",
"profit",
"profitPercent",
"level1",
"level2",
"level3",
"support",
"warning",
"target"
];


ids.forEach(id=>{
document.getElementById(id)
.textContent="--";
});


setStatus(
"📡 尚未連線行情",
""
);

}


/* ==========================
   工具
========================== */

function num(v){

if(
v===null||
v===undefined||
v===""||
v==="-"||
v==="--"
){

return null;

}

const n=Number(
String(v).replace(/,/g,"")
);

return Number.isFinite(n)
?n
:null;

}


function parseNumber(v){

if(
v===null||
v===undefined
){

return null;

}

let s=String(v)
.replace(/,/g,"")
.trim();


/*
證交所資料可能包含
逗號、文字
*/

if(
s===""||
s==="-"||
s==="--"
){

return null;

}


const n=Number(s);

return Number.isFinite(n)
?n
:null;

}


function format(v){

if(
v===null||
v===undefined||
Number.isNaN(Number(v))
){

return "--";

}

return Number(v).toFixed(2);

}


function setStatus(text,type){

const el=
document.getElementById("status");

el.textContent=text;

el.className="status";

if(type){

el.classList.add(type);

}

}


/* ==========================
   Enter 查詢
========================== */

document
.getElementById("stockInput")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

searchStock();

}

});


/*
自動第一次查詢
*/

searchStock();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>台股三大法人分析</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f5f7;
  color:#222;
}

.container{
  max-width:600px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:30px;
  margin:15px 0 25px;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:700;
  font-size:18px;
  margin:15px 0 8px;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:20px;
}

button{
  width:100%;
  padding:17px;
  margin-top:20px;
  border:0;
  border-radius:13px;
  background:#2878f0;
  color:white;
  font-size:21px;
  font-weight:700;
}

.section-title{
  font-size:25px;
  font-weight:800;
  margin-bottom:15px;
}

.result{
  font-size:19px;
  line-height:1.8;
}

.institution{
  padding:15px;
  background:#f8f9fb;
  border-radius:14px;
  margin-top:12px;
}

.total{
  padding:18px;
  background:#eef5ff;
  border-radius:14px;
  margin-top:15px;
  font-size:19px;
  line-height:2;
}

.green{
  color:#16803c;
  font-weight:800;
}

.red{
  color:#d33;
  font-weight:800;
}

.blue{
  color:#1670c5;
  font-weight:800;
}

.gray{
  color:#777;
}

.status{
  text-align:center;
  font-size:24px;
  font-weight:800;
  padding:17px;
  border-radius:14px;
  margin-top:15px;
}

.status-bull{
  background:#e8f7ed;
  color:#16803c;
}

.status-bear{
  background:#fff0f0;
  color:#d33;
}

.status-neutral{
  background:#f1f1f1;
  color:#777;
}

.small{
  color:#777;
  font-size:14px;
}

.loading{
  text-align:center;
  padding:20px;
  font-size:18px;
  color:#777;
}

.error{
  background:#fff0f0;
  color:#d33;
  padding:15px;
  border-radius:12px;
  line-height:1.7;
}

.good{
  background:#e8f7ed;
  color:#16803c;
  padding:15px;
  border-radius:12px;
  line-height:1.7;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 台股三大法人分析</h1>

<div class="card">

<label>股票代號</label>

<input
  id="stock"
  type="text"
  inputmode="numeric"
  placeholder="例如：1326、2330、2317"
>

<button onclick="searchStock()">
🔍 查詢三大法人
</button>

<div id="message"></div>

</div>


<div class="card">

<div class="section-title">
📌 股票資訊
</div>

<div id="stockInfo">
請輸入股票代號後查詢
</div>

</div>


<div class="card">

<div class="section-title">
🏦 三大法人
</div>

<div id="institutionResult">
尚未查詢
</div>

</div>


<div class="card">

<div class="section-title">
🔥 法人訊號
</div>

<div id="signal">
尚未查詢
</div>

</div>

</div>


<script>

/* =========================
   基本設定
========================= */

const PROXY =
"https://api.allorigins.win/raw?url=";


/* =========================
   工具
========================= */

function cleanNumber(value){

  if(value === null || value === undefined){
    return 0;
  }

  return Number(
    String(value)
      .replace(/,/g,"")
      .replace(/\s/g,"")
  ) || 0;

}


function formatNumber(value){

  return Number(value).toLocaleString("zh-TW");

}


function dateString(date){

  const y = date.getFullYear();

  const m = String(date.getMonth()+1).padStart(2,"0");

  const d = String(date.getDate()).padStart(2,"0");

  return `${y}${m}${d}`;

}


function displayDate(date){

  return date.getFullYear() + "/" +
    String(date.getMonth()+1).padStart(2,"0") + "/" +
    String(date.getDate()).padStart(2,"0");

}


/* =========================
   查詢上市 T86
========================= */

async function getTWSE(stock){

  const today = new Date();

  for(let i=0;i<10;i++){

    const date = new Date(today);

    date.setDate(today.getDate()-i);

    const dateStr = dateString(date);

    const api =
      "https://www.twse.com.tw/rwd/zh/fund/T86" +
      "?date=" + dateStr +
      "&selectType=ALLBUT0999" +
      "&response=json";

    try{

      const url =
        PROXY + encodeURIComponent(api);

      const response =
        await fetch(url);

      if(!response.ok){
        continue;
      }

      const json =
        await response.json();

      if(
        json.stat !== "OK" ||
        !json.data ||
        !json.data.length
      ){
        continue;
      }

      const row =
        json.data.find(
          item => String(item[0]).trim() === stock
        );

      if(!row){
        continue;
      }

      return {

        market:"上市",

        date:displayDate(date),

        code:String(row[0]).trim(),

        name:String(row[1]).trim(),

        foreign:cleanNumber(row[4]),

        foreignDealer:cleanNumber(row[7]),

        trust:cleanNumber(row[10]),

        dealer:cleanNumber(row[11]),

        dealerSelf:cleanNumber(row[14]),

        dealerHedge:cleanNumber(row[17]),

        total:cleanNumber(row[18])

      };

    }catch(error){

      console.log(error);

    }

  }

  return null;

}


/* =========================
   查詢上櫃 TPEx
========================= */

async function getTPEx(stock){

  try{

    const api =
      "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading";

    const url =
      PROXY + encodeURIComponent(api);

    const response =
      await fetch(url);

    if(!response.ok){
      return null;
    }

    const data =
      await response.json();

    if(!Array.isArray(data)){
      return null;
    }

    const rows =
      data.filter(
        row =>
          String(
            row["證券代號"] ||
            row["SecuritiesCompanyCode"] ||
            ""
          ).trim() === stock
      );

    if(!rows.length){
      return null;
    }

    const row = rows[0];

    function findValue(words){

      const key =
        Object.keys(row).find(
          k => words.some(w => k.includes(w))
        );

      return key ? cleanNumber(row[key]) : 0;

    }

    const foreign =
      findValue(["外資及陸資買賣超","外陸資買賣超"]);

    const trust =
      findValue(["投信買賣超"]);

    const dealer =
      findValue(["自營商買賣超"]);

    const total =
      findValue(["三大法人買賣超"]);

    return {

      market:"上櫃",

      date:
        row["日期"] ||
        row["Date"] ||
        row["資料日期"] ||
        "最近交易日",

      code:stock,

      name:
        row["證券名稱"] ||
        row["SecuritiesCompanyName"] ||
        "",

      foreign:foreign,

      foreignDealer:0,

      trust:trust,

      dealer:dealer,

      dealerSelf:0,

      dealerHedge:0,

      total:
        total || foreign + trust + dealer

    };

  }catch(error){

    console.log(error);

    return null;

  }

}


/* =========================
   連續買超
========================= */

async function calculateConsecutive(stock){

  let count = 0;

  const today = new Date();

  for(let i=0;i<10;i++){

    const date = new Date(today);

    date.setDate(today.getDate()-i);

    const dateStr = dateString(date);

    const api =
      "https://www.twse.com.tw/rwd/zh/fund/T86" +
      "?date=" + dateStr +
      "&selectType=ALLBUT0999" +
      "&response=json";

    try{

      const url =
        PROXY + encodeURIComponent(api);

      const response =
        await fetch(url);

      if(!response.ok){
        continue;
      }

      const json =
        await response.json();

      if(
        json.stat !== "OK" ||
        !json.data
      ){
        continue;
      }

      const row =
        json.data.find(
          item =>
            String(item[0]).trim() === stock
        );

      if(!row){
        continue;
      }

      const total =
        cleanNumber(row[18]);

      if(total > 0){

        count++;

      }else{

        break;

      }

    }catch(error){

      break;

    }

  }

  return count;

}


/* =========================
   主查詢
========================= */

async function searchStock(){

  const stock =
    document.getElementById("stock")
      .value
      .trim()
      .toUpperCase();

  const message =
    document.getElementById("message");

  const stockInfo =
    document.getElementById("stockInfo");

  const result =
    document.getElementById("institutionResult");

  const signal =
    document.getElementById("signal");


  if(!stock){

    message.innerHTML =
      `<div class="error">
      ❌ 請輸入股票代號
      </div>`;

    return;

  }


  message.innerHTML =
    `<div class="loading">
    ⏳ 正在查詢最新交易日資料...
    </div>`;


  result.innerHTML =
    `<div class="loading">
    ⏳ 查詢中...
    </div>`;


  signal.innerHTML = "";


  /* 先查上市 */

  let data =
    await getTWSE(stock);


  /* 上市查不到，再查上櫃 */

  if(!data){

    data =
      await getTPEx(stock);

  }


  if(!data){

    message.innerHTML =
      `<div class="error">
      ❌ 查不到 ${stock} 的資料。<br><br>
      可能原因：<br>
      1️⃣ 股票代號錯誤<br>
      2️⃣ 尚未有最新交易資料<br>
      3️⃣ 資料來源暫時忙碌<br><br>
      請稍後再試。
      </div>`;

    result.innerHTML =
      "目前沒有資料";

    return;

  }


  message.innerHTML =
    `<div class="good">
    ✅ 查詢成功！<br>
    資料日期：${data.date}<br>
    市場：${data.market}
    </div>`;


  stockInfo.innerHTML = `

    <b>股票代號：</b>
    ${data.code}

    <br>

    <b>股票名稱：</b>
    ${data.name || "—"}

    <br>

    <b>市場：</b>
    ${data.market}

    <br>

    <b>資料日期：</b>
    ${data.date}

  `;


  const foreignClass =
    data.foreign >= 0 ? "green" : "red";

  const trustClass =
    data.trust >= 0 ? "green" : "red";

  const dealerClass =
    data.dealer >= 0 ? "green" : "red";

  const totalClass =
    data.total >= 0 ? "green" : "red";


  result.innerHTML = `

    <div class="institution">

      🔵 <b>外資買賣超：</b>

      <span class="${foreignClass}">
      ${formatNumber(data.foreign)} 股
      </span>

    </div>


    <div class="institution">

      🟣 <b>投信買賣超：</b>

      <span class="${trustClass}">
      ${formatNumber(data.trust)} 股
      </span>

    </div>


    <div class="institution">

      🟠 <b>自營商買賣超：</b>

      <span class="${dealerClass}">
      ${formatNumber(data.dealer)} 股
      </span>

    </div>


    <div class="total">

      📈 <b>三大法人合計：</b>

      <span class="${totalClass}">
      ${formatNumber(data.total)} 股
      </span>

    </div>

  `;


  /* 三大法人同時買超 */

  const sameBuy =
    data.foreign > 0 &&
    data.trust > 0 &&
    data.dealer > 0;


  let consecutive =
    await calculateConsecutive(stock);


  if(sameBuy){

    signal.innerHTML += `

      <div class="status status-bull">

      ⭐ 三大法人同時買超

      </div>

    `;

  }else{

    signal.innerHTML += `

      <div class="status status-neutral">

      ⚪ 三大法人沒有同時買超

      </div>

    `;

  }


  if(consecutive > 0){

    signal.innerHTML += `

      <div class="status status-bull">

      🔥 目前連續買超 ${consecutive} 天

      </div>

    `;

  }else{

    signal.innerHTML += `

      <div class="status status-neutral">

      📌 目前沒有連續買超

      </div>

    `;

  }


  if(data.total > 0){

    signal.innerHTML += `

      <div class="status status-bull">

      🟢 三大法人整體偏多

      </div>

    `;

  }else if(data.total < 0){

    signal.innerHTML += `

      <div class="status status-bear">

      🔴 三大法人整體偏空

      </div>

    `;

  }else{

    signal.innerHTML += `

      <div class="status status-neutral">

      ⚪ 三大法人中性

      </div>

    `;

  }

}

</script>

</body>
</html>

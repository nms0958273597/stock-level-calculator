<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>台股自動查詢</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#f3f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
}
.container{max-width:600px;margin:auto}
h1{text-align:center}
.card{
  background:#fff;
  padding:20px;
  border-radius:18px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08)
}
label{display:block;font-weight:700;margin-bottom:8px}
input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:18px
}
button{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#222;
  color:#fff;
  font-size:18px;
  font-weight:700
}
.result{
  margin-top:16px;
  padding:18px;
  background:#f7f7f7;
  border-radius:12px;
  font-size:18px
}
.price{
  font-size:38px;
  font-weight:800;
  color:#1677d2;
  margin:15px 0
}
.green{color:#07943a;font-weight:700}
.red{color:#d52626;font-weight:700}
.gray{color:#777}
</style>
</head>

<body>

<div class="container">

<h1>📊 台股自動查詢</h1>

<div class="card">

<label>🔎 股票代號或股票名稱（二選一）</label>

<input
  id="query"
  placeholder="例如：1326 或 台化"
>

<button onclick="searchStock()">
🔍 查詢股票
</button>

<div id="result" class="result">
請輸入股票代號或名稱
</div>

</div>

</div>

<script>

async function searchStock(){

  const query =
    document.getElementById("query").value.trim();

  if(!query){

    document.getElementById("result").innerHTML =
      "⚠️ 請輸入股票代號或股票名稱";

    return;
  }

  document.getElementById("result").innerHTML =
    "⏳ 正在查詢...";

  try{

    /*
      ⚠️ 這裡之後要放你的 Cloudflare Worker 網址
    */

    const WORKER_URL =
      "請把你的Worker網址貼在這裡";


    const url =
      WORKER_URL +
      "?q=" +
      encodeURIComponent(query);


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "查詢服務連線失敗"
      );

    }


    const data =
      await response.json();


    if(!data.success){

      throw new Error(
        data.message || "找不到股票"
      );

    }


    const price =
      Number(data.price);


    document.getElementById("result").innerHTML = `

      <div>
        ✅ 查詢成功
      </div>

      <div style="margin-top:10px">

        ${data.name}

        <span class="gray">
        ${data.code}
        </span>

      </div>

      <div class="price">

        ${price.toFixed(2)}

      </div>

      <div>

        💰 目前股價

      </div>

    `;


  }catch(error){

    document.getElementById("result").innerHTML = `

      <div class="red">
        ❌ 查詢失敗
      </div>

      <br>

      <div class="gray">
        ${error.message}
      </div>

    `;

  }

}

</script>

</body>
</html>

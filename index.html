<script>

/* =========================
   全域股票資料
========================= */

let stockList = [];

window.currentStock = null;


/* =========================
   取得股票清單
========================= */

async function loadStockList(){

  try{

    const response = await fetch(
      "https://openapi.twse.com.tw/v1/opendata/t187ap03_L"
    );

    if(!response.ok){
      throw new Error("股票清單取得失敗");
    }

    stockList = await response.json();

  }catch(error){

    console.log("股票清單載入失敗",error);

  }

}


/* =========================
   股票查詢
========================= */

async function searchStock(){

  const q =
    document.getElementById("query").value.trim();

  if(!q){

    showStatus("⚠️ 請輸入股票代號或股票名稱");

    return;
  }


  showStatus("⏳ 正在查詢股票...");


  try{

    let code = "";


    /* 如果輸入股票代號 */

    if(/^\d{4,6}$/.test(q)){

      code = q;

    }


    /* 如果輸入股票名稱 */

    else{

      if(stockList.length === 0){

        await loadStockList();

      }


      const found =
        stockList.find(item => {

          const text =
            item["有價證券代號及名稱"] || "";

          return text.includes(q);

        });


      if(found){

        const text =
          found["有價證券代號及名稱"];

        const match =
          text.match(/^(\d{4,6})/);

        if(match){

          code = match[1];

        }

      }

    }


    if(!code){

      showStatus(
        "❌ 找不到股票，請確認代號或名稱"
      );

      return;

    }


    await getStockPrice(code);

  }catch(error){

    console.error(error);

    showStatus(
      "❌ 查詢失敗，請稍後再試"
    );

  }

}


/* =========================
   取得股票價格
========================= */

async function getStockPrice(code){

  const url =
    "https://mis.twse.com.tw/stock/api/getStockInfo.jsp" +
    "?ex_ch=tse_" +
    code +
    ".tw&json=1&delay=0";


  const response =
    await fetch(url);


  if(!response.ok){

    throw new Error("股價取得失敗");

  }


  const data =
    await response.json();


  if(
    !data.msgArray ||
    data.msgArray.length === 0
  ){

    throw new Error("找不到股票");

  }


  const s =
    data.msgArray[0];


  const name =
    s.n || code;


  const yesterday =
    Number(s.y) || 0;


  let price =
    Number(s.z);


  /* 沒有最新成交價就使用昨收 */

  if(!price || price <= 0){

    price = yesterday;

  }


  const change =
    price - yesterday;


  const changePercent =
    yesterday > 0
      ? change / yesterday * 100
      : 0;


  window.currentStock = {

    code:code,

    name:name,

    price:price,

    yesterday:yesterday,

    change:change,

    changePercent:changePercent

  };


  let changeClass = "gray";


  if(change > 0){

    changeClass = "green";

  }else if(change < 0){

    changeClass = "red";

  }


  document.getElementById(
    "stockResult"
  ).innerHTML = `

    <div class="level">

      📌 股票：

      <b>${name}</b>

      <span class="gray">
      ${code}
      </span>

    </div>


    <div class="level">

      💰 目前股價：

      <span class="blue">
      ${price.toFixed(2)}
      </span>

    </div>


    <div class="level">

      ↕️ 漲跌：

      <span class="${changeClass}">

      ${change >= 0 ? "+" : ""}
      ${change.toFixed(2)}

      </span>

    </div>


    <div class="level">

      📊 漲跌幅：

      <span class="${changeClass}">

      ${change >= 0 ? "+" : ""}
      ${changePercent.toFixed(2)}%

      </span>

    </div>


    <div class="small">

      昨日收盤：
      ${yesterday.toFixed(2)}

    </div>

  `;


  showStatus(
    `✅ ${name}（${code}）查詢成功`
  );


  /* 自動顯示進場 */

  showAutoEntry(price);

}


/* =========================
   自動進場
========================= */

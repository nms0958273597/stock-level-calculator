<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>📈 股票關卡計算機</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f5f8;
  color:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    sans-serif;
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:16px;
}

.title{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:14px 0 5px;
}

.sub{
  text-align:center;
  color:#666;
  font-size:18px;
  margin-bottom:20px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

h2{
  margin:0 0 18px;
  font-size:25px;
}

label{
  display:block;
  font-size:17px;
  font-weight:800;
  margin:10px 0 7px;
}

input{
  width:100%;
  height:58px;
  padding:12px 16px;
  border:2px solid #d8dce1;
  border-radius:15px;
  background:#fff;
  color:#111;
  font-size:20px;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
  -webkit-user-select:text;
  user-select:text;
}

input:focus{
  border-color:#222;
  box-shadow:0 0 0 3px rgba(0,0,0,.07);
}

.search{
  display:grid;
  grid-template-columns:1fr 115px;
  gap:10px;
}

button{
  border:0;
  border-radius:15px;
  min-height:56px;
  padding:12px 16px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.black{
  background:#222;
  color:#fff;
}

.gray{
  background:#eef1f5;
  color:#111;
}

.red{
  background:#ffe6e6;
  color:#c00;
}

.purple{
  background:linear-gradient(
    90deg,
    #5d61ed,
    #ad4bea
  );
  color:#fff;
}

.status{
  margin-top:12px;
  padding:15px;
  border-radius:15px;
  background:#f5f5f5;
  font-size:17px;
  font-weight:800;
  line-height:1.5;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.infoBox{
  background:#f5f7fa;
  border-radius:16px;
  padding:16px;
  min-height:100px;
}

.infoBox span{
  display:block;
  color:#777;
  font-size:15px;
}

.infoBox strong{
  display:block;
  margin-top:8px;
  font-size:24px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.result{
  padding:17px;
  border-radius:17px;
  min-height:105px;
}

.result span{
  display:block;
  font-size:16px;
}

.result strong{
  display:block;
  margin-top:8px;
  font-size:27px;
}

.green{
  background:#e9f8ef;
}

.redbox{
  background:#fff0f0;
}

.blue{
  background:#edf5ff;
}

.gold{
  background:#fff7dc;
}

.savedItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.savedItem:last-child{
  border-bottom:0;
}

.savedName{
  font-size:18px;
  font-weight:800;
}

.savedCode{
  color:#777;
  font-size:14px;
  margin-top:3px;
}

.small{
  color:#777;
  font-size:14px;
  line-height:1.6;
}

@media(max-width:520px){

  .title{
    font-size:27px;
  }

  .sub{
    font-size:16px;
  }

  .info{
    grid-template-columns:1fr 1fr;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .resultGrid{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>


<body>

<div class="wrap">


<!-- 標題 -->

<div class="title">
📈 股票關卡計算機
</div>

<div class="sub">
即時行情・🐰仙兔關卡・成本計算
</div>


<!-- =========================
     基本資訊
========================= -->

<div class="card">

<h2>📊 基本資訊</h2>

<label>股票代號</label>

<input
id="code"
type="text"
inputmode="text"
autocomplete="off"
placeholder="例如 2330"
>


<label>股票名稱</label>

<input
id="nameInput"
type="text"
autocomplete="off"
placeholder="例如 台積電"
>


<label>日期</label>

<input
id="date"
type="text"
readonly
>


<label>現價</label>

<input
id="price"
type="text"
inputmode="decimal"
placeholder="請輸入現價"
>


<div
id="status"
class="status"
>
尚未查詢
</div>

</div>


<!-- =========================
     股票行情
========================= -->

<div class="card">

<h2>📡 股票資訊</h2>

<div class="info">

<div class="infoBox">
<span>股票名稱</span>
<strong id="showName">--</strong>
</div>

<div class="infoBox">
<span>股票代號</span>
<strong id="showCode">--</strong>
</div>

<div class="infoBox">
<span>現價</span>
<strong id="showPrice">--</strong>
</div>

<div class="infoBox">
<span>日期</span>
<strong id="showDate">--</strong>
</div>

</div>

<div
style="margin-top:12px"
>

<button
class="black"
type="button"
onclick="searchStock()"
>
🔎 查詢股票
</button>

</div>

</div>


<!-- =========================
     仙兔關卡
========================= -->

<div class="card">

<h2>🐰 仙兔關卡</h2>

<div class="small">
👇 白色欄位都可以直接輸入數字
</div>


<div class="grid">


<div>

<label>成本價</label>

<input
id="cost"
type="text"
inputmode="decimal"
autocomplete="off"
placeholder="例如 36.30"
>

</div>


<div>

<label>止盈 %</label>

<input
id="take"
type="text"
inputmode="decimal"
value="6"
>

</div>


<div>

<label>止損 %</label>

<input
id="stop"
type="text"
inputmode="decimal"
value="3"
>

</div>


<div>

<label>突破 %</label>

<input
id="breakout"
type="text"
inputmode="decimal"
value="2"
>

</div>


<div>

<label>跌破注意 %</label>

<input
id="breakdown"
type="text"
inputmode="decimal"
value="2"
>

</div>


<div>

<label>目標本益比</label>

<input
id="pe"
type="text"
inputmode="decimal"
value="15"
>

</div>


</div>


<div
style="margin-top:14px"
>

<button
class="gray"
type="button"
onclick="clearCost()"
>
清除成本
</button>

</div>


<div
id="levels"
class="resultGrid"
>
</div>

</div>


<!-- =========================
     外資融資成本
========================= -->

<div class="card">

<h2>🌍 籌碼</h2>


<div class="grid">

<div>

<label>外資成本</label>

<input
id="foreignCost"
type="text"
inputmode="decimal"
placeholder="例如 36.50"
>

</div>


<div>

<label>融資成本</label>

<input
id="marginCost"
type="text"
inputmode="decimal"
placeholder="例如 37.20"
>

</div>


</div>

</div>


<!-- =========================
     營收飆漲
========================= -->

<div class="card">

<h2>🚀 營收飆漲</h2>


<div class="grid">

<div>

<label>目標價</label>

<input
id="targetPrice"
type="text"
inputmode="decimal"
placeholder="例如 48"
>

</div>


<div>

<label>倍數</label>

<input
id="multiple"
type="text"
inputmode="decimal"
placeholder="例如 1.2"
>

</div>

</div>

</div>


<!-- =========================
     開始計算
========================= -->

<div class="card">

<button
class="purple"
type="button"
onclick="calculate()"
>
🎯 開始計算
</button>


<div
id="result"
class="status"
>
尚未計算
</div>

</div>


<!-- =========================
     我的股票
========================= -->

<div class="card">

<h2>💾 我的股票</h2>


<div
class="grid"
>

<button
class="black"
type="button"
onclick="saveStock()"
>
＋ 儲存目前股票
</button>


<button
class="red"
type="button"
onclick="clearStocks()"
>
🗑 清除股票
</button>

</div>


<div
id="savedStocks"
style="margin-top:15px"
>
尚未儲存股票
</div>

</div>


<!-- =========================
     說明
========================= -->

<div class="card small">

📌 成本價由你自己輸入。<br>

📌 儲存股票會保存在目前手機瀏覽器。<br>

📌 清除股票只會清除已儲存的股票，不會清除成本設定。<br>

📌 關卡為程式計算參考，不代表投資建議。

</div>


</div>


<script>


/* =========================
   股票名稱
========================= */

const stockNames = {

  "2330":"台積電",
  "1326":"台化",
  "2303":"聯電",
  "2618":"長榮航",
  "2367":"燿華",
  "2313":"華通",
  "3491":"昇達科",
  "3481":"群創",
  "8046":"南電",
  "2308":"台達電",
  "3711":"日月光"

};


/* =========================
   中文名稱轉代號
========================= */

const stockCodes = {

  "台積電":"2330",
  "台化":"1326",
  "聯電":"2303",
  "長榮航":"2618",
  "燿華":"2367",
  "華通":"2313",
  "昇達科":"3491",
  "群創":"3481",
  "南電":"8046",
  "台達電":"2308",
  "日月光":"3711"

};


/* =========================
   今天日期
========================= */

function today(){

  const d =
    new Date();

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");

  return y+"年"+m+"月"+day+"日";

}

document
  .getElementById("date")
  .value =
  today();


document
  .getElementById("showDate")
  .innerText =
  today();


/* =========================
   數字
========================= */

function num(id){

  const el =
    document.getElementById(id);

  if(!el){
    return null;
  }

  const value =
    el.value
      .trim()
      .replace(/,/g,"");

  if(value === ""){
    return null;
  }

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}


/* =========================
   金額
========================= */

function money(v){

  if(
    v === null ||
    v === undefined ||
    !Number.isFinite(Number(v))
  ){

    return "--";

  }

  return Number(v).toFixed(2);

}


/* =========================
   查詢股票
========================= */

function searchStock(){

  let code =
    document
      .getElementById("code")
      .value
      .trim();


  const nameInput =
    document
      .getElementById("nameInput");


  /*
    輸入中文名稱
  */

  if(stockCodes[code]){

    code =
      stockCodes[code];

    document
      .getElementById("code")
      .value =
      code;

  }


  /*
    沒輸入代號，
    嘗試從股票名稱找
  */

  if(!code){

    const name =
      nameInput
        .value
        .trim();

    if(stockCodes[name]){

      code =
        stockCodes[name];

      document
        .getElementById("code")
        .value =
        code;

    }

  }


  if(!code){

    document
      .getElementById("status")
      .innerText =
      "⚠️ 請輸入股票代號或名稱";

    return;

  }


  /*
    已知股票
  */

  if(stockNames[code]){

    const name =
      stockNames[code];

    nameInput.value =
      name;

    document
      .getElementById("showName")
      .innerText =
      name;

    document
      .getElementById("showCode")
      .innerText =
      code;

    document
      .getElementById("showDate")
      .innerText =
      today();

    document
      .getElementById("status")
      .innerText =
      "✅ 已找到 "+
      name+
      "（"+
      code+
      "）";

    return;

  }


  /*
    不在清單
  */

  document
    .getElementById("showName")
    .innerText =
    "--";

  document
    .getElementById("showCode")
    .innerText =
    code;

  document
    .getElementById("status")
    .innerText =
    "⚠️ 目前只有股票名稱顯示，請自行輸入現價";

}


/* =========================
   成本計算
========================= */

function calculate(){

  const cost =
    num("cost");


  if(cost === null){

    document
      .getElementById("levels")
      .innerHTML =
      `
      <div class="result">
        <span>⚠️ 提示</span>
        <strong>請先輸入成本價</strong>
      </div>
      `;

    document
      .getElementById("result")
      .innerText =
      "請先輸入成本價";

    return;

  }


  const take =
    num("take") ?? 6;

  const stop =
    num("stop") ?? 3;

  const breakout =
    num("breakout") ?? 2;

  const breakdown =
    num("breakdown") ?? 2;


  /*
    第一止盈
  */

  const takePrice =
    cost *
    (1 + take/100);


  /*
    止損
  */

  const stopPrice =
    cost *
    (1 - stop/100);


  /*
    突破
  */

  const breakoutPrice =
    cost *
    (1 + breakout/100);


  /*
    跌破
  */

  const breakdownPrice =
    cost *
    (1 - breakdown/100);


  document
    .getElementById("levels")
    .innerHTML =

    `
    <div class="result green">
      <span>🥕 第一止盈</span>
      <strong>
        ${money(takePrice)}
      </strong>
    </div>

    <div class="result redbox">
      <span>🛑 止損</span>
      <strong>
        ${money(stopPrice)}
      </strong>
    </div>

    <div class="result blue">
      <span>🚀 突破確認</span>
      <strong>
        ${money(breakoutPrice)}
      </strong>
    </div>

    <div class="result gold">
      <span>⚠️ 跌破注意</span>
      <strong>
        ${money(breakdownPrice)}
      </strong>
    </div>
    `;


  /* =========================
     其他估值
  ========================= */

  const foreign =
    num("foreignCost");

  const margin =
    num("marginCost");

  const target =
    num("targetPrice");

  const multiple =
    num("multiple");

  let text =
    "計算完成";


  if(foreign !== null){

    text +=
      "｜外資成本："+
      money(foreign);

  }


  if(margin !== null){

    text +=
      "｜融資成本："+
      money(margin);

  }


  if(target !== null){

    text +=
      "｜營收目標價："+
      money(target);

  }


  if(multiple !== null){

    text +=
      "｜倍數："+
      multiple+"倍";

  }


  document
    .getElementById("result")
    .innerText =
    text;

}


/* =========================
   清除成本
========================= */

function clearCost(){

  document
    .getElementById("cost")
    .value =
    "";

  document
    .getElementById("levels")
    .innerHTML =
    "";

  document
    .getElementById("result")
    .innerText =
    "成本已清除";

}


/* =========================
   儲存股票
========================= */

function saveStock(){

  const code =
    document
      .getElementById("code")
      .value
      .trim();

  const name =
    document
      .getElementById("nameInput")
      .value
      .trim();


  if(!code && !name){

    alert(
      "請先輸入股票代號或名稱"
    );

    return;

  }


  const stock = {

    code:
      code || "",

    name:
      name ||
      stockNames[code] ||
      "",

    cost:
      document
        .getElementById("cost")
        .value,

    price:
      document
        .getElementById("price")
        .value

  };


  let stocks =
    JSON.parse(
      localStorage.getItem(
        "myStocks"
      ) || "[]"
    );


  /*
    避免重複
  */

  stocks =
    stocks.filter(
      item =>
        item.code !== stock.code
    );


  stocks.push(stock);


  localStorage.setItem(
    "myStocks",
    JSON.stringify(stocks)
  );


  showSavedStocks();

}


/* =========================
   顯示股票
========================= */

function showSavedStocks(){

  const box =
    document
      .getElementById("savedStocks");


  const stocks =
    JSON.parse(
      localStorage.getItem(
        "myStocks"
      ) || "[]"
    );


  if(stocks.length === 0){

    box.innerHTML =
      "尚未儲存股票";

    return;

  }


  box.innerHTML =
    stocks
      .map(
        function(stock,index){

          return `

          <div class="savedItem">

            <div>

              <div class="savedName">
                📌 ${stock.name || "股票"}
              </div>

              <div class="savedCode">
                ${stock.code}
                ${
                  stock.cost
                  ? "｜成本 "+stock.cost
                  : ""
                }
              </div>

            </div>

            <button
              class="gray"
              style="width:auto;min-width:80px"
              onclick="loadStock(${index})"
            >
              載入
            </button>

          </div>

          `;

        }
      )
      .join("");

}


/* =========================
   載入股票
========================= */

function loadStock(index){

  const stocks =
    JSON.parse(
      localStorage.getItem(
        "myStocks"
      ) || "[]"
    );


  const stock =
    stocks[index];


  if(!stock){
    return;
  }


  document
    .getElementById("code")
    .value =
    stock.code || "";


  document
    .getElementById("nameInput")
    .value =
    stock.name || "";


  document
    .getElementById("cost")
    .value =
    stock.cost || "";


  document
    .getElementById("price")
    .value =
    stock.price || "";


  searchStock();


  const p =
    num("price");


  if(p !== null){

    document
      .getElementById("showPrice")
      .innerText =
      money(p);

  }


  calculate();

}


/* =========================
   清除全部股票
========================= */

function clearStocks(){

  const stocks =
    JSON.parse(
      localStorage.getItem(
        "myStocks"
      ) || "[]"
    );


  if(stocks.length === 0){

    return;

  }


  if(
    !confirm(
      "確定要清除所有已儲存股票嗎？"
    )
  ){

    return;

  }


  localStorage.removeItem(
    "myStocks"
  );


  showSavedStocks();

}


/* =========================
   現價輸入後同步
========================= */

document
  .getElementById("price")
  .addEventListener(
    "input",
    function(){

      const value =
        this.value.trim();

      document
        .getElementById("showPrice")
        .innerText =
        value
        ? value
        : "--";

    }
  );


/* =========================
   自動計算
========================= */

[
  "cost",
  "take",
  "stop",
  "breakout",
  "breakdown",
  "pe",
  "foreignCost",
  "marginCost",
  "targetPrice",
  "multiple"
]
.forEach(
  function(id){

    const el =
      document.getElementById(id);

    if(!el){
      return;
    }

    el.addEventListener(
      "input",
      calculate
    );

  }
);


/* =========================
   Enter 查詢
========================= */

document
  .getElementById("code")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){

        searchStock();

      }

    }
  );


/* =========================
   一開始顯示日期
========================= */

document
  .getElementById("date")
  .value =
  today();


/* =========================
   顯示已儲存股票
========================= */

showSavedStocks();

</script>

</body>
</html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📈 股票關卡計算機｜三大法人</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f5f7;
  color:#222;
}

.container{
  max-width:650px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:28px;
  margin:12px 0 20px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.section-title{
  font-size:23px;
  font-weight:800;
  margin-bottom:15px;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:18px;
}

button{
  width:100%;
  padding:16px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#2878f0;
  color:white;
  font-size:20px;
  font-weight:700;
}

.result{
  font-size:20px;
  line-height:1.8;
}

.institution{
  background:#f7f8fa;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
}

.total{
  background:#eef5ff;
  padding:16px;
  border-radius:12px;
  margin-top:16px;
  font-size:19px;
  line-height:1.9;
}

.green{
  color:#16803c;
  font-weight:800;
}

.red{
  color:#d33;
  font-weight:800;
}

.blue{
  color:#1670c5;
  font-weight:800;
}

.orange{
  color:#d86b00;
  font-weight:800;
}

.status{
  text-align:center;
  font-size:23px;
  font-weight:800;
  padding:16px;
  border-radius:12px;
  margin-top:15px;
}

.status-bull{
  background:#e8f7ed;
  color:#16803c;
}

.status-bear{
  background:#fff0f0;
  color:#d33;
}

.status-neutral{
  background:#f2f2f2;
  color:#777;
}

.same-buy{
  background:#fff5d9;
  color:#b86b00;
  text-align:center;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  font-size:20px;
  font-weight:800;
}

.level{
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  background:#f7f8fa;
}

.small{
  color:#777;
  font-size:14px;
}

  border-top:1px solid #ddd;

<body>

<div class="container">

<h1>📈 股票關卡計算機</h1>

<!-- 股票基本資料 -->

<div class="card">

<div class="section-title">📊 股票資料</div>

<label>股票名稱</label>
<input id="stock" type="text" placeholder="例如：台化">

<label>股票代號</label>
<input id="code" type="text" placeholder="例如：1326">

<label>股票現價</label>
<input id="price" type="number" step="0.01" placeholder="例如：36.30">

<label>我的成本</label>
<input id="cost" type="number" step="0.01" placeholder="例如：36.30">

<label>關卡百分比</label>
<input id="percent" type="number" step="0.1" value="2">

<button onclick="calculate()">📊 開始計算</button>

</div>


<!-- 價格結果 -->

<div class="card result">

<div class="section-title">🎯 價格分析</div>

<div id="priceResult">
請輸入現價與成本後開始計算
</div>

</div>


<!-- 三大法人 -->

<div class="card">

<div class="section-title">🏦 三大法人</div>

<div class="small">
請輸入張數：買超輸入正數，賣超輸入負數
</div>


<div class="institution">

<label>🔵 外資</label>

<input
id="foreign"
type="number"
placeholder="例如：-1440000"
>

</div>


<div class="institution">

<label>🟣 投信</label>

<input
id="trust"
type="number"
placeholder="例如：50000"
>

</div>


<div class="institution">

<label>🟠 自營商</label>

<input
id="dealer"
type="number"
placeholder="例如：20000"
>

</div>


<label>🔥 連續買超天數</label>

<input
id="days"
type="number"
min="0"
placeholder="例如：5"
>


<button onclick="calculateInstitutions()">
🏦 計算三大法人
</button>


<div id="institutionResult"></div>

</div>


<!-- 關卡 -->

<div class="card">

<div class="section-title">🎯 股票關卡</div>

<div id="levels">
請先輸入股票現價
</div>

</div>


<!-- 使用說明 -->

<div class="card">

<div class="section-title">💡 使用方式</div>

<div class="small">

1️⃣ 輸入股票名稱與代號<br><br>

2️⃣ 輸入目前股價<br><br>

3️⃣ 輸入自己的成本<br><br>

4️⃣ 輸入三大法人買賣超<br>
買超 → 正數<br>
賣超 → 負數<br><br>

5️⃣ 按「計算三大法人」<br><br>

⭐ 如果外資、投信、自營商三個都是正數，
會顯示「三大法人同時買超」。

</div>

</div>

</div>


<script>

function numberFormat(num){

return Number(num).toLocaleString("zh-TW",{
maximumFractionDigits:0
});

}


/* 股票價格計算 */

function calculate(){

const price =
Number(document.getElementById("price").value);

const cost =
Number(document.getElementById("cost").value);

const p =
Number(document.getElementById("percent").value);

if(!price){

alert("請先輸入股票現價");

return;

}


/* 如果沒有成本，只計算關卡 */

let profitHTML="";

if(cost){

const profit =
((price-cost)/cost)*100;

const cls =
profit>=0 ? "green" : "red";

profitHTML=`

成本：
<b>${cost.toFixed(2)}</b><br>

目前損益：
<span class="${cls}">
${profit.toFixed(2)}%
</span>

<hr>

`;

}


const up =
price*(1+p/100);

const down =
price*(1-p/100);

const up2 =
price*(1+(p*2)/100);

const down2 =
price*(1-(p*2)/100);


document.getElementById("priceResult").innerHTML=`

股票：
<b>${document.getElementById("stock").value || "未填寫"}</b><br>

代號：
<b>${document.getElementById("code").value || "未填寫"}</b><br>

現價：
<b>${price.toFixed(2)}</b>

<hr>

${profitHTML}

<span class="green">
⬆️ 上漲 ${p}%：
<b>${up.toFixed(2)}</b>
</span>

<br>

<span class="red">
⬇️ 下跌 ${p}%：
<b>${down.toFixed(2)}</b>
</span>

`;


document.getElementById("levels").innerHTML=`

<div class="level">
目前現價：
<b>${price.toFixed(2)}</b>
</div>

<div class="level green">
⬆️ 第一關 +${p}%：
<b>${up.toFixed(2)}</b>
</div>

<div class="level red">
⬇️ 第一關 -${p}%：
<b>${down.toFixed(2)}</b>
</div>

<div class="level green">
⬆️ 第二關 +${p*2}%：
<b>${up2.toFixed(2)}</b>
</div>

<div class="level red">
⬇️ 第二關 -${p*2}%：
<b>${down2.toFixed(2)}</b>
</div>

`;

}


/* 三大法人 */

function calculateInstitutions(){

const foreign =
Number(document.getElementById("foreign").value)||0;

const trust =
Number(document.getElementById("trust").value)||0;

const dealer =
Number(document.getElementById("dealer").value)||0;

const days =
Number(document.getElementById("days").value)||0;


const total =
foreign+trust+dealer;


/* 判斷多空 */

let status="";
let statusClass="";


if(total>0){

status="🔥 三大法人偏多";
statusClass="status-bull";

}

else if(total<0){

status="⚠️ 三大法人偏空";
statusClass="status-bear";

}

else{

status="⚪ 三大法人中性";
statusClass="status-neutral";

}


/* 三大法人同時買超 */

let sameBuy="";

if(
foreign>0 &&
trust>0 &&
dealer>0
){

sameBuy=`

<div class="same-buy">

⭐ 三大法人同時買超！

<br>

🔥 多方訊號較強

</div>

`;

}

else{

sameBuy=`

<div class="small" style="margin-top:15px;">

目前不是三大法人同時買超

</div>

`;

}


/* 連續買超 */

let daysHTML="";

if(days>0){

daysHTML=`

<br>

🔥 連續買超：

<span class="blue">
<b>${days} 天</b>
</span>

`;

}


document.getElementById("institutionResult").innerHTML=`

<div class="total">

🔵 外資：

<span class="${foreign>=0?'green':'red'}">

${numberFormat(foreign)}

</span>

<br>


🟣 投信：

<span class="${trust>=0?'green':'red'}">

${numberFormat(trust)}

</span>

<br>


🟠 自營商：

<span class="${dealer>=0?'green':'red'}">

${numberFormat(dealer)}

</span>

<hr>


📈 三大法人合計：

<span class="${total>=0?'green':'red'}">

${numberFormat(total)}

</span>

${daysHTML}

</div>


<div class="status ${statusClass}">

${status}

</div>

${sameBuy}

`;

}

</script>

</body>
</html>

<body>

<div class="container">

<h1>📊 台股三大法人分析</h1>

<div class="card">

<label>股票代號</label>

<input
  id="stock"
  type="text"
  inputmode="numeric"
  placeholder="例如：1326、2330、2317"
>

<button onclick="searchStock()">
🔍 查詢三大法人
</button>

<div id="message"></div>

</div>


<div class="card">

<div class="section-title">
📌 股票資訊
</div>

<div id="stockInfo">
請輸入股票代號後查詢
</div>

</div>

🏦 三大法人
</div>

尚未查詢
</div>

尚未查詢
</div>

<script>

/* =========================
   基本設定
========================= */

const PROXY =
"https://api.allorigins.win/raw?url=";


/* =========================
   工具
========================= */

function cleanNumber(value){

  if(value === null || value === undefined){
    return 0;
  }

  return Number(
    String(value)
      .replace(/,/g,"")
      .replace(/\s/g,"")
  ) || 0;

}


function formatNumber(value){

  return Number(value).toLocaleString("zh-TW");

}


function dateString(date){

  const y = date.getFullYear();

  const m = String(date.getMonth()+1).padStart(2,"0");

  const d = String(date.getDate()).padStart(2,"0");

  return `${y}${m}${d}`;

}


function displayDate(date){

  return date.getFullYear() + "/" +
    String(date.getMonth()+1).padStart(2,"0") + "/" +
    String(date.getDate()).padStart(2,"0");

}


/* =========================
   查詢上市 T86
========================= */

async function getTWSE(stock){

  const today = new Date();

  for(let i=0;i<10;i++){

    const date = new Date(today);

    date.setDate(today.getDate()-i);

    const dateStr = dateString(date);

    const api =
      "https://www.twse.com.tw/rwd/zh/fund/T86" +
      "?date=" + dateStr +
      "&selectType=ALLBUT0999" +
      "&response=json";

    try{

      const url =
        PROXY + encodeURIComponent(api);

      const response =
        await fetch(url);

      if(!response.ok){
        continue;
      }

      const json =
        await response.json();

      if(
        json.stat !== "OK" ||
        !json.data ||
        !json.data.length
      ){
        continue;
      }

      const row =
        json.data.find(
          item => String(item[0]).trim() === stock
        );

      if(!row){
        continue;
      }

      return {

        market:"上市",

        date:displayDate(date),

        code:String(row[0]).trim(),

        name:String(row[1]).trim(),

        foreign:cleanNumber(row[4]),

        foreignDealer:cleanNumber(row[7]),

        trust:cleanNumber(row[10]),

        dealer:cleanNumber(row[11]),

        dealerSelf:cleanNumber(row[14]),

        dealerHedge:cleanNumber(row[17]),

        total:cleanNumber(row[18])

      };

    }catch(error){

      console.log(error);

    }

  }

  return null;

}


/* =========================
   查詢上櫃 TPEx
========================= */

async function getTPEx(stock){

  try{

    const api =
      "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading";

    const url =
      PROXY + encodeURIComponent(api);

    const response =
      await fetch(url);

    if(!response.ok){
      return null;
    }

    const data =
      await response.json();

    if(!Array.isArray(data)){
      return null;
    }

    const rows =
      data.filter(
        row =>
          String(
            row["證券代號"] ||
            row["SecuritiesCompanyCode"] ||
            ""
          ).trim() === stock
      );

    if(!rows.length){
      return null;
    }

    const row = rows[0];

    function findValue(words){

      const key =
        Object.keys(row).find(
          k => words.some(w => k.includes(w))
        );

      return key ? cleanNumber(row[key]) : 0;

    }

    const foreign =
      findValue(["外資及陸資買賣超","外陸資買賣超"]);

    const trust =
      findValue(["投信買賣超"]);

    const dealer =
      findValue(["自營商買賣超"]);

    const total =
      findValue(["三大法人買賣超"]);

    return {

      market:"上櫃",

      date:
        row["日期"] ||
        row["Date"] ||
        row["資料日期"] ||
        "最近交易日",

      code:stock,

      name:
        row["證券名稱"] ||
        row["SecuritiesCompanyName"] ||
        "",

      foreign:foreign,

      foreignDealer:0,

      trust:trust,

      dealer:dealer,

      dealerSelf:0,

      dealerHedge:0,

      total:
        total || foreign + trust + dealer

    };

  }catch(error){

    console.log(error);

    return null;

  }

}


/* =========================
   連續買超
========================= */

async function calculateConsecutive(stock){

  let count = 0;

  const today = new Date();

  for(let i=0;i<10;i++){

    const date = new Date(today);

    date.setDate(today.getDate()-i);

    const dateStr = dateString(date);

    const api =
      "https://www.twse.com.tw/rwd/zh/fund/T86" +
      "?date=" + dateStr +
      "&selectType=ALLBUT0999" +
      "&response=json";

    try{

      const url =
        PROXY + encodeURIComponent(api);

      const response =
        await fetch(url);

      if(!response.ok){
        continue;
      }

      const json =
        await response.json();

      if(
        json.stat !== "OK" ||
        !json.data
      ){
        continue;
      }

      const row =
        json.data.find(
          item =>
            String(item[0]).trim() === stock
        );

      if(!row){
        continue;
      }

      const total =
        cleanNumber(row[18]);

      if(total > 0){

        count++;

      }else{

        break;

      }

    }catch(error){

      break;

    }

  }

  return count;

}


/* =========================
   主查詢
========================= */

async function searchStock(){

  const stock =
    document.getElementById("stock")
      .value
      .trim()
      .toUpperCase();

  const message =
    document.getElementById("message");

  const stockInfo =
    document.getElementById("stockInfo");

  const result =
    document.getElementById("institutionResult");

  const signal =
    document.getElementById("signal");


  if(!stock){

    message.innerHTML =
      `<div class="error">
      ❌ 請輸入股票代號
      </div>`;

    return;

  }


  message.innerHTML =
    `<div class="loading">
    ⏳ 正在查詢最新交易日資料...
    </div>`;


  result.innerHTML =
    `<div class="loading">
    ⏳ 查詢中...
    </div>`;


  signal.innerHTML = "";


  /* 先查上市 */

  let data =
    await getTWSE(stock);


  /* 上市查不到，再查上櫃 */

  if(!data){

    data =
      await getTPEx(stock);

  }


  if(!data){

    message.innerHTML =
      `<div class="error">
      ❌ 查不到 ${stock} 的資料。<br><br>
      可能原因：<br>
      1️⃣ 股票代號錯誤<br>
      2️⃣ 尚未有最新交易資料<br>
      3️⃣ 資料來源暫時忙碌<br><br>
      請稍後再試。
      </div>`;

    result.innerHTML =
      "目前沒有資料";

    return;

  }


  message.innerHTML =
    `<div class="good">
    ✅ 查詢成功！<br>
    資料日期：${data.date}<br>
    市場：${data.market}
    </div>`;


  stockInfo.innerHTML = `

    <b>股票代號：</b>
    ${data.code}

    <br>

    <b>股票名稱：</b>
    ${data.name || "—"}

    <br>

    <b>市場：</b>
    ${data.market}

    <br>

    <b>資料日期：</b>
    ${data.date}

  `;


  const foreignClass =
    data.foreign >= 0 ? "green" : "red";

  const trustClass =
    data.trust >= 0 ? "green" : "red";

  const dealerClass =
    data.dealer >= 0 ? "green" : "red";

  const totalClass =
    data.total >= 0 ? "green" : "red";


  result.innerHTML = `

    <div class="institution">

      🔵 <b>外資買賣超：</b>

      <span class="${foreignClass}">
      ${formatNumber(data.foreign)} 股
      </span>

    </div>


    <div class="institution">

      🟣 <b>投信買賣超：</b>

      <span class="${trustClass}">
      ${formatNumber(data.trust)} 股
      </span>

    </div>


    <div class="institution">

      🟠 <b>自營商買賣超：</b>

      <span class="${dealerClass}">
      ${formatNumber(data.dealer)} 股
      </span>

    </div>


    <div class="total">

      📈 <b>三大法人合計：</b>

      <span class="${totalClass}">
      ${formatNumber(data.total)} 股
      </span>

    </div>

  `;


  /* 三大法人同時買超 */

  const sameBuy =
    data.foreign > 0 &&
    data.trust > 0 &&
    data.dealer > 0;


  let consecutive =
    await calculateConsecutive(stock);


  if(sameBuy){

    signal.innerHTML += `

      <div class="status status-bull">

      ⭐ 三大法人同時買超

      </div>

    `;

  }else{

    signal.innerHTML += `

      <div class="status status-neutral">

      ⚪ 三大法人沒有同時買超

      </div>

    `;

  }


  if(consecutive > 0){

    signal.innerHTML += `

      <div class="status status-bull">

      🔥 目前連續買超 ${consecutive} 天

      </div>

    `;

  }else{

    signal.innerHTML += `

      <div class="status status-neutral">

      📌 目前沒有連續買超

      </div>

    `;

  }


  if(data.total > 0){

    signal.innerHTML += `

      <div class="status status-bull">

      🟢 三大法人整體偏多

      </div>

    `;

  }else if(data.total < 0){

    signal.innerHTML += `

      <div class="status status-bear">

      🔴 三大法人整體偏空

      </div>

    `;

  }else{

    signal.innerHTML += `

      <div class="status status-neutral">

      ⚪ 三大法人中性

      </div>

    `;

  }

}

</script>

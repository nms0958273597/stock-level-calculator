<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📈 股票關卡計算機 V8</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5f8;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:14px
}

.title{
  text-align:center;
  font-size:29px;
  font-weight:900;
  margin:12px 0 4px
}

.sub{
  text-align:center;
  color:#666;
  margin-bottom:16px
}

.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 5px 20px rgba(0,0,0,.06)
}

h2{
  margin:0 0 15px;
  font-size:23px
}

label{
  display:block;
  font-weight:800;
  margin:9px 0 6px
}

input{
  width:100%;
  height:54px;
  border:2px solid #d8dce1;
  border-radius:13px;
  padding:10px 13px;
  font-size:19px;
  background:#fff;
  color:#111;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
  -webkit-user-select:text;
  user-select:text
}

input:focus{
  border-color:#222;
  box-shadow:0 0 0 3px rgba(0,0,0,.07)
}

button{
  width:100%;
  min-height:54px;
  border:0;
  border-radius:13px;
  padding:10px 14px;
  font-size:17px;
  font-weight:900
}

.black{
  background:#222;
  color:#fff
}

.gray{
  background:#edf0f4;
  color:#111
}

.red{
  background:#ffe5e5;
  color:#c00
}

.purple{
  background:#635bdf;
  color:#fff
}

.search{
  display:grid;
  grid-template-columns:1fr 105px;
  gap:9px
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.quote{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.quoteBox{
  background:#f6f7f9;
  border-radius:14px;
  padding:13px;
  min-height:78px
}

.quoteBox span{
  display:block;
  color:#666;
  font-size:14px
}

.quoteBox strong{
  display:block;
  font-size:21px;
  margin-top:5px;
  word-break:break-word
}

.status{
  margin-top:11px;
  background:#f5f5f5;
  border-radius:13px;
  padding:13px;
  font-weight:800;
  line-height:1.5
}

.levels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px
}

.level{
  border-radius:14px;
  padding:15px;
  min-height:92px
}

.level span{
  display:block;
  font-size:15px
}

.level strong{
  display:block;
  font-size:25px;
  margin-top:6px
}

.green{background:#e9f8ef}
.redbox{background:#fff0f0}
.blue{background:#edf5ff}
.gold{background:#fff7dc}

.fund{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.fundBox{
  border-radius:14px;
  padding:14px;
  background:#f6f7f9
}

.fundBox span{
  display:block;
  color:#666;
  font-size:14px
}

.fundBox strong{
  display:block;
  font-size:22px;
  margin-top:5px
}

.saved{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:12px 0;
  border-bottom:1px solid #eee
}

.saved:last-child{
  border-bottom:0
}

.savedInfo{
  flex:1
}

.savedName{
  font-size:18px;
  font-weight:900
}

.savedSub{
  color:#777;
  font-size:13px;
  margin-top:3px
}

.note{
  color:#777;
  font-size:13px;
  line-height:1.6
}

@media(max-width:520px){
  .title{font-size:26px}
  .levels{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div class="wrap">

<div class="title">📈 股票關卡計算機 V8</div>

<div class="sub">
即時行情・週月均價・🐰仙兔關卡・三大法人
</div>


<!-- 股票查詢 -->

<div class="card">

<h2>🔎 股票查詢</h2>

<label>股票代號／名稱</label>

<div class="search">

<input
id="code"
type="text"
inputmode="text"
autocomplete="off"
placeholder="例如 2330、台積電"
>

<button
class="black"
type="button"
onclick="searchStock()"
>
查詢
</button>

</div>

<div id="status" class="status">
尚未查詢
</div>

</div>


<!-- 基本行情 -->

<div class="card">

<h2>📡 基本行情</h2>

<div class="quote">

<div class="quoteBox">
<span>股票名稱</span>
<strong id="name">--</strong>
</div>

<div class="quoteBox">
<span>股票代號</span>
<strong id="symbol">--</strong>
</div>

<div class="quoteBox">
<span>現價</span>
<strong id="price">--</strong>
</div>

<div class="quoteBox">
<span>昨收</span>
<strong id="prev">--</strong>
</div>

<div class="quoteBox">
<span>開盤</span>
<strong id="open">--</strong>
</div>

<div class="quoteBox">
<span>收盤</span>
<strong id="close">--</strong>
</div>

<div class="quoteBox">
<span>週均價</span>
<strong id="weekAvg">--</strong>
</div>

<div class="quoteBox">
<span>月均價</span>
<strong id="monthAvg">--</strong>
</div>

</div>

</div>


<!-- 手動行情 -->

<div class="card">

<h2>✏️ 行情手動設定</h2>

<div class="note">
如果即時行情尚未連線，下面欄位可以自己輸入。
</div>

<div class="grid">

<div>
<label>現價</label>
<input id="manualPrice" type="text" inputmode="decimal">
</div>

<div>
<label>昨收</label>
<input id="manualPrev" type="text" inputmode="decimal">
</div>

<div>
<label>開盤</label>
<input id="manualOpen" type="text" inputmode="decimal">
</div>

<div>
<label>收盤</label>
<input id="manualClose" type="text" inputmode="decimal">
</div>

<div>
<label>週均價</label>
<input id="manualWeek" type="text" inputmode="decimal">
</div>

<div>
<label>月均價</label>
<input id="manualMonth" type="text" inputmode="decimal">
</div>

</div>

</div>


<!-- 仙兔 -->

<div class="card">

<h2>🐰 仙兔關卡</h2>

<div class="grid">

<div>
<label>成本價</label>
<input id="cost" type="text" inputmode="decimal" placeholder="例如 36.30">
</div>

<div>
<label>止盈 %</label>
<input id="take" type="text" inputmode="decimal" value="6">
</div>

<div>
<label>止損 %</label>
<input id="stop" type="text" inputmode="decimal" value="3">
</div>

<div>
<label>突破 %</label>
<input id="breakout" type="text" inputmode="decimal" value="2">
</div>

<div>
<label>跌破注意 %</label>
<input id="breakdown" type="text" inputmode="decimal" value="2">
</div>

<div>
<label>目標本益比</label>
<input id="pe" type="text" inputmode="decimal" value="15">
</div>

</div>

<div class="levels" id="levels"></div>

<div style="margin-top:11px">
<button class="purple" type="button" onclick="calculate()">
🎯 開始計算
</button>
</div>

</div>


<!-- 三大法人 -->

<div class="card">

<h2>🌍 三大法人進出</h2>

<div class="fund">

<div class="fundBox">
<span>外資</span>
<strong id="foreign">--</strong>
</div>

<div class="fundBox">
<span>投信</span>
<strong id="trust">--</strong>
</div>

<div class="fundBox">
<span>自營商</span>
<strong id="dealer">--</strong>
</div>

<div class="fundBox">
<span>三大法人合計</span>
<strong id="total">--</strong>
</div>

</div>

<div class="grid" style="margin-top:12px">

<div>
<label>外資手動輸入</label>
<input id="foreignInput" type="text" inputmode="numeric">
</div>

<div>
<label>投信手動輸入</label>
<input id="trustInput" type="text" inputmode="numeric">
</div>

<div>
<label>自營商手動輸入</label>
<input id="dealerInput" type="text" inputmode="numeric">
</div>

</div>

<button
class="gray"
type="button"
style="margin-top:12px"
onclick="calculateFunds()"
>
計算三大法人合計
</button>

</div>


<!-- 股票儲存 -->

<div class="card">

<h2>💾 我的股票</h2>

<div class="grid">

<button
class="black"
type="button"
onclick="saveStock()"
>
＋ 儲存股票
</button>

<button
class="red"
type="button"
onclick="clearStocks()"
>
🗑 清除全部
</button>

</div>

<div id="saved" style="margin-top:12px">
尚未儲存股票
</div>

</div>


<div class="card note">

📌 關卡為計算參考，不代表投資建議。<br>
📌 白色欄位都可以直接輸入數字。<br>
📌 股票儲存會保存在目前手機瀏覽器。<br>
📌 即時行情、週月均價、三大法人需要行情服務接線後自動取得。

</div>

</div>


<script>

const names={
  "2330":"台積電",
  "1326":"台化",
  "2303":"聯電",
  "2618":"長榮航",
  "2367":"燿華",
  "2313":"華通",
  "3491":"昇達科",
  "3481":"群創",
  "8046":"南電",
  "2308":"台達電",
  "3711":"日月光"
};

const aliases={
  "台積電":"2330",
  "台化":"1326",
  "聯電":"2303",
  "長榮航":"2618",
  "燿華":"2367",
  "華通":"2313",
  "昇達科":"3491",
  "群創":"3481",
  "南電":"8046",
  "台達電":"2308",
  "日月光":"3711"
};


function num(id){

  const el=document.getElementById(id);

  if(!el)return null;

  const v=el.value.trim().replace(/,/g,"");

  if(v==="")return null;

  const n=Number(v);

  return Number.isFinite(n)?n:null;
}


function money(v){

  if(v===null||v===undefined||v==="")return "--";

  const n=Number(v);

  if(!Number.isFinite(n))return "--";

  return n.toFixed(2);
}


function searchStock(){

  let code=document.getElementById("code").value.trim();

  if(aliases[code]){
    code=aliases[code];
    document.getElementById("code").value=code;
  }

  if(!code){
    document.getElementById("status").innerText=
      "⚠️ 請輸入股票代號或名稱";
    return;
  }

  const name=names[code]||"未設定名稱";

  document.getElementById("name").innerText=name;
  document.getElementById("symbol").innerText=code;

  document.getElementById("status").innerText=
    "✅ 已載入 "+name+"（"+code+"）";

  calculate();
}


function calculate(){

  const cost=num("cost");

  if(cost===null){

    document.getElementById("levels").innerHTML=
      `
      <div class="level">
        <span>⚠️ 提示</span>
        <strong>請輸入成本價</strong>
      </div>
      `;

    return;
  }

  const take=num("take")??6;
  const stop=num("stop")??3;
  const breakout=num("breakout")??2;
  const breakdown=num("breakdown")??2;

  const takePrice=cost*(1+take/100);
  const stopPrice=cost*(1-stop/100);
  const breakoutPrice=cost*(1+breakout/100);
  const breakdownPrice=cost*(1-breakdown/100);

  document.getElementById("levels").innerHTML=
  `
  <div class="level green">
    <span>🥕 第一止盈</span>
    <strong>${money(takePrice)}</strong>
  </div>

  <div class="level redbox">
    <span>🛑 止損</span>
    <strong>${money(stopPrice)}</strong>
  </div>

  <div class="level blue">
    <span>🚀 突破確認</span>
    <strong>${money(breakoutPrice)}</strong>
  </div>

  <div class="level gold">
    <span>⚠️ 跌破注意</span>
    <strong>${money(breakdownPrice)}</strong>
  </div>
  `;
}


function calculateFunds(){

  const f=num("foreignInput");
  const t=num("trustInput");
  const d=num("dealerInput");

  document.getElementById("foreign").innerText=
    f===null?"--":f.toLocaleString();

  document.getElementById("trust").innerText=
    t===null?"--":t.toLocaleString();

  document.getElementById("dealer").innerText=
    d===null?"--":d.toLocaleString();

  const total=
    (f??0)+(t??0)+(d??0);

  if(f===null&&t===null&&d===null){

    document.getElementById("total").innerText="--";

  }else{

    document.getElementById("total").innerText=
      total.toLocaleString();

  }
}


function syncManual(){

  const map=[
    ["manualPrice","price"],
    ["manualPrev","prev"],
    ["manualOpen","open"],
    ["manualClose","close"],
    ["manualWeek","weekAvg"],
    ["manualMonth","monthAvg"]
  ];

  map.forEach(pair=>{

    const v=num(pair[0]);

    document.getElementById(pair[1]).innerText=
      v===null?"--":money(v);

  });
}


[
  "manualPrice",
  "manualPrev",
  "manualOpen",
  "manualClose",
  "manualWeek",
  "manualMonth"
].forEach(id=>{

  document.getElementById(id)
    .addEventListener("input",syncManual);

});


function saveStock(){

  const code=
    document.getElementById("symbol").innerText;

  const name=
    document.getElementById("name").innerText;

  if(code==="--"){

    alert("請先查詢股票");

    return;
  }

  const stock={
    code:code,
    name:name,
    cost:document.getElementById("cost").value
  };

  let list=
    JSON.parse(
      localStorage.getItem("stockV8")||"[]"
    );

  list=list.filter(x=>x.code!==code);

  list.push(stock);

  localStorage.setItem(
    "stockV8",
    JSON.stringify(list)
  );

  showSaved();
}


function showSaved(){

  const box=document.getElementById("saved");

  const list=
    JSON.parse(
      localStorage.getItem("stockV8")||"[]"
    );

  if(list.length===0){

    box.innerHTML="尚未儲存股票";

    return;
  }

  box.innerHTML=
    list.map((x,i)=>{

      return `
      <div class="saved">

        <div class="savedInfo">

          <div class="savedName">
            📌 ${x.name}
          </div>

          <div class="savedSub">
            ${x.code}
            ${x.cost?"｜成本 "+x.cost:""}
          </div>

        </div>

        <button
          class="gray"
          style="width:85px"
          onclick="loadSaved(${i})"
        >
          載入
        </button>

      </div>
      `;

    }).join("");
}


function loadSaved(i){

  const list=
    JSON.parse(
      localStorage.getItem("stockV8")||"[]"
    );

  const x=list[i];

  if(!x)return;

  document.getElementById("code").value=x.code;

  document.getElementById("name").innerText=x.name;

  document.getElementById("symbol").innerText=x.code;

  document.getElementById("cost").value=x.cost||"";

  document.getElementById("status").innerText=
    "📌 已載入 "+x.name+"（"+x.code+"）";

  calculate();
}


function clearStocks(){

  if(!confirm("確定要清除全部儲存股票嗎？")){
    return;
  }

  localStorage.removeItem("stockV8");

  showSaved();
}


[
  "cost",
  "take",
  "stop",
  "breakout",
  "breakdown",
  "pe"
].forEach(id=>{

  document.getElementById(id)
    .addEventListener("input",calculate);

});


document.getElementById("code")
  .addEventListener("keydown",e=>{

    if(e.key==="Enter"){
      searchStock();
    }

  });


showSaved();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>📈 股票關卡計算機</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f5f8;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:16px;
}

.title{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:15px 0 5px;
}

.sub{
  text-align:center;
  color:#666;
  font-size:17px;
  margin-bottom:20px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h2{
  margin:0 0 16px;
  font-size:25px;
}

label{
  display:block;
  font-size:17px;
  font-weight:800;
  margin:10px 0 7px;
}

input{
  width:100%;
  height:58px;
  padding:12px 15px;
  border:2px solid #d8dce1;
  border-radius:15px;
  background:#fff;
  color:#111;
  font-size:20px;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
  -webkit-user-select:text;
  user-select:text;
}

input:focus{
  border-color:#222;
  box-shadow:0 0 0 3px rgba(0,0,0,.08);
}

.search{
  display:grid;
  grid-template-columns:1fr 110px;
  gap:10px;
}

button{
  width:100%;
  min-height:56px;
  border:0;
  border-radius:15px;
  padding:12px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.black{
  background:#222;
  color:#fff;
}

.gray{
  background:#eef1f5;
  color:#111;
}

.red{
  background:#ffe6e6;
  color:#c00;
}

.purple{
  background:linear-gradient(90deg,#5d61ed,#ad4bea);
  color:#fff;
}

.status{
  margin-top:13px;
  padding:15px;
  border-radius:15px;
  background:#f5f5f5;
  font-size:17px;
  font-weight:800;
  line-height:1.5;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.quote{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.box{
  background:#f5f7fa;
  border-radius:16px;
  padding:16px;
  min-height:95px;
}

.box span{
  display:block;
  color:#666;
  font-size:15px;
}

.box strong{
  display:block;
  font-size:23px;
  margin-top:8px;
}

.levels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.level{
  padding:17px;
  border-radius:17px;
  min-height:110px;
}

.level span{
  display:block;
  font-size:16px;
}

.level strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.green{
  background:#e9f8ef;
}

.redbox{
  background:#fff0f0;
}

.blue{
  background:#edf5ff;
}

.gold{
  background:#fff7dc;
}

.saved{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.saved:last-child{
  border-bottom:0;
}

.savedName{
  font-weight:900;
  font-size:18px;
}

.savedInfo{
  color:#777;
  font-size:14px;
  margin-top:4px;
}

.small{
  color:#777;
  font-size:14px;
  line-height:1.6;
}

@media(max-width:520px){

  .title{
    font-size:27px;
  }

  .grid,
  .quote,
  .levels{
    grid-template-columns:1fr 1fr;
  }

}
</style>
</head>

<body>

<div class="wrap">

<div class="title">
📈 股票關卡計算機
</div>

<div class="sub">
🐰 仙兔關卡・成本計算・股票收藏
</div>


<!-- 股票 -->

<div class="card">

<h2>🔎 股票查詢</h2>

<label>股票代號／名稱</label>

<div class="search">

<input
id="code"
type="text"
inputmode="text"
autocomplete="off"
placeholder="例如 2330、台化"
>

<button
class="black"
type="button"
onclick="searchStock()"
>
查詢
</button>

</div>

<div
id="status"
class="status"
>
尚未查詢
</div>

</div>


<!-- 股票資訊 -->

<div class="card">

<h2>📡 股票資訊</h2>

<div class="quote">

<div class="box">
<span>股票名稱</span>
<strong id="name">--</strong>
</div>

<div class="box">
<span>代號</span>
<strong id="symbol">--</strong>
</div>

<div class="box">
<span>現價</span>
<strong id="price">--</strong>
</div>

<div class="box">
<span>昨收</span>
<strong id="prev">--</strong>
</div>

<div class="box">
<span>開盤</span>
<strong id="open">--</strong>
</div>

<div class="box">
<span>最高／最低</span>
<strong id="highlow">--</strong>
</div>

<div class="box">
<span>成交量</span>
<strong id="volume">--</strong>
</div>

<div class="box">
<span>買一／賣一</span>
<strong id="bidask">--</strong>
</div>

<div class="box">
<span>更新時間</span>
<strong id="time">--</strong>
</div>

</div>

</div>


<!-- 仙兔關卡 -->

<div class="card">

<h2>🐰 仙兔關卡</h2>

<div class="small">
👇 白色欄位都可以直接輸入數字
</div>

<div class="grid">

<div>

<label>成本價</label>

<input
id="cost"
type="text"
inputmode="decimal"
autocomplete="off"
placeholder="例如 36.30"
>

</div>

<div>

<label>止盈 %</label>

<input
id="take"
type="text"
inputmode="decimal"
value="6"
>

</div>

<div>

<label>止損 %</label>

<input
id="stop"
type="text"
inputmode="decimal"
value="3"
>

</div>

<div>

<label>突破 %</label>

<input
id="breakout"
type="text"
inputmode="decimal"
value="2"
>

</div>

<div>

<label>跌破注意 %</label>

<input
id="breakdown"
type="text"
inputmode="decimal"
value="2"
>

</div>

<div>

<label>目標本益比</label>

<input
id="pe"
type="text"
inputmode="decimal"
value="15"
>

</div>

</div>


<div
style="display:flex;gap:10px;margin-top:14px"
>

<button
class="gray"
type="button"
onclick="clearCost()"
>
清除成本
</button>

<button
class="purple"
type="button"
onclick="calculate()"
>
🎯 開始計算
</button>

</div>


<div
id="levels"
class="levels"
>
</div>

</div>


<!-- 籌碼 -->

<div class="card">

<h2>🌍 籌碼</h2>

<div class="grid">

<div>

<label>外資成本</label>

<input
id="foreign"
type="text"
inputmode="decimal"
placeholder="例如 36.50"
>

</div>

<div>

<label>融資成本</label>

<input
id="margin"
type="text"
inputmode="decimal"
placeholder="例如 37.20"
>

</div>

</div>

</div>


<!-- 營收 -->

<div class="card">

<h2>🚀 營收飆漲</h2>

<div class="grid">

<div>

<label>營收目標價</label>

<input
id="target"
type="text"
inputmode="decimal"
placeholder="例如 48"
>

</div>

<div>

<label>倍數</label>

<input
id="multiple"
type="text"
inputmode="decimal"
placeholder="例如 1.2"
>

</div>

</div>

</div>


<!-- 結果 -->

<div class="card">

<h2>📊 計算結果</h2>

<div
id="result"
class="status"
>
尚未計算
</div>

</div>


<!-- 我的股票 -->

<div class="card">

<h2>💾 我的股票</h2>

<div class="grid">

<button
class="black"
type="button"
onclick="saveStock()"
>
＋ 儲存目前股票
</button>

<button
class="red"
type="button"
onclick="clearStocks()"
>
🗑 清除股票
</button>

</div>

<div
id="saved"
style="margin-top:15px"
>
尚未儲存股票
</div>

</div>


<div class="card small">

📌 成本價由你自己輸入。<br>
📌 第一

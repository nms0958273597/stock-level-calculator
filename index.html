<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📈 股票關卡計算機 V5</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f5f8;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",Arial,sans-serif;
}

.container{
  max-width:720px;
  margin:auto;
  padding:16px;
}

.title{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:15px 0 5px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:18px;
}

.card{
  background:white;
  border-radius:22px;
  padding:18px;
  margin:15px 0;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

label{
  display:block;
  font-size:17px;
  font-weight:800;
  margin:10px 0 6px;
}

/* 所有可以輸入的欄位 */
input{
  width:100%;
  height:56px;
  padding:12px 15px;
  border:2px solid #d8dce1;
  border-radius:14px;
  background:#fff;
  color:#111;
  font-size:20px;

  outline:none;

  -webkit-appearance:none;
  appearance:none;

  -webkit-user-select:text;
  user-select:text;

  pointer-events:auto;
}

input:focus{
  border-color:#222;
  box-shadow:0 0 0 3px rgba(0,0,0,.08);
}

input::placeholder{
  color:#aaa;
}

.search{
  display:grid;
  grid-template-columns:1fr 120px;
  gap:10px;
}

button{
  border:0;
  border-radius:14px;
  height:56px;
  padding:0 16px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.black{
  background:#222;
  color:white;
}

.gray{
  background:#eef1f5;
  color:#111;
}

.red{
  background:#ffe7e7;
  color:#c00;
}

.status{
  background:#f5f5f5;
  border-radius:14px;
  padding:14px;
  margin-top:12px;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.quote{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.quoteBox{
  background:#f6f7f9;
  border-radius:14px;
  padding:13px;
  min-height:80px;
}

.quoteBox span{
  display:block;
  color:#666;
  font-size:14px;
}

.quoteBox strong{
  display:block;
  font-size:20px;
  margin-top:5px;
}

.inputArea{
  background:#fafafa;
  border:2px dashed #ddd;
  border-radius:18px;
  padding:12px;
}

.inputTitle{
  font-size:18px;
  font-weight:900;
  margin-bottom:5px;
}

.hint{
  color:#777;
  font-size:13px;
  margin-bottom:10px;
}

.levels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.level{
  padding:15px;
  border-radius:15px;
}

.level span{
  display:block;
  font-size:15px;
}

.level strong{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.green{
  background:#e9f8ef;
}

.redBox{
  background:#fff0f0;
}

.blue{
  background:#edf5ff;
}

.gold{
  background:#fff7dc;
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

.note{
  color:#777;
  font-size:13px;
  line-height:1.6;
}

.saved{
  padding:10px 0;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

@media(max-width:520px){

  .title{
    font-size:26px;
  }

  .quote{
    grid-template-columns:1fr 1fr;
  }

  .levels{
    grid-template-columns:1fr 1fr;
  }

  .search{
    grid-template-columns:1fr 105px;
  }

  input{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="title">
📈 股票關卡計算機 V5
</div>

<div class="subtitle">
即時行情・仙兔關卡・成本計算
</div>


<!-- 股票查詢 -->

<div class="card">

<label>🔎 股票代號／名稱</label>

<div class="search">

<input
id="stockCode"
type="text"
inputmode="numeric"
value="2330"
placeholder="例如 2330"
/>

<button
class="black"
onclick="searchStock()">
查詢
</button>

</div>

<div
id="searchStatus"
class="status">
尚未查詢
</div>

</div>


<!-- 行情 -->

<div class="card">

<div class="quote">

<div class="quoteBox">
<span>股票名稱</span>
<strong id="stockName">--</strong>
</div>

<div class="quoteBox">
<span>代號</span>
<strong id="stockNumber">--</strong>
</div>

<div class="quoteBox">
<span>現價</span>
<strong id="currentPrice">--</strong>
</div>

<div class="quoteBox">
<span>昨收</span>
<strong id="previousPrice">--</strong>
</div>

<div class="quoteBox">
<span>開盤</span>
<strong id="openPrice">--</strong>
</div>

<div class="quoteBox">
<span>最高</span>
<strong id="highPrice">--</strong>
</div>

<div class="quoteBox">
<span>最低</span>
<strong id="lowPrice">--</strong>
</div>

<div class="quoteBox">
<span>成交量</span>
<strong id="volume">--</strong>
</div>

<div class="quoteBox">
<span>買一／賣一</span>
<strong id="bidAsk">--</strong>
</div>

</div>

</div>


<!-- 仙兔關卡 -->

<div class="card">

<h2>🐰 仙兔關卡</h2>

<div class="hint">
👇 以下白色欄位都可以直接輸入數字
</div>

<div class="inputArea">

<div class="grid">

<div>

<label>成本價</label>

<input
id="cost"
type="text"
inputmode="decimal"
placeholder="例如 36.30"
/>

</div>


<div>

<label>止盈 %</label>

<input
id="takeProfitPercent"
type="text"
inputmode="decimal"
value="6"
/>

</div>


<div>

<label>止損 %</label>

<input
id="stopLossPercent"
type="text"
inputmode="decimal"
value="3"
/>

</div>


<div>

<label>突破 %</label>

<input
id="breakPercent"
type="text"
inputmode="decimal"
value="2"
/>

</div>


<div>

<label>跌破注意 %</label>

<input
id="fallPercent"
type="text"
inputmode="decimal"
value="2"
/>

</div>


<div>

<label>目標本益比</label>

<input
id="pe"
type="text"
inputmode="decimal"
value="15"
/>

</div>

</div>


<div class="row" style="margin-top:12px">

<button
class="gray"
onclick="clearCost()">
清除成本
</button>

<button
class="black"
onclick="calculate()">
🎯 開始計算
</button>

</div>

</div>


<div
id="levels"
class="levels">
</div>

</div>


<!-- 籌碼 -->

<div class="card">

<h2>🌍 籌碼／估值</h2>

<div class="grid">

<div>

<label>外資（張）</label>

<input
id="foreign"
type="text"
inputmode="numeric"
placeholder="例如 12000"
/>

</div>


<div>

<label>融資（張）</label>

<input
id="margin"
type="text"
inputmode="numeric"
placeholder="例如 5000"
/>

</div>


<div>

<label>預估 EPS</label>

<input
id="eps"
type="text"
inputmode="decimal"
placeholder="例如 12"
/>

</div>


<div>

<label>營收目標價</label>

<input
id="revenueTarget"
type="text"
inputmode="decimal"
placeholder="例如 48"
/>

</div>

</div>


<div
id="valuation"
class="status">
尚未計算
</div>

</div>


<!-- 我的股票 -->

<div class="card">

<h2>💾 我的股票</h2>

<div class="row">

<button
class="black"
onclick="saveStock()">
＋ 儲存目前股票
</button>

<button
class="red"
onclick="clearStocks()">
🗑 清除全部
</button>

</div>

<div id="savedStocks"></div>

</div>


<div class="card note">

📡 股票資料查詢介面<br>
🔄 查詢後可重新整理更新<br>
🐰 關卡數字可以自行輸入<br>
📌 關卡計算僅供參考，不代表投資建議

</div>

</div>


<script>

let stockData = null;


/* =========================
   基本工具
========================= */

function getNumber(id){

  const value =
    document
    .getElementById(id)
    .value
    .replace(/,/g,"")
    .trim();

  if(value === ""){
    return null;
  }

  const number = Number(value);

  if(!Number.isFinite(number)){
    return null;
  }

  return number;
}


function formatPrice(value){

  if(
    value === null ||
    value === undefined ||
    value === "" ||
    value === "--"
  ){
    return "--";
  }

  return Number(value).toFixed(2);
}


/* =========================
   查詢股票
========================= */

function searchStock(){

  const code =
    document
    .getElementById("stockCode")
    .value
    .trim();

  if(!code){

    document
    .getElementById("searchStatus")
    .innerText =
    "⚠️ 請輸入股票代號";

    return;
  }


  /*
    這裡先建立股票基本資料。
    如果你之後接 Worker，
    只需要把這裡換成 API 即可。
  */

  const names = {

    "2330":"台積電",
    "1326":"台化",
    "2303":"聯電",
    "2618":"長榮航",
    "2367":"燿華",
    "2313":"華通",
    "3491":"昇達科",
    "3481":"群創",
    "8046":"南電",
    "2308":"台達電",
    "3711":"日月光"

  };


  const nameMap = {

    "台積電":"2330",
    "台化":"1326",
    "聯電":"2303",
    "長榮航":"2618",
    "燿華":"2367",
    "華通":"2313",
    "昇達科":"3491",
    "群創":"3481",
    "南電":"8046",
    "台達電":"2308",
    "日月光":"3711"

  };


  let symbol = code;

  if(nameMap[code]){

    symbol = nameMap[code];

  }


  if(!names[symbol]){

    document
    .getElementById("searchStatus")
    .innerText =
    "⚠️ 目前找不到此股票，請輸入股票代號";

    return;

  }


  const name = names[symbol];


  document
  .getElementById("stockName")
  .innerText = name;

  document
  .getElementById("stockNumber")
  .innerText = symbol;


  document
  .getElementById("searchStatus")
  .innerText =
  "✅ 已找到 " + name + "（" + symbol + "）";


  /*
    目前先讓查詢功能正常反應。
    現價等即時數據需要接行情 API。
  */

  calculate();

}


/* =========================
   計算
========================= */

function calculate(){

  let priceText =
    document
    .getElementById("currentPrice")
    .innerText;

  let price = Number(priceText);


  /*
    如果還沒有即時價格，
    可以使用成本價作為計算基準。
  */

  if(
    !Number.isFinite(price) ||
    price <= 0
  ){

    price =
      getNumber("cost");

  }


  if(
    price === null ||
    !Number.isFinite(price)
  ){

    document
    .getElementById("levels")
    .innerHTML =

    `<div class="level">
      <span>計算提示</span>
      <strong>請先輸入成本價</strong>
    </div>`;

    return;

  }


  const cost =
    getNumber("cost") ?? price;

  const tp =
    getNumber("takeProfitPercent") ?? 6;

  const sl =
    getNumber("stopLossPercent") ?? 3;

  const br =
    getNumber("breakPercent") ?? 2;

  const bd =
    getNumber("fallPercent") ?? 2;


  const firstTakeProfit =
    cost * (1 + tp / 100);

  const stopLoss =
    cost * (1 - sl / 100);

  const breakPrice =
    price * (1 + br / 100);

  const fallPrice =
    price * (1 - bd / 100);


  document
  .getElementById("levels")
  .innerHTML =

  `
  <div class="level green">
    <span>🥕 第一止盈</span>
    <strong>${formatPrice(firstTakeProfit)}</strong>
  </div>

  <div class="level redBox">
    <span>🛑 止損</span>
    <strong>${formatPrice(stopLoss)}</strong>
  </div>

  <div class="level blue">
    <span>🚀 突破確認</span>
    <strong>${formatPrice(breakPrice)}</strong>
  </div>

  <div class="level gold">
    <span>⚠️ 跌破注意</span>
    <strong>${formatPrice(fallPrice)}</strong>
  </div>
  `;


  /* 估值 */

  const eps =
    getNumber("eps");

  const pe =
    getNumber("

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>每日收入・盈餘・差額</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;
padding:0;
background:#f3f6fa;
color:#222;
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",Arial,sans-serif
}
body{padding:5px 5px 25px}
.container{max-width:820px;margin:auto}

h1{
font-size:23px;
text-align:center;
margin:3px 0 7px;
font-weight:900
}

.card{
background:#fff;
border:1px solid #dfe4ea;
border-radius:14px;
padding:8px;
margin-bottom:6px;
box-shadow:0 2px 7px rgba(0,0,0,.04)
}

.title{
font-size:19px;
font-weight:900;
margin-bottom:6px
}

.date-grid{
display:grid;
grid-template-columns:1.35fr .8fr;
gap:6px
}

.date-box{
background:#f7f8fa;
border-radius:11px;
padding:6px;
text-align:center
}

.label{
font-size:12px;
color:#777;
margin-bottom:2px
}

.date-box input{
width:100%;
border:0;
background:transparent;
text-align:center;
font-size:18px;
font-weight:900;
color:#222;
outline:none
}

.weekday{
font-size:20px;
font-weight:900;
color:#4f88df;
padding:5px
}

.btn-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-top:6px
}

button{
border:0;
border-radius:10px;
font-size:16px;
font-weight:900;
padding:9px;
cursor:pointer
}

.today{background:#f6bd4f}
.clear{background:#eef0f3;color:#333}
.save{background:#65bd70;color:#fff}

.item{
display:grid;
grid-template-columns:1fr auto;
gap:4px;
align-items:center;
background:#f7f8fa;
border:1px solid #e1e5ea;
border-radius:11px;
padding:5px 7px;
margin-bottom:4px
}

.item-main{min-width:0}

.item-name{
font-size:17px;
font-weight:900
}

.item-note{
font-size:11px;
color:#888;
margin-top:1px
}

.price-wrap{
display:flex;
align-items:center;
gap:2px
}

.price-wrap span{
font-size:14px;
color:#777
}

.price{
width:80px;
height:32px;
border:2px solid #d7dce2;
border-radius:9px;
background:#fff;
text-align:center;
font-size:16px;
font-weight:900;
outline:none
}

.qty-row{
grid-column:1/-1;
display:grid;
grid-template-columns:40px 1fr 40px;
gap:5px
}

.qty-btn{
height:34px;
background:#e9edf3;
color:#397fe4;
font-size:24px;
padding:0
}

.qty{
height:34px;
width:100%;
border:2px solid #d8dde4;
border-radius:9px;
background:#fff;
text-align:center;
font-size:18px;
font-weight:900;
outline:none
}

.other-row{
display:grid;
grid-template-columns:1fr 105px 38px;
gap:5px;
margin-bottom:5px
}

.other-row input{
height:35px;
border:2px solid #d8dde4;
border-radius:9px;
background:#fff;
padding:0 7px;
font-size:14px;
outline:none
}

.other-del{
background:#ffe9e9;
color:#d24d4d;
padding:0;
font-size:19px
}

.add-other{
width:100%;
background:#e9f0ff;
color:#4678c8
}

.total-box{
display:flex;
justify-content:space-between;
align-items:center;
background:#eef9f0;
border:2px solid #bde3c4;
border-radius:11px;
padding:7px 10px
}

.total-label{
font-size:19px;
font-weight:900;
color:#4f8e58
}

.total-value{
font-size:27px;
font-weight:900;
color:#3f9650
}

.take-box{
background:#fff9ec;
border:2px solid #ecd18c;
border-radius:11px;
padding:7px 10px
}

.take-label{
font-size:19px;
font-weight:900;
color:#8c6b20;
margin-bottom:4px
}

.take-input{
width:100%;
height:40px;
border:2px solid #e2ca87;
border-radius:10px;
background:#fff;
text-align:center;
font-size:23px;
font-weight:900;
outline:none
}

.result-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px
}

.result{
border-radius:12px;
padding:8px;
text-align:center;
border:2px solid
}

.result.profit{
background:#effaf1;
border-color:#bde4c5
}

.result.loss{
background:#fff0f0;
border-color:#efc1c1
}

.result-label{
font-size:13px;
color:#777
}

.result-value{
font-size:25px;
font-weight:900;
margin-top:2px
}

.profit .result-value{color:#469651}
.loss .result-value{color:#cf4d4d}

.summary{
background:#f7f8fa;
border-radius:11px;
padding:5px 10px;
margin-top:6px
}

.summary-row{
display:flex;
justify-content:space-between;
padding:5px 0;
border-bottom:1px solid #ddd;
font-size:15px
}

.summary-row:last-child{border-bottom:0}

.summary-row strong{
font-size:17px
}

.acc-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px
}

.acc{
border-radius:12px;
padding:8px;
text-align:center;
border:2px solid
}

.acc.profit{
background:#effaf1;
border-color:#bde4c5
}

.acc.loss{
background:#fff0f0;
border-color:#efc1c1
}

.acc-label{
font-size:14px;
color:#777
}

.acc-value{
font-size:24px;
font-weight:900
}

.acc.profit .acc-value{color:#469651}
.acc.loss .acc-value{color:#cf4d4d}

/* 差額－盈餘 */
.net-acc{
margin-top:6px;
border-radius:12px;
padding:9px;
text-align:center;
border:2px solid #cfd5dc;
background:#f7f8fa
}

.net-acc.positive{
background:#fff0f0;
border-color:#efc1c1
}

.net-acc.negative{
background:#effaf1;
border-color:#bde4c5
}

.net-acc.zero{
background:#f7f8fa;
border-color:#d8dde4
}

.net-label{
font-size:14px;
color:#777
}

.net-value{
font-size:26px;
font-weight:900;
margin-top:2px
}

.net-acc.positive .net-value{color:#cf4d4d}
.net-acc.negative .net-value{color:#469651}
.net-acc.zero .net-value{color:#555}

.clear-all{
width:100%;
background:#fff0f0;
color:#c94d4d;
margin-top:7px;
border:1px solid #efbcbc
}

.detail-box{
background:#f8fafc;
border:1px solid #dce3ea;
border-radius:12px;
padding:8px
}

.detail-text{
white-space:pre-wrap;
word-break:break-word;
font-size:14px;
line-height:1.5;
background:#fff;
border-radius:9px;
padding:9px;
border:1px solid #e1e5ea
}

.detail-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-top:6px
}

.copy-btn{
background:#e9f0ff;
color:#4678c8
}

.share-btn{
background:#65bd70;
color:#fff
}

.history-wrap{
overflow-x:auto
}

table{
width:100%;
border-collapse:collapse;
min-width:600px
}

th{
background:#edf1f5;
padding:7px 4px;
font-size:13px
}

td{
padding:7px 4px;
text-align:center;
border-bottom:1px solid #e0e4e8;
font-size:12px;
white-space:nowrap
}

td button{
padding:4px 8px;
font-size:12px;
background:#e9f0ff;
color:#4678c8
}

.empty{
text-align:center;
color:#999;
padding:15px
}

.small-note{
text-align:center;
color:#888;
font-size:11px;
margin-top:5px
}

.history-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-bottom:6px
}

.history-save{
background:#65bd70;
color:#fff
}

.history-clear{
background:#ffe9e9;
color:#c94d4d
}

@media(max-width:500px){
body{padding:4px 4px 20px}

.card{
border-radius:13px;
padding:7px;
margin-bottom:5px
}

h1{
font-size:22px;
margin:3px 0 6px
}

.title{
font-size:18px;
margin-bottom:5px
}

.item{
padding:5px 6px;
margin-bottom:3px
}

.item-name{
font-size:17px
}

.price{
width:78px;
height:31px;
font-size:16px
}

.qty-row{
grid-template-columns:39px 1fr 39px
}

.qty-btn,.qty{
height:33px
}

.total-label,.take-label{
font-size:18px
}

.total-value{
font-size:25px
}

.take-input{
height:39px;
font-size:22px
}

.result-value{
font-size:23px
}

.acc-value{
font-size:22px
}

.net-value{
font-size:24px
}

.detail-text{
font-size:14px
}
}
</style>
</head>

<body>

<div class="container">

<h1>🧾 每日收入・盈餘・差額</h1>

<!-- 日期 -->
<div class="card">

<div class="title">📅 日期</div>

<div class="date-grid">

<div class="date-box">
<div class="label">日期（可自由修改）</div>
<input id="dateInput" type="date">
</div>

<div class="date-box">
<div class="label">星期</div>
<div id="weekday" class="weekday"></div>
</div>

</div>

<div class="btn-row">
<button class="today" onclick="setToday()">今天</button>
<button class="clear" onclick="clearToday()">🗑️ 清除今天</button>
</div>

</div>


<!-- 固定收入 -->
<div class="card">

<div class="title">🍜 固定收入</div>

<div id="fixedItems"></div>

<div class="title" style="margin-top:6px">＋ 其他項目收入</div>

<div id="otherItems"></div>

<button class="add-other" onclick="addOther()">
＋ 新增其他收入
</button>

</div>


<!-- 收入 -->
<div class="card">

<div class="total-box">

<div class="total-label">💵 收入</div>

<div id="incomeTotal" class="total-value">
$0
</div>

</div>

</div>


<!-- 拿 -->
<div class="card">

<div class="take-box">

<div class="take-label">💸 拿</div>

<input
id="takeInput"
class="take-input"
type="number"
inputmode="decimal"
min="0"
value="0"
placeholder="請輸入拿的金額"
>

</div>

</div>


<!-- 今日結果 -->
<div class="card">

<div class="title">📊 今日結果</div>

<div class="result-grid">

<div class="result profit">

<div class="result-label">
收入 − 拿
</div>

<div id="profitValue" class="result-value">
$0
</div>

</div>

<div class="result loss">

<div class="result-label">
不足差額
</div>

<div id="lossValue" class="result-value">
$0
</div>

</div>

</div>


<div class="summary">

<div class="summary-row">
<span>今日收入</span>
<strong id="sumIncome">$0</strong>
</div>

<div class="summary-row">
<span>今日拿</span>
<strong id="sumTake">$0</strong>
</div>

<div class="summary-row">
<span>今日盈餘</span>
<strong id="sumProfit">$0</strong>
</div>

<div class="summary-row">
<span>今日差額</span>
<strong id="sumLoss">$0</strong>
</div>

</div>

</div>


<!-- 累加 -->
<div class="card">

<div class="title">📈 累加統計</div>

<div class="acc-grid">

<div class="acc profit">

<div class="acc-label">
盈餘累加
</div>

<div id="profitAccum" class="acc-value">
$0
</div>

</div>


<div class="acc loss">

<div class="acc-label">
差額累加
</div>

<div id="lossAccum" class="acc-value">
$0
</div>

</div>

</div>


<!-- 新增：差額累加－盈餘累加 -->
<div id="netAccumBox" class="net-acc zero">

<div class="net-label">
⚖️ 差額累加 − 盈餘累加
</div>

<div id="netAccum" class="net-value">
$0
</div>

</div>


<button class="clear-all" onclick="clearAll()">
🗑️ 清除全部紀錄
</button>

</div>


<!-- 詳細明細 -->
<div class="card">

<div class="title">📋 詳細明細</div>

<div class="detail-box">

<div id="detailText" class="detail-text"></div>

<div class="detail-buttons">

<button class="copy-btn" onclick="copyDetail()">
📋 複製明細
</button>

<button class="share-btn" onclick="shareDetail()">
📤 分享明細
</button>

</div>

</div>

</div>


<!-- 每日紀錄 -->
<div class="card">

<div class="title">📚 每日紀錄</div>

<div class="history-actions">

<button
class="history-save"
onclick="saveToday(true)">
💾 儲存今天
</button>

<button
class="history-clear"
onclick="clearToday()">
🗑️ 清除今天
</button>

</div>


<div class="history-wrap">

<table>

<thead>

<tr>
<th>日期</th>
<th>星期</th>
<th>收入</th>
<th>拿</th>
<th>盈餘</th>
<th>差額</th>
<th>操作</th>
</tr>

</thead>

<tbody id="historyBody"></tbody>

</table>

</div>

<div class="small-note">
資料會自動儲存在此裝置
</div>

</div>

</div>


<script>

const STORAGE_KEY="daily_income_records_final_20260826";
const CURRENT_KEY="daily_income_current_final_20260826";

const fixedDefault=[

{
id:"noodle",
name:"🍜 麵線",
price:850,
qty:1,
note:"單價可自由修改"
},

{
id:"lemon",
name:"🍋 檸檬",
price:1200,
qty:1,
note:"單價可自由修改"
},

{
id:"intestine",
name:"🥣 大腸",
price:150,
qty:0,
note:"一包 $150"
},

{
id:"oyster",
name:"🦪 蚵仔",
price:150,
qty:0,
note:"一包 $150"
}

];

let fixedItems=[];
let others=[];
let records={};


/* 金額格式 */

function fmt(n){

return "$"+
Math.round(Number(n)||0)
.toLocaleString("zh-TW");

}


/* 今天日期 */

function todayStr(){

const d=new Date();

return d.getFullYear()+
"-"+
String(d.getMonth()+1).padStart(2,"0")+
"-"+
String(d.getDate()).padStart(2,"0");

}


/* 星期 */

function weekdayText(date){

if(!date)return"";

const d=
new Date(date+"T00:00:00");

return[
"星期日",
"星期一",
"星期二",
"星期三",
"星期四",
"星期五",
"星期六"
][d.getDay()];

}


function getDate(){

return document.getElementById("dateInput").value||
todayStr();

}


function escapeHtml(str){

return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* 載入資料 */

function loadStorage(){

try{

records=
JSON.parse(
localStorage.getItem(STORAGE_KEY)||"{}"
);

}catch(e){

records={};

}


try{

const cur=
JSON.parse(
localStorage.getItem(CURRENT_KEY)||"null"
);

if(cur){

fixedItems=
cur.fixedItems||
JSON.parse(
JSON.stringify(fixedDefault)
);

others=
cur.others||[];

document.getElementById(
"takeInput"
).value=
cur.take||0;

}else{

fixedItems=
JSON.parse(
JSON.stringify(fixedDefault)
);

others=[];

}

}catch(e){

fixedItems=
JSON.parse(
JSON.stringify(fixedDefault)
);

others=[];

}

}


/* 儲存目前正在編輯的資料 */

function saveCurrent(){

localStorage.setItem(
CURRENT_KEY,
JSON.stringify({

fixedItems,
others,

take:
Number(
document.getElementById(
"takeInput"
).value
)||0

})
);

}


/* 固定項目畫面 */

function renderFixed(){

const box=
document.getElementById(
"fixedItems"
);

box.innerHTML="";


fixedItems.forEach(
(item,index)=>{

const el=
document.createElement("div");

el.className="item";

el.innerHTML=`

<div class="item-main">

<div class="item-name">
${item.name}
</div>

<div class="item-note">
${item.note||"單價可自由修改"}
</div>

</div>


<div class="price-wrap">

<span>$</span>

<input
class="price"
type="number"
inputmode="decimal"
value="${item.price}"
oninput="changePrice(${index},this.value)"
>

</div>


<div class="qty-row">

<button
type="button"
class="qty-btn"
onclick="changeQty(${index},-1)">
−
</button>


<input
class="qty"
type="number"
inputmode="numeric"
min="0"
step="1"
value="${Math.max(
0,
Math.floor(
Number(item.qty)||0
)
)}"
oninput="setQty(${index},this.value)"
onchange="setQty(${index},this.value)"
>


<button
type="button"
class="qty-btn"
onclick="changeQty(${index},1)">
＋
</button>

</div>

`;

box.appendChild(el);

});

}


/* 數量增加／減少 */

function changeQty(index,delta){

let q=
parseInt(
fixedItems[index].qty,
10
);

if(!Number.isFinite(q))q=0;

q+=delta;

if(q<0)q=0;

fixedItems[index].qty=q;

renderFixed();

calculate();

saveCurrent();

autoSave();

}


/* 手動輸入數量 */

function setQty(index,value){

let q=
parseInt(
value,
10
);

if(!Number.isFinite(q)||q<0)q=0;

fixedItems[index].qty=q;

calculate();

saveCurrent();

autoSave();

}


/* 修改單價 */

function changePrice(index,value){

fixedItems[index].price=
Number(value)||0;

calculate();

saveCurrent();

autoSave();

}


/* 其他收入 */

function renderOthers(){

const box=
document.getElementById(
"otherItems"
);

box.innerHTML="";


others.forEach(
(item,index)=>{

const row=
document.createElement("div");

row.className="other-row";

row.innerHTML=`

<input
type="text"
value="${escapeHtml(item.name||"")}"
placeholder="項目名稱（可空白）"
oninput="changeOtherName(${index},this.value)"
>

<input
type="number"
inputmode="decimal"
value="${item.amount||0}"
placeholder="金額"
oninput="changeOtherAmount(${index},this.value)"
>

<button
type="button"
class="other-del"
onclick="removeOther(${index})">
×
</button>

`;

box.appendChild(row);

});

}


function addOther(){

others.push({
name:"",
amount:0
});

renderOthers();

saveCurrent();

calculate();

}


function removeOther(index){

others.splice(index,1);

renderOthers();

calculate();

saveCurrent();

autoSave();

}


function changeOtherName(index,value){

others[index].name=value;

calculate();

saveCurrent();

autoSave();

}


function changeOtherAmount(index,value){

others[index].amount=
Number(value)||0;

calculate();

saveCurrent();

autoSave();

}


/* 收入總額 */

function incomeTotal(){

let total=0;


fixedItems.forEach(
item=>{

total+=
(Number(item.price)||0)*
(Number(item.qty)||0);

});


others.forEach(
item=>{

total+=
Number(item.amount)||0;

});


return total;

}


/* 計算今日結果 */

function calculate(){

const income=
incomeTotal();

const take=
Number(
document.getElementById(
"takeInput"
).value
)||0;

const diff=
income-take;

const profit=
Math.max(diff,0);

const loss=
Math.max(-diff,0);


document.getElementById(
"incomeTotal"
).textContent=
fmt(income);


document.getElementById(
"profitValue"
).textContent=
fmt(profit);


document.getElementById(
"lossValue"
).textContent=
fmt(loss);


document.getElementById(
"sumIncome"
).textContent=
fmt(income);


document.getElementById(
"sumTake"
).textContent=
fmt(take);


document.getElementById(
"sumProfit"
).textContent=
fmt(profit);


document.getElementById(
"sumLoss"
).textContent=
fmt(loss);


calculateAccum();

renderDetail();

}


/* 累加統計 */

function calculateAccum(){

let profit=0;
let loss=0;


Object.values(records)
.forEach(r=>{

profit+=
Number(r.profit)||0;

loss+=
Number(r.loss)||0;

});


const net=
loss-profit;


document.getElementById(
"profitAccum"
).textContent=
fmt(profit);


document.getElementById(
"lossAccum"
).textContent=
fmt(loss);


const netBox=
document.getElementById(
"netAccumBox"
);

const netValue=
document.getElementById(
"netAccum"
);


if(net>0){

netValue.textContent=
fmt(net);

netBox.className=
"net-acc positive";

}else if(net<0){

netValue.textContent=
"-"+fmt(Math.abs(net));

netBox.className=
"net-acc negative";

}else{

netValue.textContent="$0";

netBox.className=
"net-acc zero";

}

}


/* 取得目前資料 */

function getCurrentData(){

const income=
incomeTotal();

const take=
Number(
document.getElementById(
"takeInput"
).value
)||0;

const diff=
income-take;


return{

date:getDate(),

weekday:
weekdayText(getDate()),

income,

take,

profit:
Math.max(diff,0),

loss:
Math.max(-diff,0),

fixedItems:
JSON.parse(
JSON.stringify(fixedItems)
),

others:
JSON.parse(
JSON.stringify(others)
)

};

}


/* 儲存今天 */

function saveToday(show=false){

const data=
getCurrentData();

records[data.date]=data;


localStorage.setItem(
STORAGE_KEY,
JSON.stringify(records)
);


renderHistory();

calculateAccum();


if(show){

alert(
"✅ 今天的紀錄已儲存！"
);

}

}


/* 自動儲存 */

function autoSave(){

saveToday(false);

saveCurrent();

}


/* 詳細明細文字 */

function makeDetailText(){

const d=
getCurrentData();

let text="";

text+=
"📋 每日收入詳細明細\n";

text+=
"━━━━━━━━━━━━━━\n";

text+=
"📅 "+
d.date+
" "+
d.weekday+
"\n\n";


d.fixedItems.forEach(
item=>{

const price=
Number(item.price)||0;

const qty=
Number(item.qty)||0;

if(qty>0){

text+=
item.name+
" "+
fmt(price)+
" × "+
qty+
" = "+
fmt(price*qty)+
"\n";

}

});


d.others.forEach(
item=>{

const amount=
Number(item.amount)||0;

if(
item.name.trim()!==""||
amount!==0
){

text+=
"➕ "+
(item.name||"其他收入")+
" "+
fmt(amount)+
"\n";

}

});


text+="\n";

text+=
"💵 收入："+
fmt(d.income)+
"\n";

text+=
"💸 拿："+
fmt(d.take)+
"\n";

text+=
"🟢 盈餘："+
fmt(d.profit)+
"\n";

text+=
"🔴 差額："+
fmt(d.loss)+
"\n";

text+=
"━━━━━━━━━━━━━━";

return text;

}


function renderDetail(){

document.getElementById(
"detailText"
).textContent=
makeDetailText();

}


/* 複製明細 */

async function copyDetail(){

const text=
makeDetailText();


try{

await navigator.clipboard.writeText(
text
);

alert(
"📋 明細已複製！\n\n可以直接貼到 LINE 或訊息。"
);

}catch(e){

const area=
document.createElement("textarea");

area.value=text;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

area.remove();

alert(
"📋 明細已複製！"
);

}

}


/* 分享明細 */

async function shareDetail(){

const text=
makeDetailText();


if(navigator.share){

try{

await navigator.share({

title:
"每日收入詳細明細",

text:text

});

}catch(e){

}

}else{

await copyDetail();

alert(
"目前瀏覽器不支援直接分享，已先幫你複製明細。"
);

}

}


/* 每日紀錄 */

function renderHistory(){

const body=
document.getElementById(
"historyBody"
);

body.innerHTML="";


const arr=
Object.values(records)
.sort(
(a,b)=>
b.date.localeCompare(a.date)
);


if(!arr.length){

body.innerHTML=
`
<tr>
<td colspan="7" class="empty">
目前還沒有每日紀錄
</td>
</tr>
`;

return;

}


arr.forEach(
r=>{

const tr=
document.createElement("tr");

tr.innerHTML=`

<td>${r.date}</td>

<td>${r.weekday}</td>

<td>${fmt(r.income)}</td>

<td>${fmt(r.take)}</td>

<td style="
color:#469651;
font-weight:900">
${fmt(r.profit)}
</td>

<td style="
color:#cf4d4d;
font-weight:900">
${fmt(r.loss)}
</td>

<td>

<button
type="button"
onclick="loadRecord('${r.date}')">
載入
</button>

</td>

`;

body.appendChild(tr);

});

}


/* 載入紀錄 */

function loadRecord(date){

const r=
records[date];

if(!r)return;


document.getElementById(
"dateInput"
).value=
r.date;


document.getElementById(
"weekday"
).textContent=
r.weekday;


fixedItems=
JSON.parse(
JSON.stringify(
r.fixedItems||
fixedDefault
)
);


others=
JSON.parse(
JSON.stringify(
r.others||[]
)
);


document.getElementById(
"takeInput"
).value=
r.take||0;


renderFixed();

renderOthers();

calculate();

saveCurrent();


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* 今天 */

function setToday(){

const d=
todayStr();


document.getElementById(
"dateInput"
).value=d;


document.getElementById(
"weekday"
).textContent=
weekdayText(d);


if(records[d]){

const r=
records[d];


fixedItems=
JSON.parse(
JSON.stringify(
r.fixedItems||
fixedDefault
)
);


others=
JSON.parse(
JSON.stringify(
r.others||[]
)
);


document.getElementById(
"takeInput"
).value=
r.take||0;

}else{

fixedItems=
JSON.parse(
JSON.stringify(fixedDefault)
);

others=[];

document.getElementById(
"takeInput"
).value=0;

}


renderFixed();

renderOthers();

calculate();

saveCurrent();

}


/* 清除今天 */

function clearToday(){

const date=
getDate();


if(
!confirm(
"⚠️ 確定要清除 "+
date+
" 的紀錄嗎？"
)
){

return;

}


delete records[date];


localStorage.setItem(
STORAGE_KEY,
JSON.stringify(records)
);


fixedItems=
JSON.parse(
JSON.stringify(fixedDefault)
);

others=[];


document.getElementById(
"takeInput"
).value=0;


renderFixed();

renderOthers();

calculate();

renderHistory();

saveCurrent();


alert(
"🗑️ 今天的紀錄已清除！"
);

}


/* 清除全部 */

function clearAll(){

if(
!confirm(
"⚠️ 確定要清除全部歷史紀錄嗎？\n\n"+
"所有日期的紀錄都會刪除，而且無法復原。"
)
){

return;

}


if(
!confirm(
"⚠️ 再次確認：真的要全部刪除嗎？"
)
){

return;

}


records={};


localStorage.removeItem(
STORAGE_KEY
);


fixedItems=
JSON.parse(
JSON.stringify(fixedDefault)
);

others=[];


document.getElementById(
"takeInput"
).value=0;


renderFixed();

renderOthers();

calculate();

renderHistory();

saveCurrent();


alert(
"🗑️ 全部紀錄已清除！"
);

}


/* 日期修改 */

function updateWeekday(){

const d=
getDate();


document.getElementById(
"weekday"
).textContent=
weekdayText(d);

}


document.getElementById(
"dateInput"
).addEventListener(
"change",
()=>{

updateWeekday();

const d=
getDate();


if(records[d]){

const r=
records[d];


fixedItems=
JSON.parse(
JSON.stringify(
r.fixedItems||
fixedDefault
)
);


others=
JSON.parse(
JSON.stringify(
r.others||[]
)
);


document.getElementById(
"takeInput"
).value=
r.take||0;

}else{

/*
如果日期是以前漏記的日期，
允許直接重新填寫。
*/
document.getElementById(
"takeInput"
).value=0;

}


renderFixed();

renderOthers();

calculate();

saveCurrent();

}
);


/* 拿 */

document.getElementById(
"takeInput"
).addEventListener(
"input",
()=>{

calculate();

saveCurrent();

autoSave();

}
);


/* 初始化 */

function init(){

loadStorage();


const d=
todayStr();


document.getElementById(
"dateInput"
).value=d;


if(records[d]){

const r=
records[d];


fixedItems=
JSON.parse(
JSON.stringify(
r.fixedItems||
fixedDefault
)
);


others=
JSON.parse(
JSON.stringify(
r.others||[]
)
);


document.getElementById(
"takeInput"
).value=
r.take||0;

}


updateWeekday();

renderFixed();

renderOthers();

calculate();

renderHistory();


/*
每10秒自動儲存一次
*/

setInterval(
autoSave,
10000
);

}


init();

</script>

</body>
</html>

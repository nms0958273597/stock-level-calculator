<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家庭記帳｜財務管理</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Noto Sans TC",Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

h1{
    text-align:center;
    margin:8px 0 4px;
    font-size:28px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:18px;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card h2{
    margin:0 0 15px;
    font-size:20px;
}

.month-row{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.month-row input{
    flex:1;
}

input,select,button{
    width:100%;
    min-height:46px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:10px 12px;
    font-size:16px;
}

button{
    border:none;
    background:#222;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button.secondary{
    background:#777;
}

button.danger{
    background:#c62828;
}

button.green{
    background:#27864b;
}

button.blue{
    background:#3269b0;
}

button:active{
    transform:scale(.98);
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    background:#f7f8fa;
    border-radius:15px;
    padding:15px;
}

.stat-title{
    color:#777;
    font-size:14px;
}

.stat-value{
    font-size:25px;
    font-weight:800;
    margin-top:5px;
}

.income{
    color:#16803c;
}

.expense{
    color:#c62828;
}

.balance{
    color:#2366ad;
}

.invest{
    color:#7a45a5;
}

.progress{
    height:13px;
    background:#e6e6e6;
    border-radius:20px;
    overflow:hidden;
    margin:8px 0;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#333;
    transition:.3s;
}

.category-row{
    margin-bottom:14px;
}

.category-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
}

.bar{
    height:12px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
}

.bar-inner{
    height:100%;
    width:0;
    background:#555;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:9px 5px;
    border-bottom:1px solid #eee;
    text-align:left;
    font-size:14px;
}

td:last-child,th:last-child{
    text-align:right;
}

.record{
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.record:last-child{
    border-bottom:none;
}

.record-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.record-name{
    font-weight:bold;
}

.record-amount{
    font-weight:bold;
    color:#c62828;
}

.record-info{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.record-buttons{
    display:flex;
    gap:7px;
    margin-top:8px;
}

.record-buttons button{
    min-height:36px;
    padding:5px;
    font-size:14px;
}

.score{
    text-align:center;
    font-size:52px;
    font-weight:900;
    margin:5px 0;
}

.score-text{
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.warning{
    padding:12px;
    border-radius:12px;
    background:#fff4d8;
    margin-top:10px;
}

.good{
    padding:12px;
    border-radius:12px;
    background:#e8f7ed;
    margin-top:10px;
}

.bad{
    padding:12px;
    border-radius:12px;
    background:#fdeaea;
    margin-top:10px;
}

.small{
    font-size:13px;
    color:#777;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.full{
    grid-column:1/-1;
}

.flex-buttons{
    display:flex;
    gap:8px;
}

.flex-buttons button{
    flex:1;
}

.hidden{
    display:none;
}

.empty{
    text-align:center;
    color:#999;
    padding:20px 0;
}

@media(max-width:600px){
    .container{
        padding:10px;
    }

    h1{
        font-size:25px;
    }

    .grid{
        grid-template-columns:1fr 1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .stat-value{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>💰 家庭記帳</h1>
<div class="subtitle">收入、支出、儲蓄與家庭財務分析</div>

<!-- 月份 -->
<div class="card">
    <h2>📅 記帳月份</h2>

    <div class="month-row">
        <input type="month" id="month">
        <button onclick="changeMonth()">查看</button>
    </div>

    <div class="small">
        每個月份資料會獨立保存。
    </div>
</div>

<!-- 收入 -->
<div class="card">
    <h2>💰 收入</h2>

    <div class="form-grid">

        <div>
            <label>薪水</label>
            <input type="number" id="salary" value="50000">
        </div>

        <div>
            <label>其他收入</label>
            <input type="number" id="otherIncome" value="0">
        </div>

        <div class="full">
            <button class="green" onclick="saveIncome()">
                💾 儲存收入
            </button>
        </div>

    </div>
</div>

<!-- 快速支出 -->
<div class="card">
    <h2>➕ 新增支出</h2>

    <div class="form-grid">

        <div>
            <label>日期</label>
            <input type="date" id="expenseDate">
        </div>

        <div>
            <label>分類</label>
            <select id="expenseCategory">

                <option value="房租">🏠 房租</option>
                <option value="水電">💡 水電</option>
                <option value="信貸">💳 信貸</option>

                <option value="小朋友">👶 小朋友</option>

                <option value="夫妻-老公">👨 丈夫</option>
                <option value="夫妻-老婆">👩 妻子</option>
                <option value="夫妻-共同">❤️ 夫妻共同</option>

                <option value="生活">🍚 生活</option>
                <option value="交通">🚗 交通</option>
                <option value="娛樂">🎮 娛樂</option>
                <option value="購物">🛍️ 購物</option>

                <option value="儲蓄">🏦 儲蓄</option>
                <option value="投資">📈 投資</option>

                <option value="其他">📦 其他</option>

            </select>
        </div>

        <div>
            <label>金額</label>
            <input type="number" id="expenseAmount" placeholder="例如 1500">
        </div>

        <div>
            <label>備註</label>
            <input type="text" id="expenseNote" placeholder="例如 晚餐">
        </div>

        <div class="full">
            <button onclick="addExpense()">
                ➕ 新增這筆支出
            </button>
        </div>

    </div>
</div>

<!-- 總覽 -->
<div class="card">
    <h2>📊 本月財務總覽</h2>

    <div class="grid">

        <div class="stat">
            <div class="stat-title">💰 總收入</div>
            <div class="stat-value income" id="totalIncome">$0</div>
        </div>

        <div class="stat">
            <div class="stat-title">📉 總支出</div>
            <div class="stat-value expense" id="totalExpense">$0</div>
        </div>

        <div class="stat">
            <div class="stat-title">💵 剩餘</div>
            <div class="stat-value balance" id="remaining">$0</div>
        </div>

        <div class="stat">
            <div class="stat-title">💰 儲蓄率</div>
            <div class="stat-value" id="savingRate">0%</div>
        </div>

        <div class="stat">
            <div class="stat-title">🏦 儲蓄</div>
            <div class="stat-value" id="savingAmount">$0</div>
        </div>

        <div class="stat">
            <div class="stat-title">📈 投資</div>
            <div class="stat-value invest" id="investmentAmount">$0</div>
        </div>

    </div>
</div>

<!-- 每日可花 -->
<div class="card">
    <h2>📆 每日可花多少？</h2>

    <div class="grid">

        <div class="stat">
            <div class="stat-title">本月剩餘生活金</div>
            <div class="stat-value" id="dailyMoney">$0</div>
        </div>

        <div class="stat">
            <div class="stat-title">剩餘天數</div>
            <div class="stat-value" id="daysLeft">0</div>
        </div>

    </div>

    <div id="dailyAdvice" class="good">
        正在分析……
    </div>
</div>

<!-- 支出分類 -->
<div class="card">
    <h2>📊 支出分類分析</h2>

    <div id="categoryAnalysis"></div>
</div>

<!-- 支出排行榜 -->
<div class="card">
    <h2>🏆 支出排行榜</h2>

    <div id="ranking"></div>
</div>

<!-- 預算 -->
<div class="card">
    <h2>🎯 每月預算</h2>

    <div class="form-grid">

        <div>
            <label>房租預算</label>
            <input type="number" id="budgetRent" value="15000">
        </div>

        <div>
            <label>水電預算</label>
            <input type="number" id="budgetUtility" value="3000">
        </div>

        <div>
            <label>信貸預算</label>
            <input type="number" id="budgetLoan" value="8000">
        </div>

        <div>
            <label>小朋友預算</label>
            <input type="number" id="budgetChild" value="8000">
        </div>

        <div>
            <label>夫妻預算</label>
            <input type="number" id="budgetCouple" value="6000">
        </div>

        <div>
            <label>生活預算</label>
            <input type="number" id="budgetLife" value="8000">
        </div>

        <div class="full">
            <button class="blue" onclick="saveBudget()">
                💾 儲存預算
            </button>
        </div>

    </div>

    <div id="budgetAnalysis"></div>
</div>

<!-- 緊急預備金 -->
<div class="card">
    <h2>🛟 緊急預備金</h2>

    <div class="form-grid">

        <div>
            <label>目前預備金</label>
            <input type="number" id="emergencyCurrent" value="0">
        </div>

        <div>
            <label>目標金額</label>
            <input type="number" id="emergencyTarget" value="150000">
        </div>

        <div class="full">
            <button class="green" onclick="saveEmergency()">
                💾 儲存預備金
            </button>
        </div>

    </div>

    <div class="progress">
        <div class="progress-bar" id="emergencyBar"></div>
    </div>

    <div id="emergencyText"></div>
</div>

<!-- 信貸 -->
<div class="card">
    <h2>💳 信貸管理</h2>

    <div class="form-grid">

        <div>
            <label>剩餘本金</label>
            <input type="number" id="loanBalance" value="0">
        </div>

        <div>
            <label>年利率 %</label>
            <input type="number" step="0.01" id="loanRate" value="0">
        </div>

        <div>
            <label>每月還款</label>
            <input type="number" id="loanPayment" value="0">
        </div>

        <div>
            <label>剩餘期數</label>
            <input type="number" id="loanMonths" value="0">
        </div>

        <div class="full">
            <button class="blue" onclick="saveLoan()">
                💾 儲存信貸資料
            </button>
        </div>

    </div>

    <div id="loanAnalysis"></div>
</div>

<!-- 財務健康 -->
<div class="card">
    <h2>❤️ 家庭財務健康</h2>

    <div class="score" id="healthScore">0</div>
    <div class="score-text" id="healthText">分析中</div>

    <div id="healthAdvice"></div>
</div>

<!-- 本月紀錄 -->
<div class="card">
    <h2>🧾 本月記帳紀錄</h2>

    <div id="records"></div>
</div>

<!-- 年度 -->
<div class="card">
    <h2>📅 年度統計</h2>

    <select id="yearSelect" onchange="renderYear()"></select>

    <div id="yearAnalysis" style="margin-top:15px;"></div>
</div>

<!-- 資料管理 -->
<div class="card">
    <h2>💾 資料管理</h2>

    <div class="flex-buttons">
        <button class="secondary" onclick="exportData()">
            匯出資料
        </button>

        <button class="danger" onclick="clearMonth()">
            清除本月
        </button>
    </div>

    <p class="small">
        資料會保存在目前瀏覽器的 LocalStorage。
    </p>
</div>

</div>

<script>

const STORAGE_KEY = "family_budget_v1";

let database = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "{}"
);

let currentMonth = getCurrentMonth();

document.getElementById("month").value = currentMonth;

document.getElementById("expenseDate").value =
    new Date().toISOString().slice(0,10);

function getCurrentMonth(){
    const d = new Date();
    return d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0");
}

function money(n){
    return "$" + Number(n || 0).toLocaleString("zh-TW");
}

function monthData(){

    if(!database[currentMonth]){

        database[currentMonth] = {

            income:{
                salary:50000,
                other:0
            },

            expenses:[],

            budget:{
                rent:15000,
                utility:3000,
                loan:8000,
                child:8000,
                couple:6000,
                life:8000
            },

            emergency:{
                current:0,
                target:150000
            },

            loan:{
                balance:0,
                rate:0,
                payment:0,
                months:0
            }

        };

    }

    return database[currentMonth];
}

function saveDB(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(database)
    );

}

function saveIncome(){

    const d = monthData();

    d.income.salary =
        Number(document.getElementById("salary").value) || 0;

    d.income.other =
        Number(document.getElementById("otherIncome").value) || 0;

    saveDB();
    render();

}

function saveBudget(){

    const d = monthData();

    d.budget = {

        rent:Number(document.getElementById("budgetRent").value)||0,

        utility:Number(document.getElementById("budgetUtility").value)||0,

        loan:Number(document.getElementById("budgetLoan").value)||0,

        child:Number(document.getElementById("budgetChild").value)||0,

        couple:Number(document.getElementById("budgetCouple").value)||0,

        life:Number(document.getElementById("budgetLife").value)||0

    };

    saveDB();
    render();

}

function saveEmergency(){

    const d = monthData();

    d.emergency.current =
        Number(document.getElementById("emergencyCurrent").value)||0;

    d.emergency.target =
        Number(document.getElementById("emergencyTarget").value)||0;

    saveDB();
    render();

}

function saveLoan(){

    const d = monthData();

    d.loan = {

        balance:Number(document.getElementById("loanBalance").value)||0,

        rate:Number(document.getElementById("loanRate").value)||0,

        payment:Number(document.getElementById("loanPayment").value)||0,

        months:Number(document.getElementById("loanMonths").value)||0

    };

    saveDB();
    render();

}

function addExpense(){

    const amount =
        Number(document.getElementById("expenseAmount").value);

    if(!amount || amount <= 0){

        alert("請輸入支出金額");
        return;

    }

    const d = monthData();

    d.expenses.push({

        id:Date.now(),

        date:
            document.getElementById("expenseDate").value ||
            new Date().toISOString().slice(0,10),

        category:
            document.getElementById("expenseCategory").value,

        amount:amount,

        note:
            document.getElementById("expenseNote").value || ""

    });

    saveDB();

    document.getElementById("expenseAmount").value="";
    document.getElementById("expenseNote").value="";

    render();

}

function deleteExpense(id){

    const d = monthData();

    if(!confirm("確定要刪除這筆記錄嗎？")){
        return;
    }

    d.expenses =
        d.expenses.filter(x => x.id !== id);

    saveDB();

    render();

}

function editExpense(id){

    const d = monthData();

    const item =
        d.expenses.find(x => x.id === id);

    if(!item)return;

    const amount =
        prompt("修改金額",item.amount);

    if(amount === null)return;

    const note =
        prompt("修改備註",item.note);

    item.amount =
        Number(amount)||item.amount;

    if(note !== null){
        item.note=note;
    }

    saveDB();

    render();

}

function changeMonth(){

    currentMonth =
        document.getElementById("month").value;

    if(!currentMonth)return;

    render();

}

function categoryTotal(category){

    const d=monthData();

    return d.expenses
        .filter(x=>x.category===category)
        .reduce((sum,x)=>sum+Number(x.amount),0);

}

function getTotals(){

    const d=monthData();

    const income =
        Number(d.income.salary||0) +
        Number(d.income.other||0);

    const expense =
        d.expenses
        .reduce((sum,x)=>sum+Number(x.amount),0);

    const saving =
        categoryTotal("儲蓄");

    const investment =
        categoryTotal("投資");

    return {
        income,
        expense,
        remaining:income-expense,
        saving,
        investment
    };

}

function renderSummary(){

    const d=monthData();
    const t=getTotals();

    document.getElementById("salary").value =
        d.income.salary;

    document.getElementById("otherIncome").value =
        d.income.other;

    document.getElementById("totalIncome").textContent =
        money(t.income);

    document.getElementById("totalExpense").textContent =
        money(t.expense);

    document.getElementById("remaining").textContent =
        money(t.remaining);

    document.getElementById("savingAmount").textContent =
        money(t.saving);

    document.getElementById("investmentAmount").textContent =
        money(t.investment);

    const rate =
        t.income > 0
        ? (t.saving / t.income * 100)
        : 0;

    document.getElementById("savingRate").textContent =
        rate.toFixed(1)+"%";

}

function renderDaily(){

    const t=getTotals();

    const now=new Date();

    const year=now.getFullYear();

    const month=now.getMonth();

    const isCurrent =
        currentMonth ===
        year+"-"+String(month+1).padStart(2,"0");

    let daysLeft;

    if(isCurrent){

        daysLeft =
            new Date(
                year,
                month+1,
                0
            ).getDate()-now.getDate()+1;

    }else{

        daysLeft =
            new Date(
                Number(currentMonth.slice(0,4)),
                Number(currentMonth.slice(5,7)),
                0
            ).getDate();

    }

    const available =
        Math.max(t.remaining,0);

    const daily =
        daysLeft > 0
        ? available/daysLeft
        : 0;

    document.getElementById("dailyMoney").textContent =
        money(daily);

    document.getElementById("daysLeft").textContent =
        daysLeft;

    const box =
        document.getElementById("dailyAdvice");

    if(t.remaining<0){

        box.className="bad";

        box.textContent =
            "🔴 本月已超支 "+money(Math.abs(t.remaining))+"，建議立即控制非必要支出。";

    }else if(daily<300){

        box.className="warning";

        box.textContent =
            "🟡 每日可用金額偏低，這個月要注意支出。";

    }else{

        box.className="good";

        box.textContent =
            "🟢 目前剩餘金額尚可，平均每天可以使用 "+money(daily)+"。";

    }

}

function renderCategories(){

    const categories = {

        "房租":"🏠 房租",
        "水電":"💡 水電",
        "信貸":"💳 信貸",
        "小朋友":"👶 小朋友",
        "夫妻-老公":"👨 丈夫",
        "夫妻-老婆":"👩 妻子",
        "夫妻-共同":"❤️ 夫妻共同",
        "生活":"🍚 生活",
        "交通":"🚗 交通",
        "娛樂":"🎮 娛樂",
        "購物":"🛍️ 購物",
        "儲蓄":"🏦 儲蓄",
        "投資":"📈 投資",
        "其他":"📦 其他"

    };

    const t=getTotals();

    let html="";

    Object.keys(categories).forEach(key=>{

        const amount =
            categoryTotal(key);

        if(amount<=0)return;

        const percent =
            t.expense>0
            ? amount/t.expense*100
            : 0;

        html += `

        <div class="category-row">

            <div class="category-head">

                <span>${categories[key]}</span>

                <strong>
                    ${money(amount)}
                    (${percent.toFixed(1)}%)
                </strong>

            </div>

            <div class="bar">

                <div
                    class="bar-inner"
                    style="width:${Math.min(percent,100)}%"
                ></div>

            </div>

        </div>

        `;

    });

    document.getElementById("categoryAnalysis").innerHTML =
        html || '<div class="empty">本月還沒有支出資料</div>';

}

function renderRanking(){

    const d=monthData();

    const map={};

    d.expenses.forEach(x=>{

        if(!map[x.category]){
            map[x.category]=0;
        }

        map[x.category]+=Number(x.amount);

    });

    const arr =
        Object.entries(map)
        .sort((a,b)=>b[1]-a[1]);

    if(!arr.length){

        document.getElementById("ranking").innerHTML =
            '<div class="empty">目前沒有支出</div>';

        return;

    }

    const icons={
        "房租":"🏠",
        "水電":"💡",
        "信貸":"💳",
        "小朋友":"👶",
        "夫妻-老公":"👨",
        "夫妻-老婆":"👩",
        "夫妻-共同":"❤️",
        "生活":"🍚",
        "交通":"🚗",
        "娛樂":"🎮",
        "購物":"🛍️",
        "儲蓄":"🏦",
        "投資":"📈",
        "其他":"📦"
    };

    let html="<table>";

    arr.forEach((x,i)=>{

        html += `

        <tr>

            <td>${i+1}. ${icons[x[0]]||"📦"} ${x[0]}</td>

            <td>${money(x[1])}</td>

        </tr>

        `;

    });

    html+="</table>";

    document.getElementById("ranking").innerHTML=html;

}

function renderBudget(){

    const d=monthData();

    const budgetMap={

        "房租":d.budget.rent,

        "水電":d.budget.utility,

        "信貸":d.budget.loan,

        "小朋友":d.budget.child,

        "夫妻":d.budget.couple,

        "生活":d.budget.life

    };

    let html="";

    Object.entries(budgetMap).forEach(([name,budget])=>{

        let actual=0;

        if(name==="夫妻"){

            actual =
                categoryTotal("夫妻-老公")+
                categoryTotal("夫妻-老婆")+
                categoryTotal("夫妻-共同");

        }else{

            actual=categoryTotal(name);

        }

        const diff=budget-actual;

        const percent=
            budget>0
            ? actual/budget*100
            : 0;

        let cls=
            diff<0
            ?"bad"
            :"good";

        html+=`

        <div class="${cls}" style="margin-bottom:8px">

            <strong>${name}</strong>

            <br>

            預算：${money(budget)}

            ｜實際：${money(actual)}

            ｜${diff>=0
                ?"剩餘 "+money(diff)
                :"超支 "+money(Math.abs(diff))
            }

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${Math.min(percent,100)}%"
                ></div>

            </div>

        </div>

        `;

    });

    document.getElementById("budgetAnalysis").innerHTML=html;

}

function renderEmergency(){

    const d=monthData();

    const current=
        Number(d.emergency.current)||0;

    const target=
        Number(d.emergency.target)||0;

    const percent=
        target>0
        ? Math.min(current/target*100,100)
        : 0;

    document.getElementById("emergencyCurrent").value=current;

    document.getElementById("emergencyTarget").value=target;

    document.getElementById("emergencyBar").style.width=
        percent+"%";

    document.getElementById("emergencyText").innerHTML=`

        <strong>${money(current)} / ${money(target)}</strong>

        <br>

        完成度：${percent.toFixed(1)}%

        <br>

        ${current>=target
        ?"🟢 已達成緊急預備金目標！"
        :"還差 "+money(Math.max(target-current,0))}

    `;

}

function renderLoan(){

    const d=monthData();

    const l=d.loan;

    document.getElementById("loanBalance").value=l.balance;

    document.getElementById("loanRate").value=l.rate;

    document.getElementById("loanPayment").value=l.payment;

    document.getElementById("loanMonths").value=l.months;

    let html="";

    if(l.balance>0){

        let months=l.months;

        if(!months && l.payment>0){

            months=
                Math.ceil(
                    l.balance/l.payment
                );

        }

        html=`

        <div class="warning">

            💳 剩餘本金：<strong>${money(l.balance)}</strong>

            <br>

            年利率：${l.rate}%

            <br>

            每月還款：${money(l.payment)}

            <br>

            預估剩餘期數：
            ${months || "請輸入期數"} 個月

        </div>

        `;

    }else{

        html=
            '<div class="good">🟢 目前沒有輸入信貸餘額。</div>';

    }

    document.getElementById("loanAnalysis").innerHTML=html;

}

function renderHealth(){

    const t=getTotals();

    const d=monthData();

    let score=100;

    const reasons=[];

    const fixed =
        categoryTotal("房租")+
        categoryTotal("水電")+
        categoryTotal("信貸");

    const fixedRate=
        t.income>0
        ? fixed/t.income*100
        : 0;

    if(fixedRate>60){

        score-=25;

        reasons.push("固定支出超過收入 60%");

    }else if(fixedRate>50){

        score-=15;

        reasons.push("固定支出偏高");

    }else if(fixedRate>40){

        score-=8;

        reasons.push("固定支出需要留意");

    }

    const savingRate=
        t.income>0
        ? t.saving/t.income*100
        : 0;

    if(savingRate>=20){

        score+=0;

    }else if(savingRate>=10){

        score-=5;

        reasons.push("儲蓄率可以再提高");

    }else{

        score-=15;

        reasons.push("儲蓄率偏低");

    }

    if(t.remaining<0){

        score-=30;

        reasons.push("本月已經超支");

    }

    if(t.investment>0){

        score+=5;

    }

    score=Math.max(0,Math.min(100,score));

    document.getElementById("healthScore").textContent=
        score;

    let text="";

    if(score>=85){

        text="🟢 財務狀況很好";

    }else if(score>=70){

        text="🟢 財務狀況穩定";

    }else if(score>=55){

        text="🟡 財務需要注意";

    }else{

        text="🔴 財務壓力偏高";

    }

    document.getElementById("healthText").textContent=text;

    let advice="";

    if(reasons.length){

        advice=
            '<div class="warning"><strong>💡 建議</strong><br>'+
            reasons.join("<br>")+
            "</div>";

    }else{

        advice=
            '<div class="good">🎉 目前沒有明顯財務警訊，繼續保持！</div>';

    }

    document.getElementById("healthAdvice").innerHTML=advice;

}

function renderRecords(){

    const d=monthData();

    const arr=
        [...d.expenses]
        .sort((a,b)=>b.date.localeCompare(a.date));

    if(!arr.length){

        document.getElementById("records").innerHTML=
            '<div class="empty">本月尚無記帳紀錄</div>';

        return;

    }

    let html="";

    arr.forEach(x=>{

        html+=`

        <div class="record">

            <div class="record-top">

                <div class="record-name">

                    ${x.category}

                </div>

                <div class="record-amount">

                    ${money(x.amount)}

                </div>

            </div>

            <div class="record-info">

                ${x.date}

                ${x.note
                    ? "｜"+escapeHtml(x.note)
                    : ""}

            </div>

            <div class="record-buttons">

                <button
                    class="secondary"
                    onclick="editExpense(${x.id})">

                    ✏️ 修改

                </button>

                <button
                    class="danger"
                    onclick="deleteExpense(${x.id})">

                    🗑️ 刪除

                </button>

            </div>

        </div>

        `;

    });

    document.getElementById("records").innerHTML=html;

}

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function renderYear(){

    const year=
        Number(document.getElementById("yearSelect").value);

    if(!year)return;

    let income=0;
    let expense=0;
    let saving=0;
    let investment=0;

    for(let m=1;m<=12;m++){

        const key=
            year+"-"+String(m).padStart(2,"0");

        const d=database[key];

        if(!d)continue;

        income+=
            Number(d.income.salary||0)+
            Number(d.income.other||0);

        expense+=
            d.expenses.reduce(
                (s,x)=>s+Number(x.amount),0
            );

        saving+=
            d.expenses
            .filter(x=>x.category==="儲蓄")
            .reduce((s,x)=>s+Number(x.amount),0);

        investment+=
            d.expenses
            .filter(x=>x.category==="投資")
            .reduce((s,x)=>s+Number(x.amount),0);

    }

    const remain=income-expense;

    const rate=
        income>0
        ? saving/income*100
        : 0;

    document.getElementById("yearAnalysis").innerHTML=`

        <div class="grid">

            <div class="stat">
                <div class="stat-title">全年收入</div>
                <div class="stat-value income">
                    ${money(income)}
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">全年支出</div>
                <div class="stat-value expense">
                    ${money(expense)}
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">全年剩餘</div>
                <div class="stat-value balance">
                    ${money(remain)}
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">全年儲蓄</div>
                <div class="stat-value">
                    ${money(saving)}
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">全年投資</div>
                <div class="stat-value invest">
                    ${money(investment)}
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">儲蓄率</div>
                <div class="stat-value">
                    ${rate.toFixed(1)}%
                </div>
            </div>

        </div>

    `;

}

function initYear(){

    const select=
        document.getElementById("yearSelect");

    const current=
        new Date().getFullYear();

    select.innerHTML="";

    for(let y=current-5;y<=current+2;y++){

        const option=
            document.createElement("option");

        option.value=y;
        option.textContent=y+" 年";

        if(y===current){

            option.selected=true;

        }

        select.appendChild(option);

    }

}

function exportData(){

    const json=
        JSON.stringify(database,null,2);

    const blob=
        new Blob(
            [json],
            {type:"application/json"}
        );

    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement("a");

    a.href=url;

    a.download=
        "家庭記帳資料.json";

    a.click();

    URL.revokeObjectURL(url);

}

function clearMonth(){

    if(!confirm(
        "確定要清除 "+currentMonth+" 的所有資料嗎？"
    ))return;

    delete database[currentMonth];

    saveDB();

    render();

}

function render(){

    monthData();

    saveDB();

    renderSummary();

    renderDaily();

    renderCategories();

    renderRanking();

    renderBudget();

    renderEmergency();

    renderLoan();

    renderHealth();

    renderRecords();

    renderYear();

}

/* 初始化 */

initYear();

render();

</script>

</body>
</html>

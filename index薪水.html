<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>家庭記帳｜財務管理 V2</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f8;
    color:#222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:12px;
}

h1{
    text-align:center;
    margin:10px 0 5px;
    font-size:28px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:15px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.card h2{
    margin:0 0 15px;
    font-size:21px;
}

.date-box{
    text-align:center;
    background:#f7f8fa;
    border-radius:16px;
    padding:15px;
}

.today-date{
    font-size:22px;
    font-weight:800;
}

.today-time{
    font-size:30px;
    font-weight:900;
    margin-top:5px;
}

.today-week{
    color:#777;
    margin-top:4px;
}

input,
select,
button{
    width:100%;
    min-height:46px;
    border-radius:12px;
    border:1px solid #ddd;
    padding:10px 12px;
    font-size:16px;
}

button{
    border:0;
    background:#222;
    color:white;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.green{
    background:#28834a;
}

.blue{
    background:#316bb1;
}

.gray{
    background:#777;
}

.red{
    background:#c62828;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.full{
    grid-column:1/-1;
}

.stat{
    background:#f7f8fa;
    border-radius:17px;
    padding:15px;
}

.stat-title{
    color:#777;
    font-size:14px;
}

.stat-value{
    font-size:25px;
    font-weight:900;
    margin-top:5px;
}

.income{
    color:#278246;
}

.expense{
    color:#c8322d;
}

.balance{
    color:#2868ae;
}

.invest{
    color:#7648a8;
}

.big-life{
    background:#edf7ef;
    border-radius:18px;
    padding:20px;
    text-align:center;
    margin-top:12px;
}

.big-life-title{
    color:#555;
    font-size:16px;
}

.big-life-money{
    font-size:36px;
    font-weight:900;
    color:#238047;
    margin:5px 0;
}

.daily{
    font-size:22px;
    font-weight:800;
}

.progress{
    height:13px;
    background:#e8e8e8;
    border-radius:20px;
    overflow:hidden;
    margin:8px 0;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#333;
    transition:.3s;
}

.analysis-row{
    margin-bottom:15px;
}

.analysis-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
}

.bar{
    height:12px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
}

.bar-inner{
    height:100%;
    width:0;
    background:#555;
}

.good{
    background:#eaf7ee;
    border-radius:14px;
    padding:13px;
    margin-top:10px;
}

.warning{
    background:#fff5d9;
    border-radius:14px;
    padding:13px;
    margin-top:10px;
}

.bad{
    background:#fdeaea;
    border-radius:14px;
    padding:13px;
    margin-top:10px;
}

.quote{
    background:#fffaf0;
    border-radius:15px;
    padding:14px;
    margin-bottom:9px;
    line-height:1.7;
    font-size:16px;
}

.record{
    border-bottom:1px solid #eee;
    padding:13px 0;
}

.record:last-child{
    border-bottom:0;
}

.record-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.record-category{
    font-weight:800;
}

.record-money{
    font-weight:900;
    color:#c62828;
}

.record-info{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.record-buttons{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.record-buttons button{
    min-height:38px;
    font-size:14px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:9px 5px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

td:last-child,
th:last-child{
    text-align:right;
}

.score{
    text-align:center;
    font-size:58px;
    font-weight:900;
}

.score-text{
    text-align:center;
    font-size:19px;
    font-weight:bold;
}

.small{
    color:#777;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#999;
    padding:20px 0;
}

.flex{
    display:flex;
    gap:8px;
}

.flex>*{
    flex:1;
}

@media(max-width:600px){

    .container{
        padding:9px;
    }

    h1{
        font-size:25px;
    }

    .grid{
        grid-template-columns:1fr 1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .stat-value{
        font-size:21px;
    }

    .big-life-money{
        font-size:31px;
    }

    .today-time{
        font-size:27px;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>💰 家庭記帳</h1>

<div class="subtitle">
    收入・支出・生活金・家庭財務分析
</div>


<!-- 日期時間 -->

<div class="card">

    <div class="date-box">

        <div id="todayDate" class="today-date">
            載入中……
        </div>

        <div id="todayTime" class="today-time">
            --:--:--
        </div>

        <div id="todayWeek" class="today-week">
            星期--
        </div>

    </div>

</div>


<!-- 月份 -->

<div class="card">

    <h2>📅 查看月份</h2>

    <div class="flex">

        <input
            type="month"
            id="monthPicker"
        >

        <button
            class="blue"
            onclick="viewMonth()"
        >
            🔎 查看
        </button>

    </div>

</div>


<!-- 收入 -->

<div class="card">

    <h2>💰 本月收入</h2>

    <div class="form-grid">

        <div>

            <label>薪水</label>

            <input
                type="number"
                id="salary"
                value="50000"
            >

        </div>

        <div>

            <label>其他收入</label>

            <input
                type="number"
                id="otherIncome"
                value="0"
            >

        </div>

        <div class="full">

            <button
                class="green"
                onclick="saveIncome()"
            >
                💾 儲存收入
            </button>

        </div>

    </div>

</div>


<!-- 新增支出 -->

<div class="card">

    <h2>➕ 新增支出</h2>

    <div class="form-grid">

        <div>

            <label>日期</label>

            <input
                type="date"
                id="expenseDate"
            >

        </div>

        <div>

            <label>支出分類</label>

            <select id="expenseCategory">

                <option value="房租">🏠 房租</option>

                <option value="水電">💡 水電</option>

                <option value="信貸">💳 信貸</option>

                <option value="小朋友">👶 小朋友</option>

                <option value="夫妻-老公">👨 丈夫</option>

                <option value="夫妻-老婆">👩 妻子</option>

                <option value="夫妻-共同">❤️ 夫妻共同</option>

                <option value="生活">🍚 生活</option>

                <option value="交通">🚗 交通</option>

                <option value="娛樂">🎮 娛樂</option>

                <option value="購物">🛍️ 購物</option>

                <option value="儲蓄">🏦 儲蓄</option>

                <option value="投資">📈 投資</option>

                <option value="其他">📦 其他</option>

            </select>

        </div>

        <div>

            <label>金額</label>

            <input
                type="number"
                id="expenseAmount"
                placeholder="例如 1500"
            >

        </div>

        <div>

            <label>備註</label>

            <input
                type="text"
                id="expenseNote"
                placeholder="例如 晚餐"
            >

        </div>

        <div class="full">

            <button
                onclick="addExpense()"
            >
                ➕ 儲存這筆支出
            </button>

        </div>

    </div>

</div>


<!-- 財務總覽 -->

<div class="card">

    <h2>📊 本月財務總覽</h2>

    <div class="grid">

        <div class="stat">

            <div class="stat-title">
                💰 總收入
            </div>

            <div
                id="totalIncome"
                class="stat-value income"
            >
                $0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                📉 總支出
            </div>

            <div
                id="totalExpense"
                class="stat-value expense"
            >
                $0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                💵 本月生活金
            </div>

            <div
                id="remaining"
                class="stat-value balance"
            >
                $0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                🏦 儲蓄
            </div>

            <div
                id="savingAmount"
                class="stat-value"
            >
                $0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                📈 投資
            </div>

            <div
                id="investmentAmount"
                class="stat-value invest"
            >
                $0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                💰 儲蓄率
            </div>

            <div
                id="savingRate"
                class="stat-value"
            >
                0%
            </div>

        </div>

    </div>


    <!-- 核心生活金 -->

    <div class="big-life">

        <div class="big-life-title">
            💵 收入 − 支出 = 本月生活金
        </div>

        <div
            id="lifeMoney"
            class="big-life-money"
        >
            $0
        </div>

        <div
            id="dailyMoney"
            class="daily"
        >
            每日可用：$0
        </div>

        <div
            id="daysText"
            class="small"
        >
            剩餘天數：0
        </div>

    </div>

</div>


<!-- 今日鼓勵 -->

<div class="card">

    <h2>🌱 今天給自己的三句話</h2>

    <div id="dailyQuotes"></div>

</div>


<!-- 分類分析 -->

<div class="card">

    <h2>📊 支出分類分析</h2>

    <div id="categoryAnalysis"></div>

</div>


<!-- 排行榜 -->

<div class="card">

    <h2>🏆 支出排行榜</h2>

    <div id="ranking"></div>

</div>


<!-- 預算 -->

<div class="card">

    <h2>🎯 預算分析</h2>

    <div class="form-grid">

        <div>

            <label>房租預算</label>

            <input
                type="number"
                id="budgetRent"
                value="15000"
            >

        </div>

        <div>

            <label>水電預算</label>

            <input
                type="number"
                id="budgetUtility"
                value="3000"
            >

        </div>

        <div>

            <label>信貸預算</label>

            <input
                type="number"
                id="budgetLoan"
                value="8000"
            >

        </div>

        <div>

            <label>小朋友預算</label>

            <input
                type="number"
                id="budgetChild"
                value="8000"
            >

        </div>

        <div>

            <label>夫妻預算</label>

            <input
                type="number"
                id="budgetCouple"
                value="6000"
            >

        </div>

        <div>

            <label>生活預算</label>

            <input
                type="number"
                id="budgetLife"
                value="8000"
            >

        </div>

        <div class="full">

            <button
                class="blue"
                onclick="saveBudget()"
            >
                💾 儲存預算
            </button>

        </div>

    </div>

    <div id="budgetAnalysis"></div>

</div>


<!-- 緊急預備金 -->

<div class="card">

    <h2>🛟 緊急預備金</h2>

    <div class="form-grid">

        <div>

            <label>目前金額</label>

            <input
                type="number"
                id="emergencyCurrent"
                value="0"
            >

        </div>

        <div>

            <label>目標金額</label>

            <input
                type="number"
                id="emergencyTarget"
                value="150000"
            >

        </div>

        <div class="full">

            <button
                class="green"
                onclick="saveEmergency()"
            >
                💾 儲存預備金
            </button>

        </div>

    </div>

    <div class="progress">

        <div
            id="emergencyBar"
            class="progress-bar"
        ></div>

    </div>

    <div id="emergencyText"></div>

</div>


<!-- 信貸 -->

<div class="card">

    <h2>💳 信貸分析</h2>

    <div class="form-grid">

        <div>

            <label>剩餘本金</label>

            <input
                type="number"
                id="loanBalance"
                value="0"
            >

        </div>

        <div>

            <label>年利率 %</label>

            <input
                type="number"
                step="0.01"
                id="loanRate"
                value="0"
            >

        </div>

        <div>

            <label>每月還款</label>

            <input
                type="number"
                id="loanPayment"
                value="0"
            >

        </div>

        <div>

            <label>剩餘期數</label>

            <input
                type="number"
                id="loanMonths"
                value="0"
            >

        </div>

        <div class="full">

            <button
                class="blue"
                onclick="saveLoan()"
            >
                💾 儲存信貸
            </button>

        </div>

    </div>

    <div id="loanAnalysis"></div>

</div>


<!-- 財務健康 -->

<div class="card">

    <h2>❤️ 家庭財務健康</h2>

    <div
        id="healthScore"
        class="score"
    >
        100
    </div>

    <div
        id="healthText"
        class="score-text"
    >
        分析中
    </div>

    <div id="healthAdvice"></div>

</div>


<!-- 記帳紀錄 -->

<div class="card">

    <h2>🧾 本月記帳紀錄</h2>

    <div id="records"></div>

</div>


<!-- 年度 -->

<div class="card">

    <h2>📅 年度分析</h2>

    <select
        id="yearSelect"
        onchange="renderYear()"
    ></select>

    <div
        id="yearAnalysis"
        style="margin-top:15px"
    ></div>

</div>


<!-- 資料管理 -->

<div class="card">

    <h2>💾 資料管理</h2>

    <div class="flex">

        <button
            class="gray"
            onclick="exportData()"
        >
            📤 匯出
        </button>

        <button
            class="red"
            onclick="clearMonth()"
        >
            🧹 清除
        </button>

    </div>

    <p class="small">
        資料會自動保存在目前瀏覽器。
    </p>

</div>

</div>


<script>

/* =========================
   基本設定
========================= */

const STORAGE_KEY =
    "family_budget_v2";

let database =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "{}"
    );

let currentMonth =
    getCurrentMonth();


/* =========================
   日期
========================= */

function getCurrentMonth(){

    const d = new Date();

    return d.getFullYear()
        + "-"
        + String(d.getMonth()+1).padStart(2,"0");

}


function getToday(){

    const d = new Date();

    return d.getFullYear()
        + "-"
        + String(d.getMonth()+1).padStart(2,"0")
        + "-"
        + String(d.getDate()).padStart(2,"0");

}


/* =========================
   自動日期時間
========================= */

function updateClock(){

    const d = new Date();

    const week = [
        "星期日",
        "星期一",
        "星期二",
        "星期三",
        "星期四",
        "星期五",
        "星期六"
    ];

    document.getElementById(
        "todayDate"
    ).textContent =
        d.getFullYear()
        + "年"
        + (d.getMonth()+1)
        + "月"
        + d.getDate()
        + "日";

    document.getElementById(
        "todayWeek"
    ).textContent =
        week[d.getDay()];

    document.getElementById(
        "todayTime"
    ).textContent =
        String(d.getHours()).padStart(2,"0")
        + ":"
        + String(d.getMinutes()).padStart(2,"0")
        + ":"
        + String(d.getSeconds()).padStart(2,"0");

}


setInterval(
    updateClock,
    1000
);

updateClock();


/* =========================
   月份資料
========================= */

function monthData(){

    if(!database[currentMonth]){

        database[currentMonth] = {

            income:{
                salary:50000,
                other:0
            },

            expenses:[],

            budget:{
                rent:15000,
                utility:3000,
                loan:8000,
                child:8000,
                couple:6000,
                life:8000
            },

            emergency:{
                current:0,
                target:150000
            },

            loan:{
                balance:0,
                rate:0,
                payment:0,
                months:0
            }

        };

    }

    return database[currentMonth];

}


function saveDB(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(database)
    );

}


/* =========================
   金額
========================= */

function money(value){

    return "$"
        + Math.round(Number(value)||0)
            .toLocaleString("zh-TW");

}


/* =========================
   收入
========================= */

function saveIncome(){

    const d = monthData();

    d.income.salary =
        Number(
            document.getElementById("salary").value
        ) || 0;

    d.income.other =
        Number(
            document.getElementById("otherIncome").value
        ) || 0;

    saveDB();

    render();

}


/* =========================
   支出
========================= */

function addExpense(){

    const amount =
        Number(
            document.getElementById("expenseAmount").value
        );

    if(!amount || amount <= 0){

        alert("請輸入支出金額");

        return;

    }

    const d = monthData();

    d.expenses.push({

        id:Date.now(),

        date:
            document.getElementById("expenseDate").value
            || getToday(),

        category:
            document.getElementById(
                "expenseCategory"
            ).value,

        amount:amount,

        note:
            document.getElementById(
                "expenseNote"
            ).value || ""

    });

    saveDB();

    document.getElementById(
        "expenseAmount"
    ).value = "";

    document.getElementById(
        "expenseNote"
    ).value = "";

    render();

}


/* =========================
   編輯
========================= */

function editExpense(id){

    const d = monthData();

    const item =
        d.expenses.find(
            x => x.id === id
        );

    if(!item)return;


    const amount =
        prompt(
            "修改金額",
            item.amount
        );

    if(amount === null)return;


    const note =
        prompt(
            "修改備註",
            item.note
        );

    item.amount =
        Number(amount) || item.amount;

    if(note !== null){

        item.note = note;

    }

    saveDB();

    render();

}


/* =========================
   刪除
========================= */

function deleteExpense(id){

    if(
        !confirm(
            "確定要刪除這筆支出嗎？"
        )
    ){

        return;

    }

    const d = monthData();

    d.expenses =
        d.expenses.filter(
            x => x.id !== id
        );

    saveDB();

    render();

}


/* =========================
   查看月份
========================= */

function viewMonth(){

    const value =
        document.getElementById(
            "monthPicker"
        ).value;

    if(!value)return;

    currentMonth = value;

    render();

}


/* =========================
   計算
========================= */

function categoryTotal(category){

    const d = monthData();

    return d.expenses
        .filter(
            x => x.category === category
        )
        .reduce(
            (sum,x) =>
                sum + Number(x.amount),
            0
        );

}


function getTotals(){

    const d = monthData();

    const income =
        Number(d.income.salary || 0)
        +
        Number(d.income.other || 0);

    const expense =
        d.expenses.reduce(
            (sum,x) =>
                sum + Number(x.amount),
            0
        );

    const saving =
        categoryTotal("儲蓄");

    const investment =
        categoryTotal("投資");

    return {

        income,

        expense,

        life:
            income - expense,

        saving,

        investment

    };

}


/* =========================
   總覽
========================= */

function renderSummary(){

    const d = monthData();

    const t = getTotals();

    document.getElementById(
        "salary"
    ).value =
        d.income.salary;

    document.getElementById(
        "otherIncome"
    ).value =
        d.income.other;


    document.getElementById(
        "totalIncome"
    ).textContent =
        money(t.income);


    document.getElementById(

function renderDailyMoney(){

    const t = getTotals();

    const now = new Date();

    const year =
        Number(
            currentMonth.slice(0,4)
        );

    const month =
        Number(
            currentMonth.slice(5,7)
        );


    const daysInMonth =
        new Date(
            year,
            month,
            0
        ).getDate();


    let daysLeft;


    const thisMonth =
        getCurrentMonth();


    if(currentMonth === thisMonth){

        daysLeft =
            daysInMonth
            -
            now.getDate()
            +
            1;

    }else{

        daysLeft =
            daysInMonth;

    }


    const daily =
        daysLeft > 0
        ? t.life / daysLeft
        : 0;


    document.getElementById(
        "dailyMoney"
    ).textContent =
        "每日可用："
        + money(Math.max(daily,0));


    document.getElementById(
        "daysText"
    ).textContent =
        "剩餘天數："
        + daysLeft;


}

            name==="夫妻"

/* =========================

function renderHealth(){

    const t=getTotals();


    let score=100;

    let advice=[];


    const fixed=
        categoryTotal("房租")
        +
        categoryTotal("水電")
        +
        categoryTotal("信貸");


    const fixedRate=
        t.income>0
        ?
        fixed/t.income*100
        :
        0;


    if(fixedRate>60){

        score-=30;

        advice.push(
            "固定支出超過收入 60%"
        );

    }else if(fixedRate>50){

        score-=20;

        advice.push(
            "固定支出偏高"
        );

    }else if(fixedRate>40){

        score-=10;

        advice.push(
            "固定支出需要留意"
        );

    }


    const savingRate=
        t.income>0
        ?
        t.saving/t.income*100
        :
        0;


    if(savingRate<10){

        score-=15;

        advice.push(
            "儲蓄率低於 10%"
        );

    }else if(savingRate<20){

        score-=5;

        advice.push(
            "可以逐步提高儲蓄率"
        );

    }


    if(t.life<0){

        score-=35;

        advice.push(
            "本月支出已超過收入"
        );

    }


    score=
        Math.max(
            0,
            Math.min(100,score)
        );


    document.getElementById(
        "healthScore"
    ).textContent=
        score;


    let text;


    if(score>=85){

        text="🟢 財務狀況很好";

    }else if(score>=70){

        text="🟢 財務狀況穩定";

    }else if(score>=55){

        text="🟡 財務需要注意";

    }else{

        text="🔴 財務壓力偏高";

    }


    document.getElementById(
        "healthText"
    ).textContent=text;


    document.getElementById(
        "healthAdvice"
    ).innerHTML=
        advice.length

        ?

        `
        <div class="warning">

            💡 建議：

            <br>

            ${advice.join("<br>")}

        </div>
        `

        :

        `
        <div class="good">

            🎉 目前沒有明顯財務警訊，
            繼續保持！

        </div>
        `;

}

function escapeHtml(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   年度分析
========================= */

function initYear(){

    const select=
        document.getElementById(
            "yearSelect"
        );


    const year=
        new Date().getFullYear();


    select.innerHTML="";


    for(
        let y=year-5;
        y<=year+2;
        y++
    ){

        const option=
            document.createElement(
                "option"
            );


        option.value=y;

        option.textContent=
            y+" 年";


        if(y===year){

            option.selected=true;

        }


        select.appendChild(option);

    }

}


function renderYear(){

    const year=
        Number(
            document.getElementById(
                "yearSelect"
            ).value
        );


    let income=0;

    let expense=0;

    let saving=0;

    let investment=0;


    for(
        let m=1;
        m<=12;
        m++
    ){

        const key=
            year
            +
            "-"
            +
            String(m).padStart(2,"0");


        const d=database[key];


        if(!d)continue;


        income+=
            Number(
                d.income.salary||0
            )
            +
            Number(
                d.income.other||0
            );


        expense+=
            d.expenses.reduce(
                (sum,x)=>
                    sum+Number(x.amount),
                0
            );


        saving+=
            d.expenses
                .filter(
                    x =>
                        x.category==="儲蓄"
                )
                .reduce(
                    (sum,x)=>
                        sum+Number(x.amount),
                    0
                );


        investment+=
            d.expenses
                .filter(
                    x =>
                        x.category==="投資"
                )
                .reduce(
                    (sum,x)=>
                        sum+Number(x.amount),
                    0
                );

    }


    const life=
        income-expense;


    const rate=
        income>0
        ?
        saving/income*100
        :
        0;


    document.getElementById(
        "yearAnalysis"
    ).innerHTML=`

        <div class="grid">

            <div class="stat">

                <div class="stat-title">
                    💰 全年收入
                </div>

                <div class="stat-value income">
                    ${money(income)}
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    📉 全年支出
                </div>

                <div class="stat-value expense">
                    ${money(expense)}
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    💵 全年生活金
                </div>

                <div class="stat-value balance">
                    ${money(life)}
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    🏦 全年儲蓄
                </div>

                <div class="stat-value">
                    ${money(saving)}
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    📈 全年投資
                </div>

                <div class="stat-value invest">
                    ${money(investment)}
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    💰 儲蓄率
                </div>

                <div class="stat-value">
                    ${rate.toFixed(1)}%
                </div>

            </div>

        </div>

    `;

}

function exportData(){

    const data=
        JSON.stringify(
            database,
            null,
            2
        );


    const blob=
        new Blob(
            [data],
            {
                type:
                    "application/json"
            }
        );


    const url=
        URL.createObjectURL(blob);


    const a=
        document.createElement("a");


    a.href=url;


    a.download=
        "家庭記帳資料.json";


    a.click();


    URL.revokeObjectURL(url);

}

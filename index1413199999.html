<!DOCTYPE html>

<style>
*{box-sizing:border-box}

html,body{

body{

}
button,input{

}
button{

}
.wrap{

.status{

.hero{

.titleRow{

.tag.green{color:var(--green);border-color:#2d9e4b}

}
.rankCode{

}

.table{

}

</style>

<body>

<div class="footer">
 資料分析用途｜技術指標與成本為模型估算，不代表法人實際持倉成本或保證價格。<br>
 法人資料可能於交易日後補計，請以資料來源最新回傳值為準。
</div>

<script>
/* =========================================================
   台股 AI 綜合分析完整版
   ========================================================= */

const API = "https://api.finmindtrade.com/api/v4/data";

const state = {
  info: [],
  infoLoaded: false,
  current: null,
  currentRows: [],
  lastTradingDate: null
};

/* ---------------------------------------------------------
   常見股票／ETF／英文別名
--------------------------------------------------------- */

const aliases = {
 "2330":["台積電","台灣積體電路製造","TSMC","TAIWAN SEMICONDUCTOR"],
 "2317":["鴻海","鴻海精密","HON HAI","FOXCONN"],
 "2454":["聯發科","聯發科技","MEDIATEK","MTK"],
 "2308":["台達電","台達電子","DELTA"],
 "2303":["聯電","聯華電子","UMC"],
 "1326":["台化","台灣化學纖維","FORMOSA CHEMICAL"],
 "2002":["中鋼","CHINA STEEL"],
 "2313":["華通","COMPEQ"],
 "3711":["日月光投控","日月光","ASE","ASE TECHNOLOGY"],
 "0050":["元大台灣50","YUANTA TAIWAN 50"],
 "00631L":["元大台灣50正2","台灣50正2","T50正2"],
 "00632R":["元大台灣50反1","台灣50反1"],
 "00685L":["群益臺灣加權正2","台灣加權正2"],
 "00670L":["富邦NASDAQ正2"],
 "00675L":["富邦臺灣加權正2"],
 "00673R":["元大S&P原油反1"],
 "2881":["富邦金","富邦金融控股","FUBON FINANCIAL"],
 "2882":["國泰金","國泰金融控股"],
 "2886":["兆豐金","兆豐金融控股"],
 "2891":["中信金","中國信託金融"],
 "2892":["第一金","第一金融控股"],
 "2603":["長榮","EVERGREEN"],
 "2609":["陽明","YANG MING"],
 "2615":["萬海","WAN HAI"],
 "3034":["聯詠","NOVATEK"],
 "3008":["大立光","LARGAN"],
 "2382":["廣達","QUANTA"],
 "2357":["華碩","ASUS"],
 "6669":["緯穎","Wiwynn"],
 "3231":["緯創","WISTRON"],
 "2376":["技嘉","GIGABYTE"],
 "3017":["奇鋐","AVC"],
 "2368":["金像電","GCE"],
 "3661":["世芯-KY","世芯","ALCHIP"],
 "5274":["信驊","ASPEED"],
 "3443":["創意","GUC"],
 "3533":["嘉澤","LOTES"],
 "6415":["矽力-KY","Silergy"],
 "3037":["欣興","Unimicron"],
 "8046":["南電","南亞電路板"],
 "2312":["金寶","KINPO"],
 "2353":["宏碁","ACER"],
 "2377":["微星","MSI"],
 "2379":["瑞昱","REALTEK"],
 "2408":["南亞科","NANYA TECHNOLOGY"],
 "2344":["華邦電","WINBOND"],
 "3481":["群創","INNOLUX"],
 "6116":["彩晶","HIMAX?"],
 "5314":["世紀","世紀民生"],
 "2367":["燿華","UNIMICRON?"]
};

/* ---------------------------------------------------------
   工具
--------------------------------------------------------- */

function esc(v){
 return String(v ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function num(v){
 const n = Number(v);
 return Number.isFinite(n) ? n : 0;
}

function fmt(v,d=2){
 const n = Number(v);
 if(!Number.isFinite(n)) return "—";
 return n.toLocaleString("zh-TW",{
   minimumFractionDigits:d,
   maximumFractionDigits:d
 });
}

function fmtInt(v){
 return Math.round(num(v)).toLocaleString("zh-TW");
}

function pct(v,d=2){
 return `${fmt(v,d)}%`;
}

function setStatus(text,show=true){
 const el = document.getElementById("status");
 el.style.display = show ? "block" : "none";
 el.textContent = text || "";
}

function today(){
 const d = new Date();
 return d.toISOString().slice(0,10);
}

function daysAgo(n){
 const d = new Date();
 d.setDate(d.getDate()-n);
 return d.toISOString().slice(0,10);
}

function unique(a){
 return [...new Set(a)];
}

async function fetchJSON(url,params={}){
 const qs = new URLSearchParams(params);
 const res = await fetch(url+"?"+qs.toString(),{
   cache:"no-store"
 });
 if(!res.ok){
   throw new Error("API HTTP "+res.status);
 }
 const json = await res.json();
 if(json.status && Number(json.status)!==200){
   throw new Error(json.msg || "資料 API 回傳錯誤");
 }
 return json;
}

/* ---------------------------------------------------------
   股票清單
--------------------------------------------------------- */

async function loadStockInfo(){
 if(state.infoLoaded) return state.info;

 try{
   const json = await fetchJSON(API,{
     dataset:"TaiwanStockInfo"
   });

   state.info = Array.isArray(json.data) ? json.data : [];
   state.infoLoaded = true;
   return state.info;

 }catch(e){
   console.warn("TaiwanStockInfo:",e);

   /*
      API 若暫時不可用，仍保留常見股票／ETF搜尋
   */
   state.info = Object.keys(aliases).map(code=>({
     stock_id:code,
     stock_name:aliases[code][0],
     type:code.length>4 ? "ETF":"股票"
   }));

   state.infoLoaded = true;
   return state.info;
 }
}

/* ---------------------------------------------------------
   搜尋
--------------------------------------------------------- */

function searchLocal(q){
 const key = q.trim().toLowerCase();

 const arr = state.info.map(x=>{
   const code = String(x.stock_id || "");
   const name = String(x.stock_name || "");

   const al = aliases[code] || [];

   const hay = [
     code,
     name,
     ...al
   ].join(" ").toLowerCase();

   let score = 0;

   if(code.toLowerCase()===key) score += 1000;
   if(name.toLowerCase()===key) score += 900;
   if(al.some(x=>x.toLowerCase()===key)) score += 800;

   if(code.toLowerCase().includes(key)) score += 500;
   if(name.toLowerCase().includes(key)) score += 400;
   if(al.some(x=>x.toLowerCase().includes(key))) score += 300;

   return {...x,score,hay};
 }).filter(x=>x.score>0);

 return arr.sort((a,b)=>b.score-a.score).slice(0,20);
}

async function findStock(q){
 const key = q.trim();

 if(!key) return null;

 await loadStockInfo();

 const found = searchLocal(key);

 if(found.length){
   return found[0];
 }

 /*
   代號直接查詢。
   例如：
   2330
   0050
   00631L
   2881
 */
 const direct = state.info.find(x=>
   String(x.stock_id).toUpperCase()===key.toUpperCase()
 );

 if(direct) return direct;

 /*
   常見別名直接轉代號
 */
 for(const [code,list] of Object.entries(aliases)){
   if(list.some(x=>x.toLowerCase()===key.toLowerCase())){
     const obj = state.info.find(x=>String(x.stock_id)===code);
     return obj || {
       stock_id:code,
       stock_name:list[0]
     };
   }
 }

 return null;
}

/* ---------------------------------------------------------
   股票價格
--------------------------------------------------------- */

async function getPrice(code){
 const json = await fetchJSON(API,{
   dataset:"TaiwanStockPrice",
   data_id:code,
   start_date:daysAgo(450),
   end_date:today()
 });

 const rows = Array.isArray(json.data) ? json.data : [];

 rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));

 return rows;
}

/* ---------------------------------------------------------
   法人資料
--------------------------------------------------------- */

async function getInstitution(code){
 try{
   const json = await fetchJSON(API,{
     dataset:"TaiwanStockInstitutionalInvestorsBuySellWide",
     data_id:code,
     start_date:daysAgo(45),
     end_date:today()
   });

   return Array.isArray(json.data) ? json.data : [];

 }catch(e){
   console.warn("institution:",code,e);
   return [];
 }
}

function institutionLatest(rows){
 if(!rows.length) return null;

 const sorted=[...rows].sort((a,b)=>
   String(b.date).localeCompare(String(a.date))
 );

 return sorted[0];
}

function foreignNet(r){
 return num(r.Foreign_Investor_buy)
      -num(r.Foreign_Investor_sell);
}

function trustNet(r){
 return num(r.Investment_Trust_buy)
      -num(r.Investment_Trust_sell);
}

function dealerNet(r){
 /*
   新制：
   Dealer_self + Dealer_Hedging
   舊制：
   Dealer
 */
 const newDealer =
   num(r.Dealer_self_buy)-num(r.Dealer_self_sell)
   +num(r.Dealer_Hedging_buy)-num(r.Dealer_Hedging_sell);

 const oldDealer =
   num(r.Dealer_buy)-num(r.Dealer_sell);

 return Math.abs(newDealer)>0 ? newDealer : oldDealer;
}

function totalNet(r){
 return foreignNet(r)+trustNet(r)+dealerNet(r);
}

/*
  API法人張數通常以股數呈現，
  台股 1 張 = 1000 股。
*/
function sharesToLots(v){
 return Math.round(num(v)/1000);
}

/* ---------------------------------------------------------
   技術指標
--------------------------------------------------------- */

function closes(rows){
 return rows.map(x=>num(x.close)).filter(x=>x>0);
}

function volumes(rows){
 return rows.map(x=>num(x.Trading_Volume));
}

function sma(values,n){
 if(values.length<n) return null;
 const arr=values.slice(-n);
 return arr.reduce((a,b)=>a+b,0)/n;
}

function smaAt(values,n,offset=0){
 const end=values.length-offset;
 if(end<n) return null;
 const arr=values.slice(end-n,end);
 return arr.reduce((a,b)=>a+b,0)/n;
}

function slope(values,n){
 if(values.length<n+5) return null;

 const a=smaAt(values,n,5);
 const b=smaAt(values,n,0);

 if(a===null||b===null) return null;

 return ((b-a)/a)*100;
}

function deviation(price,ma){
 if(!ma) return null;
 return ((price-ma)/ma)*100;
}

function trendScore(rows){
 const c=closes(rows);
 if(c.length<30) return 0;

 const p=c.at(-1);
 const m5=sma(c,5);
 const m14=sma(c,14);
 const m27=sma(c,27);
 const m62=sma(c,62);
 const m131=sma(c,131);
 const m272=sma(c,272);

 let s=0;

 if(m5 && p>m5) s+=10;
 if(m14 && p>m14) s+=10;
 if(m27 && p>m27) s+=10;
 if(m62 && p>m62) s+=15;
 if(m131 && p>m131) s+=15;
 if(m272 && p>m272) s+=15;

 const sl62=slope(c,62);
 const sl131=slope(c,131);
 const sl272=slope(c,272);

 if(sl62!==null && sl62>0) s+=8;
 if(sl131!==null && sl131>0) s+=8;
 if(sl272!==null && sl272>0) s+=9;

 return Math.min(100,Math.max(0,s));
}

function analyze(rows){
 const c=closes(rows);
 const v=volumes(rows);

 if(!c.length){
   return null;
 }

 const price=c.at(-1);

 const ma5=sma(c,5);
 const ma14=sma(c,14);
 const ma27=sma(c,27);
 const ma62=sma(c,62);
 const ma131=sma(c,131);
 const ma272=sma(c,272);

 const sl5=slope(c,5);
 const sl14=slope(c,14);
 const sl27=slope(c,27);
 const sl62=slope(c,62);
 const sl131=slope(c,131);
 const sl272=slope(c,272);

 const dev5=deviation(price,ma5);
 const dev14=deviation(price,ma14);
 const dev27=deviation(price,ma27);
 const dev62=deviation(price,ma62);
 const dev131=deviation(price,ma131);
 const dev272=deviation(price,ma272);

 const vol20=sma(v,20);
 const vol5=sma(v,5);
 const volumeRatio =
   vol20 ? vol5/vol20 : null;

 const high20=Math.max(...c.slice(-20));
 const low20=Math.min(...c.slice(-20));

 const breakout =
   price>=high20 &&
   volumeRatio!==null &&
   volumeRatio>=1.15 &&
   (sl27===null || sl27>0);

 let score=0;

 if(price>ma5) score+=8;
 if(price>ma14) score+=8;
 if(price>ma27) score+=10;
 if(price>ma62) score+=15;
 if(price>ma131) score+=15;
 if(price>ma272) score+=15;

 if(sl14!==null && sl14>0) score+=5;
 if(sl27!==null && sl27>0) score+=5;
 if(sl62!==null && sl62>0) score+=5;
 if(sl131!==null && sl131>0) score+=5;
 if(sl272!==null && sl272>0) score+=4;

 if(breakout) score+=10;

 score=Math.min(100,score);

 let trend="偏空";

 if(score>=75) trend="強勢多頭";
 else if(score>=60) trend="偏多";
 else if(score>=45) trend="中性";
 else if(score>=30) trend="偏空";
 else trend="弱勢";

 return {
   price,
   ma5,ma14,ma27,ma62,ma131,ma272,
   sl5,sl14,sl27,sl62,sl131,sl272,
   dev5,dev14,dev27,dev62,dev131,dev272,
   vol20,vol5,volumeRatio,
   high20,low20,
   breakout,
   score,
   trend
 };
}

function buildSummary(a){
 if(!a) return "資料不足，無法完整分析。";

 let arr=[];

 if(a.score>=75)
   arr.push("目前屬於多頭結構，價格與多條中長期均線保持相對強勢。");
 else if(a.score>=60)
   arr.push("目前偏多，但仍需要成交量與突破確認。");
 else if(a.score>=45)
   arr.push("目前屬於中性整理，建議等待均線與價格結構更加明確。");
 else
   arr.push("目前偏弱，操作上應優先控制風險。");

 if(a.breakout)
   arr.push("近期高點突破且量能配合，突破條件較佳。");
 else
   arr.push("目前尚未形成明確突破，不建議單純追價。");

 if(a.dev62!==null){
   if(a.dev62>10)
     arr.push("價格相對62日均線乖離偏高，追價風險增加。");
   else if(a.dev62<-8)
     arr.push("價格低於62日均線較多，可觀察是否出現止跌轉強。");
 }

 return arr.join(" ");
}

function calcTargets(a){
 if(!a){
  return {t1:0,t2:0,t3:0,resistance:0};
 }

 const p=a.price;
 const range=Math.max(
   0.01,
   (a.high20-a.low20)
 );

 const vol=Math.max(
   range,
   p*0.04
 );

 let t1=p+vol*0.45;
 let t2=p+vol*0.9;
 let t3=p+vol*1.35;

 /*
   多頭時加入均線參考；
   不直接使用固定 70/75/80/86。
 */
 if(a.ma62 && a.ma62>p){
   t1=Math.max(t1,a.ma62);
 }

 if(a.ma131 && a.ma131>p){
   t2=Math.max(t2,a.ma131);
 }

 if(a.ma272 && a.ma272>p){
   t3=Math.max(t3,a.ma272);
 }

 const resistance=Math.max(
   a.high20,
   a.ma62||0,
   a.ma131||0
 );

 return {
  t1,
  t2,
  t3,
  resistance
 };
}

function riskPlan(a){
 if(!a){
  return {
   risk:1,
   position:0,
   stop:0,
   text:"資料不足。"
  };
 }

 const p=a.price;

 let stop;

 if(a.ma27 && a.ma27<p)
   stop=a.ma27*0.985;
 else if(a.ma62 && a.ma62<p)
   stop=a.ma62*0.985;
 else
   stop=p*0.94;

 let position=20;

 if(a.score>=75) position=50;
 else if(a.score>=65) position=40;
 else if(a.score>=55) position=30;
 else if(a.score>=45) position=20;
 else position=10;

 return {
  risk:2,
  position,
  stop,
  text:
   "資金管理採用分批進場，不建議單一股票一次投入全部資金。"+
   "若跌破重要均線或原本的趨勢條件失效，應重新評估。"
 };
}

/*
  注意：
  真正的「全市場排行榜」需要市場端一次提供全市場資料。
  免費 API 對個股資料採 data_id 查詢，因此這裡先使用
  常用股票＋ETF清單做排行榜分析，避免一次發出數百／數千
  個 API 請求導致網站卡住。
*/

const rankingUniverse=[
 "2330","2317","2454","2308","2303","1326","2002",
 "2881","2882","2886","2891","2892",
 "2603","2609","2615",
 "2382","2357","6669","3231","2376","3017",
 "2368","3661","5274","3443","3533",
 "3034","3008","3711","3037","8046",
 "2344","2408","3481","2313",
 "0050","00631L","00632R","00685L","00670L",
 "00675L"
];

async function getRankingData(){
 setStatus("正在建立排行榜，請稍候……");

 const info=await loadStockInfo();

 const list=unique(rankingUniverse).map(code=>{
   const found=info.find(x=>String(x.stock_id)===code);
   return found || {
     stock_id:code,
     stock_name:(aliases[code]?.[0]||code)
   };
 });

 const results=[];

 /*
   控制並行數，避免 API 瞬間大量請求。
 */
 let index=0;

 async function worker(){
   while(index<list.length){
     const i=index++;
     const stock=list[i];

     try{
       const rows=await getPrice(stock.stock_id);
       if(!rows.length) continue;

       const a=analyze(rows);

       const instRows=await getInstitution(stock.stock_id);
       const inst=instRows.length ? institutionLatest(instRows):null;

       results.push({
        stock,
        rows,
        a,
        inst,
        foreign:inst?foreignNet(inst):0,
        trust:inst?trustNet(inst):0,
        dealer:inst?dealerNet(inst):0,
        total:inst?totalNet(inst):0
       });

     }catch(e){
       console.warn("ranking",stock.stock_id,e);
     }
   }
 }

 await Promise.all([
  worker(),worker(),worker(),worker()
 ]);

 return results;
}

function longScore(a){
 let s=a.score;

 if(a.ma62 && a.price>a.ma62) s+=10;
 if(a.ma131 && a.price>a.ma131) s+=10;
 if(a.ma272 && a.price>a.ma272) s+=10;

 if(a.sl62>0) s+=8;
 if(a.sl131>0) s+=8;
 if(a.sl272>0) s+=8;

 return s;
}

function breakoutScore(a){
 let s=a.score;

 if(a.breakout) s+=35;

 if(a.volumeRatio>=1.2) s+=15;
 else if(a.volumeRatio>=1.05) s+=7;

 if(a.price>=a.high20) s+=20;

 return s;
}

function hotScore(x){
 let s=x.a?.score||0;

 if(x.a?.volumeRatio>=1.2) s+=15;
 if(x.a?.breakout) s+=20;

 if(x.foreign>0) s+=5;
 if(x.trust>0) s+=5;
 if(x.dealer>0) s+=5;
 if(x.total>0) s+=5;

 return s;
}

function renderRanking(title,icon,arr,type){
 const area=document.getElementById("rankingArea");

 if(!arr.length){
  area.innerHTML=`
   <div class="card">
    <div class="error">目前沒有足夠資料產生排行榜。</div>
   </div>`;
  return;
 }

 const dateList=arr
   .map(x=>x.inst?.date||x.rows?.at(-1)?.date)
   .filter(Boolean);

 const latestDate=dateList.sort().at(-1)||"—";

 area.innerHTML=`
 <div class="card rankPanel show">

  <div class="rankHeader">
   <h2>${icon} ${esc(title)}</h2>
   <div class="rankDate">資料基準：${esc(latestDate)}</div>
  </div>

  ${arr.map((x,i)=>rankingItem(x,i,type)).join("")}

 </div>`;

 /*
   排行榜每一列也可以點，
   點下去直接查詢該股票。
 */
 area.querySelectorAll("[data-code]").forEach(el=>{
   el.addEventListener("click",()=>{
     const code=el.dataset.code;
     document.getElementById("searchInput").value=code;
     searchStock();
     window.scrollTo({top:0,behavior:"smooth"});
   });
 });
}

function rankingItem(x,i,type){
 const a=x.a;

 let value="";
 let sub="";

 if(type==="foreign"){
   const v=sharesToLots(x.foreign);
   value=(v>=0?"+":"")+fmtInt(v)+" 張";
   sub="外資買賣超";
 }else if(type==="trust"){
   const v=sharesToLots(x.trust);
   value=(v>=0?"+":"")+fmtInt(v)+" 張";
   sub="投信買賣超";
 }else if(type==="dealer"){
   const v=sharesToLots(x.dealer);
   value=(v>=0?"+":"")+fmtInt(v)+" 張";
   sub="自營商買賣超";
 }else if(type==="all"){
   const v=sharesToLots(x.total);
   value=(v>=0?"+":"")+fmtInt(v)+" 張";
   sub="三大法人合計";
 }else{
   value=`${Math.round(a?.score||0)} 分`;
   sub=
    `現價 ${fmt(a?.price)}｜趨勢 ${a?.trend||"—"}`;
 }

 const positive =
   type==="foreign" ? x.foreign>=0 :
   type==="trust" ? x.trust>=0 :
   type==="dealer" ? x.dealer>=0 :
   type==="all" ? x.total>=0 :
   true;

 return `
 <button
   type="button"
   class="rankItem"
   data-code="${esc(x.stock.stock_id)}"
   style="width:100%;text-align:left;color:inherit">

   <div class="rankNo">${i+1}</div>

   <div class="rankMain">
    <div class="rankName">
      ${esc(x.stock.stock_name||x.stock.stock_id)}
      <span class="rankCode">${esc(x.stock.stock_id)}</span>
    </div>

    <div class="rankSub">
      ${esc(sub)}
    </div>
   </div>

   <div class="rankValue ${positive?"positive":"negative"}">
      ${esc(value)}
   </div>

 </button>`;
}

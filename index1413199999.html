<script>

"use strict";

/* ============================================================
   API
============================================================ */

const FINMIND_API=
"https://api.finmindtrade.com/api/v4/data";

const MIS_API=
"https://mis.twse.com.tw/stock/api/getStockInfo.jsp";

let stockInfoCache=null;


/* ============================================================
   工具
============================================================ */

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function num(v){
 const x=Number(v);
 return Number.isFinite(x)?x:null;
}

function money(v,d=2){
 const x=num(v);

 if(x===null)return "—";

 return x.toLocaleString(
  "zh-TW",
  {
   minimumFractionDigits:d,
   maximumFractionDigits:d
  }
 );
}

function integer(v){
 const x=num(v);

 if(x===null)return "—";

 return Math.round(x)
 .toLocaleString("zh-TW");
}


/* 台灣日期，避免 UTC 導致日期差一天 */

function twDate(){

 const parts=
  new Intl.DateTimeFormat(
   "en-CA",
   {
    timeZone:"Asia/Taipei",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
   }
  ).formatToParts(
   new Date()
  );

 const obj={};

 parts.forEach(
  p=>{
   if(p.type!=="literal"){
    obj[p.type]=p.value;
   }
  }
 );

 return `${obj.year}-${obj.month}-${obj.day}`;
}


function ago(days){

 const d=
  new Date(
   new Date().toLocaleString(
    "en-US",
    {
     timeZone:"Asia/Taipei"
    }
   )
  );

 d.setDate(
  d.getDate()-days
 );

 const y=
  d.getFullYear();

 const m=
  String(
   d.getMonth()+1
  ).padStart(2,"0");

 const day=
  String(
   d.getDate()
  ).padStart(2,"0");

 return `${y}-${m}-${day}`;
}


function clean(v){

 return String(v||"")
 .toLowerCase()
 .replace(/\s+/g,"")
 .replace(/-/g,"")
 .replace(/_/g,"");
}


function setStatus(
 text,
 type=""
){

 $("status").innerHTML=
  text;

 $("status").className=
  "status show "+type;
}


/* ============================================================
   API GET
============================================================ */

async function apiGet(
 params,
 timeout=20000
){

 const url=
  new URL(
   FINMIND_API
  );

 Object.entries(params)
 .forEach(
  ([key,value])=>{

   if(
    value!==undefined &&
    value!==null &&
    value!==""
   ){

    url.searchParams.set(
     key,
     value
    );

   }

  }
 );

 const controller=
  new AbortController();

 const timer=
  setTimeout(
   ()=>controller.abort(),
   timeout
  );

 try{

  const response=
   await fetch(
    url.toString(),
    {
     method:"GET",
     cache:"no-store",
     signal:controller.signal
    }
   );

  if(!response.ok){

   throw new Error(
    "FinMind HTTP "+
    response.status
   );

  }

  const json=
   await response.json();

  if(
   json.status!==undefined &&
   json.status!==200 &&
   json.status!==0
  ){

   throw new Error(
    json.msg||
    "FinMind API 錯誤"
   );

  }

  return Array.isArray(json.data)
   ?json.data
   :[];

 }finally{

  clearTimeout(timer);

 }

}


/* ============================================================
   股票清單
============================================================ */

async function getStockInfo(){

 if(stockInfoCache){
  return stockInfoCache;
 }

 const rows=
  await apiGet(
   {
    dataset:
    "TaiwanStockInfo"
   },
   25000
  );

 /*
  同一股票可能有不同歷史市場別。
  取最新日期。
 */

 const map={};

 rows.forEach(
  x=>{

   if(!x.stock_id){
    return;
   }

   const id=
    String(x.stock_id);

   if(
    !map[id]||
    String(x.date||"")>
    String(map[id].date||"")
   ){

    map[id]=x;

   }

  }
 );

 stockInfoCache=
  Object.values(map);

 return stockInfoCache;

}


/* ============================================================
   常用別名
============================================================ */

const aliases={

 "2330":[
  "台積電",
  "台灣積體電路",
  "tsmc",
  "taiwan semiconductor"
 ],

 "2317":[
  "鴻海",
  "foxconn",
  "hon hai"
 ],

 "1326":[
  "台化",
  "台灣化學纖維",
  "formosa chemicals"
 ],

 "2891":[
  "中信金",
  "中國信託",
  "中國信託金控",
  "ctbc",
  "ctbc holding"
 ],

 "5314":[
  "世紀",
  "century"
 ],

 "0050":[
  "元大台灣50",
  "yuanta taiwan 50"
 ],

 "00631L":[
  "元大台灣50正2",
  "台灣50正2",
  "taiwan 50 2x"
 ]

};


async function findStock(
 query
){

 const q=
  clean(query);

 if(!q){

  throw new Error(
   "請輸入股票代號或名稱"
  );

 }

 const info=
  await getStockInfo();

 let found=
  info.find(
   x=>
    clean(x.stock_id)===q
  );

 if(found)return found;

 found=
  info.find(
   x=>
    clean(x.stock_name)===q
  );

 if(found)return found;

 for(
  const [code,list]
  of Object.entries(aliases)
 ){

  if(
   list.some(
    x=>clean(x)===q
   )
  ){

   found=
    info.find(
     x=>
      String(x.stock_id)===code
    );

   if(found)return found;

  }

 }

 const candidates=
  info.filter(
   x=>{

    const id=
     clean(x.stock_id);

    const name=
     clean(x.stock_name);

    if(
     id.includes(q)||
     name.includes(q)
    ){
     return true;
    }

    const a=
     aliases[x.stock_id]||[];

    return a.some(
     z=>clean(z).includes(q)
    );

   }
  );

 if(!candidates.length){

  throw new Error(
   "找不到「"+
   query+
   "」"
  );

 }

 return candidates[0];

}


/* ============================================================
   FinMind 歷史價格
============================================================ */

async function getPrices(
 id
){

 return apiGet(
  {
   dataset:
   "TaiwanStockPrice",

   data_id:id,

   start_date:
   ago(420),

   end_date:
   twDate()
  },
  22000
 );

}


function sorted(rows){

 return [...rows]
 .sort(
  (a,b)=>
   String(a.date)
   .localeCompare(
    String(b.date)
   )
 );

}


function latest(rows){

 const a=
  sorted(rows);

 return a.length
  ?a[a.length-1]
  :null;

}


function closes(rows){

 return sorted(rows)
 .map(
  r=>num(r.close)
 )
 .filter(
  x=>x!==null
 );

}


/* ============================================================
   即時行情
   TWSE MIS：上市／上櫃皆嘗試
============================================================ */

async function getRealtime(
 stock
){

 const id=
  String(stock.stock_id);

 const type=
  String(stock.type||"twse")
  .toLowerCase();

 const market=
  type==="tpex"
   ?"otc"
   :"tse";

 const ex=
  `${market}_${id}.tw`;

 const url=
  MIS_API+
  "?ex_ch="+
  encodeURIComponent(ex)+
  "&json=1&delay=0&_="+
  Date.now();

 try{

  const controller=
   new AbortController();

  const timer=
   setTimeout(
    ()=>controller.abort(),
    8000
   );

  const response=
   await fetch(
    url,
    {
     cache:"no-store",
     signal:controller.signal
    }
  );

  clearTimeout(timer);

  if(!response.ok){
   throw new Error(
    "MIS HTTP "+
    response.status
   );
  }

  const json=
   await response.json();

  const arr=
   Array.isArray(json.msgArray)
    ?json.msgArray
    :[];

  if(!arr.length){
   return null;
  }

  const r=
   arr[0];

  /*
   z = 最新成交價
   p = 盤中價
   o = 開盤
   h = 最高
   l = 最低
   y = 昨收
   v = 累積成交量
   t = 最新成交時間
   b = 買價五檔
   a = 賣價五檔
  */

  const price=
   num(r.z)||
   num(r.p);

  const bid=
   String(r.b||"")
   .split("_")
   .map(num)
   .find(
    x=>x!==null
   );

  const ask=
   String(r.a||"")
   .split("_")
   .map(num)

/* ============================================================
   均線
============================================================ */

function SMA(
 values,
 period
){

 if(
  values.length<
  period
 ){
  return null;
 }

 const a=
  values.slice(-period);

 return a.reduce(
  (s,v)=>s+v,
  0
 )/period;

}


function slope(
 values,
 period
){

 if(
  values.length<
  period
 ){
  return null;
 }

 const a=
  values.slice(-period);

 const first=a[0];
 const last=a[a.length-1];

 if(!first)return null;

 return (
  (last-first)/
  first
 )*100;

}


function bias(
 price,
 average
){

 if(
  price===null||
  average===null||
  average===0
 ){
  return null;
 }

 return (
  (price-average)/
  average
 )*100;

}


function getTechnical(
 rows,
 price
){

 const c=
  closes(rows);

 const periods=[
  5,14,27,62,131,272
 ];

 const ma={};
 const sl={};
 const bi={};

 periods.forEach(
  p=>{

   ma[p]=SMA(c,p);
   sl[p]=slope(c,p);
   bi[p]=bias(price,ma[p]);

  }
 );

 let above=0;

 periods.forEach(
  p=>{

   if(
    ma[p]!==null&&
    price>ma[p]
   ){
    above++;
   }

  }
 );

 let trend=
  "中性";

 if(above>=5){
  trend="強勢多頭";
 }
 else if(above>=4){
  trend="偏多";
 }
 else if(above<=2){
  trend="偏空";
 }

 const longBull=
  ma[62]!==null&&
  ma[131]!==null&&
  ma[272]!==null&&
  ma[62]>ma[131]&&
  ma[131]>ma[272]&&
  sl[62]>0&&
  sl[131]>0;

 const recent=
  c.slice(-21);

 const previous=
  recent.slice(0,-1);

 const oldHigh=
  previous.length
   ?Math.max(...previous)
   :null;

 const breakout=
  price!==null&&
  oldHigh!==null&&
  price>oldHigh;

 return {
  ma,
  sl,
  bi,
  trend,
  longBull,
  breakout
 };

}

 rows

   r=>{

     String(r.origin_name||"")
     .toUpperCase();

     type==="EPS"||
     type.includes("EPS")||
     origin==="EPS"||
     origin.includes("EARNINGS PER SHARE")||
     origin.includes("每股盈餘")
    );

   }
  )
  .sort(
   (a,b)=>
    String(a.date)

     String(b.date)

 if(!list.length){

  .map(

  .filter(

 if(!values.length){

 const last=

  values.slice(-4);

 const ttm=
  recent.length===4
   ?recent.reduce(
     (a,b)=>a+b,
     0
    )
   :null;

 return {

  latest:last,

  date:
   list[list.length-1].date,

  ttm

 };

}


/* ============================================================
   法人資料
============================================================ */

function emptyLaw(){

 return {
  buy:0,
  sell:0,
  net:0
 };

}


function addLaw(
 target,
 buy,
 sell
){

 target.buy+=
  num(buy)||0;

 target.sell+=
  num(sell)||0;

 target.net=
  target.buy-
  target.sell;

}


/*
 外資：
 Foreign_Investor
 +
 Foreign_Dealer_Self

 投信：
 Investment_Trust

 自營商：
 Dealer
 Dealer_self
 Dealer_Hedging
*/

function aggregateInstitutionRows(
 rows
){

 const result={
  foreign:emptyLaw(),
  trust:emptyLaw(),
  dealer:emptyLaw()
 };

 rows.forEach(
  r=>{

   const name=
    String(r.name||"");

   const buy=
    num(r.buy)||0;

   const sell=
    num(r.sell)||0;

   if(
    name==="Foreign_Investor"||
    name==="Foreign_Dealer_Self"
   ){

    addLaw(
     result.foreign,
     buy,
     sell
    );

   }

   else if(
    name==="Investment_Trust"
   ){

    addLaw(
     result.trust,
     buy,
     sell
    );

   }

   else if(
    name==="Dealer"||
    name==="Dealer_self"||
    name==="Dealer_Self"||
    name==="Dealer_Hedging"
   ){

    addLaw(
     result.dealer,
     buy,
     sell
    );

   }

  }
 );

 result.total={
  buy:
   result.foreign.buy+
   result.trust.buy+
   result.dealer.buy,

  sell:
   result.foreign.sell+
   result.trust.sell+
   result.dealer.sell
 };

 result.total.net=
  result.total.buy-
  result.total.sell;

 return result;

}

async function searchStock(
 query
){

 if(!query){

  setStatus(
   "❌ 請輸入股票代號或名稱。",
   "error"
  );

  return;

 }

 try{

  setStatus(
   "🔎 正在搜尋 "+
   esc(query)+
   " ……",
   "loading"
  );

  const stock=
   await findStock(query);

  setStatus(
   "📊 找到 "+
   esc(stock.stock_name)+
   "（"+
   esc(stock.stock_id)+
   "），正在取得行情……",
   "loading"
  );


  /*
   歷史價格 + 即時行情同時抓
  */

  const [
   prices,
   realtime
  ]=
   await Promise.all([
    getPrices(
     String(stock.stock_id)
    ),
    getRealtime(
     stock
    )
   ]);


  /*
   如果 TWSE MIS 即時行情失敗，
   再用 FinMind Tick 備援。
  */

  let realtimeFinal=
   realtime;

  if(!realtimeFinal){

   realtimeFinal=
    await getFinMindRealtime(
     String(stock.stock_id)
    );

  }


  if(!prices.length){

   throw new Error(
    "找到股票，但目前沒有取得歷史價格資料。"
   );

  }


  setStatus(
   "🏦 正在取得外資／投信／自營商／三大法人……",
   "loading"
  );


  /*
   這裡不再另外抓多餘 Tick。
   降低 API 呼叫量。
  */

  const [
   perRow,
   financial,
   inst,
   inst20
  ]=
   await Promise.all([

    getPER(
     String(stock.stock_id)
    ),

    getFinancial(
     String(stock.stock_id)
    ),

    getInstitution(
     String(stock.stock_id)
    ),

    getInstitution20(
     String(stock.stock_id)
    )

  ]);


  const epsData=
   getEPS(financial);


  setStatus(
   "🤖 正在分析法人、EPS、估值與技術面……",
   "loading"
  );


  render({

   stock,

   rows:prices,

   realtime:realtimeFinal,

   perRow,

   epsData,

   inst,

   inst20

  });


  $("quick").style.display=
   "none";


  if(realtimeFinal){

   setStatus(
    "✅ "+
    esc(stock.stock_name)+
    " 分析完成｜目前價格已聯動",
    "ok"
   );

  }
  else{

   setStatus(
    "⚠️ "+
    esc(stock.stock_name)+
    " 分析完成，但即時行情 API 暫時無回應，已使用最新收盤價。",
    "error"
   );

  }


  window.scrollTo({
   top:0,
   behavior:"smooth"
  });


 }catch(error){

  console.error(error);

  setStatus(
   "❌ "+
   esc(
    error?.message||
    "資料取得失敗，請稍後再試。"
   ),
   "error"
  );

 }

}


/* ============================================================
   事件
============================================================ */

$("searchBtn")
.addEventListener(
 "click",
 ()=>{
  searchStock(
   $("searchInput")
   .value
   .trim()
  );
 }
);


$("searchInput")
.addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter"){

   e.preventDefault();

   searchStock(
    $("searchInput")
    .value
    .trim()
   );

  }

 }
);


document
.querySelectorAll(".action")
.forEach(
 btn=>{

  btn.addEventListener(
   "click",
   ()=>{

    const code=
     btn.dataset.code;

    $("searchInput").value=
     code;

    searchStock(code);

   }
  );

 }
);


/* ============================================================
   初始
============================================================ */

setStatus(
 "🟢 API 系統待命中，請搜尋一檔股票或 ETF。",
 "ok"
);

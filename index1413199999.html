<script>

"use strict";

/* ============================================================
   API
============================================================ */

const API=
"https://api.finmindtrade.com/api/v4/data";

let stockInfoCache=null;


/* ============================================================
   工具
============================================================ */

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function num(v){
 const x=Number(v);
 return Number.isFinite(x)?x:null;
}

function money(v,d=2){
 const x=num(v);
 if(x===null)return "—";

 return x.toLocaleString(
  "zh-TW",
  {
   minimumFractionDigits:d,
   maximumFractionDigits:d
  }
 );
}

function integer(v){
 const x=num(v);

 if(x===null)return "—";

 return Math.round(x)
 .toLocaleString("zh-TW");
}

function today(){

 const d=new Date();

 return d.toISOString()
 .slice(0,10);
}

function ago(days){

 const d=new Date();

 d.setDate(
  d.getDate()-days
 );

 return d.toISOString()
 .slice(0,10);
}

function clean(v){

 return String(v||"")
 .toLowerCase()
 .replace(/\s+/g,"")
 .replace(/-/g,"")
 .replace(/_/g,"");
}

function setStatus(
 text,
 type=""
){

 $("status").textContent=text;

 $("status").className=
  "status show "+type;
}


/* ============================================================
   API GET
============================================================ */

async function apiGet(
 params,
 timeout=20000
){

 const url=new URL(API);

 Object.entries(params)
 .forEach(
  ([key,value])=>{

   if(
    value!==undefined &&
    value!==null &&
    value!==""
   ){

    url.searchParams.set(
     key,
     value
    );

   }

  }
 );

 const controller=
  new AbortController();

 const timer=setTimeout(
  ()=>controller.abort(),
  timeout
 );

 try{

  const response=
   await fetch(
    url.toString(),
    {
     method:"GET",
     cache:"no-store",
     signal:controller.signal
    }
   );

  if(!response.ok){

   throw new Error(
    "資料服務 HTTP "+
    response.status
   );

  }

  const json=
   await response.json();

  if(
   json.status!==undefined &&
   json.status!==200 &&
   json.status!==0
  ){

   throw new Error(
    json.msg||
    "資料服務回傳錯誤"
   );

  }

  return Array.isArray(json.data)
   ? json.data
   : [];

 }finally{

  clearTimeout(timer);

 }

}


/* ============================================================
   股票清單
============================================================ */

async function getStockInfo(){

 if(stockInfoCache){
  return stockInfoCache;
 }

 const rows=
  await apiGet(
   {
    dataset:
    "TaiwanStockInfo"
   },
   25000
  );

 stockInfoCache=
  rows.filter(
   x=>x.stock_id
  );

 return stockInfoCache;
}


const aliases={

 "2330":[
  "台積電",
  "台灣積體電路",
  "tsmc",
  "taiwan semiconductor"
 ],

 "2317":[
  "鴻海",
  "foxconn",
  "hon hai"
 ],

 "1326":[
  "台化",
  "台灣化學纖維",
  "formosa chemicals"
 ],

 "2891":[
  "中信金",
  "中國信託",
  "中國信託金控",
  "ctbc",
  "ctbc holding"
 ],

 "5314":[
  "世紀",
  "century"
 ],

 "0050":[
  "元大台灣50",
  "yuanta taiwan 50"
 ],

 "00631L":[
  "元大台灣50正2",
  "台灣50正2",
  "taiwan 50 2x"
 ]

};


async function findStock(
 query
){

 const q=clean(query);

 if(!q){

  throw new Error(
   "請輸入股票代號或名稱"
  );

 }

 const info=
  await getStockInfo();

 let found=
  info.find(
   x=>clean(x.stock_id)===q
  );

 if(found)return found;

 found=
  info.find(
   x=>clean(x.stock_name)===q
  );

 if(found)return found;

 for(
  const [code,list]
  of Object.entries(aliases)
 ){

  if(
   list.some(
    x=>clean(x)===q
   )
  ){

   found=
    info.find(
     x=>String(x.stock_id)===code
    );

   if(found)return found;

   return {
    stock_id:code,
    stock_name:list[0]
   };

  }

 }

 const candidates=
  info.filter(
   x=>{

    const id=
     clean(x.stock_id);

    const name=
     clean(x.stock_name);

    if(
     id.includes(q)||
     name.includes(q)
    ){

     return true;

    }

    const a=
     aliases[x.stock_id]||[];

    return a.some(
     z=>clean(z).includes(q)
    );

   }
  );

 if(!candidates.length){

  throw new Error(
   "找不到「"+
   query+
   "」"
  );

 }

 return candidates[0];

}


/* ============================================================
   價格
============================================================ */

async function getPrices(
 id
){

 return apiGet(
  {
   dataset:
   "TaiwanStockPrice",

   data_id:id,

   start_date:
   ago(420),

   end_date:
   today()
  },
  22000
 );

}

function sorted(rows){

 return [...rows]
 .sort(
  (a,b)=>
   String(a.date)
   .localeCompare(
    String(b.date)
   )
 );
}

function latest(rows){

 const a=
  sorted(rows);

 return a.length
  ? a[a.length-1]
  : null;
}

function closes(rows){

 return sorted(rows)
 .map(
  r=>num(r.close)
 )
 .filter(
  x=>x!==null
 );
}


/* ============================================================
   即時／盤中
============================================================ */

async function getTick(
 id
){

 try{

  const rows=
   await apiGet(
    {
     dataset:
     "TaiwanStockPriceTick",

     data_id:id,

     start_date:
     today()
    },
    10000
   );

  if(!rows.length){
   return null;
  }

  const r=
   rows[rows.length-1];

  return {

   price:
    num(r.deal_price)||
    num(r.close),

   date:
    r.date||
    today(),

   time:
    r.Time||
    ""

  };

 }catch(e){

  return null;

 }

}


/* ============================================================
   均線
============================================================ */

function SMA(
 values,
 period
){

 if(
  values.length<
  period
 ){
  return null;
 }

 const a=
  values.slice(
   -period
  );

 return a.reduce(
  (s,v)=>s+v,
  0
 )/period;

}

function slope(
 values,
 period
){

 if(
  values.length<
  period
 ){
  return null;
 }

 const a=
  values.slice(
   -period
  );

 const first=a[0];
 const last=
  a[a.length-1];

 if(!first)return null;

 return (
  (last-first)/
  first
 )*100;

}

function bias(
 price,
 average
){

 if(
  price===null||
  average===null||
  average===0
 ){
  return null;
 }

 return (
  (price-average)/
  average
 )*100;

}

function getTechnical(
 rows,
 price
){

 const c=
  closes(rows);

 const periods=[
  5,14,27,62,131,272
 ];

 const ma={};
 const sl={};
 const bi={};

 periods.forEach(
  p=>{

   ma[p]=SMA(
    c,p
   );

   sl[p]=slope(
    c,p
   );

   bi[p]=bias(
    price,
    ma[p]
   );

  }
 );

 let above=0;

 periods.forEach(
  p=>{

   if(
    ma[p]!==null&&
    price>ma[p]
   ){
    above++;
   }

  }
 );

 let trend=
  "中性";

 if(above>=5){
  trend=
   "強勢多頭";
 }
 else if(above>=4){
  trend=
   "偏多";
 }
 else if(above<=2){
  trend=
   "偏空";
 }

 const longBull=
  ma[62]!==null&&
  ma[131]!==null&&
  ma[272]!==null&&
  ma[62]>ma[131]&&
  ma[131]>ma[272]&&
  sl[62]>0&&
  sl[131]>0;

 const recent=
  c.slice(-21);

 const previous=
  recent.slice(0,-1);

 const oldHigh=
  previous.length
   ? Math.max(...previous)
   : null;

 const breakout=
  price!==null&&
  oldHigh!==null&&
  price>oldHigh;

 return {
  ma,
  sl,
  bi,
  trend,
  longBull,
  breakout
 };

}


/* ============================================================
   PE / PBR
============================================================ */

async function getPER(
 id
){

 try{

  const rows=
   await apiGet(
    {
     dataset:
     "TaiwanStockPER",

     data_id:id,

     start_date:
     ago(120),

     end_date:
     today()
    },
    15000
   );

  return latest(rows);

 }catch(e){

  return null;

}


/* ============================================================
   EPS
============================================================ */

async function getFinancial(
 id
){

 try{

  return await apiGet(
   {
    dataset:
    "TaiwanStockFinancialStatements",

    data_id:id,

    start_date:
    ago(1100),

    end_date:
    today()
   },
   20000
  );

 }catch(e){

  return [];

 }

}

function getEPS(
 rows
){

 const list=
  rows
  .filter(
   r=>
    String(r.type||"")
    .toUpperCase()==="EPS"
  )
  .sort(
   (a,b)=>
    String(a.date)
    .localeCompare(
     String(b.date)
    )
  );

 if(!list.length){
  return null;
 }

 const last=
  list[list.length-1];

 const recent=
  list.slice(-4)
  .map(
   r=>num(r.value)
  )
  .filter(
   x=>x!==null
  );

 const ttm=
  recent.length===4
   ? recent.reduce(
      (a,b)=>a+b,
      0
     )
   : null;

 return {
  latest:
   num(last.value),

  date:
   last.date,

  ttm
 };

async function getInstitution(
 id
){

 try{

  const rows=
   await apiGet(
    {
     dataset:
     "TaiwanStockInstitutionalInvestorsBuySell",

     data_id:id,

     start_date:
     ago(35),

     end_date:
     today()
    },
    18000
   );

  if(!rows.length){
   return null;
  }

  const dates=
   [...new Set(
    rows.map(
     r=>r.date
    )
   )].sort();

  const latestDate=
   dates[dates.length-1];

  const latestRows=
   rows.filter(
    r=>r.date===latestDate
   );

  let foreignBuy=0;
  let foreignSell=0;

  let trustBuy=0;
  let trustSell=0;

  let dealerBuy=0;
  let dealerSell=0;

  for(
   const r
   of latestRows
  ){

   const buy=
    num(r.buy)||0;

   const sell=
    num(r.sell)||0;

   const name=
    String(r.name||"");

   if(
    name==="Foreign_Investor"
   ){

    foreignBuy+=buy;
    foreignSell+=sell;

   }

   if(
    name==="Investment_Trust"
   ){

    trustBuy+=buy;
    trustSell+=sell;

   }

   if(
    name==="Dealer_Self"
    ||
    name==="Dealer_self"
    ||
    name==="Dealer_Hedging"
    ||
    name==="Dealer"
   ){

    dealerBuy+=buy;
    dealerSell+=sell;

   }

  }

  return {

   date:latestDate,

   foreignBuy:
    foreignBuy/1000,

   foreignSell:
    foreignSell/1000,

   foreignNet:
    (foreignBuy-
     foreignSell)/1000,

   trustBuy:
    trustBuy/1000,

   trustSell:
    trustSell/1000,

   trustNet:
    (trustBuy-
     trustSell)/1000,

   dealerBuy:
    dealerBuy/1000,

   dealerSell:
    dealerSell/1000,

   dealerNet:
    (dealerBuy-
     dealerSell)/1000,

   totalBuy:
    (
     foreignBuy+
     trustBuy+
     dealerBuy
    )/1000,

   totalSell:
    (
     foreignSell+
     trustSell+
     dealerSell
    )/1000,

   totalNet:
    (
     foreignBuy-
     foreignSell+
     trustBuy-
     trustSell+
     dealerBuy-
     dealerSell
    )/1000

  };

 }catch(e){

  console.error(
   "法人資料錯誤",
   e
  );

  return null;

 }

}


/* ============================================================
   法人 20 日
============================================================ */

async function getInstitution20(
 id
){

 try{

  const rows=
   await apiGet(
    {
     dataset:
     "TaiwanStockInstitutionalInvestorsBuySell",

     data_id:id,

     start_date:
     ago(45),

     end_date:
     today()
    },
    20000
   );

  if(!rows.length){
   return null;
  }

  const dates=
   [...new Set(
    rows.map(
     r=>r.date
    )
   )].sort();

  const useDates=
   dates.slice(-20);

  const map={};

  useDates.forEach(
   d=>{
    map[d]={
     foreignBuy:0,
     foreignSell:0,
     trustBuy:0,
     trustSell:0,
     dealerBuy:0,
     dealerSell:0
    };
   }
  );

  rows.forEach(
   r=>{

    if(!map[r.date]){
     return;
    }

    const buy=
     num(r.buy)||0;

    const sell=
     num(r.sell)||0;

    const name=
     String(r.name||"");

    if(
     name==="Foreign_Investor"
    ){

     map[r.date].foreignBuy+=
      buy;

     map[r.date].foreignSell+=
      sell;

    }

    if(
     name==="Investment_Trust"
    ){

     map[r.date].trustBuy+=
      buy;

     map[r.date].trustSell+=
      sell;

    }

    if(
     name==="Dealer_Self"
     ||
     name==="Dealer_self"
     ||
     name==="Dealer_Hedging"
     ||
     name==="Dealer"
    ){

     map[r.date].dealerBuy+=
      buy;

     map[r.date].dealerSell+=
      sell;

    }

   }
  );

  const periods={
   "1":useDates.slice(-1),
   "5":useDates.slice(-5),
   "20":useDates.slice(-20)
  };

  function calc(
   selected
  ){

   const result={
    foreignBuy:0,
    foreignSell:0,
    trustBuy:0,
    trustSell:0,
    dealerBuy:0,
    dealerSell:0
   };

   selected.forEach(
    d=>{

     const x=map[d];

     if(!x)return;

     Object.keys(result)
     .forEach(
      k=>{
       result[k]+=x[k];
      }
     );

    }
   );

   result.foreignNet=
    result.foreignBuy-
    result.foreignSell;

   result.trustNet=
    result.trustBuy-
    result.trustSell;

   result.dealerNet=
    result.dealerBuy-
    result.dealerSell;

   result.totalBuy=
    result.foreignBuy+
    result.trustBuy+
    result.dealerBuy;

   result.totalSell=
    result.foreignSell+
    result.trustSell+
    result.dealerSell;

   result.totalNet=
    result.totalBuy-
    result.totalSell;

   Object.keys(result)
   .forEach(
    k=>{
     result[k]/=1000;
    }
   );

   return result;

  }

  return {

   latestDate:
    useDates[useDates.length-1],

   periods:{
    1:calc(periods["1"]),
    5:calc(periods["5"]),
    20:calc(periods["20"])
   }

  };

 }catch(e){

  console.error(
   "20日法人資料錯誤",
   e
  );

  return null;

 }

}


/* ============================================================
   估值
============================================================ */

function valuation(
 price,
 eps,
 pbr,
 per
){

 let score=50;

 const reasons=[];

 let pe=
  per!==null
   ? per
   : (
      eps!==null&&eps>0
       ? price/eps
       : null
     );

 if(pe!==null){

  if(pe<=10){

   score+=22;

   reasons.push(
    "PE 偏低"
   );

  }
  else if(pe<=15){

   score+=12;

   reasons.push(
    "PE 合理偏低"
   );

  }
  else if(pe<=20){

   score+=3;

   reasons.push(
    "PE 位於中性區"
   );

  }
  else if(pe<=25){

   score-=12;

   reasons.push(
    "PE 偏高"
   );

  }
  else{

   score-=22;

   reasons.push(
    "PE 明顯偏高"
   );

  }

 }

 if(pbr!==null){

  if(pbr<1){

   score+=18;

   reasons.push(
    "PBR 低於1倍"
   );

  }
  else if(pbr<1.5){

   score+=10;

   reasons.push(
    "PBR 尚合理"
   );

  }
  else if(pbr>3){

   score-=15;

   reasons.push(
    "PBR 偏高"
   );

  }

 }

 score=
  Math.max(
   0,
   Math.min(
    100,
    score
   )
  );

 let state=
  "合理";

 let cls=
  "yellowText";

 if(score>=70){

  state=
   "偏便宜";

  cls=
   "greenText";

 }
 else if(score<40){

  state=
   "偏貴";

  cls=
   "redText";

 }

 return {

  pe,
  score,
  state,
  cls,
  reasons

 };

}


/* ============================================================
   系統合理價
============================================================ */

function fairValue(
 eps,
 industry
){

 if(
  eps===null||
  eps<=0
 ){
  return null;
 }

 let multiple=15;

 const text=
  String(industry||"");

 if(
  text.includes("金融")||
  text.includes("銀行")
 ){
  multiple=13;
 }

 else if(
  text.includes("半導體")
 ){
  multiple=18;
 }

 else if(
  text.includes("電子")
 ){
  multiple=16;
 }

 return eps*multiple;

}


/* ============================================================
   資金管理
============================================================ */

function moneyPlan(
 price,
 tech
){

 let stop=
  price*0.94;

 if(
  tech.ma[27]!==null&&
  tech.ma[27]<price
 ){

  stop=
   tech.ma[27]*0.985;

 }
 else if(
  tech.ma[62]!==null&&
  tech.ma[62]<price
 ){

  stop=
   tech.ma[62]*0.985;

 }

 let position=20;

 if(
  tech.trend==="強勢多頭"
 ){

  position=50;

 }
 else if(
  tech.trend==="偏多"
 ){

  position=40;

 }
 else if(
  tech.trend==="中性"
 ){

  position=25;

 }
 else{

  position=10;

 }

 return {
  stop,
  position
 };

}

/* ============================================================
   搜尋
============================================================ */

async function searchStock(
 query
){

 if(!query){

  setStatus(
   "請輸入股票代號或名稱。",
   "error"
  );

  return;

 }

 try{

  setStatus(
   "🔎 正在搜尋 "+query+" ……",
   "loading"
  );

  const stock=
   await findStock(query);

  setStatus(
   "📊 找到 "+
   stock.stock_name+
   "（"+
   stock.stock_id+
   "），正在取得價格……",
   "loading"
  );

  const prices=
   await getPrices(
    String(stock.stock_id)
   );

  if(!prices.length){

   throw new Error(
    "找到股票，但目前沒有取得價格資料。"
   );

  }

  setStatus(
   "🏦 正在取得外資／投信／自營商／三大法人……",
   "loading"
  );

  const [
   tick,
   perRow,
   financial,
   inst,
   inst20
  ]=
   await Promise.all([
    getTick(
     String(stock.stock_id)
    ),

    getPER(
     String(stock.stock_id)
    ),

    getFinancial(
     String(stock.stock_id)
    ),

    getInstitution(
     String(stock.stock_id)
    ),

    getInstitution20(
     String(stock.stock_id)
    )
   ]);

  const epsData=
   getEPS(financial);

  setStatus(
   "🤖 正在分析法人趨勢與技術面……",
   "loading"
  );

  render({
   stock,
   rows:prices,
   tick,
   perRow,
   epsData,
   inst,
   inst20
  });

  $("quick").style.display=
   "none";

  setStatus(
   "✅ "+
   stock.stock_name+
   " 分析完成",
   "ok"
  );

  window.scrollTo({
   top:0,
   behavior:"smooth"
  });

 }catch(error){

  console.error(error);

  setStatus(
   "❌ "+
   (
    error?.message||
    "資料取得失敗，請稍後再試。"
   ),
   "error"
  );

 }

}

 }
);

$("searchInput")
.addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter"){

   e.preventDefault();

   searchStock(
    $("searchInput")
    .value
    .trim()
   );

  }

 }
);


document
.querySelectorAll(".action")
.forEach(
 btn=>{

  btn.addEventListener(
   "click",
   ()=>{

    const code=
     btn.dataset.code;

    $("searchInput").value=
     code;

    searchStock(code);

   }
  );

 }
);

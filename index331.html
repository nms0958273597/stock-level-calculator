<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>台股股票搜尋器 V31.1｜行情＋法人＋突破＋AI分析</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#080a0c;
    color:#f5f5f5;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang TC",
        "Noto Sans TC",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
    padding-bottom:90px;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

:root{
    --bg:#080a0c;
    --card:#191b1f;
    --card2:#121416;
    --line:#41444a;
    --text:#f5f5f5;
    --muted:#96999f;

    /* 台股慣例：紅漲、綠跌 */
    --red:#ff5966;
    --green:#35e56b;

    --orange:#ff9f1c;
    --yellow:#ffd447;
    --blue:#36b9ff;
    --purple:#bd83ff;
    --cyan:#45d8df;
}

.app{
    width:100%;
    max-width:900px;
    margin:0 auto;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    padding:
        calc(env(safe-area-inset-top) + 10px)
        14px
        10px;
    background:rgba(8,10,12,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid #25282c;
}

.top-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:.3px;
}

.version{
    font-size:11px;
    color:var(--cyan);
    border:1px solid rgba(69,216,223,.35);
    border-radius:999px;
    padding:4px 8px;
    white-space:nowrap;
}

.subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.main{
    padding:12px;
}

.card{
    background:linear-gradient(
        145deg,
        rgba(28,30,34,.98),
        rgba(17,19,22,.98)
    );
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:12px;
    font-size:15px;
    font-weight:900;
}

.section-title small{
    color:var(--muted);
    font-weight:500;
    font-size:11px;
}

.search-row{
    display:flex;
    gap:8px;
}

.search-input{
    flex:1;
    min-width:0;
    height:48px;
    background:#0e1012;
    color:#fff;
    border:1px solid #4b4f55;
    border-radius:12px;
    padding:0 14px;
    outline:none;
}

.search-input:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(69,216,223,.10);
}

.search-btn{
    width:76px;
    height:48px;
    border:0;
    border-radius:12px;
    background:#f1f1f1;
    color:#111;
    font-weight:900;
}

.search-btn:active,
.action-btn:active,
.quick-btn:active,
.feature-btn:active{
    transform:scale(.97);
}

.status{
    min-height:20px;
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

.search-results{
    margin-top:8px;
}

.search-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px;
    background:#101214;
    border:1px solid #303338;
    border-radius:11px;
    margin-top:6px;
}

.search-item-left{
    min-width:0;
}

.search-name{
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.search-code{
    color:var(--cyan);
    font-size:12px;
    margin-right:7px;
}

.search-meta{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.search-go{
    flex:none;
    border:1px solid #555960;
    background:#191c20;
    color:#fff;
    border-radius:9px;
    padding:7px 10px;
    font-size:12px;
    font-weight:800;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.quick-btn{
    min-height:44px;
    border-radius:11px;
    border:1px solid #3a3d42;
    background:#101214;
    color:#fff;
    font-size:12px;
    font-weight:800;
}

.quick-btn span{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:2px;
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.feature-btn{
    min-height:64px;
    border-radius:13px;
    border:1px solid #41444a;
    background:linear-gradient(145deg,#191c20,#101214);
    color:#fff;
    text-align:left;
    padding:11px;
}

.feature-icon{
    font-size:18px;
}

.feature-name{
    font-weight:900;
    margin-top:4px;
}

.feature-desc{
    font-size:10px;
    color:var(--muted);
    margin-top:2px;
}

.scan-btn{
    width:100%;
    min-height:48px;
    border-radius:12px;
    border:1px solid rgba(255,159,28,.45);
    background:rgba(255,159,28,.10);
    color:var(--orange);
    font-weight:900;
}

.progress-wrap{
    margin-top:10px;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
}

.progress-bar{
    width:100%;
    height:6px;
    border-radius:999px;
    overflow:hidden;
    background:#272a2e;
}

.progress-fill{
    width:0%;
    height:100%;
    background:var(--cyan);
    transition:width .2s ease;
}

.home-panel{
    margin-top:10px;
}

.hero{
    border-radius:17px;
    border:1px solid #383b40;
    background:
        radial-gradient(circle at top right,rgba(69,216,223,.11),transparent 35%),
        radial-gradient(circle at bottom left,rgba(189,131,255,.08),transparent 40%),
        #121416;
    padding:16px;
}

.hero-top{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.hero-name{
    font-size:23px;
    font-weight:950;
}

.hero-code{
    color:var(--cyan);
    font-size:12px;
    margin-top:3px;
}

.price{
    font-size:32px;
    font-weight:950;
    letter-spacing:-1px;
}

.change{
    font-size:14px;
    font-weight:900;
    margin-top:3px;
}

.up{
    color:var(--red) !important;
}

.down{
    color:var(--green) !important;
}

.flat{
    color:#c7c9cc !important;
}

.market-state{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    padding:5px 9px;
    font-size:10px;
    border:1px solid #41444a;
    color:var(--muted);
    margin-top:8px;
}

.metric-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:12px;
}

.metric{
    background:#0d0f11;
    border:1px solid #2d3035;
    border-radius:10px;
    padding:8px;
    min-width:0;
}

.metric-label{
    color:var(--muted);
    font-size:9px;
}

.metric-value{
    font-size:13px;
    font-weight:900;
    margin-top:4px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.tag-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.tag{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    padding:5px 8px;
    font-size:10px;
    border:1px solid #3c4045;
    background:#111315;
    color:#d7d9dc;
}

.tag.good{
    color:var(--red);
    border-color:rgba(255,89,102,.35);
}

.tag.bad{
    color:var(--green);
    border-color:rgba(53,229,107,.35);
}

.tag.warn{
    color:var(--orange);
    border-color:rgba(255,159,28,.35);
}

.tag.info{
    color:var(--cyan);
    border-color:rgba(69,216,223,.35);
}

.analysis-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.analysis-box{
    background:#0e1012;
    border:1px solid #303338;
    border-radius:11px;
    padding:11px;
}

.analysis-label{
    color:var(--muted);
    font-size:10px;
}

.analysis-value{
    font-size:15px;
    font-weight:950;
    margin-top:5px;
}

.analysis-note{
    color:#b8bbc0;
    font-size:11px;
    line-height:1.55;
    margin-top:5px;
}

.score{
    display:flex;
    align-items:center;
    gap:10px;
}

.score-num{
    font-size:28px;
    font-weight:950;
}

.score-bar{
    flex:1;
    height:9px;
    background:#282b30;
    border-radius:999px;
    overflow:hidden;
}

.score-fill{
    height:100%;
    width:0%;
    transition:width .4s ease;
    background:var(--cyan);
}

.score-text{
    font-size:11px;
    color:var(--muted);
}

.level-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.level{
    background:#0d0f11;
    border:1px solid #303338;
    border-radius:10px;
    padding:9px;
}

.level-label{
    color:var(--muted);
    font-size:9px;
}

.level-value{
    font-size:14px;
    font-weight:950;
    margin-top:4px;
}

.level.entry .level-value{
    color:var(--cyan);
}

.level.stop .level-value{
    color:var(--green);
}

.level.target .level-value{
    color:var(--red);
}

.two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

.data-table{
    width:100%;
    border-collapse:collapse;
    min-width:500px;
    font-size:11px;
}

.data-table th,
.data-table td{
    padding:8px 6px;
    border-bottom:1px solid #292c30;
    text-align:right;
    white-space:nowrap;
}

.data-table th{
    color:var(--muted);
    font-weight:700;
}

.data-table th:first-child,
.data-table td:first-child{
    text-align:left;
}

.good-text{
    color:var(--red);
}

.bad-text{
    color:var(--green);
}

.warn-text{
    color:var(--orange);
}

.info-text{
    color:var(--cyan);
}

.muted{
    color:var(--muted);
}

.list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.list-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:#0e1012;
    border:1px solid #303338;
    border-radius:11px;
    padding:10px;
}

.list-main{
    min-width:0;
}

.list-title{
    font-size:13px;
    font-weight:900;
}

.list-sub{
    font-size:10px;
    color:var(--muted);
    margin-top:3px;
}

.list-right{
    text-align:right;
    flex:none;
}

.list-price{
    font-weight:950;
}

.list-change{
    font-size:10px;
    margin-top:3px;
}

.small-btn{
    border:1px solid #44484e;
    background:#15171a;
    color:#fff;
    border-radius:8px;
    padding:6px 9px;
    font-size:10px;
    font-weight:800;
}

.action-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}

.action-btn{
    border:1px solid #42464c;
    background:#15171a;
    color:#fff;
    border-radius:9px;
    padding:8px 11px;
    font-size:11px;
    font-weight:800;
}

.action-btn.primary{
    color:var(--cyan);
    border-color:rgba(69,216,223,.35);
}

.action-btn.danger{
    color:var(--red);
    border-color:rgba(255,89,102,.35);
}

.action-btn.success{
    color:var(--green);
    border-color:rgba(53,229,107,.35);
}

.section-divider{
    height:1px;
    background:#2b2e33;
    margin:13px 0;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:18px 8px;
    font-size:12px;
}

.loading{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    font-size:12px;
}

.spinner{
    width:14px;
    height:14px;
    border:2px solid #34383d;
    border-top-color:var(--cyan);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:200;
    padding:
        8px
        8px
        calc(env(safe-area-inset-bottom) + 8px);
    background:rgba(8,10,12,.96);
    backdrop-filter:blur(18px);
    border-top:1px solid #292c30;
}

.nav-inner{
    max-width:900px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
}

.nav-btn{
    border:0;
    background:transparent;
    color:#777b81;
    min-height:52px;
    border-radius:11px;
}

.nav-btn.active{
    background:#181b1f;
    color:#fff;
}

.nav-icon{
    font-size:17px;
}

.nav-text{
    font-size:9px;
    margin-top:3px;
}

.footer{
    color:#666a70;
    font-size:9px;
    line-height:1.55;
    text-align:center;
    padding:8px 16px 20px;
}

.switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #2b2e33;
}

.switch-row:last-child{
    border-bottom:0;
}

.setting-label{
    font-size:12px;
    font-weight:800;
}

.setting-desc{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.switch{
    width:44px;
    height:25px;
    border-radius:999px;
    border:1px solid #45494f;
    background:#24272b;
    position:relative;
    cursor:pointer;
}

.switch.on{
    background:#17434a;
    border-color:#267b84;
}

.switch::after{
    content:"";
    position:absolute;
    width:19px;
    height:19px;
    border-radius:50%;
    background:#aaa;
    top:2px;
    left:2px;
    transition:.2s;
}

.switch.on::after{
    left:21px;
    background:#fff;
}

.notice{
    border:1px solid rgba(255,159,28,.30);
    background:rgba(255,159,28,.07);
    color:#d6b47b;
    border-radius:10px;
    padding:9px 10px;
    font-size:10px;
    line-height:1.55;
}

.success-notice{
    border-color:rgba(53,229,107,.25);
    background:rgba(53,229,107,.06);
    color:#a6d9b4;
}

.danger-notice{
    border-color:rgba(255,89,102,.25);
    background:rgba(255,89,102,.06);
    color:#e6a4aa;
}

@media(max-width:560px){
    .quick-grid{
        grid-template-columns:repeat(4,1fr);
    }

    .metric-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .level-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .hero-top{
        align-items:flex-start;
    }

    .price{
        font-size:28px;
    }
}

@media(max-width:390px){
    .main{
        padding:9px;
    }

    .card{
        padding:11px;
        border-radius:14px;
    }

    .quick-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .feature-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
    <div class="top-title">
        <div class="logo">📈 台股股票搜尋器</div>
        <div class="version">V31.1 完整版</div>
    </div>
    <div class="subtitle">
        行情＋法人＋突破＋壓力＋AI規則分析＋觀察清單
    </div>
</header>

<main class="main">

    <!-- 搜尋 -->
    <section class="card">
        <div class="section-title">
            <span>🔎 股票／ETF搜尋</span>
            <small>代號最快</small>
        </div>

        <div class="search-row">
            <input
                id="searchInput"
                class="search-input"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
                placeholder="輸入 2330、台積電、1326、台化、0050"
            >
            <button id="searchBtn" class="search-btn">搜尋</button>
        </div>

        <div id="status" class="status"></div>

        <div id="searchResults" class="search-results hidden"></div>
    </section>

    <!-- 快速搜尋 -->
    <section class="card">
        <div class="section-title">
            <span>⚡ 熱門快速搜尋</span>
            <small>一鍵查看</small>
        </div>

        <div class="quick-grid">

            <button class="quick-btn" data-code="1326">
                台化
                <span>1326</span>
            </button>

            <button class="quick-btn" data-code="2481">
                強茂
                <span>2481</span>
            </button>

            <button class="quick-btn" data-code="2606">
                裕民
                <span>2606</span>
            </button>

            <button class="quick-btn" data-code="2330">
                台積電
                <span>2330</span>
            </button>

            <button class="quick-btn" data-code="2317">
                鴻海
                <span>2317</span>
            </button>

            <button class="quick-btn" data-code="0050">
                元大50
                <span>0050</span>
            </button>

            <button class="quick-btn" data-code="0056">
                元大高股息
                <span>0056</span>
            </button>

            <button class="quick-btn" data-code="00919">
                群益高息
                <span>00919</span>
            </button>

        </div>
    </section>

    <!-- 六大功能 -->
    <section class="card">
        <div class="section-title">
            <span>🧠 六大分析功能</span>
            <small>完整掃描</small>
        </div>

        <div class="feature-grid">

            <button class="feature-btn" data-action="recent">
                <div class="feature-icon">🔥</div>
                <div class="feature-name">近期強勢</div>
                <div class="feature-desc">價格動能＋均線趨勢</div>
            </button>

            <button class="feature-btn" data-action="long">
                <div class="feature-icon">🌱</div>
                <div class="feature-name">長線佈局</div>
                <div class="feature-desc">均線＋位置＋風險</div>
            </button>

            <button class="feature-btn" data-action="popular">
                <div class="feature-icon">📊</div>
                <div class="feature-name">熱門人氣</div>
                <div class="feature-desc">成交量＋量價動能</div>
            </button>

            <button class="feature-btn" data-action="institution">
                <div class="feature-icon">🏦</div>
                <div class="feature-name">法人偏多</div>
                <div class="feature-desc">外資＋投信＋自營商</div>
            </button>

            <button class="feature-btn" data-action="pressure">
                <div class="feature-icon">🚧</div>
                <div class="feature-name">壓力分析</div>
                <div class="feature-desc">壓力區＋突破狀態</div>
            </button>

            <button class="feature-btn" data-action="analysis">
                <div class="feature-icon">🤖</div>
                <div class="feature-name">AI分析說明</div>
                <div class="feature-desc">規則模型判斷邏輯</div>
            </button>

        </div>

        <div style="height:10px"></div>

        <button id="breakScanBtn" class="scan-btn">
            🚀 掃描目前市場突破機會
        </button>

        <div id="progressWrap" class="progress-wrap hidden">
            <div class="progress-info">
                <span id="progressText">準備掃描...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>

function num(value, fallback=0){

            String(value ?? "")
                .replace(/,/g,"")
                .replace(/--/g,"")
        );

    return Number.isFinite(n)

function fmt(value,digits=2){
    if(value === null || value === undefined || value === "" || !Number.isFinite(Number(value))){
        return "--";

    return Number(value).toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits:digits,
            maximumFractionDigits:digits
        }
    );
}

function fmtInt(value){
    if(!Number.isFinite(Number(value))){
        return "--";
    }

    return Number(value).toLocaleString("zh-TW",{
        maximumFractionDigits:0
    });
}

function pct(value,digits=2){
    if(!Number.isFinite(Number(value))){
        return "--";
    }

    return Number(value).toFixed(digits) + "%";
}

function clamp(value,min,max){

function avg(arr){
    const clean =
        arr
            .map(Number)
            .filter(Number.isFinite);

    if(!clean.length) return 0;

    return clean.reduce((a,b)=>a+b,0)/clean.length;
}

function sum(arr){
    return arr
        .map(Number)
        .filter(Number.isFinite)
        .reduce((a,b)=>a+b,0);
}

function median(arr){
    const clean =
        arr
            .map(Number)
            .filter(Number.isFinite)
            .sort((a,b)=>a-b);

    if(!clean.length) return 0;

    const mid =
        Math.floor(clean.length/2);

    return clean.length % 2
        ? clean[mid]
        : (clean[mid-1]+clean[mid])/2;
}

function roundPrice(value){
    if(!Number.isFinite(Number(value))) return 0;

    const n = Number(value);

    if(n < 10) return Math.round(n*100)/100;
    if(n < 50) return Math.round(n*20)/20;
    if(n < 100) return Math.round(n*10)/10;

    return Math.round(n);
}

/* =========================================================

async function fetchJSON(
    url,
    options={},
    timeout=15000
){

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            ()=>controller.abort(),
            timeout
        );

    try{

        const response =
            await fetch(
                url,
                {
                    ...options,
                    signal:controller.signal
                }
            );

        if(!response.ok){
            throw new Error(
                "HTTP "+response.status
            );
        }

        return await response.json();

    }finally{

        clearTimeout(timer);

    }
}


/* =========================================================
   FinMind
   ========================================================= */

async function finmind(
    params,
    timeout=15000
){

    const query =
        new URLSearchParams(params);

    const url =
        FINMIND+"?"+query.toString();

    const json =
        await fetchJSON(
            url,
            {},
            timeout
        );

    if(
        json &&
        json.msg &&
        json.msg !== "success"
    ){
        throw new Error(
            json.msg
        );
    }

    return json;
}

/* =========================================================
   股票名稱／代號搜尋
   ========================================================= */

function normalizeQuery(query){

    return String(query ?? "")
        .trim()
        .replace(/\s+/g,"")
        .toLowerCase();

}

function findKnown(query){

    const q =
        normalizeQuery(query);

    if(!q) return null;

    const aliasCode =
        ALIAS[q];

    if(aliasCode){

        const item =
            KNOWN.find(
                x=>x.code===aliasCode
            );

        if(item){
            return {...item};
        }

        return {
            code:aliasCode,
            name:q,
            market:"tse",
            industry:"股票／ETF"
        };

    }

    const direct =
        KNOWN.find(
            x =>
                x.code.toLowerCase()===q ||
                x.name.toLowerCase()===q
        );

    if(direct){
        return {...direct};
    }

    return null;
}


/*
 * 數字／ETF代號直接走行情，
 * 不先下載完整 TaiwanStockInfo。
 */
function isLikelyCode(query){

    const q =
        normalizeQuery(query);

    return /^[0-9]{4,6}[a-z]?$/i.test(q);
}


async function searchCandidates(query){

    const q =
        normalizeQuery(query);

    if(!q){
        return [];
    }

    const known =
        findKnown(q);

    if(known){
        return [known];
    }

    if(isLikelyCode(q)){

        return [{
            code:q.toUpperCase(),
            name:q.toUpperCase(),
            market:"tse",
            industry:"股票／ETF"
        }];

    }

    const info =
        await loadStockInfo();

    if(!info.length){
        return [];
    }

    const result =
        info
            .filter(item=>{

                const code =
                    normalizeQuery(
                        item.stock_id
                    );

                const name =
                    normalizeQuery(
                        item.stock_name
                    );

                const industry =
                    normalizeQuery(
                        item.industry_category
                    );

                return (
                    code.includes(q) ||
                    name.includes(q) ||
                    industry.includes(q)
                );

            })
            .slice(0,20)
            .map(item=>({

                code:String(item.stock_id),
                name:item.stock_name || item.stock_id,
                market:
                    item.type==="twse"
                        ? "tse"
                        : "otc",
                industry:
                    item.industry_category ||
                    "股票／ETF"

            }));

    return result;
}


/* =========================================================
   findStock
   ========================================================= */

async function findStock(query){

    const q =
        normalizeQuery(query);

    if(!q){
        throw new Error("請輸入股票代號或名稱");
    }

    const known =
        findKnown(q);

    if(known){
        return known;
    }

    if(isLikelyCode(q)){

        return {
            code:q.toUpperCase(),
            name:q.toUpperCase(),
            market:"tse",
            industry:"股票／ETF"
        };

    }

    const candidates =
        await searchCandidates(q);

    if(!candidates.length){
        throw new Error(
            "找不到符合的股票或 ETF"
        );
    }

    return candidates[0];
}


/* =========================================================
   TWSE MIS 即時行情
   ========================================================= */

function buildMISUrl(stock){

    const market =
        stock.market==="otc"
            ? "otc"
            : "tse";

    return (
        MIS +
        "?ex_ch=" +
        market +
        "_" +
        encodeURIComponent(stock.code) +
        ".tw" +
        "&json=1&delay=0"
    );
}


function parseMIS(json,stock){

    let item = null;

    if(Array.isArray(json?.msgArray)){
        item =
            json.msgArray.find(
                x =>
                    String(x.c)===String(stock.code)
            ) ||
            json.msgArray[0];
    }

    if(!item){
        return null;
    }

    const price =
        num(item.z);

    const prev =
        num(item.y);

    const open =
        num(item.o);

    const high =
        num(item.h);

    const low =
        num(item.l);

    let current =
        price;

    if(!current){
        current =
            prev;
    }

    const change =
        current-prev;

    const changePct =
        prev
            ? change/prev*100
            : 0;

    return {

        code:
            item.c ||
            stock.code,

        name:
            item.n ||
            stock.name,

        market:
            stock.market,

        industry:
            stock.industry,

        price:current,

        prev,

        open,

        high,

        low,

        change,

        changePct,

        bid:
            num(
                String(item.b||"")
                    .split("_")[0]
            ),

        ask:
            num(
                String(item.a||"")
                    .split("_")[0]
            ),

        volume:
            num(item.v),

        totalVolume:
            num(item.v),

        timestamp:
            item.t && item.d
                ? item.d+" "+item.t
                : "",

        raw:item

    };
}


async function getRealtime(stock){

    const key =
        "realtime:"+stock.code;

    const cached =
        cacheGet(
            key,
            TTL.realtime
        );

    if(cached){
        return cached;
    }

    const original =
        buildMISUrl(stock);

    let lastError =
        null;

    const urls =
        [original,...PROXIES.map(fn=>fn(original))];

    for(
        const url of urls
    ){

        try{

            const json =
                await fetchJSON(
                    url,
                    {},
                    10000
                );

            const parsed =
                parseMIS(
                    json,
                    stock
                );

            if(parsed && parsed.price){

                cacheSet(
                    key,
                    parsed
                );

                return parsed;

            }

        }catch(error){

            lastError =
                error;

        }

    }

    throw (
        lastError ||
        new Error("即時行情無法取得")
    );
}

    );

        await finmind(
            {

                    "TaiwanStockInstitutionalInvestorsBuySell",

                    end.toISOString().slice(0,10)
            },

        );

        Array.isArray(json?.data)
            ? json.data
            : [];

    const byDate = {};

    for(const row of rows){

        const date =
            row.date;

        if(!byDate[date]){
            byDate[date] = {
                date,
                foreign:0,
                trust:0,
                dealer:0,
                total:0
            };
        }

        const buy =
            num(
                row.buy
            );

        const sell =
            num(
                row.sell
            );

        const net =
            buy-sell;

        const name =
            String(
                row.name || ""
            );

        if(
            name.includes("外資")
        ){

            byDate[date].foreign +=
                net;

        }else if(
            name.includes("投信")
        ){

            byDate[date].trust +=
                net;

        }else if(
            name.includes("自營商")
        ){

            byDate[date].dealer +=
                net;

        }

    }

    const result =
        Object.values(byDate)
            .sort(
                (a,b)=>
                    String(a.date)
                        .localeCompare(
                            String(b.date)
                        )
            )
            .map(x=>{

                x.total =
                    x.foreign+
                    x.trust+
                    x.dealer;

                return x;

            });

    cacheSet(
        key,
        result
    );

    return result;
}

/* =========================================================
   移動平均
   ========================================================= */

function movingAverage(
    prices,
    period
){

    if(
        prices.length < period
    ){
        return 0;
    }

    const arr =
        prices
            .slice(-period)
            .map(x=>x.close);

    return avg(arr);
}


function slope(
    prices,
    period=5
){

    if(prices.length < period*2){
        return 0;
    }

    const now =
        movingAverage(
            prices,
            period
        );

    const old =
        avg(
            prices
                .slice(
                    -(period*2),
                    -period
                )
                .map(x=>x.close)
        );

    if(!old){
        return 0;
    }

    return (
        now-old
    )/old*100;
}


/* =========================================================
   技術分析
   ========================================================= */

function technicalAnalysis(
    prices,
    realtime
){

    const closes =
        prices.map(x=>x.close);

    const volumes =
        prices.map(x=>x.volume);

    const price =
        realtime?.price ||
        closes[closes.length-1] ||
        0;

    const ma5 =
        movingAverage(
            prices,
            5
        );

    const ma20 =
        movingAverage(
            prices,
            20
        );

    const ma60 =
        movingAverage(
            prices,
            60
        );

    const ma120 =
        movingAverage(
            prices,
            120
        );

    const ma240 =
        movingAverage(
            prices,
            240
        );

    const ma5Slope =
        slope(prices,5);

    const ma20Slope =
        slope(prices,20);

    const ma60Slope =
        slope(prices,60);

    const recent20 =
        prices.slice(-20);

    const recent60 =
        prices.slice(-60);

    const recent120 =
        prices.slice(-120);

    const high20 =
        Math.max(
            ...recent20.map(x=>x.high)
        );

    const low20 =
        Math.min(
            ...recent20.map(x=>x.low)
        );

    const high60 =
        recent60.length
            ? Math.max(
                ...recent60.map(x=>x.high)
            )
            : 0;

    const low60 =
        recent60.length
            ? Math.min(
                ...recent60.map(x=>x.low)
            )
            : 0;

    const high120 =
        recent120.length
            ? Math.max(
                ...recent120.map(x=>x.high)
            )
            : 0;

    const low120 =
        recent120.length
            ? Math.min(
                ...recent120.map(x=>x.low)
            )
            : 0;

    const avgRange =
        avg(
            recent20.map(
                x =>
                    x.close
                        ? (
                            x.high-x.low
                        )/x.close*100
                        : 0
            )
        );

    const avgVol20 =
        avg(
            recent20.map(
                x=>x.volume
            )
        );

    const avgVol5 =
        avg(
            prices
                .slice(-5)
                .map(x=>x.volume)
        );

    const volumeRatio =
        avgVol20
            ? avgVol5/avgVol20
            : 0;

    const bias5 =
        ma5
            ? (price-ma5)/ma5*100
            : 0;

    const bias20 =
        ma20
            ? (price-ma20)/ma20*100
            : 0;

    const bias60 =
        ma60
            ? (price-ma60)/ma60*100
            : 0;

    const nearHigh =
        high20
            ? price/high20*100
            : 0;

    const recent10 =
        prices.slice(-10);

    const upDays =
        recent10.filter(
            (x,i)=>{
                if(i===0) return false;

                return (
                    x.close >
                    recent10[i-1].close
                );
            }
        ).length;

    const downDays =
        recent10.filter(
            (x,i)=>{
                if(i===0) return false;

                return (
                    x.close <
                    recent10[i-1].close
                );
            }
        ).length;

    const trendScore =
        (
            (price>ma5 ? 15 : 0) +
            (price>ma20 ? 15 : 0) +
            (price>ma60 ? 10 : 0) +
            (ma5Slope>0 ? 8 : 0) +
            (ma20Slope>0 ? 8 : 0) +
            (ma60Slope>0 ? 5 : 0)
        );

    let trend =
        "整理";

    if(
        price>ma20 &&
        ma20Slope>0 &&
        price>ma60
    ){
        trend="多頭";
    }else if(
        price<ma20 &&
        ma20Slope<0 &&
        price<ma60
    ){
        trend="空頭";
    }else if(
        price>ma20
    ){
        trend="偏多";
    }else if(
        price<ma20
    ){
        trend="偏空";
    }

    const breakout =
        price >= high20*0.998;

    const breakdown =
        price <= low20*1.002;

    const consolidation =
        avgRange > 0 &&
        avgRange < 3.5;

    const maTurnStrong =
        ma5Slope>0 &&
        ma20Slope>0;

    const longBull =
        ma20>0 &&
        ma60>0 &&
        ma120>0 &&
        ma20>ma60 &&
        ma60>ma120;

    return {

        price,

        ma5,
        ma20,
        ma60,
        ma120,
        ma240,

        ma5Slope,
        ma20Slope,
        ma60Slope,

        bias5,
        bias20,
        bias60,

        high20,
        low20,
        high60,
        low60,
        high120,
        low120,

        avgRange,

        avgVol20,
        avgVol5,
        volumeRatio,

        nearHigh,

        upDays,
        downDays,

        trendScore:
            clamp(
                trendScore,
                0,
                61
            ),

        trend,

        breakout,
        breakdown,

        consolidation,

        maTurnStrong,

        longBull

    };
}

/* =========================================================
   壓力分析
   ========================================================= */

function pressureAnalysis(
    prices,
    realtime,
    institution
){

    const price =
        realtime?.price || 0;

    if(!price || prices.length<10){

        return {
            pressure:0,
            pressure2:0,
            support:0,
            support2:0,
            pressureScore:0,
            status:"資料不足",
            note:"歷史資料不足，暫時無法建立壓力模型。"
        };

    }

    const recent =
        prices.slice(-60);

    const levels=[];

    recent.forEach(x=>{

        if(x.high>0){
            levels.push(x.high);
        }

        if(x.close>0){
            levels.push(x.close);
        }

    });

    const candidates =
        levels
            .filter(
                x =>
                    x > price*0.90 &&
                    x < price*1.12
            );

    const clusters = [];

    candidates.forEach(level=>{

        const tolerance =
            Math.max(
                price*0.02,
                0.5
            );

        const nearby =
            candidates.filter(
                x =>
                    Math.abs(x-level)
                    <= tolerance
            );

        clusters.push({

            level:
                median(nearby),

            touches:
                nearby.length

        });

    });

    clusters.sort(
        (a,b)=>
            b.touches-a.touches
    );

    const resistance =
        clusters
            .filter(x=>x.level>price)
            .sort(
                (a,b)=>
                    a.level-b.level
            );

    const support =
        clusters
            .filter(x=>x.level<price)
            .sort(
                (a,b)=>
                    b.level-a.level
            );

    const pressure =
        resistance[0]?.level ||
        Math.max(
            ...recent.map(x=>x.high)
        );

    const pressure2 =
        resistance[1]?.level ||
        pressure*1.03;

    const supportPrice =
        support[0]?.level ||
        Math.min(
            ...recent.map(x=>x.low)
        );

    const support2 =
        support[1]?.level ||
        supportPrice*0.97;

    const distance =
        pressure
            ? (pressure-price)/price*100
            : 99;

    let status =
        "壓力偏遠";

    if(price>=pressure*0.995){
        status="突破壓力附近";
    }else if(distance<=2){
        status="接近壓力";
    }else if(distance<=5){
        status="中度壓力";
    }

    const total20 =
        institution?.total20 || 0;

    let holdBonus=0;

    if(
        price>=pressure &&
        total20>0
    ){
        holdBonus=20;
    }

    const pressureScore =
        clamp(
            100-
            distance*12+
            holdBonus,
            0,
            100
        );

    let note =
        "目前距離主要壓力尚有空間。";

    if(status==="接近壓力"){
        note =
            "股價已接近近期密集成交／高點區，追價前應觀察能否有效突破。";
    }

    if(status==="突破壓力附近"){
        if(total20>0){
            note =
                "價格位於壓力上方，且近20日法人合計偏正，屬「突破＋站穩觀察」型態。";
        }else{
            note =
                "價格已突破主要壓力，但法人未同步偏多，仍需觀察是否站穩。";
        }
    }

    return {

        pressure:
            roundPrice(pressure),

        pressure2:
            roundPrice(pressure2),

        support:
            roundPrice(supportPrice),

        support2:
            roundPrice(support2),

        pressureScore,

        status,

        note

    };
}


/* =========================================================
   假突破／反彈分析
   ========================================================= */

function reboundAnalysis(
    prices,
    realtime,
    technical
){

    const price =
        realtime?.price || 0;

    const ma20 =
        technical.ma20;

    const ma60 =
        technical.ma60;

    let score=50;

    if(price>ma20) score+=10;
    else score-=10;

    if(price>ma60) score+=10;
    else score-=10;

    if(technical.ma5Slope>0) score+=8;
    else score-=8;

    if(
        technical.volumeRatio>1.2
    ){
        score+=8;
    }

    const recent5 =
        prices.slice(-5);

    const greenCount =
        recent5.filter(
            (x,i)=>{
                if(i===0) return x.close>x.open;

                return (
                    x.close >
                    prices[
                        Math.max(
                            0,
                            prices.length-6+i
                        )
                    ].close
                );
            }
        ).length;

    if(greenCount>=3){
        score+=5;
    }

    score =
        clamp(score,0,100);

    let label =
        "普通反彈";

    if(
        score>=75 &&
        price>ma20 &&
        price>ma60
    ){
        label="偏強反彈";
    }else if(
        score<40
    ){
        label="弱勢反彈／風險較高";
    }

    return {
        score,
        label
    };
}

){

    const price =
        realtime?.price ||
        technical.price;

    const support =
        pressure.support ||
        technical.ma20 ||
        price*.97;

    const support2 =
        pressure.support2 ||
        technical.ma60 ||
        price*.94;

    const stop =
        roundPrice(
            Math.min(
                support2*.98,
                price*.92
            )
        );

    const firstEntry =
        roundPrice(
            Math.min(
                support*1.01,
                price*0.99
            )
        );

    const secondEntry =
        roundPrice(
            Math.min(
                support2*1.01,
                price*0.96
            )
        );

    const tp1 =
        roundPrice(
            Math.max(
                pressure.pressure ||
                price*1.05,
                price*1.04
            )
        );

    const tp2 =
        roundPrice(
            Math.max(
                pressure.pressure2 ||
                price*1.08,
                price*1.08
            )
        );

    let action =
        "觀察";

    let note =
        "等待較好的價格位置，不需要追價。";

    if(
        ai.total>=75 &&
        price<=firstEntry*1.015 &&
        !technical.breakout
    ){

        action="第一進場區";
        note=
            "趨勢與籌碼偏正，可在支撐附近分批觀察。";

    }else if(
        ai.total>=65 &&
        price<=secondEntry*1.02
    ){

        action="第二進場區";
        note=
            "回到第二支撐附近，可考慮分批而非一次投入。";

    }else if(
        technical.breakout &&
        technical.volumeRatio>=1.2
    ){

        action="突破觀察";
        note=
            "已接近／突破壓力，重點不是追高，而是觀察突破後能否站穩。";

    }else if(
        technical.bias20>8 &&
        technical.nearHigh>=97
    ){

        action="不追高";
        note=
            "股價已位於近期高檔，等待拉回或突破確認。";

    }else if(
        ai.total<40
    ){

        action="暫不進場";
        note=
            "目前趨勢、籌碼或位置條件不足。";

    }

    return {

        firstEntry,
        secondEntry,

        observe:
            roundPrice(
                support
            ),

        stop,

        tp1,
        tp2,

        action,
        note

    };
}


/* =========================================================
   完整資料
   ========================================================= */

async function buildData(stock){

    const results =
        await Promise.allSettled([

            getRealtime(stock),

            getPrices(stock.code),

            getInstitution(stock.code),

            getPER(stock.code),

            getFinancial(stock.code)

        ]);

    const realtime =
        results[0].status==="fulfilled"
            ? results[0].value
            : null;

    const prices =
        results[1].status==="fulfilled"
            ? results[1].value
            : [];

    const institutionRows =
        results[2].status==="fulfilled"
            ? results[2].value
            : [];

    const per =
        results[3].status==="fulfilled"
            ? results[3].value
            : {
                pe:0,
                dividendYield:0,
                pb:0
            };

    const financial =
        results[4].status==="fulfilled"
            ? results[4].value
            : {
                eps:0,
                bookValue:0
            };


    if(
        !realtime &&
        !prices.length
    ){
        throw new Error(
            "目前無法取得此股票行情資料"
        );
    }


    /*
     * 如果即時行情失敗，
     * 用歷史最後價格當暫時價格。
     */
    const rt =
        realtime ||
        {

            code:stock.code,
            name:stock.name,
            market:stock.market,
            industry:stock.industry,

            price:
                prices.length
                    ? prices[prices.length-1].close
                    : 0,

            prev:
                prices.length>1
                    ? prices[prices.length-2].close
                    : 0,

            open:
                prices.length
                    ? prices[prices.length-1].open
                    : 0,

            high:
                prices.length
                    ? prices[prices.length-1].high
                    : 0,

            low:
                prices.length
                    ? prices[prices.length-1].low
                    : 0,

            volume:
                prices.length
                    ? prices[prices.length-1].volume
                    : 0

        };


    if(!rt.change && rt.prev){
        rt.change =
            rt.price-rt.prev;

        rt.changePct =
            rt.prev
                ? rt.change/rt.prev*100
                : 0;
    }


    const technical =
        technicalAnalysis(
            prices,
            rt
        );

    const institution =
        institutionAnalysis(
            institutionRows
        );

    const valuation =
        valuationAnalysis(
            rt,
            per,
            financial,
            stock.industry
        );

    const pressure =
        pressureAnalysis(
            prices,
            rt,
            institution
        );

    const rebound =
        reboundAnalysis(
            prices,
            rt,
            technical
        );

    const ai =
        aiAnalysis(
            technical,
            institution,
            pressure,
            valuation
        );

    const entry =
        entryAnalysis(
            technical,
            pressure,
            ai,
            rt
        );


    return {

        stock,

        realtime:rt,

        prices,

        institutionRows,

        institution,

        technical,

        valuation,

        pressure,

        rebound,

        ai,

        entry

    };
}

/* =========================================================
   趨勢標籤
   ========================================================= */

function trendTags(data){

    const t =
        data.technical;

    const tags=[];

    if(t.price>t.ma5){
        tags.push(
            tagHTML(
                "站上MA5",
                "good"
            )
        );
    }else{
        tags.push(
            tagHTML(
                "跌破MA5",
                "bad"
            )
        );
    }

    if(t.price>t.ma20){
        tags.push(
            tagHTML(
                "站上MA20",
                "good"
            )
        );
    }else{
        tags.push(
            tagHTML(
                "跌破MA20",
                "bad"
            )
        );
    }

    if(t.price>t.ma60){
        tags.push(
            tagHTML(
                "站上MA60",
                "good"
            )
        );
    }else{
        tags.push(
            tagHTML(
                "跌破MA60",
                "bad"
            )
        );
    }

    if(t.breakout){
        tags.push(
            tagHTML(
                "突破近期高點",
                "good"
            )
        );
    }

    if(t.consolidation){
        tags.push(
            tagHTML(
                "波動收斂",
                "info"
            )
        );
    }

    if(t.longBull){
        tags.push(
            tagHTML(
                "長線多頭排列",
                "good"
            )
        );
    }

    return tags.join("");

}


/* =========================================================
   最終判斷
   ========================================================= */

function finalJudgment(data){

    const ai =
        data.ai;

    const t =
        data.technical;

    const inst =
        data.institution;

    const p =
        data.pressure;

    if(
        ai.total>=80 &&
        t.breakout &&
        t.volumeRatio>=1.2 &&
        inst.total20>0
    ){

        return {
            title:"強勢突破＋法人同步",
            cls:"good-text",
            note:
                "這是本模型中較完整的多方訊號，但仍要觀察突破後是否站穩。"
        };

    }

    if(
        ai.total>=72 &&
        t.price>t.ma20 &&
        inst.total20>0
    ){

        return {
            title:"偏多格局",
            cls:"good-text",
            note:
                "趨勢與籌碼偏正，可採分批思維，不必一次重押。"
        };

    }

    if(
        p.status==="接近壓力"
    ){

        return {
            title:"接近壓力，避免追價",
            cls:"warn-text",
            note:
                "目前位置偏高，重點看能否有效突破並站穩。"
        };

    }

    if(
        t.price<t.ma20 &&
        inst.total20<0
    ){

        return {
            title:"偏弱格局",
            cls:"bad-text",
            note:
                "價格與法人同步偏弱，先等待結構改善。"
        };

    }

    return {
        title:"中性觀察",
        cls:"info-text",
        note:
            "目前訊號沒有形成明確共振，等待價格、均線與籌碼同步。"
    };

}

/* =========================================================
   即時更新
   ========================================================= */

function startAutoRefresh(){

    stopAutoRefresh();

    if(!autoRefreshEnabled){
        return;
    }

    if(!currentStock){
        return;
    }

    refreshTimer =
        setInterval(
            async()=>{

                /*
                 * 只有盤中才自動刷新，
                 * 避免休市期間不停打 API。
                 */
                const now =
                    new Date();

                const day =
                    now.getDay();

                const mins =
                    now.getHours()*60+
                    now.getMinutes();

                if(
                    day===0 ||
                    day===6 ||
                    mins<540 ||
                    mins>810
                ){
                    return;
                }

                try{

                    await refreshPrice(
                        true
                    );

                }catch(error){

                    console.warn(
                        "auto refresh failed",
                        error
                    );

                }

            },
            10000
        );

}


function stopAutoRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

        refreshTimer=null;

    }

}


async function refreshPrice(
    silent=false
){

    if(!currentStock){
        return;
    }

    API_CACHE.delete(
        "realtime:"+currentStock.code
    );

    try{

        const realtime =
            await getRealtime(
                currentStock
            );

        if(currentData){

            currentData.realtime =
                realtime;

            currentData.technical =
                technicalAnalysis(
                    currentData.prices,
                    realtime
                );

            currentData.pressure =
                pressureAnalysis(
                    currentData.prices,
                    realtime,
                    currentData.institution
                );

            currentData.ai =
                aiAnalysis(
                    currentData.technical,
                    currentData.institution,
                    currentData.pressure,
                    currentData.valuation
                );

            currentData.entry =
                entryAnalysis(
                    currentData.technical,
                    currentData.pressure,
                    currentData.ai,
                    realtime
                );

            renderData(
                currentData
            );

        }

        }

    }catch(error){

        if(!silent){

/* =========================================================
   單股快速掃描
   ========================================================= */

async function scanOne(code){

    const stock =
        getStockByCode(code);

    const results =
        await Promise.allSettled([

            getRealtime(stock),

            getPrices(code),

            getInstitution(code)

        ]);

    const realtime =
        results[0].status==="fulfilled"
            ? results[0].value
            : null;

    const prices =
        results[1].status==="fulfilled"
            ? results[1].value
            : [];

    const instRows =
        results[2].status==="fulfilled"
            ? results[2].value
            : [];

    if(!realtime && !prices.length){
        return null;
    }

    const rt =
        realtime ||
        {

            code,

            name:
                stock.name,

            price:
                prices.length
                    ? prices[prices.length-1].close
                    : 0,

            prev:
                prices.length>1
                    ? prices[prices.length-2].close
                    : 0,

            volume:
                prices.length
                    ? prices[prices.length-1].volume
                    : 0

        };

    if(!rt.change && rt.prev){

        rt.change =
            rt.price-rt.prev;

        rt.changePct =
            rt.prev
                ? rt.change/rt.prev*100
                : 0;

    }

    const technical =
        technicalAnalysis(
            prices,
            rt
        );

    const institution =
        institutionAnalysis(
            instRows
        );

    return {

        stock,

        realtime:rt,

        technical,

        institution

    };

}


/* =========================================================
   並行掃描
   ========================================================= */

async function scanPool(
    codes,
    onItem
){

    const results=[];

    let index=0;
    let completed=0;

    const workers =
        Math.min(
            2,
            codes.length
        );

    async function worker(){

        while(true){

            const current =
                index++;

            if(current>=codes.length){
                return;
            }

            const code =
                codes[current];

            try{

                const item =
                    await scanOne(code);

                if(item){
                    results.push(item);
                }

            }catch(error){

                console.warn(
                    "scan failed",
                    code,
                    error
                );

            }

            completed++;

            if(onItem){
                onItem(
                    completed,
                    codes.length,
                    code
                );
            }

            /*
             * 輕微間隔，
             * 避免一次大量轟 API。
             */
            await sleep(120);

        }

    }

    await Promise.all(
        Array.from(
            {length:workers},
            ()=>worker()
        )
    );

    return results;

}

function scanRowHTML(
    item,
    index,
    mode
){

    const rt =
        item.realtime;

    const t =
        item.technical;

    const inst =
        item.institution;

    let score=0;
    let label="";

    if(mode==="recent"){

        score =
            t.trendScore+
            clamp(
                t.bias20*2,
                -20,
                20
            )+
            (t.nearHigh>95?15:0);

        label =
            t.trend;

    }else if(mode==="long"){

        score =
            (t.longBull?50:25)+
            (rt.price>t.ma20?20:0)+
            (rt.price>t.ma60?20:0)+
            (inst.total20>0?15:0);

        label =
            t.longBull
                ? "長線偏多"
                : "等待排列";

    }else if(mode==="popular"){

        /*
         * V31.1 修正：
         * 熱門不再使用「價格」當成交量。
         */
        score =
            clamp(
                t.volumeRatio*45+
                Math.max(
                    0,
                    t.bias5
                )*2+
                (rt.volume>0?10:0),
                0,
                100
            );

        label =
            t.volumeRatio>=1.4
                ? "明顯放量"
                : t.volumeRatio>=1.1
                    ? "量能增加"
                    : "一般量能";

    }else if(mode==="institution"){

        score =
            clamp(
                50+
                (inst.total5>0?20:-10)+
                (inst.total20>0?25:-15)+
                (inst.f20>0?10:0)+
                (inst.t20>0?10:0),
                0,
                100
            );

        label =
            inst.total20>0
                ? "法人偏多"
                : "法人偏空";

    }else if(mode==="pressure"){

        const near =
            t.nearHigh>=97;

        const breakout =
            t.breakout;

        const hold =
            breakout &&
            inst.total20>0;

        score =
            (
                near?35:10
            )+
            (
                breakout?35:0
            )+
            (
                hold?30:0
            );

        if(hold){
            label="突破＋站穩觀察";
        }else if(breakout){
            label="突破觀察";
        }else if(near){
            label="接近壓力";
        }else{
            label="壓力尚有空間";
        }

    }else{

        score =
            t.trendScore;

        label =
            t.trend;

    }

    score =
        Math.round(
            clamp(
                score,
                0,
                100
            )
        );

    const cls =
        score>=70
            ? "good-text"
            : score<45
                ? "bad-text"
                : "info-text";

    return `

        <div class="list-item">

            <div class="list-main">

                <div class="list-title">

                    #${index+1}
                   　
                    ${escapeHTML(
                        item.stock.name
                    )}

                    <span class="muted">
                        ${escapeHTML(
                            item.stock.code
                        )}
                    </span>

                </div>

                <div class="list-sub">

                    ${escapeHTML(label)}

                   　
                    MA20
                    ${fmt(t.ma20)}

                   　
                    量比
                    ${
                        t.volumeRatio
                            ? t.volumeRatio.toFixed(2)
                            : "--"
                    }

                </div>

            </div>

            <div class="list-right">

                <div class="list-price">
                    ${fmt(rt.price)}
                </div>

                <div class="list-change ${changeClass(rt.change)}">
                    ${rt.change>=0?"+":""}${fmt(rt.changePct)}%
                </div>

                <div class="${cls}"
                     style="font-size:10px;margin-top:2px">
                    ${score}
                </div>

            </div>

            <button
                class="small-btn"
                data-open-code="${escapeHTML(item.stock.code)}"
            >
                查看
            </button>

        </div>

    `;

}

            subtitle:"成交量＋量價"
        },

        institution:{
            title:"🏦 法人偏多排行",
            subtitle:"5日＋20日法人"
        },

        pressure:{
            title:"🚧 壓力突破排行",
            subtitle:"壓力＋突破"
        }

    };

    const info =
        names[type];

    if(!info){
        return;
    }

    const seq =
        ++scanSeq;

    stopAutoRefresh();

    homeEl.classList.add(
        "hidden"
    );

    resultEl.classList.remove(
        "hidden"
    );

    resultEl.innerHTML = `

        <div class="card">

            <div class="section-title">
                <span>
                    ${escapeHTML(info.title)}
                </span>
                <small>
                    正在掃描
                </small>
            </div>

            <div class="loading">
                <div class="spinner"></div>
                正在取得市場資料...
            </div>

        </div>

    `;

    updateProgress(
        0,
        SCAN_CODES.length,
        "準備掃描..."
    );

    const rows =
        await scanPool(
            SCAN_CODES,
            (done,total,code)=>{

                if(seq!==scanSeq){
                    return;
                }

                updateProgress(
                    done,
                    total,
                    "正在分析 "+code
                );

            }
        );

    if(seq!==scanSeq){
        return;
    }

    let sorted =
        [...rows];

    sorted.sort(
        (a,b)=>{

            const sa =
                scanScore(
                    a,
                    type
                );

            const sb =
                scanScore(
                    b,
                    type
                );

            return sb-sa;

        }
    );

    sorted =
        sorted.slice(0,15);

    finishProgress(
        "掃描完成，共取得 "+rows.length+" 檔"
    );

    renderScanList(
        info.title,
        info.subtitle,
        sorted,
        type
    );

}


function scanScore(
    item,
    mode
){

    const t =
        item.technical;

    const inst =
        item.institution;

    const rt =
        item.realtime;

    if(mode==="recent"){

        return (
            t.trendScore+
            clamp(
                t.bias20*2,
                -20,
                20
            )+
            (t.nearHigh>95?15:0)
        );

    }

    if(mode==="long"){

        return (
            (t.longBull?45:20)+
            (rt.price>t.ma20?20:0)+
            (rt.price>t.ma60?20:0)+
            (inst.total20>0?20:0)
        );

    }

    if(mode==="popular"){

        return (
            t.volumeRatio*50+
            Math.max(
                0,
                t.bias5*2
            )
        );

    }

    if(mode==="institution"){

        return (
            50+
            (inst.total5>0?20:-10)+
            (inst.total20>0?30:-15)+
            (inst.f20>0?10:0)+
            (inst.t20>0?10:0)
        );

    }

    if(mode==="pressure"){

        return (
            (t.nearHigh>=97?35:10)+
            (t.breakout?35:0)+
            (
                t.breakout &&
                inst.total20>0
                    ?30
                    :0
            )
        );

    }

    return 0;

}

async function scanBreakout(){

    const seq =
        ++scanSeq;

    stopAutoRefresh();

    breakScanBtn.disabled=true;

    breakScanBtn.textContent =
        "⏳ 正在掃描突破...";

    updateProgress(
        0,
        SCAN_CODES.length,
        "準備突破掃描..."
    );

    const rows =
        await scanPool(
            SCAN_CODES,
            (done,total,code)=>{

                if(seq!==scanSeq){
                    return;
                }

                updateProgress(
                    done,
                    total,
                    "突破分析 "+code
                );

            }
        );

    if(seq!==scanSeq){
        return;
    }

    const filtered =
        rows
            .filter(item=>{

                const t =
                    item.technical;

                const inst =
                    item.institution;

                const condition1 =
                    t.nearHigh>=96;

                const condition2 =
                    t.price>t.ma20;

                const condition3 =
                    t.ma5Slope>=0;

                const condition4 =
                    t.volumeRatio>=0.8;

                return (
                    condition1 &&
                    condition2 &&
                    condition3 &&
                    condition4
                );

            })
            .sort(
                (a,b)=>
                    scanScore(
                        b,
                        "pressure"
                    )-
                    scanScore(
                        a,
                        "pressure"
                    )
            )
            .slice(0,20);

    finishProgress(
        "突破掃描完成"
    );

    breakScanBtn.disabled=false;

    breakScanBtn.textContent =
        "🚀 掃描目前市場突破機會";

    renderScanList(
        "🚀 市場突破機會",
        "接近高點＋均線＋量價",
        filtered,
        "pressure"
    );

}

            ()=>{

                const action =
                    btn.dataset.action;

                if(action==="analysis"){

                    showAnalysisPanel();

                }else{

                    scanCategory(
                        action
                    );

                }

            }
        );

    });


/* =========================================================
   突破掃描
   ========================================================= */

breakScanBtn
    .addEventListener(
        "click",
        ()=>scanBreakout()
    );


/* =========================================================
   搜尋按鈕
   ========================================================= */

searchBtn
    .addEventListener(
        "click",
        ()=>searchStock()
    );


/* =========================================================
   Enter搜尋
   ========================================================= */

searchInput
    .addEventListener(
        "keydown",
        event=>{

            if(event.key==="Enter"){

                event.preventDefault();

                searchStock();

            }

        }
    );


/* =========================================================
   即時搜尋候選
   ========================================================= */

searchInput
    .addEventListener(
        "input",
        ()=>{

            clearTimeout(
                searchDebounce
            );

            searchDebounce =
                setTimeout(
                    ()=>showSearchCandidates(),
                    350
                );

        }
    );


/* =========================================================
   初始
   ========================================================= */

(function init(){

    setMarketState();

    /*
     * 如果網址帶 ?code=2330，
     * 自動搜尋。
     */
    try{

        const params =
            new URLSearchParams(
                location.search
            );

        const code =
            params.get("code");

        if(code){

            searchInput.value =
                code;

            setTimeout(
                ()=>searchStock(),
                300
            );

        }

    }catch(error){

        console.warn(
            "init url failed",
            error
        );

    }

})();


/* =========================================================
   頁面離開
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            document.hidden
        ){

            stopAutoRefresh();

        }else if(
            currentStock &&
            autoRefreshEnabled
        ){

            startAutoRefresh();

        }

    }
);


/* =========================================================
   防止 API 掃描過度
   ========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{
        stopAutoRefresh();
    }
);


/* =========================================================
   Debug
   ========================================================= */

window.V31 = {

    version:"31.1",

    cache:API_CACHE,

    clearCache:
        clearMemoryCache,

    search:
        searchStock,

    scan:
        scanCategory,

    breakout:
        scanBreakout,

    watchlist:
        getWatchlist

};


/* =========================================================
   END
   ========================================================= */

</script>

</body>
</html>

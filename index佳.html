<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數字易經｜進階測試版 V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:960px;margin:auto;padding:12px}
.header{background:linear-gradient(135deg,#171717,#383838);color:#fff;border-radius:18px;padding:22px 16px;text-align:center}
.header h1{margin:0;font-size:25px}.header p{margin:8px 0 0;font-size:14px;opacity:.86}
.card{background:#fff;border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 2px 12px #0001}
h2{font-size:19px;margin:0 0 13px}
label{display:block;font-weight:700;margin:10px 0 6px}
input,textarea,button{width:100%;border-radius:11px;font-size:16px;padding:12px}
input,textarea{border:1px solid #ccc;background:#fff}
textarea{min-height:80px}
button{border:0;background:#171717;color:#fff;font-weight:700;margin-top:9px}
.secondary{background:#e9e9e9;color:#222}
.danger{background:#f1e1e1;color:#8b1111}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.result{font-size:26px;font-weight:800;text-align:center;letter-spacing:2px;border:2px solid #222;border-radius:13px;padding:16px;word-break:break-all}
.pairs{display:flex;flex-wrap:wrap;gap:7px}
.pair{min-width:67px;padding:9px 7px;border-radius:9px;text-align:center;font-weight:800}
.pair small{display:block;font-size:11px;margin-top:3px;font-weight:500}
.good{background:#e4f5e8;color:#17652a}.bad{background:#fde6e6;color:#9a1c1c}.neutral{background:#eee;color:#555}
.analysis{line-height:1.7}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;margin:3px;font-size:13px;font-weight:700}
.tag.good{background:#e4f5e8}.tag.bad{background:#fde6e6}
.alert{border-left:5px solid #222;background:#f7f7f7;padding:11px;border-radius:8px;line-height:1.65;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:620px}
.tablewrap{overflow-x:auto}
th,td{border:1px solid #ddd;padding:9px;text-align:center}th{background:#222;color:#fff}
.small{font-size:13px;color:#666;line-height:1.65}

name: Update Bingo Bingo Data

on: 
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
 
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Bingo data
        shell: bash
        run: |
          set -e

          API="https://lottery.timetable.tw/api/draws"
          : > pages.ndjson

          for offset in $(seq 0 500 9500); do
            echo "Downloading offset $offset"

            curl -fsSL --retry 3 \
              "$API?gameTypeId=10&limit=500&offset=$offset&sortOrder=DESC" \
              | jq -c '.records // [] | .[]' >> pages.ndjson
          done

          jq -s '
            map(.[])
            | unique_by(.period)
            | sort_by(.period | tonumber)
            | reverse
            | .[0:10000]
          ' pages.ndjson > records.json

          jq '
            {
              gameType: "Bingo Bingo",
              gameTypeId: 10,
              updatedAt: (now | todate),
              count: length,
              records: .
            }
          ' records.json > bingo-data.json

          rm -f pages.ndjson records.json

      - name: Commit bingo-data.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bingo-data.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Bingo Bingo data"
            git push
          fi

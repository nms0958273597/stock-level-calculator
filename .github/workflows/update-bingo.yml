name: Update Bingo Bingo Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-bingo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download Bingo Bingo history
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request

          API = "https://lottery.timetable.tw/api/draws"
          GAME_TYPE_ID = 10
          PAGE_SIZE = 500
          MAX_RECORDS = 10000
          OUTPUT_FILE = "bingo-data.json"

          def get_json(offset):
              params = {
                  "gameTypeId": GAME_TYPE_ID,
                  "limit": PAGE_SIZE,
                  "offset": offset,
                  "sortOrder": "DESC"
              }

              url = API + "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def normalize_date(value):
              if not value:
                  return ""

              text = str(value)

              if "T" in text:
                  text = text.split("T")[0]

              if " " in text:
                  text = text.split(" ")[0]

              text = text.replace("/", "-")

              parts = text.split("-")

              if len(parts) >= 3:
                  return (
                      parts[0].zfill(4)
                      + "-"
                      + parts[1].zfill(2)
                      + "-"
                      + parts[2].zfill(2)
                  )

              return ""

          def normalize_numbers(value):
              if isinstance(value, list):
                  source = value

              elif isinstance(value, str):
                  text = (
                      value
                      .replace("[", "")
                      .replace("]", "")
                      .replace(",", " ")
                      .replace("，", " ")
                      .replace("、", " ")
                  )
                  source = text.split()

              else:
                  source = []

              numbers = []

              for item in source:
                  try:
                      number = int(item)

                      if 1 <= number <= 80:
                          numbers.append(number)

                  except Exception:
                      pass

              return sorted(set(numbers))

          def normalize_record(raw):
              if not isinstance(raw, dict):
                  return None

              period = (
                  raw.get("period")
                  or raw.get("periodNo")
                  or raw.get("issue")
                  or raw.get("draw_no")
                  or ""
              )

              draw_date = (
                  raw.get("draw_date")
                  or raw.get("drawDate")
                  or raw.get("date")
                  or ""
              )

              numbers = (
                  raw.get("numbers")
                  or raw.get("draw_numbers")
                  or raw.get("result")
                  or []
              )

              date = normalize_date(draw_date)
              numbers = normalize_numbers(numbers)

              if not period:
                  return None

              if not date:
                  return None

              if len(numbers) != 20:
                  return None

              try:
                  period_num = int(period)
              except Exception:
                  period_num = 0

              return {
                  "period": str(period),
                  "periodNum": period_num,
                  "date": date,
                  "numbers": numbers
              }

          all_records = []

          for offset in range(
              0,
              MAX_RECORDS,
              PAGE_SIZE
          ):
              print(
                  "Downloading offset:",
                  offset
              )

              try:
                  data = get_json(offset)

              except Exception as error:
                  print(
                      "API error:",
                      error
                  )
                  sys.exit(1)

              if isinstance(data, dict):
                  raw_records = (
                      data.get("records")
                      or data.get("data")
                      or data.get("results")
                      or []
                  )

                  total_count = (
                      data.get("totalCount")
                      or data.get("total")
                      or 0
                  )

              elif isinstance(data, list):
                  raw_records = data
                  total_count = 0

              else:
                  raw_records = []
                  total_count = 0

              valid_records = []

              for raw in raw_records:
                  record = normalize_record(raw)

                  if record:
                      valid_records.append(record)

              all_records.extend(valid_records)

              print(
                  "Valid records:",
                  len(valid_records)
              )

              print(
                  "Total collected:",
                  len(all_records)
              )

              if len(raw_records) < PAGE_SIZE:
                  break

              if (
                  total_count
                  and
                  offset + len(raw_records) >= total_count
              ):
                  break

              time.sleep(0.2)

          if not all_records:
              print("No Bingo Bingo data found.")
              sys.exit(1)

          unique = {}

          for record in all_records:
              key = (
                  record["date"]
                  + "_"
                  + record["period"]
              )

              unique[key] = record

          records = list(unique.values())

          records.sort(
              key=lambda item: (
                  item["date"],
                  item["periodNum"]
              ),
              reverse=True
          )

          records = records[:MAX_RECORDS]

          by_date = {}

          for record in records:
              by_date.setdefault(
                  record["date"],
                  []
              ).append(record)

          for date, day_records in by_date.items():

              day_records.sort(
                  key=lambda item: item["periodNum"]
              )

              for index, record in enumerate(
                  day_records
              ):

                  total_minutes = (
                      7 * 60
                      + 5
                      + index * 5
                  )

                  hour = total_minutes // 60
                  minute = total_minutes % 60

                  record["time"] = (
                      f"{hour:02d}:{minute:02d}"
                  )

          records.sort(
              key=lambda item: (
                  item["periodNum"],
                  item["date"]
              ),
              reverse=True
          )

          output = {
              "gameType": "Bingo Bingo",
              "gameTypeId": GAME_TYPE_ID,
              "updatedAt": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime()
              ),
              "count": len(records),
              "records": records
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Finished.",
              len(records),
              "records saved."
          )
          PY

      - name: Verify data
        run: |
          python - <<'PY'
          import json

          with open(
              "bingo-data.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          records = data.get("records", [])

          print(
              "Records:",
              len(records)
          )

          if not records:
              raise SystemExit(
                  "bingo-data.json is empty"
              )

          print(
              "Latest period:",
              records[0].get("period")
          )

          print(
              "Latest date:",
              records[0].get("date")
          )

          print(
              "Latest time:",
              records[0].get("time")
          )
          PY

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bingo-data.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Bingo Bingo history"
            git push
          fi


async function updateData(){

  if(updating){
    return;
  }

  updating = true;

  $("updateBtn").disabled = true;

  setStatus(
    "🟡 正在讀取最新資料...",
    "warn"
  );

  setProgress(20);

  try{

    const response =
      await fetch(
        DATA_URL +
        "?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status +
        "｜bingo-data.json 尚未建立"
      );

    }

    setProgress(60);

    const json =
      await response.json();

    const records =
      json.records || [];

    const normalized =
      records
      .map(normalizeRecord)
      .filter(Boolean);

    if(!normalized.length){

      throw new Error(
        "bingo-data.json 沒有有效資料"
      );

    }

    draws =
      mergeData(
        [],
        normalized
      );

    saveData();

    setProgress(100);

    setStatus(
      "🟢 資料更新成功",
      "ok"
    );

    $("updateStatus").textContent =
      "更新時間：" +
      new Date().toLocaleString(
        "zh-TW"
      );

    renderAll();

  }catch(error){

    console.error(error);

    setStatus(
      "🔴 更新失敗：" +
      error.message,
      "err"
    );

    if(draws.length){

      $("updateStatus").textContent =
        "目前使用手機保存資料";

      renderAll();

    }

  }finally{

    updating = false;

    $("updateBtn").disabled = false;

    setTimeout(
      ()=>{
        setProgress(0);
      },
      800
    );

  }

}

name: Update Bingo Bingo Data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:

  update-bingo:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download Bingo Bingo history
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request

          API = "https://lottery.timetable.tw/api/draws"

          GAME_TYPE_ID = 10
          PAGE_SIZE = 500
          MAX_RECORDS = 10000

          output_file = "bingo-data.json"

          def request_json(offset):
              params = {
                  "gameTypeId": GAME_TYPE_ID,
                  "limit": PAGE_SIZE,
                  "offset": offset,
                  "sortOrder": "DESC"
              }

              url = API + "?" + urllib.parse.urlencode(params)

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def normalize_date(value):

              if not value:
                  return ""

              s = str(value)

              if "T" in s:
                  s = s.split("T")[0]

              if " " in s:
                  s = s.split(" ")[0]

              s = s.replace("/", "-")

              parts = s.split("-")

              if len(parts) >= 3:

                  return (
                      parts[0].zfill(4)
                      + "-"
                      + parts[1].zfill(2)
                      + "-"
                      + parts[2].zfill(2)
                  )

              return ""

          def normalize_numbers(value):

              if isinstance(value, list):
                  arr = value

              elif isinstance(value, str):

                  text = (
                      value
                      .replace("[", "")
                      .replace("]", "")
                      .replace(",", " ")
                      .replace("，", " ")
                      .replace("、", " ")
                  )

                  arr = text.split()

              else:
                  arr = []

              result = []

              for x in arr:

                  try:
                      n = int(x)

                      if 1 <= n <= 80:
                          result.append(n)

                  except:
                      pass

              result = sorted(set(result))

              return result

          def normalize_record(raw):

              if not isinstance(raw, dict):
                  return None

              period = (
                  raw.get("period")
                  or raw.get("periodNo")
                  or raw.get("issue")
                  or raw.get("draw_no")
                  or ""
              )

              date = normalize_date(
                  raw.get("draw_date")
                  or raw.get("drawDate")
                  or raw.get("date")
                  or ""
              )

              numbers = normalize_numbers(
                  raw.get("numbers")
                  or raw.get("draw_numbers")
                  or raw.get("result")
                  or []
              )

              if not period:
                  return None

              if not date:
                  return None

              if len(numbers) != 20:
                  return None

              try:
                  period_num = int(period)
              except:
                  period_num = 0

              return {
                  "period": str(period),
                  "periodNum": period_num,
                  "date": date,
                  "numbers": numbers
              }

          all_records = []

          print("開始下載 Bingo Bingo 歷史資料...")

          for offset in range(
              0,
              MAX_RECORDS,
              PAGE_SIZE
          ):

              print(
                  "下載 offset =",
                  offset
              )

              try:

                  data = request_json(offset)

              except Exception as e:

                  print(
                      "API 下載失敗：",
                      e
                  )

                  sys.exit(1)

              if isinstance(data, list):

                  records = data
                  total_count = None

              elif isinstance(data, dict):

                  records = (
                      data.get("records")
                      or data.get("data")
                      or data.get("results")
                      or []
                  )

                  total_count = (
                      data.get("totalCount")
                      or data.get("total")
                  )

              else:

                  records = []
                  total_count = None

              if not isinstance(records, list):
                  records = []

              normalized = []

              for raw in records:

                  item = normalize_record(raw)

                  if item:
                      normalized.append(item)

              all_records.extend(normalized)

              print(
                  "本頁有效資料：",
                  len(normalized)
              )

              print(
                  "目前累計：",
                  len(all_records)
              )

              if len(records) < PAGE_SIZE:
                  break

              if (
                  total_count
                  and
                  offset + len(records) >= total_count
              ):
                  break

              time.sleep(0.2)

          if not all_records:

              print("沒有取得有效 Bingo Bingo 資料")
              sys.exit(1)

          # 去除重複期數
          unique = {}

          for item in all_records:

              key = (
                  item["date"]
                  + "_"
                  + item["period"]
              )

              unique[key] = item

          records = list(unique.values())

          # 依日期及期數排序
          records.sort(
              key=lambda x: (
                  x["date"],
                  x["periodNum"]
              ),
              reverse=True
          )

          # 最多保存 10000 期
          records = records[:MAX_RECORDS]

          # 每天依期數重新計算時間
          by_date = {}

          for item in records:

              by_date.setdefault(
                  item["date"],
                  []
              ).append(item)

          for date, items in by_date.items():

              items.sort(
                  key=lambda x: x["periodNum"]
              )

              for index, item in enumerate(items):

                  total_minutes = (
                      7 * 60
                      + 5
                      + index * 5
                  )

                  hour = total_minutes // 60
                  minute = total_minutes % 60

                  item["time"] = (
                      f"{hour:02d}:"
                      f"{minute:02d}"
                  )

          # 再次按照最新期數排序
          records.sort(
              key=lambda x: (
                  x["periodNum"],
                  x["date"]
              ),
              reverse=True
          )

          # 產生 JSON
          output = {
              "gameType": "Bingo Bingo",
              "gameTypeId": 10,
              "updatedAt": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime()
              ),
              "count": len(records),
              "records": records
          }

          with open(
              output_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print("Bingo Bingo 資料更新完成")
          print("有效期數：", len(records))
          print("================================")

          PY

      - name: Check generated data
        run: |
          test -f bingo-data.json
          python - <<'PY'
          import json

          with open(
              "bingo-data.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          records = data.get("records", [])


                              )
                          ),

                      "dealer":
                          clean(
                              item.get(
                                  "dealerBalance"
                              )
                          )
                  })

                  if len(rows) >= limit:
                      break

              return rows

          def average(values):
              valid = [
                  value
                  for value in values
                  if value is not None
              ]

              if not valid:
                  return None

              return (
                  sum(valid) /
                  len(valid)
              )

          for code, item in latest.items():

              rows = get_history_rows(
                  code,
                  242
              )

              prices = [
                  row["price"]
                  for row in rows
              ]

              for period, field in [
                  (5, "ma5"),
                  (11, "ma11"),
                  (31, "ma31"),
                  (62, "ma62"),
                  (122, "ma122"),
                  (242, "ma242")
              ]:

                  if len(prices) >= period:
                      ma = average(
                          prices[:period]
                      )

                      if ma is not None:
                          item[field] = round(
                              ma,
                              4
                          )

                          price = item.get(
                              "price"
                          )

                          if (
                              price is not None
                              and ma != 0
                          ):
                              deviation = (
                                  (
                                      price -
                                      ma
                                  )
                                  / ma
                                  * 100
                              )

                              item[
                                  field +
                                  "Deviation"
                              ] = round(
                                  deviation,
                                  2
                              )

              for period, field in [
                  (5, "foreign5"),
                  (11, "foreign11"),
                  (31, "foreign31")
              ]:

                  values = [
                      row["foreign"]
                      for row in rows[:period]
                      if row["foreign"]
                      is not None
                  ]

                  if len(values) == period:

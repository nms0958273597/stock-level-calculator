name: Update Latest Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * 1-5"

permissions:
  contents: write

jobs:
  update-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Python Syntax Check
        run: |
          python - <<'PY'
          import ast
          import pathlib

          p = pathlib.Path(
              ".github/workflows/update-latest.yml"
          ).read_text(
              encoding="utf-8"
          )

          marker = (
              "      - name: "
              "Update latest.json and history"
          )

          if marker not in p:
              raise SystemExit(
                  "找不到主要更新程式"
              )

          target = p.split(
              marker,
              1
          )[1]

          start = target.find(
              "          python <<'PY'"
          )

          if start < 0:
              raise SystemExit(
                  "找不到主要 Python 程式"
              )

          start = target.find(
              "\n",
              start
          ) + 1

          end = target.find(
              "\n          PY",
              start
          )

          if end < 0:
              raise SystemExit(
                  "找不到 Python 程式結尾"
              )

          code = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in target[
                  start:end
              ].splitlines()
          )

          ast.parse(code)

          print(
              "OK：主要 Python 語法檢查通過"
          )
          PY

      - name: Update latest.json and history
        run: |
          python - <<'PY'
          import json
          import os
          import requests

          from datetime import (
              datetime,
              timezone,
              timedelta
          )

          STOCK_FILE = (
              "stock-data/stocks.json"
          )

          LATEST_FILE = (
              "stock-data/latest.json"
          )

          HISTORY_DIR = (
              "stock-data/history"
          )

          TZ = timezone(
              timedelta(hours=8)
          )

          HEADERS = {
              "User-Agent":
                  "Mozilla/5.0 GitHub Actions Stock Updater",
              "Accept":
                  "application/json,text/plain,*/*"
          }

          os.makedirs(
              HISTORY_DIR,
              exist_ok=True
          )

          def clean(value):
              if value is None:
                  return None

              s = str(value).strip()

              s = s.replace(
                  ",",
                  ""
              )

              if s in (
                  "",
                  "-",
                  "--",
                  "—",
                  "N/A",
                  "null",
                  "None"
              ):
                  return None

              try:
                  if "." in s:
                      return float(s)

                  return int(s)

              except Exception:
                  return None

          def get_json(
              url,
              params=None
          ):
              r = requests.get(
                  url,
                  params=params,
                  headers=HEADERS,
                  timeout=40
              )

              r.raise_for_status()

              return r.json()

          def first(
              row,
              names
          ):
              if not isinstance(
                  row,
                  dict
              ):
                  return None

              for name in names:
                  if name in row:
                      value = row.get(
                          name
                      )

                      if value not in (
                          None,
                          "",
                          "-",
                          "--",
                          "—"
                      ):
                          return value

              return None

          def normalize_date(
              value
          ):
              if not value:
                  return None

              s = str(value).strip()

              if (
                  len(s) == 7
                  and s.isdigit()
              ):
                  return (
                      f"{int(s[:3]) + 1911}-"
                      f"{s[3:5]}-"
                      f"{s[5:7]}"
                  )

              if (
                  len(s) == 8
                  and s.isdigit()
              ):
                  return (
                      f"{s[:4]}-"
                      f"{s[4:6]}-"
                      f"{s[6:8]}"
                  )

              if "/" in s:
                  a = s.split("/")

                  if len(a) == 3:
                      try:
                          year = int(a[0])

                          if year < 1911:
                              year += 1911

                          return (
                              f"{year:04d}-"
                              f"{int(a[1]):02d}-"
                              f"{int(a[2]):02d}"
                          )

                      except Exception:
                          pass

              return s

          def weekdays(
              count=10
          ):
              result = []

              today = datetime.now(
                  TZ
              ).date()

              for i in range(30):
                  day = (
                      today -
                      timedelta(days=i)
                  )

                  if day.weekday() < 5:
                      result.append(
                          day.strftime(
                              "%Y%m%d"
                          )
                      )

                      if len(result) >= count:
                          break

              return result

          def load(path):
              try:
                  with open(
                      path,
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)

              except Exception:
                  return {}

          def save(
              path,
              data
          ):
              os.makedirs(
                  os.path.dirname(path)
                  or ".",
                  exist_ok=True
              )

              tmp = (
                  path +
                  ".tmp"
              )

              with open(
                  tmp,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  tmp,
                  path
              )

          print(
              "開始更新最新股票資料"
          )

          master = load(
              STOCK_FILE
          )

          if isinstance(
              master,
              dict
          ):
              stocks = (
                  master.get("data")
                  or master.get("stocks")
                  or []
              )

          else:
              stocks = master

          info = {}

          for item in stocks:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              code = str(
                  item.get(
                      "code",
                      ""
                  )
              ).strip()

              if not code:
                  continue

              info[code] = {
                  "code": code,
                  "name": item.get(
                      "name",
                      ""
                  ),
                  "fullName": item.get(
                      "fullName",
                      ""
                  ),
                  "market": item.get(
                      "market",
                      ""
                  ),
                  "type": item.get(
                      "type",
                      ""
                  ),
                  "industry": item.get(
                      "industry",
                      ""
                  ),
                  "keywords": item.get(
                      "keywords",
                      []
                  )
              }

          print(
              "搜尋資料庫：",
              len(info),
              "檔"
          )

          latest = {}

          # ==========================================================
          # TWSE
          # ==========================================================

          twse_url = (
              "https://www.twse.com.tw/"
              "rwd/zh/afterTrading/MI_INDEX"
          )

          twse_date = None
          twse_fields = []
          twse_rows = []

          for ds in weekdays():

              try:
                  data = get_json(
                      twse_url,
                      {
                          "response": "json",
                          "date": ds,
                          "type": "ALLBUT0999"
                      }
                  )

                  if (
                      data.get("stat") == "OK"
                      and data.get("fields9")
                      and data.get("data9")
                  ):
                      twse_fields = (
                          data["fields9"]
                      )

                      twse_rows = (
                          data["data9"]
                      )

                      twse_date = normalize_date(
                          data.get("date")
                          or ds
                      )

                      print(
                          "TWSE 最新交易日：",
                          twse_date
                      )

                      break

              except Exception as e:
                  print(
                      "TWSE 失敗：",
                      ds,
                      repr(e)
                  )

          if not twse_rows:
              raise SystemExit(
                  "TWSE 無法取得最新行情"
              )

          twse_index = {
              str(v).strip(): i
              for i, v in enumerate(
                  twse_fields
              )
          }

          def twse(
              row,
              names
          ):
              for name in names:
                  i = twse_index.get(
                      name
                  )

                  if (
                      i is not None
                      and i < len(row)
                  ):
                      return clean(
                          row[i]
                      )

              return None

          for row in twse_rows:

              if not isinstance(
                  row,
                  list
              ):
                  continue

              code = str(
                  twse(
                      row,
                      ["證券代號"]
                  )
                  or ""
              ).strip()

              if code not in info:
                  continue

              close = twse(
                  row,
                  ["收盤價"]
              )

              change = twse(
                  row,
                  ["漲跌價差"]
              )

              prev = (
                  close - change
                  if close is not None
                  and change is not None
                  else None
              )

              pct = (
                  change / prev * 100
                  if prev not in (
                      None,
                      0
                  )
                  and change is not None
                  else None
              )

              latest[code] = {
                  **info[code],

                  "price": close,
                  "prev": prev,

                  "open": twse(
                      row,
                      ["開盤價"]
                  ),

                  "high": twse(
                      row,
                      ["最高價"]
                  ),

                  "low": twse(
                      row,
                      ["最低價"]
                  ),

                  "change": change,
                  "changePct": pct,

                  "volume": twse(
                      row,
                      ["成交股數"]
                  ),

                  "amount": twse(
                      row,
                      ["成交金額"]
                  ),

                  "transactions": twse(
                      row,
                      ["成交筆數"]
                  ),

                  "bid": twse(
                      row,
                      ["最後揭示買價"]
                  ),

                  "bidVolume": twse(
                      row,
                      ["最後揭示買量"]
                  ),

                  "ask": twse(
                      row,
                      ["最後揭示賣價"]
                  ),

                  "askVolume": twse(
                      row,
                      ["最後揭示賣量"]
                  ),

                  "tradeDate":
                      twse_date,

                  "source":
                      "TWSE",

                  "updatedAt":
                      datetime.now(
                          TZ
                      ).isoformat()
              }

          print(
              "TWSE 行情：",
              sum(
                  1
                  for x in latest.values()
                  if x["source"] == "TWSE"
              ),
              "檔"
          )

          # ==========================================================
          # TPEx
          # ==========================================================

          tpex_url = (
              "https://www.tpex.org.tw/"
              "openapi/v1/"
              "tpex_mainboard_daily_close_quotes"
          )

          try:
              tpex_data = get_json(
                  tpex_url
              )

          except Exception as e:
              tpex_data = []
              print(
                  "TPEx 失敗：",
                  repr(e)
              )

          if isinstance(
              tpex_data,
              dict
          ):
              tpex_rows = (
                  tpex_data.get("data")
                  or tpex_data.get("aaData")
                  or []
              )

          else:
              tpex_rows = tpex_data

          for row in tpex_rows:

              if not isinstance(
                  row,
                  dict
              ):
                  continue

              code = str(
                  first(
                      row,
                      [
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號"
                      ]
                  )
                  or ""
              ).strip()

              if code not in info:
                  continue

              close = clean(
                  first(
                      row,
                      [
                          "Close",
                          "ClosingPrice",
                          "成交價",
                          "收盤"
                      ]
                  )
              )

              change = clean(
                  first(
                      row,
                      [
                          "Change",
                          "漲跌",
                          "漲跌價差"
                      ]
                  )
              )

              prev = (
                  close - change
                  if close is not None
                  and change is not None
                  else None
              )

              pct = (
                  change / prev * 100
                  if prev not in (
                      None,
                      0
                  )
                  and change is not None
                  else None
              )

              latest[code] = {
                  **info[code],

                  "price": close,
                  "prev": prev,

                  "open": clean(
                      first(
                          row,
                          [
                              "Open",
                              "OpeningPrice",
                              "開盤"
                          ]
                      )
                  ),

                  "high": clean(
                      first(
                          row,
                          [
                              "High",
                              "HighestPrice",
                              "最高"
                          ]
                      )
                  ),

                  "low": clean(
                      first(
                          row,
                          [
                              "Low",
                              "LowestPrice",
                              "最低"
                          ]
                      )
                  ),

                  "change": change,
                  "changePct": pct,

                  "volume": clean(
                      first(
                          row,
                          [
                              "TradingShares",
                              "TradeVolume",
                              "成交量",
                              "Volume"
                          ]
                      )
                  ),

                  "amount": clean(
                      first(
                          row,
                          [
                              "Turnover",
                              "TradeValue",
                              "成交金額",
                              "Amount"
                          ]
                      )
                  ),

                  "bid": clean(
                      first(
                          row,
                          [
                              "BestBidPrice",
                              "BestBid",
                              "最後揭示買價"
                          ]
                      )
                  ),

                  "ask": clean(
                      first(
                          row,
                          [
                              "BestAskPrice",
                              "BestAsk",
                              "最後揭示賣價"
                          ]
                      )
                  ),

                  "tradeDate":
                      normalize_date(
                          first(
                              row,
                              [
                                  "Date",
                                  "日期",
                                  "交易日期"
                              ]
                          )
                      ),

                  "source":
                      "TPEx",

                  "updatedAt":
                      datetime.now(
                          TZ
                      ).isoformat()
              }

          print(
              "TPEx 行情：",
              sum(
                  1
                  for x in latest.values()
                  if x["source"] == "TPEx"
              ),
              "檔"
          )

          # ==========================================================
          # TWSE 三大法人
          # ==========================================================

          institution_url = (
              "https://www.twse.com.tw/"
              "rwd/zh/fund/T86"
          )

          inst_rows = []
          inst_fields = []
          inst_date = None

          candidates = []

          if twse_date:
              candidates.append(
                  twse_date.replace(
                      "-",
                      ""
                  )
              )

          candidates += [
              x
              for x in weekdays()
              if x not in candidates
          ]

          for ds in candidates:

              try:
                  data = get_json(
                      institution_url,
                      {
                          "response": "json",
                          "date": ds,
                          "selectType":
                              "ALLBUT0999"
                      }
                  )

                  if (
                      data.get("stat") == "OK"
                      and data.get("data")
                      and data.get("fields")
                  ):
                      inst_rows = (
                          data["data"]
                      )

                      inst_fields = (
                          data["fields"]
                      )

                      inst_date = ds

                      break

              except Exception as e:
                  print(
                      "法人失敗：",
                      ds,
                      repr(e)
                  )

          inst_index = {
              str(v).strip(): i
              for i, v in enumerate(
                  inst_fields
              )
          }

          def inst(
              row,
              names
          ):
              for name in names:
                  i = inst_index.get(
                      name
                  )

                  if (
                      i is not None
                      and i < len(row)
                  ):
                      return clean(
                          row[i]
                      )

              return None

          for row in inst_rows:

              if not isinstance(
                  row,
                  list
              ):
                  continue

              code = str(
                  inst(
                      row,
                      ["證券代號"]
                  )
                  or ""
              ).strip()

              if code not in latest:
                  continue

              latest[code].update({
                  "foreignBuy":
                      inst(
                          row,
                          [
                              "外陸資買進股數(不含外資自營商)"
                          ]
                      ),

                  "foreignSell":
                      inst(
                          row,
                          [
                              "外陸資賣出股數(不含外資自營商)"
                          ]
                      ),

                  "foreignBalance":
                      inst(
                          row,
                          [
                              "外陸資買賣超股數(不含外資自營商)"
                          ]
                      ),

                  "trustBuy":
                      inst(
                          row,
                          [
                              "投信買進股數"
                          ]
                      ),

                  "trustSell":
                      inst(
                          row,
                          [
                              "投信賣出股數"
                          ]
                      ),

                  "trustBalance":
                      inst(
                          row,
                          [
                              "投信買賣超股數"
                          ]
                      ),

                  "dealerBuy":
                      inst(
                          row,
                          [
                              "自營商買進股數"
                          ]
                      ),

                  "dealerSell":
                      inst(
                          row,
                          [
                              "自營商賣出股數"
                          ]
                      ),

                  "dealerBalance":
                      inst(
                          row,
                          [
                              "自營商買賣超股數"
                          ]
                      ),

                  "institutionTotal":
                      inst(
                          row,
                          [
                              "三大法人買賣超股數"
                          ]
                      ),

                  "institutionDate":
                      normalize_date(
                          inst_date
                      ),

                  "institutionSource":
                      "TWSE T86"
              })

          # ==========================================================
          # PE / 殖利率 / PBR
          # ==========================================================

          try:
              rows = get_json(
                  "https://openapi.twse.com.tw/"
                  "v1/exchangeReport/BWIBBU_ALL"
              )

              if isinstance(
                  rows,
                  list
              ):

                  for row in rows:

                      code = str(
                          first(
                              row,
                              [
                                  "Code",
                                  "證券代號"
                              ]
                          )
                          or ""
                      ).strip()

                      if code not in latest:
                          continue

                      latest[code].update({
                          "pe":
                              clean(
                                  first(
                                      row,
                                      [
                                          "PEratio",
                                          "本益比"
                                      ]
                                  )
                              ),

                          "yield":
                              clean(
                                  first(
                                      row,
                                      [
                                          "DividendYield",
                                          "殖利率"
                                      ]
                                  )
                              ),

                          "pbr":
                              clean(
                                  first(
                                      row,
                                      [
                                          "PBratio",
                                          "股價淨值比"
                                      ]
                                  )
                              )
                      })

          except Exception as e:
              print(
                  "PE/PBR 失敗：",
                  repr(e)
              )

          # ==========================================================
          # 儲存今日歷史
          # ==========================================================

          if twse_date:

              path = os.path.join(
                  HISTORY_DIR,
                  twse_date + ".json"
              )

              history = {
                  "_meta": {
                      "date":
                          twse_date,

                      "updatedAt":
                          datetime.now(
                              TZ
                          ).isoformat(),

                      "source":
                          "TWSE official + TPEx official"
                  }
              }

              fields = [
                  "code",
                  "name",
                  "market",
                  "type",
                  "price",
                  "prev",
                  "open",
                  "high",
                  "low",
                  "change",
                  "changePct",
                  "volume",
                  "amount",
                  "bid",
                  "bidVolume",
                  "ask",
                  "askVolume",
                  "foreignBuy",
                  "foreignSell",
                  "foreignBalance",
                  "trustBuy",
                  "trustSell",
                  "trustBalance",
                  "dealerBuy",
                  "dealerSell",
                  "dealerBalance",
                  "institutionTotal",
                  "pe",
                  "yield",
                  "pbr"
              ]

              for code, item in latest.items():

                  if item.get(
                      "source"
                  ) != "TWSE":
                      continue

                  history[code] = {
                      key:
                          item.get(key)
                      for key in fields
                  }

              save(
                  path,
                  history
              )

          # ==========================================================
          # 讀取歷史
          # ==========================================================

          history_files = sorted(
              [
                  f
                  for f in os.listdir(
                      HISTORY_DIR
                  )
                  if (
                      f.endswith(".json")
                      and f[:4].isdigit()
                  )
              ],
              reverse=True
          )

          def history_rows(
              code
          ):
              result = []

              for filename in history_files[:242]:

                  data = load(
                      os.path.join(
                          HISTORY_DIR,
                          filename
                      )
                  )

                  item = data.get(
                      code
                  )

                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  price = clean(
                      item.get(
                          "price"
                      )
                  )

                  if price is None:
                      continue

                  result.append({
                      "price":
                          price,

                      "foreign":
                          clean(
                              item.get(
                                  "foreignBalance"
                              )
                          ),

                      "trust":
                          clean(
                              item.get(
                                  "trustBalance"
                              )
                          ),

                      "dealer":
                          clean(
                              item.get(
                                  "dealerBalance"
                              )
                          )
                  })

              return result

          def average(
              values
          ):
              return (
                  sum(values) /
                  len(values)
                  if values
                  else None
              )

          # ==========================================================
          # MA + 法人累計
          # ==========================================================

          for code, item in latest.items():

              rows = history_rows(
                  code
              )

              prices = [
                  r["price"]
                  for r in rows
              ]

              for period in (
                  5,
                  11,
                  31,
                  62,
                  122,
                  242
              ):

                  if len(prices) >= period:

                      ma = average(
                          prices[
                              :period
                          ]
                      )

                      field = (
                          "ma" +
                          str(period)
                      )

                      item[field] = round(
                          ma,
                          4
                      )

                      if (
                          item.get("price")
                          is not None
                          and ma
                      ):

                          item[
                              field +
                              "Deviation"
                          ] = round(
                              (
                                  (
                                      item["price"]
                                      - ma
                                  )
                                  / ma
                                  * 100
                              ),
                              2
                          )

              for who in (
                  "foreign",
                  "trust",
                  "dealer"
              ):

                  for period in (
                      5,
                      11,
                      31
                  ):

                      values = [
                          r[who]
                          for r in rows[
                              :period
                          ]
                          if r[who]
                          is not None
                      ]

                      field = (
                          who +
                          str(period)
                      )

                      item[field] = (
                          sum(values)
                          if len(values)
                          == period
                          else None
                      )

          # ==========================================================
          # 輸出 latest.json
          # ==========================================================

          dates = [
              item.get(
                  "tradeDate"
              )
              for item in latest.values()
              if item.get(
                  "tradeDate"
              )
          ]

          output = {
              "_meta": {
                  "updatedAt":
                      datetime.now(
                          TZ
                      ).isoformat(),

                  "count":
                      len(latest),

                  "tradeDate":
                      max(
                          dates
                      )
                      if dates
                      else twse_date,

                  "source": [
                      "TWSE official",
                      "TPEx official"
                  ],

                  "realtime":
                      False,

                  "historyDays":
                      len(history_files),

                  "note":
                      (

name: Update Latest Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * 1-5"

permissions:
  contents: write

jobs:
  update-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update latest.json and history
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone, timedelta

          import requests

          # ============================================================
          # 基本設定
          # ============================================================

          STOCK_FILE = "stock-data/stocks.json"
          LATEST_FILE = "stock-data/latest.json"
          HISTORY_DIR = "stock-data/history"

          TW_TZ = timezone(
              timedelta(hours=8)
          )

          HEADERS = {
              "User-Agent":
                  "Mozilla/5.0 GitHub Actions Stock Updater",
              "Accept":
                  "application/json,text/plain,*/*"
          }

          os.makedirs(
              HISTORY_DIR,
              exist_ok=True
          )

          # ============================================================
          # 重要股票／ETF
          # ============================================================

          CORE_QUOTE_CODES = [
              "1301",
              "1326",
              "2330"
          ]

          IMPORTANT_CODES = [
              "1301",
              "1326",
              "2330",
              "0050",
              "0056",
              "00631L",
              "00919",
              "00981A"
          ]

          # ============================================================
          # 工具函式
          # ============================================================

          def clean(value):

              if value is None:
                  return None

              s = str(
                  value
              ).strip()

              if s in (
                  "",
                  "-",
                  "--",
                  "—",
                  "N/A",
                  "n/a",
                  "null",
                  "None",
                  "NaN"
              ):
                  return None

              # 清除 HTML 標籤
              s = re.sub(
                  r"<[^>]+>",
                  "",
                  s
              )

              s = (
                  s.replace(
                      ",",
                      ""
                  )
                  .replace(
                      "\u3000",
                      ""
                  )
                  .strip()
              )

              if s in (
                  "",
                  "-",
                  "--",
                  "—",
                  "N/A",
                  "n/a",
                  "null",
                  "None",
                  "NaN"
              ):
                  return None

              # 去除可能存在的空白
              s = s.replace(
                  " ",
                  ""
              )

              try:

                  if "." in s:
                      return float(s)

                  return int(s)

              except Exception:

                  # 有些官方欄位可能含有 + 號
                  try:

                      return float(
                          s.replace(
                              "+",
                              ""
                          )
                      )

                  except Exception:

                      return None

          def normalize_code(value):

              if value is None:
                  return ""

              s = str(
                  value
              ).strip()

              if not s:
                  return ""

              # 清除 HTML
              s = re.sub(
                  r"<[^>]+>",
                  "",
                  s
              ).strip()

              # 不把股票代號轉成 int，
              # 避免 0050 變成 50
              return s

          def request_json(
              url,
              params=None,
              timeout=40
          ):

              response = requests.get(
                  url,
                  params=params,
                  headers=HEADERS,
                  timeout=timeout
              )

              response.raise_for_status()

              return response.json()

          def first(
              row,
              keys
          ):

              if not isinstance(
                  row,
                  dict
              ):
                  return None

              for key in keys:

                  if key not in row:
                      continue

                  value = row.get(
                      key
                  )

                  if value not in (
                      None,
                      "",
                      "-",
                      "--",
                      "—"
                  ):
                      return value

              return None

          def normalize_date(
              value
          ):

              if value is None:
                  return None

              s = str(
                  value
              ).strip()

              if not s:
                  return None

              # 民國日期，例如 1150902
              if (
                  len(s) == 7
                  and s.isdigit()
              ):

                  return (
                      f"{int(s[:3]) + 1911}-"
                      f"{s[3:5]}-"
                      f"{s[5:7]}"
                  )

              # 西元日期，例如 20260902
              if (
                  len(s) == 8
                  and s.isdigit()
              ):

                  return (
                      f"{s[:4]}-"
                      f"{s[4:6]}-"
                      f"{s[6:8]}"
                  )

              # 115/09/02 或 2026/09/02
              if "/" in s:

                  parts = s.split(
                      "/"
                  )

                  if len(parts) == 3:

                      try:

                          year = int(
                              parts[0]
                          )

                          month = int(
                              parts[1]
                          )

                          day = int(
                              parts[2]
                          )

                          if year < 1911:
                              year += 1911

                          return (
                              f"{year:04d}-"
                              f"{month:02d}-"
                              f"{day:02d}"
                          )

                      except Exception:
                          pass

              # 115-09-02 或 2026-09-02
              if "-" in s:

                  parts = s.split(
                      "-"
                  )

                  if len(parts) == 3:

                      try:

                          year = int(
                              parts[0]
                          )

                          month = int(
                              parts[1]
                          )

                          day = int(
                              parts[2]
                          )

                          if year < 1911:
                              year += 1911

                          return (
                              f"{year:04d}-"
                              f"{month:02d}-"
                              f"{day:02d}"
                          )

                      except Exception:
                          pass

              return s

          def recent_weekdays(
              days=300
          ):

              result = []

              today = datetime.now(
                  TW_TZ
              ).date()

              for offset in range(
                  days
              ):

                  day = (
                      today
                      -
                      timedelta(
                          days=offset
                      )
                  )

                  if day.weekday() < 5:

                      result.append(
                          day.strftime(
                              "%Y%m%d"
                          )
                      )

              return result

          def load_json(
              path
          ):

              if not os.path.exists(
                  path
              ):
                  return {}

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as file:

                      return json.load(
                          file
                      )

              except Exception:

                  return {}

          def save_json(
              path,
              data
          ):

              directory = os.path.dirname(
                  path
              )

              if directory:

                  os.makedirs(
                      directory,
                      exist_ok=True
                  )

              temp_path = (
                  path +
                  ".tmp"
              )

              with open(
                  temp_path,
                  "w",
                  encoding="utf-8"
              ) as file:

                  json.dump(
                      data,
                      file,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  temp_path,
                  path
              )

          def find_table_in_twse_response(
              data
          ):
              """
              TWSE MI_INDEX 的資料表編號可能改變。
              不再固定使用 fields9 / data9。

              自動掃描：
              fields0 + data0
              fields1 + data1
              fields2 + data2
              ...
              找出同時具有：
              證券代號
              收盤價
              的真正行情表。
              """

              if not isinstance(
                  data,
                  dict
              ):
                  return [], []

              candidates = []

              for key, value in data.items():

                  if not str(
                      key
                  ).startswith(
                      "fields"
                  ):
                      continue

                  if not isinstance(
                      value,
                      list
                  ):
                      continue

                  suffix = str(
                      key
                  )[6:]

                  rows_key = (
                      "data" +
                      suffix
                  )

                  rows = data.get(
                      rows_key
                  )

                  if not isinstance(
                      rows,
                      list
                  ):
                      continue

                  field_names = [
                      str(x).strip()
                      for x in value
                  ]

                  has_code = (
                      "證券代號"
                      in field_names
                  )

                  has_close = (
                      "收盤價"
                      in field_names
                  )

                  if not (
                      has_code
                      and
                      has_close
                  ):
                      continue

                  candidates.append(
                      (
                          len(rows),
                          field_names,
                          rows
                      )
                  )

              if not candidates:
                  return [], []

              # 通常真正行情表資料筆數最多。
              candidates.sort(
                  key=lambda x: x[0],
                  reverse=True
              )

              return (
                  candidates[0][1],
                  candidates[0][2]
              )

          def build_index(
              fields
          ):

              return {
                  str(field).strip(): index
                  for index, field
                  in enumerate(
                      fields
                  )
              }

          def field_from_row(
              row,
              index,
              names
          ):

              if not isinstance(
                  row,
                  list
              ):
                  return None

              for name in names:

                  position = index.get(
                      name
                  )

                  if position is None:
                      continue

                  if position >= len(
                      row
                  ):
                      continue

                  return clean(
                      row[position]
                  )

              return None

          # ============================================================
          # 開始
          # ============================================================

          print("")
          print("=" * 60)
          print("開始更新最新股票資料")
          print("=" * 60)

          # ============================================================
          # 讀取股票搜尋資料庫
          # ============================================================

          if not os.path.exists(
              STOCK_FILE
          ):

              raise Exception(
                  f"找不到 {STOCK_FILE}"
              )

          master = load_json(
              STOCK_FILE
          )

          if isinstance(
              master,
              dict
          ):

              stocks = (
                  master.get("data")
                  or master.get("stocks")
                  or []
              )

          else:

              stocks = master

          stock_info = {}

          for item in stocks:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              code = normalize_code(
                  item.get(
                      "code",
                      ""
                  )
              )

              if not code:
                  continue

              stock_info[code] = {
                  "code": code,

                  "name": item.get(
                      "name",
                      ""
                  ),

                  "fullName": item.get(
                      "fullName",
                      ""
                  ),

                  "market": item.get(
                      "market",
                      ""
                  ),

                  "type": item.get(
                      "type",
                      ""
                  ),

                  "industry": item.get(
                      "industry",
                      ""
                  ),

                  "keywords": item.get(
                      "keywords",
                      []
                  )
              }

          print(
              "股票／ETF 搜尋資料庫：",
              len(stock_info),
              "檔"
          )

          # ============================================================
          # TWSE 最新交易日
          # ============================================================

          print("")
          print(
              "尋找 TWSE 最新交易日..."
          )

          twse_url = (
              "https://www.twse.com.tw/"
              "rwd/zh/afterTrading/MI_INDEX"
          )

          stock_day_all_url = (
              "https://openapi.twse.com.tw/"
              "v1/exchangeReport/STOCK_DAY_ALL"
          )

          twse_date_used = None
          twse_fields = []
          twse_rows = []

          # ============================================================
          # 第一優先：
          # TWSE MI_INDEX
          #
          # 重要修正：
          # 不再寫死 fields9 / data9
          # ============================================================

          for date_string in recent_weekdays(
              10
          ):

              try:

                  print(
                      "嘗試 TWSE 日期：",
                      date_string
                  )

                  data = request_json(
                      twse_url,
                      params={
                          "response":
                              "json",

                          "date":
                              date_string,

                          "type":
                              "ALLBUT0999"
                      }
                  )

                  if not isinstance(
                      data,
                      dict
                  ):
                      continue

                  if data.get(
                      "stat"
                  ) != "OK":
                      continue

                  fields, rows = (
                      find_table_in_twse_response(
                          data
                      )
                  )

                  if (
                      isinstance(
                          fields,
                          list
                      )
                      and isinstance(
                          rows,
                          list
                      )
                      and rows
                  ):

                      twse_fields = fields
                      twse_rows = rows

                      twse_date_used = normalize_date(
                          data.get(
                              "date"
                          )
                          or date_string
                      )

                      print(
                          "TWSE 行情表已找到"
                      )

                      print(
                          "TWSE 欄位數：",
                          len(
                              twse_fields
                          )
                      )

                      print(
                          "TWSE 行情筆數：",
                          len(
                              twse_rows
                          )
                      )

                      print(
                          "TWSE 最新交易日：",
                          twse_date_used
                      )

                      break

              except Exception as error:

                  print(
                      "TWSE 日期失敗：",
                      date_string,
                      repr(error)
                  )

          # ============================================================
          # 第二優先：
          # STOCK_DAY_ALL
          #
          # 如果 MI_INDEX 失敗，
          # 使用官方 OpenAPI 的 STOCK_DAY_ALL
          # ============================================================

          if not twse_rows:

              print("")
              print(
                  "MI_INDEX 無法取得行情，"
                  "改用 TWSE STOCK_DAY_ALL..."
              )

              try:

                  data = request_json(
                      stock_day_all_url
                  )

                  if isinstance(
                      data,
                      list
                  ) and data:

                      twse_rows = data

                      twse_fields = []

                      all_keys = []

                      for row in data:

                          if isinstance(
                              row,
                              dict
                          ):

                              for key in row.keys():

                                  if key not in all_keys:

                                      all_keys.append(
                                          key
                                      )

                      twse_fields = all_keys

                      # STOCK_DAY_ALL 本身不一定帶交易日期，
                      # 取最近工作日作為資料日期。
                      candidate_date = (
                          recent_weekdays(
                              1
                          )
                      )

                      if candidate_date:

                          twse_date_used = normalize_date(
                              candidate_date[0]
                          )

                      print(
                          "STOCK_DAY_ALL 行情筆數：",
                          len(
                              twse_rows
                          )
                      )

                      print(
                          "STOCK_DAY_ALL 日期：",
                          twse_date_used
                      )

              except Exception as error:

                  print(
                      "STOCK_DAY_ALL 失敗：",
                      repr(error)
                  )

          if not twse_rows:

              print(
                  "TWSE 無法取得最新行情"
              )

          # ============================================================
          # 建立 TWSE 欄位對應
          # ============================================================

          twse_index = build_index(
              twse_fields
          )

          # ============================================================
          # 最新資料
          # ============================================================

          latest = {}

          # ============================================================
          # TWSE 行情
          # ============================================================

          twse_count = 0

          # ------------------------------------------------------------
          # MI_INDEX 格式：list
          # ------------------------------------------------------------

          if twse_rows and isinstance(
              twse_rows[0],
              list
          ):

              for row in twse_rows:

                  if not isinstance(
                      row,
                      list
                  ):
                      continue

                  code = normalize_code(
                      field_from_row(
                          row,
                          twse_index,
                          [
                              "證券代號"
                          ]
                      )
                  )

                  if not code:
                      continue

                  if code not in stock_info:
                      continue

                  close = field_from_row(
                      row,
                      twse_index,
                      [
                          "收盤價"
                      ]
                  )

                  if close is None:
                      continue

                  change = field_from_row(
                      row,
                      twse_index,
                      [
                          "漲跌價差"
                      ]
                  )

                  prev = None

                  if (
                      close is not None
                      and change is not None
                  ):

                      prev = (
                          close -
                          change
                      )

                  change_pct = None

                  if (
                      prev is not None
                      and prev != 0
                      and change is not None
                  ):

                      change_pct = (
                          change
                          /
                          prev
                          *
                          100
                      )

                  latest[code] = {
                      **stock_info[code],

                      "price":
                          close,

                      "prev":
                          prev,

                      "open":
                          field_from_row(
                              row,
                              twse_index,
                              [
                                  "開盤價"
                              ]
                          ),

                      "high":
                          field_from_row(
                              row,
                              twse_index,
                              [
                                  "最高價"
                              ]
                          ),

                      "low":
                          field_from_row(
                              row,
                              twse_index,
                              [
                                  "最低價"
                              ]
                          ),

                      "change":
                          change,

                      "changePct":
                          change_pct,

                      "volume":
                          field_from_row(
                              row,
                              twse_index,
                              [
                                  "成交股數"
                              ]
                          ),

                      "amount":
                          field_from_row(
                              row,
                              twse_index,
                              [
                                  "成交金額"
                              ]
                          ),

                      "transactions":
                          field_from_row(
                              row,
                              twse_index,
                              [
                                  "成交筆數"
                              ]
                          ),

                      "bid":
                          field_from_row(
                              row,
                              twse_index,
                              [
                                  "最後揭示買價"
                              ]
                          ),

                      "bidVolume":
                          field_from_row(
                              row,
                              twse_index,
                              [
                                  "最後揭示買量"
                              ]
                          ),

                      "ask":
                          field_from_row(
                              row,
                              twse_index,
                              [
                                  "最後揭示賣價"
                              ]
                          ),

                      "askVolume":
                          field_from_row(
                              row,
                              twse_index,
                              [
                                  "最後揭示賣量"
                              ]
                          ),

                      "tradeDate":
                          twse_date_used,

                      "source":
                          "TWSE",

                      "updatedAt":
                          datetime.now(
                              TW_TZ
                          ).isoformat(),

                      "foreignBuy":
                          None,

                      "foreignSell":
                          None,

                      "foreignBalance":
                          None,

                      "trustBuy":
                          None,

                      "trustSell":
                          None,

                      "trustBalance":
                          None,

                      "dealerBuy":
                          None,

                      "dealerSell":
                          None,

                      "dealerBalance":
                          None,

                      "institutionTotal":
                          None,

                      "institutionDate":
                          None,

                      "institutionSource":
                          None,

                      "pe":
                          None,

                      "yield":
                          None,

                      "pbr":
                          None,

                      "ma5":
                          None,

                      "ma11":
                          None,

                      "ma31":
                          None,

                      "ma62":
                          None,

                      "ma122":
                          None,

                      "ma242":
                          None,

                      "ma5Deviation":
                          None,

                      "ma11Deviation":
                          None,

                      "ma31Deviation":
                          None,

                      "ma62Deviation":
                          None,

                      "ma122Deviation":
                          None,

                      "ma242Deviation":
                          None,

                      "foreign5":
                          None,

                      "foreign11":
                          None,

                      "foreign31":
                          None,

                      "trust5":
                          None,

                      "trust11":
                          None,

                      "trust31":
                          None,

                      "dealer5":
                          None,

                      "dealer11":
                          None,

                      "dealer31":
                          None
                  }

                  twse_count += 1

          # ------------------------------------------------------------
          # STOCK_DAY_ALL 格式：dict
          # ------------------------------------------------------------

          elif twse_rows and isinstance(
              twse_rows[0],
              dict
          ):

              for row in twse_rows:

                  if not isinstance(
                      row,
                      dict
                  ):
                      continue

                  code = normalize_code(
                      first(
                          row,
                          [
                              "證券代號",
                              "Code",
                              "股票代號"
                          ]
                      )
                  )

                  if not code:
                      continue

                  if code not in stock_info:
                      continue

                  close = clean(
                      first(
                          row,
                          [
                              "收盤價",
                              "Close"
                          ]
                      )
                  )

                  if close is None:
                      continue

                  change = clean(
                      first(
                          row,
                          [
                              "漲跌價差",
                              "Change"
                          ]
                      )
                  )

                  prev = None

                  if (
                      close is not None
                      and change is not None
                  ):

                      prev = (
                          close -
                          change
                      )

                  change_pct = None

                  if (
                      prev is not None
                      and prev != 0
                      and change is not None
                  ):

                      change_pct = (
                          change
                          /
                          prev
                          *
                          100
                      )

                  latest[code] = {
                      **stock_info[code],

                      "price":
                          close,

                      "prev":
                          prev,

                      "open":
                          clean(
                              first(
                                  row,
                                  [
                                      "開盤價",
                                      "Open"
                                  ]
                              )
                          ),

                      "high":
                          clean(
                              first(
                                  row,
                                  [
                                      "最高價",
                                      "High"
                                  ]
                              )
                          ),

                      "low":
                          clean(
                              first(
                                  row,
                                  [
                                      "最低價",
                                      "Low"
                                  ]
                              )
                          ),

                      "change":
                          change,

                      "changePct":
                          change_pct,

                      "volume":
                          clean(
                              first(
                                  row,
                                  [
                                      "成交股數",
                                      "Volume"
                                  ]
                              )
                          ),

                      "amount":
                          clean(
                              first(
                                  row,
                                  [
                                      "成交金額",
                                      "Amount"
                                  ]
                              )
                          ),

                      "transactions":
                          clean(
                              first(
                                  row,
                                  [
                                      "成交筆數",
                                      "Transactions"
                                  ]
                              )
                          ),

                      "bid":
                          None,

                      "bidVolume":
                          None,

                      "ask":
                          None,

                      "askVolume":
                          None,

                      "tradeDate":
                          twse_date_used,

                      "source":
                          "TWSE",

                      "updatedAt":
                          datetime.now(
                              TW_TZ
                          ).isoformat(),

                      "foreignBuy":
                          None,

                      "foreignSell":
                          None,

                      "foreignBalance":
                          None,

                      "trustBuy":
                          None,

                      "trustSell":
                          None,

                      "trustBalance":
                          None,

                      "dealerBuy":
                          None,

                      "dealerSell":
                          None,

                      "dealerBalance":
                          None,

                      "institutionTotal":
                          None,

                      "institutionDate":
                          None,

                      "institutionSource":
                          None,

                      "pe":
                          None,

                      "yield":
                          None,

                      "pbr":
                          None,

                      "ma5":
                          None,

                      "ma11":
                          None,

                      "ma31":
                          None,

                      "ma62":
                          None,

                      "ma122":
                          None,

                      "ma242":
                          None,


name: Update Latest Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * 1-5"

permissions:
  contents: write

jobs:
  update-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update latest.json and history
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone, timedelta

          import requests


          # ============================================================
          # 基本設定
          # ============================================================

          STOCK_FILE = "stock-data/stocks.json"
          LATEST_FILE = "stock-data/latest.json"
          HISTORY_DIR = "stock-data/history"

          TW_TZ = timezone(timedelta(hours=8))

          HEADERS = {
              "User-Agent":
                  "Mozilla/5.0 GitHub Actions Stock Updater",
              "Accept":
                  "application/json,text/plain,*/*"
          }

          os.makedirs(
              HISTORY_DIR,
              exist_ok=True
          )


          # ============================================================
          # 工具
          # ============================================================

          def clean(v):

              if v is None:
                  return None

              s = str(v).strip()

              if s in (
                  "",
                  "-",
                  "--",
                  "—",
                  "N/A",
                  "null",
                  "None"
              ):
                  return None

              s = (
                  s.replace(",", "")
                   .replace("<p style= color:red>", "")
                   .replace("</p>", "")
                   .replace("<p style= color:green>", "")
                   .replace("<p>", "")
              )

              try:

                  if "." in s:
                      return float(s)

                  return int(s)

              except Exception:
                  return None


          def request_json(
              url,
              params=None,
              timeout=40
          ):

              r = requests.get(
                  url,
                  params=params,
                  headers=HEADERS,
                  timeout=timeout
              )

              r.raise_for_status()

              return r.json()


          def first(row, keys):

              if not isinstance(row, dict):
                  return None

              for key in keys:

                  if key in row:

                      value = row.get(key)

                      if value not in (
                          None,
                          "",
                          "-",
                          "--",
                          "—"
                      ):
                          return value

              return None


          def normalize_date(value):

              if value is None:
                  return None

              s = str(value).strip()

              if not s:
                  return None

              # 民國日期：1150902
              if len(s) == 7 and s.isdigit():

                  return (
                      f"{int(s[:3]) + 1911}-"
                      f"{s[3:5]}-"
                      f"{s[5:7]}"
                  )

              # 西元日期：20260902
              if len(s) == 8 and s.isdigit():

                  return (
                      f"{s[:4]}-"
                      f"{s[4:6]}-"
                      f"{s[6:8]}"
                  )

              # 115/09/02
              if "/" in s:

                  parts = s.split("/")

                  if len(parts) == 3:

                      try:

                          y = int(parts[0])
                          m = int(parts[1])
                          d = int(parts[2])

                          if y < 1911:
                              y += 1911

                          return (
                              f"{y:04d}-{m:02d}-{d:02d}"
                          )

                      except Exception:
                          pass

              return s


          def roc_date(iso_date):

              y, m, d = iso_date.split("-")

              return (
                  f"{int(y) - 1911:03d}/"
                  f"{m}/{d}"
              )


          def recent_weekdays(days=300):

              result = []

              today = datetime.now(
                  TW_TZ
              ).date()

              for i in range(days):

                  d = today - timedelta(days=i)

                  if d.weekday() < 5:

                      result.append(
                          d.strftime("%Y%m%d")
                      )

              return result


          def load_json(path):

              if not os.path.exists(path):
                  return {}

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      return json.load(f)

              except Exception:

                  return {}


          def save_json(path, data):

              os.makedirs(
                  os.path.dirname(path),
                  exist_ok=True
              )

              tmp = path + ".tmp"

              with open(
                  tmp,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  tmp,
                  path
              )


          # ============================================================
          # 讀取股票搜尋資料庫
          # ============================================================

          print("")
          print("========================================")
          print("開始更新最新股票資料")
          print("========================================")

          if not os.path.exists(STOCK_FILE):

              raise Exception(
                  f"找不到 {STOCK_FILE}"
              )

          master = load_json(
              STOCK_FILE
          )

          if isinstance(master, dict):

              stocks = (
                  master.get("data")
                  or master.get("stocks")
                  or []
              )

          else:

              stocks = master


          stock_info = {}

          for item in stocks:

              if not isinstance(item, dict):
                  continue

              code = str(
                  item.get(
                      "code",
                      ""
                  )
              ).strip()

              if not code:
                  continue

              stock_info[code] = {
                  "code": code,
                  "name": item.get(
                      "name",
                      ""
                  ),
                  "fullName": item.get(
                      "fullName",
                      ""
                  ),
                  "market": item.get(
                      "market",
                      ""
                  ),
                  "type": item.get(
                      "type",
                      ""
                  ),
                  "industry": item.get(
                      "industry",
                      ""
                  ),
                  "keywords": item.get(
                      "keywords",
                      []
                  )
              }


          print(
              "股票／ETF 搜尋資料庫：",
              len(stock_info),
              "檔"
          )


          # ============================================================
          # TWSE：
          # 找真正最新交易日
          #
          # 使用 MI_INDEX 指定日期
          # 不再單純依賴 STOCK_DAY_ALL
          # ============================================================

          print("")
          print(
              "尋找 TWSE 最新交易日..."
          )

          twse_mi_url = (
              "https://www.twse.com.tw/"
              "rwd/zh/afterTrading/MI_INDEX"
          )

          twse_date_used = None
          twse_rows = []
          twse_fields = []

          for date_string in recent_weekdays(10):

              try:

                  print(
                      "嘗試 TWSE 日期：",
                      date_string
                  )

                  data = request_json(
                      twse_mi_url,
                      params={
                          "response": "json",
                          "date": date_string,
                          "type": "ALLBUT0999"
                      }
                  )

                  if not isinstance(
                      data,
                      dict
                  ):
                      continue

                  if data.get("stat") != "OK":
                      continue

                  fields = data.get(
                      "fields9",
                      []
                  )

                  rows = data.get(
                      "data9",
                      []
                  )

                  if (
                      isinstance(fields, list)
                      and isinstance(rows, list)
                      and len(rows) > 0
                  ):

                      twse_fields = fields
                      twse_rows = rows

                      twse_date_used = normalize_date(
                          data.get("date")
                          or date_string
                      )

                      print(
                          "TWSE 最新交易日：",
                          twse_date_used
                      )

                      break

              except Exception as e:

                  print(
                      "TWSE 日期失敗：",
                      date_string,
                      repr(e)
                  )

          if not twse_rows:

              print(
                  "TWSE 無法取得最新行情"
              )


          # ============================================================
          # TWSE 欄位對應
          # ============================================================

          twse_index = {
              str(field).strip(): i
              for i, field in enumerate(
                  twse_fields
              )
          }


          def twse_field(
              row,
              names
          ):

              for name in names:

                  idx = twse_index.get(
                      name
                  )

                  if idx is not None:

                      if idx < len(row):

                          return clean(
                              row[idx]
                          )

              return None


          latest = {}


          # ============================================================
          # TWSE 最新行情
          # ============================================================

          twse_count = 0

          for row in twse_rows:

              if not isinstance(row, list):
                  continue

              code = str(
                  twse_field(
                      row,
                      [
                          "證券代號"
                      ]
                  ) or ""
              ).strip()

              if not code:
                  continue

              if code not in stock_info:
                  continue

              close = twse_field(
                  row,
                  [
                      "收盤價"
                  ]
              )

              change = twse_field(
                  row,
                  [
                      "漲跌價差"
                  ]
              )

              prev = None

              if (
                  close is not None
                  and change is not None
              ):

                  prev = close - change

              change_pct = None

              if (
                  prev is not None
                  and prev != 0
                  and change is not None
              ):

                  change_pct = (
                      change
                      / prev
                      * 100
                  )

              latest[code] = {
                  **stock_info[code],

                  "price": close,
                  "prev": prev,

                  "open": twse_field(
                      row,
                      ["開盤價"]
                  ),

                  "high": twse_field(
                      row,
                      ["最高價"]
                  ),

                  "low": twse_field(
                      row,
                      ["最低價"]
                  ),

                  "change": change,
                  "changePct": change_pct,

                  "volume": twse_field(
                      row,
                      ["成交股數"]
                  ),

                  "amount": twse_field(
                      row,
                      ["成交金額"]
                  ),

                  "transactions": twse_field(
                      row,
                      ["成交筆數"]
                  ),

                  "bid": twse_field(
                      row,
                      [
                          "最後揭示買價"
                      ]
                  ),

                  "bidVolume": twse_field(
                      row,
                      [
                          "最後揭示買量"
                      ]
                  ),

                  "ask": twse_field(
                      row,
                      [
                          "最後揭示賣價"
                      ]
                  ),

                  "askVolume": twse_field(
                      row,
                      [
                          "最後揭示賣量"
                      ]
                  ),

                  "pe": twse_field(
                      row,
                      ["本益比"]
                  ),

                  "tradeDate":
                      twse_date_used,

                  "source": "TWSE",

                  "updatedAt":
                      datetime.now(
                          TW_TZ
                      ).isoformat(),

                  "foreignBuy": None,
                  "foreignSell": None,
                  "foreignBalance": None,

                  "trustBuy": None,
                  "trustSell": None,
                  "trustBalance": None,

                  "dealerBuy": None,
                  "dealerSell": None,
                  "dealerBalance": None,

                  "institutionTotal": None,

                  "institutionDate": None,

                  "institutionSource": None,

                  "yield": None,
                  "pbr": None,

                  "ma5": None,
                  "ma11": None,
                  "ma31": None,
                  "ma62": None,
                  "ma122": None,
                  "ma242": None,

                  "ma5Deviation": None,
                  "ma11Deviation": None,
                  "ma31Deviation": None,
                  "ma62Deviation": None,
                  "ma122Deviation": None,
                  "ma242Deviation": None,

                  "foreign5": None,
                  "foreign11": None,
                  "foreign31": None,

                  "trust5": None,
                  "trust11": None,
                  "trust31": None,

                  "dealer5": None,
                  "dealer11": None,
                  "dealer31": None
              }

              twse_count += 1


          print(
              "TWSE 行情：",
              twse_count,
              "檔"
          )


          # ============================================================
          # TPEx 最新行情
          # ============================================================

          print("")
          print(
              "讀取 TPEx 上櫃行情..."
          )

          tpex_url = (
              "https://www.tpex.org.tw/"
              "openapi/v1/"
              "tpex_mainboard_daily_close_quotes"
          )

          tpex_rows = []

          try:

              data = request_json(
                  tpex_url
              )

              if isinstance(
                  data,
                  dict
              ):

                  tpex_rows = (
                      data.get("data")
                      or data.get("aaData")
                      or []
                  )

              elif isinstance(
                  data,
                  list
              ):

                  tpex_rows = data

          except Exception as e:

              print(
                  "TPEx 行情失敗：",
                  repr(e)
              )


          tpex_count = 0
          tpex_date_used = None


          for row in tpex_rows:

              if not isinstance(
                  row,
                  dict
              ):
                  continue

              code = str(
                  first(
                      row,
                      [
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號"
                      ]
                  ) or ""
              ).strip()

              if not code:
                  continue

              if code not in stock_info:
                  continue

              close = clean(
                  first(
                      row,
                      [
                          "Close",
                          "ClosingPrice",
                          "成交價",
                          "收盤"
                      ]
                  )
              )

              change = clean(
                  first(
                      row,
                      [
                          "Change",
                          "漲跌",
                          "漲跌價差"
                      ]
                  )
              )

              prev = None

              if (
                  close is not None
                  and change is not None
              ):

                  prev = close - change

              change_pct = None

              if (
                  prev is not None
                  and prev != 0
                  and change is not None
              ):

                  change_pct = (
                      change
                      / prev
                      * 100
                  )

              row_date = normalize_date(
                  first(
                      row,
                      [
                          "Date",
                          "日期",
                          "交易日期"
                      ]
                  )
              )

              if row_date:
                  tpex_date_used = row_date

              latest[code] = {
                  **stock_info[code],

                  "price": close,
                  "prev": prev,

                  "open": clean(
                      first(
                          row,
                          [
                              "Open",
                              "OpeningPrice",
                              "開盤"
                          ]
                      )
                  ),

                  "high": clean(
                      first(
                          row,
                          [
                              "High",
                              "HighestPrice",
                              "最高"
                          ]
                      )
                  ),

                  "low": clean(
                      first(
                          row,
                          [
                              "Low",
                              "LowestPrice",
                              "最低"
                          ]
                      )
                  ),

                  "change": change,
                  "changePct": change_pct,

                  "volume": clean(
                      first(
                          row,
                          [
                              "TradingShares",
                              "TradeVolume",
                              "成交量",
                              "Volume"
                          ]
                      )
                  ),

                  "amount": clean(
                      first(
                          row,
                          [
                              "Turnover",
                              "TradeValue",
                              "成交金額",
                              "Amount"
                          ]
                      )
                  ),

                  "transactions": clean(
                      first(
                          row,
                          [
                              "Transaction",
                              "Transactions",
                              "成交筆數"
                          ]
                      )
                  ),

                  "bid": clean(
                      first(
                          row,
                          [
                              "BestBidPrice",
                              "BestBid",
                              "最後揭示買價"
                          ]
                      )
                  ),

                  "bidVolume": clean(
                      first(
                          row,
                          [
                              "BestBidVolume",
                              "最後揭示買量"
                          ]
                      )
                  ),

                  "ask": clean(
                      first(
                          row,
                          [
                              "BestAskPrice",
                              "BestAsk",
                              "最後揭示賣價"
                          ]
                      )
                  ),

                  "askVolume": clean(
                      first(
                          row,
                          [
                              "BestAskVolume",
                              "最後揭示賣量"
                          ]
                      )
                  ),

                  "tradeDate":
                      row_date
                      or tpex_date_used,

                  "source": "TPEx",

                  "updatedAt":
                      datetime.now(
                          TW_TZ
                      ).isoformat(),

                  "foreignBuy": None,
                  "foreignSell": None,
                  "foreignBalance": None,

                  "trustBuy": None,
                  "trustSell": None,
                  "trustBalance": None,

                  "dealerBuy": None,
                  "dealerSell": None,
                  "dealerBalance": None,

                  "institutionTotal": None,

                  "institutionDate": None,

                  "institutionSource": None,

                  "pe": None,
                  "yield": None,
                  "pbr": None,

                  "ma5": None,
                  "ma11": None,
                  "ma31": None,
                  "ma62": None,
                  "ma122": None,
                  "ma242": None,

                  "ma5Deviation": None,
                  "ma11Deviation": None,
                  "ma31Deviation": None,
                  "ma62Deviation": None,
                  "ma122Deviation": None,
                  "ma242Deviation": None,

                  "foreign5": None,
                  "foreign11": None,
                  "foreign31": None,

                  "trust5": None,
                  "trust11": None,
                  "trust31": None,

                  "dealer5": None,
                  "dealer11": None,
                  "dealer31": None
              }

              tpex_count += 1


          print(
              "TPEx 行情：",
              tpex_count,
              "檔"
          )


          # ============================================================
          # TWSE 法人
          #
          # 找與行情相同的交易日
          # ============================================================

          print("")
          print(
              "讀取 TWSE 三大法人..."
          )

          twse_inst_url = (
              "https://www.twse.com.tw/"
              "rwd/zh/fund/T86"
          )

          inst_rows = []
          inst_fields = []
          inst_date_used = None


          for date_string in (
              [
                  twse_date_used.replace("-", "")
              ]
              if twse_date_used
              else []
          ) + recent_weekdays(10):

              if date_string in (
                  None,
                  ""
              ):
                  continue

              try:

                  print(
                      "嘗試法人日期：",
                      date_string
                  )

                  data = request_json(
                      twse_inst_url,
                      params={
                          "response": "json",
                          "date": date_string,
                          "selectType":
                              "ALLBUT0999"
                      }
                  )

                  if not isinstance(
                      data,
                      dict
                  ):
                      continue

                  if data.get(
                      "stat"
                  ) != "OK":
                      continue

                  rows = data.get(
                      "data"
                  )

                  fields = data.get(
                      "fields"
                  )

                  if (
                      isinstance(
                          rows,
                          list
                      )
                      and isinstance(
                          fields,
                          list
                      )
                      and rows
                  ):

                      inst_rows = rows
                      inst_fields = fields
                      inst_date_used = date_string

                      break

              except Exception as e:

                  print(
                      "法人讀取失敗：",
                      repr(e)
                  )


          inst_index = {
              str(field).strip(): i
              for i, field in enumerate(
                  inst_fields
              )
          }


          def inst_field(
              row,
              names
          ):

              for name in names:

                  idx = inst_index.get(
                      name
                  )

                  if idx is not None:

                      if idx < len(row):

                          return clean(
                              row[idx]
                          )

              return None


          inst_count = 0


          for row in inst_rows:

              if not isinstance(
                  row,
                  list
              ):
                  continue

              code = str(
                  inst_field(
                      row,
                      ["證券代號"]
                  ) or ""
              ).strip()

              if code not in latest:
                  continue

              latest[code].update({

                  "foreignBuy":
                      inst_field(
                          row,
                          [
                              "外陸資買進股數(不含外資自營商)"
                          ]
                      ),

                  "foreignSell":
                      inst_field(
                          row,
                          [
                              "外陸資賣出股數(不含外資自營商)"
                          ]
                      ),

                  "foreignBalance":
                      inst_field(
                          row,
                          [
                              "外陸資買賣超股數(不含外資自營商)"
                          ]
                      ),

                  "trustBuy":
                      inst_field(
                          row,
                          [
                              "投信買進股數"
                          ]
                      ),

                  "trustSell":
                      inst_field(
                          row,
                          [
                              "投信賣出股數"
                          ]
                      ),

                  "trustBalance":
                      inst_field(
                          row,
                          [
                              "投信買賣超股數"
                          ]
                      ),

                  "dealerBuy":
                      inst_field(
                          row,
                          [
                              "自營商買進股數"
                          ]
                      ),

                  "dealerSell":
                      inst_field(
                          row,
                          [
                              "自營商賣出股數"
                          ]
                      ),

                  "dealerBalance":
                      inst_field(
                          row,
                          [
                              "自營商買賣超股數"
                          ]
                      ),

                  "institutionTotal":
                      inst_field(
                          row,
                          [
                              "三大法人買賣超股數"
                          ]
                      ),

                  "institutionDate":
                      normalize_date(
                          inst_date_used
                      ),

                  "institutionSource":
                      "TWSE T86"
              })

              inst_count += 1


          print(
              "TWSE 法人資料：",
              inst_count,
              "檔"
          )


          # ============================================================
          # TWSE PE / 殖利率 / PBR
          # ============================================================

          print("")
          print(
              "讀取 TWSE PE / 殖利率 / PBR..."
          )

          pe_url = (
              "https://openapi.twse.com.tw/"
              "v1/exchangeReport/BWIBBU_ALL"
          )

          try:

              rows = request_json(
                  pe_url
              )

              if isinstance(
                  rows,
                  list
              ):

                  pe_count = 0

                  for row in rows:

                      if not isinstance(
                          row,
                          dict
                      ):
                          continue

                      code = str(
                          first(
                              row,
                              [
                                  "Code",
                                  "證券代號"
                              ]
                          ) or ""
                      ).strip()

                      if code not in latest:
                          continue

                      latest[code][
                          "pe"
                      ] = clean(
                          first(
                              row,
                              [
                                  "PEratio",
                                  "本益比"
                              ]
                          )
                      )

                      latest[code][
                          "yield"
                      ] = clean(
                          first(
                              row,
                              [
                                  "DividendYield",
                                  "殖利率"
                              ]
                          )

                      latest[code][
                          "pbr"
                      ] = clean(
                          first(
                              row,
                              [
                                  "PBratio",
                                  "股價淨值比"
                              ]
                          )

                      pe_count += 1

                  print(
                      "TWSE PE/PBR：",
                      pe_count,
                      "檔"
                  )

          except Exception as e:

              print(
                  "PE/PBR 讀取失敗：",
                  repr(e)
              )


          # ============================================================
          # 歷史資料
          #
          # 先保存今天真正取得的行情
          # ============================================================

          if twse_date_used:

              history_path = os.path.join(
                  HISTORY_DIR,
                  f"{twse_date_used}.json"
              )

              old_history = load_json(
                  history_path
              )

              history_data = {
                  "_meta": {
                      "date":
                          twse_date_used,

                      "updatedAt":
                          datetime.now(
                              TW_TZ
                          ).isoformat(),

                      "source":

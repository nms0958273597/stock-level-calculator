name: Update Latest Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * 1-5"

permissions:
  contents: write

jobs:
  update-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update latest.json
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta

          import requests

          STOCK_FILE = "stock-data/stocks.json"
          OUT_FILE = "stock-data/latest.json"

          TW_TZ = timezone(timedelta(hours=8))

          HEADERS = {
              "User-Agent": "Mozilla/5.0 GitHub Actions Stock Updater",
              "Accept": "application/json,text/plain,*/*"
          }

          def clean(v):
              if v is None:
                  return None

              s = str(v).strip()

              if s in ("", "-", "--", "—", "N/A", "null", "None"):
                  return None

              s = s.replace(",", "")

              try:
                  if "." in s:
                      return float(s)
                  return int(s)
              except Exception:
                  return None

          def request_json(url, params=None):
              r = requests.get(
                  url,
                  params=params,
                  headers=HEADERS,
                  timeout=40
              )

              r.raise_for_status()

              return r.json()

          def first(row, keys):
              if not isinstance(row, dict):
                  return None

              for key in keys:
                  if key in row:
                      value = row.get(key)

                      if value not in (
                          None,
                          "",
                          "-",
                          "--",
                          "—"
                      ):
                          return value

              return None

          def normalize_date(value):
              if value is None:
                  return None

              s = str(value).strip()

              if not s:
                  return None

              # 民國日期，例如 1150902
              if len(s) == 7 and s.isdigit():
                  return (
                      f"{int(s[:3]) + 1911}-"
                      f"{s[3:5]}-"
                      f"{s[5:7]}"
                  )

              # 西元日期，例如 20260902
              if len(s) == 8 and s.isdigit():
                  return (
                      f"{s[:4]}-{s[4:6]}-{s[6:8]}"
                  )

              return s

          def previous_trade_days():
              """
              今天若尚未有法人資料，
              自動往前找最近交易日。
              """
              result = []

              now = datetime.now(TW_TZ)

              for i in range(8):
                  d = now - timedelta(days=i)

                  if d.weekday() < 5:
                      result.append(d.strftime("%Y%m%d"))

              return result

          print("========================================")
          print("開始更新最新股票資料")
          print("========================================")

          if not os.path.exists(STOCK_FILE):
              raise Exception(
                  f"找不到 {STOCK_FILE}"
              )

          with open(
              STOCK_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              master = json.load(f)

          if isinstance(master, dict):
              stocks = (
                  master.get("data")
                  or master.get("stocks")
                  or []
              )
          else:
              stocks = master

          stock_info = {}

          for item in stocks:

              if not isinstance(item, dict):
                  continue

              code = str(
                  item.get("code", "")
              ).strip()

              if not code:
                  continue

              stock_info[code] = {
                  "code": code,
                  "name": item.get("name", ""),
                  "fullName": item.get("fullName", ""),
                  "market": item.get("market", ""),
                  "type": item.get("type", ""),
                  "industry": item.get("industry", ""),
                  "keywords": item.get("keywords", [])
              }

          print(
              "股票／ETF 搜尋資料庫：",
              len(stock_info),
              "檔"
          )

          latest = {}

          run_time = datetime.now(TW_TZ).isoformat()

          # ============================================================
          # TWSE 上市行情
          # ============================================================

          print("")
          print("讀取 TWSE 上市行情...")

          twse_url = (
              "https://openapi.twse.com.tw/v1/"
              "exchangeReport/STOCK_DAY_ALL"
          )

          try:

              rows = request_json(twse_url)

              if not isinstance(rows, list):
                  rows = []

              twse_count = 0

              for row in rows:

                  if not isinstance(row, dict):
                      continue

                  code = str(
                      first(row, [
                          "Code",
                          "證券代號"
                      ]) or ""
                  ).strip()

                  if not code:
                      continue

                  if code not in stock_info:
                      continue

                  close = clean(
                      first(row, [
                          "ClosingPrice",
                          "收盤價"
                      ])
                  )

                  change = clean(
                      first(row, [
                          "Change",
                          "漲跌價差"
                      ])
                  )

                  prev = None

                  if (
                      close is not None
                      and change is not None
                  ):
                      prev = close - change

                  change_pct = None

                  if (
                      prev is not None
                      and prev != 0
                      and change is not None
                  ):
                      change_pct = (
                          change / prev * 100
                      )

                  latest[code] = {
                      **stock_info[code],

                      "price": close,
                      "prev": prev,

                      "open": clean(
                          first(row, [
                              "OpeningPrice",
                              "開盤價"
                          ])
                      ),

                      "high": clean(
                          first(row, [
                              "HighestPrice",
                              "最高價"
                          ])
                      ),

                      "low": clean(
                          first(row, [
                              "LowestPrice",
                              "最低價"
                          ])
                      ),

                      "change": change,
                      "changePct": change_pct,

                      "volume": clean(
                          first(row, [
                              "TradeVolume",
                              "成交股數"
                          ])
                      ),

                      "amount": clean(
                          first(row, [
                              "TradeValue",
                              "成交金額"
                          ])
                      ),

                      "tradeDate": normalize_date(
                          first(row, [
                              "Date",
                              "日期"
                          ])
                      ),

                      "source": "TWSE",

                      "updatedAt": run_time,

                      "foreignBuy": None,
                      "foreignSell": None,
                      "foreignBalance": None,

                      "trustBuy": None,
                      "trustSell": None,
                      "trustBalance": None,

                      "dealerBuy": None,
                      "dealerSell": None,
                      "dealerBalance": None,

                      "institutionTotal": None,

                      "institutionDate": None,

                      "institutionSource": None,

                      "pe": None,
                      "yield": None,
                      "pbr": None,

                      "ma5": None,
                      "ma11": None,
                      "ma31": None,
                      "ma62": None,
                      "ma122": None,
                      "ma242": None
                  }

                  twse_count += 1

              print(
                  "TWSE 行情：",
                  twse_count,
                  "檔"
              )

          except Exception as e:

              print(
                  "TWSE 行情讀取失敗：",
                  repr(e)
              )

          # ============================================================
          # TPEx 上櫃行情
          # ============================================================

          print("")
          print("讀取 TPEx 上櫃行情...")

          tpex_url = (
              "https://www.tpex.org.tw/openapi/"
              "v1/tpex_mainboard_quotes"
          )

          try:

              rows = request_json(tpex_url)

              if isinstance(rows, dict):
                  rows = (
                      rows.get("data")
                      or rows.get("aaData")
                      or []
                  )

              if not isinstance(rows, list):
                  rows = []

              tpex_count = 0

              for row in rows:

                  if not isinstance(row, dict):
                      continue

                  code = str(
                      first(row, [
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號"
                      ]) or ""
                  ).strip()

                  if not code:
                      continue

                  if code not in stock_info:
                      continue

                  close = clean(
                      first(row, [
                          "Close",
                          "ClosingPrice",
                          "成交價",
                          "收盤"
                      ])
                  )

                  change = clean(
                      first(row, [
                          "Change",
                          "漲跌",
                          "漲跌價差"
                      ])
                  )

                  prev = None

                  if (
                      close is not None
                      and change is not None
                  ):
                      prev = close - change

                  change_pct = None

                  if (
                      prev is not None
                      and prev != 0
                      and change is not None
                  ):
                      change_pct = (
                          change / prev * 100
                      )

                  latest[code] = {
                      **stock_info[code],

                      "price": close,
                      "prev": prev,

                      "open": clean(
                          first(row, [
                              "Open",
                              "OpeningPrice",
                              "開盤"
                          ])
                      ),

                      "high": clean(
                          first(row, [
                              "High",
                              "HighestPrice",
                              "最高"
                          ])
                      ),

                      "low": clean(
                          first(row, [
                              "Low",
                              "LowestPrice",
                              "最低"
                          ])
                      ),

                      "change": change,
                      "changePct": change_pct,

                      "volume": clean(
                          first(row, [
                              "TradeVolume",
                              "成交量",
                              "Volume"
                          ])
                      ),

                      "amount": clean(
                          first(row, [
                              "TradeValue",
                              "成交金額",
                              "Amount"
                          ])
                      ),

                      "tradeDate": normalize_date(
                          first(row, [
                              "Date",
                              "日期",
                              "交易日期"
                          ])
                      ),

                      "source": "TPEx",

                      "updatedAt": run_time,

                      "foreignBuy": None,
                      "foreignSell": None,
                      "foreignBalance": None,

                      "trustBuy": None,
                      "trustSell": None,
                      "trustBalance": None,

                      "dealerBuy": None,
                      "dealerSell": None,
                      "dealerBalance": None,

                      "institutionTotal": None,

                      "institutionDate": None,

                      "institutionSource": None,

                      "pe": None,
                      "yield": None,
                      "pbr": None,

                      "ma5": None,
                      "ma11": None,
                      "ma31": None,
                      "ma62": None,
                      "ma122": None,
                      "ma242": None
                  }

                  tpex_count += 1

              print(
                  "TPEx 行情：",
                  tpex_count,
                  "檔"
              )

          except Exception as e:

              print(
                  "TPEx 行情讀取失敗：",
                  repr(e)
              )

          # ============================================================
          # TWSE 三大法人
          #
          # 修正重點：
          # 使用 TWSE 官方 RWD T86
          # 不再使用 openapi.twse.com.tw/v1/fund/T86
          # ============================================================

          print("")
          print("讀取 TWSE 三大法人...")

          twse_inst_url = (
              "https://www.twse.com.tw/rwd/zh/fund/T86"
          )

          inst_rows = None
          inst_date_used = None

          for date_string in previous_trade_days():

              try:

                  print(
                      "嘗試法人日期：",
                      date_string
                  )

                  data = request_json(
                      twse_inst_url,
                      params={
                          "response": "json",
                          "date": date_string,
                          "selectType": "ALLBUT0999"
                      }
                  )

                  if not isinstance(data, dict):
                      continue

                  if data.get("stat") != "OK":
                      continue

                  rows = data.get("data")

                  fields = data.get("fields")

                  if (
                      isinstance(rows, list)
                      and isinstance(fields, list)
                      and len(rows) > 0
                  ):
                      inst_rows = rows
                      inst_date_used = date_string
                      field_index = {
                          str(field).strip(): i
                          for i, field in enumerate(fields)
                      }

                      break

              except Exception as e:

                  print(
                      "法人日期讀取失敗：",
                      date_string,
                      repr(e)
                  )

          if inst_rows is None:

              print(
                  "TWSE 法人資料目前無法取得"
              )

          else:

              def get_field(row, field_name):

                  index = field_index.get(
                      field_name
                  )

                  if index is None:
                      return None

                  if index >= len(row):
                      return None

                  return clean(row[index])

              inst_count = 0

              for row in inst_rows:

                  if not isinstance(row, list):
                      continue

                  code = str(
                      get_field(
                          row,
                          "證券代號"
                      ) or ""
                  ).strip()

                  if not code:
                      continue

                  if code not in latest:
                      continue

                  foreign_buy = get_field(
                      row,
                      "外陸資買進股數(不含外資自營商)"
                  )

                  foreign_sell = get_field(
                      row,
                      "外陸資賣出股數(不含外資自營商)"
                  )

                  foreign_balance = get_field(
                      row,
                      "外陸資買賣超股數(不含外資自營商)"
                  )

                  trust_buy = get_field(
                      row,
                      "投信買進股數"
                  )

                  trust_sell = get_field(
                      row,
                      "投信賣出股數"
                  )

                  trust_balance = get_field(
                      row,
                      "投信買賣超股數"
                  )

                  dealer_buy = get_field(
                      row,
                      "自營商買進股數"
                  )

                  dealer_sell = get_field(
                      row,
                      "自營商賣出股數"
                  )

                  dealer_balance = get_field(
                      row,
                      "自營商買賣超股數"
                  )

                  total_balance = get_field(
                      row,
                      "三大法人買賣超股數"
                  )

                  latest[code].update({

                      "foreignBuy":
                          foreign_buy,

                      "foreignSell":
                          foreign_sell,

                      "foreignBalance":
                          foreign_balance,

                      "trustBuy":
                          trust_buy,

                      "trustSell":
                          trust_sell,

                      "trustBalance":
                          trust_balance,

                      "dealerBuy":
                          dealer_buy,

                      "dealerSell":
                          dealer_sell,

                      "dealerBalance":
                          dealer_balance,

                      "institutionTotal":
                          total_balance,

                      "institutionDate":
                          inst_date_used,

                      "institutionSource":
                          "TWSE T86"

                  })

                  inst_count += 1

              print(
                  "TWSE 法人資料：",
                  inst_count,
                  "檔"
              )

          # ============================================================
          # PE / 殖利率 / PBR
          # TWSE 官方 BWIBBU_ALL
          # ============================================================

          print("")
          print("讀取 TWSE 本益比／殖利率／PBR...")

          pe_url = (
              "https://openapi.twse.com.tw/v1/"
              "exchangeReport/BWIBBU_ALL"
          )

          try:

              rows = request_json(pe_url)

              if isinstance(rows, list):

                  pe_count = 0

                  for row in rows:

                      if not isinstance(row, dict):
                          continue

                      code = str(
                          first(row, [
                              "Code",
                              "證券代號"
                          ]) or ""
                      ).strip()

                      if code not in latest:
                          continue

                      latest[code]["pe"] = clean(
                          first(row, [
                              "PEratio",
                              "本益比"
                          ])
                      )

                      latest[code]["yield"] = clean(
                          first(row, [
                              "DividendYield",
                              "殖利率"
                          ])
                      )

                      latest[code]["pbr"] = clean(
                          first(row, [
                              "PBratio",
                              "股價淨值比"
                          ])
                      )

                      pe_count += 1

                  print(
                      "TWSE PE/PBR：",
                      pe_count,
                      "檔"
                  )

          except Exception as e:

              print(
                  "TWSE PE/PBR 讀取失敗：",
                  repr(e)
              )

          # ============================================================
          # 寫入最新資料
          # ============================================================

          output = {
              "_meta": {
                  "updatedAt": run_time,
                  "count": len(latest),
                  "tradeDate": (
                      max(
                          [
                              x.get("tradeDate")
                              for x in latest.values()
                              if x.get("tradeDate")
                          ],
                          default=None
                      )
                  ),
                  "source": [
                      "TWSE official",
                      "TPEx official"
                  ],
                  "realtime": False,
                  "note": (
                      "本資料為官方可取得的最新行情資料，"
                      "不是即時報價。"
                  )
              }
          }

          for code in sorted(latest):
              output[code] = latest[code]

          os.makedirs(
              "stock-data",
              exist_ok=True
          )

          with open(
              OUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("========================================")
          print("完成")
          print("========================================")

          print(
              "latest.json：",
              OUT_FILE
          )

          print(
              "資料筆數：",
              len(latest)
          )

          print(
              "更新時間：",
              run_time
          )

          # ============================================================
          # 重要股票檢查
          # ============================================================

          for code in [
              "1301",
              "1326",
              "2330",
              "0050",
              "00631L"
          ]:

              print("")
              print("檢查：", code)

              if code not in output:

                  print(
                      code,
                      "目前沒有最新行情資料"
                  )

                  continue

              item = output[code]

              print(
                  json.dumps(
                      {
                          "code":
                              item.get("code"),

                          "name":
                              item.get("name"),

                          "price":
                              item.get("price"),

                          "prev":
                              item.get("prev"),

                          "tradeDate":
                              item.get("tradeDate"),

                          "foreignBalance":
                              item.get(
                                  "foreignBalance"
                              ),

                          "trustBalance":
                              item.get(
                                  "trustBalance"
                              ),

                          "dealerBalance":
                              item.get(
                                  "dealerBalance"
                              ),

                          "institutionTotal":
                              item.get(
                                  "institutionTotal"
                              ),

                          "institutionDate":
                              item.get(
                                  "institutionDate"
                              ),

                          "pe":
                              item.get("pe")
                      },
                      ensure_ascii=False
                  )
              )

          PY

      - name: Validate latest.json
        run: |
          python - <<'PY'
          import json
          import sys

          path = "stock-data/latest.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "latest.json 格式錯誤"
              )

          codes = [
              k for k in data
              if k != "_meta"
          ]

          print(
              "latest.json 資料筆數：",
              len(codes)
          )

          if len(codes) < 100:
              raise SystemExit(
                  "資料少於 100 檔，停止提交"
              )

          print(
              "更新時間：",
              data.get("_meta", {}).get(
                  "updatedAt"
              )
          )

          for code in [
              "1301",
              "1326",
              "2330",
              "0050",
              "00631L"
          ]:

              if code in data:

                  item = data[code]

                  print("")
                  print(
                      "==========",
                      code,
                      "=========="
                  )

                  print(
                      "價格：",
                      item.get("price")
                  )

                  print(
                      "交易日期：",
                      item.get("tradeDate")
                  )

                  print(
                      "外資：",
                      item.get("foreignBalance")
                  )

                  print(
                      "投信：",
                      item.get("trustBalance")
                  )

                  print(
                      "自營商：",
                      item.get("dealerBalance")
                  )

                  print(
                      "三大法人：",
                      item.get("institutionTotal")
                  )

                  print(
                      "PE：",
                      item.get("pe")
                  )

          print("")
          print(
              "OK：latest.json 格式正常"
          )
          PY

      - name: Commit latest.json
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock-data/latest.json

          if git diff --cached --quiet; then
            echo "沒有新的資料需要提交"
          else
            git commit \
              -m "Update latest stock data"
            git push
          fi
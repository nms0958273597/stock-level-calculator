from pathlib import Path

workflow = r'''name: Update Latest Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * 1-5"

permissions:
  contents: write

jobs:
  update-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Python Syntax Check
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import ast
          import pathlib

          workflow_path = pathlib.Path(
              ".github/workflows/update-latest.yml"
          )

          workflow = workflow_path.read_text(
              encoding="utf-8"
          )

          marker = (
              "      - name: "
              "Update latest.json and history"
          )

          if marker not in workflow:
              raise SystemExit(
                  "找不到 Update latest.json and history"
              )

          target = workflow.split(
              marker,
              1
          )[1]

          heredoc_start = (
              "          python <<'PY'"
          )

          start = target.find(
              heredoc_start
          )

          if start == -1:
              raise SystemExit(
                  "找不到主要 Python 程式"
              )

          start = target.find(
              "\n",
              start
          )

          if start == -1:
              raise SystemExit(
                  "找不到 Python 程式開始位置"
              )

          start += 1

          heredoc_end = (
              "\n          PY"
          )

          end = target.find(
              heredoc_end,
              start
          )

          if end == -1:
              raise SystemExit(
                  "找不到主要 Python 程式結尾"
              )

          python_code = target[
              start:end
          ]

          lines = python_code.splitlines()
          cleaned_lines = []

          for line in lines:
              if line.startswith(
                  "          "
              ):
                  line = line[10:]

              cleaned_lines.append(
                  line
              )

          python_code = "\n".join(
              cleaned_lines
          )

          try:
              ast.parse(
                  python_code
              )
          except SyntaxError as error:
              print("")
              print(
                  "========================================"
              )
              print(
                  "Python 語法檢查失敗"
              )
              print(
                  "========================================"
              )
              print(
                  "行號：",
                  error.lineno
              )
              print(
                  "欄位：",
                  error.offset
              )
              print(
                  "錯誤：",
                  error.msg
              )
              print("")
              raise

          print("")
          print(
              "========================================"
          )
          print(
              "Python 語法檢查通過"
          )
          print(
              "========================================"
          )
          PY

      - name: Update latest.json and history
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta

          import requests

          STOCK_FILE = "stock-data/stocks.json"
          LATEST_FILE = "stock-data/latest.json"
          HISTORY_DIR = "stock-data/history"

          TW_TZ = timezone(
              timedelta(hours=8)
          )

          HEADERS = {
              "User-Agent":
                  "Mozilla/5.0 GitHub Actions Stock Updater",
              "Accept":
                  "application/json,text/plain,*/*"
          }

          os.makedirs(
              HISTORY_DIR,
              exist_ok=True
          )

          def clean(value):
              if value is None:
                  return None

              s = str(value).strip()

              if s in (
                  "",
                  "-",
                  "--",
                  "—",
                  "N/A",
                  "null",
                  "None"
              ):
                  return None

              s = (
                  s.replace(",", "")
                  .replace(
                      "<p style= color:red>",
                      ""
                  )
                  .replace(
                      "<p style= color:green>",
                      ""
                  )
                  .replace(
                      "</p>",
                      ""
                  )
                  .replace(
                      "<p>",
                      ""
                  )
              )

              try:
                  if "." in s:
                      return float(s)
                  return int(s)
              except Exception:
                  return None

          def request_json(
              url,
              params=None,
              timeout=40
          ):
              response = requests.get(
                  url,
                  params=params,
                  headers=HEADERS,
                  timeout=timeout
              )
              response.raise_for_status()
              return response.json()

          def first(row, keys):
              if not isinstance(row, dict):
                  return None

              for key in keys:
                  if key not in row:
                      continue

                  value = row.get(key)

                  if value not in (
                      None,
                      "",
                      "-",
                      "--",
                      "—"
                  ):
                      return value

              return None

          def normalize_date(value):
              if value is None:
                  return None

              s = str(value).strip()

              if not s:
                  return None

              if len(s) == 7 and s.isdigit():
                  return (
                      f"{int(s[:3]) + 1911}-"
                      f"{s[3:5]}-"
                      f"{s[5:7]}"
                  )

              if len(s) == 8 and s.isdigit():
                  return (
                      f"{s[:4]}-"
                      f"{s[4:6]}-"
                      f"{s[6:8]}"
                  )

              if "/" in s:
                  parts = s.split("/")

                  if len(parts) == 3:
                      try:
                          year = int(parts[0])
                          month = int(parts[1])
                          day = int(parts[2])

                          if year < 1911:
                              year += 1911

                          return (
                              f"{year:04d}-"
                              f"{month:02d}-"
                              f"{day:02d}"
                          )
                      except Exception:
                          pass

              return s

          def recent_weekdays(days=300):
              result = []

              today = datetime.now(
                  TW_TZ
              ).date()

              for offset in range(days):
                  day = (
                      today -
                      timedelta(days=offset)
                  )

                  if day.weekday() < 5:
                      result.append(
                          day.strftime("%Y%m%d")
                      )

              return result

          def load_json(path):
              if not os.path.exists(path):
                  return {}

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as file:
                      return json.load(file)
              except Exception:
                  return {}

          def save_json(path, data):
              directory = os.path.dirname(path)

              if directory:
                  os.makedirs(
                      directory,
                      exist_ok=True
                  )

              temp_path = path + ".tmp"

              with open(
                  temp_path,
                  "w",
                  encoding="utf-8"
              ) as file:
                  json.dump(
                      data,
                      file,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  temp_path,
                  path
              )

          print("")
          print("=" * 50)
          print("開始更新最新股票資料")
          print("=" * 50)

          if not os.path.exists(
              STOCK_FILE
          ):
              raise Exception(
                  f"找不到 {STOCK_FILE}"
              )

          master = load_json(
              STOCK_FILE
          )

          if isinstance(
              master,
              dict
          ):
              stocks = (
                  master.get("data")
                  or master.get("stocks")
                  or []
              )
          else:
              stocks = master

          stock_info = {}

          for item in stocks:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              code = str(
                  item.get(
                      "code",
                      ""
                  )
              ).strip()

              if not code:
                  continue

              stock_info[code] = {
                  "code": code,
                  "name": item.get(
                      "name",
                      ""
                  ),
                  "fullName": item.get(
                      "fullName",
                      ""
                  ),
                  "market": item.get(
                      "market",
                      ""
                  ),
                  "type": item.get(
                      "type",
                      ""
                  ),
                  "industry": item.get(
                      "industry",
                      ""
                  ),
                  "keywords": item.get(
                      "keywords",
                      []
                  )
              }

          print(
              "股票／ETF 搜尋資料庫：",
              len(stock_info),
              "檔"
          )

          twse_url = (
              "https://www.twse.com.tw/"
              "rwd/zh/afterTrading/MI_INDEX"
          )

          twse_date_used = None
          twse_fields = []
          twse_rows = []

          print("")
          print("尋找 TWSE 最新完整交易日...")

          for date_string in recent_weekdays(10):
              try:
                  print(
                      "嘗試 TWSE 日期：",
                      date_string
                  )

                  data = request_json(
                      twse_url,
                      params={
                          "response": "json",
                          "date": date_string,
                          "type": "ALLBUT0999"
                      }
                  )

                  if not isinstance(
                      data,
                      dict
                  ):
                      continue

                  if data.get(
                      "stat"
                  ) != "OK":
                      continue

                  fields = data.get(
                      "fields9",
                      []
                  )

                  rows = data.get(
                      "data9",
                      []
                  )

                  if (
                      isinstance(fields, list)
                      and isinstance(rows, list)
                      and rows
                  ):
                      twse_fields = fields
                      twse_rows = rows

                      twse_date_used = (
                          normalize_date(
                              data.get(
                                  "date"
                              )
                              or date_string
                          )
                      )

                      print(
                          "TWSE 最新交易日：",
                          twse_date_used
                      )

                      break

              except Exception as error:
                  print(
                      "TWSE 日期失敗：",
                      date_string,
                      repr(error)
                  )

          if not twse_rows:
              raise Exception(
                  "TWSE 無法取得最新完整行情"
              )

          twse_index = {
              str(field).strip(): index
              for index, field
              in enumerate(twse_fields)
          }

          def twse_field(
              row,
              names
          ):
              for name in names:
                  index = twse_index.get(
                      name
                  )

                  if index is not None:
                      if index < len(row):
                          return clean(
                              row[index]
                          )

              return None

          latest = {}

          twse_count = 0

          for row in twse_rows:
              if not isinstance(
                  row,
                  list
              ):
                  continue

              code = str(
                  twse_field(
                      row,
                      ["證券代號"]
                  ) or ""
              ).strip()

              if not code:
                  continue

              if code not in stock_info:
                  continue

              close = twse_field(
                  row,
                  ["收盤價"]
              )

              change = twse_field(
                  row,
                  ["漲跌價差"]
              )

              prev = None

              if (
                  close is not None
                  and change is not None
              ):
                  prev = (
                      close -
                      change
                  )

              change_pct = None

              if (
                  prev is not None
                  and prev != 0
                  and change is not None
              ):
                  change_pct = (
                      change /
                      prev *
                      100
                  )

              latest[code] = {
                  **stock_info[code],

                  "price": close,
                  "prev": prev,

                  "open": twse_field(
                      row,
                      ["開盤價"]
                  ),

                  "high": twse_field(
                      row,
                      ["最高價"]
                  ),

                  "low": twse_field(
                      row,
                      ["最低價"]
                  ),

                  "change": change,
                  "changePct": change_pct,

                  "volume": twse_field(
                      row,
                      ["成交股數"]
                  ),

                  "amount": twse_field(
                      row,
                      ["成交金額"]
                  ),

                  "transactions": twse_field(
                      row,
                      ["成交筆數"]
                  ),

                  "bid": twse_field(
                      row,
                      ["最後揭示買價"]
                  ),

                  "bidVolume": twse_field(
                      row,
                      ["最後揭示買量"]
                  ),

                  "ask": twse_field(
                      row,
                      ["最後揭示賣價"]
                  ),

                  "askVolume": twse_field(
                      row,
                      ["最後揭示賣量"]
                  ),

                  "tradeDate":
                      twse_date_used,

                  "source":
                      "TWSE",

                  "updatedAt":
                      datetime.now(
                          TW_TZ
                      ).isoformat(),

                  "foreignBuy": None,
                  "foreignSell": None,
                  "foreignBalance": None,

                  "trustBuy": None,
                  "trustSell": None,
                  "trustBalance": None,

                  "dealerBuy": None,
                  "dealerSell": None,
                  "dealerBalance": None,

                  "institutionTotal": None,
                  "institutionDate": None,
                  "institutionSource": None,

                  "pe": None,
                  "yield": None,
                  "pbr": None,

                  "ma5": None,
                  "ma11": None,
                  "ma31": None,
                  "ma62": None,
                  "ma122": None,
                  "ma242": None,

                  "ma5Deviation": None,
                  "ma11Deviation": None,
                  "ma31Deviation": None,
                  "ma62Deviation": None,
                  "ma122Deviation": None,
                  "ma242Deviation": None,

                  "foreign5": None,
                  "foreign11": None,
                  "foreign31": None,

                  "trust5": None,
                  "trust11": None,
                  "trust31": None,

                  "dealer5": None,
                  "dealer11": None,
                  "dealer31": None
              }

              twse_count += 1

          print(
              "TWSE 行情：",
              twse_count,
              "檔"
          )

          print("")
          print(
              "讀取 TPEx 上櫃行情..."
          )

          tpex_url = (
              "https://www.tpex.org.tw/"
              "openapi/v1/"
              "tpex_mainboard_daily_close_quotes"
          )

          tpex_rows = []

          try:
              data = request_json(
                  tpex_url
              )

              if isinstance(
                  data,
                  dict
              ):
                  tpex_rows = (
                      data.get("data")
                      or data.get("aaData")
                      or []
                  )
              elif isinstance(
                  data,
                  list
              ):
                  tpex_rows = data

          except Exception as error:
              print(
                  "TPEx 行情失敗：",
                  repr(error)
              )

          tpex_count = 0
          tpex_date_used = None

          for row in tpex_rows:
              if not isinstance(
                  row,
                  dict
              ):
                  continue

              code = str(
                  first(
                      row,
                      [
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號"
                      ]
                  ) or ""
              ).strip()

              if not code:
                  continue

              if code not in stock_info:
                  continue

              close = clean(
                  first(
                      row,
                      [
                          "Close",
                          "ClosingPrice",
                          "成交價",
                          "收盤"
                      ]
                  )
              )

              change = clean(
                  first(
                      row,
                      [
                          "Change",
                          "漲跌",
                          "漲跌價差"
                      ]
                  )
              )

              prev = None

              if (
                  close is not None
                  and change is not None
              ):
                  prev = (
                      close -
                      change
                  )

              change_pct = None

              if (
                  prev is not None
                  and prev != 0
                  and change is not None
              ):
                  change_pct = (
                      change /
                      prev *
                      100
                  )

              row_date = normalize_date(
                  first(
                      row,
                      [
                          "Date",
                          "日期",
                          "交易日期"
                      ]
                  )
              )

              if row_date:
                  tpex_date_used = row_date

              latest[code] = {
                  **stock_info[code],

                  "price": close,
                  "prev": prev,

                  "open": clean(
                      first(
                          row,
                          [
                              "Open",
                              "OpeningPrice",
                              "開盤"
                          ]
                      )
                  ),

                  "high": clean(
                      first(
                          row,
                          [
                              "High",
                              "HighestPrice",
                              "最高"
                          ]
                      )
                  ),

                  "low": clean(
                      first(
                          row,
                          [
                              "Low",
                              "LowestPrice",
                              "最低"
                          ]
                      )
                  ),

                  "change": change,
                  "changePct": change_pct,

                  "volume": clean(
                      first(
                          row,
                          [
                              "TradingShares",
                              "TradeVolume",
                              "成交量",
                              "Volume"
                          ]
                      )
                  ),

                  "amount": clean(
                      first(
                          row,
                          [
                              "Turnover",
                              "TradeValue",
                              "成交金額",
                              "Amount"
                          ]
                      )
                  ),

                  "transactions": clean(
                      first(
                          row,
                          [
                              "Transaction",
                              "Transactions",
                              "成交筆數"
                          ]
                      )
                  ),

                  "bid": clean(
                      first(
                          row,
                          [
                              "BestBidPrice",
                              "BestBid",
                              "最後揭示買價"
                          ]
                      )
                  ),

                  "bidVolume": clean(
                      first(
                          row,
                          [
                              "BestBidVolume",
                              "最後揭示買量"
                          ]
                      )
                  ),

                  "ask": clean(
                      first(
                          row,
                          [
                              "BestAskPrice",
                              "BestAsk",
                              "最後揭示賣價"
                          ]
                      )
                  ),

                  "askVolume": clean(
                      first(
                          row,
                          [
                              "BestAskVolume",
                              "最後揭示賣量"
                          ]
                      )
                  ),

                  "tradeDate":
                      row_date
                      or tpex_date_used,

                  "source":
                      "TPEx",

                  "updatedAt":
                      datetime.now(
                          TW_TZ
                      ).isoformat(),

                  "foreignBuy": None,
                  "foreignSell": None,
                  "foreignBalance": None,

                  "trustBuy": None,
                  "trustSell": None,
                  "trustBalance": None,

                  "dealerBuy": None,
                  "dealerSell": None,
                  "dealerBalance": None,

                  "institutionTotal": None,
                  "institutionDate": None,
                  "institutionSource": None,

                  "pe": None,
                  "yield": None,
                  "pbr": None,

                  "ma5": None,
                  "ma11": None,
                  "ma31": None,
                  "ma62": None,
                  "ma122": None,
                  "ma242": None,

                  "ma5Deviation": None,
                  "ma11Deviation": None,
                  "ma31Deviation": None,
                  "ma62Deviation": None,
                  "ma122Deviation": None,
                  "ma242Deviation": None,

                  "foreign5": None,
                  "foreign11": None,
                  "foreign31": None,

                  "trust5": None,
                  "trust11": None,
                  "trust31": None,

                  "dealer5": None,
                  "dealer11": None,
                  "dealer31": None
              }

              tpex_count += 1

          print(
              "TPEx 行情：",
              tpex_count,
              "檔"
          )

          print("")
          print(
              "讀取 TWSE 三大法人..."
          )

          institution_url = (
              "https://www.twse.com.tw/"
              "rwd/zh/fund/T86"
          )

          institution_rows = []
          institution_fields = []
          institution_date = None

          candidate_dates = []

          if twse_date_used:
              candidate_dates.append(
                  twse_date_used.replace(
                      "-",
                      ""
                  )
              )

          for date_string in recent_weekdays(10):
              if date_string not in candidate_dates:
                  candidate_dates.append(
                      date_string
                  )

          for date_string in candidate_dates:
              try:
                  print(
                      "嘗試法人日期：",
                      date_string
                  )

                  data = request_json(
                      institution_url,
                      params={
                          "response": "json",
                          "date": date_string,
                          "selectType":
                              "ALLBUT0999"
                      }
                  )

                  if not isinstance(
                      data,
                      dict
                  ):
                      continue

                  if data.get(
                      "stat"
                  ) != "OK":
                      continue

                  rows = data.get(
                      "data"
                  )

                  fields = data.get(
                      "fields"
                  )

                  if (
                      isinstance(
                          rows,
                          list
                      )
                      and isinstance(
                          fields,
                          list
                      )
                      and rows
                  ):
                      institution_rows = rows
                      institution_fields = fields
                      institution_date = (
                          date_string
                      )
                      break

              except Exception as error:
                  print(
                      "法人讀取失敗：",
                      repr(error)
                  )

          institution_index = {
              str(field).strip(): index
              for index, field
              in enumerate(
                  institution_fields
              )
          }

          def institution_field(
              row,
              names
          ):
              for name in names:
                  index = institution_index.get(
                      name
                  )

                  if index is not None:
                      if index < len(row):
                          return clean(
                              row[index]
                          )

              return None

          institution_count = 0

          for row in institution_rows:
              if not isinstance(
                  row,
                  list
              ):
                  continue

              code = str(
                  institution_field(
                      row,
                      ["證券代號"]
                  ) or ""
              ).strip()

              if code not in latest:
                  continue

              latest[code].update({

                  "foreignBuy":
                      institution_field(
                          row,
                          [
                              "外陸資買進股數(不含外資自營商)"
                          ]
                      ),

                  "foreignSell":
                      institution_field(
                          row,
                          [
                              "外陸資賣出股數(不含外資自營商)"
                          ]
                      ),

                  "foreignBalance":
                      institution_field(
                          row,
                          [
                              "外陸資買賣超股數(不含外資自營商)"
                          ]
                      ),

                  "trustBuy":
                      institution_field(
                          row,
                          [
                              "投信買進股數"
                          ]
                      ),

                  "trustSell":
                      institution_field(
                          row,
                          [
                              "投信賣出股數"
                          ]
                      ),

                  "trustBalance":
                      institution_field(
                          row,
                          [
                              "投信買賣超股數"
                          ]
                      ),

                  "dealerBuy":
                      institution_field(
                          row,
                          [
                              "自營商買進股數"
                          ]
                      ),

                  "dealerSell":
                      institution_field(
                          row,
                          [
                              "自營商賣出股數"
                          ]
                      ),

                  "dealerBalance":
                      institution_field(
                          row,
                          [
                              "自營商買賣超股數"
                          ]
                      ),

                  "institutionTotal":
                      institution_field(
                          row,
                          [
                              "三大法人買賣超股數"
                          ]
                      ),

                  "institutionDate":
                      normalize_date(
                          institution_date
                      ),

                  "institutionSource":
                      "TWSE T86"
              })

              institution_count += 1

          print(
              "TWSE 法人資料：",
              institution_count,
              "檔"
          )

          print("")
          print(
              "讀取 TWSE PE / 殖利率 / PBR..."
          )

          pe_url = (
              "https://openapi.twse.com.tw/"
              "v1/exchangeReport/BWIBBU_ALL"
          )

          try:
              pe_rows = request_json(
                  pe_url
              )

              if isinstance(
                  pe_rows,
                  list
              ):
                  pe_count = 0

                  for row in pe_rows:
                      if not isinstance(
                          row,
                          dict
                      ):
                          continue

                      code = str(
                          first(
                              row,
                              [
                                  "Code",
                                  "證券代號"
                              ]
                          ) or ""
                      ).strip()

                      if code not in latest:
                          continue

                      latest[code][
                          "pe"
                      ] = clean(
                          first(
                              row,
                              [
                                  "PEratio",
                                  "本益比"
                              ]
                          )
                      )

                      latest[code][
                          "yield"
                      ] = clean(
                          first(
                              row,
                              [
                                  "DividendYield",
                                  "殖利率"
                              ]
                          )
                      )

                      latest[code][
                          "pbr"
                      ] = clean(
                          first(
                              row,
                              [
                                  "PBratio",
                                  "股價淨值比"
                              ]
                          )
                      )

                      pe_count += 1

                  print(
                      "TWSE PE/PBR：",

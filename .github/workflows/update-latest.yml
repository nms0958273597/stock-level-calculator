      - name: Validate latest.json
        run: |
          python - <<'PY'
          import json
          import os

          path = (
              "stock-data/latest.json"
          )

          if not os.path.exists(
              path
          ):
              raise SystemExit(
                  "找不到 latest.json"
              )

          with open(
              path,
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(
              data,
              dict
          ):
              raise SystemExit(
                  "latest.json 格式錯誤"
              )

          count = len([
              x
              for x in data
              if x != "_meta"
          ])

          print(
              "latest.json 資料筆數：",
              count
          )

          print(
              "最新交易日：",
              data.get(
                  "_meta",
                  {}
              ).get(
                  "tradeDate"
              )
          )

          print(
              "歷史資料天數：",
              data.get(
                  "_meta",
                  {}
              ).get(
                  "historyDays"
              )
          )

          if count < 100:
              raise SystemExit(
                  "資料少於 100 檔，停止提交"
              )

          print(
              "OK：latest.json 格式正常"
          )
          PY


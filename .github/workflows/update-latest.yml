          )

          def get_history_rows(
              code,
              limit=242
          ):
              rows = []

              for filename in sorted(
                  history_files,
                  reverse=True
              ):
                  path = os.path.join(
                      HISTORY_DIR,
                      filename
                  )

                  data = load_json(
                      path
                  )

                  item = data.get(
                      code
                  )

                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  price = clean(
                      item.get(
                          "price"
                      )
                  )

                  if price is None:
                      continue

                  rows.append({
                      "date":
                          data.get(
                              "_meta",
                              {}
                          ).get(

          )


          # ============================================================
          # 檢查重要股票
          # ============================================================

          print("")
          print(
              "========================================"
          )
          print(
              "重要股票檢查"
          )
          print(
              "========================================"
          )


          for code in [
              "1301",
              "1326",
              "2330",
              "0050",
              "0056",
              "00631L",
              "00919",
              "00981A"
          ]:

              print("")
              print(
                  "檢查：",
                  code
              )

              if code not in output:

                  print(
                      code,
                      "搜尋資料庫有，但目前沒有行情"
                  )

                  continue

              item = output[code]

              print(
                  json.dumps(
                      {
                          "code":
                              item.get(
                                  "code"
                              ),

                          "name":
                              item.get(
                                  "name"
                              ),

                          "price":
                              item.get(
                                  "price"
                              ),


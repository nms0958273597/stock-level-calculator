          # ============================================================
          # 讀取某股票歷史資料
          # ============================================================

          def get_history_rows(
              code,
              limit=242
          ):

              rows = []

              for filename in sorted(
                  history_files,
                  reverse=True
              ):

                  path = os.path.join(
                      HISTORY_DIR,
                      filename
                  )

                  data = load_json(
                      path
                  )

                  if not isinstance(
                      data,
                      dict
                  ):
                      continue

                  item = data.get(
                      code
                  )

                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  price = clean(
                      item.get(
                          "price"
                      )
                  )

                  if price is None:
                      continue

                  rows.append({
                      "date":
                          data.get(
                              "_meta",
                              {}
                          ).get(
                              "date"
                          ),

                      "price":
                          price,

                      "foreign":
                          clean(
                              item.get(
                                  "foreignBalance"
                              )
                          ),

                      "trust":
                          clean(
                              item.get(
                                  "trustBalance"
                              )
                          ),

                      "dealer":
                          clean(
                              item.get(
                                  "dealerBalance"
                              )
                          )
                  })

                  if len(rows) >= limit:
                      break

              return rows

          def average(
              values
          ):

              valid = [
                  value
                  for value in values
                  if value is not None
              ]

              if not valid:
                  return None

              return (
                  sum(valid)
                  /
                  len(valid)
              )

          # ============================================================
          # 計算 MA / 偏離率 / 法人累計
          # ============================================================

          for code, item in latest.items():

              rows = get_history_rows(
                  code,
                  242
              )

              prices = [
                  row["price"]
                  for row in rows
              ]

              # --------------------------------------------------------
              # 均線
              # --------------------------------------------------------

              periods = [
                  (5, "ma5"),
                  (11, "ma11"),
                  (31, "ma31"),
                  (62, "ma62"),
                  (122, "ma122"),
                  (242, "ma242")
              ]

              for period, field in periods:

                  if len(prices) >= period:

                      ma = average(
                          prices[
                              :period
                          ]
                      )

                      if ma is not None:

                          item[field] = round(
                              ma,
                              4
                          )

                          price = item.get(
                              "price"
                          )

                          if (
                              price is not None
                              and ma != 0
                          ):


                  history_path
              )


          # ============================================================
          # 讀取歷史檔
          # ============================================================

          history_files = []

          if os.path.exists(
              HISTORY_DIR
          ):

              for filename in os.listdir(
                  HISTORY_DIR
              ):

                  if (
                      filename.endswith(
                          ".json"
                      )
                      and filename[:4].isdigit()
                  ):

                      history_files.append(
                          filename
                      )

          history_files.sort(
              reverse=True
          )


          print("")
          print(
              "目前歷史資料天數：",
              len(history_files)
          )


          # ============================================================
          # 計算均線與法人累計
          # ============================================================

          def get_history_rows(
              code,
              limit=242
          ):

              rows = []

              for filename in sorted(
                  history_files,
                  reverse=True
              ):

                  path = os.path.join(
                      HISTORY_DIR,
                      filename
                  )

                  data = load_json(
                      path
                  )

                  item = data.get(
                      code
                  )

                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  price = clean(
                      item.get(
                          "price"
                      )
                  )

                  if price is None:
                      continue

                  rows.append(
                      {
                          "date":
                              data.get(
                                  "_meta",
                                  {}
                              ).get(
                                  "date"
                              ),

                          "price":
                              price,

                          "foreign":
                              clean(
                                  item.get(
                                      "foreignBalance"
                                  )
                              ),

                          "trust":
                              clean(
                                  item.get(
                                      "trustBalance"
                                  )
                              ),

                          "dealer":
                              clean(
                                  item.get(
                                      "dealerBalance"
                                  )
                              )
                      }
                  )

                  if len(rows) >= limit:
                      break

              return rows


          def average(
              values
          ):

              values = [
                  v
                  for v in values
                  if v is not None
              ]

              if not values:
                  return None

              return sum(values) / len(
                  values
              )


          for code, item in latest.items():

              rows = get_history_rows(
                  code,
                  242
              )

              prices = [
                  r["price"]
                  for r in rows
              ]

              for n, field in [
                  (5, "ma5"),
                  (11, "ma11"),
                  (31, "ma31"),
                  (62, "ma62"),
                  (122, "ma122"),
                  (242, "ma242")
              ]:

                  if len(prices) >= n:

                      ma = average(
                          prices[:n]
                      )

                      item[field] = (
                          round(
                              ma,
                              4
                          )
                          if ma is not None
                          else None
                      )

                      if (
                          item.get(
                              "price"
                          ) is not None
                          and ma
                      ):

                          deviation = (
                              (
                                  item["price"]
                                  - ma
                              )
                              / ma
                              * 100
                          )

                          item[
                              field
                              + "Deviation"
                          ] = round(
                              deviation,
                              2
                          )

              for n, field in [
                  (5, "foreign5"),
                  (11, "foreign11"),
                  (31, "foreign31")
              ]:

                  values = [
                      r["foreign"]
                      for r in rows[:n]
                      if r["foreign"]
                      is not None
                  ]

                  if len(values) == n:

                      item[field] = sum(
                          values
                      )

              for n, field in [
                  (5, "trust5"),
                  (11, "trust11"),
                  (31, "trust31")
              ]:

                  values = [
                      r["trust"]
                      for r in rows[:n]
                      if r["trust"]
                      is not None
                  ]

                  if len(values) == n:

                      item[field] = sum(
                          values
                      )

              for n, field in [
                  (5, "dealer5"),
                  (11, "dealer11"),
                  (31, "dealer31")
              ]:

                  values = [
                      r["dealer"]
                      for r in rows[:n]
                      if r["dealer"]
                      is not None
                  ]

                  if len(values) == n:

                      item[field] = sum(
                          values
                      )


          # ============================================================
          # 產生最新檔
          # ============================================================

          run_time = datetime.now(
              TW_TZ
          ).isoformat()

          all_trade_dates = [
              item.get(
                  "tradeDate"
              )
              for item in latest.values()
              if item.get(
                  "tradeDate"
              )
          ]

          latest_trade_date = max(
              all_trade_dates,
              default=twse_date_used
          )


          output = {

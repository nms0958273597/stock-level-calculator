name: Update Latest Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * 1-5"

permissions:
  contents: write

jobs:
  update-latest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update latest.json
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta

          import requests

          OUT = "stock-data/latest.json"
          STOCK_FILE = "stock-data/stocks.json"

          TW_TZ = timezone(timedelta(hours=8))

          HEADERS = {
              "User-Agent":
                  "Mozilla/5.0 (GitHub Actions stock data updater)",
              "Accept":
                  "application/json,text/plain,*/*"
          }

          def clean_number(v):
              if v is None:
                  return None

              s = str(v).strip()

              if s in (
                  "",
                  "-",
                  "--",
                  "—",
                  "null",
                  "None",
                  "N/A"
              ):
                  return None

              s = s.replace(",", "")

              try:
                  return float(s)
              except Exception:
                  return None

          def get_json(url, params=None):
              r = requests.get(
                  url,
                  params=params,
                  headers=HEADERS,
                  timeout=40
              )

              r.raise_for_status()

              return r.json()

          def normalize_date(v):
              if v is None:
                  return None

              s = str(v).strip()

              if not s:
                  return None

              # 1150903 → 2026-09-03
              if len(s) == 7 and s.isdigit():
                  y = int(s[:3]) + 1911
                  m = s[3:5]
                  d = s[5:7]
                  return f"{y}-{m}-{d}"

              # 20260903 → 2026-09-03
              if len(s) == 8 and s.isdigit():
                  return f"{s[:4]}-{s[4:6]}-{s[6:8]}"

              return s

          print("========================================")
          print("開始更新最新股票資料")
          print("========================================")

          if not os.path.exists(STOCK_FILE):
              raise Exception(
                  f"找不到 {STOCK_FILE}"
              )

          with open(
              STOCK_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              master = json.load(f)

          if isinstance(master, dict):
              stocks = (
                  master.get("data")
                  or master.get("stocks")
                  or []
              )
          else:
              stocks = master

          stock_codes = set()

          for s in stocks:

              if not isinstance(s, dict):
                  continue

              code = str(
                  s.get("code", "")
              ).strip()

              if code:
                  stock_codes.add(code)

          print(
              f"股票／ETF 搜尋資料庫："
              f"{len(stock_codes)} 檔"
          )

          # =====================================================
          # 完全重新建立 latest
          #
          # 重要：
          # 不再讀取舊 latest.json 合併，
          # 因此不會再把以前的測試法人、測試 MA、測試 PE
          # 留在正式資料裡。
          # =====================================================

          latest = {}

          run_time = datetime.now(TW_TZ).isoformat()

          # =====================================================
          # TWSE 上市日行情
          # =====================================================

          twse_url = (
              "https://openapi.twse.com.tw/v1/"
              "exchangeReport/STOCK_DAY_ALL"
          )

          try:

              print("")
              print("讀取 TWSE 上市行情...")

              rows = get_json(twse_url)

              if not isinstance(rows, list):
                  rows = []

              for row in rows:

                  if not isinstance(row, dict):
                      continue

                  code = str(
                      row.get("Code", "")
                  ).strip()

                  if not code:
                      continue

                  if code not in stock_codes:
                      continue

                  trade_date = normalize_date(
                      row.get("Date")
                  )

                  close = clean_number(
                      row.get("ClosingPrice")
                  )

                  change = clean_number(
                      row.get("Change")
                  )

                  volume = clean_number(
                      row.get("TradeVolume")
                  )

                  amount = clean_number(
                      row.get("TradeValue")
                  )

                  open_price = clean_number(
                      row.get("OpeningPrice")
                  )

                  high = clean_number(
                      row.get("HighestPrice")
                  )

                  low = clean_number(
                      row.get("LowestPrice")
                  )

                  previous = None

                  if (
                      close is not None
                      and change is not None
                  ):
                      previous = close - change

                  change_pct = None

                  if (
                      close is not None
                      and previous is not None
                      and previous != 0
                  ):
                      change_pct = (
                          change /
                          previous *
                          100
                      )

                  latest[code] = {

                      "code": code,

                      "price": close,

                      "prev": previous,

                      "open": open_price,

                      "high": high,

                      "low": low,

                      "change": change,

                      "changePct": change_pct,

                      "volume": volume,

                      "amount": amount,

                      "tradeDate": trade_date,

                      "source": "TWSE",

                      "updatedAt": run_time

                  }

              print(
                  "TWSE 行情：",
                  len([
                      x for x in latest
                      if latest[x].get("source") == "TWSE"
                  ]),
                  "檔"
              )

          except Exception as e:

              print(
                  "TWSE 行情讀取失敗：",
                  repr(e)
              )

          # =====================================================
          # TPEx 上櫃行情
          # =====================================================

          tpex_url = (
              "https://www.tpex.org.tw/openapi/"
              "v1/tpex_mainboard_quotes"
          )

          try:

              print("")
              print("讀取 TPEx 上櫃行情...")

              rows = get_json(tpex_url)

              if isinstance(rows, dict):

                  rows = (
                      rows.get("data")
                      or rows.get("aaData")
                      or []
                  )

              if not isinstance(rows, list):
                  rows = []

              tpex_count = 0

              for row in rows:

                  if not isinstance(row, dict):
                      continue

                  code = (
                      row.get("SecuritiesCompanyCode")
                      or row.get("Code")
                      or row.get("證券代號")
                      or row.get("代號")
                      or ""
                  )

                  code = str(code).strip()

                  if not code:
                      continue

                  if code not in stock_codes:
                      continue

                  trade_date = normalize_date(
                      row.get("Date")
                      or row.get("日期")
                      or row.get("交易日期")
                  )

                  close = clean_number(
                      row.get("Close")
                      or row.get("ClosingPrice")
                      or row.get("成交價")
                      or row.get("收盤")
                  )

                  change = clean_number(
                      row.get("Change")
                      or row.get("漲跌")
                      or row.get("漲跌價差")
                  )

                  volume = clean_number(
                      row.get("TradeVolume")
                      or row.get("成交量")
                      or row.get("Volume")
                  )

                  amount = clean_number(
                      row.get("TradeValue")
                      or row.get("成交金額")
                      or row.get("Amount")
                  )

                  open_price = clean_number(
                      row.get("OpeningPrice")
                      or row.get("Open")
                      or row.get("開盤")
                  )

                  high = clean_number(
                      row.get("HighestPrice")
                      or row.get("High")
                      or row.get("最高")
                  )

                  low = clean_number(
                      row.get("LowestPrice")
                      or row.get("Low")
                      or row.get("最低")
                  )

                  previous = None

                  if (
                      close is not None
                      and change is not None
                  ):
                      previous = close - change

                  change_pct = None

                  if (
                      close is not None
                      and previous is not None
                      and previous != 0
                  ):
                      change_pct = (
                          change /
                          previous *
                          100
                      )

                  latest[code] = {

                      "code": code,

                      "price": close,

                      "prev": previous,

                      "open": open_price,

                      "high": high,

                      "low": low,

                      "change": change,

                      "changePct": change_pct,

                      "volume": volume,

                      "amount": amount,

                      "tradeDate": trade_date,

                      "source": "TPEx",

                      "updatedAt": run_time

                  }

                  tpex_count += 1

              print(
                  "TPEx 行情：",
                  tpex_count,
                  "檔"
              )

          except Exception as e:

              print(
                  "TPEx 行情讀取失敗：",
                  repr(e)
              )

          # =====================================================
          # TWSE 三大法人
          #
          # 這裡只加入「真的抓到」的資料。
          # 抓不到就完全不建立數字。
          # =====================================================

          try:

              print("")
              print("讀取 TWSE 三大法人...")

              # 以台灣時間今天作為查詢日期
              today_tw = datetime.now(TW_TZ)

              date_string = (
                  today_tw.strftime("%Y%m%d")
              )

              inst_url = (
                  "https://openapi.twse.com.tw/v1/"
                  "fund/T86"
              )

              inst_rows = get_json(
                  inst_url,
                  params={
                      "date": date_string,
                      "selectType": "ALLBUT0999"
                  }
              )

              if isinstance(inst_rows, dict):

                  inst_rows = (
                      inst_rows.get("data")
                      or inst_rows.get("aaData")
                      or []
                  )

              if not isinstance(inst_rows, list):
                  inst_rows = []

              inst_count = 0

              for row in inst_rows:

                  if not isinstance(row, dict):
                      continue

                  code = (
                      row.get("證券代號")
                      or row.get("Code")
                      or ""
                  )

                  code = str(code).strip()

                  if not code:
                      continue

                  if code not in latest:
                      continue

                  foreign_buy = clean_number(
                      row.get("外陸資買進股數(不含外資自營商)")
                  )

                  foreign_sell = clean_number(
                      row.get("外陸資賣出股數(不含外資自營商)")
                  )

                  trust_buy = clean_number(
                      row.get("投信買進股數")
                  )

                  trust_sell = clean_number(
                      row.get("投信賣出股數")
                  )

                  dealer_buy = clean_number(
                      row.get("自營商買進股數")
                  )

                  dealer_sell = clean_number(
                      row.get("自營商賣出股數")
                  )

                  inst = {}

                  if (
                      foreign_buy is not None
                      and foreign_sell is not None
                  ):
                      inst["foreign"] = {
                          "buy": foreign_buy,
                          "sell": foreign_sell,
                          "balance":
                              foreign_buy - foreign_sell
                      }

                  if (
                      trust_buy is not None
                      and trust_sell is not None
                  ):
                      inst["trust"] = {
                          "buy": trust_buy,
                          "sell": trust_sell,
                          "balance":
                              trust_buy - trust_sell
                      }

                  if (
                      dealer_buy is not None
                      and dealer_sell is not None
                  ):
                      inst["dealer"] = {
                          "buy": dealer_buy,
                          "sell": dealer_sell,
                          "balance":
                              dealer_buy - dealer_sell
                      }

                  if inst:

                      latest[code][
                          "institutional"
                      ] = inst

                      latest[code][
                          "institutionalDate"
                      ] = date_string

                      inst_count += 1

              print(
                  "TWSE 法人資料：",
                  inst_count,
                  "檔"
              )

          except Exception as e:

              print(
                  "TWSE 法人資料目前無法取得：",
                  repr(e)
              )

          # =====================================================
          # 建立輸出
          # =====================================================

          output = {

              "_meta": {

                  "updatedAt": run_time,

                  "count": len(latest),

                  "source":
                      "TWSE / TPEx official data",

                  "note":
                      "本檔只保存實際取得的行情與法人資料；不保留舊測試數字。",

                  "realtime":
                      False

              }

          }

          for code in sorted(latest):

              output[code] = latest[code]

          os.makedirs(
              "stock-data",
              exist_ok=True
          )

          with open(
              OUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("========================================")
          print("完成")
          print("latest.json：", OUT)
          print("資料筆數：", len(latest))
          print("更新時間：", run_time)
          print("========================================")

          if len(latest) < 100:

              raise Exception(
                  "行情資料少於 100 檔，"
                  "為避免錯誤資料覆蓋，停止更新。"
              )

          # =====================================================
          # 顯示幾檔重要股票
          # =====================================================

          for code in [
              "1301",
              "1326",
              "2330",
              "0050",
              "00631L"
          ]:

              if code in output:

                  print("")
                  print("檢查：", code)
                  print(
                      json.dumps(
                          output[code],
                          ensure_ascii=False
                      )
                  )

              else:

                  print(
                      "",
                      code,
                      "目前沒有最新行情資料"
                  )

          PY

      - name: Check generated file
        run: |
          echo "========================================"
          echo "檢查 latest.json"
          echo "========================================"

          test -f stock-data/latest.json

          python - <<'PY'
          import json

          path = "stock-data/latest.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          codes = [
              k for k in data
              if k != "_meta"
          ]

          print(
              "latest.json 資料筆數：",
              len(codes)
          )

          print(
              "更新時間：",
              data.get("_meta", {}).get("updatedAt")
          )

          for code in [
              "1301",
              "1326",
              "2330",
              "0050",
              "00631L"
          ]:

              if code in data:

                  item = data[code]

                  print("")
                  print(
                      "==========",
                      code,
                      "=========="
                  )

                  print(
                      "交易日期：",
                      item.get("tradeDate")
                  )

                  print(
                      "價格：",
                      item.get("price")
                  )

                  print(
                      "法人：",
                      item.get("institutional")
                  )

              else:

                  print(
                      code,
                      "沒有資料"
                  )

          # 確認舊測試欄位沒有被保留下來
          test_fields = [
              "ma5",
              "ma11",
              "ma31",
              "ma62",
              "ma122",
              "ma242",
              "pe",
              "foreignBalance",
              "trustBalance",
              "dealerBalance"
          ]

          found_test = []

          for code in codes:

              item = data[code]

              for field in test_fields:

                  if field in item:
                      found_test.append(
                          (code, field)
                      )

          if found_test:

              print("")
              print(
                  "警告：仍發現舊測試欄位：",
                  found_test[:20]
              )

          else:

              print("")
              print(
                  "OK：沒有發現舊測試欄位"
              )

          PY

      - name: Commit latest.json
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock-data/latest.json

          if git diff --cached --quiet; then

            echo "沒有新的資料需要提交"

          else

            git commit \
              -m "Update latest stock data and institutional data"

            git push

          fi
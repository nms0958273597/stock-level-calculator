      - name: Commit latest and history
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            stock-data/latest.json \
            stock-data/history/

          if git diff --cached --quiet; then
            echo "沒有新的資料需要提交"
          else
            git commit \
              -m "Update latest stock data and history"

            git push
          fi
                      run_time,

                  "count":
                      len(latest),

                  "tradeDate":
                      latest_trade_date,

                  "source": [
                      "TWSE official",
                      "TPEx official"
                  ],

                  "realtime":
                      False,

                  "historyDays":
                      len(history_files),

                  "note":
                      (
                          "官方收盤資料。"
                          "前端不直接呼叫 API。"
                          "歷史資料由 GitHub Actions "
                          "持續累積。"
                      )
              }
          }


          for code in sorted(
              latest
          ):

              output[code] = latest[
                  code
              ]


          save_json(
              LATEST_FILE,

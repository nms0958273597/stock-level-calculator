name: Update 539 Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-539-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Taiwan Lottery 539 data
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.taiwanlottery.com/TLCAPIWeB/Lottery/Daily539Result"

          rm -f 539-data.json
          rm -f all-records.json
          rm -f month.json
          rm -f records.json
          rm -f tmp.json

          echo "[]" > all-records.json

          echo "======================================"
          echo "今彩539 官方資料更新開始"
          echo "======================================"

          for i in $(seq 0 59); do

            MONTH=$(date -u -d "$(date -u +%Y-%m-01) -${i} month" +%Y-%m)

            echo ""
            echo "抓取月份：$MONTH"

            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 60 \
              -A "Mozilla/5.0" \
              "${API}?month=${MONTH}&pageSize=500" \
              -o month.json

            jq -e '
              .content
              and
              (.content.daily539Res | type == "array")
            ' month.json >/dev/null

            COUNT=$(jq '.content.daily539Res | length' month.json)

            echo "本月資料：${COUNT} 筆"

            jq -s '
              .[0] + (.[1].content.daily539Res // [])
            ' all-records.json month.json > tmp.json

            mv tmp.json all-records.json

          done

          echo ""
          echo "======================================"
          echo "開始整理今彩539資料"
          echo "======================================"

          echo "原始資料：$(jq 'length' all-records.json) 筆"

          jq '
            map(
              select(type == "object")
              | select(.period != null)
              | select(.drawNumberAppear != null)
              | select(.lotteryDate != null)

              | select(
                  (.period | tostring)
                  | test("^[0-9]{9}$")
                )

              | select(
                  (.drawNumberAppear | type == "array")
                  and
                  (.drawNumberAppear | length == 5)
                )

              | select(
                  all(
                    .drawNumberAppear[];
                    ((tonumber >= 1) and (tonumber <= 39))
                  )
                )

              | select(
                  (
                    .drawNumberAppear
                    | map(tonumber)
                    | unique
                    | length
                  ) == 5
                )

              | {
                  period: (.period | tostring),
                  draw_date: (
                    .lotteryDate
                    | tostring
                    | .[0:10]
                  ),
                  numbers: (
                    .drawNumberAppear
                    | map(tonumber)
                    | sort
                  )
                }
            )

            | unique_by(.period)

            | sort_by(.period)

            | reverse

            | .[0:10000]
          ' all-records.json > records.json

          VALID_COUNT=$(jq 'length' records.json)

          echo ""
          echo "有效今彩539：${VALID_COUNT} 期"

          if [ "$VALID_COUNT" -lt 100 ]; then
            echo ""
            echo "❌ 有效資料少於100期"
            echo "為避免錯誤覆蓋，本次停止。"
            exit 1
          fi

          jq -e '
            all(
              .[];
              (.numbers | length == 5)
              and
              all(.numbers[]; . >= 1 and . <= 39)
              and
              ((.numbers | unique | length) == 5)
            )
          ' records.json >/dev/null

          LATEST_PERIOD=$(jq -r '.[0].period' records.json)
          LATEST_DATE=$(jq -r '.[0].draw_date' records.json)

          echo ""
          echo "最新期號：$LATEST_PERIOD"
          echo "最新日期：$LATEST_DATE"

          jq -n \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg latestPeriod "$LATEST_PERIOD" \
            --arg latestDate "$LATEST_DATE" \
            --slurpfile records records.json \
            '{
              gameType: "今彩539",
              gameTypeId: 539,
              updatedAt: $updatedAt,
              latestPeriod: $latestPeriod,
              latestDate: $latestDate,
              count: ($records[0] | length),
              records: $records[0]
            }' > 539-data.json

          echo ""
          echo "======================================"
          echo "最終檢查"
          echo "======================================"

          jq -e '
            .gameType == "今彩539"
            and
            .gameTypeId == 539
            and
            (.records | type == "array")
            and
            (.count == (.records | length))
            and
            (.count >= 100)
          ' 539-data.json >/dev/null

          echo ""
          echo "最新5期："

          jq -r '
            .records[0:5][]
            | "\(.period) | \(.draw_date) | \(.numbers | map(if . < 10 then ("0" + tostring) else tostring end) | join(" "))"
          ' 539-data.json

          echo ""
          echo "======================================"
          echo "539資料建立成功"
          echo "======================================"

          rm -f all-records.json
          rm -f month.json
          rm -f records.json
          rm -f tmp.json

      - name: Commit 539 data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "同步最新 main..."

          git fetch origin main

          git rebase --autostash origin/main

          git add 539-data.json

          if git diff --cached --quiet; then
            echo "沒有新的539資料需要更新"
            exit 0
          fi

          git commit -m "Update official Taiwan Lottery 539 data"

          echo "開始推送..."

          for attempt in 1 2 3; do

            if git push origin HEAD:main; then
              echo "======================================"
              echo "539資料更新成功"
              echo "======================================"
              exit 0
            fi

            echo "Push 第 ${attempt} 次失敗，重新同步 main..."

            git fetch origin main

            git rebase --autostash origin/main

          done

          echo "❌ 三次 Push 都失敗"
          exit 1
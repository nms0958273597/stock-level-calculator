<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b1118">
<title>ETF 3年真實歷史回測｜定期定額・定期不定額・高少低多</title>

<style>
:root{
  --bg:#080d13;
  --card:#111923;
  --card2:#17222e;
  --line:#283746;
  --text:#f4f7fa;
  --muted:#91a0af;
  --green:#55d68b;
  --blue:#69a9ff;
  --purple:#b48cff;
  --yellow:#ffd166;
  --red:#ff7180;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 90% 0%,#172b42 0,#080d13 42%);
  color:var(--text);
  font-family:
    -apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang TC",
    "Microsoft JhengHei",sans-serif;
}

.container{
  width:min(1120px,100%);
  margin:auto;
  padding:14px;
}

header{
  padding:14px 4px 18px;
}

h1{
  margin:0;
  font-size:27px;
  line-height:1.3;
}

.sub{
  color:var(--muted);
  margin-top:7px;
  font-size:14px;
}

.card{
  background:rgba(17,25,35,.97);
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-bottom:15px;
}

.title{
  font-size:19px;
  font-weight:900;
  margin-bottom:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:6px;
}

input,select{
  width:100%;
  min-height:46px;
  padding:10px 12px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#0b1118;
  color:var(--text);
  font-size:16px;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--blue);
}

.etfs{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;
  margin-bottom:14px;
}

.etf{
  min-height:67px;
  padding:10px;
  text-align:left;
  background:#0c131b;
  border:1px solid var(--line);
  border-radius:12px;
  color:white;
  cursor:pointer;
}

.etf:hover{
  border-color:var(--blue);
}

.etf.active{
  border-color:var(--green);
  background:#10231a;
}

.code{
  font-weight:900;
  font-size:17px;
}

.ename{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:14px;
}

button{
  min-height:46px;
  padding:11px 17px;
  border:0;
  border-radius:11px;
  font-weight:900;
  cursor:pointer;
  font-size:15px;
}

.primary{
  background:var(--green);
  color:#06110a;
}

.secondary{
  background:#293746;
  color:white;
}

.yellow{
  background:#4a4022;
  color:#ffe59a;
}

.danger{
  background:#41242a;
  color:#ffb5be;
}

.status{
  margin-top:12px;
  padding:11px 13px;
  border-radius:11px;
  background:#0b131c;
  border:1px solid var(--line);
  color:#aebac7;
  font-size:13px;
  line-height:1.7;
}

.status.ok{
  border-color:#286a49;
}

.status.err{
  border-color:#7a343e;
  color:#ffb5bd;
}

.preset{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:11px;
}

.preset button{
  min-height:40px;
  padding:8px 12px;
  background:#202c39;
  color:#dbe3eb;
  font-size:13px;
}

.results{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

.strategy{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
}

.strategy.best{
  border-color:var(--green);
  box-shadow:0 0 0 1px rgba(85,214,139,.15);
}

.strategy h3{
  margin:0;
  font-size:18px;
}

.desc{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  min-height:38px;
  margin-top:5px;
}

.big{
  font-size:28px;
  font-weight:950;
  margin:13px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.055);
  font-size:14px;
}

.row:last-child{
  border-bottom:0;
}

.label{
  color:var(--muted);
}

.value{
  font-weight:900;
}

.green{color:var(--green)}
.red{color:var(--red)}
.blue{color:var(--blue)}
.purple{color:var(--purple)}
.yellowText{color:var(--yellow)}

.summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-top:13px;
}

.stat{
  background:#0c131b;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}

.stat .slabel{
  color:var(--muted);
  font-size:12px;
}

.stat .svalue{
  margin-top:5px;
  font-size:19px;
  font-weight:900;
}

canvas{
  display:block;
  width:100%;
  height:350px;
  background:#0b1118;
  border:1px solid var(--line);
  border-radius:14px;
}

.chartScroll{
  overflow-x:auto;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:10px;
  font-size:13px;
  color:#bdc8d4;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:5px;
}

.tableScroll{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

th,td{
  padding:9px 8px;
  border-bottom:1px solid var(--line);
  text-align:right;
  white-space:nowrap;
  font-size:13px;
}

th:first-child,
td:first-child{
  text-align:left;
}

th{
  color:#aeb9c6;
}

.note{
  color:#7e8b99;
  font-size:12px;
  line-height:1.75;
  margin-top:12px;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.rank{
  display:grid;
  gap:8px;
}

.rankItem{
  display:grid;
  grid-template-columns:35px 90px 1fr 100px;
  align-items:center;
  gap:8px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0d151e;
}

.bar{
  height:8px;
  background:#243241;
  border-radius:10px;
  overflow:hidden;
}

.bar span{
  display:block;
  height:100%;
  background:var(--green);
  border-radius:10px;
}

@media(max-width:850px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .etfs{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .results{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:560px){
  .container{
    padding:10px;
  }

  h1{
    font-size:23px;
  }

  .card{
    padding:14px;
    border-radius:15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .etfs{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .summary{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>📊 ETF 3年真實歷史回測</h1>
  <div class="sub">
    定期定額 × 定期不定額 × 高少低多｜使用歷史行情逐月模擬
  </div>
</header>

<!-- ETF -->
<section class="card">

  <div class="title">① 選擇熱門 ETF</div>

  <div class="etfs" id="etfList"></div>

  <div class="grid">

    <div class="field">
      <label>ETF 代號</label>
      <input id="code" value="0050">
    </div>

    <div class="field">
      <label>ETF 名稱</label>
      <input id="name" value="元大台灣50">
    </div>

    <div class="field">
      <label>查詢開始日期</label>
      <input id="startDate" type="date" value="2022-01-01">
    </div>

    <div class="field">
      <label>查詢結束日期</label>
      <input id="endDate" type="date" value="2024-12-31">
    </div>

  </div>

  <div class="preset">
    <button type="button" data-period="2019">2019～2021</button>
    <button type="button" data-period="2020">2020～2022</button>
    <button type="button" data-period="2021">2021～2023</button>
    <button type="button" data-period="2022">2022～2024</button>
    <button type="button" data-period="2023">2023～2025</button>
    <button type="button" data-period="2024">2024～2026</button>
  </div>

</section>

<!-- 投資設定 -->
<section class="card">

  <div class="title">② 投資設定</div>

  <div class="grid">

    <div class="field">
      <label>每月投入金額</label>
      <input id="monthly" type="number" value="10000" min="0" step="100">
    </div>

    <div class="field">
      <label>高點少買</label>
      <input id="highReduce" type="number" value="40" min="0" max="90">
    </div>

    <div class="field">
      <label>低點多買</label>
      <input id="lowIncrease" type="number" value="60" min="0" max="300">
    </div>

    <div class="field">
      <label>資料模式</label>
      <select id="dataMode">
        <option value="real">真實歷史行情</option>
        <option value="demo">模擬行情</option>
      </select>
    </div>

  </div>

  <div class="actions">
    <button class="primary" id="run">🚀 開始歷史回測</button>
    <button class="secondary" id="demo">🎲 測試模擬行情</button>
    <button class="yellow" id="sample">📅 使用目前日期</button>
    <button class="danger" id="reset">↻ 重設</button>
  </div>

  <div id="status" class="status">
    尚未開始回測。
  </div>

</section>

<!-- 結果 -->
<section class="card">

  <div class="title">③ 三種策略結果</div>

  <div class="results">

    <div class="strategy" id="fixedBox">

      <h3>① 定期定額</h3>

      <div class="desc">
        每月固定投入相同金額。
      </div>

      <div class="big" id="fixedValue">$0</div>

      <div class="row">
        <span class="label">總投入</span>
        <span class="value" id="fixedInvest">$0</span>
      </div>

      <div class="row">
        <span class="label">累積股數</span>
        <span class="value" id="fixedShares">0</span>
      </div>

      <div class="row">
        <span class="label">平均成本</span>
        <span class="value" id="fixedAvg">$0</span>
      </div>

      <div class="row">
        <span class="label">期末市值</span>
        <span class="value" id="fixedEnd">$0</span>
      </div>

      <div class="row">
        <span class="label">獲利</span>
        <span class="value" id="fixedProfit">$0</span>
      </div>

      <div class="row">
        <span class="label">報酬率</span>
        <span class="value" id="fixedReturn">0%</span>
      </div>

    </div>

    <div class="strategy" id="variableBox">

      <h3>② 定期不定額</h3>

      <div class="desc">
        根據價格相對於歷史平均價格調整投入。
      </div>

      <div class="big" id="variableValue">$0</div>

      <div class="row">
        <span class="label">總投入</span>
        <span class="value" id="variableInvest">$0</span>
      </div>

      <div class="row">
        <span

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每日收入・盈餘・差額</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#f4f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",
               "Microsoft JhengHei",sans-serif;
}

body{
  padding:18px 12px 50px;
}

.container{
  max-width:820px;
  margin:0 auto;
}

h1{
  text-align:center;
  font-size:32px;
  margin:8px 0 22px;
  font-weight:900;
  color:#222;
}

.card{
  background:#fff;
  border:1px solid #dfe3e8;
  border-radius:26px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.section-title{
  font-size:28px;
  font-weight:900;
  margin-bottom:18px;
}

.date-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.date-box{
  background:#f6f8fa;
  border-radius:20px;
  padding:18px;
  text-align:center;
}

.date-box label{
  display:block;
  color:#777;
  font-size:18px;
  margin-bottom:10px;
}

.date-box input{
  width:100%;
  border:2px solid #d8dde3;
  border-radius:14px;
  padding:12px 8px;
  background:#fff;
  font-size:23px;
  font-weight:800;
  color:#222;
  text-align:center;
}

.weekday{
  font-size:30px;
  font-weight:900;
  color:#4d88df;
  min-height:42px;
}

.button-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin-top:16px;
}

button{
  border:0;
  border-radius:18px;
  min-height:62px;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  transition:.12s;
}

button:active{
  transform:scale(.97);
}

.btn-today{
  background:#ffbd4a;
  color:#222;
}

.btn-save{
  background:#63bf72;
  color:#fff;
}

.btn-clear{
  background:#e9edf1;
  color:#333;
}

.item{
  background:#f8fafc;
  border:2px solid #e0e5ea;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
}

.item-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.item-name{
  font-size:25px;
  font-weight:900;
}

.item-note{
  color:#777;
  font-size:16px;
  margin-top:5px;
}

.price-wrap{
  display:flex;
  align-items:center;
  gap:5px;
  flex-shrink:0;
}

.price-wrap span{
  color:#777;
  font-size:20px;
}

.price{
  width:130px;
  height:55px;
  border:2px solid #d6dce2;
  border-radius:15px;
  background:#fff;
  text-align:center;
  font-size:24px;
  font-weight:900;
}

.qty-row{
  display:grid;
  grid-template-columns:80px 1fr 80px;
  gap:12px;
  align-items:center;
  margin-top:18px;
}

.qty-btn{
  min-height:65px;
  background:#e8ecf0;
  color:#222;
  font-size:38px;
  line-height:1;
}

.qty{
  width:100%;
  height:65px;
  border:3px solid #d7dce1;
  border-radius:18px;
  background:#fff;
  text-align:center;
  font-size:28px;
  font-weight:900;
}

.subtotal{
  border-top:2px dashed #d8dde2;
  margin-top:18px;
  padding-top:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#777;
  font-size:19px;
}

.subtotal strong{
  color:#222;
  font-size:28px;
}

.other-box{
  background:#f8fafc;
  border:2px dashed #cfd6dd;
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
}

.other-grid{
  display:grid;
  grid-template-columns:1fr 180px;
  gap:12px;
}

.other-grid input{
  width:100%;
  height:58px;
  border:2px solid #d5dbe1;
  border-radius:15px;
  background:#fff;
  padding:0 15px;
  font-size:20px;
  font-weight:700;
}

.add-other{
  background:#e8f0ff;
  color:#3774cc;
  width:100%;
  min-height:52px;
  margin-top:10px;
}

.income-box{
  background:#eef7f0;
  border:2px solid #b9dfc0;
  border-radius:24px;
  padding:22px;
}

.income-label{
  font-size:22px;
  font-weight:900;
  color:#428c50;
}

.big-money{
  font-size:44px;
  font-weight:900;
  margin-top:6px;
}

.take-box{
  background:#fff8ed;
  border:2px solid #f1d49d;
  border-radius:24px;
  padding:22px;
  margin-top:16px;
}

.take-box label{
  display:block;
  font-size:22px;
  font-weight:900;
  color:#9b6b16;
  margin-bottom:10px;
}

.take-input{
  width:100%;
  height:70px;
  border:3px solid #e5c67f;
  border-radius:18px;
  background:#fff;
  text-align:center;
  font-size:34px;
  font-weight:900;
}

.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.result{
  border-radius:22px;
  padding:22px;
  text-align:center;
  min-height:145px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.result-title{
  font-size:20px;
  color:#666;
  font-weight:700;
}

.result-money{
  font-size:38px;
  font-weight:900;
  margin-top:8px;
}

.profit{
  background:#edf9f0;
  border:2px solid #b7dfc0;
}

.shortage{
  background:#fff0f0;
  border:2px solid #efbcbc;
}

.profit .result-money{
  color:#37994b;
}

.shortage .result-money{
  color:#d34a4a;
}

.summary{
  background:#f6f8fa;
  border-radius:22px;
  padding:18px;
  margin-top:16px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #dce1e6;
  font-size:20px;
}

.summary-row:last-child{
  border-bottom:0;
}

.summary-row strong{
  font-size:23px;
}

.history{
  overflow-x:auto;
}

.history table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}

.history th,
.history td{
  padding:13px 10px;
  border-bottom:1px solid #dfe3e8;
  text-align:center;
  font-size:17px;
}

.history th{
  background:#f0f3f6;
  font-weight:900;
}

.history button{
  min-height:42px;
  padding:5px 14px;
  font-size:15px;
  background:#e8f0ff;
  color:#3774cc;
}

.auto-save{
  text-align:center;
  color:#777;
  font-size:15px;
  margin-top:10px;
}

.danger{
  margin-top:14px;
  width:100%;
  background:#fff0f0;
  color:#c73d3d;
  border:1px solid #efb8b8;
}

@media(max-width:600px){
  body{
    padding:10px 8px 40px;
  }

  h1{
    font-size:28px;
  }

  .card{
    padding:16px;
    border-radius:22px;
  }

  .section-title{
    font-size:25px;
  }

  .date-grid{
    grid-template-columns:1fr;
  }

  .button-row{
    grid-template-columns:1fr;
  }

  .item-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .price-wrap{
    width:100%;
  }

  .price{
    flex:1;
    width:auto;
  }

  .qty-row{
    grid-template-columns:70px 1fr 70px;
  }

  .other-grid{
    grid-template-columns:1fr;
  }

  .result-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🧾 每日收入・盈餘・差額</h1>

<!-- 日期 -->
<div class="card">
  <div class="section-title">📅 日期</div>

  <div class="date-grid">

    <div class="date-box">
      <label>選擇日期</label>
      <input type="date" id="dateInput">
    </div>

    <div class="date-box">
      <label>星期</label>
      <div class="weekday" id="weekday">星期三</div>
    </div>

  </div>

  <div class="button-row">
    <button class="btn-today" id="todayBtn">今天</button>
    <button class="btn-save" id="saveBtn">💾 儲存</button>
    <button class="btn-clear" id="clearDayBtn">🗑️ 清除今天</button>
  </div>

  <div class="auto-save">
    💾 每次修改會自動儲存目前日期資料
  </div>
</div>


<!-- 固定收入 -->
<div class="card">

  <div class="section-title">🍜 固定收入項目</div>

  <!-- 麵線 -->
  <div class="item">
    <div class="item-top">
      <div>
        <div class="item-name">🍜 麵線</div>
        <div class="item-note">單價可以直接修改</div>
      </div>

      <div class="price-wrap">
        <span>$</span>
        <input class="price" id="noodlePrice" type="number" min="0" step="1" value="850">
      </div>
    </div>

    <div class="qty-row">
      <button class="qty-btn" id="noodleMinus">−</button>
      <input class="qty" id="noodleQty" type="number" min="0" step="1" value="1">
      <button class="qty-btn" id="noodlePlus">＋</button>
    </div>

    <div class="subtotal">
      <span>小計</span>
      <strong id="noodleSubtotal">$850</strong>
    </div>
  </div>


  <!-- 檸檬 -->
  <div class="item">
    <div class="item-top">
      <div>
        <div class="item-name">🍋 檸檬</div>
        <div class="item-note">單價可以直接修改</div>
      </div>

      <div class="price-wrap">
        <span>$</span>
        <input class="price" id="lemonPrice" type="number" min="0" step="1" value="1200">
      </div>
    </div>

    <div class="qty-row">
      <button class="qty-btn" id="lemonMinus">−</button>
      <input class="qty" id="lemonQty" type="number" min="0" step="1" value="1">
      <button class="qty-btn" id="lemonPlus">＋</button>
    </div>

    <div class="subtotal">
      <span>小計</span>
      <strong id="lemonSubtotal">$1,200</strong>
    </div>
  </div>


  <!-- 大腸 -->
  <div class="item">
    <div class="item-top">
      <div>
        <div class="item-name">🥣 大腸</div>
        <div class="item-note">一包單價可以直接修改</div>
      </div>

      <div class="price-wrap">
        <span>$</span>
        <input class="price" id="intestinePrice" type="number" min="0" step="1" value="150">
      </div>
    </div>

    <div class="qty-row">
      <button class="qty-btn" id="intestineMinus">−</button>
      <input class="qty" id="intestineQty" type="number" min="0" step="1" value="1">
      <button class="qty-btn" id="intestinePlus">＋</button>
    </div>

    <div class="subtotal">
      <span>小計</span>
      <strong id="intestineSubtotal">$150</strong>
    </div>
  </div>


  <!-- 蚵仔 -->
  <div class="item">
    <div class="item-top">
      <div>
        <div class="item-name">🦪 蚵仔</div>
        <div class="item-note">一包單價可以直接修改</div>
      </div>

      <div class="price-wrap">
        <span>$</span>
        <input class="price" id="oysterPrice" type="number" min="0" step="1" value="150">
      </div>
    </div>

    <div class="qty-row">
      <button class="qty-btn" id="oysterMinus">−</button>
      <input class="qty" id="oysterQty" type="number" min="0" step="1" value="1">
      <button class="qty-btn" id="oysterPlus">＋</button>
    </div>

    <div class="subtotal">
      <span>小計</span>
      <strong id="oysterSubtotal">$150</strong>
    </div>
  </div>

</div>


<!-- 其他收入 -->
<div class="card">

  <div class="section-title">➕ 其他項目收入</div>

  <div id="otherContainer">

    <div class="other-box other-row">

      <div class="other-grid">

        <input
          type="text"
          class="otherName"
          placeholder="項目名稱（可空白）"
        >

        <input
          type="number"
          class="otherAmount"
          min="0"
          step="1"
          placeholder="金額"
        >

      </div>

    </div>

  </div>

  <button class="add-other" id="addOtherBtn">
    ＋ 新增其他收入
  </button>

</div>


<!-- 收入 -->
<div class="card">

  <div class="income-box">

    <div class="income-label">💵 收入</div>

    <div class="big-money" id="totalIncome">
      $2,350
    </div>

  </div>

  <div class="take-box">

    <label>💸 拿</label>

    <input
      class="take-input"
      id="takeInput"
      type="number"
      min="0"
      step="1"
      placeholder="請輸入拿的金額"
    >

  </div>

</div>


<!-- 今日結果 -->
<div class="card">

  <div class="section-title">📊 今日結果</div>

  <div class="result-grid">

    <div class="result profit">
      <div class="result-title">收入 − 拿</div>
      <div class="result-money" id="dailyDifference">$2,350</div>
    </div>

    <div class="result shortage">
      <div class="result-title">不足差額</div>
      <div class="result-money" id="dailyShortage">$0</div>
    </div>

  </div>

  <div class="summary">

    <div class="summary-row">
      <span>今日收入</span>
      <strong id="summaryIncome">$2,350</strong>
    </div>

    <div class="summary-row">
      <span>今日拿</span>
      <strong id="summaryTake">$0</strong>
    </div>

    <div class="summary-row">
      <span>今日盈餘</span>
      <strong id="summaryProfit">$2,350</strong>
    </div>

    <div class="summary-row">
      <span>今日差額</span>
      <strong id="summaryShortage">$0</strong>
    </div>

  </div>

</div>


<!-- 累加 -->
<div class="card">

  <div class="section-title">📈 累加統計</div>

  <div class="result-grid">

    <div class="result profit">
      <div class="result-title">盈餘累加</div>
      <div class="result-money" id="totalProfit">$0</div>
    </div>

    <div class="result shortage">
      <div class="result-title">差額累加</div>
      <div class="result-money" id="totalShortage">$0</div>
    </div>

  </div>

  <button class="danger" id="clearAllBtn">
    🗑️ 清除全部紀錄
  </button>

</div>


<!-- 歷史紀錄 -->
<div class="card">

  <div class="section-title">📚 每日紀錄</div>

  <div class="history">

    <table>

      <thead>
        <tr>
          <th>日期</th>
          <th>星期</th>
          <th>收入</th>
          <th>拿</th>
          <th>盈餘</th>
          <th>差額</th>
          <th>操作</th>
        </tr>
      </thead>

      <tbody id="historyBody"></tbody>

    </table>

  </div>

</div>

</div>


<script>
(function(){

  const STORAGE_KEY = "daily_income_profit_shortage_v3";

  const $ = id => document.getElementById(id);

  const ids = [
    "dateInput",
    "weekday",
    "todayBtn",
    "saveBtn",
    "clearDayBtn",
    "clearAllBtn",
    "addOtherBtn",
    "otherContainer",
    "takeInput",
    "totalIncome",
    "dailyDifference",
    "dailyShortage",
    "summaryIncome",
    "summaryTake",
    "summaryProfit",
    "summaryShortage",
    "totalProfit",
    "totalShortage",
    "historyBody"
  ];

  function pad(n){
    return String(n).padStart(2,"0");
  }

  function getToday(){
    const d = new Date();
    return d.getFullYear() + "-" +
           pad(d.getMonth()+1) + "-" +
           pad(d.getDate());
  }

  function getWeekday(dateString){
    if(!dateString) return "";

    const parts = dateString.split("-");
    const d = new Date(
      Number(parts[0]),
      Number(parts[1])-1,
      Number(parts[2])
    );

    const names = [
      "星期日",
      "星期一",
      "星期二",
      "星期三",
      "星期四",
      "星期五",
      "星期六"
    ];

    return names[d.getDay()];
  }

  function money(value){
    const n = Number(value) || 0;
    return "$" + Math.round(n).toLocaleString("zh-TW");
  }

  function loadDatabase(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {};
      const data = JSON.parse(raw);
      return data && typeof data === "object" ? data : {};
    }catch(e){
      return {};
    }
  }

  function saveDatabase(db){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }

  function currentDate(){
    return $("dateInput").value || getToday();
  }

  function getNumber(id){
    const value = parseFloat($(id).value);
    return Number.isFinite(value) ? value : 0;
  }

  function getOtherData(){
    const rows = [];

    document.querySelectorAll(".other-row").forEach(row => {

      const nameInput = row.querySelector(".otherName");
      const amountInput = row.querySelector(".otherAmount");

      const name = nameInput ? nameInput.value : "";
      const amount = amountInput ? parseFloat(amountInput.value) || 0 : 0;

      if(name.trim() !== "" || amount !== 0){
        rows.push({
          name:name,
          amount:amount
        });
      }
    });

    return rows;
  }

  function collectCurrentData(){

    return {

      noodlePrice:getNumber("noodlePrice"),
      noodleQty:getNumber("noodleQty"),

      lemonPrice:getNumber("lemonPrice"),
      lemonQty:getNumber("lemonQty"),

      intestinePrice:getNumber("intestinePrice"),
      intestineQty:getNumber("intestineQty"),

      oysterPrice:getNumber("oysterPrice"),
      oysterQty:getNumber("oysterQty"),

      other:getOtherData(),

      take:getNumber("takeInput")

    };
  }

  function defaultData(){

    return {

      noodlePrice:850,
      noodleQty:1,

      lemonPrice:1200,
      lemonQty:1,

      intestinePrice:150,
      intestineQty:1,

      oysterPrice:150,
      oysterQty:1,

      other:[],

      take:0

    };

  }

  function setValue(id,value){

    const el = $(id);

    if(!el) return;

    if(value === undefined || value === null){
      el.value = "";
    }else{
      el.value = value;
    }
  }

  function clearOtherRows(){

    const container = $("otherContainer");

    container.innerHTML = "";

    addOtherRow();

  }

  function addOtherRow(data){

    const container = $("otherContainer");

    const box = document.createElement("div");

    box.className = "other-box other-row";

    box.innerHTML = `
      <div class="other-grid">

        <input
          type="text"
          class="otherName"
          placeholder="項目名稱（可空白）"
        >

        <input
          type="number"
          class="otherAmount"
          min="0"
          step="1"
          placeholder="金額"
        >

      </div>
    `;

    container.appendChild(box);

    if(data){

      const nameInput = box.querySelector(".otherName");
      const amountInput = box.querySelector(".otherAmount");

      nameInput.value = data.name || "";

      if(Number(data.amount) !== 0){
        amountInput.value = data.amount;
      }

    }

    bindOtherRow(box);

  }

  function bindOtherRow(row){

    const inputs = row.querySelectorAll("input");

    inputs.forEach(input => {

      input.addEventListener("input", function(){

        calculate();

        autoSave();

      });

      input.addEventListener("change", function(){

        calculate();

        autoSave();

      });

    });

  }

  function loadDate(date){

    const db = loadDatabase();

    const data = db[date] || defaultData();

    setValue("noodlePrice",data.noodlePrice);
    setValue("noodleQty",data.noodleQty);

    setValue("lemonPrice",data.lemonPrice);
    setValue("lemonQty",data.lemonQty);

    setValue("intestinePrice",data.intestinePrice);
    setValue("intestineQty",data.intestineQty);

    setValue("oysterPrice",data.oysterPrice);
    setValue("oysterQty",data.oysterQty);

    setValue("take",data.take);

    $("takeInput").value = data.take || "";

    clearOtherRows();

    if(Array.isArray(data.other) && data.other.length){

      const container = $("otherContainer");

      container.innerHTML = "";

      data.other.forEach(item => {
        addOtherRow(item);
      });

    }

    $("weekday").textContent = getWeekday(date);

    calculate();

    renderHistory();

  }

  function saveCurrent(showMessage){

    const date = currentDate();

    if(!date) return;

    const db = loadDatabase();

    const data = collectCurrentData();

    const income = calculateIncome(data);

    const difference = income - data.take;

    db[date] = {

      ...data,

      income:income,

      difference:difference,

      updatedAt:new Date().toISOString()

    };

    saveDatabase(db);

    if(showMessage){

      alert(
        "已儲存！\n\n" +
        date + " " + getWeekday(date) +
        "\n收入：" + money(income) +
        "\n拿：" + money(data.take) +
        "\n結果：" + money(difference)
      );

    }

    renderHistory();
    updateAccumulated();

  }

  function autoSave(){

    saveCurrent(false);

  }

  function calculateIncome(data){

    let total = 0;

    total += Number(data.noodlePrice || 0) *
             Number(data.noodleQty || 0);

    total += Number(data.lemonPrice || 0) *
             Number(data.lemonQty || 0);

    total += Number(data.intestinePrice || 0) *
             Number(data.intestineQty || 0);

    total += Number(data.oysterPrice || 0) *
             Number(data.oysterQty || 0);

    if(Array.isArray(data.other)){

      data.other.forEach(item => {

        total += Number(item.amount || 0);

      });

    }

    return total;

  }

  function calculate(){

    const data = collectCurrentData();

    const noodleSubtotal =
      data.noodlePrice * data.noodleQty;

    const lemonSubtotal =
      data.lemonPrice * data.lemonQty;

    const intestineSubtotal =
      data.intestinePrice * data.intestineQty;

    const oysterSubtotal =
      data.oysterPrice * data.oysterQty;

    const income = calculateIncome(data);

    const difference = income - data.take;

    const profit = difference > 0 ? difference : 0;

    const shortage = difference < 0 ? Math.abs(difference) : 0;

    $("noodleSubtotal").textContent = money(noodleSubtotal);
    $("lemonSubtotal").textContent = money(lemonSubtotal);
    $("intestineSubtotal").textContent = money(intestineSubtotal);
    $("oysterSubtotal").textContent = money(oysterSubtotal);

    $("totalIncome").textContent = money(income);

    $("dailyDifference").textContent = money(difference);

    $("dailyShortage").textContent = money(shortage);

    $("summaryIncome").textContent = money(income);

    $("summaryTake").textContent = money(data.take);

    $("summaryProfit").textContent = money(profit);

    $("summaryShortage").textContent = money(shortage);

    updateAccumulated();

    return {
      income,
      difference,
      profit,
      shortage
    };

  }

  function updateAccumulated(){

    const db = loadDatabase();

    let profitTotal = 0;
    let shortageTotal = 0;

    Object.keys(db).forEach(date => {

      const data = db[date];

      const income =
        Number(data.income) ||
        calculateIncome(data);

      const take =
        Number(data.take) || 0;

      const difference =
        income - take;

      if(difference > 0){

        profitTotal += difference;

      }else if(difference < 0){

        shortageTotal += Math.abs(difference);

      }

    });

    $("totalProfit").textContent = money(profitTotal);

    $("totalShortage").textContent = money(shortageTotal);

  }

  function setQty(id,change){

    const input = $(id);

    let value = parseInt(input.value,10);

    if(!Number.isFinite(value)){
      value = 0;
    }

    value += change;

    if(value < 0){
      value = 0;
    }

    input.value = value;

    calculate();

    autoSave();

  }

  function bindQty(minusId,plusId,qtyId){

    $(minusId).addEventListener("click",function(){
      setQty(qtyId,-1);
    });

    $(plusId).addEventListener("click",function(){
      setQty(qtyId,1);
    });

  }

  function bindInput(id){

    const el = $(id);

    el.addEventListener("input",function(){

      calculate();

      autoSave();

    });

    el.addEventListener("change",function(){

      calculate();

      autoSave();

    });

  }

  function renderHistory(){

    const db = loadDatabase();

    const dates = Object.keys(db).sort().reverse();

    const body = $("historyBody");

    body.innerHTML = "";

    if(!dates.length){

      body.innerHTML = `
        <tr>
          <td colspan="7" style="padding:25px;color:#888;">
            尚無儲存紀錄
          </td>
        </tr>
      `;

      return;

    }

    dates.forEach(date => {

      const data = db[date];

      const income =
        Number(data.income) ||
        calculateIncome(data);

      const take =
        Number(data.take) || 0;

      const difference =
        income - take;

      const profit =
        difference > 0 ? difference : 0;

      const shortage =
        difference < 0 ? Math.abs(difference) : 0;

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${date}</td>
        <td>${getWeekday(date)}</td>
        <td>${money(income)}</td>
        <td>${money(take)}</td>
        <td style="color:#37994b;font-weight:900;">
          ${money(profit)}
        </td>
        <td style="color:#d34a4a;font-weight:900;">
          ${money(shortage)}
        </td>
        <td>
          <button data-date="${date}" class="load-record">
            查看
          </button>
        </td>
      `;

      body.appendChild(tr);

    });

    body.querySelectorAll(".load-record").forEach(button => {

      button.addEventListener("click",function(){

        const date = this.dataset.date;

        $("dateInput").value = date;

        $("weekday").textContent = getWeekday(date);

        loadDate(date);

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      });

    });

  }

  function clearCurrentDate(){

    const date = currentDate();

    const db = loadDatabase();

    const exists = Object.prototype.hasOwnProperty.call(db,date);

    if(!exists){

      alert(
        date + " " + getWeekday(date) +
        "\n目前沒有儲存紀錄。"
      );

      return;

    }

    const ok = confirm(
      "⚠️ 確定要清除這一天嗎？\n\n" +
      date + " " + getWeekday(date) +
      "\n\n只會刪除目前選擇的日期，不會影響其他日期。"
    );

    if(!ok) return;

    delete db[date];

    saveDatabase(db);

    loadDate(date);

    alert("已清除 " + date + " 的紀錄。");

  }

  function clearAll(){

    const db = loadDatabase();

    const count = Object.keys(db).length;

    if(count === 0){

      alert("目前沒有任何紀錄。");

      return;

    }

    const ok = confirm(
      "⚠️ 確定要清除全部紀錄嗎？\n\n" +
      "共有 " + count + " 天資料。\n\n" +
      "此操作會刪除所有日期的記帳資料，無法復原！"
    );

    if(!ok) return;

    const ok2 = confirm(
      "再次確認：真的要全部刪除嗎？\n\n" +
      "請按「確定」才會刪除。"
    );

    if(!ok2) return;

    localStorage.removeItem(STORAGE_KEY);

    loadDate(currentDate());

    renderHistory();

    updateAccumulated();

    alert("全部紀錄已清除。");

  }

  function setToday(){

    const oldDate = currentDate();

    saveCurrent(false);

    const today = getToday();

    $("dateInput").value = today;

    $("weekday").textContent = getWeekday(today);

    loadDate(today);

  }

  function dateChanged(){

    const newDate = $("dateInput").value;

    if(!newDate) return;

    $("weekday").textContent = getWeekday(newDate);

    loadDate(newDate);

  }

  function setup(){

    $("dateInput").value = getToday();

    $("weekday").textContent = getWeekday(getToday());

    bindQty(
      "noodleMinus",
      "noodlePlus",
      "noodleQty"
    );

    bindQty(
      "lemonMinus",
      "lemonPlus",
      "lemonQty"
    );

    bindQty(
      "intestineMinus",
      "intestinePlus",
      "intestineQty"
    );

    bindQty(
      "oysterMinus",
      "oysterPlus",
      "oysterQty"
    );

    bindInput("noodlePrice");
    bindInput("noodleQty");

    bindInput("lemonPrice");
    bindInput("lemonQty");

    bindInput("intestinePrice");
    bindInput("intestineQty");

    bindInput("oysterPrice");
    bindInput("oysterQty");

    bindInput("takeInput");

    $("dateInput").addEventListener(
      "change",
      dateChanged
    );

    $("todayBtn").addEventListener(
      "click",
      setToday
    );

    $("saveBtn").addEventListener(
      "click",
      function(){
        calculate();
        saveCurrent(true);
      }
    );

    $("clearDayBtn").addEventListener(
      "click",
      clearCurrentDate
    );

    $("clearAllBtn").addEventListener(
      "click",
      clearAll
    );

    $("addOtherBtn").addEventListener(
      "click",
      function(){

        addOtherRow();

        autoSave();

      }
    );

    loadDate(getToday());

  }

  setup();

})();
</script>

</body>
</html>

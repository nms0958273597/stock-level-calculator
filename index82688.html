<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>每日收入・盈餘・差額</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f3f6fa;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",Arial,sans-serif}
body{padding:12px 10px 40px}
.container{max-width:820px;margin:auto}
h1{font-size:30px;text-align:center;margin:8px 0 14px;font-weight:900}
.card{background:#fff;border:1px solid #dfe4ea;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.title{font-size:25px;font-weight:900;margin-bottom:10px}
.date-grid{display:grid;grid-template-columns:1.35fr .8fr;gap:9px}
.date-box{background:#f7f8fa;border-radius:14px;padding:10px;text-align:center}
.label{font-size:15px;color:#777;margin-bottom:4px}
.date-box input{width:100%;border:0;background:transparent;text-align:center;font-size:23px;font-weight:900;color:#222;outline:none}
.weekday{font-size:24px;font-weight:900;color:#4f88df;padding:7px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
button{border:0;border-radius:13px;font-size:19px;font-weight:900;padding:12px;cursor:pointer}
.today{background:#f6bd4f}
.save{background:#65bd70;color:#fff}
.clear{background:#eef0f3;color:#333}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;background:#f7f8fa;border:1px solid #e1e5ea;border-radius:15px;padding:9px 10px;margin-bottom:7px}
.item-main{min-width:0}
.item-name{font-size:21px;font-weight:900}
.item-note{font-size:13px;color:#888;margin-top:1px}
.price-wrap{display:flex;align-items:center;gap:2px}
.price-wrap span{font-size:17px;color:#777}
.price{width:105px;height:42px;border:2px solid #d7dce2;border-radius:11px;background:#fff;text-align:center;font-size:20px;font-weight:900;outline:none}
.qty-row{grid-column:1/-1;display:grid;grid-template-columns:52px 1fr 52px;gap:7px}
.qty-btn{height:44px;background:#e9edf3;color:#397fe4;font-size:29px;padding:0}
.qty{height:44px;width:100%;border:2px solid #d8dde4;border-radius:11px;background:#fff;text-align:center;font-size:22px;font-weight:900;outline:none}
.subtotal{grid-column:1/-1;border-top:1px dashed #d8dce1;padding-top:5px;display:flex;justify-content:space-between;font-size:15px;color:#777}
.subtotal strong{font-size:20px;color:#222}
.other-row{display:grid;grid-template-columns:1fr 125px 44px;gap:7px;margin-bottom:7px}
.other-row input{height:42px;border:2px solid #d8dde4;border-radius:11px;background:#fff;padding:0 10px;font-size:17px;outline:none}
.other-del{background:#ffe9e9;color:#d24d4d;padding:0;font-size:20px}
.add-other{width:100%;background:#e9f0ff;color:#4678c8}
.total-box{display:flex;justify-content:space-between;align-items:center;background:#eef9f0;border:2px solid #bde3c4;border-radius:15px;padding:12px 15px}
.total-label{font-size:23px;font-weight:900;color:#4f8e58}
.total-value{font-size:34px;font-weight:900;color:#3f9650}
.take-box{background:#fff9ec;border:2px solid #ecd18c;border-radius:15px;padding:10px 14px}
.take-label{font-size:23px;font-weight:900;color:#8c6b20;margin-bottom:6px}
.take-input{width:100%;height:52px;border:2px solid #e2ca87;border-radius:13px;background:#fff;text-align:center;font-size:29px;font-weight:900;outline:none}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.result{border-radius:16px;padding:12px;text-align:center;border:2px solid}
.result.profit{background:#effaf1;border-color:#bde4c5}
.result.loss{background:#fff0f0;border-color:#efc1c1}
.result-label{font-size:17px;color:#777}
.result-value{font-size:32px;font-weight:900;margin-top:3px}
.profit .result-value{color:#469651}
.loss .result-value{color:#cf4d4d}
.summary{background:#f7f8fa;border-radius:15px;padding:8px 13px;margin-top:9px}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd;font-size:19px}
.summary-row:last-child{border-bottom:0}
.summary-row strong{font-size:21px}
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acc{border-radius:15px;padding:12px;text-align:center;border:2px solid}
.acc.profit{background:#effaf1;border-color:#bde4c5}
.acc.loss{background:#fff0f0;border-color:#efc1c1}
.acc-label{font-size:17px;color:#777}
.acc-value{font-size:30px;font-weight:900}
.acc.profit .acc-value{color:#469651}
.acc.loss .acc-value{color:#cf4d4d}
.history-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.history-save{background:#65bd70;color:#fff}
.history-clear{background:#ffe9e9;color:#c94d4d}
.clear-all{width:100%;background:#fff0f0;color:#c94d4d;margin-top:9px;border:1px solid #efbcbc}
.history-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{background:#edf1f5;padding:9px 5px;font-size:16px}
td{padding:9px 5px;text-align:center;border-bottom:1px solid #e0e4e8;font-size:15px;white-space:nowrap}
td button{padding:5px 9px;font-size:14px;background:#ffe9e9;color:#c94d4d}
.empty{text-align:center;color:#999;padding:15px}
.small-note{text-align:center;color:#888;font-size:13px;margin-top:7px}
@media(max-width:500px){
body{padding:7px 6px 30px}
.card{border-radius:16px;padding:10px;margin-bottom:7px}
h1{font-size:25px;margin:5px 0 9px}
.title{font-size:22px;margin-bottom:7px}
.item{padding:7px 8px;margin-bottom:5px}
.item-name{font-size:19px}
.price{width:92px;height:38px;font-size:18px}
.qty-row{grid-template-columns:47px 1fr 47px}
.qty-btn,.qty{height:40px}
.total-label,.take-label{font-size:20px}
.total-value{font-size:29px}
.take-input{height:48px;font-size:27px}
.result-value{font-size:29px}
.acc-value{font-size:27px}
}
</style>
</head>

<body>
<div class="container">

<h1>🧾 每日收入・盈餘・差額</h1>

<div class="card">
<div class="title">📅 日期</div>
<div class="date-grid">
<div class="date-box">
<div class="label">日期（可自由修改）</div>
<input id="dateInput" type="date">
</div>
<div class="date-box">
<div class="label">星期</div>
<div id="weekday" class="weekday">星期三</div>
</div>
</div>
<div class="btn-row">
<button class="today" onclick="setToday()">今天</button>
<button class="clear" onclick="clearToday()">🗑️ 清除今天</button>
</div>
</div>

<div class="card">
<div class="section-head">
<div class="title">🍜 固定收入</div>
</div>

<div id="fixedItems"></div>

<div id="otherSection">
<div class="section-head">
<div class="title">＋ 其他項目收入</div>
</div>
<div id="otherItems"></div>
<button class="add-other" onclick="addOther()">＋ 新增其他收入</button>
</div>
</div>

<div class="card">
<div class="total-box">
<div class="total-label">💵 收入</div>
<div id="incomeTotal" class="total-value">$0</div>
</div>
</div>

<div class="card">
<div class="take-box">
<div class="take-label">💸 拿</div>
<input id="takeInput" class="take-input" type="number" inputmode="decimal" min="0" value="0" placeholder="請輸入拿的金額">
</div>
</div>

<div class="card">
<div class="title">📊 今日結果</div>

<div class="result-grid">
<div class="result profit">
<div class="result-label">收入 − 拿</div>
<div id="profitValue" class="result-value">$0</div>
</div>

<div class="result loss">
<div class="result-label">不足差額</div>
<div id="lossValue" class="result-value">$0</div>
</div>
</div>

<div class="summary">
<div class="summary-row">
<span>今日收入</span>
<strong id="sumIncome">$0</strong>
</div>
<div class="summary-row">
<span>今日拿</span>
<strong id="sumTake">$0</strong>
</div>
<div class="summary-row">
<span>今日盈餘</span>
<strong id="sumProfit">$0</strong>
</div>
<div class="summary-row">
<span>今日差額</span>
<strong id="sumLoss">$0</strong>
</div>
</div>
</div>

<div class="card">
<div class="title">📈 累加統計</div>

<div class="acc-grid">
<div class="acc profit">
<div class="acc-label">盈餘累加</div>
<div id="profitAccum" class="acc-value">$0</div>
</div>
<div class="acc loss">
<div class="acc-label">差額累加</div>
<div id="lossAccum" class="acc-value">$0</div>
</div>
</div>

<button class="clear-all" onclick="clearAll()">🗑️ 清除全部紀錄</button>
</div>

<div class="card">
<div class="title">📚 每日紀錄</div>

<div class="history-actions">
<button class="history-save" onclick="saveToday(true)">💾 儲存今天</button>
<button class="history-clear" onclick="clearToday()">🗑️ 清除今天</button>
</div>

<div class="history-wrap">
<table>
<thead>
<tr>
<th>日期</th>
<th>星期</th>
<th>收入</th>
<th>拿</th>
<th>盈餘</th>
<th>差額</th>
<th>操作</th>
</tr>
</thead>
<tbody id="historyBody"></tbody>
</table>
</div>

<div class="small-note">資料會自動儲存在此裝置</div>
</div>

</div>

<script>
const STORAGE_KEY="daily_income_records_v20260826";
const CURRENT_KEY="daily_income_current_v20260826";

const fixedDefault=[
 {id:"noodle",name:"🍜 麵線",price:850,qty:1,note:"單價可自由修改"},
 {id:"lemon",name:"🍋 檸檬",price:1200,qty:1,note:"單價可自由修改"},
 {id:"intestine",name:"🥣 大腸",price:150,qty:0,note:"一包 $150"},
 {id:"oyster",name:"🦪 蚵仔",price:150,qty:0,note:"一包 $150"}
];

let fixedItems=[];
let others=[];
let records={};

function fmt(n){
 n=Number(n)||0;
 return "$"+Math.round(n).toLocaleString("zh-TW");
}

function todayStr(){
 const d=new Date();
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,"0");
 const day=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}

function weekdayText(dateStr){
 if(!dateStr)return "";
 const d=new Date(dateStr+"T00:00:00");
 const arr=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
 return arr[d.getDay()];
}

function loadStorage(){
 try{
   records=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
 }catch(e){records={};}

 try{
   const cur=JSON.parse(localStorage.getItem(CURRENT_KEY)||"null");
   if(cur){
     fixedItems=cur.fixedItems||JSON.parse(JSON.stringify(fixedDefault));
     others=cur.others||[];
     document.getElementById("takeInput").value=cur.take||0;
   }else{
     fixedItems=JSON.parse(JSON.stringify(fixedDefault));
     others=[];
   }
 }catch(e){
   fixedItems=JSON.parse(JSON.stringify(fixedDefault));
   others=[];
 }
}

function saveCurrent(){
 const data={
   fixedItems,
   others,
   take:Number(document.getElementById("takeInput").value)||0
 };
 localStorage.setItem(CURRENT_KEY,JSON.stringify(data));
}

function getDate(){
 return document.getElementById("dateInput").value||todayStr();
}

function renderFixed(){
 const box=document.getElementById("fixedItems");
 box.innerHTML="";

 fixedItems.forEach((item,index)=>{
   const subtotal=(Number(item.price)||0)*(Number(item.qty)||0);

   const el=document.createElement("div");
   el.className="item";

   el.innerHTML=`
     <div class="item-main">
       <div class="item-name">${item.name}</div>
       <div class="item-note">${item.note||"單價可自由修改"}</div>
     </div>

     <div class="price-wrap">
       <span>$</span>
       <input class="price" type="number" inputmode="decimal"
         value="${item.price}"
         onchange="changePrice(${index},this.value)"
         oninput="changePrice(${index},this.value)">
     </div>

     <div class="qty-row">
       <button class="qty-btn" onclick="changeQty(${index},-1)">−</button>
       <input class="qty" type="number" inputmode="numeric" min="0"
         value="${item.qty}"
         onchange="setQty(${index},this.value)"
         oninput="setQty(${index},this.value)">
       <button class="qty-btn" onclick="changeQty(${index},1)">＋</button>
     </div>

     <div class="subtotal">
       <span>小計</span>
       <strong>${fmt(subtotal)}</strong>
     </div>
   `;
   box.appendChild(el);
 });
}

function renderOthers(){
 const box=document.getElementById("otherItems");
 box.innerHTML="";

 others.forEach((item,index)=>{
   const row=document.createElement("div");
   row.className="other-row";

   row.innerHTML=`
     <input type="text" value="${escapeHtml(item.name||"")}"
       placeholder="項目名稱（可空白）"
       oninput="changeOtherName(${index},this.value)">
     <input type="number" inputmode="decimal" value="${item.amount||0}"
       placeholder="金額"
       oninput="changeOtherAmount(${index},this.value)">
     <button class="other-del" onclick="removeOther(${index})">×</button>
   `;

   box.appendChild(row);
 });
}

function escapeHtml(str){
 return String(str)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function changePrice(index,value){
 fixedItems[index].price=Number(value)||0;
 calculate();
 saveCurrent();
}

function changeQty(index,value){
 fixedItems[index].qty=Math.max(0,Number(value)||0);
 renderFixed();
 calculate();
 saveCurrent();
}

function setQty(index,value){
 fixedItems[index].qty=Math.max(0,Number(value)||0);
 calculate();
 saveCurrent();
}

function changeOtherName(index,value){
 others[index].name=value;
 calculate();
 saveCurrent();
}

function changeOtherAmount(index,value){
 others[index].amount=Number(value)||0;
 calculate();
 saveCurrent();
}

function addOther(){
 others.push({name:"",amount:0});
 renderOthers();
 saveCurrent();
 setTimeout(()=>{
   const inputs=document.querySelectorAll("#otherItems input");
   if(inputs.length)inputs[inputs.length-2]?.focus();
 },50);
}

function removeOther(index){
 others.splice(index,1);
 renderOthers();
 calculate();
 saveCurrent();
}

function incomeTotal(){
 let total=0;

 fixedItems.forEach(item=>{
   total+=(Number(item.price)||0)*(Number(item.qty)||0);
 });

 others.forEach(item=>{
   total+=Number(item.amount)||0;
 });

 return total;
}

function calculate(){
 const income=incomeTotal();
 const take=Number(document.getElementById("takeInput").value)||0;

 const diff=income-take;
 const profit=Math.max(diff,0);
 const loss=Math.max(-diff,0);

 document.getElementById("incomeTotal").textContent=fmt(income);
 document.getElementById("profitValue").textContent=fmt(profit);
 document.getElementById("lossValue").textContent=fmt(loss);

 document.getElementById("sumIncome").textContent=fmt(income);
 document.getElementById("sumTake").textContent=fmt(take);
 document.getElementById("sumProfit").textContent=fmt(profit);
 document.getElementById("sumLoss").textContent=fmt(loss);

 calculateAccum();
}

function calculateAccum(){
 let profit=0;
 let loss=0;

 Object.values(records).forEach(r=>{
   profit+=Number(r.profit)||0;
   loss+=Number(r.loss)||0;
 });

 const currentDate=getDate();

 if(records[currentDate]){
   const current=records[currentDate];
   profit+=0;
   loss+=0;
 }

 document.getElementById("profitAccum").textContent=fmt(profit);
 document.getElementById("lossAccum").textContent=fmt(loss);
}

function getCurrentData(){
 const income=incomeTotal();
 const take=Number(document.getElementById("takeInput").value)||0;
 const diff=income-take;

 return {
   date:getDate(),
   weekday:weekdayText(getDate()),
   income,
   take,
   profit:Math.max(diff,0),
   loss:Math.max(-diff,0),
   fixedItems:JSON.parse(JSON.stringify(fixedItems)),
   others:JSON.parse(JSON.stringify(others))
 };
}

function saveToday(showMessage=false){
 const data=getCurrentData();
 records[data.date]=data;
 localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
 renderHistory();
 calculateAccum();

 if(showMessage){
   alert("✅ 今天的紀錄已儲存！");
 }
}

function autoSave(){
 saveToday(false);
 saveCurrent();
}

function renderHistory(){
 const body=document.getElementById("historyBody");
 body.innerHTML="";

 const arr=Object.values(records).sort((a,b)=>b.date.localeCompare(a.date));

 if(!arr.length){
   body.innerHTML=`<tr><td colspan="7" class="empty">目前還沒有每日紀錄</td></tr>`;
   return;
 }

 arr.forEach(r=>{
   const tr=document.createElement("tr");

   tr.innerHTML=`
     <td>${r.date}</td>
     <td>${r.weekday}</td>
     <td>${fmt(r.income)}</td>
     <td>${fmt(r.take)}</td>
     <td style="color:#469651;font-weight:900">${fmt(r.profit)}</td>
     <td style="color:#cf4d4d;font-weight:900">${fmt(r.loss)}</td>
     <td>
       <button onclick="loadRecord('${r.date}')">載入</button>
     </td>
   `;

   body.appendChild(tr);
 });
}

function loadRecord(date){
 const r=records[date];
 if(!r)return;

 document.getElementById("dateInput").value=r.date;
 document.getElementById("weekday").textContent=r.weekday;

 fixedItems=JSON.parse(JSON.stringify(r.fixedItems||fixedDefault));
 others=JSON.parse(JSON.stringify(r.others||[]));

 document.getElementById("takeInput").value=r.take||0;

 renderFixed();
 renderOthers();
 calculate();
 saveCurrent();

 window.scrollTo({top:0,behavior:"smooth"});
}

function setToday(){
 const d=todayStr();
 document.getElementById("dateInput").value=d;
 updateWeekday();

 const r=records[d];

 if(r){
   fixedItems=JSON.parse(JSON.stringify(r.fixedItems||fixedDefault));
   others=JSON.parse(JSON.stringify(r.others||[]));
   document.getElementById("takeInput").value=r.take||0;
 }else{
   fixedItems=JSON.parse(JSON.stringify(fixedDefault));
   others=[];
   document.getElementById("takeInput").value=0;
 }

 renderFixed();
 renderOthers();
 calculate();
 saveCurrent();
}

function clearToday(){
 const date=getDate();

 if(!confirm(`確定要清除 ${date} 的紀錄嗎？`))return;

 delete records[date];
 localStorage.setItem(STORAGE_KEY,JSON.stringify(records));

 fixedItems=JSON.parse(JSON.stringify(fixedDefault));
 others=[];
 document.getElementById("takeInput").value=0;

 renderFixed();
 renderOthers();
 calculate();
 renderHistory();
 saveCurrent();

 alert("🗑️ 今天的紀錄已清除！");
}

function clearAll(){
 const ok=confirm(
  "⚠️ 確定要清除全部歷史紀錄嗎？\n\n所有日期的紀錄都會刪除，而且無法復原。"
 );

 if(!ok)return;

 records={};
 localStorage.removeItem(STORAGE_KEY);

 fixedItems=JSON.parse(JSON.stringify(fixedDefault));
 others=[];
 document.getElementById("takeInput").value=0;

 renderFixed();
 renderOthers();
 calculate();
 renderHistory();
 saveCurrent();

 alert("🗑️ 全部紀錄已清除！");
}

function updateWeekday(){
 const d=getDate();
 document.getElementById("weekday").textContent=weekdayText(d);
}

document.getElementById("dateInput").addEventListener("change",()=>{
 updateWeekday();

 const d=getDate();

 if(records[d]){
   const r=records[d];
   fixedItems=JSON.parse(JSON.stringify(r.fixedItems||fixedDefault));
   others=JSON.parse(JSON.stringify(r.others||[]));
   document.getElementById("takeInput").value=r.take||0;
 }else{
   document.getElementById("takeInput").value=0;
 }

 renderFixed();
 renderOthers();
 calculate();
 saveCurrent();
});

document.getElementById("takeInput").addEventListener("input",()=>{
 calculate();
 saveCurrent();
 autoSave();
});

function init(){
 loadStorage();

 const current=todayStr();
 document.getElementById("dateInput").value=current;

 if(records[current]){
   const r=records[current];
   fixedItems=JSON.parse(JSON.stringify(r.fixedItems||fixedDefault));
   others=JSON.parse(JSON.stringify(r.others||[]));
   document.getElementById("takeInput").value=r.take||0;
 }

 updateWeekday();
 renderFixed();
 renderOthers();
 calculate();
 renderHistory();

 /*
  每天自動儲存：
  只要有修改就會寫入 localStorage。
  每 10 秒再自動保存一次目前資料。
 */
 setInterval(()=>{
   autoSave();
 },10000);
}

init();
</script>

</body>
</html>

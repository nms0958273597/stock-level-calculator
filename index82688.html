<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>每日收入記帳</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
body{
  margin:0;
  padding:0;
  background:#f5f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
}
.container{
  max-width:760px;
  margin:0 auto;
  padding:18px 14px 40px;
}
h1{
  text-align:center;
  margin:8px 0 18px;
  font-size:30px;
  font-weight:900;
  color:#333;
}
.card{
  background:#fff;
  border:1px solid #e1e3e6;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}
.date-card{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.info-box{
  background:#f7f8fa;
  border-radius:16px;
  padding:15px;
  text-align:center;
}
.info-label{
  color:#777;
  font-size:16px;
  margin-bottom:5px;
}
.info-value{
  font-size:23px;
  font-weight:900;
  color:#333;
}
.section-title{
  font-size:24px;
  font-weight:900;
  margin-bottom:15px;
  color:#333;
}
.item{
  background:#f8f9fb;
  border:1px solid #e2e4e8;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
}
.item-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.item-name{
  font-size:22px;
  font-weight:900;
}
.unit{
  color:#777;
  font-size:14px;
}
.price-wrap{
  display:flex;
  align-items:center;
  gap:5px;
}
.price-label{
  font-size:14px;
  color:#777;
}
.price-input{
  width:105px;
  border:1px solid #d7d9dd;
  border-radius:10px;
  padding:8px 9px;
  font-size:18px;
  font-weight:800;
  text-align:right;
  background:#fff;
  color:#222;
}
.qty-row{
  display:grid;
  grid-template-columns:55px 1fr 55px;
  align-items:center;
  gap:10px;
  margin-top:12px;
}
.qty-btn{
  height:48px;
  border:0;
  border-radius:14px;
  font-size:30px;
  font-weight:900;
  background:#e8eaed;
  color:#333;
  cursor:pointer;
}
.qty-btn:active{
  transform:scale(.95);
}
.qty-input{
  width:100%;
  height:48px;
  border:2px solid #d8dbe0;
  border-radius:14px;
  background:#fff;
  color:#222;
  text-align:center;
  font-size:22px;
  font-weight:900;
}
.total-line{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed #ddd;
}
.total-label{
  color:#777;
}
.total-value{
  font-size:20px;
  font-weight:900;
}
.money-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:13px;
}
.money-box{
  background:#f7f8fa;
  border-radius:17px;
  padding:14px;
}
.money-label{
  display:block;
  font-size:18px;
  font-weight:800;
  color:#666;
  margin-bottom:8px;
}
.money-input{
  width:100%;
  height:55px;
  border:2px solid #d9dce1;
  border-radius:14px;
  background:#fff;
  color:#222;
  font-size:25px;
  font-weight:900;
  padding:0 14px;
}
.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.result{
  border-radius:18px;
  padding:18px 14px;
  text-align:center;
}
.result.green{
  background:#eaf8ee;
  border:1px solid #bce5c8;
}
.result.red{
  background:#fff0f0;
  border:1px solid #f0c2c2;
}
.result.gray{
  background:#f3f4f6;
  border:1px solid #dddfe3;
}
.result-label{
  font-size:16px;
  color:#666;
  margin-bottom:6px;
}
.result-value{
  font-size:28px;
  font-weight:900;
}
.green .result-value{
  color:#159447;
}
.red .result-value{
  color:#d63c3c;
}
.gray .result-value{
  color:#333;
}
.button-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.main-btn{
  border:0;
  border-radius:16px;
  height:55px;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
}
.save-btn{
  background:#4b8df8;
  color:#fff;
}
.clear-btn{
  background:#f0f1f3;
  color:#444;
}
.main-btn:active{
  transform:scale(.97);
}
.history{
  overflow:hidden;
}
.history-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:5px;
  padding:11px 5px;
  border-bottom:1px solid #e5e6e8;
  text-align:center;
  font-size:14px;
}
.history-row.header{
  font-weight:900;
  color:#666;
  background:#f5f6f8;
}
.empty{
  text-align:center;
  color:#999;
  padding:20px;
}
.notice{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-top:10px;
}
@media(max-width:520px){
  .container{
    padding:12px 10px 30px;
  }
  h1{
    font-size:27px;
  }
  .card{
    padding:14px;
    border-radius:18px;
  }
  .date-card{
    grid-template-columns:1fr 1fr;
  }
  .result-grid{
    grid-template-columns:1fr 1fr;
  }
  .result-value{
    font-size:24px;
  }
  .item-name{
    font-size:20px;
  }
  .price-input{
    width:95px;
  }
}
</style>
</head>

<body>
<div class="container">

<h1>🧾 每日收入記帳</h1>

<div class="card date-card">
  <div class="info-box">
    <div class="info-label">日期</div>
    <div class="info-value" id="todayDate">--</div>
  </div>
  <div class="info-box">
    <div class="info-label">星期</div>
    <div class="info-value" id="todayWeek">--</div>
  </div>
</div>

<div class="card">
  <div class="section-title">📦 今日項目</div>

  <div class="item">
    <div class="item-top">
      <div>
        <div class="item-name">🍜 麵線</div>
        <div class="unit">單價可自由修改</div>
      </div>
      <div class="price-wrap">
        <span class="price-label">$</span>
        <input id="priceNoodles" class="price-input" type="number" inputmode="decimal" value="850">
      </div>
    </div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty('qtyNoodles',-1)">−</button>
      <input id="qtyNoodles" class="qty-input" type="number" inputmode="numeric" value="1" min="0">
      <button class="qty-btn" onclick="changeQty('qtyNoodles',1)">＋</button>
    </div>
    <div class="total-line">
      <span class="total-label">小計</span>
      <span class="total-value" id="totalNoodles">$850</span>
    </div>
  </div>

  <div class="item">
    <div class="item-top">
      <div>
        <div class="item-name">🍋 檸檬</div>
        <div class="unit">單價可自由修改</div>
      </div>
      <div class="price-wrap">
        <span class="price-label">$</span>
        <input id="priceLemon" class="price-input" type="number" inputmode="decimal" value="1200">
      </div>
    </div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty('qtyLemon',-1)">−</button>
      <input id="qtyLemon" class="qty-input" type="number" inputmode="numeric" value="1" min="0">
      <button class="qty-btn" onclick="changeQty('qtyLemon',1)">＋</button>
    </div>
    <div class="total-line">
      <span class="total-label">小計</span>
      <span class="total-value" id="totalLemon">$1,200</span>
    </div>
  </div>

  <div class="item">
    <div class="item-top">
      <div>
        <div class="item-name">🥣 大腸</div>
        <div class="unit">一包單價可自由修改</div>
      </div>
      <div class="price-wrap">
        <span class="price-label">$</span>
        <input id="priceLarge" class="price-input" type="number" inputmode="decimal" value="150">
      </div>
    </div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty('qtyLarge',-1)">−</button>
      <input id="qtyLarge" class="qty-input" type="number" inputmode="numeric" value="0" min="0">
      <button class="qty-btn" onclick="changeQty('qtyLarge',1)">＋</button>
    </div>
    <div class="total-line">
      <span class="total-label">小計</span>
      <span class="total-value" id="totalLarge">$0</span>
    </div>
  </div>

  <div class="item">
    <div class="item-top">
      <div>
        <div class="item-name">🦪 蚵仔</div>
        <div class="unit">一包單價可自由修改</div>
      </div>
      <div class="price-wrap">
        <span class="price-label">$</span>
        <input id="priceOyster" class="price-input" type="number" inputmode="decimal" value="150">
      </div>
    </div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty('qtyOyster',-1)">−</button>
      <input id="qtyOyster" class="qty-input" type="number" inputmode="numeric" value="0" min="0">
      <button class="qty-btn" onclick="changeQty('qtyOyster',1)">＋</button>
    </div>
    <div class="total-line">
      <span class="total-label">小計</span>
      <span class="total-value" id="totalOyster">$0</span>
    </div>
  </div>

  <div class="total-line" style="margin-top:18px;border-top:2px solid #ddd;">
    <span style="font-size:19px;font-weight:900;">📦 項目合計</span>
    <span class="total-value" id="itemsTotal">$2,050</span>
  </div>
</div>

<div class="card">
  <div class="section-title">💰 今日金額</div>

  <div class="money-grid">

    <div class="money-box">
      <label class="money-label">💵 收入</label>
      <input id="income" class="money-input" type="number" inputmode="decimal" placeholder="輸入收入">
    </div>

    <div class="money-box">
      <label class="money-label">💸 拿</label>
      <input id="take" class="money-input" type="number" inputmode="decimal" placeholder="輸入拿的金額">
    </div>

  </div>
</div>

<div class="card">
  <div class="section-title">📊 今日結果</div>

  <div class="result-grid">

    <div class="result green">
      <div class="result-label">收入 − 拿</div>
      <div class="result-value" id="todayProfit">$0</div>
    </div>

    <div class="result red">
      <div class="result-label">不足差額</div>
      <div class="result-value" id="todayShortage">$0</div>
    </div>

    <div class="result gray">
      <div class="result-label">盈餘累加</div>
      <div class="result-value" id="profitAccum">$0</div>
    </div>

    <div class="result gray">
      <div class="result-label">差額累加</div>
      <div class="result-value" id="shortageAccum">$0</div>
    </div>

  </div>
</div>

<div class="card">
  <div class="button-row">
    <button class="main-btn save-btn" onclick="saveToday()">💾 儲存今日</button>
    <button class="main-btn clear-btn" onclick="clearToday()">🗑️ 清除今日</button>
  </div>
  <div class="notice">資料會自動儲存在此裝置</div>
</div>

<div class="card history">
  <div class="section-title">📅 每日紀錄</div>

  <div class="history-row header">
    <div>日期</div>
    <div>收入</div>
    <div>拿</div>
    <div>結果</div>
  </div>

  <div id="historyList"></div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

const weekNames = [
  "星期日",
  "星期一",
  "星期二",
  "星期三",
  "星期四",
  "星期五",
  "星期六"
];

function money(n){
  return "$" + Number(n || 0).toLocaleString("zh-TW",{
    maximumFractionDigits:0
  });
}

function todayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function updateDate(){
  const d = new Date();
  $("todayDate").textContent = todayKey();
  $("todayWeek").textContent = weekNames[d.getDay()];
}

function changeQty(id,amount){
  const input = $(id);
  let value = Number(input.value || 0);
  value += amount;
  if(value < 0) value = 0;
  input.value = value;
  calculate();
}

function value(id){
  return Number($(id).value || 0);
}

function calculate(){
  const noodles = value("priceNoodles") * value("qtyNoodles");
  const lemon = value("priceLemon") * value("qtyLemon");
  const large = value("priceLarge") * value("qtyLarge");
  const oyster = value("priceOyster") * value("qtyOyster");

  const total = noodles + lemon + large + oyster;

  $("totalNoodles").textContent = money(noodles);
  $("totalLemon").textContent = money(lemon);
  $("totalLarge").textContent = money(large);
  $("totalOyster").textContent = money(oyster);
  $("itemsTotal").textContent = money(total);

  const income = value("income");
  const take = value("take");
  const diff = income - take;

  if(diff >= 0){
    $("todayProfit").textContent = money(diff);
    $("todayShortage").textContent = money(0);
  }else{
    $("todayProfit").textContent = money(0);
    $("todayShortage").textContent = money(Math.abs(diff));
  }

  updateAccumulation();
}

function getHistory(){
  try{
    return JSON.parse(localStorage.getItem("dailyAccountingData") || "{}");
  }catch(e){
    return {};
  }
}

function saveHistory(data){
  localStorage.setItem("dailyAccountingData",JSON.stringify(data));
}

function updateAccumulation(){
  const data = getHistory();
  let profit = 0;
  let shortage = 0;

  Object.keys(data).sort().forEach(key=>{
    const item = data[key];
    if(item.profit > 0) profit += Number(item.profit);
    if(item.shortage > 0) shortage += Number(item.shortage);
  });

  const currentIncome = value("income");
  const currentTake = value("take");
  const currentDiff = currentIncome - currentTake;

  if(currentDiff >= 0){
    profit += currentDiff;
  }else{
    shortage += Math.abs(currentDiff);
  }

  $("profitAccum").textContent = money(profit);
  $("shortageAccum").textContent = money(shortage);
}

function saveToday(){
  const key = todayKey();
  const income = value("income");
  const take = value("take");
  const diff = income - take;

  const data = getHistory();

  data[key] = {
    date:key,
    week:weekNames[new Date().getDay()],
    income:income,
    take:take,
    profit:diff > 0 ? diff : 0,
    shortage:diff < 0 ? Math.abs(diff) : 0,
    noodlesPrice:value("priceNoodles"),
    noodlesQty:value("qtyNoodles"),
    lemonPrice:value("priceLemon"),
    lemonQty:value("qtyLemon"),
    largePrice:value("priceLarge"),
    largeQty:value("qtyLarge"),
    oysterPrice:value("priceOyster"),
    oysterQty:value("qtyOyster")
  };

  saveHistory(data);
  renderHistory();
  updateAccumulation();

  alert("✅ 今日資料已儲存");
}

function clearToday(){
  if(!confirm("確定要清除今天輸入的資料嗎？")) return;

  $("income").value = "";
  $("take").value = "";

  $("qtyNoodles").value = 1;
  $("qtyLemon").value = 1;
  $("qtyLarge").value = 0;
  $("qtyOyster").value = 0;

  calculate();
}

function loadToday(){
  const data = getHistory();
  const item = data[todayKey()];

  if(!item){
    calculate();
    return;
  }

  $("income").value = item.income || "";
  $("take").value = item.take || "";

  $("priceNoodles").value = item.noodlesPrice ?? 850;
  $("qtyNoodles").value = item.noodlesQty ?? 1;

  $("priceLemon").value = item.lemonPrice ?? 1200;
  $("qtyLemon").value = item.lemonQty ?? 1;

  $("priceLarge").value = item.largePrice ?? 150;
  $("qtyLarge").value = item.largeQty ?? 0;

  $("priceOyster").value = item.oysterPrice ?? 150;
  $("qtyOyster").value = item.oysterQty ?? 0;

  calculate();
}

function renderHistory(){
  const data = getHistory();
  const keys = Object.keys(data).sort().reverse();
  const box = $("historyList");

  if(keys.length === 0){
    box.innerHTML = '<div class="empty">目前還沒有每日紀錄</div>';
    return;
  }

  box.innerHTML = keys.map(key=>{
    const item = data[key];
    const diff = Number(item.profit || 0) - Number(item.shortage || 0);
    const result = diff >= 0
      ? `<span style="color:#159447;font-weight:900;">+${diff.toLocaleString()}</span>`
      : `<span style="color:#d63c3c;font-weight:900;">-${Math.abs(diff).toLocaleString()}</span>`;

    return `
      <div class="history-row">
        <div>${item.date}<br><small>${item.week || ""}</small></div>
        <div>${money(item.income)}</div>
        <div>${money(item.take)}</div>
        <div>${result}</div>
      </div>
    `;
  }).join("");
}

document.querySelectorAll("input").forEach(input=>{
  input.addEventListener("input",calculate);
});

updateDate();
loadToday();
renderHistory();
calculate();

setInterval(()=>{
  updateDate();
},60000);
</script>

</body>
</html>

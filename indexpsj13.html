<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>訂單管理 PSJ13</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  padding:10px;
  background:#f2f4f7;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:20px;
}

.container{
  width:100%;
  max-width:760px;
  margin:0 auto;
}

.header{
  background:#222;
  color:#fff;
  border-radius:22px;
  padding:22px 16px;
  margin-bottom:14px;
  text-align:center;
}

.header h1{
  margin:0 0 10px;
  font-size:32px;
  font-weight:900;
}

.date{
  font-size:22px;
  font-weight:900;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.title{
  font-size:27px;
  font-weight:900;
  margin-bottom:16px;
}

label{
  display:block;
  font-size:22px;
  font-weight:900;
  margin:14px 0 8px;
}

input{
  width:100%;
  height:64px;
  border:3px solid #c9ced4;
  border-radius:15px;
  padding:8px 15px;
  background:#fff;
  color:#111;
  font-size:28px;
  font-weight:800;
  outline:none;
}

input:focus{
  border-color:#222;
}

input[readonly]{
  background:#f1f3f5;
  color:#111;
}

.money-card{
  background:#fff4cf;
  border:3px solid #e1b000;
}

.result-card{
  background:#e8f7ed;
  border:3px solid #2f9b63;
}

.big-number{
  text-align:center;
  font-size:44px;
  font-weight:900;
  padding:8px 0;
}

.money-card .big-number{
  color:#946700;
}

.result-card .big-number{
  color:#187442;
}

.calculation{
  margin-top:15px;
  padding:20px 8px;
  background:#fff;
  border-radius:17px;
  text-align:center;
  font-size:29px;
  line-height:1.55;
  font-weight:900;
  word-break:break-word;
}

.calculation .remaining{
  display:block;
  margin-top:10px;
  font-size:39px;
}

.note{
  margin-top:9px;
  color:#666;
  font-size:18px;
  text-align:center;
  font-weight:700;
}

.price{
  font-size:24px;
  font-weight:900;
  margin-bottom:12px;
}

.total{
  text-align:right;
  font-size:32px;
  font-weight:900;
  margin-top:14px;
}

.auto-order{
  background:#eef5ff;
  border:3px solid #4b83d1;
}

.auto-order .title{
  color:#245a9d;
}

.salesman-card{
  background:#fff0f6;
  border:3px solid #d45b91;
}

.salesman-card .title{
  color:#a83268;
}

.button-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  width:100%;
  min-height:64px;
  border:0;
  border-radius:15px;
  padding:10px;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

.black{
  background:#222;
  color:#fff;
}

.green{
  background:#29945d;
  color:#fff;
}

.red{
  background:#d94b47;
  color:#fff;
}

.blue{
  background:#3478d4;
  color:#fff;
}

.orange{
  background:#e48700;
  color:#fff;
}

.purple{
  background:#7650c8;
  color:#fff;
}

.history{
  border:2px solid #ddd;
  background:#fafafa;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}

.history-name{
  font-size:24px;
  font-weight:900;
  margin-bottom:8px;
}

.history-line{
  font-size:18px;
  line-height:1.75;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px 5px;
  font-size:20px;
}

.footer{
  text-align:center;
  color:#777;
  font-size:16px;
  padding:15px 0 30px;
}

@media(max-width:480px){

  body{
    padding:8px;
  }

  .card{
    padding:17px;
  }

  .header h1{
    font-size:29px;
  }

  .date{
    font-size:20px;
  }

  .title{
    font-size:25px;
  }

  .big-number{
    font-size:40px;
  }

  .calculation{
    font-size:25px;
  }

  .calculation .remaining{
    font-size:36px;
  }

  button{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- 標題 -->
  <div class="header">
    <h1>📋 本次訂單</h1>
    <div class="date" id="today"></div>
  </div>

  <!-- 營業員 -->
  <div class="card salesman-card">

    <div class="title">👨‍💼 營業員</div>

    <input
      type="text"
      id="salesperson"
      value="賣大腸"
      placeholder="輸入營業員"
    >

  </div>

  <!-- 貨款餘額 -->
  <div class="card money-card">

    <div class="title">💰 貨款餘額</div>

    <input
      type="number"
      id="balance"
      inputmode="decimal"
      placeholder="輸入目前貨款餘額"
      oninput="calculate()"
    >

    <div class="big-number" id="balanceShow">$0</div>

  </div>

  <!-- 客人資料 -->
  <div class="card">

    <div class="title">👤 客人資料</div>

    <label>姓名</label>

    <input
      type="text"
      id="customerName"
      placeholder="輸入客人姓名"
    >

    <label>電話</label>

    <input
      type="tel"
      id="customerPhone"
      placeholder="輸入電話"
    >

    <label>手機</label>

    <input
      type="tel"
      id="customerMobile"
      placeholder="輸入手機"
    >

  </div>

  <!-- 大腸 -->
  <div class="card">

    <div class="title">🥩 大腸</div>

    <div class="price">
      固定單價：100 元／斤
    </div>

    <label>數量（斤）</label>

    <input
      type="number"
      id="intestineQty"
      inputmode="decimal"
      step="0.1"
      min="0"
      value="0"
      oninput="calculate()"
    >

    <div class="total" id="intestineTotal">
      大腸金額：$0
    </div>

  </div>

  <!-- 自動訂單金額 -->
  <div class="card auto-order">

    <div class="title">🧾 訂單金額</div>

    <input
      type="number"
      id="orderAmount"
      readonly
      value="0"
    >

    <div class="note">
      由商品金額自動加總
    </div>

  </div>

  <!-- 核心計算 -->
  <div class="card result-card">

    <div class="title">
      💵 貨款扣除計算
    </div>

    <div class="calculation">

      <span id="calcBalance">$0</span>

      <span> − </span>

      <span id="calcOrder">$0</span>

      <span> = </span>

      <span id="calcRemaining">$0</span>

      <span class="remaining">
        💵 剩餘貨款：
        <span id="remainingBalance">$0</span>
      </span>

    </div>

    <div class="note">
      貨款餘額 − 本次訂單金額 = 剩餘貨款
    </div>

  </div>

  <!-- 操作 -->
  <div class="card">

    <div class="title">
      📋 訂單操作
    </div>

    <div class="button-grid">

      <button class="black" onclick="copyOrder()">
        📋 複製訂單
      </button>

      <button class="green" onclick="saveRecord()">
        💾 儲存紀錄
      </button>

      <button class="red" onclick="clearForm()">
        🗑️ 清除輸入
      </button>

      <button class="blue" onclick="exportRecords()">
        📤 匯出紀錄
      </button>

      <button class="orange" onclick="downloadRecords()">
        ⬇️ 下載紀錄
      </button>

      <button class="purple" onclick="sharePhone()">
        📱 發送手機
      </button>

      <button class="green" onclick="sendLine()">
        💬 發送 LINE
      </button>

      <button class="red" onclick="clearAllRecords()">
        🗑️ 清除全部紀錄
      </button>

    </div>

  </div>

  <!-- 紀錄 -->
  <div class="card">

    <div class="title">
      📚 儲存紀錄
    </div>

    <div id="history"></div>

  </div>

  <div class="footer">
    PSJ13 訂單管理
  </div>

</div>

<script>

const STORAGE_KEY = "psj13_order_records";

const ORDER_PHONE = "0919335529";


/* =========================
   金額格式
========================= */

function money(value){

  return Number(value || 0).toLocaleString("zh-TW");

}


/* =========================
   日期＋星期
========================= */

function updateDate(){

  const now = new Date();

  const week = [
    "星期日",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六"
  ];

  const text =
    now.getFullYear() +
    "/" +
    String(now.getMonth()+1).padStart(2,"0") +
    "/" +
    String(now.getDate()).padStart(2,"0") +
    "　" +
    week[now.getDay()];

  document.getElementById("today").textContent = text;

}


/* =========================
   核心計算
========================= */

function calculate(){

  const balance =
    Number(
      document.getElementById("balance").value
    ) || 0;


  const intestineQty =
    Number(
      document.getElementById("intestineQty").value
    ) || 0;


  const intestineTotal =
    intestineQty * 100;


  const orderAmount =
    intestineTotal;


  document.getElementById("orderAmount").value =
    orderAmount;


  const remaining =
    balance - orderAmount;


  document.getElementById("balanceShow").textContent =
    "$" + money(balance);


  document.getElementById("intestineTotal").textContent =
    "大腸金額：$" + money(intestineTotal);


  document.getElementById("calcBalance").textContent =
    "$" + money(balance);


  document.getElementById("calcOrder").textContent =
    "$" + money(orderAmount);


  document.getElementById("calcRemaining").textContent =
    "$" + money(remaining);


  document.getElementById("remainingBalance").textContent =
    "$" + money(remaining);

}


/* =========================
   取得目前資料
========================= */

function getFormData(){

  const balance =
    Number(
      document.getElementById("balance").value
    ) || 0;


  const intestineQty =
    Number(
      document.getElementById("intestineQty").value
    ) || 0;


  const intestineTotal =
    intestineQty * 100;


  const orderAmount =
    intestineTotal;


  const remaining =
    balance - orderAmount;


  return {

    date:
      document.getElementById("today").textContent,

    salesperson:
      document.getElementById("salesperson").value.trim(),

    customerName:
      document.getElementById("customerName").value.trim(),

    customerPhone:
      document.getElementById("customerPhone").value.trim(),

    customerMobile:
      document.getElementById("customerMobile").value.trim(),

    balance:
      balance,

    orderAmount:
      orderAmount,

    intestineQty:
      intestineQty,

    intestineTotal:
      intestineTotal,

    remaining:
      remaining

  };

}


/* =========================
   訂單文字
========================= */

function orderText(data){

  return [

    "📋 本次訂單",

    "📅 " + data.date,

    "",

    "👨‍💼 營業員：" +
      (data.salesperson || "未填"),

    "",

    "👤 姓名：" +
      (data.customerName || "未填"),

    "☎️ 電話：" +
      (data.customerPhone || "未填"),

    "📱 手機：" +
      (data.customerMobile || "未填"),

    "",

    "🥩 大腸：" +
      data.intestineQty +
      " 斤 × 100 = " +
      money(data.intestineTotal) +
      " 元",

    "",

    "🧾 訂單金額：" +
      money(data.orderAmount) +
      " 元",

    "",

    "💰 貨款計算：",

    money(data.balance) +
      " − " +
      money(data.orderAmount) +
      " = " +
      money(data.remaining),

    "",

    "💵 剩餘貨款：" +
      money(data.remaining) +
      " 元"

  ].join("\n");

}


/* =========================
   複製訂單
========================= */

async function copyOrder(){

  const data =
    getFormData();

  const text =
    orderText(data);

  try{

    await navigator.clipboard.writeText(text);

    alert("✅ 訂單內容已複製！");

  }catch(e){

    fallbackCopy(text);

  }

}


function fallbackCopy(text){

  const area =
    document.createElement("textarea");

  area.value = text;

  document.body.appendChild(area);

  area.select();

  document.execCommand("copy");

  area.remove();

  alert("✅ 訂單內容已複製！");

}


/* =========================
   儲存紀錄
========================= */

function saveRecord(){

  const data =
    getFormData();


  if(data.orderAmount <= 0){

    alert(
      "⚠️ 請先輸入大腸數量！"
    );

    return;

  }


  const records =
    getRecords();


  records.unshift({

    id:
      Date.now(),

    ...data

  });


  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(records)

  );


  renderHistory();


  /*
    儲存後：

    例如

    10000 - 3000 = 7000

    下一筆貨款自動變成7000
  */

  document.getElementById("balance").value =
    data.remaining;


  calculate();


  alert("✅ 訂單已儲存！");

}


/* =========================
   讀取紀錄
========================= */

function getRecords(){

  try{

    return JSON.parse(

      localStorage.getItem(
        STORAGE_KEY
      ) || "[]"

    );

  }catch(e){

    return [];

  }

}


/* =========================
   顯示紀錄
========================= */

function renderHistory(){

  const box =
    document.getElementById("history");

  const records =
    getRecords();


  if(!records.length){

    box.innerHTML =
      '<div class="empty">目前還沒有儲存紀錄</div>';

    return;

  }


  box.innerHTML =
    records.map(
      (r,index)=>`

      <div class="history">

        <div class="history-name">
          #${records.length-index}
          　${escapeHtml(
            r.customerName || "未填姓名"
          )}
        </div>

        <div class="history-line">
          📅 ${escapeHtml(r.date)}
        </div>

        <div class="history-line">
          👨‍💼 營業員：
          ${escapeHtml(
            r.salesperson || "未填"
          )}
        </div>

        <div class="history-line">
          ☎️ ${escapeHtml(
            r.customerPhone || "未填"
          )}
        </div>

        <div class="history-line">
          📱 ${escapeHtml(
            r.customerMobile || "未填"
          )}
        </div>

        <div class="history-line">
          🥩 大腸：
          ${r.intestineQty}
          斤 × 100 =
          ${money(r.intestineTotal)}
          元
        </div>

        <div class="history-line">
          🧾 訂單金額：
          <strong>
            ${money(r.orderAmount)}
            元
          </strong>
        </div>

        <div class="history-line">
          💰 計算：
          ${money(r.balance)}
          −
          ${money(r.orderAmount)}
          =
          <strong>
            ${money(r.remaining)}
          </strong>
        </div>

        <div class="history-line">
          💵 剩餘貨款：
          <strong>
            ${money(r.remaining)}
            元
          </strong>
        </div>

        <div style="margin-top:12px">

          <button
            class="red"
            onclick="deleteRecord(${r.id})">

            🗑️ 刪除這筆

          </button>

        </div>

      </div>

    `
    ).join("");

}


/* =========================
   刪除單筆
========================= */

function deleteRecord(id){

  if(
    !confirm(
      "確定要刪除這筆紀錄嗎？"
    )
  ){

    return;

  }


  const records =
    getRecords().filter(
      r => r.id !== id
    );


  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(records)

  );


  renderHistory();

}


/* =========================
   清除目前輸入
========================= */

function clearForm(){

  if(
    !confirm(
      "確定要清除目前輸入內容嗎？"
    )
  ){

    return;

  }


  document.getElementById(
    "salesperson"
  ).value = "賣大腸";


  document.getElementById(
    "customerName"
  ).value = "";


  document.getElementById(
    "customerPhone"
  ).value = "";


  document.getElementById(
    "customerMobile"
  ).value = "";


  document.getElementById(
    "intestineQty"
  ).value = "0";


  /*
    貨款餘額不清除，
    方便繼續下一筆。
  */

  calculate();

}


/* =========================
   清除全部紀錄
========================= */

function clearAllRecords(){

  if(
    !confirm(
      "確定要刪除全部紀錄嗎？"
    )
  ){

    return;

  }


  localStorage.removeItem(
    STORAGE_KEY
  );


  renderHistory();


  alert(
    "🗑️ 全部紀錄已清除！"
  );

}


/* =========================
   匯出 CSV
========================= */

function exportRecords(){

  const records =
    getRecords();


  if(!records.length){

    alert(
      "目前沒有紀錄可以匯出！"
    );

    return;

  }


  let csv =
    "日期,營業員,姓名,電話,手機,貨款餘額,大腸斤數,大腸金額,訂單金額,扣除後餘額\n";


  records.forEach(r=>{

    csv += [

      csvCell(r.date),

      csvCell(r.salesperson),

      csvCell(r.customerName),

      csvCell(r.customerPhone),

      csvCell(r.customerMobile),

      r.balance,

      r.intestineQty,

      r.intestineTotal,

      r.orderAmount,

      r.remaining

    ].join(",") +
    "\n";

  });


  const blob =
    new Blob(

      ["\uFEFF" + csv],

      {
        type:
          "text/csv;charset=utf-8"
      }

    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href =
    url;


  a.download =
    "PSJ13_訂單紀錄.csv";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(url);

}


/* =========================
   下載 JSON
========================= */

function downloadRecords(){

  const records =
    getRecords();


  if(!records.length){

    alert(
      "目前沒有紀錄可以下載！"
    );

    return;

  }


  const data =
    JSON.stringify(
      records,
      null,
      2
    );


  const blob =
    new Blob(

      [data],

      {
        type:
          "application/json;charset=utf-8"
      }

    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href =
    url;


  a.download =
    "PSJ13_訂單紀錄.json";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(url);

}


/* =========================
   手機分享
   固定收件人：0919335529
========================= */

async function sharePhone(){

  const data =
    getFormData();

  const text =
    orderText(data);


  /*
    iPhone / Android 簡訊
    使用 sms: 開啟簡訊

    收件人固定：
    0919335529
  */

  const smsUrl =
    "sms:" +
    ORDER_PHONE +
    "?&body=" +
    encodeURIComponent(text);


  window.location.href =
    smsUrl;

}


/* =========================
   LINE
========================= */

function sendLine(){

  const data =
    getFormData();

  const text =
    orderText(data);


  const url =
    "https://line.me/R/msg/text/?" +
    encodeURIComponent(text);


  window.open(
    url,
    "_blank"
  );

}


/* =========================
   CSV 格式
========================= */

function csvCell(value){

  const text =
    String(value ?? "");


  return '"' +
    text.replace(
      /"/g,
      '""'
    ) +
    '"';

}


/* =========================
   HTML 安全處理
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   啟動
========================= */

updateDate();

calculate();

renderHistory();

</script>

</body>
</html>

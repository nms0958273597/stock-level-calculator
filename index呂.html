<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呂訂單管理</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:12px;
    background:#f3f5f7;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",
    "Microsoft JhengHei",sans-serif;
    color:#222;
}

.container{
    width:100%;
    max-width:650px;
    margin:0 auto;
}

.header{
    background:linear-gradient(135deg,#263238,#546e7a);
    color:#fff;
    border-radius:18px;
    padding:18px 12px;
    text-align:center;
    margin-bottom:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.date{
    font-size:25px;
    font-weight:900;
    letter-spacing:.5px;
}

.time{
    font-size:17px;
    margin-top:5px;
    opacity:.9;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.title{
    font-size:23px;
    font-weight:900;
    margin-bottom:12px;
}

.item{
    border:1px solid #e0e0e0;
    border-radius:15px;
    padding:13px 10px;
    margin-bottom:10px;
    background:#fff;
}

.item:last-child{
    margin-bottom:0;
}

.item-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.item-name{
    font-size:19px;
    font-weight:900;
    flex:1;
}

.item-unit{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:14px;
    color:#666;
    white-space:nowrap;
}

.price-input{
    width:90px;
    height:38px;
    border:2px solid #cfd8dc;
    border-radius:10px;
    text-align:center;
    font-size:18px;
    font-weight:900;
    color:#222;
    background:#fff;
    outline:none;
}

.price-input:focus{
    border-color:#546e7a;
    background:#f5f9fa;
}

.qty-row{
    display:grid;
    grid-template-columns:72px 1fr 72px;
    gap:8px;
    align-items:center;
}

.qty-btn{
    height:50px;
    border:0;
    border-radius:12px;
    font-size:27px;
    font-weight:900;
    cursor:pointer;
}

.minus{
    background:#ffebee;
    color:#c62828;
}

.plus{
    background:#e8f5e9;
    color:#2e7d32;
}

.qty-input{
    width:100%;
    height:50px;
    border:2px solid #cfd8dc;
    border-radius:12px;
    text-align:center;
    font-size:23px;
    font-weight:900;
    outline:none;
    background:#fff;
}

.qty-input:focus{
    border-color:#546e7a;
}

.summary{
    margin-top:14px;
    padding:13px;
    background:#eef3f5;
    border-radius:14px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 0;
    font-size:18px;
}

.summary-value{
    font-size:24px;
    font-weight:900;
}

.order-text{
    background:#f8f9fa;
    border:1px solid #ddd;
    border-radius:12px;
    padding:14px;
    font-size:17px;
    line-height:1.65;
    white-space:pre-wrap;
    min-height:120px;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:10px;
}

.action{
    height:52px;
    border:0;
    border-radius:12px;
    color:#fff;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

.copy{
    background:#3949ab;
}

.share{
    background:#00897b;
}

.save{
    background:#ef6c00;
}

.clear{
    background:#757575;
}

.message{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-top:10px;
    min-height:20px;
}

@media(max-width:430px){

    body{
        padding:8px;
    }

    .date{
        font-size:22px;
    }

    .item-name{
        font-size:18px;
    }

    .item-unit{
        font-size:13px;
    }

    .price-input{
        width:82px;
        height:36px;
        font-size:17px;
    }

    .qty-row{
        grid-template-columns:62px 1fr 62px;
    }

    .qty-btn{
        height:48px;
    }

    .qty-input{
        height:48px;
        font-size:22px;
    }

    .action{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="date" id="dateText">載入中...</div>
        <div class="time" id="timeText">載入中...</div>
    </div>

    <div class="card">

        <div class="title">📦 耗材訂單</div>


        <!-- 90口徑紙杯500 -->
        <div class="item">

            <div class="item-head">

                <div class="item-name">
                    90口徑紙杯500
                </div>

                <div class="item-unit">
                    一件
                    <input
                        id="price_cup90"
                        class="price-input"
                        type="number"
                        inputmode="numeric"
                        min="0"
                        value="920"
                        oninput="updateAll()">
                </div>

            </div>

            <div class="qty-row">

                <button
                    class="qty-btn minus"
                    onclick="changeQty('cup90',-1)">
                    −
                </button>

                <input
                    id="cup90"
                    class="qty-input"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    value="0"
                    oninput="updateAll()">

                <button
                    class="qty-btn plus"
                    onclick="changeQty('cup90',1)">
                    ＋
                </button>

            </div>

        </div>


        <!-- Y700 -->
        <div class="item">

            <div class="item-head">

                <div class="item-name">
                    Y700
                </div>

                <div class="item-unit">
                    一件
                    <input
                        id="price_y700"
                        class="price-input"
                        type="number"
                        inputmode="numeric"
                        min="0"
                        value="1050"
                        oninput="updateAll()">
                </div>

            </div>

            <div class="qty-row">

                <button
                    class="qty-btn minus"
                    onclick="changeQty('y700',-1)">
                    −
                </button>

                <input
                    id="y700"
                    class="qty-input"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    value="0"
                    oninput="updateAll()">

                <button
                    class="qty-btn plus"
                    onclick="changeQty('y700',1)">
                    ＋
                </button>

            </div>

        </div>


        <!-- 一杯袋 -->
        <div class="item">

            <div class="item-head">

                <div class="item-name">
                    一杯袋
                </div>

                <div class="item-unit">
                    一件
                    <input
                        id="price_bag1"
                        class="price-input"
                        type="number"
                        inputmode="numeric"
                        min="0"
                        value="2520"
                        oninput="updateAll()">
                </div>

            </div>

            <div class="qty-row">

                <button
                    class="qty-btn minus"
                    onclick="changeQty('bag1',-1)">
                    −
                </button>

                <input
                    id="bag1"
                    class="qty-input"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    value="0"
                    oninput="updateAll()">

                <button
                    class="qty-btn plus"
                    onclick="changeQty('bag1',1)">
                    ＋
                </button>

            </div>

        </div>


        <!-- 兩杯袋 -->
        <div class="item">

            <div class="item-head">

                <div class="item-name">
                    兩杯袋
                </div>

                <div class="item-unit">
                    一件
                    <input
                        id="price_bag2"
                        class="price-input"
                        type="number"
                        inputmode="numeric"
                        min="0"
                        value="2520"
                        oninput="updateAll()">
                </div>

            </div>

            <div class="qty-row">

                <button
                    class="qty-btn minus"
                    onclick="changeQty('bag2',-1)">
                    −
                </button>

                <input
                    id="bag2"
                    class="qty-input"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    value="0"
                    oninput="updateAll()">

                <button
                    class="qty-btn plus"
                    onclick="changeQty('bag2',1)">
                    ＋
                </button>

            </div>

        </div>


        <!-- 三杯袋 -->
        <div class="item">

            <div class="item-head">

                <div class="item-name">
                    三杯袋
                </div>

                <div class="item-unit">
                    一件
                    <input
                        id="price_bag3"
                        class="price-input"
                        type="number"
                        inputmode="numeric"
                        min="0"
                        value="2520"
                        oninput="updateAll()">
                </div>

            </div>

            <div class="qty-row">

                <button
                    class="qty-btn minus"
                    onclick="changeQty('bag3',-1)">
                    −
                </button>

                <input
                    id="bag3"
                    class="qty-input"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    value="0"
                    oninput="updateAll()">

                <button
                    class="qty-btn plus"
                    onclick="changeQty('bag3',1)">
                    ＋
                </button>

            </div>

        </div>


        <!-- 821吸管單支包 -->
        <div class="item">

            <div class="item-head">

                <div class="item-name">
                    821吸管單支包
                </div>

                <div class="item-unit">
                    一件
                    <input
                        id="price_straw"
                        class="price-input"
                        type="number"
                        inputmode="numeric"
                        min="0"
                        value="750"
                        oninput="updateAll()">
                </div>

            </div>

            <div class="qty-row">

                <button
                    class="qty-btn minus"
                    onclick="changeQty('straw',-1)">
                    −
                </button>

                <input
                    id="straw"
                    class="qty-input"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    value="0"
                    oninput="updateAll()">

                <button
                    class="qty-btn plus"
                    onclick="changeQty('straw',1)">
                    ＋
                </button>

            </div>

        </div>


        <!-- 大湯匙 -->
        <div class="item">

            <div class="item-head">

                <div class="item-name">
                    大湯匙
                </div>

                <div class="item-unit">
                    一件
                    <input
                        id="price_spoon"
                        class="price-input"
                        type="number"
                        inputmode="numeric"
                        min="0"
                        value="530"
                        oninput="updateAll()">
                </div>

            </div>

            <div class="qty-row">

                <button
                    class="qty-btn minus"
                    onclick="changeQty('spoon',-1)">
                    −
                </button>

                <input
                    id="spoon"
                    class="qty-input"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    value="0"
                    oninput="updateAll()">

                <button
                    class="qty-btn plus"
                    onclick="changeQty('spoon',1)">
                    ＋
                </button>

            </div>

        </div>


        <!-- 總計 -->
        <div class="summary">

            <div class="summary-row">
                <span>📦 訂購總件數</span>

                <span
                    class="summary-value"
                    id="totalQty">
                    0
                </span>
            </div>

            <div class="summary-row">
                <span>💰 訂單總金額</span>

                <span
                    class="summary-value"
                    id="totalUnits">
                    0
                </span>
            </div>

        </div>

    </div>


    <!-- 詳細訂單 -->
    <div class="card">

        <div class="title">📋 詳細訂單</div>

        <div
            class="order-text"
            id="orderText">
            尚未選擇訂購品項
        </div>


        <div class="buttons">

            <button
                class="action copy"
                onclick="copyOrder()">
                📋 複製詳細訂單
            </button>

            <button
                class="action share"
                onclick="shareOrder()">
                📤 分享訊息
            </button>

            <button
                class="action save"
                onclick="saveOrder()">
                💾 自動儲存
            </button>

            <button
                class="action clear"
                onclick="clearOrder()">
                🗑️ 清除數量
            </button>

        </div>

        <div
            class="message"
            id="message">
            數量與價格會自動儲存在本機
        </div>

    </div>

</div>


<script>

const items = [

    {
        id:"cup90",
        priceId:"price_cup90",
        name:"90口徑紙杯500",
        unit:920
    },

    {
        id:"y700",
        priceId:"price_y700",
        name:"Y700",
        unit:1050
    },

    {
        id:"bag1",
        priceId:"price_bag1",
        name:"一杯袋",
        unit:2520
    },

    {
        id:"bag2",
        priceId:"price_bag2",
        name:"兩杯袋",
        unit:2520
    },

    {
        id:"bag3",
        priceId:"price_bag3",
        name:"三杯袋",
        unit:2520
    },

    {
        id:"straw",
        priceId:"price_straw",
        name:"821吸管單支包",
        unit:750
    },

    {
        id:"spoon",
        priceId:"price_spoon",
        name:"大湯匙",
        unit:530
    }

];


function getNumber(id){

    const input =
        document.getElementById(id);

    let value =
        parseInt(input.value,10);

    if(isNaN(value)){
        value = 0;
    }

    if(value < 0){
        value = 0;
    }

    return value;
}


function getPrice(item){

    const input =
        document.getElementById(item.priceId);

    let value =
        parseInt(input.value,10);

    if(isNaN(value)){
        value = item.unit;
    }

    if(value < 0){
        value = 0;
    }

    return value;
}


function changeQty(id,amount){

    const input =
        document.getElementById(id);

    let value =
        parseInt(input.value,10);

    if(isNaN(value)){
        value = 0;
    }

    value += amount;

    if(value < 0){
        value = 0;
    }

    input.value = value;

    updateAll();
}


function numberFormat(number){

    return Number(number).toLocaleString("zh-TW");
}


function updateDateTime(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        now.getMonth() + 1;

    const day =
        now.getDate();

    const weekNames = [
        "星期日",
        "星期一",
        "星期二",
        "星期三",
        "星期四",
        "星期五",
        "星期六"
    ];

    const week =
        weekNames[now.getDay()];

    const hour =
        String(now.getHours()).padStart(2,"0");

    const minute =
        String(now.getMinutes()).padStart(2,"0");

    const second =
        String(now.getSeconds()).padStart(2,"0");

    document.getElementById("dateText").textContent =
        `${year}年${month}月${day}日（${week}）`;

    document.getElementById("timeText").textContent =
        `${hour}:${minute}:${second}`;
}


function createOrderText(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        now.getMonth() + 1;

    const day =
        now.getDate();

    const weekNames = [
        "星期日",
        "星期一",
        "星期二",
        "星期三",
        "星期四",
        "星期五",
        "星期六"
    ];

    const week =
        weekNames[now.getDay()];

    let text = "";

    text += "📦 耗材訂單\n";
    text += "━━━━━━━━━━━━━━\n";
    text += `${year}年${month}月${day}日（${week}）\n\n`;

    let totalQty = 0;
    let totalMoney = 0;
    let hasOrder = false;

    items.forEach(item => {

        const qty =
            getNumber(item.id);

        const price =
            getPrice(item);

        if(qty > 0){

            hasOrder = true;

            const total =
                qty * price;

            text += `${item.name}\n`;

            text +=
                `一件 ${numberFormat(price)} × ${qty}件`;

            text +=
                ` = ${numberFormat(total)}\n\n`;

            totalQty += qty;

            totalMoney += total;
        }

    });


    if(!hasOrder){

        text += "尚未選擇訂購品項\n";

    }else{

        text += "━━━━━━━━━━━━━━\n";

        text +=
            `📦 訂購總件數：${numberFormat(totalQty)} 件\n`;

        text +=
            `💰 訂單總金額：${numberFormat(totalMoney)} 元\n`;

    }

    return text;
}


function updateAll(){

    let totalQty = 0;

    let totalMoney = 0;


    items.forEach(item => {

        const qty =
            getNumber(item.id);

        const price =
            getPrice(item);

        totalQty += qty;

        totalMoney +=
            qty * price;

    });


    document.getElementById("totalQty").textContent =
        numberFormat(totalQty);

    document.getElementById("totalUnits").textContent =
        numberFormat(totalMoney);


    document.getElementById("orderText").textContent =
        createOrderText();


    saveSilently();
}


function saveSilently(){

    const data = {
        quantities:{},
        prices:{}
    };


    items.forEach(item => {

        data.quantities[item.id] =
            getNumber(item.id);

        data.prices[item.id] =
            getPrice(item);

    });


    localStorage.setItem(
        "index319_order",
        JSON.stringify(data)
    );
}


function saveOrder(){

    saveSilently();

    showMessage("💾 已儲存");
}


function loadOrder(){

    const saved =
        localStorage.getItem("index319_order");


    if(!saved){

        updateAll();

        return;
    }


    try{

        const data =
            JSON.parse(saved);


        /* 載入數量 */

        items.forEach(item => {

            if(
                data.quantities &&
                data.quantities[item.id] !== undefined
            ){

                document.getElementById(item.id).value =
                    Math.max(
                        0,
                        parseInt(
                            data.quantities[item.id],
                            10
                        ) || 0
                    );

            }

        });


        /* 載入價格 */

        items.forEach(item => {

            if(
                data.prices &&
                data.prices[item.id] !== undefined
            ){

                document.getElementById(item.priceId).value =
                    Math.max(
                        0,
                        parseInt(
                            data.prices[item.id],
                            10
                        ) || item.unit
                    );

            }

        });


    }catch(error){

        console.log(
            "讀取儲存資料失敗"
        );

    }


    updateAll();
}


async function copyOrder(){

    const text =
        createOrderText();


    try{

        await navigator.clipboard.writeText(text);

        showMessage(
            "✅ 詳細訂單已複製"
        );

    }catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value =
            text;

        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();

        showMessage(
            "✅ 詳細訂單已複製"
        );

    }

}


async function shareOrder(){

    const text =
        createOrderText();


    if(navigator.share){

        try{

            await navigator.share({

                title:"耗材訂單",

                text:text

            });

            showMessage(
                "✅ 分享完成"
            );

        }catch(error){

            if(
                error.name !==
                "AbortError"
            ){

                showMessage(
                    "分享取消"
                );

            }

        }

    }else{

        await copyOrder();

        showMessage(
            "📋 已複製，可貼到 LINE"
        );

    }

}


function clearOrder(){

    const answer =
        confirm(
            "確定要清除所有訂單數量嗎？\n\n手動修改的價格不會被清除。"
        );


    if(!answer){
        return;
    }


    items.forEach(item => {

        document.getElementById(item.id).value =
            0;

    });


    updateAll();


    showMessage(
        "🗑️ 已清除全部訂單數量"
    );
}


function showMessage(message){

    const element =
        document.getElementById("message");


    element.textContent =
        message;


    clearTimeout(
        window.messageTimer
    );


    window.messageTimer =
        setTimeout(() => {

            element.textContent =
                "數量與價格會自動儲存在本機";

        },3000);
}


setInterval(
    updateDateTime,
    1000
);


updateDateTime();

loadOrder();

</script>

</body>
</html>

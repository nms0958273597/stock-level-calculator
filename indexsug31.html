<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SUGO 2026/08｜視頻直播時數統計</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    background:#f4f7fc;
    color:#182230;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(920px,100%);
    margin:0 auto;
    padding:28px 20px 60px;
}

/* =========================
   標題
========================= */

.header{
    text-align:center;
    padding:12px 10px 28px;
}

.title-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.title-input{
    width:100%;
    max-width:680px;
    border:0;
    outline:none;
    background:transparent;
    text-align:center;
    color:#182230;
    font-size:42px;
    font-weight:900;
    letter-spacing:-1px;
    padding:5px 8px;
}

.title-input:focus{
    background:#ffffff;
    border-radius:16px;
    box-shadow:0 0 0 3px rgba(55,100,225,.12);
}

.subtitle{
    margin-top:4px;
    font-size:22px;
    font-weight:700;
    color:#6d7480;
}

/* =========================
   卡片
========================= */

.card{
    background:#ffffff;
    border:1px solid #e3e7ee;
    border-radius:30px;
    padding:28px;
    margin-bottom:22px;
    box-shadow:
        0 3px 12px rgba(20,35,60,.04);
}

.card-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:30px;
    font-weight:900;
    margin-bottom:24px;
}

.section-icon{
    font-size:30px;
}

/* =========================
   新增區
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-label{
    display:block;
    font-size:22px;
    font-weight:900;
    margin-bottom:10px;
}

.input-box{
    width:100%;
    height:74px;
    border:2px solid #dce1e9;
    border-radius:24px;
    background:#fff;
    padding:0 22px;
    font-size:24px;
    font-weight:800;
    color:#182230;
    outline:none;
}

.input-box:focus{
    border-color:#3864e5;
    box-shadow:0 0 0 4px rgba(56,100,229,.10);
}

.primary-btn{
    width:100%;
    height:76px;
    border:0;
    border-radius:25px;
    background:#3864e5;
    color:white;
    font-size:27px;
    font-weight:900;
    margin-top:22px;
    box-shadow:0 8px 18px rgba(56,100,229,.18);
}

.primary-btn:active{
    transform:scale(.985);
}

/* =========================
   月份切換
========================= */

.month-selector{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:-5px 0 22px;
}

.month-btn{
    width:62px;
    height:62px;
    border:0;
    border-radius:20px;
    background:#3864e5;
    color:#fff;
    font-size:34px;
    font-weight:900;
    line-height:1;
    flex-shrink:0;
}

.month-btn:active{
    transform:scale(.95);
}

.month-display{
    flex:1;
    max-width:430px;
    height:62px;
    border-radius:20px;
    background:#edf4ff;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:27px;
    font-weight:950;
    color:#182230;
}

.month-note{
    text-align:center;
    background:#f4f7fc;
    border-radius:18px;
    padding:12px 15px;
    margin-bottom:20px;
    color:#6d7480;
    font-size:16px;
    font-weight:800;
}

.month-note strong{
    color:#3864e5;
}

/* =========================
   統計
========================= */

.stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.stat{
    background:#f4f7fc;
    border-radius:28px;
    min-height:190px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px 12px;
}

.stat-icon{
    font-size:42px;
    margin-bottom:6px;
}

.stat-number{
    font-size:54px;
    line-height:1.05;
    font-weight:950;
    letter-spacing:-1px;
}

.stat-label{
    font-size:21px;
    color:#6d7480;
    font-weight:800;
    margin-top:8px;
}

/* =========================
   總結
========================= */

.summary{
    background:#edf4ff;
    border-radius:28px;
    padding:26px 20px;
    text-align:center;
}

.summary-main{
    font-size:37px;
    font-weight:950;
}

.summary-sub{
    margin-top:6px;
    color:#6d7480;
    font-size:20px;
    font-weight:800;
}

/* =========================
   分布
========================= */

.distribution-row{
    display:grid;
    grid-template-columns:110px 1fr 80px;
    align-items:center;
    gap:12px;
    margin:18px 0;
}

.distribution-name{
    font-size:24px;
    font-weight:900;
}

.bar-bg{
    width:100%;
    height:28px;
    background:#e9edf3;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:100%;
    background:#3864e5;
    border-radius:20px;
    transition:width .3s ease;
}

.distribution-count{
    text-align:right;
    font-size:23px;
    font-weight:900;
}

/* =========================
   紀錄工具列
========================= */

.record-toolbar{
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

.tool-btn{
    flex:1;
    min-height:58px;
    border-radius:18px;
    border:2px solid #dce1e9;
    background:white;
    color:#182230;
    font-size:19px;
    font-weight:900;
}

.tool-btn:active{
    transform:scale(.98);
}

.clear-all{
    color:#d93636;
    border-color:#f2c7c7;
}

/* =========================
   查看區
========================= */

.records-wrap{
    display:none;
}

.records-wrap.show{
    display:block;
}

.record-row{
    display:grid;
    grid-template-columns:1fr auto auto;
    align-items:center;
    gap:15px;
    padding:20px 0;
    border-bottom:1px solid #e8ebf0;
}

.record-row:last-child{
    border-bottom:0;
}

.record-date{
    font-size:24px;
    font-weight:900;
}

.record-hours{
    font-size:24px;
    font-weight:950;
    min-width:70px;
    text-align:right;
}

.delete-btn{
    border:2px solid #f3cccc;
    background:white;
    color:#d93636;
    border-radius:18px;
    padding:13px 19px;
    font-size:18px;
    font-weight:900;
}

.delete-btn:active{
    transform:scale(.96);
}

.empty{
    text-align:center;
    color:#8a919c;
    font-size:20px;
    font-weight:800;
    padding:35px 10px;
}

/* =========================
   月份總覽
========================= */

.month-overview{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.month-item{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:15px;
    padding:17px 18px;
    border:2px solid #e3e7ee;
    border-radius:20px;
    background:#fff;
    cursor:pointer;
    transition:.2s ease;
}

.month-item.active{
    border-color:#3864e5;
    background:#edf4ff;
}

.month-item:active{
    transform:scale(.985);
}

.month-item-title{
    font-size:21px;
    font-weight:950;
}

.month-item-sub{
    margin-top:5px;
    color:#747c88;
    font-size:15px;
    font-weight:700;
}

.month-item-hours{
    font-size:25px;
    font-weight:950;
    color:#3864e5;
}

/* =========================
   提示
========================= */

.note{
    margin-top:18px;
    text-align:center;
    color:#747c88;
    font-size:17px;
    font-weight:700;
    line-height:1.7;
}

.save-status{
    text-align:center;
    color:#3864e5;
    font-size:15px;
    font-weight:800;
    margin-top:8px;
    min-height:22px;
}

/* =========================
   彈窗
========================= */

.modal-mask{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.42);
    z-index:9999;
    padding:20px;
    align-items:center;
    justify-content:center;
}

.modal-mask.show{
    display:flex;
}

.modal{
    width:min(430px,100%);
    background:#fff;
    border-radius:28px;
    padding:28px 24px 22px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-icon{
    font-size:48px;
    margin-bottom:8px;
}

.modal-title{
    font-size:26px;
    font-weight:950;
}

.modal-text{
    color:#666f7b;
    font-size:18px;
    font-weight:700;
    line-height:1.6;
    margin:12px 0 22px;
}

.modal-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.modal-btn{
    height:56px;
    border-radius:17px;
    font-size:19px;
    font-weight:900;
    border:0;
}

.modal-cancel{
    background:#eef1f5;
    color:#182230;
}

.modal-confirm{
    background:#df3d3d;
    color:white;
}

/* =========================
   RWD
========================= */

@media(max-width:650px){

    .container{
        padding:20px 14px 45px;
    }

    .header{
        padding-top:8px;
        padding-bottom:22px;
    }

    .title-input{
        font-size:34px;
    }

    .subtitle{
        font-size:18px;
    }

    .card{
        border-radius:25px;
        padding:21px 18px;
        margin-bottom:17px;
    }

    .card-title{
        font-size:27px;
        margin-bottom:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:15px;
    }

    .form-label{
        font-size:20px;
    }

    .input-box{
        height:66px;
        font-size:22px;
        border-radius:20px;
    }

    .primary-btn{
        height:68px;
        font-size:23px;
        border-radius:21px;
    }

    .month-selector{
        gap:7px;
    }

    .month-btn{
        width:50px;
        height:54px;
        border-radius:17px;
        font-size:28px;
    }

    .month-display{
        height:54px;
        border-radius:17px;
        font-size:21px;
    }

    .month-note{
        font-size:14px;
    }

    .stats-grid{
        gap:12px;
    }

    .stat{
        min-height:155px;
        border-radius:23px;
    }

    .stat-icon{
        font-size:34px;
    }

    .stat-number{
        font-size:42px;
    }

    .stat-label{
        font-size:17px;
    }

    .summary-main{
        font-size:30px;
    }

    .summary-sub{
        font-size:17px;
    }

    .distribution-row{
        grid-template-columns:65px 1fr 62px;
        gap:8px;
    }

    .distribution-name{
        font-size:20px;
    }

    .distribution-count{
        font-size:19px;
    }

    .record-row{
        grid-template-columns:1fr auto;
        gap:8px;
    }

    .record-date{
        font-size:21px;
    }

    .record-hours{
        font-size:22px;
    }

    .delete-btn{
        grid-column:2;
        padding:10px 15px;
        font-size:17px;
    }

    .tool-btn{
        font-size:17px;
    }

    .month-item{
        padding:14px;
    }

    .month-item-title{
        font-size:18px;
    }

    .month-item-hours{
        font-size:21px;
    }

}
</style>
</head>

<body>

<div class="container">

    <!-- =========================
         標題
    ========================== -->

    <header class="header">

        <div class="title-wrap">

            <input
                id="titleInput"
                class="title-input"
                type="text"
                value="📺 SUGO 2026/08"
                maxlength="50"
                aria-label="統計標題"
            >

        </div>

        <div class="subtitle">
            視頻直播時數統計
        </div>

        <div
            id="saveStatus"
            class="save-status"
        ></div>

    </header>


    <!-- =========================
         新增區
    ========================== -->

    <section class="card">

        <div class="card-title">
            <span class="section-icon">➕</span>
            新增直播紀錄
        </div>

        <div class="form-grid">

            <div>

                <label
                    class="form-label"
                    for="dateInput"
                >
                    📅 日期
                </label>

                <input
                    id="dateInput"
                    class="input-box"
                    type="date"
                >

            </div>


            <div>

                <label
                    class="form-label"
                    for="hoursInput"
                >
                    ⏱️ 直播時數
                </label>

                <select
                    id="hoursInput"
                    class="input-box"
                >

                    <option value="0.5">0.5H</option>
                    <option value="1">1H</option>
                    <option value="1.5">1.5H</option>
                    <option value="2" selected>2H</option>
                    <option value="2.5">2.5H</option>
                    <option value="3">3H</option>
                    <option value="3.5">3.5H</option>
                    <option value="4">4H</option>
                    <option value="4.5">4.5H</option>
                    <option value="5">5H</option>
                    <option value="5.5">5.5H</option>
                    <option value="6">6H</option>
                    <option value="6.5">6.5H</option>
                    <option value="7">7H</option>
                    <option value="7.5">7.5H</option>
                    <option value="8">8H</option>
                    <option value="8.5">8.5H</option>
                    <option value="9">9H</option>
                    <option value="9.5">9.5H</option>
                    <option value="10">10H</option>

                </select>

            </div>

        </div>


        <button
            id="addBtn"
            class="primary-btn"
            type="button"
        >
            ＋ 新增／更新直播
        </button>

    </section>


    <!-- =========================
         總統計
    ========================== -->

    <section class="card">

        <div class="card-title">
            <span class="section-icon">📊</span>
            總統計
        </div>


        <!-- ★ 月份切換 -->

        <div class="month-selector">

            <button
                id="prevMonth"
                class="month-btn"
                type="button"
                aria-label="上一個月"
            >
                ‹
            </button>


            <div
                id="monthDisplay"
                class="month-display"
            >
                2026 年 8 月
            </div>


            <button
                id="nextMonth"
                class="month-btn"
                type="button"
                aria-label="下一個月"
            >
                ›
            </button>

        </div>


        <div class="month-note">

            📌 目前統計月份：
            <strong id="monthNotice">
                2026 年 8 月
            </strong>

            <br>

            本頁所有統計只計算目前月份，
            <strong>不會與其他月份疊加</strong>。

        </div>


        <div class="stats-grid">

            <div class="stat">

                <div class="stat-icon">
                    🗓️
                </div>

                <div
                    id="totalDays"
                    class="stat-number"
                >
                    0
                </div>

                <div class="stat-label">
                    共幾天
                </div>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    ⏱️
                </div>

                <div
                    id="totalHours"
                    class="stat-number"
                >
                    0H
                </div>

                <div class="stat-label">
                    總共幾H
                </div>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    📈
                </div>

                <div
                    id="avgDay"
                    class="stat-number"
                >
                    0H
                </div>

                <div class="stat-label">
                    平均每天
                </div>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    📅
                </div>

                <div
                    id="avgWeek"
                    class="stat-number"
                >
                    0H
                </div>

                <div class="stat-label">
                    平均每週
                </div>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    🔝
                </div>

                <div
                    id="maxHours"
                    class="stat-number"
                >
                    0H
                </div>

                <div class="stat-label">
                    最長單次
                </div>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    📊
                </div>

                <div
                    id="statMonth"
                    class="stat-number"
                >
                    8月
                </div>

                <div class="stat-label">
                    統計月份
                </div>

            </div>

        </div>


        <div style="height:18px"></div>


        <div class="summary">

            <div
                id="summaryMain"
                class="summary-main"
            >
                📺 共 0 天 / 0H
            </div>


            <div
                id="summarySub"
                class="summary-sub"
            >
                2026 年 8 月｜SUGO 視頻直播
            </div>

        </div>

    </section>


    <!-- =========================
         分布
    ========================== -->

    <section class="card">

        <div class="card-title">

            <span class="section-icon">
                📊
            </span>

            直播時數分布

        </div>


        <div id="distribution"></div>

    </section>


    <!-- =========================
         每日紀錄
    ========================== -->

    <section class="card">

        <div class="card-title">

            <span class="section-icon">
                📋
            </span>

            每日直播紀錄

        </div>


        <div class="record-toolbar">

            <button
                id="viewBtn"
                class="tool-btn"
                type="button"
            >
                👀 查看
            </button>


            <button
                id="sortBtn"
                class="tool-btn"
                type="button"
            >
                🔽 日期排序
            </button>


            <button
                id="clearAllBtn"
                class="tool-btn clear-all"
                type="button"
            >
                🗑️ 清除本月
            </button>

        </div>


        <div
            id="recordsWrap"
            class="records-wrap"
        >

            <div id="records"></div>

        </div>


        <div class="note">

            目前只顯示
            <strong id="recordMonthNote">
                2026 年 8 月
            </strong>
            的直播紀錄。<br>

            同一天再次新增會直接更新該天時數，不會重複計算。

        </div>

    </section>


    <!-- =========================
         月份概況
    ========================== -->

    <section class="card">

        <div class="card-title">

            <span class="section-icon">
                🗓️
            </span>

            各月份概況

        </div>


        <div
            id="monthOverview"
            class="month-overview"
        ></div>


        <div class="note">
            點擊月份即可切換統計。
        </div>

    </section>

</div>


<!-- =========================
     彈窗
========================= -->

<div
    id="modalMask"
    class="modal-mask"
>

    <div class="modal">

        <div class="modal-icon">
            ⚠️
        </div>


        <div
            id="modalTitle"
            class="modal-title"
        >
            確定要刪除嗎？
        </div>


        <div
            id="modalText"
            class="modal-text"
        >
            刪除後資料將無法復原。
        </div>


        <div class="modal-buttons">

            <button
                id="modalCancel"
                class="modal-btn modal-cancel"
                type="button"
            >
                取消
            </button>


            <button
                id="modalConfirm"
                class="modal-btn modal-confirm"
                type="button"
            >
                確定刪除
            </button>

        </div>

    </div>

</div>

    document.getElementById("recordsWrap");

const recordsEl =
    document.getElementById("records");

const monthOverview =
    document.getElementById("monthOverview");

const modalMask =
    document.getElementById("modalMask");

const modalTitle =
    document.getElementById("modalTitle");

const modalText =
    document.getElementById("modalText");

const modalCancel =
    document.getElementById("modalCancel");

const modalConfirm =
    document.getElementById("modalConfirm");

const saveStatus =
    document.getElementById("saveStatus");


/* =========================================================
   目前統計月份
   預設 2026 年 8 月
========================================================= */

let currentYear = 2026;

let currentMonth = 8;


/* =========================================================
   初始資料
   保留你原本的 8 月 19 天 / 30.5H
========================================================= */

const initialRecords = [

    {date:"2026-08-03",hours:2},
    {date:"2026-08-07",hours:1},
    {date:"2026-08-09",hours:1},
    {date:"2026-08-10",hours:1.5},
    {date:"2026-08-11",hours:2},
    {date:"2026-08-13",hours:1},
    {date:"2026-08-14",hours:1},
    {date:"2026-08-16",hours:2},
    {date:"2026-08-17",hours:2},
    {date:"2026-08-18",hours:2},
    {date:"2026-08-19",hours:2},
    {date:"2026-08-20",hours:1},
    {date:"2026-08-21",hours:1},
    {date:"2026-08-23",hours:2},
    {date:"2026-08-24",hours:2},
    {date:"2026-08-25",hours:2},
    {date:"2026-08-26",hours:2},
    {date:"2026-08-27",hours:1},
    {date:"2026-08-31",hours:2}

];


/* =========================================================
   狀態
========================================================= */

let records =
    loadRecords();


let sortNewestFirst =
    localStorage.getItem(SORT_KEY) !== "oldest";


let recordsVisible =
    false;


let pendingAction =
    null;


/* =========================================================
   初始化
========================================================= */

function init(){

    const savedTitle =
        localStorage.getItem(TITLE_KEY);


    if(
        savedTitle !== null &&
        savedTitle.trim() !== ""
    ){

        titleInput.value =
            savedTitle;

    }


    setTodayIfEmpty();


    /*
       如果今天不是 2026/08，
       仍然維持 2026/08 作為首頁，
       因為這個頁面就是你的 SUGO 2026/08。
    */


    renderAll();


    recordsWrap.classList.remove(
        "show"
    );


    recordsVisible =
        false;


    viewBtn.textContent =
        "👀 查看";


    updateSortButton();


    updatePageTitle();

}


/* =========================================================
   載入資料
========================================================= */

function loadRecords(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(saved){

            const parsed =
                JSON.parse(saved);


            if(Array.isArray(parsed)){

                return parsed
                    .filter(item =>
                        item &&
                        typeof item.date === "string" &&
                        /^\d{4}-\d{2}-\d{2}$/.test(item.date) &&
                        Number.isFinite(
                            Number(item.hours)
                        )
                    )
                    .map(item => ({
                        date:item.date,
                        hours:Number(item.hours)
                    }));

            }

        }

    }catch(error){

        console.error(
            "讀取資料失敗：",
            error
        );

    }


    /*
       第一次使用才建立原始資料
    */

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(initialRecords)
    );


    return [...initialRecords];

}


/* =========================================================
   儲存資料
========================================================= */

function saveRecords(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(records)
    );


    showSaved();

}


/* =========================================================
   標題
========================================================= */

function saveTitle(){

    let title =
        titleInput.value.trim();


    if(title === ""){

        title =
            "📺 SUGO";

        titleInput.value =
            title;

    }


    localStorage.setItem(
        TITLE_KEY,
        title
    );


    updatePageTitle();


    showSaved();

}


function updatePageTitle(){

    document.title =
        titleInput.value.trim() +
        "｜視頻直播時數統計";

}


/* =========================================================
   儲存提示
========================================================= */

let saveTimer =
    null;


function showSaved(){

    saveStatus.textContent =
        "✓ 已自動儲存";


    clearTimeout(
        saveTimer
    );


    saveTimer =
        setTimeout(
            function(){

                saveStatus.textContent =
                    "";

            },
            1200
        );

}


/* =========================================================
   日期
========================================================= */

function setTodayIfEmpty(){

    if(dateInput.value){
        return;
    }


    const now =
        new Date();


    const y =
        now.getFullYear();


    const m =
        String(
            now.getMonth()+1
        ).padStart(2,"0");


    const d =
        String(
            now.getDate()
        ).padStart(2,"0");


    dateInput.value =
        `${y}-${m}-${d}`;

}


/* =========================================================
   YYYY-MM
========================================================= */

function getMonthKey(
    year,
    month
){

    return (
        String(year) +
        "-" +
        String(month).padStart(2,"0")
    );

}


/* =========================================================
   取得日期月份
========================================================= */

function getRecordMonthKey(
    date
){

    return date.substring(
        0,
        7
    );

}


/* =========================================================
   取得目前月份資料
   ★★★★★
   所有統計都從這裡取得
========================================================= */

function getCurrentMonthRecords(){

    const key =
        getMonthKey(
            currentYear,
            currentMonth
        );


    return records.filter(
        item =>
            getRecordMonthKey(item.date) === key
    );

}


/* =========================================================
   取得目前月份文字
========================================================= */

function getCurrentMonthText(){

    return (
        currentYear +
        " 年 " +
        currentMonth +
        " 月"
    );

}


/* =========================================================
   月份切換
========================================================= */

function changeMonth(
    offset
){

    const date =
        new Date(
            currentYear,
            currentMonth - 1,
            1
        );


    date.setMonth(
        date.getMonth() + offset
    );


    currentYear =
        date.getFullYear();


    currentMonth =
        date.getMonth() + 1;


    renderAll();

}


/* =========================================================
   切換到指定日期的月份
========================================================= */

function selectDateMonth(
    dateString
){

    const parts =
        dateString.split("-");


    if(parts.length !== 3){
        return;
    }


    currentYear =
        Number(parts[0]);


    currentMonth =
        Number(parts[1]);

}


/* =========================================================
   日期格式
========================================================= */

function formatDate(
    dateString
){

    const parts =
        dateString.split("-");


    if(parts.length !== 3){
        return dateString;
    }


    return (
        parts[0] +
        "/" +
        parts[1] +
        "/" +
        parts[2]
    );

}


/* =========================================================
   小數格式
========================================================= */

function formatHours(
    value
){

    const num =
        Number(value);


    if(!Number.isFinite(num)){
        return "0";
    }


    if(
        Math.abs(
            num -
            Math.round(num)
        ) < 0.000001
    ){

        return String(
            Math.round(num)
        );

    }


    return num
        .toFixed(2)
        .replace(/0+$/,"")
        .replace(/\.$/,"");

}


/* =========================================================
   計算目前月份統計
   ★ 不再使用全部 records
========================================================= */

function calculateStats(){

    const data =
        getCurrentMonthRecords();


    const days =
        data.length;


    const hours =
        data.reduce(
            (sum,item) =>
                sum +
                Number(item.hours),
            0
        );


    const averageDay =
        days > 0
        ? hours / days
        : 0;


    /*
       平均每週按照目前月份實際天數計算
    */

    const daysInMonth =
        new Date(
            currentYear,
            currentMonth,
            0
        ).getDate();


    const averageWeek =
        daysInMonth > 0
        ? hours /
          daysInMonth *
          7
        : 0;


    const max =
        days > 0
        ? Math.max(
            ...data.map(
                item =>
                    Number(item.hours)
            )
        )
        : 0;


    return {
        days,
        hours,
        averageDay,
        averageWeek,
        max
    };

}


/* =========================================================
   更新統計
========================================================= */

function renderStats(){

    const stats =
        calculateStats();


    const monthText =
        getCurrentMonthText();


    monthDisplay.textContent =
        monthText;


    monthNotice.textContent =
        monthText;


    recordMonthNote.textContent =
        monthText;


    totalDays.textContent =
        stats.days;


    totalHours.textContent =
        formatHours(
            stats.hours
        ) +
        "H";


    avgDay.textContent =
        formatHours(
            stats.averageDay
        ) +
        "H";


    avgWeek.textContent =
        formatHours(
            stats.averageWeek
        ) +
        "H";


    maxHours.textContent =
        formatHours(
            stats.max
        ) +
        "H";


    statMonth.textContent =
        currentMonth +
        "月";


    summaryMain.textContent =
        `📺 共 ${stats.days} 天 / ${formatHours(stats.hours)}H`;


    summarySub.textContent =
        `${monthText}｜${
            titleInput.value.trim() ||
            "SUGO"
        } 視頻直播`;

}


/* =========================================================
   直播時數分布
   ★ 只計算目前月份
========================================================= */

function renderDistribution(){

    const data =
        getCurrentMonthRecords();


    const distributionMap =
        {};


    data.forEach(item => {

        const key =
            formatHours(
                item.hours
            );


        distributionMap[key] =
            (
                distributionMap[key] ||
                0
            ) + 1;

    });


    const keys =
        Object.keys(
            distributionMap
        )
        .map(Number)
        .sort(
            (a,b) =>
                a-b
        );


    if(keys.length === 0){

        distribution.innerHTML =
            `
            <div class="empty">
                📭 ${getCurrentMonthText()}目前沒有直播紀錄
            </div>
            `;

        return;

    }


    const maxCount =
        Math.max(
            ...keys.map(
                key =>
                    distributionMap[
                        formatHours(key)
                    ]
            )
        );


    distribution.innerHTML =
        "";


    keys.forEach(
        function(hour){

            const key =
                formatHours(hour);


            const count =
                distributionMap[key];


            const percent =
                maxCount > 0
                ? count /
                  maxCount *
                  100
                : 0;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "distribution-row";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "distribution-name";


            name.textContent =
                key + "H";


            const bg =
                document.createElement(
                    "div"
                );


            bg.className =
                "bar-bg";


            const bar =
                document.createElement(
                    "div"
                );


            bar.className =
                "bar";


            bar.style.width =
                percent + "%";


            bg.appendChild(bar);


            const countEl =
                document.createElement(
                    "div"
                );


            countEl.className =
                "distribution-count";


            countEl.textContent =
                count + "天";


            row.appendChild(name);

            row.appendChild(bg);

            row.appendChild(countEl);


            distribution.appendChild(row);

        }
    );

}


/* =========================================================
   目前月份排序
========================================================= */

function getSortedRecords(){

    const copy =
        [
            ...getCurrentMonthRecords()
        ];


    copy.sort(
        function(a,b){

            const result =
                a.date.localeCompare(
                    b.date
                );


            return sortNewestFirst
                ? -result
                : result;

        }
    );


    return copy;

}


/* =========================================================
   每日紀錄
   ★ 只顯示目前月份
========================================================= */

function renderRecords(){

    recordsEl.innerHTML =
        "";


    const data =
        getSortedRecords();


    if(data.length === 0){

        recordsEl.innerHTML =
            `
            <div class="empty">
                📭 ${getCurrentMonthText()}目前沒有直播紀錄
            </div>
            `;

        return;

    }


    data.forEach(
        function(item){

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "record-row";


            const date =
                document.createElement(
                    "div"
                );


            date.className =
                "record-date";


            date.textContent =
                "📅 " +
                formatDate(item.date);


            const hours =
                document.createElement(
                    "div"
                );


            hours.className =
                "record-hours";


            hours.textContent =
                formatHours(
                    item.hours
                ) +
                "H";


            const deleteBtn =
                document.createElement(
                    "button"
                );


            deleteBtn.className =
                "delete-btn";


            deleteBtn.type =
                "button";


            deleteBtn.textContent =
                "刪除";


            deleteBtn.addEventListener(
                "click",
                function(){

                    confirmDeleteSingle(
                        item.date
                    );

                }
            );


            row.appendChild(date);

            row.appendChild(hours);

            row.appendChild(deleteBtn);


            recordsEl.appendChild(row);

        }
    );

}


/* =========================================================
   月份概況
   ★ 每個月分開顯示
========================================================= */

function renderMonthOverview(){

    const groups =
        {};


    records.forEach(
        function(item){

            const key =
                getRecordMonthKey(
                    item.date
                );


            if(!groups[key]){

                groups[key] = [];

            }


            groups[key].push(item);

        }
    );


    const keys =
        Object.keys(groups)
            .sort()
            .reverse();


    monthOverview.innerHTML =
        "";


    if(keys.length === 0){

        monthOverview.innerHTML =
            `
            <div class="empty">
                📭 目前沒有任何月份資料
            </div>
            `;

        return;

    }


    keys.forEach(
        function(key){

            const data =
                groups[key];


            const parts =
                key.split("-");


            const year =
                Number(parts[0]);


            const month =
                Number(parts[1]);


            const total =
                data.reduce(
                    (sum,item) =>
                        sum +
                        Number(item.hours),
                    0
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "month-item";


            if(
                year === currentYear &&
                month === currentMonth
            ){

                item.classList.add(
                    "active"
                );

            }


            const left =
                document.createElement(
                    "div"
                );


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "month-item-title";


            title.textContent =
                `${year} 年 ${month} 月`;


            const sub =
                document.createElement(
                    "div"
                );


            sub.className =
                "month-item-sub";


            sub.textContent =
                `${data.length} 天有直播紀錄`;


            left.appendChild(title);

            left.appendChild(sub);


            const totalEl =
                document.createElement(
                    "div"
                );


            totalEl.className =
                "month-item-hours";


            totalEl.textContent =
                formatHours(total) +
                "H";


            item.appendChild(left);

            item.appendChild(totalEl);


            item.addEventListener(
                "click",
                function(){

                    currentYear =
                        year;


                    currentMonth =
                        month;


                    renderAll();


                }
            );


            monthOverview.appendChild(item);

        }
    );

}


/* =========================================================
   全部重新渲染
========================================================= */

function renderAll(){

    renderStats();

    renderDistribution();

    renderRecords();

    renderMonthOverview();

    updateSortButton();

}


/* =========================================================
   排序按鈕
========================================================= */

function updateSortButton(){

    sortBtn.textContent =
        sortNewestFirst
        ? "🔽 新到舊"
        : "🔼 舊到新";

}


/* =========================================================
   新增 / 更新
   ★ 新增哪個月份就自動切到哪個月份
========================================================= */

function addOrUpdateRecord(){

    const date =
        dateInput.value;


    const hours =
        Number(
            hoursInput.value
        );


    if(!date){

        alert(
            "請先選擇日期。"
        );

        return;

    }


    if(
        !Number.isFinite(hours) ||
        hours <= 0
    ){

        alert(
            "請選擇直播時數。"
        );

        return;

    }


    /*
       自動切到輸入日期的月份
    */

    selectDateMonth(date);


    const index =
        records.findIndex(
            item =>
                item.date === date
        );


    if(index >= 0){

        records[index].hours =
            hours;

    }else{

        records.push({
            date:date,
            hours:hours
        });

    }


    saveRecords();

    renderAll();


    recordsVisible =
        true;


    recordsWrap.classList.add(
        "show"
    );


    viewBtn.textContent =
        "🙈 隱藏";


    setTimeout(
        function(){

            recordsWrap.scrollIntoView({
                behavior:"smooth",
                block:"nearest"
            });

        },
        100
    );

}


/* =========================================================
   查看 / 隱藏
========================================================= */

function toggleRecords(){

    recordsVisible =
        !recordsVisible;


    if(recordsVisible){

        recordsWrap.classList.add(
            "show"
        );


        viewBtn.textContent =
            "🙈 隱藏";

    }else{

        recordsWrap.classList.remove(
            "show"
        );


        viewBtn.textContent =
            "👀 查看";

    }

}


/* =========================================================
   排序
========================================================= */

function toggleSort(){

    sortNewestFirst =
        !sortNewestFirst;


    localStorage.setItem(
        SORT_KEY,
        sortNewestFirst
        ? "newest"
        : "oldest"
    );


    renderRecords();

    updateSortButton();

}


/* =========================================================
   確認視窗
========================================================= */

function openConfirm(
    title,
    text,
    action
){

    pendingAction =
        action;


    modalTitle.textContent =
        title;


    modalText.textContent =
        text;


    modalMask.classList.add(
        "show"
    );

}


function closeConfirm(){

    pendingAction =
        null;


    modalMask.classList.remove(
        "show"
    );

}


/* =========================================================
   刪除單筆
========================================================= */

function confirmDeleteSingle(
    date
){

    const target =
        records.find(
            item =>
                item.date === date
        );


    if(!target){
        return;
    }


    openConfirm(
        "確定要刪除這筆嗎？",
        `即將刪除 ${formatDate(date)} 的 ${formatHours(target.hours)}H 直播紀錄。`,
        function(){

            records =
                records.filter(
                    item =>
                        item.date !== date
                );


            saveRecords();

            renderAll();

        }
    );

}


/* =========================================================
   清除「目前月份」
   ★ 不會影響其他月份
========================================================= */

function confirmClearMonth(){

    const data =
        getCurrentMonthRecords();


    if(data.length === 0){

        alert(
            `${getCurrentMonthText()}目前沒有任何資料。`
        );

        return;

    }


    const stats =
        calculateStats();


    openConfirm(
        `⚠️ 清除 ${getCurrentMonthText()}？`,
        `只會刪除本月份 ${stats.days} 天、${formatHours(stats.hours)}H。其他月份資料完全不會受到影響。`,
        function(){

            const key =
                getMonthKey(
                    currentYear,
                    currentMonth
                );


            records =
                records.filter(
                    item =>
                        getRecordMonthKey(
                            item.date
                        ) !== key
                );


            saveRecords();

            renderAll();


            recordsVisible =
                true;


            recordsWrap.classList.add(
                "show"
            );


            viewBtn.textContent =
                "🙈 隱藏";

        }
    );

}


/* =========================================================
   事件
========================================================= */

addBtn.addEventListener(
    "click",
    addOrUpdateRecord
);


prevMonth.addEventListener(
    "click",
    function(){

        changeMonth(-1);

    }
);


nextMonth.addEventListener(
    "click",
    function(){

        changeMonth(1);

    }
);


viewBtn.addEventListener(
    "click",
    toggleRecords
);


sortBtn.addEventListener(
    "click",
    toggleSort
);


clearAllBtn.addEventListener(
    "click",
    confirmClearMonth
);


/* =========================================================
   Modal
========================================================= */

modalCancel.addEventListener(
    "click",
    closeConfirm
);


modalConfirm.addEventListener(
    "click",
    function(){

        if(
            typeof pendingAction ===
            "function"
        ){

            const action =
                pendingAction;


            closeConfirm();


            action();

        }else{

            closeConfirm();

        }

    }
);


modalMask.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            modalMask
        ){

            closeConfirm();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            closeConfirm();

        }

    }
);


/* =========================================================
   標題自動儲存
========================================================= */

titleInput.addEventListener(
    "input",
    function(){

        saveTitle();

        renderStats();

    }
);


titleInput.addEventListener(
    "blur",
    function(){

        saveTitle();

    }
);


titleInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            titleInput.blur();

        }

    }
);


/* =========================================================
   日期改變
   ★ 選擇日期時同步切換月份
========================================================= */

dateInput.addEventListener(
    "change",
    function(){

        if(dateInput.value){

            selectDateMonth(
                dateInput.value
            );


            renderAll();

        }

    }
);


/* =========================================================
   初始化
========================================================= */

init();

})();
</script>

</body>
</html>

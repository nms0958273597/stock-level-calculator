<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禾田訂單</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  padding:7px;
  background:#f3f5f4;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",
  "Microsoft JhengHei",sans-serif;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
}

/* ===== 頂部 ===== */

.header{
  background:linear-gradient(135deg,#315a3a,#71945b);
  color:#fff;
  border-radius:18px;
  padding:14px 10px;
  text-align:center;
  margin-bottom:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.main-title{
  font-size:29px;
  font-weight:900;
  letter-spacing:2px;
}

.date{
  margin-top:4px;
  font-size:20px;
  font-weight:800;
}

.time{
  margin-top:2px;
  font-size:17px;
  font-weight:700;
}

/* ===== 卡片 ===== */

.card{
  background:#fff;
  border-radius:17px;
  padding:10px;
  margin-bottom:8px;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.card-title{
  font-size:24px;
  font-weight:900;
  margin:2px 4px 8px;
}

/* ===== 品項 ===== */

.item{
  border:1px solid #dfe3e1;
  border-radius:15px;
  padding:10px 9px;
  margin-bottom:7px;
  background:#fff;
}

.item:last-child{
  margin-bottom:0;
}

.item-name{
  font-size:20px;
  font-weight:900;
  margin:0 2px 7px;
}

/* ===== 數量 ===== */

.row{
  display:grid;
  grid-template-columns:58px 1fr 58px;
  gap:6px;
  align-items:center;
}

.qty-btn{
  height:47px;
  border:0;
  border-radius:11px;
  font-size:28px;
  font-weight:900;
  cursor:pointer;
  padding:0;
}

.minus{
  background:#ffebee;
  color:#c62828;
}

.plus{
  background:#e8f5e9;
  color:#2e7d32;
}

.qty{
  width:100%;
  height:47px;
  border:2px solid #cfd8dc;
  border-radius:11px;
  text-align:center;
  font-size:23px;
  font-weight:900;
  outline:none;
  background:#fff;
  color:#000;
  padding:0 5px;
}

.qty:focus{
  border-color:#52754d;
}

/* ===== 單價 ===== */

.price-row{
  display:grid;
  grid-template-columns:65px 1fr;
  gap:7px;
  align-items:center;
  margin-top:7px;
}

.price-label{
  font-size:17px;
  font-weight:900;
  color:#555;
}

.price{
  width:100%;
  height:43px;
  border:2px solid #d0d6d3;
  border-radius:10px;
  padding:0 10px;
  text-align:right;
  font-size:19px;
  font-weight:800;
  outline:none;
  background:#fff;
  color:#111;
}

.price:focus{
  border-color:#52754d;
}

/* ===== 總結 ===== */

.summary{
  margin-top:8px;
  background:#edf5eb;
  border-radius:13px;
  padding:10px 12px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:3px 0;
  font-size:18px;
  font-weight:800;
}

.total{
  font-size:28px;
  font-weight:900;
}

/* ===== 詳細訂單 ===== */

.order-text{
  white-space:pre-wrap;
  background:#f8f9f8;
  border:1px solid #ddd;
  border-radius:11px;
  padding:11px;
  font-size:16px;
  line-height:1.55;
  min-height:115px;
}

/* ===== 按鈕 ===== */

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}

.action{
  min-height:51px;
  border:0;
  border-radius:12px;
  color:#fff;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.copy{
  background:#3949ab;
}

.share{
  background:#00897b;
}

.save{
  background:#ef6c00;
}

.clear{
  background:#757575;
}

.previous{
  background:#6a4c93;
}

.message{
  text-align:center;
  min-height:20px;
  margin-top:7px;
  color:#666;
  font-size:14px;
  font-weight:700;
}

.note{
  text-align:center;
  margin-top:6px;
  color:#777;
  font-size:13px;
}

/* ===== 手機 ===== */

@media(max-width:430px){

  body{
    padding:5px;
  }

  .header{
    padding:12px 8px;
    margin-bottom:6px;
    border-radius:17px;
  }

  .main-title{
    font-size:27px;
  }

  .date{
    font-size:19px;
  }

  .time{
    font-size:16px;
  }

  .card{
    padding:8px;
    margin-bottom:6px;
    border-radius:16px;
  }

  .card-title{
    font-size:23px;
    margin:2px 3px 7px;
  }

  .item{
    padding:9px 8px;
    margin-bottom:6px;
    border-radius:14px;
  }

  .item-name{
    font-size:19px;
    margin-bottom:6px;
  }

  .row{
    grid-template-columns:57px 1fr 57px;
    gap:6px;
  }

  .qty-btn{
    height:46px;
    font-size:27px;
  }

  .qty{
    height:46px;
    font-size:22px;
  }

  .price-row{
    grid-template-columns:62px 1fr;
    margin-top:6px;
  }

  .price{
    height:42px;
    font-size:18px;
  }

  .summary{
    margin-top:7px;
    padding:9px 11px;
  }

  .summary-row{
    font-size:17px;
  }

  .total{
    font-size:27px;
  }

  .action{
    min-height:49px;
    font-size:16px;
  }
}
</style>
</head>

<script>

/* ===== 品項資料 ===== */

const items = [

  {
    id:"cup90",
    name:"90口徑Y500紙杯",
    priceId:"price_cup90"
  },

  {
    id:"bowl390",
    name:"390碗加蓋",
    priceId:"price_bowl390"
  },

  {
    id:"y700",
    name:"Y700",
    priceId:"price_y700"
  },

  {
    id:"bag1",
    name:"一杯袋",
    priceId:"price_bag1"
  },

  {
    id:"bag2",
    name:"兩杯袋",
    priceId:"price_bag2"
  },

  {
    id:"bag3",
    name:"三杯袋",
    priceId:"price_bag3"
  },

  {
    id:"holder4",
    name:"四杯架",
    priceId:"price_holder4"
  },

  {
    id:"cup30",
    name:"30cc試飲杯",
    priceId:"price_cup30"
  },

  {
    id:"straw",
    name:"821吸管單支包",
    priceId:"price_straw"
  },

  {
    id:"spoon",
    name:"大湯匙",
    priceId:"price_spoon"
  }

];


/* ===== 取得數字 ===== */

function getNumber(id){

  const element =
    document.getElementById(id);

  if(!element){
    return 0;
  }

  let value =
    parseFloat(element.value);

  if(isNaN(value)){
    value = 0;
  }

  if(value < 0){
    value = 0;
  }

  return value;
}


/* ===== 加減數量 ===== */

function changeQty(id,amount){

  const input =
    document.getElementById(id);

  let value =
    parseInt(input.value,10);

  if(isNaN(value)){
    value = 0;
  }

  value += amount;

  if(value < 0){
    value = 0;
  }

  input.value = value;

  updateAll();
}


/* ===== 金額格式 ===== */

function money(number){

  return Number(number).toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:2
    }
  );

}


/* ===== 日期時間 ===== */

function updateDateTime(){

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    now.getMonth()+1;

  const day =
    now.getDate();

  const weeks = [

    "星期日",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六"

  ];

  const week =
    weeks[now.getDay()];

  const h =
    String(
      now.getHours()
    ).padStart(2,"0");

  const m =
    String(
      now.getMinutes()
    ).padStart(2,"0");

  const s =
    String(
      now.getSeconds()
    ).padStart(2,"0");


  document.getElementById(
    "dateText"
  ).textContent =
    `${year}年${month}月${day}日（${week}）`;


  document.getElementById(
    "timeText"
  ).textContent =
    `${h}:${m}:${s}`;

}


/* ===== 更新全部 ===== */

function updateAll(){

  let totalQty = 0;

  let grandTotal = 0;


  items.forEach(item => {

    const qty =
      getNumber(item.id);

    const price =
      getNumber(item.priceId);


    totalQty += qty;

    grandTotal +=
      qty * price;

  });


  document.getElementById(
    "totalQty"
  ).textContent =
    money(totalQty);


  document.getElementById(
    "grandTotal"
  ).textContent =
    "$" + money(grandTotal);


  document.getElementById(
    "orderText"
  ).textContent =
    createOrderText();


  saveSilently();

}


/* ===== 建立詳細訂單 ===== */

function createOrderText(){

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    now.getMonth()+1;

  const day =
    now.getDate();


  const weeks = [

    "星期日",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六"

  ];

  const week =
    weeks[now.getDay()];


  const h =
    String(
      now.getHours()
    ).padStart(2,"0");

  const m =
    String(
      now.getMinutes()
    ).padStart(2,"0");

  const s =
    String(
      now.getSeconds()
    ).padStart(2,"0");


  let text = "";


  text +=
    "🌾 禾田訂單\n";

  text +=
    "━━━━━━━━━━━━━━\n";

  text +=
    `${year}年${month}月${day}日（${week}）\n`;

  text +=
    `時間：${h}:${m}:${s}\n\n`;


  let hasOrder =
    false;

  let totalQty =
    0;

  let grandTotal =
    0;


  items.forEach(item => {

    const qty =
      getNumber(item.id);

    const price =
      getNumber(item.priceId);


    if(qty > 0){

      hasOrder =
        true;


      const subtotal =
        qty * price;


      text +=
        `${item.name}\n`;

      text +=
        `件數：${money(qty)} 件\n`;


      if(price > 0){

        text +=
          `單價：$${money(price)}\n`;

      }else{

        text +=
          `單價：未填寫\n`;

      }


      text += "\n";


      totalQty +=
        qty;

      grandTotal +=
        subtotal;

    }

  });


  if(!hasOrder){

    text +=
      "尚未選擇訂購品項\n";

  }else{

    text +=
      "━━━━━━━━━━━━━━\n";

    text +=
      `📦 訂購總件數：${money(totalQty)} 件\n`;

    text +=
      `💰 訂單總金額：$${money(grandTotal)}\n`;

  }


  return text;

}


/* ===== 取得目前資料 ===== */

function getData(){

  const data = {};


  items.forEach(item => {

    data[item.id] =
      getNumber(item.id);

    data[item.priceId] =
      getNumber(item.priceId);

  });


  return data;

}


/* ===== 自動儲存 ===== */

function saveSilently(){

  localStorage.setItem(

    "hetaOrderCurrent",

    JSON.stringify(
      getData()
    )

  );

}


/* ===== 儲存上一筆 ===== */

function saveOrder(){

  const data =
    getData();


  localStorage.setItem(

    "hetaOrderCurrent",

    JSON.stringify(data)

  );


  localStorage.setItem(

    "hetaOrderPrevious",

    JSON.stringify(data)

  );


  showMessage(
    "💾 訂單已儲存"
  );

}


/* ===== 套用資料 ===== */

function applyData(data){

  items.forEach(item => {

    if(
      data[item.id] !== undefined
    ){

      document.getElementById(
        item.id
      ).value =
        data[item.id];

    }


    if(
      data[item.priceId] !== undefined
    ){

      document.getElementById(
        item.priceId
      ).value =
        data[item.priceId];

    }

  });


  updateAll();

}


/* ===== 載入自動儲存 ===== */

function loadSavedOrder(){

  const saved =
    localStorage.getItem(
      "hetaOrderCurrent"
    );


  if(!saved){

    updateAll();

    return;

  }


  try{

    const data =
      JSON.parse(saved);

    applyData(data);

  }catch(error){

    updateAll();

  }

}


/* ===== 載入上一筆 ===== */

function loadPreviousOrder(){

  const saved =
    localStorage.getItem(
      "hetaOrderPrevious"
    );


  if(!saved){

    showMessage(
      "目前沒有上一筆訂單"
    );

    return;

  }


  try{

    const data =
      JSON.parse(saved);

    applyData(data);


    showMessage(
      "↩️ 已載入上一筆訂單"
    );

  }catch(error){

    showMessage(
      "無法載入上一筆訂單"
    );

  }

}


/* ===== 複製訂單 ===== */

async function copyOrder(){

  const text =
    createOrderText();


  try{

    await navigator.clipboard.writeText(
      text
    );


    showMessage(
      "📋 詳細訂單已複製"
    );


  }catch(error){

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    textarea.style.position =
      "fixed";

    textarea.style.left =
      "-9999px";


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    showMessage(
      "📋 詳細訂單已複製"
    );

  }

}


/* ===== 分享 ===== */

async function shareOrder(){

  const text =
    createOrderText();


  if(navigator.share){

    try{

      await navigator.share({

        title:"🌾 禾田訂單",

        text:text

      });


      showMessage(
        "📤 訊息已分享"
      );


    }catch(error){

      if(
        error.name !==
        "AbortError"
      ){

        showMessage(
          "分享取消"
        );

      }

    }

  }else{

    await copyOrder();


    showMessage(
      "📋 已複製，可貼到 LINE 或訊息"
    );

  }

}


/* ===== 清除訂單 ===== */

function clearOrder(){

  const ok =
    confirm(
      "確定要清除目前全部訂單嗎？"
    );


  if(!ok){

    return;

  }


  items.forEach(item => {

    document.getElementById(
      item.id
    ).value = 0;

  });


  localStorage.removeItem(
    "hetaOrderCurrent"
  );


  updateAll();


  showMessage(
    "🗑️ 訂單數量已清除"
  );

}


/* ===== 訊息 ===== */

function showMessage(message){

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    message;


  clearTimeout(
    window.messageTimer
  );


  window.messageTimer =
    setTimeout(() => {

      element.textContent =
        "數量與金額會自動儲存";

    },3000);

}


/* ===== 啟動 ===== */

setInterval(
  updateDateTime,
  1000
);


updateDateTime();


loadSavedOrder();

</script>

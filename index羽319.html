<style>

.hero{

<body>

<div class="wrap">

<div class="topbar">

<div class="brand">

</div>

<div class="topActions">

</div>

</div>

id="searchInput"

</button>

搜尋後分析：
股價＋EPS＋PE＋每股淨值＋PBR＋殖利率＋外資＋投信＋自營商＋三大法人＋均線＋估值情境。
</div>

<h2>
📊 台股 AI 法人籌碼分析
</h2>

1326、2330、2891、0050。
</div>

</div>

</span>

</div>

<script>

"use strict";

/* =========================================================
API
========================================================= */

const FINMIND=
"https://api.finmindtrade.com/api/v4/data";

const MIS=
"https://mis.twse.com.tw/stock/api/getStockInfo.jsp";


/* =========================================================
股票資料
========================================================= */

const STOCKS={

"1326":{
name:"台化",

},

"2891":{
name:"中信金",

market:"tse"
},

"2330":{
name:"台積電",
industry:"半導體業",
market:"tse"
},

"2317":{
name:"鴻海",
industry:"電子零組件業",
market:"tse"
},

"2308":{
name:"台達電",
industry:"電子零組件業",
market:"tse"
},

"2303":{
name:"聯電",
industry:"半導體業",
market:"tse"
},

"1301":{
name:"台塑",
industry:"塑膠工業",
market:"tse"
},

"1303":{
name:"南亞",
industry:"塑膠工業",
market:"tse"
},

"2002":{
name:"中鋼",
industry:"鋼鐵業",
market:"tse"
},

"2313":{
name:"華通",
industry:"電子零組件業",
market:"tse"
},

"3481":{
name:"群創",
industry:"光電業",
market:"tse"
},

"3711":{
name:"日月光投控",
industry:"半導體業",
market:"tse"
},

"2618":{
name:"長榮航",
industry:"航運業",
market:"tse"
},

"2367":{
name:"燿華",
industry:"電子零組件業",
market:"tse"
},

"3324":{
name:"雙鴻",
industry:"電子零組件業",
market:"tse"
},

"6770":{
name:"力積電",
industry:"半導體業",
market:"tse"
},

"5425":{
name:"台半",
industry:"半導體業",
market:"otc"
},

"6244":{
name:"茂迪",
industry:"光電業",
market:"tse"
},

"8046":{
name:"南電",
industry:"電子零組件業",
market:"tse"
},

"5314":{
name:"世紀",
industry:"其他電子業",
market:"otc"
},

"0050":{
name:"元大台灣50",
industry:"ETF",
market:"tse"
},

"00631L":{
name:"元大台灣50正2",
industry:"ETF",
market:"tse"
},

"00685L":{
name:"群益臺灣加權正2",
industry:"ETF",
market:"tse"
},

"00919":{
name:"群益台灣精選高息",
industry:"ETF",
market:"tse"
},

"0056":{
name:"元大高股息",
industry:"ETF",
market:"tse"
},

"00891":{
name:"中信關鍵半導體",
industry:"ETF",
market:"tse"
},

"00981A":{
name:"主動統一台股增長",
industry:"ETF",
market:"tse"
}

};


const ALIASES={

"台灣化學纖維":"1326",
"台積":"2330",
"TSMC":"2330",
"中國信託":"2891",
"中國信託金控":"2891",
"元大台灣50":"0050",
"台灣50正2":"00631L",
"元大台灣50正2":"00631L",
"世紀":"5314"

};


/* =========================================================
工具
========================================================= */

const $=
id=>document.getElementById(id);

const esc=
v=>
String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

const num=
v=>{

if(
v===null||
v===undefined||
v===""
)return null;

const n=
Number(
String(v).replace(/,/g,"")
);

return Number.isFinite(n)
?n
:null;

};

const money=
(v,d=2)=>{

const n=num(v);

return n===null
?"—"
:
n.toLocaleString(
"zh-TW",
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
);

};

const integer=
v=>{

const n=num(v);

return n===null
?"—"
:
Math.round(n)
.toLocaleString("zh-TW");

};

const today=
()=>{

return new Intl.DateTimeFormat(
"en-CA",
{
timeZone:"Asia/Taipei",
year:"numeric",
month:"2-digit",
day:"2-digit"
}
).format(new Date());

};

const ago=
n=>{

let d=new Date();

d.setDate(
d.getDate()-n
);

return d.toISOString().slice(0,10);

};


function status(t,c=""){

$("status").innerHTML=t;

$("status").className=
"status show "+c;

}


/* =========================================================
API
========================================================= */

async function json(
url,
timeout=18000
){

const c=
new AbortController();

const t=
setTimeout(
()=>{
c.abort();
},
timeout
);

try{

const r=
await fetch(
url,
{
cache:"no-store",
signal:c.signal
}
);

if(!r.ok){

throw Error(
"HTTP "+r.status
);

}

return await r.json();

}finally{

clearTimeout(t);

}

}


async function fm(
p,
timeout=18000
){

const u=
new URL(FINMIND);

Object.entries(p)
.forEach(
([k,v])=>{

if(
v!==undefined&&
v!==null&&
v!==""
){

u.searchParams.set(
k,
v
);

}

});

const j=
await json(
u,
timeout
);

return Array.isArray(j.data)
?j.data
:[];

}


/* =========================================================
找股票
========================================================= */

async function findStock(q){

q=
String(q||"").trim();

if(!q){

throw Error(
"請輸入股票代號或名稱"
);

}

if(STOCKS[q]){

return {

stock_id:q,

stock_name:
STOCKS[q].name,

industry_category:
STOCKS[q].industry,

market:
STOCKS[q].market

};

}

const alias=
Object.keys(ALIASES)
.find(
x=>
x.toLowerCase()===
q.toLowerCase()
);

if(alias){

const c=
ALIASES[alias];

const x=
STOCKS[c];

return {

stock_id:c,

stock_name:x.name,

industry_category:x.industry,

market:x.market

};

}

if(
/^[0-9A-Z]+$/i.test(q)
){

const c=
q.toUpperCase();

if(STOCKS[c]){

const x=
STOCKS[c];

return {

stock_id:c,

stock_name:x.name,

industry_category:x.industry,

market:x.market

};

}

return {

stock_id:c,

stock_name:c,

industry_category:"台股",

market:"tse"

};

}

const rows=
await fm(
{
dataset:"TaiwanStockInfo"
},
25000
);

const h=
rows.find(
x=>
String(
x.stock_name||""
).trim()===q
);

if(h){

return {

stock_id:
String(h.stock_id),

stock_name:
h.stock_name,

industry_category:
h.industry_category||"台股",

market:
String(h.type||"")
.toLowerCase()==="tpex"
?"otc"
:"tse"

};

}

throw Error(
"找不到「"+
q+
"」，請輸入股票代號試試。"
);

}


/* =========================================================
即時行情
========================================================= */

async function realtime(s){

const ids=
s.market==="otc"

?
[
"otc_"+s.stock_id+".tw",
"tse_"+s.stock_id+".tw"
]

:
[
"tse_"+s.stock_id+".tw",
"otc_"+s.stock_id+".tw"
];

try{

const j=
await json(
MIS+
"?ex_ch="+
encodeURIComponent(
ids.join("|")
)+
"&json=1&delay=0&_="+
Date.now(),
10000
);

const a=
j.msgArray||[];

const r=
a.find(
x=>
x.c===s.stock_id
)||
a[0];

if(!r)return null;

return {

price:
num(r.z)??num(r.p),

open:
num(r.o),

high:
num(r.h),

low:
num(r.l),

previous:
num(r.y),

volume:
num(r.v),

bid:
num(
String(r.b||"")
.split("_")[0]
),

ask:
num(
String(r.a||"")
.split("_")[0]
),

bidVol:
num(
String(r.g||"")
.split("_")[0]
),

askVol:
num(
String(r.f||"")
.split("_")[0]
),

date:
r.d||today(),

time:
r.t||"",

source:
"TWSE MIS"

};

}catch(e){

return null;

}

}


/* =========================================================
歷史價格
========================================================= */

async function prices(id){

try{

return await fm(
{
dataset:"TaiwanStockPrice",

data_id:id,

start_date:ago(430),

end_date:today()

},
22000
);

}catch(e){

return[];

}

}


function sorted(a){

return [...a]
.sort(
(x,y)=>
String(x.date||"")
.localeCompare(
String(y.date||"")
)
);

}


function latest(a){

const x=
sorted(a);

return x.at(-1)||null;

}


function closes(a){

return sorted(a)
.map(
x=>num(x.close)
)
.filter(
x=>x!==null
);

}


/* =========================================================
均線
========================================================= */

function sma(a,p){

return a.length<p
?
null
:
a.slice(-p)
.reduce(
(x,y)=>x+y,
0
)/p;

}


function slope(a,p){

if(a.length<p)
return null;

const x=
a.slice(-p);

return x[0]
?
(
(x.at(-1)-x[0])/
x[0]
)*100
:
null;

}


function tech(rows,p){

const c=
closes(rows);

const ma={};

[
5,
20,
60,
120,
240
]
.forEach(
x=>{
ma[x]=sma(c,x);
}
);

let above=0;

Object.values(ma)
.forEach(
x=>{

if(
x!==null&&
p>x
){

above++;

}

});

return {

ma:ma,

trend:
above>=5
?
"強勢多頭"
:
above>=3
?
"偏多"
:
above<=1
?
"偏空"
:
"中性",

breakout:
c.length>20
?
p>
Math.max(
...c.slice(-21,-1)
)
:
false,

longBull:
ma[60]&&
ma[120]&&
ma[240]&&
ma[60]>ma[120]&&
ma[120]>ma[240]

};

}


/* =========================================================
PE
========================================================= */

async function per(id){

function eps(rows){

const a=
rows
.filter(
r=>
String(r.type||"")
.toUpperCase()
.includes("EPS")
||
String(r.origin_name||"")
.includes("每股盈餘")
)
.sort(
(x,y)=>
String(x.date)
.localeCompare(
String(y.date)
)
)
.map(
r=>num(r.value)
)
.filter(
x=>x!==null
);

if(!a.length)
return null;

const q=
a.slice(-4);

return {

latest:
a.at(-1),

ttm:
q.length===4
?
q.reduce(
(x,y)=>x+y,
0
)
:
null,

date:
rows
.filter(
r=>num(r.value)!==null
)
.at(-1)
?.date

};

}

function nav(rows,s){

rows

r=>

||
String(r.origin_name||"")

.includes("book value")
)
.sort(

date:a[i].date,

"財報每股淨值"

};

}

}

return null;

}


/* =========================================================
估值
========================================================= */

function valuation(
price,
ep,
pb
){

const pe=
ep>0
?
price/ep
:
null;

let score=50;

let peS=
"資料不足";

let pbS=
"資料不足";

let r=[];

if(pe!==null){

if(pe<=10){

score+=20;
peS="偏低";

}else if(pe<=15){

score+=12;
peS="合理偏低";

}else if(pe<=20){

score+=5;
peS="合理";

}else if(pe<=25){

score-=5;
peS="偏高";

}else{

score-=12;
peS="偏高";

}

r.push(
"PE "+peS
);

}

if(pb!==null){

if(pb<1){

score+=12;
pbS="偏低";

}else if(pb<1.5){

score+=8;
pbS="合理";

}else if(pb<=3){

pbS="合理偏高";

}else{

score-=12;
pbS="偏高";

}

r.push(
"PBR "+pbS
);

}

let state=
score>=70
?
"🟢 偏便宜"
:
score<40
?
"🔴 偏貴"
:
"🟡 合理";

if(
pe!==null&&
pb!==null&&
pe>20&&
pb<1
){

state=
"🟡 估值分歧";

r.push(
"PE偏高但PBR偏低"
);

}

return {

pe,

score:
Math.max(
0,
Math.min(
100,
score
)
),

state,

peS,

pbS,

reasons:r

};

}

/* =========================================================
法人
========================================================= */

function lawAggregate(rows){

const out={

foreign:0,

trust:0,

dealer:0

};

rows.forEach(
r=>{

const n=
String(
r.name||
r.institutional_investor||
r.investor_type||
""
)
.toLowerCase();

const v=
(
num(r.buy)||0
)-
(
num(r.sell)||0
);

if(
n.includes("foreign")
){

out.foreign+=v;

}else if(
n.includes("investment")
){

out.trust+=v;

}else if(
n.includes("dealer")
){

out.dealer+=v;

}

});

out.total=
out.foreign+
out.trust+
out.dealer;

return out;

}


async function institution(id){

try{

const a=
await fm(
{
dataset:
"TaiwanStockInstitutionalInvestorsBuySell",

data_id:id,

start_date:ago(70),

end_date:today()

},
22000
);

if(!a.length)
return null;

const ds=
[
...new Set(
a.map(
x=>x.date
)
)
]
.sort();

function calc(d){

return lawAggregate(
a.filter(
r=>r.date===d
)
);

}

const p={};

[
1,
5,
20
]
.forEach(
n=>{

const d=
ds.slice(-n);

const z={

foreign:0,

trust:0,

dealer:0,

total:0

};

d.forEach(
q=>{

const x=
calc(q);

Object.keys(z)
.forEach(
k=>{
z[k]+=x[k];
}
);

});

Object.keys(z)
.forEach(
k=>{
z[k]/=1000;
}
);

p[n]=z;

});

return {

date:
ds.at(-1),

periods:p

};

}catch(e){

return null;

}

}

20

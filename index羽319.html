<script>
/* ============================================================
   股票關卡計算機 V44
   重要：
   1. 即時行情優先 TWSE MIS
   2. 歷史資料 / PE / PBR 優先 FinMind
   3. API 失敗不會讓整頁消失
   4. 所有計算均保留手動/估算邏輯
============================================================ */

const FINMIND = "https://api.finmindtrade.com/api/v4/data";
const TWSE_MIS = "https://mis.twse.com.tw/stock/api/getStockInfo.jsp";

let current = null;

};

function $(id){
  return document.getElementById(id);

function setStatus(text,type=""){
  const box=$("status");

function fmt(n,d=2){
  if(n===null || n===undefined || Number.isNaN(Number(n))) return "—";
  return Number(n).toLocaleString("zh-TW",{
    minimumFractionDigits:d,
    maximumFractionDigits:d
  });
}

function num(v){
  if(v===null || v===undefined || v==="") return null;
  const n=Number(String(v).replace(/,/g,""));
  return Number.isFinite(n)?n:null;
}

function pct(change,prev){
  if(change!==null && prev){
    return change/prev*100;
  }
  return null;
}

function trendBy(price,ma5,ma20,changePct,inst){
  let score=0;

  if(changePct!==null){
    if(changePct>1) score+=2;
    else if(changePct>0) score+=1;
    else if(changePct<-1) score-=2;
    else if(changePct<0) score-=1;
  }

  if(ma5 && price){
    if(price>ma5) score+=1;
    else score-=1;
  }

  if(ma20 && price){
    if(price>ma20) score+=2;
    else score-=2;
  }

  if(inst!==null){
    if(inst>5000) score+=2;
    else if(inst>0) score+=1;
    else if(inst<-5000) score-=2;
    else if(inst<0) score-=1;
  }

  if(score>=3) return {text:"偏多",cls:"bull"};
  if(score<=-3) return {text:"偏空",cls:"bear"};
  return {text:"中性",cls:"flat"};
}

/* ---------- TWSE 即時行情 ---------- */

async function getRealtime(stock,market){
  const tries=[];

  if(market==="tse"){
    tries.push("tse_"+stock+".tw");
  }else if(market==="otc"){
    tries.push("otc_"+stock+".tw");
  }else{
    tries.push("tse_"+stock+".tw");
    tries.push("otc_"+stock+".tw");
  }

  for(const ex of tries){
    try{
      const url=TWSE_MIS+
        "?ex_ch="+encodeURIComponent(ex)+
        "&json=1&delay=0&_="+Date.now();

      const r=await fetch(url,{cache:"no-store"});
      if(!r.ok) continue;

      const j=await r.json();

      if(j && Array.isArray(j.msgArray) && j.msgArray.length){
        const x=j.msgArray[0];

        const price=num(x.z);
        const prev=num(x.y);

        if(price!==null || prev!==null){
          return {
            code:x.c || stock,
            name:x.n || names[stock] || stock,
            fullName:x.nf || "",
            exchange:x.ex || (ex.startsWith("otc")?"otc":"tse"),
            price:price,
            prev:prev,
            open:num(x.o),
            high:num(x.h),
            low:num(x.l),
            volume:num(x.v),
            upLimit:num(x.u),
            downLimit:num(x.w),
            time:x.t || "",
            date:x.d || ""
          };
        }
      }
    }catch(e){}
  }

  return null;
}

/* ---------- FinMind ---------- */

async function finmind(dataset,stock,startDate,endDate){
  try{
    const p=new URLSearchParams({
      dataset:dataset,
      data_id:stock,
      start_date:startDate
    });

    if(endDate) p.set("end_date",endDate);

    const r=await fetch(FINMIND+"?"+p.toString(),{
      cache:"no-store"
    });

    if(!r.ok) return [];

    const j=await r.json();

    if(j && Array.isArray(j.data)) return j.data;

  }catch(e){}

  return [];
}

function dateBefore(days){
  const d=new Date();
  d.setDate(d.getDate()-days);
  return d.toISOString().slice(0,10);
}

/* ---------- 歷史價格 ---------- */

async function getHistory(stock){
  const data=await finmind(
    "TaiwanStockPrice",
    stock,
    dateBefore(400),
    new Date().toISOString().slice(0,10)
  );

  if(!data.length) return [];

  return data
    .map(x=>({
      date:x.date,
      open:num(x.open),
      high:num(x.max),
      low:num(x.min),
      close:num(x.close),
      volume:num(x.Trading_Volume),
      spread:num(x.spread)
    }))
    .filter(x=>x.close!==null)
    .sort((a,b)=>a.date.localeCompare(b.date));
}

function moving(arr,n){
  if(!arr || arr.length<n) return null;
  const a=arr.slice(-n).map(x=>x.close).filter(x=>x!==null);
  if(a.length<n) return null;
  return a.reduce((s,x)=>s+x,0)/a.length;
}

/* ---------- PE / PBR ---------- */

async function getPER(stock){
  const data=await finmind(
    "TaiwanStockPER",
    stock,
    dateBefore(500),
    new Date().toISOString().slice(0,10)
  );

  if(!data.length) return null;

  const last=data[data.length-1];

  return {
    pe:num(last.PEratio ?? last.PERatio ?? last.PE),
    pbr:num(last.PBratio ?? last.PBR),
    dividend:num(last.DividendYield)
  };
}

/* ---------- 法人 ---------- */

async function getInstitution(stock){
  const data=await finmind(
    "TaiwanStockTotalInstitutionalInvestorsBuySell",
    stock,
    dateBefore(100),
    new Date().toISOString().slice(0,10)
  );

  if(!data.length){
    return {
      foreign:0,
      trust:0,
      dealer:0,
      total:0
    };
  }

  const lastDate=data
    .map(x=>x.date)
    .sort()
    .pop();

  const rows=data.filter(x=>x.date===lastDate);

  let foreign=0;
  let trust=0;
  let dealer=0;

  for(const x of rows){
    const name=String(
      x.name ??
      x.InstitutionalInvestor ??
      x.institutional_investors ??
      ""
    );

    const buy=num(
      x.buy ??
      x.Buy ??
      x.buy_volume ??
      x.BuyVolume ??
      x.buy_sell
    ) || 0;

    const sell=num(
      x.sell ??
      x.Sell ??
      x.sell_volume ??
      x.SellVolume
    ) || 0;

    const net=num(
      x.net_buy_sell ??
      x.NetBuySell ??
      x.net
    );

    const value=net!==null?net:buy-sell;

    if(name.includes("外資")) foreign+=value;
    else if(name.includes("投信")) trust+=value;
    else if(name.includes("自營")) dealer+=value;
  }

  return {
    foreign,
    trust,
    dealer,
    total:foreign+trust+dealer
  };
}

/* ---------- 計算 ---------- */

function calcLevels(price,ma20){
  const base=(ma20 && ma20>0)?ma20:price;

  const entry=Math.max(
    0.01,
    base*0.97
  );

  return {
    mainCost:base*0.96,
    entry:entry,
    observeLow:base*0.94,
    observeHigh:base*0.97,
    stop:base*0.92,
    stop1:base*0.95,
    stop2:base*0.92,
    stop3:base*0.88,
    take1:base*1.08,
    take2:base*1.14,
    take3:base*1.20,
    add1:base*0.95,
    add2:base*0.90,
    add3:base*0.85,
    breakout:base*1.08
  };
}

function valuation(price,eps,pe,pbr){
  const result={
    peText:"資料不足",
    pbrText:"資料不足",
    totalText:"資料不足"
  };

  if(pe!==null){
    if(pe<15) result.peText="偏低";
    else if(pe<=22) result.peText="合理";
    else if(pe<=30) result.peText="偏高";
    else result.peText="過高";
  }

  if(pbr!==null){
    if(pbr<1) result.pbrText="偏低";
    else if(pbr<=2) result.pbrText="合理";
    else if(pbr<=4) result.pbrText="偏高";
    else result.pbrText="過高";
  }

  if(pe!==null && pbr!==null){
    if(pe<=22 && pbr<=2) result.totalText="合理";
    else if(pe<15 && pbr<1.5) result.totalText="偏低";
    else if(pe>30 || pbr>4) result.totalText="偏高";
    else result.totalText="合理";
  }

  return result;
}

/* ---------- 損益 ---------- */

function updateProfit(){
  if(!current) return;

  const cost=num($("myCost")?.value);
  const shares=num($("myShares")?.value);

  if(cost===null || shares===null){
    $("profit").textContent="—";
    return;
  }

  const profit=(current.price-cost)*shares;

  $("profit").textContent=
    (profit>=0?"+":"")+
    fmt(profit,0)+
    " 元";

  $("profit").style.color=profit>=0?"#159447":"#e32837";
}

/* ---------- 熱門 TOP10 ---------- */

async function loadHotTop10(){

  const box=$("hotTop10");

  box.innerHTML=
    `<div class="loadingBox">🔥 正在掃描熱門股票……</div>`;

  const results=[];

  for(const code of universe){

    try{

      const r=await getRealtime(code,"auto");

      if(!r || r.price===null) continue;

      const c=r.prev?((r.price-r.prev)/r.prev*100):0;

      results.push({
        ...r,
        changePct:c
      });

    }catch(e){}

    if(results.length>=40) break;
  }

  results.sort((a,b)=>{

    const av=(a.volume||0)*Math.abs(a.changePct||0);
    const bv=(b.volume||0)*Math.abs(b.changePct||0);

    return bv-av;
  });

  const top=results.slice(0,10);

  if(!top.length){
    box.innerHTML=
      `<div class="empty">
        ⚠️ 目前無法取得熱門資料。<br>
        請稍後再按一次。
      </div>`;
    return;
  }

  box.innerHTML=top.map((x,i)=>{

    const trend=
      x.changePct>1?"bull":
      x.changePct<-1?"bear":"flat";

    return `
      <div class="topItem"
           onclick="quickSearch('${x.code}')">

        <div class="rank">#${i+1}</div>

        <div>
          <div class="stockName">${x.name||names[x.code]||x.code}</div>
          <div class="stockCode">${x.code}</div>
        </div>

        <div class="topPrice">
          ${fmt(x.price)}
        </div>

        <div class="topChange ${x.changePct>0?"up":x.changePct<0?"down":"neutral"}">
          ${x.changePct>0?"▲":x.changePct<0?"▼":"—"}
          ${fmt(Math.abs(x.changePct))}%
        </div>

        <div class="miniTrend ${
          trend==="bull"?"miniBull":
          trend==="bear"?"miniBear":"miniFlat"
        }">
          ${trend==="bull"?"🟢 偏多":
            trend==="bear"?"🔴 偏空":"🟡 中性"}
        </div>

      </div>
    `;

  }).join("");
}

/* ---------- 法人 TOP10 ---------- */

async function loadInstitutionTop10(){

  const box=$("instTop10");

  box.innerHTML=
    `<div class="loadingBox">🏦 正在掃描法人資料……</div>`;

  const results=[];

  /*
    為避免一次大量 API 請求造成 GitHub Pages / FinMind
    觸發限制，這裡採取逐檔掃描。
  */

  for(const code of universe){

    try{

      const inst=await getInstitution(code);

      results.push({
        code,
        name:names[code]||code,
        total:inst.total
      });

    }catch(e){}

  }

  results.sort((a,b)=>b.total-a.total);

  const top=results
    .filter(x=>x.total>0)
    .slice(0,10);

  if(!top.length){

    box.innerHTML=
      `<div class="empty">
        ⚠️ 暫時沒有取得法人買超資料。<br>
        API 可能暫時限制請求。
      </div>`;

    return;
  }

  box.innerHTML=top.map((x,i)=>`

    <div class="topItem"
         onclick="quickSearch('${x.code}')">

      <div class="rank">#${i+1}</div>

      <div>
        <div class="stockName">${x.name}</div>
        <div class="stockCode">${x.code}</div>
      </div>

      <div class="topPrice">
        🟢 ${fmt(x.total,0)}

      <div class="topChange up">
        買超
      </div>

      <div class="miniTrend miniBull">
        🟢 偏多
      </div>

    </div>

  `).join("");
}

/* ---------- 儲存紀錄 ---------- */

function getRecords(){
  try{
    return JSON.parse(localStorage.getItem("stockV44Records")||"[]");
  }catch(e){
    return [];
  }
}

function saveCurrent(){

  if(!current){
    alert("請先查詢股票");
    return;
  }

  const records=getRecords();

  records.unshift({
    code:current.code,
    name:current.name,
    price:current.price,
    change:current.change,
    changePct:current.changePct,
    trend:current.trend.text,
    time:new Date().toLocaleString("zh-TW")
  });

  localStorage.setItem(
    "stockV44Records",
    JSON.stringify(records.slice(0,50))
  );

  renderRecords();

  setStatus("💾 已儲存 "+current.code+" "+current.name,"");
}

function deleteRecord(index){

  const records=getRecords();

  records.splice(index,1);

  localStorage.setItem(
    "stockV44Records",
    JSON.stringify(records)
  );

  renderRecords();
}

function clearAll(){

  if(!confirm("確定要清除全部儲存紀錄嗎？")) return;

  localStorage.removeItem("stockV44Records");

  renderRecords();

  setStatus("🗑️ 已清除全部儲存紀錄","");
}

function loadRecord(index){

  const records=getRecords();

  if(!records[index]) return;

  $("stockInput").value=records[index].code;

  searchStock();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

                r.changePct<0?"down":"neutral"
              }">
                ${r.changePct>0?"+":""}${fmt(r.changePct)}%
              </td>

              <td>
                ${
                  r.trend==="偏多"?"🟢 偏多":
                  r.trend==="偏空"?"🔴 偏空":
                  "🟡 中性"
                }
              </td>

              <td>${r.time}</td>

              <td>
                <div class="recordBtns">
                  <button class="smallBtn"
                          onclick="loadRecord(${i})">
                    查看
                  </button>

                  <button class="smallBtn red"
                          onclick="deleteRecord(${i})">
                    刪除
                  </button>
                </div>
              </td>

            </tr>

          `).join("")}

        </tbody>

      </table>

    </div>
  `;
}

/* ---------- 主查詢 ---------- */

async function searchStock(){

  const stock=$("stockInput").value.trim().toUpperCase();

  if(!stock){
    alert("請輸入股票代號");
    return;
  }

  setStatus(
    "⏳ 正在取得 "+stock+" 最新資料……",
    "loading"
  );

  $("app").innerHTML=
    `<div class="card">
      <div class="loadingBox">
        📡 正在取得股價、均線、法人、估值資料……<br><br>
        請稍候。
      </div>
    </div>`;

  try{

    const market=$("market").value;

    /* 即時 */
    const rt=await getRealtime(stock,market);

    /* 歷史 */
    const history=await getHistory(stock);

    /* 如果即時 API 失敗，使用歷史最後一天 */
    let base=rt;

    if(!base && history.length){

      const last=history[history.length-1];
      const prev=history.length>1?
        history[history.length-2].close:null;

      base={
        code:stock,
        name:names[stock]||stock,
        fullName:"",
        exchange:"unknown",
        price:last.close,
        prev:prev,
        open:last.open,
        high:last.high,
        low:last.low,
        volume:last.volume,
        time:last.date,
        date:last.date
      };

    }

    if(!base){

      setStatus(
        "⚠️ 暫時無法取得 "+stock+" 資料，請稍後再試。",
        "error"
      );

      $("app").innerHTML=
        `<div class="card">
          <div class="empty">
            ❌ 找不到 ${stock} 的行情資料。<br><br>
            請確認股票代號是否正確。
          </div>
        </div>`;

      return;
    }

    const p=base.price;
    const change=
      p!==null && base.prev!==null?
      p-base.prev:null;

    const changePct=
      p!==null && base.prev?
      change/base.prev*100:null;

    const ma5=moving(history,5);
    const ma20=moving(history,20);
    const ma60=moving(history,60);
    const ma120=moving(history,120);
    const ma240=moving(history,240);

    const per=await getPER(stock);

    const pe=per?.pe??null;
    const pbr=per?.pbr??null;
    const dividend=per?.dividend??null;

    /*
      如果沒有 EPS API，使用
      EPS ≈ 股價 / PE
      只標示為估算值
    */

    const eps=
      pe!==null && pe>0 && p!==null?
      p/pe:null;

    const inst=await getInstitution(stock);

    const trend=trendBy(
      p,
      ma5,
      ma20,
      changePct,
      inst.total
    );

    const levels=calcLevels(p,ma20);

    const val=valuation(
      p,
      eps,
      pe,
      pbr
    );

    current={
      code:base.code||stock,
      name:base.name||names[stock]||stock,
      fullName:base.fullName||"",
      price:p,
      prev:base.prev,
      open:base.open,
      high:base.high,
      low:base.low,
      volume:base.volume,
      time:base.time,
      change,
      changePct,
      ma5,
      ma20,
      ma60,
      ma120,
      ma240,
      eps,
      pe,
      pbr,
      dividend,
      inst,
      trend,
      levels,
      valuation:val
    };

    buildApp(current);

    setStatus(
      "🟢 "+current.name+" "+current.code+
      " 資料更新完成｜"+
      (changePct===null?
       "漲跌％無資料":
       "漲跌 "+(changePct>=0?"+":"")+fmt(changePct)+"%")+
      "｜"+trend.text,
      ""
    );

  }catch(err){

    console.error(err);

    setStatus(
      "⚠️ 資料取得時發生問題，部分欄位已使用備援計算。",
      "error"
    );

  }
}

/* ---------- 自動重新整理 ---------- */

let autoTimer=null;

function startAuto(){

  if(autoTimer) clearInterval(autoTimer);

  autoTimer=setInterval(()=>{

    if(current && document.visibilityState==="visible"){

      const code=current.code;

      $("stockInput").value=code;

      searchStock();

    }

  },60000);

}

/* ---------- Enter 查詢 ---------- */

$("stockInput").addEventListener(
  "keydown",
  function(e){
    if(e.key==="Enter"){
      searchStock();
    }
  }
);

/* ---------- 啟動 ---------- */

window.addEventListener("load",()=>{

  renderRecords();

  startAuto();

  setTimeout(()=>{
    searchStock();
  },400);

});

</script>

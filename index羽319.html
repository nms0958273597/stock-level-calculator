<style>

<script>

"00919":{name:"群益台灣精選高息",industry:"ETF",market:"tse"},

};


const ALIAS={

"台化":"1326",
"台灣化學纖維":"1326",
"中信金":"2891",
"中國信託":"2891",
"台積電":"2330",
"台積":"2330",
"鴻海":"2317",
"台達電":"2308",
"聯電":"2303",
"台塑":"1301",
"南亞":"1303",
"中鋼":"2002",
"華通":"2313",
"群創":"3481",
"日月光投控":"3711",
"長榮航":"2618",
"燿華":"2367",
"雙鴻":"3324",
"力積電":"6770",
"台半":"5425",
"茂迪":"6244",
"南電":"8046",
"世紀":"5314",
"元大台灣50":"0050",
"台灣50正2":"00631L"

};


const universe=[

"2330",
"2317",
"2308",
"2454",
"3711",
"2303",
"2881",
"2882",
"2891",
"1301",
"1303",
"1326",
"2002",
"2603",
"2618",
"2301",
"2382",
"2357",
"2376",
"2368",
"3034",
"3008",
"3037",
"3324",
"8046",
"3481",
"6770",
"6244",
"5314"

];


const $=
id=>document.getElementById(id);


const n=v=>{

if(v===null||v===undefined||v==="")
return null;

let x=
Number(
String(v).replace(/,/g,"")
);

return Number.isFinite(x)?x:null

};


const fmt=(v,d=2)=>{

let x=n(v);

return x===null
?"—"
:x.toLocaleString(
"zh-TW",
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)

};


const int=v=>{

let x=n(v);

return x===null
?"—"
:Math.round(x).toLocaleString("zh-TW")

};


const esc=v=>
String(v??"")
.replace(/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));


const today=()=>
new Date()
.toISOString()
.slice(0,10);


const ago=days=>{

let d=new Date();

d.setDate(
d.getDate()-days
);

return d
.toISOString()
.slice(0,10)

};


function status(t,c=""){

$("status").innerHTML=t;

$("status").className=
"status "+c

}


async function getJSON(
url,
ms=18000
){

let c=
new AbortController();

let t=
setTimeout(
()=>c.abort(),
ms
);

try{

let r=
await fetch(
url,
{
cache:"no-store",
signal:c.signal
}
);

if(!r.ok)
throw Error(
"HTTP "+r.status
);

return await r.json()

}finally{

clearTimeout(t)

}

}


async function fin(
params,
ms=18000
){

let u=
new URL(FIN);

Object.entries(params)
.forEach(
([k,v])=>{

if(
v!==undefined&&
v!==null&&
v!==""
){

u.searchParams.set(k,v)

}

});

let j=
await getJSON(
u,
ms
);

return Array.isArray(j.data)
?j.data
:[]

}


function resolve(q){

let s=
String(q||"").trim();

let k=
s.toUpperCase();

if(STOCKS[k])
return{
id:k,
...STOCKS[k]
};

if(ALIAS[s]){

let id=
ALIAS[s];

return{
id,
...STOCKS[id]
}

}

throw Error(
"找不到「"+
s+
"」，請輸入股票代號。"
)

}


async function stockInfo(id){

if(STOCKS[id])
return{
id,
...STOCKS[id]
};

let rows=
await fin(
{
dataset:
"TaiwanStockInfo"
},
22000
);

let x=
rows.find(
r=>String(r.stock_id)===id
);

if(!x)
throw Error(
"找不到股票 "+id
);

return{

id,

name:
x.stock_name||id,

industry:
x.industry_category||"台股",

market:
String(x.type||"")
.toLowerCase()==="tpex"
?"otc"
:"tse"

}

}


async function realtime(s){

try{

let ch=[
`tse_${s.id}.tw`,
`otc_${s.id}.tw`
].join("|");

let j=
await getJSON(
MIS+
"?ex_ch="+
encodeURIComponent(ch)+
"&json=1&delay=0&_="+
Date.now(),
9000
);

let r=
(j.msgArray||[])
.find(
x=>x.c===s.id
)||
(j.msgArray||[])[0];

if(!r)
return null;

return{

price:
n(r.z)??n(r.p),

prev:n(r.y),

open:n(r.o),

high:n(r.h),

low:n(r.l),

volume:n(r.v),

bid:
n(
String(r.b||"")
.split("_")[0]
),

ask:
n(
String(r.a||"")
.split("_")[0]
),

bidVol:
n(
String(r.g||"")
.split("_")[0]
),

askVol:
n(
String(r.f||"")
.split("_")[0]
),

date:r.d,

time:r.t,

source:"TWSE MIS"

}

}catch(e){

return null

}

}


async function prices(id){

try{

return await fin({

dataset:
"TaiwanStockPrice",

data_id:id,

start_date:
ago(430),

end_date:
today()

},22000)

}catch(e){

return[]

}

}


function sorted(a){

return[
...a
].sort(
(x,y)=>
String(x.date)
.localeCompare(
String(y.date)
)
)

}


function closes(rows){

return sorted(rows)
.map(
r=>n(r.close)
)
.filter(
x=>x!==null
)

}


function sma(a,p){

if(a.length<p)
return null;

let x=
a.slice(-p);

return x.reduce(
(s,v)=>s+v,
0
)/p

}


function slope(a,p){

if(a.length<p)
return null;

let x=
a.slice(-p);

return x[0]
?
(
(x.at(-1)-x[0])/
x[0]
)*100
:null

}


function tech(rows,p){

let c=
closes(rows);

let periods=[
5,
20,
60,
120,
240
];

let ma={};
let sl={};

periods.forEach(
x=>{

ma[x]=sma(c,x);

sl[x]=slope(c,x)

}
);

let above=
periods.filter(
x=>
ma[x]!=null&&
p>ma[x]
).length;

let trend=
above>=4
?"強勢多頭"
:
above>=3
?"偏多"
:
above<=1
?"偏空"
:
"中性";

let high=
c.length>21
?
Math.max(
...c.slice(-21,-1)
)
:null;

return{

ma,

sl,

trend,

breakout:
p!=null&&
high!=null&&
p>high,

longBull:
ma[60]&&
ma[120]&&
ma[240]&&
ma[60]>ma[120]&&
ma[120]>ma[240]

}

}

try{

let a=
await fin({

dataset:
"TaiwanStockPER",

data_id:id,

start_date:
ago(90),

end_date:
today()

},15000);

return sorted(a).at(-1)||null

}catch(e){

return null

}

}

try{

return await fin({

dataset:
"TaiwanStockFinancialStatements",

data_id:id,

start_date:
ago(1000),

end_date:
today()

},20000)

}catch(e){

return[]

}

function eps(rows){

let a=
rows
.filter(
r=>{

let s=
(
String(r.type||"")+
" "+
String(r.origin_name||"")
)
.toLowerCase();

return(
s.includes("eps")||
s.includes("每股盈餘")
)

})
.map(
r=>n(r.value)
)
.filter(
x=>x!=null
);

if(!a.length)
return null;

let q=
a.slice(-4);

return{

latest:
a.at(-1),

ttm:
q.length===4
?
q.reduce(
(a,b)=>a+b,
0
)
:null

}

}


function book(rows){

let a=
rows
.filter(
r=>{

let s=
(
String(r.type||"")+
" "+
String(r.origin_name||"")
)
.toLowerCase();

return(
s.includes("每股淨值")||
s.includes("book")||
s.includes("net asset")
)

})
.map(
r=>n(r.value)
)
.filter(
x=>
x!=null&&
x>0
);

return a.length
?
{value:a.at(-1)}
:null

}


function instAgg(rows){

let o={

foreign:0,
trust:0,
dealer:0,
total:0

};

rows.forEach(
r=>{

let name=
String(
r.name||""
)
.toLowerCase();

let v=
(
n(r.buy)||0
)-
(
n(r.sell)||0
);

if(
name.includes("foreign")
)
o.foreign+=v;

else if(
name.includes("investment")
)
o.trust+=v;

else if(
name.includes("dealer")
)
o.dealer+=v

});

o.total=
o.foreign+
o.trust+
o.dealer;

Object.keys(o)
.forEach(
k=>o[k]/=1000
);

return o

}

?0
:-12

?8

:-10

function signal(

v,

){

let score=0;

let rs=[];

if(

rs.push("均線強勢多頭")

}

else if(
t.trend==="偏多"

rs.push("均線偏多")

}

else if(
t.trend==="偏空"
){

score-=20;
rs.push("均線偏空")

}

else{

rs.push("均線中性")

}

if(t.breakout){

score+=18;
rs.push("突破近21日高點")

}

if(t.longBull){

score+=15;
rs.push("長期均線多頭排列")

}

if(i){

score+=
i[20]>0
?
18
:
-12;

rs.push(
"20日三大法人"+
(
i[20]>0
?
"淨買超"
:
"淨賣超"
)
)

}

if(
v.state==="偏便宜"
){

score+=12;
rs.push("估值偏低")

}

else if(
v.state==="偏貴"
){

score-=10;
rs.push("估值偏高")

}

if(
sc&&
price<sc.base
){

score+=7;
rs.push("現價低於模型基準區")

}

score=
Math.max(
0,
Math.min(
100,
score
)
);

let state=
score>=65
?
"有戲"
:
score>=45
?
"觀察"
:
score>=25
?
"偏弱"
:
"暫時沒戲";

return{

score,
state,
reasons:rs

}

}

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#fff7ed">
<title>每日收入・盈餘記帳</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#fff7ed;
color:#3b2f2f;
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",Arial,sans-serif;
}

.container{
max-width:720px;
margin:auto;
padding:14px;
}

h1{
text-align:center;
font-size:28px;
margin:8px 0 16px;
}

.card{
background:#fff;
border-radius:20px;
padding:16px;
margin-bottom:14px;
box-shadow:0 3px 14px rgba(80,50,20,.08);
}

.title{
font-size:22px;
font-weight:900;
margin-bottom:12px;
}

input,
textarea{
font-family:inherit;
}

.dateInput{
width:100%;
padding:14px;
border:2px solid #eadfd5;
border-radius:14px;
font-size:20px;
text-align:center;
background:#fffdfb;
}

.dateText{
text-align:center;
margin-top:10px;
padding:12px;
border-radius:14px;
background:#fff5dc;
color:#7d5315;
font-size:22px;
font-weight:900;
}

.status{
text-align:center;
color:#8b7c75;
margin-top:8px;
}

.income-row{
display:grid;
grid-template-columns:1fr 120px 42px;
gap:8px;
align-items:center;
margin-bottom:10px;
}

.income-name,
.income-amount{
width:100%;
padding:12px;
border:2px solid #eadfd5;
border-radius:13px;
background:#fffdfb;
font-size:20px;
}

.income-name[readonly]{
background:#fffdfb;
}

.income-amount{
font-weight:700;
text-align:right;
}

.delete{
height:48px;
border:0;
border-radius:12px;
background:#ffe2df;
color:#c43b31;
font-size:22px;
font-weight:900;
}

.qty-row{
display:grid;
grid-template-columns:1fr auto 42px 58px 42px auto;
gap:7px;
align-items:center;
margin:8px 0;
padding:10px 0;
}

.qty-name{
font-size:18px;
font-weight:900;
}

.qty-unit{
font-size:15px;
color:#8b7c75;
white-space:nowrap;
}

.qty-btn{
width:42px;
height:42px;
border:0;
border-radius:11px;
background:#fff0d9;
color:#9a5a12;
font-size:27px;
font-weight:900;
}

.qty-input{
width:58px;
height:42px;
border:2px solid transparent;
border-radius:10px;
background:#fffdfb;
text-align:center;
font-size:20px;
font-weight:900;
}

.qty-input:focus{
outline:2px solid #e89b57;
}

.qty-total{
text-align:right;
min-width:65px;
font-size:19px;
font-weight:900;
color:#7d5315;
}

.note{
font-size:14px;
color:#8b7c75;
line-height:1.5;
margin:8px 0 12px;
}

button{
font-family:inherit;
cursor:pointer;
}

.add,
.save,
.line{
width:100%;
border:0;
border-radius:14px;
padding:14px;
font-size:19px;
font-weight:900;
}

.add{
background:#fff0d9;
color:#9a5a12;
}

.save{
background:#e88c43;
color:white;
margin-top:10px;
}

.line{
background:#ddf3df;
color:#237b2d;
margin-top:10px;
}

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.box{
border-radius:17px;
padding:15px;
text-align:center;
}

.total{
background:#fff5dc;
color:#8a5a00;
}

.green{
background:#eaf8ed;
color:#19733a;
}

.red{
background:#fff0ef;
color:#c7372d;
}

.small{
font-size:17px;
font-weight:800;
}

.num{
font-size:34px;
font-weight:900;
margin-top:5px;
}

.taken{
width:100%;
padding:10px;
border:2px solid #eadfd5;
border-radius:12px;
background:#fffdfb;
font-size:25px;
text-align:center;
}

.net{
width:100%;
border:0;
border-radius:16px;
padding:15px;
background:#eaf8ed;
color:#19733a;
margin-top:12px;
}

.net .num{
font-size:30px;
}

textarea{
width:100%;
min-height:240px;
border:2px solid #eadfd5;
border-radius:14px;
padding:13px;
background:#fffdfb;
font-size:17px;
line-height:1.6;
}

.history-item{
border-top:1px solid #eee2d8;
padding:14px 0;
}

.history-item:first-child{
border-top:0;
}

.history-head{
display:flex;
justify-content:space-between;
gap:8px;
font-weight:900;
font-size:17px;
}

.detail{
color:#756866;
line-height:1.7;
margin-top:6px;
}

.history-actions{
display:flex;
gap:8px;
margin-top:9px;
}

.history-actions button{
flex:1;
padding:9px;
border:0;
border-radius:10px;
background:#fff0d9;
color:#9a5a12;
font-weight:800;
}

.history-actions .danger{
background:#ffe2df;
color:#c43b31;
}

@media(max-width:480px){

.income-row{
grid-template-columns:1fr 108px 40px;
}

.qty-row{
grid-template-columns:1fr auto 38px 56px 38px auto;
gap:5px;
}

.qty-btn{
width:38px;
height:38px;
}

.qty-input{
width:56px;
}

.qty-name{
font-size:16px;
}

.qty-total{
min-width:60px;
}

}
</style>
</head>

<body>

<div class="container">

<h1>💰 每日收入・盈餘記帳</h1>


<div class="card">

<div class="title">
📅 日期
</div>

<input
id="date"
class="dateInput"
type="date"
>

<div
id="dateText"
class="dateText">
</div>

<div
id="status"
class="status">
💾 自動儲存
</div>

</div>


<div class="card">

<div class="title">
💰 收入項目
</div>


<!-- 🍜 850：可以直接手動修改 -->
<div class="income-row">

<input
class="income-name"
type="text"
value="🍜"
readonly
>

<input
id="noodleAmount"
class="income-amount"
type="number"
min="0"
step="1"
value="850"
placeholder="850"
>

<button
class="delete"
type="button"
onclick="resetNoodle()">
×
</button>

</div>


<div id="customIncome"></div>


<!-- 🍋 檸檬 -->

<div class="qty-row">

<div class="qty-name">
🍋 檸檬
</div>

<div class="qty-unit">
1,200／個
</div>

<button
class="qty-btn"
type="button"
onclick="changeQty('lemon',-1)">
−
</button>

<input
id="lemonQty"
class="qty-input"
type="number"
min="0"
inputmode="numeric"
placeholder=""
oninput="manualQty('lemon')"
>

<button
class="qty-btn"
type="button"
onclick="changeQty('lemon',1)">
＋
</button>

<div
id="lemonTotal"
class="qty-total">
0
</div>

</div>


<!-- 蚵仔 -->

<div class="qty-row">

<div class="qty-name">
蚵仔一包
</div>

<div class="qty-unit">
150／包
</div>

<button
class="qty-btn"
type="button"
onclick="changeQty('oyster',-1)">
−
</button>

<input
id="oysterQty"
class="qty-input"
type="number"
min="0"
inputmode="numeric"
placeholder=""
oninput="manualQty('oyster')"
>

<button
class="qty-btn"
type="button"
onclick="changeQty('oyster',1)">
＋
</button>

<div
id="oysterTotal"
class="qty-total">
0
</div>

</div>


<!-- 大腸 -->

<div class="qty-row">

<div class="qty-name">
大腸一包
</div>

<div class="qty-unit">
150／包
</div>

<button
class="qty-btn"
type="button"
onclick="changeQty('intestine',-1)">
−
</button>

<input
id="intestineQty"
class="qty-input"
type="number"
min="0"
inputmode="numeric"
placeholder=""
oninput="manualQty('intestine')"
>

<button
class="qty-btn"
type="button"
onclick="changeQty('intestine',1)">
＋
</button>

<div
id="intestineTotal"
class="qty-total">
0
</div>

</div>


<div class="note">

🍜 850 可以直接點選修改，不鎖定。<br>
🍋 檸檬、蚵仔、大腸中間數字可以直接手動填寫，也可以使用 −／＋。

</div>


<button
class="add"
type="button"
onclick="addIncome()">
＋ 新增收入項目
</button>

</div>


<div class="card">

<div class="summary">

<div class="box total">

<div class="small">
💰 收入合計
</div>

<div
id="incomeTotal"
class="num">
0
</div>

</div>


<div class="box">

<div class="small">
💵 已拿
</div>

<input
id="taken"
class="taken"
type="number"
min="0"
step="1"
value="0"
>

</div>

</div>

</div>


<div class="card">

<div class="summary">

<div class="box green">

<div class="small">
🟢 盈餘
</div>

<div
id="profit"
class="num">
0
</div>

</div>


<div class="box red">

<div class="small">
🔴 差額
</div>

<div
id="difference"
class="num">
0
</div>

</div>

</div>


<button
class="save"
type="button"
onclick="saveRecord()">
💾 儲存今天紀錄
</button>

</div>


<div class="card">

<div class="title">
📈 累加統計
</div>


<div class="summary">

<div class="box green">

<div class="small">
📈 盈餘累加
</div>

<div
id="profitAccum"
class="num">
0
</div>

</div>


<div class="box red">

<div class="small">
📉 差額累加
</div>

<div
id="differenceAccum"
class="num">
0
</div>

</div>

</div>


<button
class="net"
type="button"
onclick="showNet()">

<div class="small">
💰 差額累加－盈餘累加
</div>

<div
id="netAccum"
class="num">
0
</div>

<div>
目前還有多少金額
</div>

</button>

</div>


<div class="card">

<div class="title">
📋 詳細明細
</div>


<textarea
id="detail"
readonly>
</textarea>


<div class="summary"
style="margin-top:10px">

<button
class="add"
type="button"
onclick="copyDetail()">
📋 複製明細
</button>


<button
class="line"
type="button"
onclick="sendLine()">
💬 傳送 LINE
</button>

</div>

</div>


<div class="card">

<div class="title">
📚 歷史紀錄
</div>


<div id="history"></div>


<button
class="delete"
type="button"
style="width:100%;margin-top:10px"
onclick="clearAll()">
🗑️ 清除全部紀錄
</button>

</div>

</div>


<script>

const PRICE={
lemon:1200,
oyster:150,
intestine:150
};


let qty={
lemon:0,
oyster:0,
intestine:0
};


let records=
JSON.parse(
localStorage.getItem(
"dailyIncomeRecords1319"
)||"[]"
);


/* 今天日期 */

function today(){

const d=
new Date();

return d.getFullYear()
+"-"
+String(
d.getMonth()+1
).padStart(2,"0")
+"-"
+String(
d.getDate()
).padStart(2,"0");

}


/* 金額格式 */

function money(n){

return Math.round(
Number(n)||0
).toLocaleString(
"zh-TW"
);

}


/* HTML 防注入 */

function esc(s){

return String(
s??""
).replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])
);

}


/* 日期 */

function updateDate(){

const v=
document.getElementById(
"date"
).value||today();

const d=
new Date(
v+"T00:00:00"
);

const w=[
"星期日",
"星期一",
"星期二",
"星期三",
"星期四",
"星期五",
"星期六"
];

document.getElementById(
"dateText"
).textContent=
`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${w[d.getDay()]}`;

}


/* 取得所有收入 */

function getItems(){

const items=[];


/* 🍜 850 */

const noodle=
Number(
document.getElementById(
"noodleAmount"
).value
)||0;


items.push({
name:"🍜",
amount:noodle
});


/* 其他收入 */

document
.querySelectorAll(
"#customIncome .income-row"
)
.forEach(
r=>{

const name=
r.querySelector(
".income-name"
).value.trim();

const amount=
Number(
r.querySelector(
".income-amount"
).value
)||0;

if(
name||
amount
){

items.push({
name,
amount
});

}

});


/* 🍋 */

if(
qty.lemon>0
){

items.push({
name:"🍋",
amount:
qty.lemon*
PRICE.lemon,
qty:qty.lemon
});

}


/* 蚵仔 */

if(
qty.oyster>0
){

items.push({
name:"蚵仔一包",
amount:
qty.oyster*
PRICE.oyster,
qty:qty.oyster
});

}


/* 大腸 */

if(
qty.intestine>0
){

items.push({
name:"大腸一包",
amount:
qty.intestine*
PRICE.intestine,
qty:qty.intestine
});

}


return items;

}


/* 新增收入 */

function addIncome(){

const box=
document.getElementById(
"customIncome"
);

const r=
document.createElement(
"div"
);

r.className=
"income-row";


r.innerHTML=`

<input
class="income-name"
placeholder="其他收入">

<input
class="income-amount"
type="number"
min="0"
step="1"
value="0"
placeholder="金額">

<button
class="delete"
type="button"
onclick="this.parentElement.remove();calculate()">
×
</button>

`;


box.appendChild(r);

r.querySelector(
".income-name"
).focus();

}


/* 🍜 清空按鈕 */

function resetNoodle(){

const input=
document.getElementById(
"noodleAmount"
);

input.value="";

calculate();

input.focus();

}


/* 數量 +/- */

function changeQty(
type,
delta
){

qty[type]=
Math.max(
0,
(Number(qty[type])||0)+delta
);

syncQty(type);

calculate();

}


/* 手動輸入數量 */

function manualQty(type){

qty[type]=
Math.max(
0,
Number(
document.getElementById(
type+"Qty"
).value
)||0
);

syncQty(type);

calculate();

}


/* 同步數量 */

function syncQty(type){

const q=
document.getElementById(
type+"Qty"
);

const t=
document.getElementById(
type+"Total"
);


q.value=
qty[type]===0
?
""
:
qty[type];


t.textContent=
money(
qty[type]*
PRICE[type]
);

}


/* 計算 */

function calculate(){

const items=
getItems();

const total=
items.reduce(
(s,x)=>
s+x.amount,
0
);

const taken=
Number(
document.getElementById(
"taken"
).value
)||0;


/*
收入－已拿＝盈餘
*/

const profit=
Math.max(
total-taken,
0
);


/*
已拿－收入＝差額
*/

const diff=
Math.max(
taken-total,
0
);


document.getElementById(
"incomeTotal"
).textContent=
money(total);


document.getElementById(
"profit"
).textContent=
money(profit);


document.getElementById(
"difference"
).textContent=
money(diff);


buildDetail();

autoSave();

}


/* 明細 */

function buildDetail(){

const v=
document.getElementById(
"date"
).value||today();

const d=
new Date(
v+"T00:00:00"
);

const w=[
"星期日",
"星期一",
"星期二",
"星期三",
"星期四",
"星期五",
"星期六"
];

const items=
getItems();

const total=
items.reduce(
(s,x)=>
s+x.amount,
0
);

const taken=
Number(
document.getElementById(
"taken"
).value
)||0;

const profit=
Math.max(
total-taken,
0
);

const diff=
Math.max(
taken-total,
0
);

const lines=
items.map(
x=>
`${x.name} ${money(x.amount)}${
x.qty!==undefined
?
"（"+x.qty+"個／包）"
:
""
}`
).join("\n");


const text=
`📅 日期：${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${w[d.getDay()]}

💰 收入明細
${lines||"無"}

💰 收入合計：${money(total)}
💵 已拿：${money(taken)}

🟢 盈餘：${money(profit)}
🔴 差額：${money(diff)}`;


document.getElementById(
"detail"
).value=
text;


return text;

}


/* 自動儲存 */

function autoSave(){

const draft={

date:
document.getElementById(
"date"
).value||today(),

noodle:
Number(
document.getElementById(
"noodleAmount"
).value
)||0,

custom:
[
...
document.querySelectorAll(
"#customIncome .income-row"
)
].map(
r=>({

name:
r.querySelector(
".income-name"
).value,

amount:
Number(
r.querySelector(
".income-amount"
).value
)||0

})
),

qty:{
...qty
},

taken:
Number(
document.getElementById(
"taken"
).value
)||0

};


localStorage.setItem(
"dailyIncomeDraft1319",
JSON.stringify(
draft
)
);


document.getElementById(
"status"
).textContent=
"💾 已自動儲存";

}


/* 載入 */

function loadDraft(){

const d=
JSON.parse(
localStorage.getItem(
"dailyIncomeDraft1319"
)||"null"
);


if(!d)
return;


/*
日期永遠自動使用今天
*/

document.getElementById(
"date"
).value=
today();


/*
🍜 恢復手動金額
*/

document.getElementById(
"noodleAmount"
).value=
d.noodle!==undefined
?
d.noodle
:
850;


document.getElementById(
"taken"
).value=
d.taken||0;


qty={
...qty,
...(d.qty||{})
};


const box=
document.getElementById(
"customIncome"
);

box.innerHTML="";


(
d.custom||[]
).forEach(
x=>{

const r=
document.createElement(
"div"
);

r.className=
"income-row";


r.innerHTML=`

<input
class="income-name"
value="${esc(x.name)}">

<input
class="income-amount"
type="number"
min="0"
step="1"
value="${Number(x.amount)||0}">

<button
class="delete"
type="button"
onclick="this.parentElement.remove();calculate()">
×
</button>

`;


box.appendChild(r);

});


[
"lemon",
"oyster",
"intestine"
]
.forEach(
syncQty
);

}


/* 儲存今天 */

function saveRecord(){

const v=
document.getElementById(
"date"
).value||today();

const items=
getItems();

const total=
items.reduce(
(s,x)=>
s+x.amount,
0
);

const taken=
Number(
document.getElementById(
"taken"
).value
)||0;

const r={

date:v,

items,

total,

taken,

profit:
Math.max(
total-taken,
0
),

difference:
Math.max(
taken-total,
0
)

};


const i=
records.findIndex(
x=>
x.date===v
);


if(i>=0){

records[i]=r;

}else{

records.push(r);

}


records.sort(
(a,b)=>
b.date.localeCompare(
a.date
)
);


localStorage.setItem(
"dailyIncomeRecords1319",
JSON.stringify(
records
)
);


renderHistory();

calculateAccum();


document.getElementById(
"status"
).textContent=
"💾 今天紀錄已儲存";


alert(
"✅ 已儲存今天紀錄！"
);

}


/* 累加 */

function calculateAccum(){

const profit=
records.reduce(
(s,r)=>
s+(Number(r.profit)||0),
0
);

const diff=
records.reduce(
(s,r)=>
s+(Number(r.difference)||0),
0
);


/*
差額累加－盈餘累加
*/

const net=
diff-profit;


document.getElementById(
"profitAccum"
).textContent=
money(profit);


document.getElementById(
"differenceAccum"
).textContent=
money(diff);


document.getElementById(
"netAccum"
).textContent=
money(net);

}


/* 歷史紀錄 */

function renderHistory(){

const box=
document.getElementById(
"history"
);


if(
!records.length
){

box.innerHTML=
'<div style="text-align:center;color:#9b8d87;padding:20px">目前還沒有紀錄</div>';

calculateAccum();

return;

}


const w=[
"星期日",
"星期一",
"星期二",
"星期三",
"星期四",
"星期五",
"星期六"
];


box.innerHTML=
records.map(
(r,i)=>{

const d=
new Date(
r.date+"T00:00:00"
);


const items=
(r.items||[])
.map(
x=>
`${esc(x.name)} ${money(x.amount)}`
)
.join("、");


return`

<div class="history-item">

<div class="history-head">

<span>
📅 ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${w[d.getDay()]}
</span>

<span>

${
r.profit>0
?
"🟢 盈餘 "+money(r.profit)
:
"🔴 差額 "+money(r.difference)
}

</span>

</div>


<div class="detail">

💰 收入：
${money(r.total)}

　💵 已拿：
${money(r.taken)}

<br>

${items}

</div>


<div class="history-actions">

<button
type="button"
onclick="loadRecord(${i})">
✏️ 載入修改
</button>


<button
class="danger"
type="button"
onclick="deleteRecord(${i})">
🗑️ 刪除
</button>

</div>

</div>

`;

}
).join("");


calculateAccum();

}


/* 載入歷史 */

function loadRecord(i){

const r=
records[i];


document.getElementById(
"date"
).value=
r.date;


/*
🍜
*/

const noodle=
(r.items||[])
.find(
x=>
x.name==="🍜"
);


document.getElementById(
"noodleAmount"
).value=
noodle
?
noodle.amount
:
850;


/*
數量
*/

qty.lemon=
Number(
(r.items||[])
.find(
x=>x.name==="🍋"
)?.qty
)||0;


qty.oyster=
Number(
(r.items||[])
.find(
x=>x.name==="蚵仔一包"
)?.qty
)||0;


qty.intestine=
Number(
(r.items||[])
.find(
x=>x.name==="大腸一包"
)?.qty
)||0;


[
"lemon",
"oyster",
"intestine"
]
.forEach(
syncQty
);


document.getElementById(
"taken"
).value=
r.taken||0;


/*
其他收入
*/

const custom=
(r.items||[])
.filter(
x=>
x.name!=="🍜"
&&
![
"🍋",
"蚵仔一包",
"大腸一包"
].includes(
x.name
)
);


const box=
document.getElementById(
"customIncome"
);

box.innerHTML="";


custom.forEach(
x=>{

const el=
document.createElement(
"div"
);

el.className=
"income-row";


el.innerHTML=`

<input
class="income-name"
value="${esc(x.name)}">

<input
class="income-amount"
type="number"
min="0"
step="1"
value="${x.amount}">

<button
class="delete"
type="button"
onclick="this.parentElement.remove();calculate()">
×
</button>

`;


box.appendChild(el);

});


updateDate();

calculate();


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* 刪除 */

function deleteRecord(i){

if(
!confirm(
"確定要刪除這筆紀錄嗎？"
)
)
return;


records.splice(
i,
1
);


localStorage.setItem(
"dailyIncomeRecords1319",
JSON.stringify(
records
)
);


renderHistory();

}


/* 清除 */

function clearAll(){

if(
!records.length
){

alert(
"目前沒有紀錄。"
);

return;

}


if(
!confirm(
"確定清除全部歷史紀錄嗎？"
)
)
return;


records=[];


localStorage.removeItem(
"dailyIncomeRecords1319"
);


renderHistory();

}


/* 複製 */

async function copyDetail(){

const text=
buildDetail();


try{

await navigator.clipboard.writeText(
text
);

alert(
"✅ 詳細明細已複製！"
);

}catch(e){

const t=
document.createElement(
"textarea"
);

t.value=text;

document.body.appendChild(
t
);

t.select();

document.execCommand(
"copy"
);

t.remove();

alert(
"✅ 詳細明細已複製！"
);

}

}


/* LINE */

function sendLine(){

location.href=
"https://line.me/R/msg/text/?"
+
encodeURIComponent(
buildDetail()
);

}


/* 顯示差額 */

function showNet(){

const profit=
records.reduce(
(s,r)=>
s+(Number(r.profit)||0),
0
);

const diff=
records.reduce(
(s,r)=>
s+(Number(r.difference)||0),
0
);


const net=
diff-profit;


if(net>=0){

alert(
"🔴 差額累加－盈餘累加："
+
money(net)
);

}else{

alert(
"🟢 盈餘多於差額："
+
money(
Math.abs(net)
)
);

}

}


/* 初始化 */

document.getElementById(
"date"
).value=
today();


document.getElementById(
"date"
).addEventListener(
"change",
()=>{

updateDate();

calculate();

}
);


/*
🍜 這裡明確使用 input 事件
可以自由修改
*/

document.getElementById(
"noodleAmount"
).addEventListener(
"input",
function(){

calculate();

}
);


/* 已拿 */

document.getElementById(
"taken"
).addEventListener(
"input",
function(){

calculate();

}
);


/* 其他收入 */

document.addEventListener(
"input",
function(e){

if(
e.target.closest(
"#customIncome"
)
){

calculate();

}

}
);


/* 載入自動儲存 */

loadDraft();


updateDate();


calculate();


renderHistory();

</script>

</body>
</html>

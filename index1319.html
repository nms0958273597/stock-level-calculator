<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#fff7ed">
<title>每日收入盈餘記帳</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7ed;color:#3b2f2f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",Arial,sans-serif}
.container{max-width:720px;margin:0 auto;padding:14px}
h1{margin:8px 0 16px;text-align:center;font-size:28px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px rgba(80,50,20,.08)}
label{display:block;font-weight:700;font-size:17px;margin-bottom:7px}
input{width:100%;border:2px solid #eadfd5;border-radius:12px;padding:12px;font-size:19px;background:#fffdfb}
input:focus{outline:none;border-color:#e89b57}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.title{font-size:20px;font-weight:800;margin-bottom:12px}
.income-row{display:grid;grid-template-columns:1fr 120px 42px;gap:8px;margin-bottom:9px;align-items:center}
.income-row input{font-size:17px}
.qty-row{display:grid;grid-template-columns:1fr auto 42px 42px 42px auto;gap:7px;align-items:center;margin-bottom:9px;padding:9px 0}
.qty-name{font-size:17px;font-weight:800}
.qty-unit{font-size:14px;color:#8b7c75;white-space:nowrap}
.qty-btn{width:42px;height:42px;padding:0;border:0;border-radius:11px;background:#fff0d9;color:#9a5a12;font-size:25px;font-weight:900}
.qty-value{text-align:center;font-size:20px;font-weight:900}
.qty-total{text-align:right;min-width:70px;font-size:18px;font-weight:900;color:#7d5315}
@media(max-width:480px){.qty-row{grid-template-columns:1fr auto 38px 38px 38px auto;gap:5px}.qty-btn{width:38px;height:38px}.qty-name{font-size:16px}.qty-total{min-width:62px}}
.income-row .amount{text-align:right}
.delete{border:0;background:#ffe2df;color:#c43b31;border-radius:10px;font-size:20px;height:46px}
button{border:0;border-radius:12px;padding:12px 16px;font-size:17px;font-weight:800;cursor:pointer}
.add{width:100%;background:#fff0d9;color:#9a5a12;margin-top:4px}
.primary{width:100%;background:#e88c43;color:white;margin-top:10px}
.danger{background:#ffe4e1;color:#b9362c}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{padding:14px;border-radius:15px;text-align:center}
.box .small{font-size:15px;font-weight:700}
.box .num{font-size:28px;font-weight:900;margin-top:5px}
.net-button{width:100%;border:0;border-radius:15px;padding:14px 10px;text-align:center;font-family:inherit;font-weight:900;cursor:pointer;background:#e8f1ff;color:#245b9a}
.net-button .num{font-size:28px;font-weight:900;margin-top:5px}
.net-note{font-size:13px;font-weight:700;margin-top:5px}
.net-button:active{transform:scale(.99)}
.green{background:#eaf8ed;color:#19733a}
.red{background:#fff0ef;color:#c7372d}
.total{background:#fff5dc;color:#8a5a00}
.history-item{border-top:1px solid #eee2d8;padding:13px 0}
.history-item:first-child{border-top:0}
.history-head{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.detail{font-size:14px;color:#756866;margin-top:6px;line-height:1.6}
.history-actions{display:flex;gap:8px;margin-top:8px}
.history-actions button{padding:8px 12px;font-size:14px}
.empty{text-align:center;color:#9b8d87;padding:20px}
.note{font-size:13px;color:#8b7c75;line-height:1.5}
@media(max-width:480px){
.income-row{grid-template-columns:1fr 105px 40px}
h1{font-size:25px}
.row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<h1>💰 每日收入・盈餘記帳</h1>

<div class="card">

<label for="date">📅 日期</label>

<input id="date" type="date" value="">

<div id="dateText" style="font-size:20px;font-weight:900;text-align:center;margin-top:10px;padding:10px;border-radius:12px;background:#fff5dc;color:#7d5315"></div>

<div id="saveStatus" style="font-size:13px;color:#8b7c75;text-align:center;margin-top:7px">
💾 自動儲存已開啟
</div>

</div>


<div class="card">

<div class="title">💰 收入項目</div>

<div id="incomeList">

<div class="income-row fixed-income">

<input
class="income-name"
type="text"
value="🍜"
placeholder="收入名稱"
>

<input
class="income-amount amount"
type="number"
min="0"
step="1"
value="850"
placeholder="金額"
oninput="calculate()"
>

<div></div>

</div>


<div class="qty-row">

<div class="qty-name">🍋 檸檬</div>

<div class="qty-unit">1,200／個</div>

<button type="button" class="qty-btn" onclick="changeQty('lemon',-1)">−</button>

<div class="qty-value" id="lemonQty">1</div>

<button type="button" class="qty-btn" onclick="changeQty('lemon',1)">＋</button>

<div class="qty-total" id="lemonTotal">1,200</div>

</div>


<div class="qty-row">

<div class="qty-name">蚵仔一包</div>

<div class="qty-unit">150／包</div>

<button type="button" class="qty-btn" onclick="changeQty('oyster',-1)">−</button>

<div class="qty-value" id="oysterQty">1</div>

<button type="button" class="qty-btn" onclick="changeQty('oyster',1)">＋</button>

<div class="qty-total" id="oysterTotal">150</div>

</div>


<div class="qty-row">

<div class="qty-name">大腸一包</div>

<div class="qty-unit">150／包</div>

<button type="button" class="qty-btn" onclick="changeQty('intestine',-1)">−</button>

<div class="qty-value" id="intestineQty">1</div>

<button type="button" class="qty-btn" onclick="changeQty('intestine',1)">＋</button>

<div class="qty-total" id="intestineTotal">150</div>

</div>

</div>

<div class="note" style="margin:8px 0 10px">
可直接修改金額，也可以新增其他收入。
</div>

<button class="add" type="button" onclick="addIncome()">
＋ 新增收入項目
</button>

</div>


<div class="card">

<div class="summary">

<div class="box total">

<div class="small">💰 收入合計</div>

<div class="num" id="incomeTotal">
0
</div>

</div>


<div class="box">

<div class="small">💵 已拿</div>

<div class="num">

<input
id="taken"
type="number"
min="0"
step="1"
value="0"
oninput="calculate()"
>

</div>

</div>

</div>

</div>


<div class="card">

<div class="summary">

<div class="box green">

<div class="small">🟢 盈餘</div>

<div class="num" id="profit">
0
</div>

</div>


<div class="box red">

<div class="small">🔴 差額</div>

<div class="num" id="difference">
0
</div>

</div>

</div>


<button
class="primary"
type="button"
onclick="saveRecord()"
>
💾 儲存今天紀錄
</button>

</div>


<div class="card">

<div class="title">📋 詳細明細</div>

<textarea
id="detailText"
readonly
style="width:100%;min-height:220px;border:2px solid #eadfd5;border-radius:12px;padding:12px;font-size:16px;line-height:1.6;background:#fffdfb;resize:vertical"
></textarea>


<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">

<button
type="button"
class="add"
onclick="copyDetail()"
>
📋 複製明細
</button>


<button
type="button"
class="primary"
onclick="sendLine()"
>
💬 傳送 LINE
</button>

</div>

</div>


<div class="card">

<div class="title">
📈 累加統計
</div>


<div class="summary">

<div class="box green">

<div class="small">
📈 盈餘累加
</div>

<div
class="num"
id="profitAccum"
>
0
</div>

</div>


<div class="box red">

<div class="small">
📉 差額累加
</div>

<div
class="num"
id="differenceAccum"
>
0
</div>

</div>

</div>


<button
type="button"
id="netAccumBox"
class="net-button"
onclick="showNetAccum()"
style="margin-top:12px"
>

<div class="small">
🔴 差額累加－盈餘累加
</div>

<div
class="num"
id="netAccum"
>
0
</div>

<div class="net-note">
目前實際差額
</div>

</button>

</div>


<div class="card">

<div class="title">
📋 歷史紀錄
</div>

<div id="history"></div>

<div class="note">
資料會儲存在這台手機的瀏覽器中。
</div>

<button
class="danger"
type="button"
onclick="clearAll()"
style="width:100%;margin-top:12px"
>
🗑️ 清除全部紀錄
</button>

</div>

</div>


<script>

const DEFAULT_INCOME=[
{name:"🍜",amount:850},
{name:"腸一包",amount:150},
{name:"蚵仔一包",amount:150},
{name:"🍋",amount:1200}
];


let records=
JSON.parse(
localStorage.getItem(
"dailyIncomeRecords"
)||"[]"
);


function today(){

const d=new Date();

const y=d.getFullYear();

const m=
String(
d.getMonth()+1
).padStart(2,"0");

const day=
String(
d.getDate()
).padStart(2,"0");

return `${y}-${m}-${day}`;

}


function updateDateText(){

const value=
document.getElementById(
"date"
).value||today();

const d=
new Date(
value+"T00:00:00"
);

const weekdays=[
"星期日",
"星期一",
"星期二",
"星期三",
"星期四",
"星期五",
"星期六"
];

document.getElementById(
"dateText"
).textContent=
`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;

}


function setSaveStatus(
text="💾 已自動儲存"
){

const el=
document.getElementById(
"saveStatus"
);

if(el)
el.textContent=text;

}


function money(n){

return Math.round(
Number(n)||0
).toLocaleString(
"zh-TW"
);

}


function esc(s){

return String(
s??""
).replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


function renderIncome(
items=DEFAULT_INCOME
){

const list=
document.getElementById(
"incomeList"
);

list.innerHTML="";

items.forEach(
item=>{

const row=
document.createElement(
"div"
);

row.className=
"income-row";

row.innerHTML=`

<input
class="income-name"
type="text"
value="${esc(item.name)}"
placeholder="收入名稱"
>

<input
class="income-amount amount"
type="number"
min="0"
step="1"
value="${Number(item.amount)||0}"
placeholder="金額"
oninput="calculate()"
>

<button
class="delete"
type="button"
onclick="this.parentElement.remove();calculate()"
>
×
</button>

`;

list.appendChild(row);

}
);

calculate();

}


function addIncome(){

const list=
document.getElementById(
"incomeList"
);

const row=
document.createElement(
"div"
);

row.className=
"income-row";

row.innerHTML=`

<input
class="income-name"
type="text"
placeholder="其他收入"
>

<input
class="income-amount amount"
type="number"
min="0"
step="1"
value="0"
placeholder="金額"
oninput="calculate()"
>

<button
class="delete"
type="button"
onclick="this.parentElement.remove();calculate()"
>
×
</button>

`;

list.appendChild(row);

row.querySelector(
".income-name"
).focus();

}


function getCurrentItems(){

const items=
[
...document.querySelectorAll(
".income-row"
)
]
.map(
row=>({

name:
row.querySelector(
".income-name"
).value.trim(),

amount:
Number(
row.querySelector(
".income-amount"
).value
)||0

})
)
.filter(
x=>
x.name!==""||
x.amount!==0
);

return items.concat(
getControlledItems()
.filter(
x=>x.amount>0
)
);

}


function buildDetail(){

const date=
document.getElementById(
"date"
).value||today();

const d=
new Date(
date+"T00:00:00"
);

const weekdays=[
"星期日",
"星期一",
"星期二",
"星期三",
"星期四",
"星期五",
"星期六"
];

const dateText=
`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;


const items=
getCurrentItems();

const total=
items.reduce(
(sum,x)=>
sum+x.amount,
0
);

const taken=
Number(
document.getElementById(
"taken"
).value
)||0;

const profit=
Math.max(
total-taken,
0
);

const difference=
Math.max(
taken-total,
0
);


const lines=
items.map(
x=>
`${x.name} ${money(x.amount)}`
).join("\n");


return`
📅 日期：${dateText}

💰 收入明細
${lines||"無收入項目"}

💰 收入合計：${money(total)}
💵 已拿：${money(taken)}

🟢 盈餘：${money(profit)}
🔴 差額：${money(difference)}
`;

}


function updateDetail(){

document.getElementById(
"detailText"
).value=
buildDetail();

}


const quantities={
lemon:1,
oyster:1,
intestine:1
};


const unitPrices={
lemon:1200,
oyster:150,
intestine:150
};


function changeQty(
type,
delta
){

quantities[type]=
Math.max(
0,
(quantities[type]||0)+delta
);


const q=
document.getElementById(
type+"Qty"
);

const total=
document.getElementById(
type+"Total"
);

if(q)
q.textContent=
quantities[type];

if(total)
total.textContent=
money(
quantities[type]*
unitPrices[type]
);

calculate();

}


function getControlledItems(){

return[

{
name:"🍋",
amount:
quantities.lemon*
unitPrices.lemon,
qty:quantities.lemon
},

{
name:"蚵仔一包",
amount:
quantities.oyster*
unitPrices.oyster,
qty:quantities.oyster
},

{
name:"大腸一包",
amount:
quantities.intestine*
unitPrices.intestine,
qty:quantities.intestine
}

];

}


function calculate(){

const total=
getCurrentItems()
.reduce(
(sum,x)=>
sum+x.amount,
0
);


const taken=
Number(
document.getElementById(
"taken"
).value
)||0;


const profit=
Math.max(
total-taken,
0
);


const difference=
Math.max(
taken-total,
0
);


document.getElementById(
"incomeTotal"
).textContent=
money(total);


document.getElementById(
"profit"
).textContent=
money(profit);


document.getElementById(
"difference"
).textContent=
money(difference);


updateDetail();

saveDraftSoon();

}


async function copyDetail(){

const text=
buildDetail();

try{

await navigator.clipboard.writeText(
text
);

alert(
"✅ 詳細明細已複製！"
);

}catch(e){

const ta=
document.createElement(
"textarea"
);

ta.value=text;

document.body.appendChild(
ta
);

ta.select();

document.execCommand(
"copy"
);

ta.remove();

alert(
"✅ 詳細明細已複製！"
);

}

}


function sendLine(){

const text=
encodeURIComponent(
buildDetail()
);

window.location.href=
`https://line.me/R/msg/text/?${text}`;

}


function autoSaveDraft(){

const draft={

date:
document.getElementById(
"date"
).value||today(),

items:
getCurrentItems(),

taken:
Number(
document.getElementById(
"taken"
).value
)||0,

quantities:{
...quantities
}

};


localStorage.setItem(
"dailyIncomeDraft",
JSON.stringify(
draft
)
);

setSaveStatus(
"💾 已自動儲存"
);

}


function loadDraft(){

const raw=
localStorage.getItem(
"dailyIncomeDraft"
);

if(!raw)
return false;


try{

const d=
JSON.parse(raw);


if(d.date)
document.getElementById(
"date"
).value=
d.date;


if(d.quantities){

quantities.lemon=
Number(
d.quantities.lemon
)||0;

quantities.oyster=
Number(
d.quantities.oyster
)||0;

quantities.intestine=
Number(
d.quantities.intestine
)||0;

}


if(
Array.isArray(
d.items
)
){

const normal=
d.items.filter(
x=>
![
"🍋",
"蚵仔一包",
"大腸一包"
].includes(
x.name
)
);

renderIncome(
normal
);

}


document.getElementById(
"taken"
).value=
d.taken||0;


[
"lemon",
"oyster",
"intestine"
].forEach(
type=>{

const q=
document.getElementById(
type+"Qty"
);

const total=
document.getElementById(
type+"Total"
);

if(q)
q.textContent=
quantities[type];

if(total)
total.textContent=
money(
quantities[type]*
unitPrices[type]
);

}
);


updateDateText();

calculate();

return true;

}catch(e){

return false;

}

}


function saveDraftSoon(){

clearTimeout(
window.__draftTimer
);

window.__draftTimer=
setTimeout(
autoSaveDraft,
150
);

}


function saveRecord(){

const date=
document.getElementById(
"date"
).value||today();


const items=
getCurrentItems();


const total=
items.reduce(
(sum,x)=>
sum+x.amount,
0
);


const taken=
Number(
document.getElementById(
"taken"
).value
)||0;


const profit=
Math.max(
total-taken,
0
);


const difference=
Math.max(
taken-total,
0
);


const record={
date,
items,
total,
taken,
profit,
difference,
updatedAt:Date.now()
};


const index=
records.findIndex(
r=>r.date===date
);


if(index>=0)
records[index]=record;

else
records.push(record);


records.sort(
(a,b)=>
b.date.localeCompare(
a.date
)
);


localStorage.setItem(
"dailyIncomeRecords",
JSON.stringify(
records
)
);


renderHistory();

calculateAccum();

alert(
"✅ 已儲存今天紀錄！"
);

}


function calculateAccum(){

const profit=
records.reduce(
(s,r)=>
s+(Number(r.profit)||0),
0
);


const diff=
records.reduce(
(s,r)=>
s+(Number(r.difference)||0),
0
);


/* ★ 正確計算：
   差額累加 − 盈餘累加
*/

const net=
diff-profit;


document.getElementById(
"profitAccum"
).textContent=
money(profit);


document.getElementById(
"differenceAccum"
).textContent=
money(diff);


const netEl=
document.getElementById(
"netAccum"
);


const netBox=
document.getElementById(
"netAccumBox"
);


if(net>0){

netEl.textContent=
money(net);

netBox.style.background=
"#fff0ef";

netBox.style.color=
"#c7372d";

}else if(net<0){

netEl.textContent=
"盈餘 "+money(
Math.abs(net)
);

netBox.style.background=
"#eaf8ed";

netBox.style.color=
"#19733a";

}else{

netEl.textContent=
"0";

netBox.style.background=
"#f3f3f3";

netBox.style.color=
"#555";

}

}


function renderHistory(){

const box=
document.getElementById(
"history"
);


if(!records.length){

box.innerHTML=
'<div class="empty">目前還沒有紀錄</div>';

calculateAccum();

return;

}


box.innerHTML=
records.map(
(r,i)=>{

const d=
new Date(
r.date+"T00:00:00"
);

const weekdays=[
"星期日",
"星期一",
"星期二",
"星期三",
"星期四",
"星期五",
"星期六"
];

const dateText=
`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;


const itemText=
(r.items||[])
.map(
x=>
`${esc(x.name)} ${money(x.amount)}`
)
.join("、");


return`

<div class="history-item">

<div class="history-head">

<span>
📅 ${esc(dateText)}
</span>


<span>

${
r.profit>0
?
"🟢 盈餘 "+money(r.profit)
:
"🔴 差額 "+money(r.difference)
}

</span>

</div>


<div class="detail">

💰 收入：
${money(r.total)}

　｜　

💵 已拿：
${money(r.taken)}

<br>

${itemText||"無收入項目"}

</div>


<div class="history-actions">

<button
type="button"
onclick="loadRecord(${i})"
>
✏️ 載入修改
</button>


<button
type="button"
class="danger"
onclick="deleteRecord(${i})"
>
🗑️ 刪除
</button>

</div>

</div>

`;

}
).join("");


calculateAccum();

}


function loadRecord(i){

const r=
records[i];


document.getElementById(
"date"
).value=
r.date;


renderIncome(
r.items||[]
);


document.getElementById(
"taken"
).value=
r.taken||0;


calculate();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function deleteRecord(i){

if(
!confirm(
"確定要刪除這筆紀錄嗎？"
)
)
return;


records.splice(
i,
1
);


localStorage.setItem(
"dailyIncomeRecords",
JSON.stringify(
records
)
);


renderHistory();

}


function showNetAccum(){

const profit=
records.reduce(
(s,r)=>
s+(Number(r.profit)||0),
0
);


const diff=
records.reduce(
(s,r)=>
s+(Number(r.difference)||0),
0
);


/* ★ 正確：
   差額累加 − 盈餘累加
*/

const net=
diff-profit;


if(net>=0){

alert(
"🔴 目前最終差額： "+
money(net)
);

}else{

alert(
"🟢 目前盈餘： "+
money(
Math.abs(net)
)
);

}

}


function clearAll(){

if(!records.length){

alert(
"目前沒有紀錄。"
);

return;

}


if(
!confirm(
"確定要清除全部歷史紀錄嗎？此動作無法復原。"
)
)
return;


records=[];


localStorage.removeItem(
"dailyIncomeRecords"
);


renderHistory();

}


document.getElementById(
"date"
).value=
today();


document.getElementById(
"date"
).addEventListener(
"change",
()=>{

updateDateText();

calculate();

}
);


updateDateText();


if(
!loadDraft()
){

document.getElementById(
"date"
).value=
today();

updateDateText();

calculate();

}


renderHistory();

calculateAccum();

</script>

</body>
</html>

String(v||"");

async function fetchJSON(
url,
timeout=12000
){

const ac=
new AbortController();

const tm=
setTimeout(
()=>ac.abort(),
timeout
);

try{

const r=
await fetch(
url,
{
cache:"no-store",
signal:ac.signal,
headers:{
Accept:
"application/json,text/plain,*/*"
}
}
);

if(!r.ok)
throw Error(
"HTTP "+r.status
);

return await r.json()

}
finally{

clearTimeout(tm)

}

}

async function finmind(params){

const u=
new URL(FIN);

Object.entries(params)
.forEach(
([k,v])=>{

if(
v!==undefined&&
v!==null&&
v!==""
)
u.searchParams.set(k,v)

}
);

const j=
await fetchJSON(
u.toString(),
15000
);

return Array.isArray(j.data)
?
j.data
:
[]

}

async function loadUniverse(){

if(universe)
return universe;

const key=
"v7_universe_cache";

try{

const c=
JSON.parse(
localStorage.getItem(key)||"null"
);

if(
c&&
Date.now()-c.time<
86400000&&
Array.isArray(c.data)
){

universe=c.data;

return universe

}

}catch(e){}

try{

const rows=
await finmind({
dataset:"TaiwanStockInfo"
});

universe=
rows
.map(
r=>({

stock_id:
String(
r.stock_id||""
),

stock_name:
String(
r.stock_name||
r.stock_id||
""
),

industry_category:
String(
r.industry_category||
r.type||
"台股"
),

market:
String(
r.type||
""
)
.toLowerCase()==="tpex"
?
"otc"
:
"tse"

})
)
.filter(
x=>x.stock_id
);

if(universe.length){

localStorage.setItem(
key,
JSON.stringify({
time:Date.now(),
data:universe
})
)

}

}catch(e){

universe=[
...LOCAL
]

}

return universe

}

clean(raw);

);

LOCAL.find(
x=>clean(x.stock_id)===k
)||
LOCAL.find(
x=>clean(x.stock_name)===k
);

return exact;

const ak=
Object.keys(ALIAS)
.find(
x=>clean(x)===k
);

if(ak){

return LOCAL.find(
x=>x.stock_id===ALIAS[ak]
)||
{
stock_id:ALIAS[ak],
stock_name:ak,
industry_category:"台股",
market:"tse"

/^[0-9A-Za-z]+$/i.test(raw)
){

raw.toUpperCase();

const u=
await loadUniverse();

const hit=
u.find(
x=>
clean(x.stock_id)===
clean(c)
);

if(hit)
return hit

}

await loadUniverse();

const hits=
u.filter(
x=>

function sorted(a){

return[
...a
]
.sort(
(x,y)=>
String(x.date||"")
.localeCompare(
String(y.date||"")
)
)

}

function latest(a){

const x=
sorted(a);

return x.length
?
x.at(-1)
:
null

}

function closes(rows){

return sorted(rows)
.map(
x=>n(x.close)
)
.filter(
x=>x!==null
)

}

function sma(a,p){

return a.length>=p
?
a
.slice(-p)
.reduce(
(s,x)=>s+x,
0
)/p
:
null

}

function slope(a,p){

if(a.length<p)
return null;

const x=
a.slice(-p);

return x[0]
?
(x[x.length-1]-x[0])/
x[0]*100
:
null

}

function tech(
rows,
price
){

const c=
closes(rows);

const ma={};

const sl={};

const bi={};

[5,20,60,120]
.forEach(
p=>{

ma[p]=sma(c,p);

sl[p]=slope(c,p);

bi[p]=
ma[p]
?
(price-ma[p])/
ma[p]*100
:
null

}
);

const av=
[5,20,60,120]
.filter(
p=>ma[p]!==null
);

const above=
av.filter(
p=>price>ma[p]
).length;

let trend=
"資料不足";

if(av.length>=3){

const r=
above/av.length;

trend=
r>=.75
?
"強勢多頭"
:
r>=.5
?
"偏多"
:
r<=.25
?
"強勢偏空"
:
r<.5
?
"偏空"
:
"中性"

}

const base=
c.slice(
-21,
-1
);

const high=
base.length
?
Math.max(...base)
:
null;

const low=
base.length
?
Math.min(...base)
:
null;

const range=
high&&low
?
high-low
:
0;

const near=
high&&
price<=high&&
range>0
?
(high-price)/
range*100
:
null;

const consolidation=
base.length>=10&&
range>0&&
price>=low+range*.55&&
price<=high;

return{

ma,

sl,

bi,

trend,

high,

low,

breakout:
high!==null&&
price>high,

breakdown:
low!==null&&
price<low,

near,

consolidation,

longBull:
ma[20]&&
ma[60]&&
ma[120]&&
ma[20]>ma[60]&&
ma[60]>ma[120]

}

}

function valuation(
price,
per
){

const pe=
n(per?.PER);

const pbr=
n(per?.PBR);

let score=50;

let reasons=[];

if(pe!==null){

if(pe<=12){

score+=22;

reasons.push(
"PE偏低"
)

}
else if(pe<=18){

score+=10;

reasons.push(
"PE合理"
)

}
else if(pe<=25){

score-=5;

reasons.push(
"PE偏高"
)

}
else{

score-=15;

reasons.push(
"PE偏高"
)

}

}

if(pbr!==null){

if(pbr<1){

score+=18;

reasons.push(
"PBR低於1倍"
)

}
else if(pbr<1.5){

score+=8;

reasons.push(
"PBR合理"
)

}
else if(pbr>3){

score-=12;

reasons.push(
"PBR偏高"
)

}

}

score=
Math.max(
0,
Math.min(
100,
score
)
);

return{

pe,

pbr,

score,

state:
score>=70
?
"合理偏便宜"
:
score<40
?
"偏貴"
:
"合理",

cls:
score>=70
?
"greenText"
:
score<40
?
"redText"
:
"yellowText",

reasons

}

}

function levels(
price,
t
){

const support=
t.ma[20]&&
t.ma[20]<price
?
t.ma[20]
:
t.low;

const resistance=
t.high&&
t.high>price
?
t.high
:
price*1.05;

return{

breakout:t.high,

breakdown:t.low,

support,

support2:
t.ma[60]&&
t.ma[60]<price
?
t.ma[60]
:
null,

resistance,

resistance2:
t.ma[60]&&
t.ma[60]>price
?
t.ma[60]
:
price*1.1,

stop:
support
?
support*.985
:
price*.94,

tp1:resistance,

tp2:
Math.max(
resistance*1.06,
price*1.1
)

}

}

    </div>
    `
  }

</div>

`;

}

async function search(q){

const id=
++requestId;

if(timer){

clearInterval(timer);

timer=null

}

try{

status(
"🔎 正在搜尋「"+
esc(q)+
"」……",
"loading"
);

const st=
await findStock(q);

if(id!==requestId)
return;

status(
"📡 正在取得 "+
esc(st.stock_name)+
" 行情……",
"loading"
);

const[
rt,
rows
]=
await Promise.all([

getRealtime(st),

getPrices(
st.stock_id
)

]);

if(id!==requestId)
return;

if(
!rt&&
!rows.length
)
throw Error(
"目前沒有取得行情資料，請稍後再試。"
);

status(
"🏦 正在取得估值與法人資料……",
"loading"
);

const[
per,
inst
]=
await Promise.all([

getPER(
st.stock_id
),

getInstitution(
st.stock_id
)

]);

render({

st,

rt,

rows,

per,

inst

});

status(

rt
?
"✅ "+
esc(st.stock_name)+
"｜即時行情已取得"
:
"⚠️ "+
esc(st.stock_name)+
"｜無盤中即時價，歷史資料僅供分析",

"ok"

);

window.scrollTo({

top:0,

behavior:"smooth"

});

if(rt){

timer=
setInterval(
()=>
refresh(st),
10000
)

}

}catch(e){

status(
"❌ "+
esc(
e.message||
"搜尋失敗"
),
"error"
)

}

}

await getRealtime(st);

if(
rt&&
current
){

current.rt=
rt;

render(current);

status(

esc(st.stock_name)+
"｜即時更新 "+
esc(rt.time||""),
"ok"
)

}

}catch(e){}

}

async function scan(mode){

const box=
$("breakList");

box.innerHTML=
`
<div class="loading">
🔎 掃描中……
</div>
`;

const out=[];

for(
const code of CAND
){

try{

const st=
await findStock(code);

const[
rt,
rows
]=
await Promise.all([

getRealtime(st),

getPrices(code)

]);

const p=
rt?.price??
n(
latest(rows)?.close
);

if(p===null)
continue;

const t=
tech(
rows,
p
);

const inst=
mode==="law"
?
await getInstitution(code)
:
null;

let score=0;

if(t.consolidation)
score+=25;

if(
t.near!==null&&
t.near<=15
)
score+=25;

if(
t.near!==null&&
t.near<=7
)
score+=15;

if(t.breakout)
score+=25;

if(t.longBull)
score+=15;

if(t.trend.includes("多"))
score+=10;

if(inst?.total>0)
score+=15;

if(t.breakdown)
score-=30;

if(mode==="popular"){

score+=
Math.min(
25,
Math.log10(
Math.max(
1,
n(rt?.volume)||
n(latest(rows)?.volume)||
1
)
)*5
)

}

out.push({

st,

p,

t,

inst,

score

});

}catch(e){}

}

out.sort(
(a,b)=>
b.score-a.score
);

box.innerHTML=
out
.slice(0,10)
.map(
x=>{

const state=
x.t.breakout
?
"🚀突破"
:
x.t.consolidation&&
x.t.near!==null&&
x.t.near<=15
?
"🔥接近突破"
:
"⏳觀察";

const trend=
x.t.trend.includes("多")
?
"green"
:
x.t.trend.includes("空")
?
"red"
:
"yellow";

return`

<div
class="listRow"
data-code="${esc(x.st.stock_id)}"
>

  <div>

    <b>
      ${esc(x.st.stock_name)}
    </b>

    ${esc(x.st.stock_id)}

  </div>

  <div>
    ${money(x.p)}
  </div>

  <div>

    <span class="badge ${trend}">
      ${esc(x.t.trend)}
    </span>

  </div>

  <div>

    <span class="badge ${
      x.t.breakout
      ?
      "green"
      :
      "orange"
    }">

      ${state}

    </span>

  </div>

  <div>
    ${x.t.high?money(x.t.high):"—"}
  </div>

  <div>
    <b>
      ${Math.round(x.score)}
    </b>
    分
  </div>

</div>

`;

}
)
.join("")
||
`
<div class="loading">
目前沒有成功取得掃描資料。
</div>
`;

box
.querySelectorAll(
".listRow"
)
.forEach(
el=>

el.addEventListener(
"click",
()=>{

$("searchInput").value=
el.dataset.code;

search(
el.dataset.code
)

}
)
);

status(
"✅ 掃描完成｜已依盤整、接近突破、均線與趨勢排序",
"ok"
);

}

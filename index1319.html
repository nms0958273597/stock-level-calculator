from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#fff7ed">
<title>每日收入盈餘記帳</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7ed;color:#3b2f2f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",Arial,sans-serif}
.container{max-width:720px;margin:0 auto;padding:14px}
h1{margin:8px 0 16px;text-align:center;font-size:28px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px rgba(80,50,20,.08)}
label{display:block;font-weight:700;font-size:17px;margin-bottom:7px}
input{width:100%;border:2px solid #eadfd5;border-radius:12px;padding:12px;font-size:19px;background:#fffdfb}
input:focus{outline:none;border-color:#e89b57}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.title{font-size:20px;font-weight:800;margin-bottom:12px}
.income-row{display:grid;grid-template-columns:1fr 120px 42px;gap:8px;margin-bottom:9px;align-items:center}
.income-row input{font-size:17px}
.income-row .amount{text-align:right}
.delete{border:0;background:#ffe2df;color:#c43b31;border-radius:10px;font-size:20px;height:46px}
button{border:0;border-radius:12px;padding:12px 16px;font-size:17px;font-weight:800;cursor:pointer}
.add{width:100%;background:#fff0d9;color:#9a5a12;margin-top:4px}
.primary{width:100%;background:#e88c43;color:white;margin-top:10px}
.danger{background:#ffe4e1;color:#b9362c}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{padding:14px;border-radius:15px;text-align:center}
.box .small{font-size:15px;font-weight:700}
.box .num{font-size:28px;font-weight:900;margin-top:5px}
.green{background:#eaf8ed;color:#19733a}
.red{background:#fff0ef;color:#c7372d}
.total{background:#fff5dc;color:#8a5a00}
.history-item{border-top:1px solid #eee2d8;padding:13px 0}
.history-item:first-child{border-top:0}
.history-head{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.detail{font-size:14px;color:#756866;margin-top:6px;line-height:1.6}
.history-actions{display:flex;gap:8px;margin-top:8px}
.history-actions button{padding:8px 12px;font-size:14px}
.empty{text-align:center;color:#9b8d87;padding:20px}
.note{font-size:13px;color:#8b7c75;line-height:1.5}
@media(max-width:480px){
  .income-row{grid-template-columns:1fr 105px 40px}
  h1{font-size:25px}
  .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
  <h1>💰 每日收入・盈餘記帳</h1>

  <div class="card">
    <label for="date">📅 日期</label>
    <input id="date" type="date">
  </div>

  <div class="card">
    <div class="title">💰 收入項目</div>
    <div id="incomeList"></div>
    <button class="add" type="button" onclick="addIncome()">＋ 新增收入項目</button>
  </div>

  <div class="card">
    <div class="summary">
      <div class="box total">
        <div class="small">💰 收入合計</div>
        <div class="num" id="incomeTotal">0</div>
      </div>
      <div class="box">
        <div class="small">💵 已拿</div>
        <div class="num"><input id="taken" type="number" min="0" step="1" value="0" oninput="calculate()"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="summary">
      <div class="box green">
        <div class="small">🟢 盈餘</div>
        <div class="num" id="profit">0</div>
      </div>
      <div class="box red">
        <div class="small">🔴 差額</div>
        <div class="num" id="difference">0</div>
      </div>
    </div>
    <button class="primary" type="button" onclick="saveRecord()">💾 儲存今天紀錄</button>
  </div>

  <div class="card">
    <div class="title">📈 累加統計</div>
    <div class="summary">
      <div class="box green">
        <div class="small">盈餘累加</div>
        <div class="num" id="profitAccum">0</div>
      </div>
      <div class="box red">
        <div class="small">差額累加</div>
        <div class="num" id="differenceAccum">0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="title">📋 歷史紀錄</div>
    <div id="history"></div>
    <div class="note">資料會儲存在這台手機的瀏覽器中。</div>
    <button class="danger" type="button" onclick="clearAll()" style="width:100%;margin-top:12px">🗑️ 清除全部紀錄</button>
  </div>
</div>

<script>
const DEFAULT_INCOME=[
  {name:"🍜",amount:850},
  {name:"腸一包",amount:150},
  {name:"蚵仔一包",amount:150},
  {name:"🍋",amount:1200}
];

let records=JSON.parse(localStorage.getItem("dailyIncomeRecords")||"[]");

function today(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function money(n){
  return Math.round(Number(n)||0).toLocaleString("zh-TW");
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function renderIncome(items=DEFAULT_INCOME){
  const list=document.getElementById("incomeList");
  list.innerHTML="";
  items.forEach((item,i)=>{
    const row=document.createElement("div");
    row.className="income-row";
    row.innerHTML=`
      <input class="income-name" type="text" value="${esc(item.name)}" placeholder="收入名稱">
      <input class="income-amount amount" type="number" min="0" step="1" value="${Number(item.amount)||0}" placeholder="金額" oninput="calculate()">
      <button class="delete" type="button" onclick="this.parentElement.remove();calculate()">×</button>`;
    list.appendChild(row);
  });
  calculate();
}

function addIncome(){
  const list=document.getElementById("incomeList");
  const row=document.createElement("div");
  row.className="income-row";
  row.innerHTML=`
    <input class="income-name" type="text" placeholder="其他收入">
    <input class="income-amount amount" type="number" min="0" step="1" value="0" placeholder="金額" oninput="calculate()">
    <button class="delete" type="button" onclick="this.parentElement.remove();calculate()">×</button>`;
  list.appendChild(row);
  row.querySelector(".income-name").focus();
}

function getCurrentItems(){
  return [...document.querySelectorAll(".income-row")].map(row=>({
    name:row.querySelector(".income-name").value.trim(),
    amount:Number(row.querySelector(".income-amount").value)||0
  })).filter(x=>x.name!==""||x.amount!==0);
}

function calculate(){
  const total=getCurrentItems().reduce((sum,x)=>sum+x.amount,0);
  const taken=Number(document.getElementById("taken").value)||0;
  const profit=Math.max(total-taken,0);
  const difference=Math.max(taken-total,0);
  document.getElementById("incomeTotal").textContent=money(total);
  document.getElementById("profit").textContent=money(profit);
  document.getElementById("difference").textContent=money(difference);
}

function saveRecord(){
  const date=document.getElementById("date").value||today();
  const items=getCurrentItems();
  const total=items.reduce((sum,x)=>sum+x.amount,0);
  const taken=Number(document.getElementById("taken").value)||0;
  const profit=Math.max(total-taken,0);
  const difference=Math.max(taken-total,0);

  const record={date,items,total,taken,profit,difference,updatedAt:Date.now()};
  const index=records.findIndex(r=>r.date===date);

  if(index>=0) records[index]=record;
  else records.push(record);

  records.sort((a,b)=>b.date.localeCompare(a.date));
  localStorage.setItem("dailyIncomeRecords",JSON.stringify(records));
  renderHistory();
  calculateAccum();
  alert("✅ 已儲存今天紀錄！");
}

function calculateAccum(){
  const profit=records.reduce((s,r)=>s+(Number(r.profit)||0),0);
  const diff=records.reduce((s,r)=>s+(Number(r.difference)||0),0);
  document.getElementById("profitAccum").textContent=money(profit);
  document.getElementById("differenceAccum").textContent=money(diff);
}

function renderHistory(){
  const box=document.getElementById("history");
  if(!records.length){
    box.innerHTML='<div class="empty">目前還沒有紀錄</div>';
    calculateAccum();
    return;
  }
  box.innerHTML=records.map((r,i)=>{
    const itemText=(r.items||[]).map(x=>`${esc(x.name)} ${money(x.amount)}`).join("、");
    return `<div class="history-item">
      <div class="history-head">
        <span>📅 ${esc(r.date)}</span>
        <span>${r.profit>0?"🟢 盈餘 "+money(r.profit):"🔴 差額 "+money(r.difference)}</span>
      </div>
      <div class="detail">
        收入：${money(r.total)}　｜　已拿：${money(r.taken)}<br>
        ${itemText||"無收入項目"}
      </div>
      <div class="history-actions">
        <button type="button" onclick="loadRecord(${i})">✏️ 載入修改</button>
        <button type="button" class="danger" onclick="deleteRecord(${i})">刪除</button>
      </div>
    </div>`;
  }).join("");
  calculateAccum();
}

function loadRecord(i){
  const r=records[i];
  document.getElementById("date").value=r.date;
  renderIncome(r.items||[]);
  document.getElementById("taken").value=r.taken||0;
  calculate();
  window.scrollTo({top:0,behavior:"smooth"});
}

function deleteRecord(i){
  if(!confirm("確定要刪除這筆紀錄嗎？")) return;
  records.splice(i,1);
  localStorage.setItem("dailyIncomeRecords",JSON.stringify(records));
  renderHistory();
}

function clearAll(){
  if(!records.length){alert("目前沒有紀錄。");return;}
  if(!confirm("確定要清除全部歷史紀錄嗎？此動作無法復原。")) return;
  records=[];
  localStorage.removeItem("dailyIncomeRecords");
  renderHistory();
}

document.getElementById("date").value=today();
renderIncome();
renderHistory();
calculateAccum();
</script>
</body>
</html>'''
path = Path("/mnt/data/daily_income_surplus.html")
path.write_text(html, encoding="utf-8")
print(f"[下載完整 HTML](sandbox:{path})")
